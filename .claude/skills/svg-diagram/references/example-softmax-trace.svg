<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker></defs>
<rect width="780" height="440" fill="white"/>
<text x="30" y="30" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e40af">Online Softmax — 3 轮迭代状态追踪</text>
<text x="30" y="50" font-family="sans-serif" font-size="12" fill="#64748b">跟踪单个 Q token 经过 K0V0、K1V1、K2V2;初始 m=-inf, l=0, O_acc=0</text>
<rect x="120" y="96" width="202" height="28" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="221.0" y="114.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">Iter 1 (K0,V0)</text>
<rect x="330" y="96" width="202" height="28" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="431.0" y="114.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">Iter 2 (K1,V1)</text>
<rect x="540" y="96" width="202" height="28" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="641.0" y="114.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">Iter 3 (K2,V2)</text>
<text x="104" y="162.0" text-anchor="end" font-family="sans-serif" font-size="14" font-weight="bold" fill="#374151">S</text>
<text x="221.0" y="162.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >S0=[2.0,1.0,0.5,3.0]</text>
<text x="431.0" y="162.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >S1=[1.5,4.0,2.0,1.0]</text>
<text x="641.0" y="162.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >S2=[3.5,2.0,1.5,0.5]</text>
<text x="104" y="218.0" text-anchor="end" font-family="sans-serif" font-size="14" font-weight="bold" fill="#374151">m</text>
<text x="221.0" y="218.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >-inf -&gt; 3.0</text>
<text x="431.0" y="218.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >3.0 -&gt; 4.0</text>
<text x="641.0" y="218.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >4.0 -&gt; 4.0</text>
<text x="104" y="274.0" text-anchor="end" font-family="sans-serif" font-size="14" font-weight="bold" fill="#374151">corr</text>
<rect x="120" y="246" width="202" height="48" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
<text x="221.0" y="274.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#047857" font-weight="bold" >= 0(无历史)</text>
<rect x="330" y="246" width="202" height="48" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="431.0" y="266.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b91c1c" font-weight="bold" >= exp(3.0-4.0)</text>
<text x="431.0" y="282.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b91c1c" font-weight="bold" >= 0.368</text>
<rect x="540" y="246" width="202" height="48" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
<text x="641.0" y="266.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#047857" font-weight="bold" >= exp(4.0-4.0)</text>
<text x="641.0" y="282.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#047857" font-weight="bold" >= 1.0</text>
<text x="104" y="330.0" text-anchor="end" font-family="sans-serif" font-size="14" font-weight="bold" fill="#374151">l</text>
<text x="221.0" y="330.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >0 -&gt; 1.585</text>
<text x="431.0" y="322.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >1.585*0.368+sum(P1)</text>
<text x="431.0" y="338.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >= 1.850</text>
<text x="641.0" y="322.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >1.850*1.0+sum(P2)</text>
<text x="641.0" y="338.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >= ...</text>
<text x="104" y="386.0" text-anchor="end" font-family="sans-serif" font-size="14" font-weight="bold" fill="#374151">O_acc</text>
<text x="221.0" y="386.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >0 -&gt; P0@V0</text>
<text x="431.0" y="386.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >0.368*old + P1@V1</text>
<text x="641.0" y="386.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >1.0*old + P2@V2</text>
<text x="30" y="414" font-family="sans-serif" font-size="11" fill="#64748b">绿=本轮值不变(stable),红=本轮发生更新(changed)</text>
</svg>