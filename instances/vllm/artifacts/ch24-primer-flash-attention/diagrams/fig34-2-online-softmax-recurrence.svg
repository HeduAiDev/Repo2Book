<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 480">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker></defs>
<rect width="1030" height="480" fill="white"/>
<text x="30" y="30" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e40af">online-softmax 单遍递推 — x = [1, 3, 2, 5]</text>
<text x="30" y="50" font-family="sans-serif" font-size="12" fill="#64748b">每列处理一个新元素后的 (m,d);末值 m=5, d=1.2034 与三遍 safe-softmax 逐位相等</text>
<rect x="240" y="96" width="182" height="28" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="331.0" y="114.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">j=1  x=1</text>
<rect x="430" y="96" width="182" height="28" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="521.0" y="114.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">j=2  x=3</text>
<rect x="620" y="96" width="182" height="28" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="711.0" y="114.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">j=3  x=2</text>
<rect x="810" y="96" width="182" height="28" rx="3" fill="#dc2626" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="901.0" y="114.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">j=4  x=5</text>
<text x="224" y="164.0" text-anchor="end" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#374151">m: 旧→新</text>
<text x="331.0" y="164.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >-inf → 1</text>
<text x="521.0" y="164.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >1 → 3</text>
<text x="711.0" y="156.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >3 → 3</text>
<text x="711.0" y="172.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >(不变)</text>
<text x="901.0" y="156.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >3 → 5</text>
<text x="901.0" y="172.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >(跳升)</text>
<text x="224" y="224.0" text-anchor="end" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#374151">rescale=exp(m_old-m_new)</text>
<rect x="240" y="194" width="182" height="52" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
<text x="331.0" y="216.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#047857" font-weight="bold" >n/a</text>
<text x="331.0" y="232.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#047857" font-weight="bold" >(首元素)</text>
<rect x="430" y="194" width="182" height="52" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="521.0" y="224.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b91c1c" font-weight="bold" >0.1353</text>
<rect x="620" y="194" width="182" height="52" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
<text x="711.0" y="224.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#047857" font-weight="bold" >1.0</text>
<rect x="810" y="194" width="182" height="52" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="901.0" y="224.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b91c1c" font-weight="bold" >0.1353</text>
<text x="224" y="284.0" text-anchor="end" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#374151">d_before</text>
<text x="331.0" y="284.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >0</text>
<text x="521.0" y="284.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >1.0</text>
<text x="711.0" y="284.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >1.1353</text>
<text x="901.0" y="284.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >1.5032</text>
<text x="224" y="344.0" text-anchor="end" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#374151">d_new</text>
<text x="331.0" y="344.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >1.0</text>
<text x="521.0" y="344.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >1.1353</text>
<text x="711.0" y="344.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >1.5032</text>
<text x="901.0" y="344.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >1.2034</text>
<rect x="30" y="400" width="970" height="34" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="515.0" y="422" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e3a8a">末值 m=5, d=1.2034  ==  三遍 safe-softmax 参照 d_V=1.2034(逐元素差 0.0)</text>
<text x="30" y="464" font-family="sans-serif" font-size="11" fill="#64748b">绿=rescale≈1.0(max 未变),红=rescale&lt;1.0(max 跳升,旧累计被缩小)</text>
</svg>