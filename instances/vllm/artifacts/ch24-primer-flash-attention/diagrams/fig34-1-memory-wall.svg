<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 392">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#b91c1c"/></marker><marker id="b" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker></defs>
<rect width="960" height="392" fill="white"/>
<text x="40" y="26" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">GPU 内存层级与标准注意力的三趟 N×N 往返</text>
<text x="40" y="50" font-family="sans-serif" font-size="12.5" fill="#475569">标准注意力(Algorithm 0):S=QKᵀ 写回 HBM → P=softmax(S) 读回算、再写回 → O=PV 读回算——三步各摸一次 N×N</text>
<rect x="40" y="122.0" width="190" height="110" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
<text x="135.0" y="152.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">SRAM(片上书桌)</text>
<text x="135.0" y="178.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1e3a8a">19 TB/s 带宽</text>
<text x="135.0" y="198.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1e3a8a">192 KB / SM</text>
<text x="135.0" y="218.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#3b82f6">快 10×,但装不下 N×N</text>
<rect x="320" y="92" width="190" height="170" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2.5"/>
<text x="415.0" y="122" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#7f1d1d">HBM(片外仓库)</text>
<text x="415.0" y="148" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#7f1d1d">1.5-2.0 TB/s 带宽</text>
<text x="415.0" y="168" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#7f1d1d">40-80 GB</text>
<text x="415.0" y="192" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#b91c1c">存 S、P 两张 N×N 中间矩阵</text>
<text x="415.0" y="212" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#b91c1c">慢 10×,但装得下</text>
<text x="415.0" y="236" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#7f1d1d">访存 Θ(Nd+N²)</text>
<line x1="230" y1="163.0" x2="320" y2="163.0" stroke="#b91c1c" stroke-width="2" marker-end="url(#a)"/>
<line x1="320" y1="191.0" x2="230" y2="191.0" stroke="#b91c1c" stroke-width="2" marker-end="url(#a)"/>
<text x="275.0" y="155.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#b91c1c">写 S/P</text>
<text x="275.0" y="207.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#b91c1c">读 S/P/V</text>
<text x="275.0" y="181.0" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#b91c1c">×3 趟</text>
<rect x="620" y="102" width="300" height="46" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
<text x="636" y="122" font-family="sans-serif" font-size="12.5" fill="#78350f">① 算 S=QKᵀ → 写回 HBM</text>
<text x="904" y="136" text-anchor="end" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#b45309">N×N</text>
<line x1="770.0" y1="148" x2="770.0" y2="166" stroke="#64748b" stroke-width="1.5" marker-end="url(#b)"/>
<rect x="620" y="170" width="300" height="46" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
<text x="636" y="190" font-family="sans-serif" font-size="12.5" fill="#78350f">② 读回 S → 算 P=softmax(S) → 写回 HBM</text>
<text x="904" y="204" text-anchor="end" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#b45309">N×N</text>
<line x1="770.0" y1="216" x2="770.0" y2="234" stroke="#64748b" stroke-width="1.5" marker-end="url(#b)"/>
<rect x="620" y="238" width="300" height="46" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
<text x="636" y="258" font-family="sans-serif" font-size="12.5" fill="#78350f">③ 读回 P、V → 算 O=PV</text>
<text x="904" y="272" text-anchor="end" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#b45309">N×N</text>
<line x1="510" y1="177.0" x2="610" y2="177.0" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#b)"/>
<text x="40" y="372" font-family="sans-serif" font-size="12" fill="#64748b">三步各读写一次 N×N(S 写回、P 读+写、O 读回算)——访存量随 N² 增长,是注意力的内存带宽墙。</text>
</svg>