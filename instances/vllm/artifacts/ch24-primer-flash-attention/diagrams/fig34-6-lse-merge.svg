<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 362">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker><marker id="g" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#047857"/></marker></defs>
<rect width="1300" height="362" fill="white"/>
<text x="40" y="26" font-family="sans-serif" font-size="16.5" font-weight="bold" fill="#0f172a">LSE 合并(merge_attn_states 数学原型)— token 0</text>
<text x="40" y="50" font-family="sans-serif" font-size="12" fill="#475569">两段各交出 (部分输出 O, logsumexp lse);以 max(lse) 稳定化后加权合并,结果与拼接 KV 一次性注意力在浮点舍入内恒等</text>
<rect x="40" y="96" width="280" height="58" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="180.0" y="118" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#1e3a8a">前缀段(causal=False)</text>
<text x="180.0" y="138" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1e3a8a">O_pre=[0.5, 0.5], lse_pre=1.4003</text>
<rect x="40" y="214" width="280" height="58" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="180.0" y="236" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#78350f">后缀段(causal=True)</text>
<text x="180.0" y="256" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#78350f">O_suf=[2.0, 0.0], lse_suf=0.3536</text>
<rect x="510" y="126.5" width="280" height="115" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
<text x="650.0" y="148.5" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#047857">LSE 加权合并</text>
<text x="650.0" y="168.5" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#047857">M=max(lse_pre,lse_suf)=1.4003</text>
<text x="650.0" y="187.5" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#047857">w_pre≈0.7405, w_suf≈0.2595</text>
<text x="650.0" y="206.5" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#047857">合并 O=[0.8898, 0.3701]</text>
<text x="650.0" y="225.5" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#047857">合并 lse=1.7012</text>
<rect x="980" y="136.0" width="280" height="96" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
<text x="1120.0" y="158.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#1e3a8a">一次性参照</text>
<text x="1120.0" y="178.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1e3a8a">拼接 KV 一次性注意力</text>
<text x="1120.0" y="197.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1e3a8a">O=[0.8898, 0.3701]</text>
<text x="1120.0" y="216.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1e3a8a">误差≈2e-16(舍入)</text>
<line x1="320" y1="125.0" x2="510" y2="161.0" stroke="#64748b" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="320" y1="243.0" x2="510" y2="207.0" stroke="#64748b" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="790" y1="184.0" x2="980" y2="184.0" stroke="#047857" stroke-width="2.2" marker-end="url(#g)"/>
<text x="885.0" y="174.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#047857">舍入内恒等</text>
<text x="40" y="342" font-family="sans-serif" font-size="11.5" fill="#64748b">以 max_lse 稳定化后按 e^(lse-max) 求两段权重,加权合并 O——结果与不拆分的精确注意力只差 float64 舍入(~2e-16),这是 cascade attention 拆前缀/后缀而不损精度的正确性保证。</text>
</svg>