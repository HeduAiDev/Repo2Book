<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 536">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker></defs>
<rect width="830" height="536" fill="white"/>
<text x="40" y="24" font-family="sans-serif" font-size="16.5" font-weight="bold" fill="#0f172a">cascade attention — 共享前缀两段泳道汇入 LSE 合并</text>
<text x="40" y="48" font-family="sans-serif" font-size="12" fill="#475569">前缀段对全批共享前缀只算一遍(causal=False);后缀段各请求算私有 KV(causal=True);两段各带 softmax_lse,汇入 merge_attn_states</text>
<rect x="40" y="100" width="116" height="64" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="98.0" y="128.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1d4ed8">前缀段</text>
<text x="98.0" y="146.0" text-anchor="middle" font-family="monospace" font-size="11" fill="#1d4ed8">causal=False</text>
<rect x="170" y="100" width="620" height="64" rx="6" fill="white" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="5,3"/>
<text x="186" y="124" font-family="monospace" font-size="12" fill="#334155">block_table[:1]</text>
<text x="186" y="146" font-family="monospace" font-size="12" fill="#334155">return_softmax_lse=True</text>
<rect x="40" y="210" width="116" height="64" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="98.0" y="238.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#b45309">后缀段</text>
<text x="98.0" y="256.0" text-anchor="middle" font-family="monospace" font-size="11" fill="#b45309">causal=True</text>
<rect x="170" y="210" width="620" height="64" rx="6" fill="white" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5,3"/>
<text x="186" y="234" font-family="monospace" font-size="12" fill="#334155">block_table[:, num_common_kv_blocks:]</text>
<text x="186" y="256" font-family="monospace" font-size="12" fill="#334155">return_softmax_lse=True</text>
<line x1="616.4" y1="164" x2="440.0" y2="348" stroke="#64748b" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="554.4" y1="274" x2="520.0" y2="348" stroke="#64748b" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="170" y="348" width="620" height="98" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2.2"/>
<text x="480.0" y="372" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#047857">LSE 合并</text>
<text x="480.0" y="394" text-anchor="middle" font-family="monospace" font-size="12" fill="#065f46">merge_attn_states(output,</text>
<text x="480.0" y="412" text-anchor="middle" font-family="monospace" font-size="12" fill="#065f46">  prefix_output, prefix_lse,</text>
<text x="480.0" y="430" text-anchor="middle" font-family="monospace" font-size="12" fill="#065f46">  suffix_output, suffix_lse)</text>
<rect x="40" y="472" width="750" height="34" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="415.0" y="494" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#1e3a8a">合并结果与不拆分的精确注意力差在浮点舍入内(见 lse-merge trace,约 2e-16)</text>
<text x="40" y="520" font-family="sans-serif" font-size="11.5" fill="#64748b">前缀段算一次、复用给全批共享该前缀的请求;后缀段各请求私有——这是 LSE 合并(⊕ 算子)在 vLLM 推理期调用现场的落地。</text>
</svg>