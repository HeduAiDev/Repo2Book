<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 454">
<rect width="700" height="454" fill="white"/>
<text x="40" y="40" font-family="sans-serif" font-size="16.5" fill="#1e40af">8-bit per-tensor 激活量化：单一 tensor absmax 让离群通道独吞满格</text>
<text x="40" y="60" font-family="sans-serif" font-size="12" fill="#64748b">有效档位 = 256 * m_i / m（m = tensor absmax，256 = 8-bit 满格）；channel 1 是 100x 离群通道</text>
<rect x="80" y="100" width="164" height="40" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="162.0" y="124.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="white">channel</text>
<rect x="250" y="100" width="184" height="40" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="342.0" y="124.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="white">channel absmax m_i</text>
<rect x="440" y="100" width="214" height="40" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="547.0" y="124.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="white">有效档位 = 256*m_i/m</text>
<rect x="80" y="150" width="164" height="38" rx="3" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="162.0" y="173.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#b91c1c">0</text>
<rect x="250" y="150" width="184" height="38" rx="3" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="342.0" y="173.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#b91c1c">1.136</text>
<rect x="440" y="150" width="214" height="38" rx="3" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="547.0" y="173.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#b91c1c">1.78</text>
<rect x="80" y="196" width="164" height="38" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="162.0" y="219.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1d4ed8">1 (outlier, 100x)</text>
<rect x="250" y="196" width="184" height="38" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="342.0" y="219.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1d4ed8">163.4783</text>
<rect x="440" y="196" width="214" height="38" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="547.0" y="219.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1d4ed8">256.00</text>
<rect x="80" y="242" width="164" height="38" rx="3" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="162.0" y="265.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#b91c1c">2</text>
<rect x="250" y="242" width="184" height="38" rx="3" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="342.0" y="265.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#b91c1c">1.643</text>
<rect x="440" y="242" width="214" height="38" rx="3" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="547.0" y="265.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#b91c1c">2.57</text>
<rect x="80" y="288" width="164" height="38" rx="3" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="162.0" y="311.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#b91c1c">3</text>
<rect x="250" y="288" width="184" height="38" rx="3" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="342.0" y="311.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#b91c1c">1.7321</text>
<rect x="440" y="288" width="214" height="38" rx="3" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="547.0" y="311.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#b91c1c">2.71</text>
<rect x="40" y="342" width="16" height="16" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="62" y="355" font-family="sans-serif" font-size="12" fill="#334155">离群通道：独占满格 256 档</text>
<rect x="300" y="342" width="16" height="16" rx="3" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="322" y="355" font-family="sans-serif" font-size="12" fill="#334155">普通通道：塌缩到个位数档位</text>
<text x="40" y="384" font-family="sans-serif" font-size="12" fill="#334155">tensor absmax m = 163.4783（由 channel 1 决定）；full_levels = 256（8-bit 满格）。</text>
<text x="40" y="402" font-family="sans-serif" font-size="12" fill="#334155">channel 1（离群，100x）保住全部 256 档；其余三个通道最低跌到 1.78 档——不到 2 个刻度。</text>
<text x="40" y="420" font-family="sans-serif" font-size="12" fill="#334155">per-tensor 激活量化因此崩溃：per-token / per-channel 才能救回精度（详见正文）。</text>
</svg>