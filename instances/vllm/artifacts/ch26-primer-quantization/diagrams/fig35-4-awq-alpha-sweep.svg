<text x="254" y="462" font-family="sans-serif" font-size="12" fill="#334155">两端点（无缩放 / 过度缩放）</text>
<text x="50" y="492" font-family="sans-serif" font-size="12" fill="#334155">reduction = 30.87%（相对 alpha=0 基线 0.2118 降到最优 0.1464）。</text>
<text x="50" y="510" font-family="sans-serif" font-size="12" fill="#334155">RoundErr 实测均值 0.2501，约等于理论上的 0.25 格。</text>
