<text x="50" y="68" font-family="sans-serif" font-size="12" fill="#64748b">s = s_X^alpha；alpha=0 不保护显著权重，alpha=1 过度缩放撑大非显著通道格距</text>
<line x1="90" y1="110" x2="90" y2="410" stroke="#94a3b8" stroke-width="1.5"/>
