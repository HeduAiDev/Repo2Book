<text x="40" y="450" font-family="sans-serif" font-size="12" fill="#334155">灰=RTN 基线（无缓解），绿=对应缓解方法（严格更低）。数字来自同一 50x 激活离群层的往返误差实测。</text>
<text x="40" y="468" font-family="sans-serif" font-size="12" fill="#334155">W4 制式整体误差量级约为 W8A8 的 4-8 倍——压缩率越高（4-bit vs 8-bit），越依赖误差控制手段。</text>
<text x="40" y="486" font-family="sans-serif" font-size="12" fill="#334155">vllm 推理期只消费离线量化好的定点权重/scale，本图三种方法均在离线校准阶段完成。</text>
</svg>