<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 654 578">
<defs><linearGradient id="gradX" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bbf7d0"/><stop offset="1" stop-color="#15803d"/></linearGradient><linearGradient id="gradW" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fde3b8"/><stop offset="1" stop-color="#c2820f"/></linearGradient></defs>
<rect width="654" height="578" fill="white"/>
<text x="40" y="24" font-family="sans-serif" font-size="15.5" fill="#1e40af">量化粒度定义：per-tensor 共用一把尺子，per-token / per-channel 各自一把尺子</text>
<text x="40" y="42" font-family="sans-serif" font-size="11.5" fill="#64748b">重绘自 arXiv:2211.10438 Figure 3</text>
<rect x="74" y="154" width="130" height="86" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.3"/>
<text x="139.0" y="146" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#0f172a">C_i</text>
<text x="64" y="201.0" text-anchor="end" font-family="sans-serif" font-size="11" fill="#0f172a">T</text>
<text x="139.0" y="202.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#166534">X</text>
<rect x="48" y="128" width="14" height="14" fill="#16a34a" stroke="#0f172a" stroke-width="0.8"/>
<text x="66" y="139" font-family="sans-serif" font-size="10" fill="#334155">&#916;_X^[1]</text>
<rect x="40" y="120" width="172" height="128" fill="none" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="5,3"/>
<text x="40" y="114" font-family="sans-serif" font-size="10.5" fill="#dc2626">per-tensor quant.</text>
<text x="226" y="202.0" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#0f172a">*</text>
<rect x="314" y="154" width="130" height="86" fill="#fde3b8" stroke="#c2820f" stroke-width="1.3"/>
<text x="379.0" y="146" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#0f172a">C_o</text>
<text x="304" y="201.0" text-anchor="end" font-family="sans-serif" font-size="11" fill="#0f172a">C_i</text>
<text x="379.0" y="202.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#92400e">W</text>
<rect x="288" y="128" width="14" height="14" fill="#c2820f" stroke="#0f172a" stroke-width="0.8"/>
<text x="306" y="139" font-family="sans-serif" font-size="10" fill="#334155">&#916;_W^[1]</text>
<rect x="280" y="120" width="172" height="128" fill="none" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="5,3"/>
<text x="280" y="114" font-family="sans-serif" font-size="10.5" fill="#dc2626">per-tensor quant.</text>
<text x="40" y="312" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">(a) per-tensor <tspan font-weight="normal">量</tspan>化：全矩阵共用一个标<tspan font-weight="normal">量</tspan> scale</text>
<rect x="74" y="372" width="130" height="86" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.3"/>
<text x="139.0" y="364" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#0f172a">C_i</text>
<text x="139.0" y="420.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#166534">X</text>
<rect x="56" y="372" width="14" height="86" fill="url(#gradX)" stroke="#0f172a" stroke-width="0.8"/>
<text x="50" y="419.0" text-anchor="end" font-family="sans-serif" font-size="10.5" fill="#0f172a">T</text>
<rect x="50" y="366" width="26" height="98" fill="none" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="5,3"/>
<text x="30" y="484" font-family="sans-serif" font-size="10.5" fill="#dc2626">per-token quant.</text>
<text x="30" y="356" font-family="sans-serif" font-size="9.5" fill="#334155">&#916;_X^[T&#215;1]</text>
<text x="226" y="420.0" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#0f172a">*</text>
<rect x="314" y="372" width="130" height="86" fill="#fde3b8" stroke="#c2820f" stroke-width="1.3"/>
<text x="304" y="419.0" text-anchor="end" font-family="sans-serif" font-size="11" fill="#0f172a">C_i</text>
<text x="379.0" y="420.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#92400e">W</text>
<rect x="314" y="354" width="130" height="14" fill="url(#gradW)" stroke="#0f172a" stroke-width="0.8"/>
<rect x="308" y="348" width="142" height="26" fill="none" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="5,3"/>
<text x="314" y="340" font-family="sans-serif" font-size="10.5" fill="#dc2626">per-channel quant.</text>
<text x="454" y="411.0" font-family="sans-serif" font-size="9.5" fill="#334155">&#916;_W^[1&#215;C_o]</text>
<text x="454" y="424.0" font-family="sans-serif" font-size="9.5" fill="#334155">（C_o 逐通道各一把尺）</text>
<text x="40" y="504" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">(b) per-token + per-channel：X 逐 token（T）、W 逐输出通道（C_o）各配一把尺子</text>
<text x="40" y="534" font-family="sans-serif" font-size="11.5" fill="#64748b">输入通道维 C_i 是矩阵乘法的收缩维，两种粒度都不能沿它拆——</text>
<text x="40" y="552" font-family="sans-serif" font-size="11.5" fill="#64748b">只有 T（token）和 C_o（输出通道）这两个「外维」能各自配一把尺子。</text>
</svg>