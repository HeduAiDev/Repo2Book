<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 446">
<rect width="780" height="446" fill="white"/>
<text x="40" y="40" font-family="sans-serif" font-size="16.5" fill="#1e40af">e8m0 块 scale：连续 amax/448 必须向上取整到最近的 2 的幂</text>
<text x="40" y="60" font-family="sans-serif" font-size="11.5" fill="#64748b">scale_raw = absmax / FP8_MAX(448.0)；k = ceil(log2(scale_raw))；scale = 2^k（e8m0：8 位指数，0 位尾数）</text>
<rect x="80" y="118" width="84" height="50" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="122.0" y="147.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white">absmax</text>
<rect x="170" y="118" width="184" height="50" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="262.0" y="147.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white">scale_raw = absmax/448</text>
<rect x="360" y="118" width="124" height="50" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="422.0" y="147.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white">k = ceil(log2)</text>
<rect x="490" y="118" width="114" height="50" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="547.0" y="147.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white">scale = 2^k</text>
<rect x="610" y="118" width="124" height="50" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="672.0" y="147.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white">overshoot %</text>
<rect x="80" y="177" width="84" height="36" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="122.0" y="199.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1e293b">7.0</text>
<rect x="170" y="177" width="184" height="36" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="262.0" y="199.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1e293b">0.015625</text>
<rect x="360" y="177" width="124" height="36" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="422.0" y="199.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1e293b">-6</text>
<rect x="490" y="177" width="114" height="36" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="547.0" y="199.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1e293b">0.015625</text>
<rect x="610" y="177" width="124" height="36" rx="3" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
<text x="672.0" y="199.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#047857">0.00</text>
<rect x="80" y="219" width="84" height="36" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="122.0" y="241.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1e293b">100.0</text>
<rect x="170" y="219" width="184" height="36" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="262.0" y="241.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1e293b">0.223214</text>
<rect x="360" y="219" width="124" height="36" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="422.0" y="241.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1e293b">-2</text>
<rect x="490" y="219" width="114" height="36" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="547.0" y="241.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1e293b">0.25</text>
<rect x="610" y="219" width="124" height="36" rx="3" fill="#fef9c3" stroke="#b45309" stroke-width="2"/>
<text x="672.0" y="241.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#b45309">12.00</text>
<rect x="80" y="261" width="84" height="36" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="122.0" y="283.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1e293b">300.0</text>
<rect x="170" y="261" width="184" height="36" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="262.0" y="283.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1e293b">0.669643</text>
<rect x="360" y="261" width="124" height="36" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="422.0" y="283.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1e293b">0</text>
<rect x="490" y="261" width="114" height="36" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="547.0" y="283.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1e293b">1.0</text>
<rect x="610" y="261" width="124" height="36" rx="3" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
<text x="672.0" y="283.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#c2410c">49.33</text>
<rect x="80" y="303" width="84" height="36" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="122.0" y="325.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1e293b">1000.0</text>
<rect x="170" y="303" width="184" height="36" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="262.0" y="325.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1e293b">2.232143</text>
<rect x="360" y="303" width="124" height="36" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
