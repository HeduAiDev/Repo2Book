<rect x="490" y="303" width="114" height="36" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="547.0" y="325.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1e293b">4.0</text>
<rect x="610" y="303" width="124" height="36" rx="3" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="672.0" y="325.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#b91c1c">79.20</text>
<text x="40" y="366" font-family="sans-serif" font-size="12" fill="#334155">absmax=7.0 恰好是 2 的幂，overshoot=0%；absmax 越偏离 2 的幂次，取整浪费的余量越大（最高到 79.20%）。</text>
<text x="40" y="384" font-family="sans-serif" font-size="12" fill="#334155">ceil（向上取整）是硬件必须的方向：FP8 格永远不会因为 scale 偏小而裁掉块内最大值。</text>
<text x="40" y="402" font-family="sans-serif" font-size="12" fill="#334155">OCP Microscaling(MX) FP8 的硬件约定在 vllm 的落地；DeepSeek 系 128x128 块量化用的正是这套 e8m0 scale。</text>
</svg>