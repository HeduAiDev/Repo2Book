<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 680">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker></defs>
<rect width="1040" height="680" fill="white"/>
<text x="40" y="40" font-family="sans-serif" font-size="16" fill="#1e40af">GPTQ 二阶补偿：量化第 j 列的误差立刻摊到第 j+1..3 列，整行重构误差降 77%</text>
<text x="40" y="60" font-family="sans-serif" font-size="12" fill="#64748b">W_row = [0.1, 0.95, -0.4, 0.55]，3-bit 网格，逐列从左到右量化</text>
<text x="40" y="100" font-family="sans-serif" font-size="13.5" fill="#0f172a">RTN（各列独立就近取整，无补偿）</text>
<rect x="40" y="124" width="280" height="52" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
<text x="180.0" y="154" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">W_row = [0.1, 0.95, -0.4, 0.55]</text>
<line x1="180.0" y1="176" x2="180.0" y2="194" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="40" y="194" width="280" height="52" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
<text x="180.0" y="224" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">逐列各自取整，互不影响</text>
<line x1="180.0" y1="246" x2="180.0" y2="264" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="40" y="264" width="280" height="52" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="180.0" y="294" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b91c1c">reconstruction error = 0.0253</text>
<text x="380" y="100" font-family="sans-serif" font-size="13.5" fill="#0f172a">GPTQ（逐列量化 + 即时补偿到未量化列）</text>
<rect x="380" y="124" width="620" height="92" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="396" y="144" font-family="sans-serif" font-size="12.5" fill="#0f172a">col 0: w=0.1 -&gt; q=0.1929  (err_scaled=-0.0267)</text>
<text x="396" y="166" font-family="sans-serif" font-size="11.5" fill="#475569">剩余列补偿前: [0.95, -0.4, 0.55]</text>
<text x="396" y="186" font-family="sans-serif" font-size="11.5" fill="#b91c1c">补偿后 -&gt; [0.9172, -0.3525, 0.4069]</text>
<line x1="690.0" y1="216" x2="690.0" y2="228" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="380" y="230" width="620" height="92" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="396" y="250" font-family="sans-serif" font-size="12.5" fill="#0f172a">col 1: w=0.9172 -&gt; q=0.9643  (err_scaled=-0.0553)</text>
<text x="396" y="272" font-family="sans-serif" font-size="11.5" fill="#475569">剩余列补偿前: [-0.3525, 0.4069]</text>
<text x="396" y="292" font-family="sans-serif" font-size="11.5" fill="#b91c1c">补偿后 -&gt; [-0.3619, 0.3703]</text>
<line x1="690.0" y1="322" x2="690.0" y2="334" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="380" y="336" width="620" height="92" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="396" y="356" font-family="sans-serif" font-size="12.5" fill="#0f172a">col 2: w=-0.3619 -&gt; q=-0.3857  (err_scaled=0.0250)</text>
<text x="396" y="378" font-family="sans-serif" font-size="11.5" fill="#475569">剩余列补偿前: [0.3703]</text>
<text x="396" y="398" font-family="sans-serif" font-size="11.5" fill="#b91c1c">补偿后 -&gt; [0.3945]</text>
<line x1="690.0" y1="428" x2="690.0" y2="440" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="380" y="442" width="620" height="92" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="396" y="462" font-family="sans-serif" font-size="12.5" fill="#0f172a">col 3: w=0.3945 -&gt; q=0.3857  (err_scaled=0.0094)</text>
<text x="396" y="484" font-family="sans-serif" font-size="11.5" fill="#475569">剩余列补偿前: (块末，无剩余列)</text>
<text x="396" y="504" font-family="sans-serif" font-size="11.5" fill="#475569"></text>
<rect x="380" y="552" width="620" height="40" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
<text x="690.0" y="578" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#047857">reconstruction error = 0.0057（比 RTN 的 0.0253 降 77.33%）</text>
<text x="40" y="618" font-family="sans-serif" font-size="12" fill="#334155">col 0 的误差 err_scaled = -0.0267 让 col 1-3 从 [0.95, -0.4, 0.55] 偏移到 [0.9172, -0.3525, 0.4069]；</text>
<text x="40" y="636" font-family="sans-serif" font-size="12" fill="#334155">此后每一列都带着历史补偿量进入量化，直到整行量化完毕。</text>
<text x="40" y="654" font-family="sans-serif" font-size="12" fill="#334155">lazy-batch blocksize = 1 / 2 / 4 结果完全相同（均为 0.0057）——分块只是效率重排，不是另一套算法。</text>
</svg>