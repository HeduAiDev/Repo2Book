<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1004 522">
<defs><marker id="r" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#dc2626"/></marker></defs>
<rect width="1004" height="522" fill="white"/>
<text x="40" y="46" font-family="sans-serif" font-size="19" font-weight="bold" fill="#0f172a">量化第 0 列的一份误差，沿逆 Hessian 第 0 列方向一次性扇出</text>
<text x="40" y="72" font-family="sans-serif" font-size="13" fill="#64748b">误差没被消灭，只是被搬到输出最不敏感的方向上——右侧未量化列整体挪一小步。</text>
<text x="40" y="120" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#dc2626">一份误差 e₀ = -0.0267 从 col 0 沿 (H⁻¹)_&#123;:,0&#125; 方向扇向右侧三列 ↘</text>
<path d="M 154.0 250 Q 275.0 132 396.0 250" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#r)"/>
<path d="M 154.0 250 Q 396.0 132 638.0 250" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#r)"/>
<path d="M 154.0 250 Q 517.0 132 880.0 250" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#r)"/>
<rect x="70" y="250" width="168" height="76" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
<text x="154.0" y="274" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#b91c1c">col 0（刚量化）</text>
<text x="154.0" y="296" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0f172a">0.1 → 格线 0.1929</text>
<text x="154.0" y="316" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b91c1c">缩放误差 e₀ = -0.0267</text>
<rect x="312" y="250" width="168" height="76" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="396.0" y="278" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#1e40af">col 1（未量化）</text>
<text x="396.0" y="304" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#0f172a">0.95 → 0.9172</text>
<text x="396.0" y="374" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#475569">[Ĥ⁻¹]_11 = 0.8521</text>
<rect x="554" y="250" width="168" height="76" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="638.0" y="278" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#1e40af">col 2（未量化）</text>
<text x="638.0" y="304" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#0f172a">-0.4 → -0.3525</text>
<text x="638.0" y="374" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#475569">[Ĥ⁻¹]_22 = 0.9526</text>
<rect x="796" y="250" width="168" height="76" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="880.0" y="278" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#1e40af">col 3（未量化）</text>
<text x="880.0" y="304" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#0f172a">0.55 → 0.4069</text>
<text x="880.0" y="374" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#475569">[Ĥ⁻¹]_33 = 0.9361</text>
<text x="154.0" y="374" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#475569">[Ĥ⁻¹]_00 = 3.4803</text>
<text x="40" y="352" font-family="sans-serif" font-size="12" fill="#475569">补偿前 → 补偿后：</text>
<rect x="40" y="414" width="924" height="52" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5 3"/>
<text x="56" y="436" font-family="sans-serif" font-size="13" fill="#334155">扇出方向与幅度由补偿公式给定：δ_F = -(w_q - quant(w_q)) / [H_F⁻¹]_qq · (H_F⁻¹)_&#123;:,q&#125;</text>
<text x="56" y="456" font-family="sans-serif" font-size="11.5" fill="#64748b">（arXiv:2210.17323 §3 Eq.2；q=0 时即沿逆 Hessian 第 0 列 (H⁻¹)_&#123;:,0&#125;）</text>
<text x="40" y="500" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#0f172a">一列被推歪，误差沿 (H⁻¹)_&#123;:,0&#125; 摊向右侧三列——量化被搬到最不痛的方向，而非被消灭。</text>
</svg>