<text x="40" y="412" font-family="sans-serif" font-size="12" fill="#334155">code 列的 0 与 15（粗边框）= 权重两端点恰好落在格子边缘，16 格全部用满，一格不浪费。</text>
<text x="40" y="430" font-family="sans-serif" font-size="12" fill="#334155">最大误差 |w-ŵ| = 0.08（红），未超过半格 half_scale = scale/2 = 0.10（0.08/0.1 = 80%）。</text>
<text x="40" y="448" font-family="sans-serif" font-size="12" fill="#334155">对照同一向量的对称量化：scale = 0.2857，最大误差 0.1429（= 其半格上界）——比非对称大 79%。</text>
