<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 858">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#94a3b8"/></marker><marker id="r" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#dc2626"/></marker></defs>
<rect width="1460" height="858" fill="white"/>
<text x="730.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="16.5" font-weight="bold" fill="#0f172a">两条流的泳道:拷贝与计算重叠,两次 wait_stream 方向相反</text>
<text x="730.0" y="52" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">掩码计算本身早在 execute_model 非阻塞发车之后就在 CPU 侧完成,不占这条时间线</text>
<rect x="90.0" y="72" width="300" height="40" rx="6" fill="#0891b2" opacity="0.15" stroke="#0891b2" stroke-width="1.5"/>
<text x="240.0" y="98" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0891b2">copy_stream</text>
<line x1="240.0" y1="112" x2="240.0" y2="818" stroke="#0891b2" stroke-width="1.2" stroke-dasharray="4,4" opacity="0.5"/>
<rect x="650.0" y="72" width="300" height="40" rx="6" fill="#16a34a" opacity="0.15" stroke="#16a34a" stroke-width="1.5"/>
<text x="800.0" y="98" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#16a34a">current_stream(计算)</text>
<line x1="800.0" y1="112" x2="800.0" y2="818" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="4,4" opacity="0.5"/>
<rect x="30.0" y="130" width="420" height="74" rx="8" fill="white" stroke="#0891b2" stroke-width="2"/>
<text x="240.0" y="143" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">异步 H2D ①:掩码本体</text>
<text x="240.0" y="159" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="normal" fill="#64748b">4 行 x 3 列 int32(本例)</text>
<text x="240.0" y="175" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="normal" fill="#64748b">真实规模 4752 列 = 18.5625 KiB/行</text>
<text x="240.0" y="191" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="normal" fill="#64748b">vllm/v1/worker/gpu/structured_outputs.py:L34-37</text>
<text x="40" y="171.0" font-family="sans-serif" font-size="11" fill="#94a3b8">t1</text>
<rect x="30.0" y="238" width="420" height="74" rx="8" fill="white" stroke="#0891b2" stroke-width="2"/>
<text x="240.0" y="259" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">异步 H2D ②:行映射张量</text>
<text x="240.0" y="275" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="normal" fill="#64748b">长度 = num_masks = 4(映射构造在 L39-48)</text>
<text x="240.0" y="291" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="normal" fill="#64748b">structured_outputs.py:L51-57</text>
<text x="40" y="279.0" font-family="sans-serif" font-size="11" fill="#94a3b8">t2</text>
<rect x="590.0" y="346" width="420" height="74" rx="8" fill="white" stroke="#16a34a" stroke-width="2"/>
<text x="800.0" y="367" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">current_stream.wait_stream(copy_stream)</text>
<text x="800.0" y="383" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="normal" fill="#64748b">等两次 H2D 都落地才启动 kernel</text>
<text x="800.0" y="399" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="normal" fill="#64748b">structured_outputs.py:L59-61</text>
<text x="40" y="387.0" font-family="sans-serif" font-size="11" fill="#94a3b8">t3</text>
<rect x="590.0" y="454" width="420" height="74" rx="8" fill="white" stroke="#16a34a" stroke-width="2"/>
<text x="800.0" y="475" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">_apply_grammar_bitmask_kernel</text>
<text x="800.0" y="491" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="normal" fill="#64748b">读预分配缓冲</text>
<text x="800.0" y="507" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="normal" fill="#64748b">[max_num_logits, ceil(V/32)]</text>
<text x="40" y="495.0" font-family="sans-serif" font-size="11" fill="#94a3b8">t4</text>
<rect x="30.0" y="562" width="420" height="74" rx="8" fill="white" stroke="#0891b2" stroke-width="2"/>
<text x="240.0" y="583" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">copy_stream.wait_stream(current_stream)</text>
<text x="240.0" y="599" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="normal" fill="#64748b">等 kernel 读完这块缓冲才允许下一步覆写</text>
<text x="240.0" y="615" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="normal" fill="#64748b">structured_outputs.py:L78-80</text>
<text x="40" y="603.0" font-family="sans-serif" font-size="11" fill="#94a3b8">t5</text>
<rect x="30.0" y="670" width="420" height="74" rx="8" fill="white" stroke="#0891b2" stroke-width="2"/>
<text x="240.0" y="699" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">下一步:覆写前 num_masks 行</text>
<text x="240.0" y="715" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="normal" fill="#64748b">缓冲跨步复用,不新分配</text>
<text x="40" y="711.0" font-family="sans-serif" font-size="11" fill="#94a3b8">t6</text>
