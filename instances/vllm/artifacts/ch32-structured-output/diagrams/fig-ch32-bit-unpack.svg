<text x="273.0" y="248" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#7f1d1d">0</text>
<text x="273.0" y="264" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#64748b">bit3</text>
