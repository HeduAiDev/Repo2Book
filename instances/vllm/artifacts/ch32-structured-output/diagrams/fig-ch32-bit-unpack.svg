<text x="460" y="255.0" font-family="sans-serif" font-size="11.5" fill="#64748b">… 高 24 位省略(该行其余 token 全非法)</text>
<rect x="50" y="296" width="18" height="18" rx="3" fill="#bbf7d0" stroke="#16a34a"/>
<text x="76" y="310" font-family="sans-serif" font-size="11.5" fill="#334155">bit==1:合法(不写,logit 原样)</text>
<rect x="330" y="296" width="18" height="18" rx="3" fill="#fecaca" stroke="#dc2626"/>
<text x="356" y="310" font-family="sans-serif" font-size="11.5" fill="#334155">bit==0:非法(tl.store 写 -inf)</text>
<rect x="50" y="346" width="1200" height="76" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
<text x="650.0" y="372" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#166534">真机 Triton kernel 实测:解出 bit5、bit7,logits 行 1 跑完后只剩 token 5、7 有限</text>
<text x="650.0" y="394" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#166534">其余 94 个 token 均为 -inf(isneginf 逐元素核实为真)</text>
<text x="650.0" y="414" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">真实规模:BLOCK_SIZE=8192,|V|=152064 时 grid 第二维=19,batch=256 无投机则 grid=(256,19)=4864 个 program(按源码常量推算)</text>
