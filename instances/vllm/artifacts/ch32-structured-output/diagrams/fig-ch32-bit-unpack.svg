<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 460">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker></defs>
<rect width="1300" height="460" fill="white"/>
<text x="650.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">_apply_grammar_bitmask_kernel:打孔卡抖开成位矩阵,没打孔的位置盖 -inf</text>
<rect x="320.0" y="40" width="660" height="24" rx="12" fill="#fef3c7" stroke="#b45309"/>
<text x="650.0" y="57" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#92400e">V2(opt-in)路径的 kernel;默认部署走 xgrammar 库函数,见下一张图</text>
<rect x="50" y="100" width="210" height="60" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="155.0" y="118" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#312e81">打包 int32[256]</text>
<text x="155.0" y="133" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="normal" fill="#4338ca">每 program 载入</text>
<text x="155.0" y="148" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="normal" fill="#4338ca">8192//32=256 个字</text>
<line x1="260" y1="130.0" x2="300" y2="130.0" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<rect x="306" y="100" width="210" height="60" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="411.0" y="118" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#312e81">广播右移</text>
<text x="411.0" y="133" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="normal" fill="#4338ca">(packed&gt;&gt;arange(32))&amp;1</text>
<text x="411.0" y="148" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="normal" fill="#4338ca">[256,1]&gt;&gt;[1,32]</text>
<line x1="516" y1="130.0" x2="556" y2="130.0" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<rect x="562" y="100" width="210" height="60" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="667.0" y="118" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#312e81">位矩阵 [256,32]</text>
<text x="667.0" y="133" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="normal" fill="#4338ca">reshape</text>
<text x="667.0" y="148" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="normal" fill="#4338ca">-&gt; 展平 8192 个布尔量</text>
<line x1="772" y1="130.0" x2="812" y2="130.0" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<rect x="818" y="100" width="210" height="60" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="923.0" y="118" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#312e81">谓词 store(-inf)</text>
<text x="923.0" y="133" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="normal" fill="#4338ca">mask=bit==0 &amp;</text>
<text x="923.0" y="148" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="normal" fill="#4338ca">block_offset&lt;vocab_size</text>
<text x="50" y="214" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e293b">放大看掩码行 1 的第 0 个 int32:packed = 160 = 0b10100000</text>
