<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker><marker id="b" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#dc2626"/></marker></defs>
<rect width="1200" height="620" fill="white"/>
<text x="600.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">掩码行归属由 req_id 决定,不由行号决定</text>
<text x="50" y="70" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#1e293b">① 预分配缓冲:max_num_seqs x (1 + num_spec) = 4 x 1 = 4 行上界,本步裁到 2 行</text>
<rect x="50" y="96" width="110" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="105.0" y="118" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">缓冲行 0</text>
<text x="105.0" y="138" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1d4ed8">rA</text>
<rect x="170" y="96" width="110" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="225.0" y="118" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">缓冲行 1</text>
<text x="225.0" y="138" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1d4ed8">rD</text>
<rect x="290" y="96" width="110" height="56" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
<text x="345.0" y="118" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">缓冲行 2</text>
<text x="345.0" y="138" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#94a3b8">(未用)</text>
<rect x="410" y="96" width="110" height="56" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
<text x="465.0" y="118" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">缓冲行 3</text>
<text x="465.0" y="138" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#94a3b8">(未用)</text>
<text x="290" y="174" font-family="sans-serif" font-size="11.5" fill="#64748b">裁到 cumulative_index=2 后返回,后 2 行不进 GrammarOutput</text>
<text x="50" y="222" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#1e293b">② 两侧顺序刻意不同,靠随行同传的 req_id 列表(而非行号)对号入座</text>
<text x="105.0" y="242" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155">掩码行(调度序)</text>
<text x="1095.0" y="242" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155">logits 行(batch 顺序)</text>
<rect x="50" y="252" width="110" height="56" rx="8" fill="white" stroke="#2563eb" stroke-width="2.5"/>
<text x="105.0" y="274" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">掩码行 0</text>
<text x="105.0" y="294" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2563eb">rA</text>
<rect x="50" y="310" width="110" height="56" rx="8" fill="white" stroke="#059669" stroke-width="2.5"/>
<text x="105.0" y="332" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">掩码行 1</text>
<text x="105.0" y="352" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#059669">rD</text>
<rect x="1040" y="252" width="110" height="56" rx="8" fill="white" stroke="#059669" stroke-width="2.5"/>
<text x="1095.0" y="274" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">logits 行 0</text>
<text x="1095.0" y="294" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#059669">rD</text>
<rect x="1040" y="310" width="110" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="1095.0" y="332" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">logits 行 1</text>
<text x="1095.0" y="352" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#94a3b8">rB</text>
<rect x="1040" y="368" width="110" height="56" rx="8" fill="white" stroke="#2563eb" stroke-width="2.5"/>
<text x="1095.0" y="390" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">logits 行 2</text>
<text x="1095.0" y="410" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2563eb">rA</text>
<rect x="1040" y="426" width="110" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="1095.0" y="448" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">logits 行 3</text>
<text x="1095.0" y="468" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#94a3b8">rC</text>
<path d="M 160 280.0 C 250 280.0, 950 396.0, 1040 396.0" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="554.0" y="327.0" width="92" height="22" rx="5" fill="white" stroke="#2563eb" stroke-width="1"/>
<text x="600.0" y="342.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#2563eb">req_id=rA</text>
<path d="M 160 338.0 C 250 338.0, 950 280.0, 1040 280.0" fill="none" stroke="#059669" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="554.0" y="298.0" width="92" height="22" rx="5" fill="white" stroke="#059669" stroke-width="1"/>
<text x="600.0" y="313.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#059669">req_id=rD</text>
<rect x="50" y="490" width="1100" height="46" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-dasharray="5 3"/>
<text x="600.0" y="510" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#7f1d1d">若按行号硬对齐(掩码行 0 -&gt; logits 行 0),rA 的许可会错发给 rD——不报错,静默生成错的 JSON</text>
<text x="600.0" y="528" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#7f1d1d">真实映射:掩码行 0(rA) -&gt; logits 行 2;掩码行 1(rD) -&gt; logits 行 0</text>
<rect x="50" y="560" width="1100" height="40" rx="8" fill="#eef2ff" stroke="#6366f1"/>
<text x="600.0" y="585" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#3730a3">列数 = ceil(|V|/32):本例 |V|=96 -&gt; 3 个 int32;真实 |V|=152064 时为 4752 列 = 18.5625 KiB/行</text>
</svg>