<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1210 348">
<rect width="1210" height="348" fill="white"/>
<text x="30" y="26" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e40af">校准曲线：草稿头置信度 ≈ 实测接受率</text>
<text x="30" y="48" font-family="sans-serif" font-size="12" fill="#64748b">4000 个 (置信度, 是否接受) 样本按置信度分 5 桶；每桶两行几乎相等 → 良好校准</text>
<rect x="230" y="100" width="182" height="40" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="321.0" y="116.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">桶 1</text>
<text x="321.0" y="132.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">(~0.1)</text>
<rect x="420" y="100" width="182" height="40" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="511.0" y="116.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">桶 2</text>
<text x="511.0" y="132.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">(~0.3)</text>
<rect x="610" y="100" width="182" height="40" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="701.0" y="116.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">桶 3</text>
<text x="701.0" y="132.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">(~0.5)</text>
<rect x="800" y="100" width="182" height="40" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="891.0" y="116.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">桶 4</text>
<text x="891.0" y="132.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">(~0.7)</text>
<rect x="990" y="100" width="182" height="40" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="1081.0" y="116.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">桶 5</text>
<text x="1081.0" y="132.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">(~0.9)</text>
<text x="214" y="172.0" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="bold" fill="#374151">mean confidence</text>
<rect x="230" y="150" width="182" height="36" rx="4" fill="#eff6ff" stroke="#1e40af" stroke-width="1.5"/>
<text x="321.0" y="172.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e40af">0.101</text>
<rect x="420" y="150" width="182" height="36" rx="4" fill="#eff6ff" stroke="#1e40af" stroke-width="1.5"/>
<text x="511.0" y="172.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e40af">0.305</text>
<rect x="610" y="150" width="182" height="36" rx="4" fill="#eff6ff" stroke="#1e40af" stroke-width="1.5"/>
<text x="701.0" y="172.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e40af">0.499</text>
<rect x="800" y="150" width="182" height="36" rx="4" fill="#eff6ff" stroke="#1e40af" stroke-width="1.5"/>
<text x="891.0" y="172.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e40af">0.702</text>
<rect x="990" y="150" width="182" height="36" rx="4" fill="#eff6ff" stroke="#1e40af" stroke-width="1.5"/>
<text x="1081.0" y="172.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e40af">0.897</text>
<text x="214" y="216.0" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="bold" fill="#374151">empirical accept rate</text>
<rect x="230" y="194" width="182" height="36" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="321.0" y="216.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#047857">0.113</text>
<rect x="420" y="194" width="182" height="36" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="511.0" y="216.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#047857">0.312</text>
<rect x="610" y="194" width="182" height="36" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="701.0" y="216.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#047857">0.518</text>
<rect x="800" y="194" width="182" height="36" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="891.0" y="216.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#047857">0.713</text>
<rect x="990" y="194" width="182" height="36" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="1081.0" y="216.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#047857">0.888</text>
<text x="214" y="260.0" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="bold" fill="#374151">偏差</text>
<rect x="230" y="238" width="182" height="36" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="321.0" y="260.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#64748b">+0.012</text>
<rect x="420" y="238" width="182" height="36" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="511.0" y="260.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#64748b">+0.007</text>
<rect x="610" y="238" width="182" height="36" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="701.0" y="260.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#64748b">+0.019</text>
<rect x="800" y="238" width="182" height="36" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="891.0" y="260.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#64748b">+0.011</text>
<rect x="990" y="238" width="182" height="36" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="1081.0" y="260.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#64748b">-0.009</text>
<text x="30" y="308" font-family="sans-serif" font-size="12" fill="#334155">结论：草稿头良好校准（confidence ≈ 实测接受率），故 V_i=∏c_j 可代替 ∏(真实接受率) 排序，无需目标前向。</text>
</svg>