<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1462 676">
<rect width="1462" height="676" fill="white"/>
<text x="36" y="36" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">四后端同契约对照：同一份六方法接口，能力矩阵藏在这四列里</text>
<text x="36" y="60" font-family="sans-serif" font-size="12.5" fill="#64748b">调度器只认六方法接口，不需要知道每家后端内部怎么实现——这正是把契约切成 ABC 的价值</text>
<rect x="226" y="110" width="292" height="34" rx="4" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="372.0" y="132.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="white" font-weight="bold">编译分派支持的形态</text>
<rect x="526" y="110" width="292" height="34" rx="4" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="672.0" y="132.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="white" font-weight="bold">回滚能力</text>
<rect x="826" y="110" width="292" height="34" rx="4" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="972.0" y="132.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="white" font-weight="bold">is_terminated 语义</text>
<rect x="1126" y="110" width="292" height="34" rx="4" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="1272.0" y="132.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="white" font-weight="bold">编译复用</text>
<rect x="36" y="154" width="174" height="92" rx="6" fill="#16a34a" opacity="0.12" stroke="#16a34a" stroke-width="1.5"/>
<text x="123.0" y="205.0" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#16a34a">xgrammar</text>
<rect x="226" y="154" width="292" height="92" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="372.0" y="187" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">5 个分支</text>
<text x="372.0" y="204" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">（CHOICE 由校验期</text>
<text x="372.0" y="221" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">改写并入 GRAMMAR）</text>
<rect x="526" y="154" width="292" height="92" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="672.0" y="196" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">上限 = num_speculative_tokens</text>
<text x="672.0" y="212" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">matcher.rollback(n)</text>
<rect x="826" y="154" width="292" height="92" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="972.0" y="196" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">缓存标志位</text>
<text x="972.0" y="212" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">(accept_tokens/rollback 刷新)</text>
<rect x="1126" y="154" width="292" height="92" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="1272.0" y="196" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">GrammarCompiler</text>
<text x="1272.0" y="212" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">(cache_enabled=True)</text>
<rect x="36" y="254" width="174" height="92" rx="6" fill="#7c3aed" opacity="0.12" stroke="#7c3aed" stroke-width="1.5"/>
<text x="123.0" y="305.0" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#7c3aed">guidance</text>
<rect x="226" y="254" width="292" height="92" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="372.0" y="296" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">校验期只做 EBNF/</text>
<text x="372.0" y="312" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">JSON schema 预检</text>
<rect x="526" y="254" width="292" height="92" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="672.0" y="296" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">有偏移：num_tokens</text>
<text x="672.0" y="312" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">− rollback_lag(∈{0,1})</text>
<rect x="826" y="254" width="292" height="92" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="972.0" y="296" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">EOS 且 matcher.stopped</text>
<text x="972.0" y="312" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">→ rollback_lag 置 1</text>
<rect x="1126" y="254" width="292" height="92" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="1272.0" y="304" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">0（无任何编译缓存）</text>
<rect x="36" y="354" width="174" height="92" rx="6" fill="#2563eb" opacity="0.12" stroke="#2563eb" stroke-width="1.5"/>
<text x="123.0" y="405.0" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#2563eb">outlines</text>
<rect x="226" y="354" width="292" height="92" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="372.0" y="396" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">3 种</text>
<text x="372.0" y="412" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">(JSON / REGEX / CHOICE)</text>
<rect x="526" y="354" width="292" height="92" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="672.0" y="396" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">库内支持，未在</text>
<text x="672.0" y="412" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">精简版覆盖</text>
<rect x="826" y="354" width="292" height="92" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="972.0" y="396" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">返回上一次的</text>
<text x="972.0" y="412" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">is_finished()（延迟一步）</text>
<rect x="1126" y="354" width="292" height="92" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="1272.0" y="396" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">自建 cache，键=</text>
<text x="1272.0" y="412" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">f"{vocab._hash}_{regex}"</text>
<rect x="36" y="454" width="174" height="92" rx="6" fill="#dc2626" opacity="0.12" stroke="#dc2626" stroke-width="1.5"/>
<text x="123.0" y="505.0" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#dc2626">lm-format-enforcer</text>
<rect x="226" y="454" width="292" height="92" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="372.0" y="487" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">4 种</text>
<text x="372.0" y="504" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">(JSON/JSON_OBJECT/</text>
<text x="372.0" y="521" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">REGEX/CHOICE)</text>
<rect x="526" y="454" width="292" height="92" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="672.0" y="496" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">0：max_rollback_tokens&gt;0</text>
<text x="672.0" y="512" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">直接 raise ValueError</text>
<rect x="826" y="454" width="292" height="92" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="972.0" y="496" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">看 current_tokens_prefix</text>
<text x="972.0" y="512" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">末位是不是 EOS</text>
<rect x="1126" y="454" width="292" height="92" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="1272.0" y="496" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">只 lru_cache 了</text>
<text x="1272.0" y="512" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">tokenizer_data</text>
<rect x="36" y="584" width="1390" height="70" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="56.0" y="606" font-family="sans-serif" font-size="11.5" fill="#334155">• xgrammar 支持的形态：5 个分支（CHOICE 由校验期改写并入 GRAMMAR）</text>
<text x="741.0" y="606" font-family="sans-serif" font-size="11.5" fill="#334155">• outlines 支持的形态：3（JSON / REGEX / CHOICE）</text>
<text x="56.0" y="626" font-family="sans-serif" font-size="11.5" fill="#334155">• lm-format-enforcer 支持的形态：4（JSON/JSON_OBJECT/REGEX/CHOICE）</text>
<text x="741.0" y="626" font-family="sans-serif" font-size="11.5" fill="#334155">• lm-format-enforcer 的回滚能力：0（max_rollback_tokens&gt;0 直接 raise）</text>
<text x="56.0" y="646" font-family="sans-serif" font-size="11.5" fill="#334155">• guidance 回滚时的偏移：num_tokens − rollback_lag（EOS 后 lag=1）</text>
<text x="741.0" y="646" font-family="sans-serif" font-size="11.5" fill="#334155">• guidance 的编译缓存：0（无）</text>
</svg>