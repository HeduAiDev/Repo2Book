<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 820">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#dc2626"/></marker><marker id="g" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#16a34a"/></marker></defs>
<rect width="1260" height="820" fill="white"/>
<text x="630.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="16.5" font-weight="bold" fill="#0f172a">auto 的降级阶梯发生在前端校验期，不是引擎期的选择</text>
<rect x="240.0" y="60" width="460" height="44" rx="9" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.8"/>
<text x="470.0" y="86" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#1e293b">入口：SamplingParams._validate_structured_outputs（前端 Processor）</text>
<rect x="790.0" y="56" width="340" height="52" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="1.8"/>
<text x="960.0" y="71" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="normal" fill="#1e293b">backend 显式指定</text>
<text x="960.0" y="86" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="normal" fill="#1e293b">（xgrammar/guidance/outlines/lm-format-enforcer）</text>
<text x="960.0" y="100" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="normal" fill="#1e293b">→ 各自 validate_* 预检，不降级</text>
<line x1="700.0" y1="82" x2="790.0" y2="82.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="240.0" y="150" width="460" height="44" rx="9" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.8"/>
<text x="470.0" y="177" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e293b">backend == 'auto'</text>
<line x1="470.0" y1="104" x2="470.0" y2="150" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="240.0" y="240" width="460" height="50" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
<text x="470.0" y="261" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e293b">try: validate_xgrammar_grammar(self)</text>
<text x="470.0" y="277" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="normal" fill="#1e293b">→ _backend = 'xgrammar'</text>
<line x1="470.0" y1="194" x2="470.0" y2="240" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="453.6" y="206.0" width="32.9" height="22" rx="4" fill="white" opacity="0.96"/>
<text x="470.0" y="220.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">try</text>
<rect x="240.0" y="346" width="460" height="56" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
<text x="470.0" y="363" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#1e293b">except ValueError → 判 skip_guidance</text>
<text x="470.0" y="378" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="normal" fill="#1e293b">（非 tekken Mistral 分词器 或 schema 含</text>
<text x="470.0" y="392" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="normal" fill="#1e293b">guidance 不支持特性，如 patternProperties）</text>
<line x1="470.0" y1="290" x2="470.0" y2="346" stroke="#dc2626" stroke-width="1.8" marker-end="url(#r)"/>
<rect x="404.8" y="307.0" width="130.3" height="22" rx="4" fill="white" opacity="0.96"/>
<text x="470.0" y="321.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#dc2626">except ValueError</text>
<rect x="240.0" y="458" width="215.0" height="50" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
<text x="347.5" y="479" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e293b">validate_..._outlines</text>
<text x="347.5" y="494" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="normal" fill="#1e293b">→ _backend = 'outlines'</text>
<line x1="355.0" y1="402" x2="240.0" y2="458" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="430.0" y1="402" x2="347.5" y2="458" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="281.5" y="408" width="132.1" height="18" rx="4" fill="white" opacity="0.96"/>
<text x="347.5" y="421" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">skip_guidance=True</text>
<rect x="485.0" y="458" width="215.0" height="50" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/>
<text x="592.5" y="479" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e293b">validate_guidance_grammar</text>
<text x="592.5" y="494" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="normal" fill="#1e293b">→ _backend = 'guidance'</text>
<line x1="510.0" y1="402" x2="592.5" y2="458" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="575.0" y="408" width="35.0" height="18" rx="4" fill="white" opacity="0.96"/>
<text x="592.5" y="421" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">否则</text>
<rect x="240.0" y="558" width="460" height="50" rx="9" fill="#e2e8f0" stroke="#475569" stroke-width="1.8"/>
<text x="470.0" y="579" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e293b">出口：params._backend 落定 + _backend_was_auto=True</text>
<text x="470.0" y="594" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="normal" fill="#1e293b">引擎侧 grammar_init 只读 _backend，不做任何选择</text>
<line x1="347.5" y1="508" x2="470.0" y2="558" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="592.5" y1="508" x2="470.0" y2="558" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="240.0" y="638" width="460" height="50" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-dasharray="5 3"/>
<text x="470.0" y="660" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#854d0e">旁注：lm-format-enforcer 不在这条阶梯上</text>
<text x="470.0" y="678" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#78350f">它只能被显式指定，auto 从不会降级选中它</text>
<rect x="40" y="750" width="1180" height="56" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="60.0" y="770" font-family="sans-serif" font-size="11.5" fill="#334155">• auto 阶梯涉及的后端数：3（xgrammar → guidance / outlines）</text>
<text x="670.0" y="770" font-family="sans-serif" font-size="11.5" fill="#334155">• 阶梯从不选中的后端数：1（lm-format-enforcer）</text>
<text x="60.0" y="792" font-family="sans-serif" font-size="11.5" fill="#334155">• auto 走完后 _backend_was_auto：True</text>
<text x="670.0" y="792" font-family="sans-serif" font-size="11.5" fill="#334155">• 全引擎允许的后端实例数：1</text>
</svg>