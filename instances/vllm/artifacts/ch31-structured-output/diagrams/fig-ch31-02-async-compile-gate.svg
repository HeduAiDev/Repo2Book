<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 974">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#94a3b8"/></marker></defs>
<rect width="1320" height="974" fill="white"/>
<text x="660.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">异步编译门：编译在线程池里跑，调度线程每轮只花 100 微秒问一句好了没</text>
<rect x="75" y="56" width="230" height="50" rx="6" fill="#6366f1" opacity="0.15" stroke="#6366f1" stroke-width="1.5"/>
<text x="190" y="78" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#6366f1">输入处理线程</text>
<line x1="190" y1="106" x2="190" y2="934" stroke="#6366f1" stroke-width="1.2" stroke-dasharray="4,4" opacity="0.5"/>
<rect x="455" y="56" width="230" height="50" rx="6" fill="#0891b2" opacity="0.15" stroke="#0891b2" stroke-width="1.5"/>
<text x="570" y="78" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0891b2">线程池工作线程</text>
<text x="570" y="96" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#0891b2">max_workers=2（本机观测）</text>
<line x1="570" y1="106" x2="570" y2="934" stroke="#0891b2" stroke-width="1.2" stroke-dasharray="4,4" opacity="0.5"/>
<rect x="835" y="56" width="230" height="50" rx="6" fill="#16a34a" opacity="0.15" stroke="#16a34a" stroke-width="1.5"/>
<text x="950" y="78" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#16a34a">调度线程</text>
<line x1="950" y1="106" x2="950" y2="934" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="4,4" opacity="0.5"/>
<rect x="30.0" y="124" width="320" height="78" rx="8" fill="white" stroke="#6366f1" stroke-width="2"/>
<text x="190" y="139" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#1e293b">preprocess_add_request</text>
<text x="190" y="155" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="normal" fill="#1e293b">grammar_init →</text>
<text x="190" y="171" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="normal" fill="#1e293b">executor.submit(_create_grammar)</text>
<text x="190" y="187" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="normal" fill="#1e293b">立刻返回</text>
<text x="50" y="167.0" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#64748b">入队</text>
<rect x="410.0" y="234" width="320" height="78" rx="8" fill="white" stroke="#0891b2" stroke-width="2"/>
<text x="570" y="257" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#1e293b">_create_grammar</text>
<text x="570" y="273" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="normal" fill="#1e293b">backend.compile_grammar</text>
<text x="570" y="289" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="normal" fill="#1e293b">(request_type, grammar_spec)</text>
<text x="50" y="277.0" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#64748b">提交编译</text>
<rect x="744.0" y="262.0" width="154.69" height="22" rx="5" fill="#fef3c7" stroke="#b45309"/>
<text x="752.0" y="277.0" font-family="sans-serif" font-size="11.5" fill="#92400e">编译中（Future 未完成）</text>
<rect x="790.0" y="344" width="320" height="78" rx="8" fill="white" stroke="#16a34a" stroke-width="2"/>
<text x="950" y="359" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#1e293b">_is_blocked_waiting_status=True</text>
<text x="950" y="375" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="normal" fill="#1e293b">→ _try_promote_blocked_waiting_request</text>
<text x="950" y="391" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="normal" fill="#1e293b">读 grammar=None → 晋级检查 False</text>
<text x="950" y="407" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="normal" fill="#1e293b">status=WAITING_FOR_..._GRAMMAR(=2)</text>
<text x="50" y="387.0" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#64748b">轮 1</text>
<rect x="1124.0" y="372.0" width="102.02000000000001" height="22" rx="5" fill="#fef3c7" stroke="#b45309"/>
<text x="1132.0" y="387.0" font-family="sans-serif" font-size="11.5" fill="#92400e">轮询预算 100us</text>
<rect x="790.0" y="454" width="320" height="78" rx="8" fill="white" stroke="#16a34a" stroke-width="2"/>
<text x="950" y="469" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#1e293b">_is_blocked_waiting_status=True</text>
<text x="950" y="485" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="normal" fill="#1e293b">→ _try_promote_blocked_waiting_request</text>
<text x="950" y="501" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="normal" fill="#1e293b">读 grammar=None → 晋级检查 False</text>
<text x="950" y="517" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="normal" fill="#1e293b">status=WAITING_FOR_..._GRAMMAR(=2)</text>
<text x="50" y="497.0" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#64748b">轮 2</text>
<rect x="1124.0" y="482.0" width="102.02000000000001" height="22" rx="5" fill="#fef3c7" stroke="#b45309"/>
<text x="1132.0" y="497.0" font-family="sans-serif" font-size="11.5" fill="#92400e">轮询预算 100us</text>
<rect x="410.0" y="564" width="320" height="78" rx="8" fill="white" stroke="#0891b2" stroke-width="2"/>
<text x="570" y="595" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#1e293b">成品语法对象</text>
<text x="570" y="611" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="normal" fill="#1e293b">写回 Future</text>
<text x="50" y="607.0" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#64748b">编译完成</text>
<rect x="790.0" y="674" width="320" height="78" rx="8" fill="white" stroke="#16a34a" stroke-width="2"/>
<text x="950" y="689" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#1e293b">_is_blocked_waiting_status=True</text>
<text x="950" y="705" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="normal" fill="#1e293b">→ _try_promote_blocked_waiting_request</text>
<text x="950" y="721" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="normal" fill="#1e293b">读 grammar=成品 → 晋级检查 True</text>
<text x="950" y="737" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="normal" fill="#1e293b">status 改为 WAITING(=1)</text>
<text x="50" y="717.0" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#64748b">轮 3</text>
<rect x="1124.0" y="702.0" width="39.0" height="22" rx="5" fill="#fef3c7" stroke="#b45309"/>
<text x="1132.0" y="717.0" font-family="sans-serif" font-size="11.5" fill="#92400e">晋级</text>
<rect x="790.0" y="784" width="320" height="78" rx="8" fill="white" stroke="#16a34a" stroke-width="2"/>
<text x="950" y="807" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#1e293b">_is_blocked_waiting_status=False</text>
<text x="950" y="823" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="normal" fill="#1e293b">晋级检查也返回 False,但另有原因:</text>
<text x="950" y="839" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="normal" fill="#1e293b">if 分支没命中（与轮 1/2 的 False 不同因）</text>
<text x="50" y="827.0" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#64748b">轮 4</text>
