<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 460">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="8" markerHeight="6" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker></defs>
<rect width="1420" height="460" fill="white"/>
<text x="710.0" y="34" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#0f172a">约束解码只在采样之前插一层掩码，采样算法本身一行不改</text>
<rect x="60" y="96" width="220" height="100" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.8"/>
<text x="170.0" y="133" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e293b">语法状态机</text>
<text x="170.0" y="151" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="normal" fill="#1e293b">StructuredOutputGrammar</text>
<text x="170.0" y="169" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="normal" fill="#1e293b">（哪些 token 现在合法）</text>
<rect x="420" y="96" width="220" height="100" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
<text x="530.0" y="133" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e293b">位掩码</text>
<text x="530.0" y="151" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="normal" fill="#1e293b">每 token 1 bit：1=允许 / 0=禁止</text>
<text x="530.0" y="169" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="normal" fill="#1e293b">18.3 KB（|V|=150000）</text>
<rect x="780" y="96" width="220" height="100" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
<text x="890.0" y="133" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e293b">logits</text>
<text x="890.0" y="151" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="normal" fill="#1e293b">|V| 个 float32（ch30 采样输入）</text>
<text x="890.0" y="169" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="normal" fill="#1e293b">585.9 KB（|V|=150000）</text>
<rect x="1140" y="96" width="220" height="100" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
<text x="1250.0" y="133" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e293b">采样器（ch30）</text>
<text x="1250.0" y="151" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="normal" fill="#1e293b">温度 / top-p / top-k</text>
<text x="1250.0" y="169" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="normal" fill="#1e293b">逻辑一行不改</text>
<line x1="280" y1="146.0" x2="420" y2="146.0" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="291.2" y="115.0" width="117.5" height="20" rx="4" fill="white" opacity="0.95"/>
<text x="350.0" y="130.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#b45309">fill_bitmask()</text>
<line x1="640" y1="146.0" x2="780" y2="146.0" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="652.0" y="115.0" width="116.0" height="20" rx="4" fill="white" opacity="0.95"/>
<text x="710.0" y="130.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#b45309">作用点：采样之前</text>
<line x1="1000" y1="146.0" x2="1140" y2="146.0" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="1037.0" y="115.0" width="66.0" height="20" rx="4" fill="white" opacity="0.95"/>
<text x="1070.0" y="130.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#b45309">流程不变</text>
<text x="710.0" y="236" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#7c2d12" font-weight="bold">六方法契约中，与采样交互的方法只有这 1 个：fill_bitmask(bitmask, batch_index)</text>
<rect x="420" y="262" width="580" height="42" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-dasharray="5 3"/>
<text x="710.0" y="288" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#854d0e">下一章：怎么把 0 位打成 -inf、上卡并行填充</text>
<text x="420" y="324" font-family="sans-serif" font-size="12.5" fill="#334155" font-weight="bold">同一行的字节数对比（约小 32 倍）</text>
