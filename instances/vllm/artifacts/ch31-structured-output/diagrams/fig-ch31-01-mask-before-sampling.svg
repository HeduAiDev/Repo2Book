<text x="438.6" y="347" font-family="sans-serif" font-size="12" fill="#334155">位掩码 18752 B（18.3 KB）</text>
<rect x="420" y="360" width="340.0" height="20" rx="4" fill="#2563eb"/>
<text x="768.0" y="375" font-family="sans-serif" font-size="12" fill="#334155">logits 600000 B（585.9 KB）</text>
</svg>