<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1000">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker><marker id="b" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#94a3b8"/></marker></defs>
<rect width="1280" height="1000" fill="white"/>
<text x="640.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">请求级契约的六个方法，各自对应语法状态机上一种不可省略的操作</text>
<circle cx="640.0" cy="470" r="120" fill="#e0e7ff" stroke="#6366f1" stroke-width="2.5"/>
<text x="640.0" y="460" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#312e81">语法状态机</text>
<text x="640.0" y="480" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4338ca">GrammarMatcher(xgrammar)</text>
<text x="640.0" y="497" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4338ca">LLMatcher(guidance)</text>
<line x1="640.0" y1="350.0" x2="640.0" y2="140.0" stroke="#16a34a" stroke-width="2" marker-end="url(#a)"/>
<rect x="470.0" y="86.0" width="340" height="108" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="640.0" y="108.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#16a34a">真推进</text>
<text x="640.0" y="128.0" text-anchor="middle" font-family="monospace" font-size="11.5" font-weight="bold" fill="#1e293b">accept_tokens(request_id, tokens)</text>
<text x="640.0" y="146.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">用这一步真采样出的 token 推进</text>
<text x="640.0" y="161.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">调用点：scheduler.py:L1363</text>
<line x1="743.9" y1="410.0" x2="925.8" y2="305.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<rect x="755.8" y="251.0" width="340" height="108" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="925.8" y="273.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2563eb">试走（不推进）</text>
<text x="925.8" y="293.0" text-anchor="middle" font-family="monospace" font-size="11.5" font-weight="bold" fill="#1e293b">validate_tokens(tokens)</text>
<text x="925.8" y="311.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">返回被接受的前缀</text>
<text x="925.8" y="326.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">调用点：scheduler.py:L1620 / L1650</text>
<text x="925.8" y="341.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">只喂 spec_token_ids</text>
<line x1="743.9" y1="530.0" x2="925.8" y2="635.0" stroke="#dc2626" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
<rect x="755.8" y="581.0" width="340" height="108" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="925.8" y="603.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#dc2626">回退</text>
<text x="925.8" y="623.0" text-anchor="middle" font-family="monospace" font-size="11.5" font-weight="bold" fill="#1e293b">rollback(num_tokens)</text>
<text x="925.8" y="641.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">投机解码专用的退回口子</text>
<text x="925.8" y="656.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">（下一章展开）</text>
<line x1="640.0" y1="590.0" x2="640.0" y2="800.0" stroke="#ea580c" stroke-width="2" marker-end="url(#a)"/>
<rect x="470.0" y="746.0" width="340" height="108" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
<text x="640.0" y="768.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ea580c">取掩码</text>
<text x="640.0" y="788.0" text-anchor="middle" font-family="monospace" font-size="11.5" font-weight="bold" fill="#1e293b">fill_bitmask(bitmask, batch_index)</text>
<text x="640.0" y="806.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">与采样的唯一接口</text>
<text x="640.0" y="821.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">写自己那一行</text>
<line x1="536.1" y1="530.0" x2="354.2" y2="635.0" stroke="#7c3aed" stroke-width="2" marker-end="url(#a)"/>
<rect x="184.2" y="581.0" width="340" height="108" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="354.2" y="603.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#7c3aed">问终态</text>
<text x="354.2" y="623.0" text-anchor="middle" font-family="monospace" font-size="11.5" font-weight="bold" fill="#1e293b">is_terminated()</text>
<text x="354.2" y="641.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">语法是否已走到终态</text>
<line x1="536.1" y1="410.0" x2="354.2" y2="305.0" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<rect x="184.2" y="251.0" width="340" height="108" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="354.2" y="273.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#64748b">归零</text>
<text x="354.2" y="293.0" text-anchor="middle" font-family="monospace" font-size="11.5" font-weight="bold" fill="#1e293b">reset()</text>
<text x="354.2" y="311.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">v0.21.0 全仓无 in-tree 调用者</text>
<text x="354.2" y="326.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">契约完整性存在、当前无人调用</text>
<rect x="40" y="912" width="1200" height="70" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="60.0" y="936" font-family="sans-serif" font-size="12.5" fill="#334155">• 契约方法数：6（backend_types.py:L31-96）</text>
<text x="640.0" y="936" font-family="sans-serif" font-size="12.5" fill="#334155">• accept_tokens 调用点：1 处（scheduler.py:L1363）</text>
<text x="60.0" y="962" font-family="sans-serif" font-size="12.5" fill="#334155">• validate_tokens 调用点：2 处（scheduler.py:L1620 / L1650）</text>
<text x="640.0" y="962" font-family="sans-serif" font-size="12.5" fill="#334155">• reset() 的 in-tree 调用者：0</text>
</svg>