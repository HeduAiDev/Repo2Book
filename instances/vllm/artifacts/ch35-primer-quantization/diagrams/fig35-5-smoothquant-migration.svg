<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 480">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker></defs>
<rect width="1020" height="480" fill="white"/>
<text x="40" y="40" font-family="sans-serif" font-size="16.5" fill="#1e40af">SmoothQuant 迁移：outlier channel 2 的量化难度从激活搬到权重</text>
<text x="40" y="62" font-family="sans-serif" font-size="12" fill="#64748b">s_2 = max|X_2|^0.5 / max|W_2|^0.5 = 16.5362（alpha=0.5，60x 激活离群通道）</text>
<text x="260.0" y="96" text-anchor="middle" font-family="sans-serif" font-size="13.5" fill="#0f172a">迁移前</text>
<text x="660.0" y="96" text-anchor="middle" font-family="sans-serif" font-size="13.5" fill="#0f172a">迁移后</text>
<text x="116" y="162" text-anchor="end" font-family="sans-serif" font-size="13" fill="#334155">激活 |X_2|</text>
<rect x="130" y="110" width="260" height="90" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="260.0" y="162" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#b45309">121.1992</text>
<line x1="398" y1="155" x2="522" y2="155" stroke="#1d4ed8" stroke-width="2" marker-end="url(#a)"/>
<text x="460.0" y="147" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#1d4ed8">÷ s_2 = 16.5362</text>
<rect x="530" y="110" width="260" height="90" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="0"/>
<text x="660.0" y="162" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#1d4ed8">7.3293</text>
<text x="116" y="292" text-anchor="end" font-family="sans-serif" font-size="13" fill="#334155">权重 |W_2|</text>
<rect x="130" y="240" width="260" height="90" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="260.0" y="292" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#b45309">0.4432</text>
<line x1="398" y1="285" x2="522" y2="285" stroke="#1d4ed8" stroke-width="2" marker-end="url(#a)"/>
<text x="460.0" y="277" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#1d4ed8">× s_2 = 16.5362</text>
<rect x="530" y="240" width="260" height="90" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="0"/>
<text x="660.0" y="292" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#1d4ed8">7.3293</text>
<line x1="660.0" y1="200" x2="660.0" y2="240" stroke="#047857" stroke-width="2" stroke-dasharray="4,3"/>
<text x="806" y="215.0" font-family="sans-serif" font-size="12" fill="#047857">两者相等</text>
<text x="806" y="233.0" font-family="sans-serif" font-size="12" fill="#047857">(alpha=0.5 均分)</text>
<text x="40" y="374" font-family="sans-serif" font-size="12" fill="#334155">恒等检验：变换后 X_hat·W_hat 与原始 X·W 的最大差 = 0.0——迁移只改可量化性，不改浮点结果。</text>
<text x="40" y="392" font-family="sans-serif" font-size="12" fill="#334155">整层 per-tensor W8A8 量化误差 1.1515 -&gt; 0.5273（alpha=0.75 为此层最优），降 54.21%。</text>
<text x="40" y="410" font-family="sans-serif" font-size="12" fill="#334155">s 在离线阶段折进前一层权重，运行期激活已被抹平，vllm 只消费迁移后的定点数据。</text>
