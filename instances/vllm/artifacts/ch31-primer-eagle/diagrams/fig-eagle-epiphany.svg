<text x="858" y="286" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">[token emb ; f] 宽 2h → FC 降回 h → 单层 decoder</text>
<text x="858" y="302" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">→ 共享 LM Head（冻结）→ token</text>
