<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 838 360">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker></defs>
<rect width="838" height="360" fill="white"/>
<text x="419.0" y="36" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">树节点上的多轮投机采样：第一个候选被拒不散场</text>
<rect x="44" y="100" width="300" height="110" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="194.0" y="122" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">轮 1：候选 token 2</text>
<text x="194.0" y="144" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b91c1c">p(t)=0.15  p̂(t)=0.7</text>
<text x="194.0" y="164" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b91c1c">ratio = min(1,p/p̂) = 0.214</text>
<text x="194.0" y="184" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b91c1c">u = 0.9  →  拒绝</text>
<line x1="344" y1="155.0" x2="490" y2="155.0" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<text x="419.0" y="145.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#92400e">余量传下一候选</text>
<rect x="494" y="100" width="300" height="110" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="644.0" y="122" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">轮 2：候选 token 0</text>
<text x="644.0" y="144" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#15803d">p ← norm(max(0,p−p̂))</text>
<text x="644.0" y="164" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#15803d">ratio = min(1,p/p̂) = 0.992</text>
<text x="644.0" y="184" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#15803d">u = 0.2  →  接受</text>
<text x="44" y="250" font-family="sans-serif" font-size="12" fill="#334155">对比：链式验证在轮 1 拒绝即停止，本节点 0 个接受；树式多轮后接住 token 0，本节点 +1 接受。</text>
<text x="44" y="272" font-family="sans-serif" font-size="12" fill="#64748b">论文 Table 5：树草稿/树验证相比链式，平均接受长度 τ 提升 +0.6~+0.8，加速比提升 +0.3~+0.5。</text>
</svg>