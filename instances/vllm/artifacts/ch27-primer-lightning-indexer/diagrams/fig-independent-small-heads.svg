<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 688">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker><marker id="ag" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#16a34a"/></marker></defs>
<rect width="1180" height="688" fill="white"/>
<text x="590.0" y="32" text-anchor="middle" font-family="sans-serif" font-size="16.5" font-weight="bold" fill="#0f172a">lightning indexer 是挂在 MLA 之下的独立小头模块</text>
<text x="590.0" y="54" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#475569">重绘自 arXiv:2512.02556 Figure 2:h_t 同源分叉出 MLA 主路径与索引器路径,索引器打分只喂给 Top-k Selector</text>
<rect x="40" y="90" width="1050" height="70" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="1.6"/>
<text x="565.0" y="118" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#0f172a">Input Hidden h_t / h_s</text>
<text x="565.0" y="140" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">同一份隐藏向量,三条投影各自独立读取,互不共享参数</text>
<rect x="40" y="194" width="330" height="132" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.6"/>
<text x="205.0" y="218" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e3a8a">MLA Query 投影</text>
<text x="205.0" y="242" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">c_t^Q 低秩压缩(q_lora_rank=1536)</text>
<text x="205.0" y="262" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">apply RoPE(qk_rope_head_dim=64)</text>
<text x="205.0" y="282" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">拼接 [q_t^A ; q_t^R]</text>
<line x1="205.0" y1="160" x2="205.0" y2="194" stroke="#64748b" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="400" y="194" width="330" height="132" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.6"/>
<text x="565.0" y="218" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e3a8a">MLA KV 压缩</text>
<text x="565.0" y="242" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">c_t^KV 压缩 KV / k_t^R</text>
<text x="565.0" y="262" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">apply RoPE</text>
<text x="565.0" y="282" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">拼接 [c_t^KV ; k_t^R]</text>
<line x1="565.0" y1="160" x2="565.0" y2="194" stroke="#64748b" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="760" y="194" width="330" height="132" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
<text x="925.0" y="218" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#166534">独立索引器(index_*)</text>
<text x="925.0" y="242" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">wq_b: 1536 → head_dim×n_head=128×64</text>
<text x="925.0" y="262" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">wk_weights_proj(融合 GEMM): 输出 [128, 64]</text>
<text x="925.0" y="282" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">k_norm + 部分 apply RoPE(rope_dim=64)</text>
<line x1="925.0" y1="160" x2="925.0" y2="194" stroke="#64748b" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="40" y="360" width="330" height="96" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.6"/>
<text x="205.0" y="386" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e3a8a">主注意力 Query</text>
<text x="205.0" y="410" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">[q_t^A ; q_t^R]</text>
<text x="205.0" y="434" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">与主注意力头数/头维绑定</text>
<line x1="205.0" y1="326" x2="205.0" y2="360" stroke="#64748b" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="760" y="360" width="330" height="96" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
<text x="925.0" y="384" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#166534">Lightning Indexer 打分</text>
<text x="925.0" y="406" text-anchor="middle" font-family="sans-serif" font-size="10.8" fill="#166534">n_head=64, head_dim=128, rope_dim=64</text>
<text x="925.0" y="424" text-anchor="middle" font-family="sans-serif" font-size="10.8" fill="#166534">softmax_scale = head_dim^-0.5</text>
<text x="925.0" y="444" text-anchor="middle" font-family="sans-serif" font-size="10.8" fill="#334155">→ I_{t,s}(全部历史打分,可 FP8)</text>
<line x1="925.0" y1="326" x2="925.0" y2="360" stroke="#16a34a" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="400" y="360" width="330" height="96" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
<text x="565.0" y="386" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#92400e">Top-k Selector</text>
<text x="565.0" y="410" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">按 I_{t,:} 挑选压缩 KV 条目 {c_s}</text>
<text x="565.0" y="432" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">只消费打分结果,不关心怎么打的分</text>
<line x1="565.0" y1="326" x2="565.0" y2="360" stroke="#64748b" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="760" y1="408.0" x2="730" y2="408.0" stroke="#16a34a" stroke-width="2.2" marker-end="url(#ag)"/>
<text x="745.0" y="398.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#166534">index scores</text>
<rect x="40" y="490" width="1050" height="60" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="1.6"/>
<text x="565.0" y="516" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#0f172a">Multi-Query Attention (Core Attention)</text>
<text x="565.0" y="536" text-anchor="middle" font-family="sans-serif" font-size="10.8" fill="#64748b">只对 Top-k 选中的共享 latent KV 计算,Query 来自 MLA 主路径</text>
<line x1="205.0" y1="456" x2="205.0" y2="490" stroke="#64748b" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="565.0" y1="456" x2="565.0" y2="490" stroke="#64748b" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="565.0" y1="456" x2="565.0" y2="490" stroke="#d97706" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="40" y="584" width="1050" height="44" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="1.6"/>
<text x="565.0" y="612" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#0f172a">Output Hidden u_t</text>
<line x1="565.0" y1="550" x2="565.0" y2="584" stroke="#64748b" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="40" y="650" width="16" height="16" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.6"/>
<text x="64" y="664" text-anchor="start" font-family="sans-serif" font-size="11" fill="#334155">MLA 主路径(主注意力头/维)</text>
<rect x="300" y="650" width="16" height="16" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
<text x="324" y="664" text-anchor="start" font-family="sans-serif" font-size="11" fill="#334155">独立索引器路径(index_* 专属参数)</text>
</svg>