<text x="203.0" y="133.5" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#0f172a">Eq.(1)</text>
<text x="203.0" y="156.2" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">三刀砍出打分算子</text>
<text x="203.0" y="175.5" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">ReLU 截负,砍 value/输出</text>
<rect x="244.0" y="100.0" width="56.0" height="20" rx="10.0" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
<text x="272.0" y="114.0" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#4338ca">打分函数</text>
<rect x="314.0" y="110.0" width="178" height="84" rx="12" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<text x="403.0" y="133.5" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#0f172a">Eq.(2)</text>
<text x="403.0" y="156.2" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">分数不出闸,只出名单</text>
<text x="403.0" y="175.5" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">空槽填 -1</text>
<rect x="429.2" y="100.0" width="70.8" height="20" rx="10.0" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
<text x="464.6" y="114.0" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#4338ca">top-k 闸门</text>
<rect x="514.0" y="110.0" width="178" height="84" rx="12" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<text x="603.0" y="133.5" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#0f172a">O(L^2) -&gt; O(Lk)</text>
<text x="603.0" y="156.2" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">indexer 打分仍 O(L^2)</text>
<text x="603.0" y="175.5" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">主注意力降到 O(Lk)</text>
<rect x="624.0" y="100.0" width="76.0" height="20" rx="10.0" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
<text x="662.0" y="114.0" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#4338ca">复杂度诚实账</text>
<rect x="714.0" y="110.0" width="178" height="84" rx="12" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<text x="803.0" y="133.5" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#0f172a">Eq.(3)(4)</text>
<text x="803.0" y="156.2" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">拿主注意力分布</text>
<text x="803.0" y="175.5" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">当 indexer 的标准答案</text>
<rect x="846.6" y="100.0" width="53.4" height="20" rx="10.0" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
<text x="873.3" y="114.0" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#4338ca">KL 对齐</text>
<rect x="914.0" y="110.0" width="178" height="84" rx="12" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<text x="1003.0" y="133.5" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#0f172a">IndexCache/MXFP4</text>
<text x="1003.0" y="156.2" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">K^IComp 与 C^Comp</text>
<text x="1003.0" y="175.5" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">并行产出,各写各缓存</text>
<rect x="1014.0" y="100.0" width="86.0" height="20" rx="10.0" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
<text x="1057.0" y="114.0" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#4338ca">独立缓存与量化</text>
<rect x="114.0" y="242.0" width="178" height="84" rx="12" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<text x="203.0" y="265.5" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#0f172a">max(x,0) &gt;= 0</text>
<text x="203.0" y="288.2" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">总分有下界 0</text>
<text x="203.0" y="307.5" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">负相关只截零,不倒扣</text>
<rect x="228.2" y="232.0" width="71.8" height="20" rx="10.0" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
<text x="264.1" y="246.0" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#4338ca">严谨:单调性</text>
<rect x="314.0" y="242.0" width="178" height="84" rx="12" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<text x="403.0" y="265.5" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#0f172a">argsort</text>
<text x="403.0" y="288.2" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">分数全序</text>
<text x="403.0" y="307.5" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">并列时索引小者优先</text>
<rect x="408.2" y="232.0" width="91.8" height="20" rx="10.0" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
<text x="454.1" y="246.0" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#4338ca">严谨:选择正确性</text>
<rect x="514.0" y="242.0" width="178" height="84" rx="12" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<text x="603.0" y="265.5" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#0f172a">L/(2k)</text>
<text x="603.0" y="288.2" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">稀疏&lt;=稠密恒成立</text>
<text x="603.0" y="307.5" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">收益随 L 线性放大</text>
<rect x="608.2" y="232.0" width="91.8" height="20" rx="10.0" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
<text x="654.1" y="246.0" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#4338ca">不变量:收益守恒</text>
<rect x="714.0" y="242.0" width="178" height="84" rx="12" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<text x="803.0" y="265.5" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#0f172a">KL 散度</text>
<text x="803.0" y="288.2" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">两侧非负和为 1</text>
<text x="803.0" y="307.5" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">先稠密热身,后稀疏收窄</text>
<rect x="780.8" y="232.0" width="119.2" height="20" rx="10.0" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
<text x="840.4" y="246.0" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#4338ca">严谨:KL 为何用得起来</text>
<rect x="914.0" y="242.0" width="178" height="84" rx="12" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<text x="1003.0" y="265.5" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#0f172a">K^IComp/C^Comp</text>
<text x="1003.0" y="288.2" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">两块缓存各自分配</text>
<text x="1003.0" y="307.5" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">互不引用</text>
<rect x="988.2" y="232.0" width="111.8" height="20" rx="10.0" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
<text x="1044.1" y="246.0" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#4338ca">独立性:物理不是逻辑</text>
