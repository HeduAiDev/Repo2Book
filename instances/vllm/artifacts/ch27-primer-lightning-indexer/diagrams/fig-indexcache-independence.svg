<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 644">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker><marker id="ab" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#3b82f6"/></marker><marker id="ag" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#16a34a"/></marker></defs>
<rect width="1180" height="644" fill="white"/>
<text x="590.0" y="32" text-anchor="middle" font-family="sans-serif" font-size="16.5" font-weight="bold" fill="#0f172a">IndexCache 与主 KV cache 各自独立分配、独立布局</text>
<text x="590.0" y="54" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#475569">重绘自 arXiv:2606.19348 Figure 3:压缩操作并行产出 C^Comp 与 K^IComp,两者写进互不引用的独立缓存</text>
<rect x="40" y="92" width="1100" height="60" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="1.6"/>
<text x="590.0" y="118" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">原始 latent KV 条目流(每 m 个压缩为 1 个)</text>
<text x="590.0" y="138" text-anchor="middle" font-family="sans-serif" font-size="10.8" fill="#64748b">同一段历史,同一次压缩操作读取</text>
<rect x="360.0" y="198" width="460" height="70" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
<text x="590.0" y="224" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#92400e">DeepseekCompressor:压缩操作(并行产出)</text>
<text x="590.0" y="246" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">C^Comp(主压缩 KV) 与 K^IComp(索引器压缩键) 同一步算出</text>
<line x1="590.0" y1="152" x2="590.0" y2="198" stroke="#64748b" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M590.0,268 L300.0,328" stroke="#3b82f6" stroke-width="2.2" fill="none" marker-end="url(#ab)"/>
<path d="M590.0,268 L880.0,328" stroke="#16a34a" stroke-width="2.2" fill="none" marker-end="url(#ag)"/>
<text x="266.0" y="292.0" text-anchor="end" font-family="sans-serif" font-size="11" fill="#1e3a8a">C^Comp</text>
<text x="914.0" y="292.0" text-anchor="start" font-family="sans-serif" font-size="11" fill="#166534">K^IComp</text>
<rect x="40" y="328" width="520.0" height="190" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.6"/>
<text x="300.0" y="354" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e3a8a">主 KV cache(DeepseekV32/V4 主注意力)</text>
<rect x="70.0" y="374" width="107.0" height="52" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
<text x="123.5" y="404" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#1e3a8a">C^Comp[0]</text>
<rect x="185.0" y="374" width="107.0" height="52" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
<text x="238.5" y="404" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#1e3a8a">C^Comp[1]</text>
<rect x="300.0" y="374" width="107.0" height="52" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
<text x="353.5" y="404" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#1e3a8a">C^Comp[2]</text>
<rect x="415.0" y="374" width="107.0" height="52" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
<text x="468.5" y="404" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#1e3a8a">…</text>
<text x="300.0" y="450" text-anchor="middle" font-family="sans-serif" font-size="10.8" fill="#334155">布局由主注意力头维/头数决定,与 indexer 无关</text>
<text x="300.0" y="474" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">MLAAttentionSpec(主注意力 head_size)</text>
<text x="300.0" y="496" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">分开分配,不被 IndexCache 引用/复用</text>
<rect x="620.0" y="328" width="520.0" height="190" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
<text x="880.0" y="354" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#166534">IndexCache(DeepseekV32/V4IndexerCache)</text>
<rect x="650.0" y="374" width="446.06060606060606" height="40" rx="4" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.2"/>
<text x="873.030303030303" y="394" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#166534">128B fp8 值</text>
<rect x="1096.060606060606" y="374" width="13.93939393939394" height="40" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
<text x="1103.030303030303" y="394" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#92400e">4B</text>
<text x="880.0" y="432" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#166534">每条 K^IComp = 128 + 4 = 132 字节/head_dim</text>
<text x="880.0" y="452" text-anchor="middle" font-family="sans-serif" font-size="10.3" fill="#334155">scale = head_dim/quant_block_size×4 = 128/128×4 = 4B</text>
<text x="880.0" y="474" text-anchor="middle" font-family="sans-serif" font-size="10.8" fill="#334155">num_kv_heads = 1(MQA 式,跨头共享 1 份)</text>
<text x="880.0" y="496" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">与主 KV cache 分开分配,互不引用</text>
<rect x="620.0" y="558" width="520.0" height="56" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5,4"/>
<text x="880.0" y="580" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155">V4 版页对齐 = 576 字节</text>
<text x="880.0" y="600" text-anchor="middle" font-family="sans-serif" font-size="10.3" fill="#64748b">132B 条目 + 空位,便于与 compressor 状态一起打包</text>
<line x1="880.0" y1="518" x2="880.0" y2="558" stroke="#16a34a" stroke-width="1.8" marker-end="url(#a)"/>
<text x="300.0" y="580" text-anchor="middle" font-family="sans-serif" font-size="10.3" fill="#94a3b8">主 KV cache 页对齐由主注意力后端自定,不受</text>
<text x="300.0" y="598" text-anchor="middle" font-family="sans-serif" font-size="10.3" fill="#94a3b8">IndexCache 的 576 字节约束影响</text>
</svg>