<text x="44.0" y="295.0" text-anchor="start" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1d4ed8">其实</text>
<text x="44.0" y="317.0" text-anchor="start" font-family="sans-serif" font-size="12.5" fill="#64748b">一对没少，换账户</text>
<rect x="300" y="228" width="660" height="62" rx="6" fill="#3b82f6" fill-opacity="0.85" stroke="#1d4ed8" stroke-width="1.5"/>
