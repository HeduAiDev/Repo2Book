<rect width="1040" height="500" fill="white"/>
<text x="520.0" y="34.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold" fill="#0f172a">一对都没少扫：省的不是「扫多少对」，是「单价」</text>
<text x="520.0" y="58.0" text-anchor="middle" font-family="sans-serif" font-size="13.5" fill="#64748b">稀疏注意力照样给全部 (t,s) 对打分，O(L²) 原封不动——只是换到便宜账户结账</text>
