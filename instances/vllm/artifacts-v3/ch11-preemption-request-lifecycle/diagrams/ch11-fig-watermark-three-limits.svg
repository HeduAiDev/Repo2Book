<text x="76.0" y="738.0" font-family="Microsoft YaHei, SimHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="8.8" fill="#334155" text-anchor="start">「admitted based on KV cache they need at admission time … output length is unknown and unreserved」</text>
