<text x="760.0" y="610.0" font-family="Microsoft YaHei, SimHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="8.8" fill="#334155" text-anchor="start">watermark_blocks = int(watermark × num_blocks)（L170-L171，int 截断）</text>
<text x="760.0" y="628.0" font-family="Microsoft YaHei, SimHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="8.8" fill="#334155" text-anchor="start">int(0.5×10)=5 · int(0.3×10)=3 · int(0.3×100)=30 · 默认 0.0=关</text>
<text x="760.0" y="646.0" font-family="Microsoft YaHei, SimHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="8.8" fill="#334155" text-anchor="start">区间 [0.0, 1.0)（config/scheduler.py:L136-L141）：把取舍留给用户按负载调</text>
