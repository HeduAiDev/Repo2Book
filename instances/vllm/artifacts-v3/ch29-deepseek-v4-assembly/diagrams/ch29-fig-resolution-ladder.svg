<text x="76.0" y="514.0" font-family="Microsoft YaHei, SimHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="11.5" fill="#ea580c" text-anchor="start" font-weight="bold">两档是分工，不是降级：CSA 保 4 倍分辨率、但要挑着看；HCA 用更粗的分辨率换「全看不挑、不会漏」。</text>
<text x="76.0" y="538.0" font-family="Microsoft YaHei, SimHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="11" fill="#0f172a" text-anchor="start">两笔账也分开算：缓存里有多少条 = 显存与带宽账；每个 query 实看多少条 = 算力账——同一层里两列各走各的。</text>
<text x="1588.0" y="514.0" font-family="Microsoft YaHei, SimHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="9" fill="#475569" text-anchor="end">压得越多</text>
<text x="1588.0" y="532.0" font-family="Microsoft YaHei, SimHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="9" fill="#475569" text-anchor="end">缓存越省；</text>
<text x="1588.0" y="550.0" font-family="Microsoft YaHei, SimHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="9" fill="#475569" text-anchor="end">但不等于看全</text>
<text x="56.0" y="588.0" font-family="Microsoft YaHei, SimHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="8.5" fill="#475569" text-anchor="start">1M 按 1,000,000 取整算账；块带密度、高亮块数与窗格数均为示意，条数为实值——不压缩对照 1,000,000 条，滑窗层 128 条，HCA 的 7,940 槽约为全量的 0.79%。</text>
<text x="56.0" y="606.0" font-family="Microsoft YaHei, SimHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="8.5" fill="#475569" text-anchor="start">压缩比 4 / 128 与最近窗口 128 出自官方 config 的逐层表；k 取 Flash 512、Pro 1024。依据 DeepSeek-V4 技术报告 §2.3.1–§2.3.3（arXiv:2606.19348）。</text>
</svg>