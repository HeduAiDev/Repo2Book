<text x="844.0" y="308.0" font-family="Microsoft YaHei, SimHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="8" fill="#334155" text-anchor="start">（经验 0.85039）；target=(0.7, 0.3)</text>
<text x="844.0" y="326.0" font-family="Microsoft YaHei, SimHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="8.2" fill="#16a34a" text-anchor="start" font-weight="bold">早停版：0.699855 ≈ p_t（名单与实现隔离）</text>
<rect x="46.0" y="348.0" width="1068.0" height="56.0" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.2"/>
<text x="60.0" y="370.0" font-family="Microsoft YaHei, SimHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="10" fill="#0f172a" text-anchor="start" font-weight="bold">两条路合起来：P(Y=A)=0.5×1 + 0.5×0.7 = 0.85 ≠ 0.7——「多看一眼再决定」破无损；经验模拟 200000 次得 0.85039 逐位应验</text>
<text x="60.0" y="390.0" font-family="Microsoft YaHei, SimHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="9" fill="#475569" text-anchor="start">生产版因此用异步因果屏障：调度名单只准看两步前的置信（时间偏移），不看本步实采——「看的是过去」</text>
<text x="46.0" y="426.0" font-family="Microsoft YaHei, SimHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="bold">非前瞻性（non-anticipating）不是学术洁癖：名单只要闻到本步实采的味道，0.5/0.5 的入口就会被掰成 0.85/0.15。</text>
<text x="46.0" y="448.0" font-family="Microsoft YaHei, SimHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="8.5" fill="#94a3b8" text-anchor="start">数值=固定 seed 的 CPU 参考实现实跑（MC 200000 次、seed=13：偏差版 0.85039 / 早停版 0.699855）· 非前瞻性与异步因果屏障引 arXiv:2607.05147 §5.2/§5.3</text>
