<text x="42.0" y="56.0" font-family="Microsoft YaHei, SimHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="10.5" fill="#475569" text-anchor="start">重绘自 arXiv:2205.14135 Fig.1:左 = tiling 机制(存储层级 + 双循环搬运 + 虚线 N×N)· 右 = GPT-2 注意力耗时对比(PyTorch 五算子分开跑 vs FlashAttention 一个融合 kernel)</text>
