<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 750">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker></defs>
<rect width="870" height="750" fill="white"/>
<text x="40" y="26" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e40af">rewriteAddPtr 控制流全景（BlockPtrAnalysis.cpp:L1125-L1214）</text>
<text x="40" y="48" font-family="sans-serif" font-size="11.5" fill="#64748b">示例取自 legal_stride.mlir：sizes=[4,1] strides=[4,0] → 零 stride 修复 → strides=[4,1]（CHECK 逐位一致）</text>
<rect x="40" y="118" width="460" height="58" rx="8" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
<text x="270.0" y="138" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">① parseAddPtr 逆向出 BlockData</text>
<text x="270.0" y="158" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#0f172a">镜像 ch11（不重推）→ sizes=[4,1] strides=[4,0]，MemAccType=StrucMemAcc</text>
<text x="490" y="168" text-anchor="end" font-family="sans-serif" font-size="9.5" fill="#94a3b8">L846-L894</text>
<line x1="270.0" y1="176" x2="270.0" y2="206" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
<polygon points="120.0,248.0 270.0,210.0 420.0,248.0 270.0,286.0" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="270.0" y="244.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#78350f">② isUnstructured()？</text>
<text x="270.0" y="262.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#78350f">StrucMemAcc → 否</text>
<text x="270.0" y="278.0" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#92400e">L1135-L1142</text>
<line x1="420.0" y1="248.0" x2="590" y2="248.0" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#a)"/>
<text x="505.0" y="240.0" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#94a3b8">是</text>
<rect x="590" y="208.0" width="240" height="80" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="710.0" y="230.0" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#475569">Unstructured：gather 回退</text>
<text x="710.0" y="248.0" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">rewriteAddPtrToUnstrucMemAcc</text>
<text x="710.0" y="266.0" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">（见下图 fig-m6）</text>
<line x1="270.0" y1="286" x2="270.0" y2="316" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
<text x="286.0" y="303.0" font-family="sans-serif" font-size="10" fill="#334155">否（结构化路径）</text>
<rect x="40" y="320" width="460" height="58" rx="8" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
<text x="270.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">③ 取 resultShape</text>
<text x="270.0" y="360" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#0f172a">resultShape = [4, 1]（来自 result 类型）</text>
<text x="490" y="370" text-anchor="end" font-family="sans-serif" font-size="9.5" fill="#94a3b8">L1152-L1158</text>
<line x1="270.0" y1="378" x2="270.0" y2="408" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="40" y="412" width="460" height="58" rx="8" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
<text x="270.0" y="432" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">④ known 存未修改态</text>
<text x="270.0" y="452" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#0f172a">known[result]=data（原始 stride=[4,0] 保留，供后续指针算术继续用）</text>
<text x="490" y="462" text-anchor="end" font-family="sans-serif" font-size="9.5" fill="#94a3b8">L1160</text>
<line x1="270.0" y1="470" x2="270.0" y2="500" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="40" y="504" width="460" height="74" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
<text x="270.0" y="524" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#713f12">⑤ 逆序 stride 修复</text>
<text x="270.0" y="542" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#713f12">i=1: size==1 且 stride==0 → 替成 inferedSize=1 → strides=[4,1]</text>
<text x="270.0" y="557" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#713f12">i=0: size=4≠1 → 不替；inferedSize 累积到 4</text>
<text x="490" y="570" text-anchor="end" font-family="sans-serif" font-size="9.5" fill="#94a3b8">L1170-L1177</text>
<line x1="270.0" y1="578" x2="270.0" y2="608" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="40" y="612" width="460" height="72" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="270.0" y="632" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#78350f">⑥ createCastOp + replaceOp</text>
<text x="270.0" y="652" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#78350f">reinterpret_cast offset:[%arg13] sizes:[4,1] strides:[%c4,%c1]（对齐 CHECK 输出）</text>
<text x="490" y="676" text-anchor="end" font-family="sans-serif" font-size="9.5" fill="#94a3b8">L1195,L1200</text>
<text x="40" y="736" font-family="sans-serif" font-size="10.5" fill="#0f172a">与 ch11 rewriteAddptrOp（TritonToStructured 侧，重发射规范 addptr）不同侧——本图终点是 memref.reinterpret_cast</text>
</svg>