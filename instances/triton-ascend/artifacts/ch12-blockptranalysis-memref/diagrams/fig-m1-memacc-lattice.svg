<text x="415.0" y="154" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#14532d">值 = 1</text>
<line x1="510" y1="139.0" x2="600" y2="139.0" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<text x="555.0" y="129.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">更不结构化</text>
<rect x="600" y="108" width="190" height="62" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="695.0" y="132" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#7f1d1d">UnstrucMemAcc</text>
<text x="695.0" y="154" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#7f1d1d">值 = 2</text>
<rect x="40" y="214" width="750" height="40" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="56" y="239" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#3730a3">merge 规则：value = max(this, other)  —  H:L66-L68</text>
