<text x="290.0" y="372" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#94a3b8">无因果·仅汇入 merge</text>
<rect x="140.0" y="406" width="300" height="56" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
<text x="290.0" y="430" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#7f1d1d">merge 结果 = max(1,2)</text>
