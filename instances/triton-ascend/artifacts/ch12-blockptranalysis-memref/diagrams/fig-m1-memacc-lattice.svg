<text x="150.0" y="344" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#14532d">StrucMemAcc（1）</text>
<rect x="320" y="300" width="220" height="56" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="430.0" y="324" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#7f1d1d">操作数 B（间接 load 派生）</text>
<text x="430.0" y="344" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#7f1d1d">UnstrucMemAcc（2）</text>
<line x1="150.0" y1="356" x2="290.0" y2="396" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
