<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 492">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker></defs>
<rect width="830" height="492" fill="white"/>
<text x="40" y="34" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e40af">MemAccType 三态全序格（BlockPtrAnalysis.h:L46 enum class MemAccVal）</text>
<text x="40" y="56" font-family="sans-serif" font-size="12" fill="#64748b">merge 取大（上确界）：一条地址链上任一处非结构化，都会把整链染成 UnstrucMemAcc</text>
