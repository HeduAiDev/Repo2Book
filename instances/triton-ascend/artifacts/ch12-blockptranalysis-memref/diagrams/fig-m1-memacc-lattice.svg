<text x="135.0" y="154" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">值 = 0</text>
<line x1="230" y1="139.0" x2="320" y2="139.0" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<text x="275.0" y="129.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">更不结构化</text>
<rect x="320" y="108" width="190" height="62" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
