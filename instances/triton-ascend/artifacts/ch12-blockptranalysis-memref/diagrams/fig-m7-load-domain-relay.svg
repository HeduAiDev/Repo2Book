<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 340">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker></defs>
<rect width="1060" height="340" fill="white"/>
<text x="40" y="26" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e40af">tt.load → memref.copy + to_tensor 的域接力（无 mask 主干）</text>
<text x="40" y="48" font-family="sans-serif" font-size="11.5" fill="#64748b">三条 load 路径（无 mask/boundary_check/有 mask）最后都汇到 toTensorAndReplace 这条公共尾巴</text>
<rect x="40" y="127" width="260" height="100" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="170.0" y="149" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a">步①  内存域：规整窗口</text>
<text x="170.0" y="159" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#1e3a8a">memref.reinterpret_cast</text>
<text x="170.0" y="175" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#1e3a8a">→ memref&lt;4x1xf32,</text>
<text x="170.0" y="191" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#1e3a8a">strided&lt;[?,?],offset:?&gt;&gt;</text>
<line x1="300" y1="177.0" x2="400" y2="177.0" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<text x="350.0" y="89" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#94a3b8">memref.copy</text>
<text x="350.0" y="102" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#94a3b8">(从窗口搬进本地缓冲)</text>
<text x="350.0" y="115" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#94a3b8">LoadStoreConverter.cpp:L441</text>
<rect x="400" y="127" width="260" height="100" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="530.0" y="149" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#78350f">步②  内存域：本地缓冲</text>
<text x="530.0" y="166" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#78350f">%alloc = memref.alloc()</text>
<text x="530.0" y="182" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#78350f">: memref&lt;4x1xf32&gt;</text>
<line x1="660" y1="177.0" x2="760" y2="177.0" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<text x="710.0" y="89" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#94a3b8">restrict+writable</text>
<text x="710.0" y="102" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#94a3b8">(告诉下游无别名)</text>
<text x="710.0" y="115" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#94a3b8">L86-L98 toTensorAndReplace</text>
<rect x="760" y="127" width="260" height="100" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="890.0" y="149" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#14532d">步③  计算域：认领为 tensor</text>
<text x="890.0" y="166" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#14532d">bufferization.to_tensor %alloc</text>
<text x="890.0" y="182" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#14532d">restrict writable</text>
<text x="40" y="267" font-family="sans-serif" font-size="11" fill="#0f172a">步①的 reinterpret_cast 与 fig-m3/fig-m5 是同一枚物化结果——本图接着讲它之后的内存/计算域接力</text>
<text x="40" y="289" font-family="sans-serif" font-size="10.5" fill="#64748b">达芬奇架构需要这种显式的"内存域→计算域"接力：tt.load 不是一步到位的 tensor 值</text>
