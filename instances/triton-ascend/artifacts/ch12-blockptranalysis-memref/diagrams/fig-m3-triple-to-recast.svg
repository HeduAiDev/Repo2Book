<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 496">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker></defs>
<rect width="1140" height="496" fill="white"/>
<text x="40" y="32" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e40af">createCastOp：三元组 → memref.reinterpret_cast（BlockPtrAnalysis.cpp:L322-L343）</text>
<text x="40" y="54" font-family="sans-serif" font-size="11.5" fill="#64748b">offset 槽只有一个：多维偏移必须先塌缩成总和（8+3=11），这正是 reinterpret_cast『单 offset』语义的由来</text>
<rect x="40" y="116" width="200" height="68" rx="8" fill="#93c5fd" stroke="#334155" stroke-width="1.5"/>
<text x="140.0" y="142" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e3a8a">offsets</text>
<text x="140.0" y="164" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1e3a8a">[8, 3]</text>
<rect x="40" y="224" width="200" height="68" rx="8" fill="#86efac" stroke="#334155" stroke-width="1.5"/>
<text x="140.0" y="250" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#14532d">sizes</text>
<text x="140.0" y="272" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#14532d">[4, 2]</text>
<rect x="40" y="332" width="200" height="68" rx="8" fill="#f9a8d4" stroke="#334155" stroke-width="1.5"/>
<text x="140.0" y="358" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#831843">strides</text>
<text x="140.0" y="380" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#831843">[2, 1]</text>
<line x1="240" y1="150.0" x2="370" y2="150.0" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="370" y="116" width="260" height="68" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="500.0" y="138" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#78350f">inferBlockOffset 塌缩</text>
<text x="500.0" y="158" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#78350f">0 +8 → 8 +3 → 11</text>
<text x="500.0" y="176" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#92400e">L146-L151</text>
<line x1="630" y1="150.0" x2="760" y2="140" stroke="#d97706" stroke-width="2" marker-end="url(#a)"/>
<text x="695.0" y="140.0" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#92400e">总 offset = 11</text>
<path d="M 240 258.0 L 670 258.0 L 760 140" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M 240 366.0 L 670 366.0 L 760 170" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="760" y="110" width="340" height="296" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="2.5"/>
<text x="930.0" y="136" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#312e81">memref.reinterpret_cast</text>
<text x="930.0" y="162" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3730a3">offset: [11]</text>
<text x="930.0" y="184" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3730a3">sizes: [4, 2]</text>
<text x="930.0" y="206" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3730a3">strides: [2, 1]</text>
<text x="930.0" y="392" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#4c1d95">L341-L342</text>
<text x="40" y="476" font-family="sans-serif" font-size="11" fill="#0f172a">本例：2 维 block，1 条 reinterpret_cast 完整描述 4×2=8 个元素——O(1) 条指令描述 O(N) 数据</text>
