<text x="546.6" y="196" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#7f1d1d">2</text>
<text x="630.2" y="196" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#7f1d1d">7</text>
