<text x="835.4000000000001" y="196" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#7f1d1d">107</text>
<rect x="520" y="204" width="380" height="24" fill="#fff1f2" stroke="#fca5a5" stroke-width="1"/>
<text x="546.6" y="220" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#7f1d1d">3</text>
<text x="630.2" y="220" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#7f1d1d">1</text>
<text x="729.0" y="220" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#7f1d1d">100</text>
<text x="835.4000000000001" y="220" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#7f1d1d">101</text>
<text x="520" y="246" font-family="sans-serif" font-size="9.5" fill="#7f1d1d">每轮：tensor.extract 散乱 offset → +base → combinedOffset</text>
<text x="520" y="261" font-family="sans-serif" font-size="9.5" fill="#7f1d1d">→ reinterpret_cast（单元素 sizes:[1] strides:[1]）</text>
<rect x="520" y="286" width="380" height="44" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="710.0" y="312" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#7f1d1d">4 ×(extract+recast+load) = 12 条 op = O(N)</text>
<line x1="428" y1="146" x2="512" y2="146" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)" stroke-dasharray="6,4"/>
<text x="470.0" y="136" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#94a3b8">同一块访存</text>
<text x="40" y="500" font-family="sans-serif" font-size="11" fill="#0f172a">2 vs 12 条 op：正确性优先于性能——一处间接 load 就把整链从『1 条 copy 搬整块』拖成『N 次单元素循环』</text>
</svg>