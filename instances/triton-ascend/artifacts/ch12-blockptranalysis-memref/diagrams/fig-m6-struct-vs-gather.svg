<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker></defs>
<rect width="940" height="520" fill="white"/>
<text x="40" y="26" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e40af">结构化 vs 非结构化 gather 回退：同一块访存的两种落地路径</text>
<text x="40" y="50" font-family="sans-serif" font-size="11.5" fill="#64748b">触发点：间接 load 派生地址 → UnstrucMemAcc（merge=max 全链染色）；循环上界 = blockSizes（本例 4）</text>
<text x="230.0" y="92" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#16a34a">结构化（StrucMemAcc）</text>
<rect x="40" y="106" width="380" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="230.0" y="128" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#14532d">① memref.reinterpret_cast</text>
<text x="230.0" y="148" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#14532d">整块视图（本例 4×2=8 元素，1 条描述）</text>
<line x1="230.0" y1="162" x2="230.0" y2="184" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="40" y="188" width="380" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="230.0" y="210" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#14532d">② memref.copy</text>
<text x="230.0" y="230" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#14532d">搬整块（LoadStoreConverter.cpp:L441）</text>
<rect x="40" y="330" width="380" height="44" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="230.0" y="356" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#14532d">共 2 条 op = O(1)（O(1) 描述 O(N)=8 个元素）</text>
<text x="710.0" y="92" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#dc2626">非结构化 gather 回退（rewriteAddPtrToUnstrucMemAcc）</text>
<rect x="520" y="106" width="380" height="26" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/>
<text x="546.6" y="123" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#7f1d1d">iv</text>
<text x="630.2" y="123" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#7f1d1d">散乱 offset</text>
<text x="729.0" y="123" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#7f1d1d">+base</text>
<text x="835.4000000000001" y="123" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#7f1d1d">combinedOffset</text>
