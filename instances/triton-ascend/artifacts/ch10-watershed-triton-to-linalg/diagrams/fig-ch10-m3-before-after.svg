<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 432">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker><marker id="ah" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#d97706"/></marker></defs>
<rect width="970" height="432" fill="white"/>
<text x="40" y="34" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e40af">分水岭落地：tt.addptr → memref.reinterpret_cast</text>
<text x="40" y="56" font-family="sans-serif" font-size="11.5" fill="#64748b">承 m2 还原结果 (offset=8, sizes=[4], strides=[1])；BlockDataParser::rewriteAddPtr 替换 1 处 tt.addptr</text>
<text x="210.0" y="72" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">ttir：tensor-of-pointers</text>
<rect x="80.0" y="96" width="260" height="56" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.2"/>
<text x="210.0" y="120.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a" font-weight="normal">tt.splat %x_ptr</text>
<text x="210.0" y="135.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a" font-weight="normal">: tensor&lt;4x!tt.ptr&lt;f32&gt;&gt;</text>
<line x1="210.0" y1="152" x2="210.0" y2="174" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="80.0" y="176" width="260" height="56" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.2"/>
<text x="210.0" y="200.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a" font-weight="normal">偏移已还原（m2）</text>
<text x="210.0" y="215.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a" font-weight="normal">offset=8, size=4, stride=1</text>
<line x1="210.0" y1="232" x2="210.0" y2="254" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="80.0" y="256" width="260" height="96" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2.5"/>
<text x="210.0" y="292.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b91c1c" font-weight="bold">tt.addptr %xptr_t, %off</text>
<text x="210.0" y="307.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b91c1c" font-weight="bold">: tensor&lt;4x!tt.ptr&lt;f32&gt;&gt;</text>
<text x="210.0" y="322.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b91c1c" font-weight="bold">（4 路各算各的门牌号）</text>
<text x="760.0" y="72" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">ttadapter：结构化 memref</text>
<rect x="630.0" y="96" width="260" height="56" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.2"/>
<text x="760.0" y="120.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a" font-weight="normal">tt.splat %x_ptr</text>
<text x="760.0" y="135.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a" font-weight="normal">: tensor&lt;4x!tt.ptr&lt;f32&gt;&gt;</text>
<line x1="760.0" y1="152" x2="760.0" y2="174" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="630.0" y="176" width="260" height="56" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.2"/>
<text x="760.0" y="200.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a" font-weight="normal">偏移已还原（m2）</text>
<text x="760.0" y="215.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a" font-weight="normal">offset=8, size=4, stride=1</text>
<line x1="760.0" y1="232" x2="760.0" y2="254" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="630.0" y="256" width="260" height="96" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<text x="760.0" y="284.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#15803d" font-weight="bold">memref.reinterpret_cast %x_ptr</text>
<text x="760.0" y="299.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#15803d" font-weight="bold">to offset:[8], sizes:[4], strides:[1]</text>
<text x="760.0" y="314.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#15803d" font-weight="bold">: memref&lt;4xf32,</text>
<text x="760.0" y="329.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#15803d" font-weight="bold">strided&lt;[1], offset:8&gt;&gt;</text>
<line x1="354.0" y1="304.0" x2="616.0" y2="304.0" stroke="#d97706" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="485.0" y="274.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#92400e">BlockDataParser::</text>
<text x="485.0" y="290.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#92400e">rewriteAddPtr</text>
<text x="485.0" y="322.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#92400e">替换 1 处 tt.addptr</text>
<text x="40" y="416" font-family="sans-serif" font-size="11" fill="#64748b">同一段访存，从『4 路各自解引用的指针』变成『1 条带 (offset,sizes,strides) 的结构化视图』——昇腾达芬奇吃的正是右边这种 memref</text>
</svg>