<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 786">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#475569"/></marker><marker id="dash" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#94a3b8"/></marker></defs>
<rect width="1080" height="786" fill="white"/>
<text x="540.0" y="34" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#0f172a">Cube / Vector 双核分工：写死在算子基类 Trait 上的静态属性</text>
<text x="540.0" y="58" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">func_core_type(AIC/AIV/MIX) 决定整核落哪个物理核；单个算子的核归属由其基类 Trait 编译期钉死，不靠运行时判断</text>
<text x="540.0" y="116" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#475569">func_core_type 三态（函数级，决定整核落哪个物理核）</text>
<rect x="295.0" y="130" width="150" height="58" rx="8" fill="#bbf7d0" stroke="#15803d" stroke-width="2"/>
<text x="370.0" y="154" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#14532d">AIV</text>
<text x="370.0" y="174" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#14532d">纯 Vector</text>
<rect x="465.0" y="130" width="150" height="58" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2" stroke-dasharray="5,4"/>
<text x="540.0" y="154" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#334155">MIX</text>
<text x="540.0" y="174" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">混合(拆子核)</text>
<rect x="635.0" y="130" width="150" height="58" rx="8" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/>
<text x="710.0" y="154" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#7c2d12">AIC</text>
<text x="710.0" y="174" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7c2d12">纯 Cube</text>
<line x1="370.0" y1="188" x2="280.0" y2="258" stroke="#15803d" stroke-width="2" marker-end="url(#a)"/>
<path d="M 540.0 188 L 800.0 258" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#dash)"/>
<path d="M 540.0 188 L 280.0 258" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#dash)"/>
<line x1="710.0" y1="188" x2="800.0" y2="258" stroke="#c2410c" stroke-width="2" marker-end="url(#a)"/>
<rect x="50" y="258" width="460" height="40" rx="8" fill="#15803d"/>
<text x="280.0" y="284" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="white">Vector 泳道（AIV）</text>
<line x1="280.0" y1="298" x2="280.0" y2="576" stroke="#15803d" stroke-width="1.2" stroke-dasharray="3,4"/>
<rect x="570" y="258" width="460" height="40" rx="8" fill="#c2410c"/>
<text x="800.0" y="284" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="white">Cube 泳道（AIC）</text>
<line x1="800.0" y1="298" x2="800.0" y2="576" stroke="#c2410c" stroke-width="1.2" stroke-dasharray="3,4"/>
<rect x="50" y="312" width="460" height="82" rx="8" fill="#bbf7d0" stroke="#15803d" stroke-width="1.6"/>
<text x="66" y="332" font-family="sans-serif" font-size="11" font-weight="bold" fill="#14532d">核 Trait</text>
<text x="280.0" y="358" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#14532d">VectorCoreTypeTrait(AIV 向量核)</text>
<text x="280.0" y="380" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#14532d">HIVMVectorOps.td:L34</text>
<rect x="570" y="312" width="460" height="82" rx="8" fill="#fed7aa" stroke="#c2410c" stroke-width="1.6"/>
<text x="586" y="332" font-family="sans-serif" font-size="11" font-weight="bold" fill="#7c2d12">核 Trait</text>
<text x="800.0" y="358" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#7c2d12">CubeCoreTypeTrait(AIC 矩阵核)</text>
<text x="800.0" y="380" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7c2d12">HIVMMacroOps.td:L60</text>
<rect x="50" y="408" width="460" height="82" rx="8" fill="#bbf7d0" stroke="#15803d" stroke-width="1.6"/>
<text x="66" y="428" font-family="sans-serif" font-size="11" font-weight="bold" fill="#14532d">流水 + 缓冲</text>
<text x="280.0" y="454" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#14532d">PIPE_V / 落 UB</text>
<text x="280.0" y="476" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#14532d">HIVMVectorOps.td:L34；InferHIVMMemScope.cpp:L457 AIV→UB 兜底</text>
<rect x="570" y="408" width="460" height="82" rx="8" fill="#fed7aa" stroke="#c2410c" stroke-width="1.6"/>
<text x="586" y="428" font-family="sans-serif" font-size="11" font-weight="bold" fill="#7c2d12">流水 + 缓冲</text>
<text x="800.0" y="454" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#7c2d12">MTE1+M / 走 L1→L0A/L0B→L0C</text>
<text x="800.0" y="476" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7c2d12">HIVMMacroOps.td:L62 MacroOpPipeTrait&lt;PIPE_MTE1,PIPE_M&gt;</text>
<rect x="50" y="504" width="460" height="82" rx="8" fill="#bbf7d0" stroke="#15803d" stroke-width="1.6"/>
<text x="66" y="524" font-family="sans-serif" font-size="11" font-weight="bold" fill="#14532d">代表算子</text>
<text x="280.0" y="550" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#14532d">vadd / vexp / vreduce…(40+)</text>
<text x="280.0" y="572" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#14532d">HIVM 向量算子族，全部继承 HIVM_VectorOp</text>
<rect x="570" y="504" width="460" height="82" rx="8" fill="#fed7aa" stroke="#c2410c" stroke-width="1.6"/>
<text x="586" y="524" font-family="sans-serif" font-size="11" font-weight="bold" fill="#7c2d12">代表算子</text>
<text x="800.0" y="550" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#7c2d12">mmadL1(C=C+A×B)</text>
<text x="800.0" y="572" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7c2d12">HIVMMacroOps.td:L163</text>
<text x="50" y="616" font-family="sans-serif" font-size="12" fill="#334155">两条泳道的核归属是编译期就钉死的静态 Trait：向量算子一律 VectorCoreTypeTrait+PIPE_V 落 UB，mmad 一律 CubeCoreTypeTrait+MTE1/M 走 L1/L0x。</text>
<text x="50" y="638" font-family="sans-serif" font-size="12" fill="#334155">正因为核归属是算子属性而非运行时判断，编译器才能据此把 MIX 核安全拆成 AIC/AIV 子核。</text>
</svg>