<text x="66" y="563" font-family="monospace" font-size="15" fill="#e2e8f0">IR 里实际长相：memref&lt;128x128xf16, #hivm.address_space&lt;cbuf&gt;&gt;</text>
<text x="50" y="610" font-family="sans-serif" font-size="12" fill="#334155">六级内存层级(Zero 哨兵不算)按枚举值 1..6 排布：GM 在片外、其余五级在片上；Cube 侧独占 L0A/L0B/L0C、Vector 侧独占 UB、L1 是二者共享的暂存 —— memref 类型尾巴上的 &lt;cbuf&gt;/&lt;cc&gt;/&lt;gm&gt; 就是这套枚举的助记符。</text>
