<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 832">
<defs><marker id="mte2" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#1d4ed8"/></marker><marker id="mte3" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#c2410c"/></marker><marker id="fix" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#7e22ce"/></marker><marker id="pv" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#15803d"/></marker></defs>
<rect width="1110" height="832" fill="white"/>
<text x="555.0" y="34" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#0f172a">DMA 算子族：方向与硬件流水引擎一一对应</text>
<text x="555.0" y="58" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#64748b">load(GM→UB,MTE2) / store(UB→GM,MTE3) / fixpipe(L0C→GM|L1|UB,FIX) —— HIVMDMAOps.td</text>
<text x="50" y="100" font-family="sans-serif" font-size="13" font-weight="bold" fill="#475569">① Vector 核数据流骨架：GM → (load) UB → 向量算子 → (store) GM</text>
<rect x="50" y="260" width="190" height="76" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="2.4"/>
<text x="145.0" y="290" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#3730a3">GM</text>
<text x="145.0" y="312" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3730a3">全局内存</text>
<rect x="460" y="260" width="190" height="76" rx="10" fill="#bbf7d0" stroke="#15803d" stroke-width="2.4"/>
<text x="555.0" y="290" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#14532d">UB</text>
<text x="555.0" y="312" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#14532d">Vector 工作缓冲</text>
<line x1="240" y1="298.0" x2="460" y2="298.0" stroke="#1d4ed8" stroke-width="2.6" marker-end="url(#mte2)"/>
<text x="350.0" y="284.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#1d4ed8">load：PIPE_MTE2</text>
<text x="350.0" y="320.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#1d4ed8">ins(gm) outs(ub)</text>
<path d="M 507.5 260 C 507.5 150 192.5 150 192.5 260" fill="none" stroke="#c2410c" stroke-width="2.4" marker-end="url(#mte3)"/>
<text x="350.0" y="142" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#c2410c">store：PIPE_MTE3</text>
<path d="M 515.0 350 C 485.0 396 625.0 396 595.0 350" fill="none" stroke="#15803d" stroke-width="2.2" marker-end="url(#pv)"/>
<text x="555.0" y="418" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#15803d">PIPE_V 向量算子（多个，在 UB 上算）</text>
<text x="145.0" y="454" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#94a3b8">HIVMDMAOps.td:L64/L81-82（load）</text>
<text x="555.0" y="454" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#94a3b8">HIVMDMAOps.td:L146/L160（store）</text>
<text x="50" y="562" font-family="sans-serif" font-size="13" font-weight="bold" fill="#475569">② fixpipe：Cube 收尾，L0C 三路扇出（PIPE_FIX）</text>
<rect x="50" y="586" width="190" height="76" rx="10" fill="#fed7aa" stroke="#c2410c" stroke-width="2.4"/>
<text x="145.0" y="616" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#7c2d12">L0C</text>
<text x="145.0" y="638" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7c2d12">Cube 累加器</text>
<rect x="460" y="486.0" width="190" height="76" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="2.4"/>
<text x="555.0" y="516.0" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#3730a3">GM(OUT)</text>
<text x="555.0" y="538.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3730a3"></text>
<path d="M 240 624.0 L 460 524.0" fill="none" stroke="#7e22ce" stroke-width="2.2" marker-end="url(#fix)"/>
<rect x="460" y="586.0" width="190" height="76" rx="10" fill="#fef9c3" stroke="#a16207" stroke-width="2.4"/>
<text x="555.0" y="616.0" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#78350f">L1</text>
<text x="555.0" y="638.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#78350f"></text>
<path d="M 240 624.0 L 460 624.0" fill="none" stroke="#7e22ce" stroke-width="2.2" marker-end="url(#fix)"/>
<rect x="460" y="686.0" width="190" height="76" rx="10" fill="#bbf7d0" stroke="#15803d" stroke-width="2.4"/>
<text x="555.0" y="716.0" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#14532d">UB</text>
<text x="555.0" y="738.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#14532d"></text>
<path d="M 240 624.0 L 460 724.0" fill="none" stroke="#7e22ce" stroke-width="2.2" marker-end="url(#fix)"/>
<text x="350.0" y="614.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#7e22ce">fixpipe：PIPE_FIX</text>
<text x="50" y="692" font-family="sans-serif" font-size="10" fill="#94a3b8">HIVMDMAOps.td:L272/L280-283 L0C to OUT/L1/UB</text>
<text x="50" y="772" font-family="sans-serif" font-size="12" fill="#334155">内存墙的「搬运」在 IR 上就是 DMA 算子：每个算子锁定一个源→目标方向和一条专用硬件传输引擎（MTE2/MTE3/FIX）。</text>
<text x="50" y="794" font-family="sans-serif" font-size="12" fill="#334155">Vector 核数据流 = load(MTE2) 进 UB → 一串向量算子在 UB 上算 → store(MTE3) 回 GM；Cube 核收尾由 fixpipe(FIX) 把 L0C 累加结果搬出。</text>
</svg>