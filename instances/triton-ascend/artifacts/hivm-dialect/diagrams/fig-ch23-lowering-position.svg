<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 526">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker><marker id="gray" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#94a3b8"/></marker></defs>
<rect width="1200" height="526" fill="white"/>
<text x="600.0" y="34" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#0f172a">HIVM 在 bishengir 下降链上的位置：convert-hfusion-to-hivm</text>
<text x="600.0" y="58" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#64748b">入口 pass 的 ConversionTarget 把 linalg + hfusion 判 illegal（必须消灭），把 hivm 判 legal（下降目标）</text>
<rect x="50" y="150" width="300" height="116" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2.6"/>
<text x="200.0" y="180" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#7f1d1d">linalg + hfusion</text>
<text x="200.0" y="206" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#7f1d1d">融合张量 IR</text>
<text x="200.0" y="226" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#7f1d1d">内存层级隐式</text>
<rect x="133.67000000000002" y="118" width="132.66" height="20" rx="10" fill="white" stroke="#b91c1c" stroke-width="1.4"/>
<text x="200.0" y="132" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#b91c1c">illegal（必须消灭）</text>
<rect x="450" y="150" width="300" height="116" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.6"/>
<text x="600.0" y="180" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e3a8a">hivm(HIVMDialect)</text>
<text x="600.0" y="206" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1e3a8a">Cube/Vector 算子</text>
<text x="600.0" y="226" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1e3a8a">带 address_space 类型</text>
<rect x="540.05" y="118" width="119.9" height="20" rx="10" fill="white" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="600.0" y="132" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1d4ed8">legal（下降目标）</text>
<rect x="850" y="150" width="300" height="116" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
<text x="1000.0" y="180" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#334155">Standard / AscendC</text>
<text x="1000.0" y="206" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#334155">下一层，超本章范围</text>
<line x1="354" y1="208.0" x2="446" y2="208.0" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<text x="400.0" y="194.0" text-anchor="middle" font-family="sans-serif" font-size="9.0" font-weight="bold" fill="#334155">convert-hfusion-to-hivm</text>
<line x1="754" y1="208.0" x2="846" y2="208.0" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#gray)"/>
<text x="800.0" y="194.0" text-anchor="middle" font-family="sans-serif" font-size="9.0" font-weight="bold" fill="#94a3b8">HIVMToStandard 等（超本章）</text>
<text x="200.0" y="296" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#94a3b8">HFusionToHIVM.cpp:L1183</text>
<text x="600.0" y="296" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#94a3b8">HFusionToHIVM.cpp:L1178</text>
<rect x="50" y="336" width="1100" height="96" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
<text x="68" y="362" font-family="sans-serif" font-size="13" font-weight="bold" fill="#166534">HIVM 之下仍存活的宿主方言（未被 ConversionTarget 判 illegal，不参与本次转换）</text>
<text x="68" y="386" font-family="sans-serif" font-size="13" font-weight="bold" fill="#15803d">memref / tensor / arith / scf / func</text>
<text x="68" y="408" font-family="sans-serif" font-size="11" fill="#4d7c0f">HFusionToHIVM.cpp:L1178-L1182 —— 这些方言的算子原样保留在 HIVM 层的函数体里，和 hivm.* 算子混排。</text>
<text x="50" y="462" font-family="sans-serif" font-size="12" fill="#334155">融合张量 IR 经 convert-hfusion-to-hivm 落到 HIVM 层：linalg/hfusion 判 illegal 全部消灭，hivm 成为唯一合法目标——这一步之后，内存层级从「隐式」变成写在 memref 类型上的「可静态检查对象」。</text>
</svg>