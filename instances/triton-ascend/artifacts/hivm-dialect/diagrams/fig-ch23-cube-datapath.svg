<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1310 542">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker></defs>
<rect width="1310" height="542" fill="white"/>
<text x="655.0" y="34" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#0f172a">Cube 矩阵路径：六级内存里用满五级的完整数据通路</text>
<text x="655.0" y="58" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#64748b">L1 输入 →(MTE1) L0A/L0B(mmadL1 内部) →(M 乘累加) L0C 驻留累加 →(FIX,fixpipe) GM</text>
<rect x="354" y="116" width="222" height="162" rx="12" fill="none" stroke="#cbd5e1" stroke-width="1.6" stroke-dasharray="7,5"/>
<text x="465.0" y="136" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#64748b">mmadL1 宏算子内部（不对外暴露）</text>
<rect x="50" y="150" width="190" height="92" rx="10" fill="#fef9c3" stroke="#a16207" stroke-width="2.4"/>
<text x="145.0" y="178" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#78350f">L1(cbuf)</text>
<text x="145.0" y="202" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#78350f">输入 A/B 驻留</text>
<rect x="370" y="150" width="190" height="92" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2.4"/>
<text x="465.0" y="178" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#475569">L0A/L0B(ca/cb)</text>
<text x="465.0" y="202" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#475569">mmadL1 内部缓冲</text>
<text x="465.0" y="220" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#475569">不出现在操作数上</text>
<rect x="750" y="150" width="190" height="92" rx="10" fill="#fed7aa" stroke="#c2410c" stroke-width="2.4"/>
<text x="845.0" y="178" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#7c2d12">L0C(cc)</text>
<text x="845.0" y="202" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#7c2d12">C 累加器驻留</text>
<text x="845.0" y="220" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#7c2d12">C += A×B（K 轮不回写）</text>
<rect x="1070" y="150" width="190" height="92" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="2.4"/>
<text x="1165.0" y="178" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#3730a3">GM</text>
<text x="1165.0" y="202" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#3730a3">收尾搬出</text>
<line x1="244" y1="196.0" x2="366" y2="196.0" stroke="#334155" stroke-width="2.2" marker-end="url(#a)"/>
<text x="305.0" y="180.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#334155">MTE1</text>
<text x="305.0" y="216.0" text-anchor="middle" font-family="sans-serif" font-size="9.0" fill="#64748b">L1 → L0A/L0B（宏算子内部流水）</text>
<line x1="564" y1="196.0" x2="746" y2="196.0" stroke="#334155" stroke-width="2.2" marker-end="url(#a)"/>
<text x="655.0" y="180.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#334155">M（Cube 矩阵单元）</text>
<text x="655.0" y="216.0" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#64748b">乘累加 A×B → 写入 L0C</text>
<line x1="944" y1="196.0" x2="1066" y2="196.0" stroke="#334155" stroke-width="2.2" marker-end="url(#a)"/>
<text x="1005.0" y="180.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#334155">FIX（fixpipe）</text>
<text x="1005.0" y="216.0" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#64748b">L0C → GM，K 轮只搬这一次</text>
<text x="145.0" y="312" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#94a3b8">HIVMMacroOps.td:L166；夹具 L11/L13 CHECK &lt;cbuf&gt;</text>
<text x="465.0" y="312" text-anchor="middle" font-family="sans-serif" font-size="9.0" fill="#94a3b8">HIVMMacroOps.td:L62 MacroOpPipeTrait&lt;PIPE_MTE1,PIPE_M&gt;</text>
<text x="845.0" y="312" text-anchor="middle" font-family="sans-serif" font-size="9.0" fill="#94a3b8">InferHIVMMemScope.cpp:L228-229；夹具 L7/L33 CHECK &lt;cc&gt;</text>
<text x="1165.0" y="312" text-anchor="middle" font-family="sans-serif" font-size="9.0" fill="#94a3b8">HIVMDMAOps.td:L272,L280；夹具 L57 fixpipe ins(cc) outs(gm)</text>
<text x="50" y="358" font-family="sans-serif" font-size="12" fill="#334155">Cube 路径闭环：A/B 从 L1 经 MTE1 进内部工位 L0A/L0B，M 单元把乘积累加进 L0C 上常驻的 C</text>
<text x="50" y="380" font-family="sans-serif" font-size="12" fill="#334155">（K 方向每轮 C+=A×B、不回写），整批算完由 fixpipe 一次搬回 GM —— 六级里用满五级，且 L0A/L0B 被宏算子藏在内部。</text>
</svg>