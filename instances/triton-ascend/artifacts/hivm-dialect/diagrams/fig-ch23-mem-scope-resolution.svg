<text x="152" y="602" font-family="sans-serif" font-size="13" font-weight="bold" fill="#581c87">级联传播：scf.for iter_arg/结果 → 随 C 变 cc</text>
<text x="152" y="624" font-family="sans-serif" font-size="9.5" fill="#7e22ce">propagateMemScopeToUsers：InferHIVMMemScope.cpp:L65-L144；夹具 L38-39</text>
<text x="50" y="566" font-family="sans-serif" font-size="11" font-weight="bold" fill="#7e22ce">级联传播（不是第五个优先级，是附加在任意步骤结果之上的后续过程）</text>
<text x="50" y="682" font-family="sans-serif" font-size="12" fill="#334155">把「内存墙摆到类型里」是一次带优先级的类型推断：硬约束（矩阵三件套）最先钉死、边界数据（参数）其次，</text>
<text x="50" y="704" font-family="sans-serif" font-size="12" fill="#334155">剩下的按「这是 Cube 核还是 Vector 核」兜底，再沿数据流级联到 scf.for —— 次序不可乱，先定的 L1/L0C 不会被后面的 UB 兜底覆盖。</text>
