<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 600">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker><marker id="b" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#1d4ed8"/></marker><marker id="o" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#c2410c"/></marker><marker id="rd" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#b91c1c"/></marker></defs>
<rect width="1420" height="600" fill="white"/>
<text x="710.0" y="34" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#0f172a">ascend_cast_impl 决策树:两条粗线是本章要记住的</text>
<text x="710.0" y="56" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">递归深度上界 2:内层目标恒为 float32,float32 不再满足任何触发递归的条件</text>
<rect x="580.0" y="82" width="260" height="44" rx="9" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
<text x="710.0" y="109.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">ascend_cast(src, dst, builder)</text>
<path d="M 710.0 126 L 240 170" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="145" y="170" width="190" height="44" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<text x="240" y="188" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#334155">src∈{fp16,bf16}</text>
<text x="240" y="206" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#334155">dst≠fp32?</text>
<path d="M 710.0 126 L 710.0 170" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="615.0" y="170" width="190" height="44" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<text x="710.0" y="188" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#334155">saturate</text>
<text x="710.0" y="206" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#334155">整型收窄?</text>
<path d="M 710.0 126 L 1180 170" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="1085" y="170" width="190" height="44" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<text x="1180" y="188" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#334155">其余(直发)</text>
<path d="M 240 214 L 240 300" fill="none" stroke="#1d4ed8" stroke-width="2.4" marker-end="url(#b)"/>
<text x="248" y="257.0" font-family="sans-serif" font-size="10.5" fill="#1d4ed8">是</text>
<rect x="65" y="300" width="350" height="92" rx="9" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.4"/>
<text x="240.0" y="322" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a">第一跳:先转 float32(内层递归)</text>
<text x="240.0" y="346" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e40af">例 bf16 → fp16:2 条算子</text>
<text x="240.0" y="370" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e40af">create_fp_ext(→fp32) + create_fp_trunc(→fp16)</text>
<rect x="65" y="414" width="350" height="56" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
<text x="240.0" y="436" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#334155">对照:fp32 → int32(dst 已是判据外)</text>
<text x="240.0" y="456" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">1 条算子:create_fp_to_si,不递归</text>
<path d="M 710.0 214 L 710.0 300" fill="none" stroke="#c2410c" stroke-width="2.4" marker-end="url(#o)"/>
<text x="718.0" y="257.0" font-family="sans-serif" font-size="10.5" fill="#c2410c">是</text>
<text x="780.0" y="271.0" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#334155">(按芯片分叉)</text>
<rect x="485.0" y="306" width="210" height="100" rx="9" fill="#fff7ed" stroke="#c2410c" stroke-width="2.2"/>
<text x="590.0" y="326" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#7c2d12">910_95</text>
<text x="590.0" y="346" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#9a3412">uint32→int16 saturate:</text>
<text x="590.0" y="366" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#9a3412">1 条 create_int_cast</text>
<text x="590.0" y="386" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#9a3412">+ 2 条 compile_hint</text>
<rect x="725.0" y="306" width="210" height="100" rx="9" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
<text x="830.0" y="326" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#7f1d1d">非 910_95</text>
<text x="830.0" y="346" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#991b1b">同一收窄:绕道 fp32</text>
<text x="830.0" y="366" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#991b1b">2 条算子(ui_to_fp+fp_to_si)</text>
<text x="830.0" y="386" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#991b1b">0 条 compile_hint</text>
<path d="M 1180 214 L 1180 300" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
<rect x="1025" y="300" width="310" height="70" rx="9" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6"/>
<text x="1180.0" y="322" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155">直接发一条转换算子</text>
<text x="1180.0" y="344" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#475569">例 int32→int1:create_splat + create_icmpNE</text>
<rect x="1025" y="394" width="310" height="70" rx="9" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="1180.0" y="416" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#b91c1c">非 910_95 硬拒绝</text>
<text x="1180.0" y="438" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#b91c1c">fp8e4nv/fp64 → ValueError</text>
<text x="1180.0" y="456" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#b91c1c">(unsupported on Ascend for now)</text>
<rect x="50" y="504" width="1320" height="76" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
<text x="66" y="530" font-family="sans-serif" font-size="11.5" fill="#334155">8 组用例里 7 组被接受、1 组被拒;转换算子条数只有 1 或 2 两种取值。</text>
<text x="66" y="554" font-family="sans-serif" font-size="11.5" fill="#334155">递归深度上界 2:两处触发递归的写法都是 ascend_cast_impl(ascend_cast_impl(input, tl.float32, builder), dst, builder),内层目标恒为 float32(vec_ops.py:L445-447、L484-485)。</text>
</svg>