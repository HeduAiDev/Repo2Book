<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 752">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker></defs>
<rect width="1180" height="752" fill="white"/>
<text x="590.0" y="34" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#0f172a">flip 的两条路:同一个 API,SIMD 一条算子 vs SIMT 展开成 log2(n) 轮</text>
<text x="590.0" y="56" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">分叉判据:builder.is_simt_mode()  ·  两条路入口是同一个 flip()</text>
<text x="220.0" y="90" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1d4ed8">SIMD 模式</text>
<rect x="95.0" y="130" width="250" height="50" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.2"/>
<text x="220.0" y="160.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1d4ed8">create_flip(shape[4,8], dim=1)</text>
<text x="220.0" y="210" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1e40af">1 次 builder 调用</text>
<text x="220.0" y="234" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">硬件有整排翻转指令,喊一声就好</text>
<text x="700.0" y="90" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#c2410c">SIMT 模式(n=4)</text>
<rect x="575.0" y="130" width="250" height="40" rx="7" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
<text x="700.0" y="155.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">bitcast</text>
<line x1="700.0" y1="170" x2="700.0" y2="181" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="575.0" y="184" width="250" height="40" rx="7" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
<text x="700.0" y="209.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">reshape → (2,2)</text>
<line x1="700.0" y1="224" x2="700.0" y2="235" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="575.0" y="238" width="250" height="40" rx="7" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
<text x="700.0" y="263.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#9a3412">reduce(第 1 轮)</text>
<line x1="700.0" y1="278" x2="700.0" y2="289" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="575.0" y="292" width="250" height="40" rx="7" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
<text x="700.0" y="317.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#9a3412">xor-swap(第 1 轮)</text>
<line x1="700.0" y1="332" x2="700.0" y2="343" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="575.0" y="346" width="250" height="40" rx="7" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
<text x="700.0" y="371.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#9a3412">reduce(第 2 轮)</text>
<line x1="700.0" y1="386" x2="700.0" y2="397" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="575.0" y="400" width="250" height="40" rx="7" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
<text x="700.0" y="425.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#9a3412">xor-swap(第 2 轮)</text>
<line x1="700.0" y1="440" x2="700.0" y2="451" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="575.0" y="454" width="250" height="40" rx="7" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
<text x="700.0" y="479.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">reshape → (4,)</text>
<line x1="700.0" y1="494" x2="700.0" y2="505" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="575.0" y="508" width="250" height="40" rx="7" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
<text x="700.0" y="533.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">bitcast</text>
<path d="M 845.0 238 L 855.0 238 L 855.0 332 L 845.0 332" fill="none" stroke="#c2410c" stroke-width="1.6"/>
<text x="863.0" y="289.0" font-family="sans-serif" font-size="11" font-weight="bold" fill="#c2410c">第1轮</text>
<path d="M 845.0 346 L 855.0 346 L 855.0 440 L 845.0 440" fill="none" stroke="#c2410c" stroke-width="1.6"/>
<text x="863.0" y="397.0" font-family="sans-serif" font-size="11" font-weight="bold" fill="#c2410c">第2轮</text>
<text x="700.0" y="578" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#c2410c">共 8 次 builder 调用(log2(4)=2 轮,每轮 reduce+xor 共 2 次)</text>
<text x="460.0" y="155.0" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#64748b">同一个</text>
<text x="460.0" y="181.0" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#64748b">flip()</text>
<rect x="50" y="622" width="1080" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
<text x="66" y="648" font-family="sans-serif" font-size="12" fill="#334155">n=8 时:3 轮 xor-swap,中间 shape 是 (2,2,2),共 10 次 builder 调用(2 bitcast + 2 reshape + 3×2 轮)。</text>
<text x="66" y="674" font-family="sans-serif" font-size="12" fill="#334155">SIMT 前置条件:n 必须是 2 的幂(core.static_assert(_is_power_of_two(...)));n=3 时 static assertion failed。</text>
<text x="66" y="700" font-family="sans-serif" font-size="12" fill="#334155">SIMD 恒为 1 次调用,与 n 无关 —— 硬件的整排翻转指令不关心长度。</text>
</svg>