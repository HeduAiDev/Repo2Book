<text x="50" y="566" font-family="sans-serif" font-size="11" fill="#64748b">同一块 2x2 数据:gather_out_to_ub 要 4 次逐元素地址计算,index_select_simd 只发 2 次 tile 读——访存请求数从 numel(index) 降到 len(index)。</text>
<text x="50" y="586" font-family="sans-serif" font-size="11" fill="#64748b">代价:index_select_simd 没有 index_boundary 形参(mem_ops.py:L485-521),docstring 明写 does not check if index contains out-of-bounds values。</text>
<text x="50" y="606" font-family="sans-serif" font-size="11" fill="#64748b">占位协议:read_shape[dim] 必须是 -1,src_offset[dim] 被忽略;返回 shape = index 长度(dim 轴)拼 read_shape 其余轴,如 index 长 4 + read_shape(4,-1,128) → (4,4,128)。</text>
