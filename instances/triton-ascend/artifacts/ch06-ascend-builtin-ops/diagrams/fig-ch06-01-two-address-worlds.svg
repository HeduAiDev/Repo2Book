<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 826">
<defs><marker id="gray" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#94a3b8"/></marker><marker id="blue" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#1d4ed8"/></marker><marker id="red" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#b91c1c"/></marker></defs>
<rect width="1500" height="826" fill="white"/>
<text x="750.0" y="34" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#0f172a">两个寻址世界的接缝:GM 只有地址,片上有名字</text>
<text x="750.0" y="58" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#64748b">.td 定义 7 档 address space → pybind 只导出 5 档 → Zero 与 GM 根本不进 Python</text>
<text x="750.0" y="77" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#64748b">四个 mem_ops 内建就是横跨两侧的唯一带索引通道:左边永远是 GM 裸指针,右边永远是 UB tile</text>
<rect x="50" y="94" width="1400" height="92" rx="10" fill="#fbfbfc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="66" y="114" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#475569">① HIVMAttrs.td:L188-194 定义 7 档 address space</text>
<rect x="66" y="130" width="178" height="42" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.8" stroke-dasharray="6,4"/>
<text x="155.0" y="148" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#7f1d1d">Zero = 0</text>
<text x="155.0" y="164" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="bold" fill="#b91c1c">✗ 未导出</text>
<rect x="252" y="130" width="178" height="42" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.8" stroke-dasharray="6,4"/>
<text x="341.0" y="148" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#7f1d1d">GM = 1</text>
<text x="341.0" y="164" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="bold" fill="#b91c1c">✗ 未导出</text>
<rect x="438" y="130" width="178" height="42" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/>
<text x="527.0" y="148" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155">L1 = 2</text>
<text x="527.0" y="164" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="bold" fill="#15803d">✓ 导出</text>
<rect x="624" y="130" width="178" height="42" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/>
<text x="713.0" y="148" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155">L0A = 3</text>
<text x="713.0" y="164" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="bold" fill="#15803d">✓ 导出</text>
<rect x="810" y="130" width="178" height="42" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/>
<text x="899.0" y="148" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155">L0B = 4</text>
<text x="899.0" y="164" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="bold" fill="#15803d">✓ 导出</text>
<rect x="996" y="130" width="178" height="42" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/>
<text x="1085.0" y="148" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155">L0C = 5</text>
<text x="1085.0" y="164" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="bold" fill="#15803d">✓ 导出</text>
<rect x="1182" y="130" width="178" height="42" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/>
<text x="1271.0" y="148" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155">UB = 6</text>
<text x="1271.0" y="164" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="bold" fill="#15803d">✓ 导出</text>
<text x="750.0" y="212" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">② ascend_ir.cc:L412-417 的 pybind 边界:py::enum_ 只导出 5 档</text>
<line x1="50" y1="222" x2="1450" y2="222" stroke="#0f172a" stroke-width="2.4" stroke-dasharray="12,6"/>
<text x="50" y="272" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#475569">③ 两个寻址世界</text>
<rect x="110" y="300" width="330" height="150" rx="12" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.2" stroke-dasharray="8,5"/>
<text x="275.0" y="334" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#7f1d1d">GM 世界(公共货场)</text>
<text x="275.0" y="362" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#9a3412">Python 层只有裸指针</text>
<text x="275.0" y="390" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#9a3412">写不出 space = GM 的 buffer</text>
<text x="275.0" y="418" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#9a3412">(Zero / GM 不进 Python)</text>
<rect x="1060" y="300" width="330" height="150" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.2"/>
<text x="1225.0" y="334" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1e3a8a">片上世界(带标签的货架)</text>
<text x="1225.0" y="362" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1e40af">UB tile:5 档 address space 之一</text>
<text x="1225.0" y="390" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1e40af">Python 能直接 bl.alloc / 引用</text>
<text x="1225.0" y="418" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e40af">(L1/UB/L0A/L0B/L0C 都有名字)</text>
<text x="750.0" y="286" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155">④ 接缝:4 个跨 GM 带索引内建(mem_ops.py:L40-636)</text>
<line x1="444" y1="308" x2="1056" y2="308" stroke="#1d4ed8" stroke-width="2" marker-end="url(#blue)"/>
<text x="750.0" y="302" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1d4ed8">index_put</text>
<rect x="695.9" y="312" width="108.2" height="16" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
<text x="750.0" y="323.5" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="bold" fill="#1d4ed8">有 index_boundary</text>
<line x1="444" y1="345" x2="1056" y2="345" stroke="#1d4ed8" stroke-width="2" marker-end="url(#blue)"/>
<text x="750.0" y="339" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1d4ed8">gather_out_to_ub</text>
<rect x="695.9" y="349" width="108.2" height="16" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
<text x="750.0" y="360.5" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="bold" fill="#1d4ed8">有 index_boundary</text>
<line x1="444" y1="382" x2="1056" y2="382" stroke="#1d4ed8" stroke-width="2" marker-end="url(#blue)"/>
<text x="750.0" y="376" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1d4ed8">scatter_ub_to_out</text>
<rect x="695.9" y="386" width="108.2" height="16" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
<text x="750.0" y="397.5" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="bold" fill="#1d4ed8">有 index_boundary</text>
<line x1="444" y1="419" x2="1056" y2="419" stroke="#b91c1c" stroke-width="2" marker-end="url(#red)"/>
<text x="750.0" y="413" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#b91c1c">index_select_simd</text>
<rect x="661.2" y="423" width="177.7" height="16" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1"/>
<text x="750.0" y="434.5" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="bold" fill="#b91c1c">✗ 没有 index_boundary(不查越界)</text>
<rect x="1060" y="490" width="330" height="96" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<text x="1225.0" y="514" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#334155">对照:insert_slice / extract_slice</text>
<text x="1225.0" y="536" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">两端都在片上,落到上游 tensor 方言</text>
<text x="1225.0" y="556" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">不碰 GM —— 不过这道缝</text>
<path d="M 1060 508 C 1008 508 1008 568 1060 568" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#gray)"/>
<text x="50" y="610" font-family="sans-serif" font-size="11" fill="#64748b">.td 定义 7 档(Zero=0/GM=1/L1=2/L0A=3/L0B=4/L0C=5/UB=6):third_party/ascend/AscendNPU-IR/bishengir/include/bishengir/Dialect/HIVM/IR/HIVMAttrs.td:L188-194。</text>
<text x="50" y="632" font-family="sans-serif" font-size="11" fill="#64748b">pybind 只导出 5 档:third_party/ascend/ascend_ir.cc:L412-417 —— Zero 与 GM 不进 Python,kernel 里写不出 space=GM 的 buffer。</text>
<text x="50" y="654" font-family="sans-serif" font-size="11" fill="#64748b">4 个跨 GM 带索引内建:third_party/ascend/language/cann/extension/mem_ops.py:L40-636;导出清单见 extension/__init__.py:L67-79。</text>
<text x="50" y="676" font-family="sans-serif" font-size="11" fill="#64748b">带 index_boundary 的 3 个:mem_ops.py:L40/L180/L332 三处有该形参;index_select_simd(L485-521)没有,docstring 明写 does not check if index contains out-of-bounds values。</text>
<text x="50" y="698" font-family="sans-serif" font-size="11" fill="#64748b">insert_slice / extract_slice:third_party/ascend/language/cann/extension/vec_ops.py:L47-137;triton_ascend.cc:L52-116。</text>
<line x1="50" y1="746" x2="84" y2="746" stroke="#1d4ed8" stroke-width="3"/>
<text x="96" y="750" font-family="sans-serif" font-size="12" fill="#334155">带 index_boundary(3 个):越界不算地址,换成 other / 整条丢弃</text>
<line x1="50" y1="772" x2="84" y2="772" stroke="#b91c1c" stroke-width="3"/>
<text x="96" y="776" font-family="sans-serif" font-size="12" fill="#334155">没有 index_boundary(1 个,index_select_simd):越界照常按公式算地址</text>
</svg>