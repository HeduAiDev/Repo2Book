<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 720">
<defs><marker id="arrowB" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#1d4ed8"/></marker><marker id="arrowG" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#64748b"/></marker></defs>
<rect width="1220" height="720" fill="white"/>
<text x="40" y="42" font-family="sans-serif" font-size="20" font-weight="bold" fill="#0f172a">片上内存层级：显式搬运的多级 scratchpad（不是 GPU 隐式 cache）</text>
<text x="40" y="66" font-family="sans-serif" font-size="13" fill="#475569">vector 路径 GM↔UB（192KB）由 tl.load/tl.store 显式发起；cube 路径经 L1→L0A/L0B→L0C</text>
<rect x="50" y="110" width="220" height="500" rx="14" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
<text x="160.0" y="144" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">GM</text>
<text x="160.0" y="166" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">Global Memory</text>
<text x="160.0" y="184" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">(片外 DRAM)</text>
<text x="160.0" y="590" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">容量大 · 延迟高</text>
<rect x="360" y="100" width="820" height="520" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,4"/>
<text x="376" y="126" font-family="sans-serif" font-size="14" font-weight="bold" fill="#334155">片上（显式管理的 scratchpad）</text>
<rect x="400" y="150" width="300" height="150" rx="12" fill="#93c5fd" stroke="#1d4ed8" stroke-width="2"/>
<text x="550.0" y="180" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">UB</text>
<text x="550.0" y="202" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1e3a8a">Unified Buffer（vector 路径）</text>
<text x="550.0" y="228" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">192 KB = 1,572,864 bits</text>
<text x="550.0" y="254" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#92400e">double-buffer 默认开 → 减半</text>
<text x="550.0" y="274" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#92400e">可用 ≈ 96 KB</text>
<path d="M 270 190 L 400 190" fill="none" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#arrowB)"/>
<text x="335.0" y="180" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1d4ed8">tl.load</text>
<path d="M 400 270 L 270 270" fill="none" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#arrowB)"/>
<text x="335.0" y="292" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1d4ed8">tl.store</text>
<rect x="400" y="360" width="120" height="90" rx="10" fill="#c4b5fd" stroke="#6d28d9" stroke-width="2"/>
<text x="460.0" y="392" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a">L1</text>
<text x="460.0" y="414" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4c1d95">cube 路径</text>
<text x="460.0" y="432" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#4c1d95">前置缓冲</text>
<rect x="580" y="354" width="110" height="78" rx="10" fill="#a5b4fc" stroke="#4338ca" stroke-width="2"/>
<text x="635.0" y="382" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">L0A</text>
<text x="635.0" y="402" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#312e81">左矩阵</text>
<path d="M 520 405.0 L 580 393.0" fill="none" stroke="#6d28d9" stroke-width="1.8" marker-end="url(#arrowG)"/>
<rect x="580" y="448" width="110" height="78" rx="10" fill="#a5b4fc" stroke="#4338ca" stroke-width="2"/>
<text x="635.0" y="476" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">L0B</text>
<text x="635.0" y="496" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#312e81">右矩阵</text>
<path d="M 520 405.0 L 580 487.0" fill="none" stroke="#6d28d9" stroke-width="1.8" marker-end="url(#arrowG)"/>
<rect x="750" y="401.0" width="110" height="78" rx="10" fill="#a5b4fc" stroke="#4338ca" stroke-width="2"/>
<text x="805.0" y="429.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">L0C</text>
<text x="805.0" y="449.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#312e81">累加结果</text>
<path d="M 690 393.0 L 750 440.0" fill="none" stroke="#6d28d9" stroke-width="1.8" marker-end="url(#arrowG)"/>
<path d="M 690 487.0 L 750 440.0" fill="none" stroke="#6d28d9" stroke-width="1.8" marker-end="url(#arrowG)"/>
<path d="M 270 405.0 L 400 405.0" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrowG)"/>
<text x="400" y="552" font-family="sans-serif" font-size="10" fill="#64748b" font-style="italic">L0A/L0B/L0C 精确职责与容量为 HPCA’21 paper-attributed 口径，host 未联网核实，不写死数字</text>
<rect x="50" y="650" width="18" height="18" rx="3" fill="#e2e8f0" stroke="#64748b"/>
<text x="76" y="664" font-family="sans-serif" font-size="12" fill="#334155">GM（片外 DRAM）</text>
<rect x="340" y="650" width="18" height="18" rx="3" fill="#93c5fd" stroke="#64748b"/>
<text x="366" y="664" font-family="sans-serif" font-size="12" fill="#334155">UB（vector 路径，192KB）</text>
<rect x="630" y="650" width="18" height="18" rx="3" fill="#c4b5fd" stroke="#64748b"/>
<text x="656" y="664" font-family="sans-serif" font-size="12" fill="#334155">L1（cube 前置缓冲）</text>
<rect x="920" y="650" width="18" height="18" rx="3" fill="#a5b4fc" stroke="#64748b"/>
<text x="946" y="664" font-family="sans-serif" font-size="12" fill="#334155">L0A/L0B/L0C（cube 紧邻缓冲）</text>
<text x="50" y="694" font-family="sans-serif" font-size="12" fill="#0f172a">GPU 的 cache 自动帮你把数据端上来；达芬奇必须用 tl.load/tl.store 亲手搬——double-buffer 把可用 UB 从 192KB 砍到 96KB，正是下一节 tiling 成为硬件必然的直接原因。</text>
</svg>