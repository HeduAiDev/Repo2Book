<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 566">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker><marker id="b" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#b45309"/></marker></defs>
<rect width="840" height="566" fill="white"/>
<text x="420.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#0f172a">CodeGenerator 上并挂两支 IR builder</text>
<text x="420.0" y="52" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#64748b">fork 在同一 MLIR context 上加挂第二支笔——两个不同对象，经 setup_unified_builder 接线</text>
<rect x="40" y="96" width="760" height="360" rx="14" fill="#f8fafc" stroke="#334155" stroke-width="2" stroke-dasharray="7,5"/>
<text x="58" y="124" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#334155">CodeGenerator 实例</text>
<rect x="80" y="226" width="300" height="120" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.2"/>
<text x="230.0" y="252" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">self.builder</text>
<text x="230.0" y="276" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1e3a8a">ir.builder(compile_mode=simd/simt)</text>
<text x="230.0" y="298" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1e40af">emit 标准 Triton IR</text>
<text x="230.0" y="322" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#2563eb" font-weight="bold">code_generator.py:L215-L219</text>
<rect x="460" y="226" width="300" height="120" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2.4"/>
<text x="610.0" y="252" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#78350f">self.ascend_builder</text>
<text x="610.0" y="276" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#78350f">ascendnpu_ir_builder(context, arch)</text>
<text x="610.0" y="298" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#92400e">emit 昇腾方言（hivm/ascend）</text>
<text x="610.0" y="322" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#b45309" font-weight="bold">code_generator.py:L226</text>
<rect x="80" y="380" width="680" height="42" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="1.6"/>
<text x="420.0" y="407" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#1e293b">共享同一个 MLIR context（same_context = true）</text>
<line x1="230.0" y1="346" x2="230.0" y2="380" stroke="#475569" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="610.0" y1="346" x2="610.0" y2="380" stroke="#475569" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M 460 230 C 420.0 174 420.0 174 380 230" fill="none" stroke="#b45309" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#b)"/>
<text x="420.0" y="164" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#92400e">setup_unified_builder(self.builder, self.ascend_builder)</text>
<text x="420.0" y="188" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#92400e">反挂：self.builder._ascend_builder = self.ascend_builder（code_generator.py:L228）</text>
<text x="40" y="496" font-family="sans-serif" font-size="11.5" fill="#64748b">两支笔是两个不同对象（is_second_distinct_builder = true）；tl.* 落 self.builder，al.* 落 self.ascend_builder。</text>
<text x="40" y="516" font-family="sans-serif" font-size="11.5" fill="#64748b">AST 遍历/符号表全套复用基座——fork 只在这两支笔的构造与接线上做原位改动。</text>
</svg>