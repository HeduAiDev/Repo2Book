<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker><marker id="ac" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#1e40af"/></marker><marker id="av" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#15803d"/></marker></defs>
<rect width="920" height="480" fill="white"/>
<text x="40" y="36" font-family="sans-serif" font-size="18" font-weight="bold" fill="#0f172a">达芬奇 AI Core:异构双核</text>
<text x="40" y="58" font-family="sans-serif" font-size="13" fill="#64748b">Cube 只做矩阵乘;Vector 做逐元素与规约——核亲和 pass 要为每个 IR op 定点归属</text>
<rect x="670" y="20" width="210" height="26" rx="13" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="775.0" y="37" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">回指 ch02:达芬奇双核硬件模型</text>
<rect x="40" y="96" width="260" height="300" rx="14" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
<text x="170.0" y="130" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e40af">Cube 核</text>
<text x="170.0" y="166" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0f172a">矩阵乘老师傅</text>
<text x="170.0" y="192" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0f172a">tt.dot / MatMul</text>
<text x="170.0" y="218" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0f172a">只擅长、也只干矩阵乘</text>
<rect x="620" y="96" width="260" height="300" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="750.0" y="130" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#15803d">Vector 核</text>
<text x="750.0" y="166" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0f172a">逐元素快手</text>
<text x="750.0" y="192" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0f172a">add / exp / select / 规约(sum)</text>
<text x="750.0" y="218" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0f172a">加减乘除、激活、reduce</text>
<rect x="350.0" y="156" width="220" height="56" rx="8" fill="white" stroke="#334155" stroke-width="1.5"/>
<text x="460.0" y="188.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">tt.dot</text>
<line x1="350.0" y1="184.0" x2="300" y2="184.0" stroke="#1e40af" stroke-width="2.5" marker-end="url(#ac)"/>
<rect x="267.0" y="156.0" width="116" height="20" rx="4" fill="white" stroke="#1e40af"/>
<text x="325.0" y="170.0" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e40af">CUBE_ONLY</text>
<rect x="350.0" y="316" width="220" height="56" rx="8" fill="white" stroke="#334155" stroke-width="1.5"/>
<text x="460.0" y="340.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">张量逐元素算子</text>
<text x="460.0" y="356.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0f172a">(add / exp / select)</text>
<line x1="570.0" y1="344.0" x2="620" y2="344.0" stroke="#15803d" stroke-width="2.5" marker-end="url(#av)"/>
<rect x="537.0" y="316.0" width="116" height="20" rx="4" fill="white" stroke="#15803d"/>
<text x="595.0" y="330.0" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#15803d">PREFER_VECTOR</text>
<text x="40" y="450" font-family="sans-serif" font-size="12" fill="#64748b">单核归属只有 2 种落点:CUBE_ONLY 或 VECTOR_ONLY——核亲和 pass 要把每个 op 判给其中一个(或两者皆可)</text>
<text x="40" y="470" font-family="sans-serif" font-size="12" fill="#64748b">对位基座:GPU 选 mma 指令把矩阵乘映射到 Tensor Core;昇腾是把 op 整体放到 cube 核——不同抽象层(见 ch27/28)</text>
</svg>