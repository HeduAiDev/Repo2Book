<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker></defs>
<rect width="940" height="480" fill="white"/>
<text x="40" y="36" font-family="sans-serif" font-size="18" font-weight="bold" fill="#0f172a">两套 2-bit 枚举:能力(OpAbility) 对齐 放置(CoreType)</text>
<text x="40" y="58" font-family="sans-serif" font-size="13" fill="#64748b">toCoreType 只做位重解释(原样搬运底层整数),不改变数值</text>
<text x="190.0" y="104" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">OpAbility(能力,DAG.h:L27-32)</text>
<text x="750.0" y="104" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">CoreType(放置,DAG.h:L34-39)</text>
<rect x="600" y="120" width="300" height="62" rx="8" fill="white" stroke="#64748b" stroke-width="2"/>
<text x="618" y="148" font-family="sans-serif" font-size="13" font-weight="bold" fill="#64748b">UNDETERMINED</text>
<text x="618" y="170" font-family="sans-serif" font-size="12" fill="#64748b">bit = 00 (0)</text>
<rect x="40" y="196" width="300" height="62" rx="8" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="58" y="224" font-family="sans-serif" font-size="13" font-weight="bold" fill="#15803d">PREFER_VECTOR</text>
<text x="58" y="246" font-family="sans-serif" font-size="12" fill="#64748b">bit = 01 (1)</text>
<rect x="600" y="196" width="300" height="62" rx="8" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="618" y="224" font-family="sans-serif" font-size="13" font-weight="bold" fill="#15803d">VECTOR_ONLY</text>
<text x="618" y="246" font-family="sans-serif" font-size="12" fill="#64748b">bit = 01 (1)</text>
<line x1="340" y1="227.0" x2="600" y2="227.0" stroke="#15803d" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#a)"/>
<rect x="430.0" y="197.0" width="80" height="20" rx="4" fill="white" stroke="#15803d"/>
<text x="470.0" y="211.0" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#15803d">位=01</text>
<rect x="40" y="272" width="300" height="62" rx="8" fill="white" stroke="#1e40af" stroke-width="2"/>
<text x="58" y="300" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e40af">CUBE_ONLY</text>
<text x="58" y="322" font-family="sans-serif" font-size="12" fill="#64748b">bit = 10 (2)</text>
<rect x="600" y="272" width="300" height="62" rx="8" fill="white" stroke="#1e40af" stroke-width="2"/>
<text x="618" y="300" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e40af">CUBE_ONLY</text>
<text x="618" y="322" font-family="sans-serif" font-size="12" fill="#64748b">bit = 10 (2)</text>
<line x1="340" y1="303.0" x2="600" y2="303.0" stroke="#1e40af" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#a)"/>
<rect x="430.0" y="273.0" width="80" height="20" rx="4" fill="white" stroke="#1e40af"/>
<text x="470.0" y="287.0" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e40af">位=10</text>
<rect x="40" y="348" width="300" height="62" rx="8" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="58" y="376" font-family="sans-serif" font-size="13" font-weight="bold" fill="#7c3aed">CUBE_AND_VECTOR</text>
<text x="58" y="398" font-family="sans-serif" font-size="12" fill="#64748b">bit = 11 (3)</text>
<rect x="600" y="348" width="300" height="62" rx="8" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="618" y="376" font-family="sans-serif" font-size="13" font-weight="bold" fill="#7c3aed">CUBE_AND_VECTOR</text>
<text x="618" y="398" font-family="sans-serif" font-size="12" fill="#64748b">bit = 11 (3)</text>
<line x1="340" y1="379.0" x2="600" y2="379.0" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#a)"/>
<rect x="430.0" y="349.0" width="80" height="20" rx="4" fill="white" stroke="#7c3aed"/>
<text x="470.0" y="363.0" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#7c3aed">位=11</text>
<text x="470.0" y="155.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">OpAbility 无 00 态</text>
<text x="470.0" y="80" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155">toCoreType(位重解释)</text>
<text x="40" y="450" font-family="sans-serif" font-size="12" fill="#64748b">PREFER_VECTOR(01) 对齐 VECTOR_ONLY(01);CUBE_ONLY(10) 两侧同位;CUBE_AND_VECTOR(11)=VECTOR_ONLY|CUBE_ONLY</text>
</svg>