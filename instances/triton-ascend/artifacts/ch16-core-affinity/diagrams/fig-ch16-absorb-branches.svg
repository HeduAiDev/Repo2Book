<text x="1190" y="417" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">return VECTOR_ONLY</text>
<text x="1190" y="435" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#0f172a">(数据源非单核)</text>
<rect x="110.0" y="514.0" width="300" height="104" rx="8" fill="white" stroke="#334155" stroke-width="1.6"/>
<text x="260" y="543" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#0f172a">for output in outputs:</text>
<text x="260" y="561" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#0f172a">switch(output.isOn())</text>
<text x="260" y="579" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#0f172a">3 case 按位或:</text>
<text x="260" y="597" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#0f172a">CUBE_AND_VECTOR / CUBE_ONLY / VECTOR_ONLY</text>
