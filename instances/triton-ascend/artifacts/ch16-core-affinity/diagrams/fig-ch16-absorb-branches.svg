<text x="760" y="201" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">return CUBE_ONLY</text>
<text x="760" y="219" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#0f172a">(能力硬钉,提前退出)</text>
