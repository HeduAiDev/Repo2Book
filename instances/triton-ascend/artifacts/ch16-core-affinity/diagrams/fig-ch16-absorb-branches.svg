<text x="274" y="439.0" text-anchor="start" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#334155">否(遍历下游诉求)</text>
<rect x="90.0" y="646.0" width="340" height="40" rx="8" fill="white" stroke="#334155" stroke-width="1.6"/>
<text x="260" y="670" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#0f172a">return newCoreType(按位或的并)</text>
<line x1="260" y1="618" x2="260" y2="646" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
<text x="40" y="714" font-family="sans-serif" font-size="12" fill="#64748b">注:switch 的 CUBE_AND_VECTOR case 无 break,故意 fall-through 到 CUBE_ONLY(DAG.cpp:L374-376)</text>
<text x="40" y="734" font-family="sans-serif" font-size="12" fill="#64748b">三条出口互斥:能力硬钉 CUBE_ONLY / WRITE 跟数据源(单核则跟、否则 VECTOR_ONLY)/ 否则遍历 outputs 求并</text>
