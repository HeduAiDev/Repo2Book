<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker></defs>
<rect width="1200" height="560" fill="white"/>
<text x="40" y="36" font-family="sans-serif" font-size="18" font-weight="bold" fill="#0f172a">四态幂集格<tspan font-weight="normal">(CoreType)</tspan></text>
<text x="40" y="58" font-family="sans-serif" font-size="13" fill="#64748b">operator| 是格的并(按位或);底=拿不准,顶=双核皆可</text>
<rect x="350.0" y="107.0" width="220" height="66" rx="12" fill="white" stroke="#7c3aed" stroke-width="2.5"/>
<text x="460" y="134.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#7c3aed">CUBE_AND_VECTOR</text>
<text x="460" y="155.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">= 3 (⊤,双核皆可)</text>
<rect x="90.0" y="257.0" width="220" height="66" rx="12" fill="white" stroke="#15803d" stroke-width="2.5"/>
<text x="200" y="284.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#15803d">VECTOR_ONLY</text>
<text x="200" y="305.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">= 1</text>
<rect x="610.0" y="257.0" width="220" height="66" rx="12" fill="white" stroke="#1e40af" stroke-width="2.5"/>
<text x="720" y="284.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e40af">CUBE_ONLY</text>
<text x="720" y="305.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">= 2</text>
<rect x="350.0" y="407.0" width="220" height="66" rx="12" fill="white" stroke="#64748b" stroke-width="2.5"/>
<text x="460" y="434.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#64748b">UNDETERMINED</text>
<text x="460" y="455.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">= 0 (⊥,拿不准)</text>
<line x1="460" y1="407.0" x2="200" y2="323.0" stroke="#15803d" stroke-width="2" marker-end="url(#a)"/>
<line x1="460" y1="407.0" x2="720" y2="323.0" stroke="#1e40af" stroke-width="2" marker-end="url(#a)"/>
<line x1="200" y1="257.0" x2="460" y2="173.0" stroke="#15803d" stroke-width="2" marker-end="url(#a)"/>
<line x1="720" y1="257.0" x2="460" y2="173.0" stroke="#1e40af" stroke-width="2" marker-end="url(#a)"/>
<text x="322.0" y="365.0" text-anchor="end" font-family="sans-serif" font-size="11" fill="#15803d">⊔ = |</text>
<text x="598.0" y="365.0" text-anchor="start" font-family="sans-serif" font-size="11" fill="#1e40af">⊔ = |</text>
<text x="870.0" y="70" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">toHivm(DAG.h:L76-90)</text>
<text x="870.0" y="140" font-family="sans-serif" font-size="12" fill="#7c3aed">toHivm(3) → CUBE_AND_VECTOR</text>
<text x="870.0" y="260" font-family="sans-serif" font-size="12" fill="#1e40af">toHivm(2) → CUBE</text>
<text x="870.0" y="320" font-family="sans-serif" font-size="12" fill="#15803d">toHivm(1) → VECTOR</text>
<text x="870.0" y="440" font-family="sans-serif" font-size="12" fill="#64748b">toHivm(0) → CUBE_OR_VECTOR</text>
<text x="40" y="530" font-family="sans-serif" font-size="12" fill="#64748b">operator!(取补,DAG.h:L62-74)只在 {CUBE_ONLY,VECTOR_ONLY} 内定义,不作用于顶/底两态</text>
</svg>