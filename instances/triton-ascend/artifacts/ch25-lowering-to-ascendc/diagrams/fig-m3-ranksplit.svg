<text x="590.0" y="724" text-anchor="middle" font-family="monospace" font-size="13.5" font-weight="bold" fill="#14532d">func.call @vadd_3d_half(subview)</text>
<text x="590.0" y="744" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#14532d">subview rank = maxRank = 3 → memref&lt;4x8x16xf16&gt;</text>
<text x="590.0" y="762" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#b91c1c">HIVMToStandard.cpp:L229-L338（rank-reduced subview）</text>
<text x="590.0" y="804" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">总调用次数 = 外轴尺寸之积 = 2×3 = 6</text>
<text x="590.0" y="862" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#475569">库只认 &lt;=3 维：编译期用 2 层 scf.for 把外 2 轴（尺寸 2、3）逐个拉开，每次拉开留下一个 rank-3 的 subview，对它调一次 vadd_3d_half——6 次调用后，rank=5 的输入被处理完，库本身从未见过 5 维。</text>
