<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1248 486">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker></defs>
<rect width="1248" height="486" fill="white"/>
<text x="624.0" y="38" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">49 个 HIVM 硬件 op 被设为 illegal：三种形态，殊途同归</text>
<rect x="44" y="96" width="360" height="160" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
<text x="224.0" y="122" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#7c2d12">形态 A：直接调库（无 rank 门控）</text>
<line x1="58" y1="142" x2="390" y2="142" stroke="#c2410c" stroke-width="1" stroke-dasharray="3,3"/>
<text x="60" y="164" font-family="sans-serif" font-size="11.5" fill="#7c2d12">· MmadL1Op（NoMaxRank）</text>
<text x="390" y="182" text-anchor="end" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#b91c1c">L345</text>
<text x="60" y="214" font-family="sans-serif" font-size="11.5" fill="#7c2d12">· ND2NZOp / FixpipeOp（NoMaxRank）</text>
<text x="390" y="232" text-anchor="end" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#b91c1c">L388 / L421</text>
<rect x="444" y="96" width="360" height="160" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
<text x="624.0" y="122" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0c4a6e">形态 B：rank 门控（超 maxRank 才拆循环）</text>
<line x1="458" y1="142" x2="790" y2="142" stroke="#0369a1" stroke-width="1" stroke-dasharray="3,3"/>
<text x="460" y="164" font-family="sans-serif" font-size="11.5" fill="#0c4a6e">· VAddOp maxRank=3（rank&lt;=3 直调，否则拆）</text>
<text x="790" y="182" text-anchor="end" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#b91c1c">L920</text>
<text x="460" y="214" font-family="sans-serif" font-size="11.5" fill="#0c4a6e">· LoadOp / StoreOp / CopyOp maxRank=3</text>
<text x="790" y="232" text-anchor="end" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#b91c1c">L736</text>
<rect x="844" y="96" width="360" height="110" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
<text x="1024.0" y="122" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#4c1d95">形态 C：按轴拆循环（沿语义轴）</text>
<line x1="858" y1="142" x2="1190" y2="142" stroke="#6d28d9" stroke-width="1" stroke-dasharray="3,3"/>
<text x="860" y="164" font-family="sans-serif" font-size="11.5" fill="#4c1d95">· VReduce / VTranspose / VBrc（InferMaxRank）</text>
<text x="1190" y="182" text-anchor="end" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#b91c1c">L1252 / L1414 / L1162</text>
<line x1="224.0" y1="256" x2="469.0" y2="326" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<line x1="624.0" y1="256" x2="624.0" y2="326" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<line x1="1024.0" y1="206" x2="779.0" y2="326" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="314.0" y="326" width="620" height="56" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<text x="624.0" y="350" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#14532d">createLibCall：getOrInsert 声明 + emit func.call</text>
<text x="624.0" y="370" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#b91c1c">HIVMToStandard.cpp:L106-L168</text>
<text x="624.0" y="450" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#475569">49 个硬件 op 只有三种形态：矩阵/格式转换/fixpipe 不设 rank 上限直接调库；普通向量/搬运 op 先比 rank 再决定要不要拆循环；</text>
<text x="624.0" y="470" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#475569">规约/转置/广播必须沿指定语义轴拆循环。三条路最终都汇到同一个 createLibCall，把 op 变成 func.call。</text>
</svg>