<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1224 558">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker><marker id="ay" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#15803d"/></marker><marker id="ar" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#b91c1c"/></marker></defs>
<rect width="1224" height="558" fill="white"/>
<text x="44" y="40" font-family="sans-serif" font-size="18" font-weight="bold" fill="#0f172a">HIVMToStandard：一个 hivm.hir.vadd 被 createLibCall 降成什么</text>
<text x="194.0" y="86" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#b91c1c">转换前：IR 里的 hivm.hir.vadd（illegal）</text>
<text x="764.0" y="86" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0369a1">转换后：createLibCall 落地的两样东西</text>
<rect x="44" y="208.0" width="300" height="68" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="194.0" y="228.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#7f1d1d">illegal（addIllegalOp）</text>
<text x="194.0" y="246.0" text-anchor="middle" font-family="monospace" font-size="11" fill="#7f1d1d">hivm.hir.vadd(%a, %b, %c)</text>
<text x="194.0" y="262.0" text-anchor="middle" font-family="monospace" font-size="11" fill="#7f1d1d">: memref&lt;16xf16, #hivm.address_space&lt;gm&gt;&gt;</text>
<line x1="344" y1="242.0" x2="528" y2="242.0" stroke="#334155" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#a)"/>
<text x="439.0" y="220.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">OpRewritePattern</text>
<text x="439.0" y="234.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">匹配 → 重写</text>
<rect x="534" y="126" width="460" height="56" rx="10" fill="#fef9c3" stroke="#a16207" stroke-width="2"/>
<text x="764.0" y="159.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#713f12">mod.lookupSymbol(“vadd_1d_half”) 命中？</text>
<text x="984" y="142" text-anchor="end" font-family="sans-serif" font-size="11" font-weight="bold" fill="#b91c1c">L114</text>
<line x1="662.8" y1="182" x2="662.8" y2="226" stroke="#0369a1" stroke-width="2" marker-end="url(#a)"/>
<text x="670.8" y="197" font-family="sans-serif" font-size="11" fill="#0369a1">否（首次遇到）→ 插声明</text>
<line x1="994" y1="154.0" x2="1124" y2="154.0" stroke="#15803d" stroke-width="1.8" stroke-dasharray="4,3"/>
<line x1="1124" y1="154.0" x2="1124" y2="406.0" stroke="#15803d" stroke-width="1.8" stroke-dasharray="4,3"/>
<line x1="1124" y1="406.0" x2="994" y2="406.0" stroke="#15803d" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#ay)"/>
<text x="1134" y="146.0" font-family="sans-serif" font-size="10.5" fill="#15803d">是（已插过）</text>
<text x="1134" y="280.0" font-family="sans-serif" font-size="10.5" fill="#15803d">↓跳过声明</text>
<text x="1134" y="422.0" font-family="sans-serif" font-size="10.5" fill="#15803d">直接点单</text>
<rect x="534" y="226" width="460" height="132" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
<text x="546" y="246" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0c4a6e">module 末尾（仅首次插入）</text>
<text x="546" y="270" font-family="monospace" font-size="12" fill="#0c4a6e">func.func private @vadd_1d_half(...)</text>
<text x="562" y="288" font-family="sans-serif" font-size="11.5" fill="#0c4a6e">· emit_c_wrapper</text>
<text x="984" y="288" text-anchor="end" font-family="sans-serif" font-size="11" font-weight="bold" fill="#b91c1c">L123</text>
<text x="562" y="310" font-family="sans-serif" font-size="11.5" fill="#0c4a6e">· hacc.always_inline</text>
<text x="984" y="310" text-anchor="end" font-family="sans-serif" font-size="11" font-weight="bold" fill="#b91c1c">L126</text>
<text x="562" y="332" font-family="sans-serif" font-size="11.5" fill="#0c4a6e">· private（无 body，外部符号）</text>
<text x="984" y="332" text-anchor="end" font-family="sans-serif" font-size="11" font-weight="bold" fill="#b91c1c">L130</text>
<line x1="662.8" y1="358" x2="662.8" y2="384" stroke="#15803d" stroke-width="2" marker-end="url(#a)"/>
<rect x="534" y="384" width="460" height="44" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="550" y="411.0" font-family="monospace" font-size="12.5" fill="#14532d">func.call @vadd_1d_half(%a, %b, %c)</text>
<text x="984" y="378" text-anchor="end" font-family="sans-serif" font-size="11" font-weight="bold" fill="#b91c1c">L165</text>
<line x1="764.0" y1="428" x2="764.0" y2="448" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<text x="984" y="440" text-anchor="end" font-family="sans-serif" font-size="11" font-weight="bold" fill="#b91c1c">L179</text>
<text x="764.0" y="466" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">rewriter.replaceOp(原 hivm.hir.vadd, call) → HIVM op 消失</text>
<text x="612.0" y="542" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#475569">createLibCall：去重开关(L114)决定要不要现插一条打 3 属性的 func.func 声明(L123/126/130)，两条路径都汇到同一条 func.call(L165)，replaceOp(L179) 把原 hivm.hir.vadd 换掉——HIVM op 就此消失。</text>
</svg>