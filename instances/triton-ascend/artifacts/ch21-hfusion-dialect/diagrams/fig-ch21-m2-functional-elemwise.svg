<rect x="30" y="398" width="760" height="82" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="44" y="420" font-family="sans-serif" font-size="12" font-weight="bold" fill="#166534">属性携带方式（非 op）:</text>
<text x="44" y="440" font-family="sans-serif" font-size="12" fill="#166534">elemwise_unary op 的 fun 参数 = unary_fn_attr（默认 sqrt）——</text>
<text x="44" y="460" font-family="sans-serif" font-size="12" fill="#166534">HFusionNamedStructuredOps.yaml:L74-L123，打印形态即 #hfusion.unary_fn&lt;relu&gt;</text>
<text x="30" y="514" font-family="sans-serif" font-size="11" fill="#64748b">蓝=覆盖多个函数的"大词汇表"枚举，琥珀=只覆盖 1-3 个函数的"小词汇表"枚举</text>
</svg>