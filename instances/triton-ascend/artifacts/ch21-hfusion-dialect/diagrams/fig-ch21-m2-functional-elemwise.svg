<rect width="820" height="540" fill="white"/>
<text x="30" y="30" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e40af">HFusion 函数化 elementwise 词汇表——枚举属性，不是逐函数建 op</text>
<text x="30" y="50" font-family="sans-serif" font-size="12" fill="#64748b">elemwise_unary/elemwise_binary/compare/cast 各携带一个枚举属性，一个 op 参数化出整族函数</text>
