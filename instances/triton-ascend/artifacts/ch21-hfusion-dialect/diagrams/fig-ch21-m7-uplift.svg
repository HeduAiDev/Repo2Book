<text x="50" y="106" font-family="sans-serif" font-size="10" fill="#94a3b8">linalg 输入模式</text>
<text x="540" y="106" font-family="sans-serif" font-size="10" fill="#94a3b8">hfusion 输出 op</text>
<rect x="50" y="492" width="770" height="140" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
<text x="64" y="514" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155">partial conversion 合法性（LinalgToHFusion.cpp:L479-L493）:</text>
<text x="64" y="534" font-family="sans-serif" font-size="11.5" fill="#334155">linalg.map / linalg.generic 恒 illegal（addIllegalOp，必被消费）；linalg.reduce 仅带 reduce_mode 属性时</text>
<text x="64" y="554" font-family="sans-serif" font-size="11.5" fill="#334155">illegal（addDynamicallyLegalOp）。</text>
<text x="64" y="574" font-family="sans-serif" font-size="11.5" fill="#334155">legal 方言 7 个：memref / linalg / bufferization / tensor / hfusion / arith / math——普通 linalg op（无戳）从不进 illegal</text>
<text x="64" y="594" font-family="sans-serif" font-size="11.5" fill="#334155">集，原样放行。</text>
<text x="64" y="614" font-family="sans-serif" font-size="11.5" fill="#334155">每命中一次 pattern，illegal op 计数严格 -1；4 个 pattern 各自 replaceOpWithNewOp，单调收敛到 0 即转换成功。</text>
</svg>