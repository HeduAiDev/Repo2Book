<text x="84" y="358" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155">为什么 i、j 可切、gather 轴 k 不可切：</text>
<text x="84" y="378" font-family="sans-serif" font-size="11.5" fill="#334155">沿 k=0..3 遍历中恰有一个 k 满足 index[i][j]==k（相等唯一）→ 每个 output[i][j] 被写恰一次；</text>
<text x="84" y="396" font-family="sans-serif" font-size="11.5" fill="#334155">要确定『去哪列』必须看过整行候选列 k，切开一段 k 只见部分候选、命中判定失真——gather 轴不可 tile。</text>
<text x="84" y="414" font-family="sans-serif" font-size="11.5" fill="#334155">i、j 维互不相干（各行/各输出列独立），可分头处理；本例 M·J·K = 3·2·4 = 24 次比较，输出 3×2 = 6 个元素。</text>
