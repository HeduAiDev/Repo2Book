<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1290 548">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker></defs>
<rect width="1290" height="548" fill="white"/>
<text x="40" y="32" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">同一条收窄链，第二次出现：定义 → 导出 → 可用，逐级变窄</text>
<text x="40" y="54" font-family="sans-serif" font-size="12.5" fill="#64748b">ch05 讲地址空间时的三级台阶，这里 PIPE 与 TCoreType 各走一遍</text>
<text x="320.0" y="100" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#334155">① .td 定义</text>
<text x="710.0" y="100" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#334155">② pybind 导出</text>
<text x="1100.0" y="100" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#334155">③ 语言层可用</text>
<text x="154" y="169.0" text-anchor="end" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1d4ed8">PIPE</text>
<rect x="170" y="114.0" width="300" height="100" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
<text x="320.0" y="142.0" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1d4ed8">15 档</text>
<text x="320.0" y="164.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#1d4ed8">HIVMAttrs.td:L220-L234</text>
<text x="320.0" y="180.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#1d4ed8">含 MTE4/MTE5/V2/两个 VIRTUAL_*</text>
<text x="320.0" y="196.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#1d4ed8">PIPE_NUM、PIPE_UNASSIGNED(=99)</text>
<line x1="476" y1="164.0" x2="554" y2="164.0" stroke="#64748b" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="560" y="114.0" width="300" height="100" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
<text x="710.0" y="142.0" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1d4ed8">8 档</text>
<text x="710.0" y="164.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#1d4ed8">ascend_ir.cc:L428-L435</text>
<text x="710.0" y="180.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#1d4ed8">掉队 7 档（灰显于下方）</text>
<line x1="866" y1="164.0" x2="944" y2="164.0" stroke="#64748b" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="950" y="114.0" width="300" height="100" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
<text x="1100.0" y="142.0" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1d4ed8">8 档</text>
<text x="1100.0" y="164.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#1d4ed8">core.py:L111-L119</text>
<text x="1100.0" y="180.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#1d4ed8">Python class PIPE</text>
<text x="1100.0" y="196.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#1d4ed8">与导出档数持平</text>
<text x="154" y="313.0" text-anchor="end" font-family="sans-serif" font-size="14" font-weight="bold" fill="#6d28d9">TCoreType</text>
<rect x="170" y="258.0" width="300" height="100" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.8"/>
<text x="320.0" y="286.0" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#6d28d9">4 档</text>
<text x="320.0" y="308.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#6d28d9">CUBE / VECTOR /</text>
<text x="320.0" y="324.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#6d28d9">CUBE_OR_VECTOR / CUBE_AND_VECTOR</text>
<line x1="476" y1="308.0" x2="554" y2="308.0" stroke="#64748b" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="560" y="258.0" width="300" height="100" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.8"/>
<text x="710.0" y="286.0" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#6d28d9">4 档</text>
<text x="710.0" y="308.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#6d28d9">pybind 全部导出</text>
<text x="710.0" y="324.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#6d28d9">（无收窄）</text>
<line x1="866" y1="308.0" x2="944" y2="308.0" stroke="#64748b" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="950" y="258.0" width="300" height="100" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.8"/>
<text x="1100.0" y="286.0" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#6d28d9">2 档</text>
<text x="1100.0" y="308.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#6d28d9">code_generator.py:L84-L93</text>
<text x="1100.0" y="324.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#6d28d9">白名单 ("cube", "vector")</text>
<text x="1100.0" y="340.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#6d28d9">另 2 档从 scope 到不了</text>
<rect x="40" y="402.0" width="1210" height="96" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
<text x="58" y="426.0" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#475569">PIPE 在 pybind 处掉队的 7 档（第 15→8 步）：</text>
<text x="58" y="446.0" font-family="sans-serif" font-size="11.5" fill="#64748b">PIPE_MTE4, PIPE_MTE5, PIPE_V2, VIRTUAL_PIPE_MTE2_L1A, VIRTUAL_PIPE_MTE2_L1B, PIPE_NUM, PIPE_UNASSIGNED</text>
<text x="58" y="470.0" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#475569">TCoreType 从 scope(core_mode=...) 到不了的 2 档：</text>
<text x="58" y="490.0" font-family="sans-serif" font-size="11.5" fill="#64748b">CUBE_OR_VECTOR、CUBE_AND_VECTOR —— 掉队各档的硬件含义源码未给出依据，见 open_question</text>
<text x="40" y="528.0" font-family="sans-serif" font-size="12" fill="#334155">PIPE：15 → 8 → 8；TCoreType：4 → 4 → 2——底层 IR 表达力与语言层可写出来的东西之间，永远隔着一层人为的窄口。</text>
</svg>