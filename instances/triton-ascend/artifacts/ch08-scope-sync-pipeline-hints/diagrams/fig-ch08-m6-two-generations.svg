<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 637">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker></defs>
<rect width="860" height="637" fill="white"/>
<text x="50" y="32" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">同名 API、两条下降路径：custom_op 通用外挂 vs HIVM 专用 op</text>
<text x="50" y="54" font-family="sans-serif" font-size="12.5" fill="#64748b">两代都在 ast_to_ttir 阶段由 builder 直接 emit——不是一边 ttir 一边 ttadapter</text>
<rect x="10" y="62" width="380" height="34" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="200" y="84" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#b45309">旧代：aux_ops.sync_block_set</text>
<rect x="470" y="62" width="380" height="34" rx="7" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="660" y="84" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#1d4ed8">新代：core.sync_block_set</text>
<rect x="10.0" y="108" width="380" height="35" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="200" y="128" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#b45309">aux_ops.sync_block_set(sender, receiver, event_id)</text>
<rect x="470.0" y="108" width="380" height="69" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="660" y="128" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1d4ed8">core.sync_block_set(sender, receiver, event_id,</text>
<text x="660" y="145" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1d4ed8">sender_pipe=None, receiver_pipe=None)</text>
<text x="660" y="162" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#1d4ed8">比旧代多 2 个参数：sender_pipe / receiver_pipe</text>
<line x1="200" y1="143" x2="200" y2="195" stroke="#94a3b8" marker-end="url(#a)"/>
<line x1="660" y1="177" x2="660" y2="195" stroke="#94a3b8" marker-end="url(#a)"/>
<rect x="10.0" y="207" width="380" height="52" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="200" y="227" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#b91c1c">DeprecationWarning：</text>
<text x="200" y="244" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#b91c1c">“Use al.sync_block_set instead”</text>
<rect x="470.0" y="207" width="380" height="35" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="660" y="227" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#94a3b8">（无此步——新代无弃用告警）</text>
<line x1="200" y1="259" x2="200" y2="277" stroke="#94a3b8" marker-end="url(#a)"/>
<line x1="660" y1="242" x2="660" y2="277" stroke="#94a3b8" marker-end="url(#a)"/>
<rect x="10.0" y="289" width="380" height="69" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="200" y="309" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#b45309">落到 builder 的实参：</text>
<text x="200" y="326" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#b45309">('sync_block_set', 'cube', 3)</text>
<text x="200" y="343" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#b45309">—— receiver 被丢弃</text>
<rect x="470.0" y="289" width="380" height="52" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="660" y="309" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1d4ed8">create_sync_block 校验后</text>
<text x="660" y="326" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#1d4ed8">四条校验：核名/同核/范围/pipe 类型</text>
<line x1="200" y1="358" x2="200" y2="376" stroke="#94a3b8" marker-end="url(#a)"/>
<line x1="660" y1="341" x2="660" y2="376" stroke="#94a3b8" marker-end="url(#a)"/>
<rect x="10.0" y="388" width="380" height="69" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="200" y="408" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#b91c1c">ascend.custom</text>
<text x="200" y="425" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#b91c1c">op_name = "sync_block_set"</text>
<text x="200" y="442" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#b91c1c">str_args = [StringAttr(sender), I32IntegerAttr(id)]</text>
<rect x="470.0" y="388" width="380" height="52" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="660" y="408" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#047857">hivm.sync_block_set</text>
<text x="660" y="425" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#047857">(coreAttr, prodPipe, consPipe, idI64)</text>
<rect x="50" y="491" width="760" height="56" rx="9" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
<text x="430.0" y="515" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#334155">两代共同的拒绝：sender == receiver（同核对）→ ValueError</text>
<text x="430.0" y="533" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">旧代先 warn 后抛；新代直接抛——判定逻辑一致</text>
<line x1="200" y1="459" x2="200" y2="491" stroke="#94a3b8" stroke-dasharray="3,3" marker-end="url(#a)"/>
<line x1="660" y1="459" x2="660" y2="491" stroke="#94a3b8" stroke-dasharray="3,3" marker-end="url(#a)"/>
<text x="50" y="577" font-family="sans-serif" font-size="11.5" fill="#334155">旧代经 _utils.py 里那个只认三个 op 名的手写分发函数（与自定义算子注册表同名不同物）</text>
<text x="50" y="597" font-family="sans-serif" font-size="11.5" fill="#334155">落成通用外挂 op，receiver 与 pipe 信息在语言层就丢了；</text>
<text x="50" y="617" font-family="sans-serif" font-size="11.5" fill="#334155">新代直接建 HIVM 专用 op，落核与两侧 pipe 一并写进 IR——同一个 API 名，下降链上却是两种东西。</text>
</svg>