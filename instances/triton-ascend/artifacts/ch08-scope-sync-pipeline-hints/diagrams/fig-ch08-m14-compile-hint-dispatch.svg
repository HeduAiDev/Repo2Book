<rect width="1280" height="870" fill="white"/>
<text x="40" y="32" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">compile_hint：贴条，不是改写</text>
<text x="40" y="52" font-family="sans-serif" font-size="12.5" fill="#64748b">值按 Python 类型五路分派成 MLIR 属性，再由 annotation.mark 挂到目标 handle 上——原 op 一个字节不动；均在 AST → ttir（ast_to_ttir）阶段 emit</text>
