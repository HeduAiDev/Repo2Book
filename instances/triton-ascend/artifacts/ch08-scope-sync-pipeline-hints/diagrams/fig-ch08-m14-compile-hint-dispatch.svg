<polyline points="960,201.0 960,596 480.0,596 480.0,630" fill="none" stroke="#047857" stroke-width="2" marker-end="url(#g)"/>
<text x="952" y="586" text-anchor="end" font-family="sans-serif" font-size="11" fill="#047857">五路成功分派出的属性在此汇入</text>
<rect x="40" y="634" width="880" height="48" rx="9" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="480.0" y="654.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#047857">create_annotation_mark(handle, key, attr)</text>
<text x="480.0" y="670.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#047857">→ annotation::MarkOp + setAttr</text>
<text x="480.0" y="700" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#4d7c0f">ascend_ir.cc:L597-L603——落地的是旁挂标记 op，原 op 不改</text>
<rect x="40" y="722" width="880" height="98" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="5,4"/>
<text x="58" y="744" font-family="sans-serif" font-size="12" font-weight="bold" fill="#475569">两个入口并不等价：compile_hint（公开）严于 compile_hint_impl（内部）</text>
<text x="58" y="764" font-family="sans-serif" font-size="11" fill="#475569">SIMT 模式下 compile_hint 早退，0 个 mark；但 multibuffer 直呼 compile_hint_impl，仍发 1 个 hivm.multi_buffer=2:i32</text>
<text x="58" y="783" font-family="sans-serif" font-size="11" fill="#c2410c">——生效中的门控只写在 compile_hint 里（aux_ops.py:L137-L139）；compile_hint_impl 里那份是注释掉的 FIXME（L115-L118），不拦任何东西</text>
<text x="58" y="802" font-family="sans-serif" font-size="11" fill="#6d28d9">——constexpr 一路同理：公开入口 L146-L150 先把它解成裸 str，impl 没有 str 分支 ⇒ ValueError；只有直呼 impl 才走得到 get_str_attr</text>
<text x="40" y="850" font-family="sans-serif" font-size="12" fill="#334155">五路分派 + 旁挂标记：compile_hint 只负责“告诉编译器一件事”，从不改动被提示的那个 op 本身。</text>
</svg>