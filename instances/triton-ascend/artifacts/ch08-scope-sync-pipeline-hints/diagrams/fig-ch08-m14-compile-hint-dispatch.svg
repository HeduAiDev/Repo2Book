<text x="425.0" y="389.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">hint_val 是 core.constexpr 实例</text>
<text x="425.0" y="404.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">仅内部入口可达：直呼 compile_hint_impl</text>
