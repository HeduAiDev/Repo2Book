<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1478 452">
<rect width="1478" height="452" fill="white"/>
<text x="34" y="34" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e40af">handle_scope_with 两趟 visit：先试跑数变量，再正式建 IR</text>
<text x="34" y="56" font-family="sans-serif" font-size="11.5" fill="#64748b">示例：with scope(core_mode="vector", disable_auto_sync=True, my_hint=3): a=a+1; c=a*2（scope_defs={a,c}，k=2）</text>
<rect x="184" y="108" width="307" height="34" rx="4" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="337.5" y="129.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="white" font-weight="bold">① 试跑（第 1 趟）</text>
<rect x="499" y="108" width="307" height="34" rx="4" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="652.5" y="129.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="white" font-weight="bold">② 建 scope.scope</text>
<rect x="814" y="108" width="307" height="34" rx="4" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="967.5" y="129.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="white" font-weight="bold">③ 正式重跑（第 2 趟）</text>
<rect x="1129" y="108" width="307" height="34" rx="4" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="1282.5" y="129.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="white" font-weight="bold">④ 封口回填</text>
<text x="168" y="175.0" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="bold" fill="#374151">插入点</text>
<rect x="184" y="152" width="307" height="38" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="337.5" y="175.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#374151" >func.entry → block1（dummy）</text>
<rect x="499" y="152" width="307" height="38" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="652.5" y="175.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#374151" >回到 func.entry → region#0</text>
<rect x="814" y="152" width="307" height="38" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="967.5" y="175.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#374151" >block2:start</text>
<rect x="1129" y="152" width="307" height="38" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="1282.5" y="175.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#374151" >block2:end → func.entry</text>
<text x="168" y="237.0" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="bold" fill="#374151">builder 动作</text>
<rect x="184" y="198" width="307" height="70" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="337.5" y="221.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#374151" >create_block()</text>
<text x="337.5" y="236.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#374151" >visit_compound_statement ×1</text>
<text x="337.5" y="251.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#374151" >dummy.erase()</text>
<rect x="499" y="198" width="307" height="70" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="652.5" y="229.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#374151" >create_scope_op(attrs, 2 个结果类型)</text>
<text x="652.5" y="244.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#374151" >create_block_with_parent(region#0, [])</text>
<rect x="814" y="198" width="307" height="70" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="967.5" y="229.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#374151" >lscope ← liveins 副本</text>
<text x="967.5" y="244.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#374151" >visit_compound_statement ×2</text>
<rect x="1129" y="198" width="307" height="70" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="1282.5" y="237.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#374151" >scope_return([%3, %4])</text>
<text x="168" y="299.0" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="bold" fill="#374151">SSA 产物</text>
<rect x="184" y="276" width="307" height="38" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="337.5" y="299.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#b91c1c" font-weight="bold" >%1=a, %2=c</text>
<rect x="499" y="276" width="307" height="38" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="652.5" y="299.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#374151" >—</text>
<rect x="814" y="276" width="307" height="38" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
<text x="967.5" y="299.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#047857" font-weight="bold" >%3=a, %4=c</text>
<rect x="1129" y="276" width="307" height="38" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="1282.5" y="299.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#374151" >2 个操作数</text>
<text x="168" y="361.0" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="bold" fill="#374151">local_defs / 结果</text>
<rect x="184" y="322" width="307" height="70" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="337.5" y="353.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#374151" >names=[a,c] 冻结</text>
<text x="337.5" y="368.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#374151" >（随 block 一起作废）</text>
<rect x="499" y="322" width="307" height="70" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="652.5" y="345.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#374151" >attrs={noinline, tcore_type&lt;VECTOR&gt;,</text>
<text x="652.5" y="360.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#374151" >hivm.disable_auto_sync, my_hint}</text>
<text x="652.5" y="375.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#374151" >区入口块参数=0</text>
<rect x="814" y="322" width="307" height="70" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="967.5" y="353.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#374151" >local_defs 含残留</text>
<text x="967.5" y="368.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#374151" >{a:%1,c:%2}（不影响 names）</text>
<rect x="1129" y="322" width="307" height="70" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="1282.5" y="353.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#374151" >a→%scope_res0, c→%scope_res1</text>
<text x="1282.5" y="368.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#374151" >n 仍是 %n_outer</text>
<text x="34" y="428" font-family="sans-serif" font-size="11" fill="#64748b">红=第 1 趟随 dummy block 一起作废（%1,%2）；绿=第 2 趟真正进 region、经 scope.return 回填外层（%3,%4）——两趟共造 4 个 SSA 值，2 个被丢。</text>
</svg>