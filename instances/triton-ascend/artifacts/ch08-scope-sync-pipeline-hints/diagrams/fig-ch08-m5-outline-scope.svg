<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1170 560">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker></defs>
<rect width="1170" height="560" fill="white"/>
<text x="40" y="34" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">outline-scope pass：scope.scope 只是临时容器</text>
<text x="40" y="56" font-family="sans-serif" font-size="12.5" fill="#64748b">核类型最终落在函数属性上，不是语句属性——原地换成一次 call</text>
<text x="275.0" y="94" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Before —— ttir 阶段</text>
<rect x="40" y="118" width="470" height="360" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="1.6" stroke-dasharray="6,4"/>
<text x="58" y="144" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">func.func @test_scope</text>
<rect x="70" y="164" width="410" height="70" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="275.0" y="204.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1d4ed8" font-weight="bold">scope.scope { tcore_type&lt;CUBE&gt; }</text>
<rect x="70" y="264" width="410" height="70" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.6"/>
<text x="275.0" y="304.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#6d28d9" font-weight="bold">scope.scope { tcore_type&lt;VECTOR&gt; }</text>
<text x="70" y="428" font-family="sans-serif" font-size="10.5" fill="#64748b">SizedRegion&lt;1&gt;、NoRegionArguments，</text>
<text x="70" y="442" font-family="sans-serif" font-size="10.5" fill="#64748b">SingleBlockImplicitTerminator&lt;scope::ReturnOp&gt;</text>
<text x="70" y="460" font-family="sans-serif" font-size="10.5" fill="#64748b">ScopeOp 声明属性仅 1 个（UnitAttr no_inline）；</text>
<text x="70" y="474" font-family="sans-serif" font-size="10.5" fill="#64748b">tcore_type 等以 discardable attr 挂上</text>
<text x="895.0" y="94" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">After —— ttadapter 阶段（outline-scope pass 之后）</text>
<rect x="660" y="118" width="470" height="150" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="1.6" stroke-dasharray="6,4"/>
<text x="678" y="144" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">func.func @test_scope</text>
<rect x="690" y="162" width="410" height="40" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="895.0" y="187" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#78350f" font-weight="bold">call @test_scope_0</text>
<rect x="690" y="218" width="410" height="40" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="895.0" y="243" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#78350f" font-weight="bold">call @test_scope_1</text>
<rect x="660" y="302" width="470" height="66" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="895.0" y="329" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1d4ed8" font-weight="bold">func.func @test_scope_0</text>
<text x="895.0" y="349" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1d4ed8">attributes {tcore_type&lt;CUBE&gt;}</text>
<rect x="660" y="384" width="470" height="66" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.6"/>
<text x="895.0" y="411" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#6d28d9" font-weight="bold">func.func @test_scope_1</text>
<text x="895.0" y="431" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6d28d9">attributes {tcore_type&lt;VECTOR&gt;}</text>
<line x1="518" y1="310" x2="652" y2="310" stroke="#d97706" stroke-width="2.6" marker-end="url(#a)"/>
<text x="585.0" y="296" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#b45309">outline-scope pass</text>
<text x="585.0" y="332" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#b45309">（反向：InlineScope）</text>
<text x="40" y="534" font-family="sans-serif" font-size="11.5" fill="#334155">外提出 2 个函数（@test_scope_0/@test_scope_1）：tcore_type 从 op 属性搬到 func.func 的 attributes，原地留下 call。</text>
</svg>