<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 645">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker><marker id="ag" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#15803d"/></marker><marker id="ao" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#c2410c"/></marker></defs>
<rect width="980" height="645" fill="white"/>
<text x="40" y="32" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">visit_With 分派：scope 类对象本身就是字典键</text>
<text x="40" y="52" font-family="sans-serif" font-size="12.5" fill="#64748b">with scope(...) 不走 Python 上下文管理器协议——__enter__/__exit__ 不参与</text>
<rect x="40" y="78" width="620" height="44" rx="9" fill="#e2e8f0" stroke="#64748b" stroke-width="1.6"/>
<text x="350.0" y="96.0" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#0f172a">visit_With(node)</text>
<text x="350.0" y="113.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#0f172a">assert len(node.items) == 1</text>
<line x1="350.0" y1="122" x2="350.0" y2="148" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
<text x="368.0" y="140" text-anchor="start" font-family="sans-serif" font-size="11.5" fill="#475569">python/triton/compiler/code_generator.py:L803</text>
<rect x="40" y="148" width="620" height="46" rx="9" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
<text x="350.0" y="167.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#0f172a">context = node.items[0].context_expr</text>
<text x="350.0" y="184.0" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#0f172a">isinstance(context, ast.Call) ?</text>
<line x1="350.0" y1="194" x2="350.0" y2="220" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
<text x="368.0" y="212" text-anchor="start" font-family="sans-serif" font-size="11.5" fill="#475569">是 → 继续；否 → 无 with 语义（直接跳最终兜底）</text>
<rect x="40" y="220" width="620" height="46" rx="9" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
<text x="350.0" y="239.0" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#0f172a">withitemClass = self.visit(context.func)</text>
<text x="350.0" y="256.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#0f172a">查表键 = scope 类对象本身（不是字符串）</text>
<line x1="350.0" y1="266" x2="350.0" y2="292" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
<text x="368.0" y="284" text-anchor="start" font-family="sans-serif" font-size="11.5" fill="#475569">third_party/ascend/language/cann/extension/dispatch.py:L32</text>
<rect x="50.0" y="292" width="600" height="90" rx="9" fill="#fefce8" stroke="#ca8a04" stroke-width="1.6"/>
<text x="350.0" y="312" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#713f12">WITH_DISPATCH.get(withitemClass)</text>
<text x="350.0" y="330" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#854d0e">基座初值 {}（code_generator.py:L26）+ ASCEND_WITH_DISPATCH 注入 2 项</text>
<text x="350.0" y="350" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#713f12">{ scope 类: handle_scope_with,  "mangle_ty": mangle_ty }</text>
<text x="350.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a16207">dispatch.py:L31-L34——scope 类本身当 key</text>
<line x1="350.0" y1="382" x2="350.0" y2="400" stroke="#334155" stroke-width="1.6"/>
<line x1="230" y1="400" x2="230" y2="422" stroke="#15803d" stroke-width="1.8" marker-end="url(#ag)"/>
<line x1="550" y1="400" x2="550" y2="422" stroke="#c2410c" stroke-width="1.8" marker-end="url(#ao)"/>
<line x1="230" y1="400" x2="550" y2="400" stroke="#334155" stroke-width="1.6"/>
<text x="230" y="395" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#15803d">命中</text>
<text x="550" y="395" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#c2410c">未命中</text>
<rect x="80" y="422" width="300" height="78" rx="9" fill="#f0fdf4" stroke="#15803d" stroke-width="1.8"/>
<text x="230" y="444" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#14532d">handler(self, node)</text>
<text x="230" y="462" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#166534">= handle_scope_with(self, node)</text>
<text x="230" y="480" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#166534">传的是整条 with 的 AST 节点</text>
<text x="230" y="496" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#4d7c0f">code_generator.py:L809-L811</text>
<rect x="400" y="422" width="300" height="78" rx="9" fill="#fff7ed" stroke="#c2410c" stroke-width="1.8"/>
<text x="550" y="444" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#7c2d12">visit_compound_statement(node.body)</text>
<text x="550" y="462" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#9a3412">等价于把 with 当透明壳</text>
<text x="550" y="480" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#9a3412">__enter__/__exit__ 全程不参与、无 IR</text>
<text x="550" y="496" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#c2410c">code_generator.py:L813-L814</text>
<text x="40" y="534" font-family="sans-serif" font-size="12" fill="#334155">ch04 讲过的“按 is_builtin 路由”同一思路的第二个入口：这次分派发生在 with 语句上。</text>
</svg>