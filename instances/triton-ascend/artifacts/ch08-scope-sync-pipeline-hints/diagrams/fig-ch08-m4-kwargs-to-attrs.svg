<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1086 570">
<rect width="1086" height="570" fill="white"/>
<text x="40" y="40" font-family="sans-serif" font-size="16.5" font-weight="bold" fill="#0f172a">关键字 → 属性翻译表：白名单外的写法不报错，只是静默不生效</text>
<text x="40" y="62" font-family="sans-serif" font-size="11.5" fill="#64748b">_extract_scope_attributes 只认 ast.Constant 关键字实参；_build_mlir_attrs_from_scope_attrs 逐项翻译</text>
<text x="56" y="88" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#64748b">调用写法</text>
<text x="502" y="88" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#64748b">生成的 scope.scope 属性 / 结果</text>
<rect x="40" y="96" width="430" height="36" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.3"/>
<text x="56" y="119.0" font-family="sans-serif" font-size="12.5" fill="#1e3a8a">默认（无关键字）</text>
<line x1="472" y1="114.0" x2="484" y2="114.0" stroke="#1d4ed8" stroke-width="1.6"/>
<path d="M479,110.0 L485,114.0 L479,118.0 Z" fill="#1d4ed8"/>
<rect x="486" y="96" width="560" height="36" rx="6" fill="white" stroke="#1d4ed8" stroke-width="1.3"/>
<text x="502" y="119.0" font-family="sans-serif" font-size="12.5" fill="#1e3a8a" >{noinline}（1 个默认属性）</text>
<rect x="40" y="138" width="430" height="36" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.3"/>
<text x="56" y="161.0" font-family="sans-serif" font-size="12.5" fill="#1e3a8a">core_mode="cube"</text>
<line x1="472" y1="156.0" x2="484" y2="156.0" stroke="#1d4ed8" stroke-width="1.6"/>
<path d="M479,152.0 L485,156.0 L479,160.0 Z" fill="#1d4ed8"/>
<rect x="486" y="138" width="560" height="36" rx="6" fill="white" stroke="#1d4ed8" stroke-width="1.3"/>
<text x="502" y="161.0" font-family="sans-serif" font-size="12.5" fill="#1e3a8a" >{noinline, tcore_type&lt;CUBE&gt;}</text>
<rect x="40" y="180" width="430" height="36" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.3"/>
<text x="56" y="203.0" font-family="sans-serif" font-size="12.5" fill="#1e3a8a">core_mode="vector", noinline=False</text>
<line x1="472" y1="198.0" x2="484" y2="198.0" stroke="#1d4ed8" stroke-width="1.6"/>
<path d="M479,194.0 L485,198.0 L479,202.0 Z" fill="#1d4ed8"/>
<rect x="486" y="180" width="560" height="36" rx="6" fill="white" stroke="#1d4ed8" stroke-width="1.3"/>
<text x="502" y="203.0" font-family="sans-serif" font-size="12.5" fill="#1e3a8a" >{tcore_type&lt;VECTOR&gt;}（noinline 被 pop 掉）</text>
<rect x="40" y="222" width="430" height="36" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.3"/>
<text x="56" y="245.0" font-family="sans-serif" font-size="12.5" fill="#1e3a8a">core_mode="vector", disable_auto_sync=True</text>
<line x1="472" y1="240.0" x2="484" y2="240.0" stroke="#1d4ed8" stroke-width="1.6"/>
<path d="M479,236.0 L485,240.0 L479,244.0 Z" fill="#1d4ed8"/>
<rect x="486" y="222" width="560" height="36" rx="6" fill="white" stroke="#1d4ed8" stroke-width="1.3"/>
<text x="502" y="245.0" font-family="sans-serif" font-size="12.5" fill="#1e3a8a" >多出 hivm.disable_auto_sync = #bool&lt;true&gt;</text>
<rect x="40" y="264" width="430" height="36" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.3"/>
<text x="56" y="287.0" font-family="sans-serif" font-size="12.5" fill="#1e3a8a">core_mode="vector", disable_auto_sync=False</text>
<line x1="472" y1="282.0" x2="484" y2="282.0" stroke="#1d4ed8" stroke-width="1.6"/>
<path d="M479,278.0 L485,282.0 L479,286.0 Z" fill="#1d4ed8"/>
<rect x="486" y="264" width="560" height="36" rx="6" fill="white" stroke="#1d4ed8" stroke-width="1.3"/>
<text x="502" y="287.0" font-family="sans-serif" font-size="12.5" fill="#1e3a8a" >什么都不加（属性数回落到 2）</text>
<rect x="40" y="306" width="430" height="36" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="1.3"/>
<text x="56" y="329.0" font-family="sans-serif" font-size="12.5" fill="#7c2d12">core_mode="aicore"（不在白名单）</text>
<line x1="472" y1="324.0" x2="484" y2="324.0" stroke="#c2410c" stroke-width="1.6"/>
<path d="M479,320.0 L485,324.0 L479,328.0 Z" fill="#c2410c"/>
<rect x="486" y="306" width="560" height="36" rx="6" fill="white" stroke="#c2410c" stroke-width="1.3"/>
<text x="502" y="329.0" font-family="sans-serif" font-size="12.5" fill="#7c2d12" font-weight="bold" >⚠ 静默无 tcore_type，只剩 {noinline}</text>
<rect x="40" y="348" width="430" height="36" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="1.3"/>
<text x="56" y="371.0" font-family="sans-serif" font-size="12.5" fill="#7c2d12">位置参数写法 scope("vector")</text>
<line x1="472" y1="366.0" x2="484" y2="366.0" stroke="#c2410c" stroke-width="1.6"/>
<path d="M479,362.0 L485,366.0 L479,370.0 Z" fill="#c2410c"/>
<rect x="486" y="348" width="560" height="36" rx="6" fill="white" stroke="#c2410c" stroke-width="1.3"/>
<text x="502" y="371.0" font-family="sans-serif" font-size="12.5" fill="#7c2d12" font-weight="bold" >⚠ keywords 为空 ⇒ 无 tcore_type</text>
<rect x="40" y="390" width="430" height="36" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="1.3"/>
<text x="56" y="413.0" font-family="sans-serif" font-size="12.5" fill="#7c2d12">core_mode=mode_var（变量，非常量）</text>
<line x1="472" y1="408.0" x2="484" y2="408.0" stroke="#c2410c" stroke-width="1.6"/>
<path d="M479,404.0 L485,408.0 L479,412.0 Z" fill="#c2410c"/>
<rect x="486" y="390" width="560" height="36" rx="6" fill="white" stroke="#c2410c" stroke-width="1.3"/>
<text x="502" y="413.0" font-family="sans-serif" font-size="12.5" fill="#7c2d12" font-weight="bold" >⚠ 被 _extract_scope_attributes 丢弃 ⇒ 无 tcore_type</text>
<rect x="40" y="432" width="430" height="36" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="1.3"/>
<text x="56" y="455.0" font-family="sans-serif" font-size="12.5" fill="#7c2d12">my_list=[7, 9]（ast.List）</text>
<line x1="472" y1="450.0" x2="484" y2="450.0" stroke="#c2410c" stroke-width="1.6"/>
<path d="M479,446.0 L485,450.0 L479,454.0 Z" fill="#c2410c"/>
<rect x="486" y="432" width="560" height="36" rx="6" fill="white" stroke="#c2410c" stroke-width="1.3"/>
<text x="502" y="455.0" font-family="sans-serif" font-size="12.5" fill="#7c2d12" font-weight="bold" >⚠ 同样被丢弃（不是 ast.Constant）</text>
<text x="40" y="500" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">带 tcore_type 的用例：6 / 10（统计口径：带上 tcore_type 的用例数 / 总用例数）</text>
<text x="40" y="520" font-family="sans-serif" font-size="11" fill="#c2410c">⚠ 标记的 4 行不报任何错误——core_mode 拼错、用位置参数、传变量或 list，都会让 tcore_type 悄悄消失。</text>
</svg>