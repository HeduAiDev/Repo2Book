<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1238 612">
<rect width="1238" height="612" fill="white"/>
<text x="40" y="40" font-family="sans-serif" font-size="16.5" font-weight="bold" fill="#0f172a">关键字 → 属性翻译表：白名单外的写法不报错，只是静默不生效</text>
<text x="40" y="62" font-family="sans-serif" font-size="11.5" fill="#64748b">_extract_scope_attributes 只认 ast.Constant 关键字实参；_build_mlir_attrs_from_scope_attrs 逐项翻译</text>
<text x="56" y="88" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#64748b">调用写法</text>
<text x="542" y="88" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#64748b">生成的 scope.scope 属性 / 结果</text>
<text x="1150.0" y="88" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#64748b">tcore_type</text>
<rect x="40" y="96" width="470" height="36" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="1.3"/>
<text x="56" y="119.0" font-family="sans-serif" font-size="12.5" fill="#7c2d12">scope("vector")（位置参数写法）</text>
<line x1="512" y1="114.0" x2="524" y2="114.0" stroke="#c2410c" stroke-width="1.6"/>
<path d="M519,110.0 L525,114.0 L519,118.0 Z" fill="#c2410c"/>
<rect x="526" y="96" width="560" height="36" rx="6" fill="white" stroke="#c2410c" stroke-width="1.3"/>
<text x="542" y="119.0" font-family="sans-serif" font-size="12.5" fill="#7c2d12" font-weight="bold" >⚠ keywords 为空 ⇒ 无 tcore_type，只剩 {noinline}</text>
<rect x="1102" y="96" width="96" height="36" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
<text x="1150.0" y="119.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#94a3b8">— 无</text>
<rect x="40" y="138" width="470" height="36" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.3"/>
<text x="56" y="161.0" font-family="sans-serif" font-size="12.5" fill="#1e3a8a">scope(core_mode="cube")</text>
<line x1="512" y1="156.0" x2="524" y2="156.0" stroke="#1d4ed8" stroke-width="1.6"/>
<path d="M519,152.0 L525,156.0 L519,160.0 Z" fill="#1d4ed8"/>
<rect x="526" y="138" width="560" height="36" rx="6" fill="white" stroke="#1d4ed8" stroke-width="1.3"/>
<text x="542" y="161.0" font-family="sans-serif" font-size="12.5" fill="#1e3a8a" >{noinline, tcore_type&lt;CUBE&gt;}</text>
<rect x="1102" y="138" width="96" height="36" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.3"/>
<text x="1150.0" y="161.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#15803d">✓ 有</text>
<rect x="40" y="180" width="470" height="36" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.3"/>
<text x="56" y="203.0" font-family="sans-serif" font-size="12.5" fill="#1e3a8a">scope(core_mode="vector")</text>
<line x1="512" y1="198.0" x2="524" y2="198.0" stroke="#1d4ed8" stroke-width="1.6"/>
<path d="M519,194.0 L525,198.0 L519,202.0 Z" fill="#1d4ed8"/>
<rect x="526" y="180" width="560" height="36" rx="6" fill="white" stroke="#1d4ed8" stroke-width="1.3"/>
<text x="542" y="203.0" font-family="sans-serif" font-size="12.5" fill="#1e3a8a" >{noinline, tcore_type&lt;VECTOR&gt;}</text>
<rect x="1102" y="180" width="96" height="36" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.3"/>
<text x="1150.0" y="203.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#15803d">✓ 有</text>
<rect x="40" y="222" width="470" height="36" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.3"/>
<text x="56" y="245.0" font-family="sans-serif" font-size="12.5" fill="#1e3a8a">scope(core_mode="vector", noinline=False)</text>
<line x1="512" y1="240.0" x2="524" y2="240.0" stroke="#1d4ed8" stroke-width="1.6"/>
<path d="M519,236.0 L525,240.0 L519,244.0 Z" fill="#1d4ed8"/>
<rect x="526" y="222" width="560" height="36" rx="6" fill="white" stroke="#1d4ed8" stroke-width="1.3"/>
<text x="542" y="245.0" font-family="sans-serif" font-size="12.5" fill="#1e3a8a" >{tcore_type&lt;VECTOR&gt;}（noinline 被 pop 掉）</text>
<rect x="1102" y="222" width="96" height="36" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.3"/>
<text x="1150.0" y="245.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#15803d">✓ 有</text>
<rect x="40" y="264" width="470" height="36" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.3"/>
<text x="56" y="287.0" font-family="sans-serif" font-size="12.5" fill="#1e3a8a">scope(core_mode="vector", disable_auto_sync=True)</text>
<line x1="512" y1="282.0" x2="524" y2="282.0" stroke="#1d4ed8" stroke-width="1.6"/>
<path d="M519,278.0 L525,282.0 L519,286.0 Z" fill="#1d4ed8"/>
<rect x="526" y="264" width="560" height="36" rx="6" fill="white" stroke="#1d4ed8" stroke-width="1.3"/>
<text x="542" y="287.0" font-family="sans-serif" font-size="12.5" fill="#1e3a8a" >多出 hivm.disable_auto_sync = #bool&lt;true&gt;（共 3 项）</text>
<rect x="1102" y="264" width="96" height="36" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.3"/>
<text x="1150.0" y="287.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#15803d">✓ 有</text>
<rect x="40" y="306" width="470" height="36" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.3"/>
<text x="56" y="329.0" font-family="sans-serif" font-size="12.5" fill="#1e3a8a">scope(core_mode="vector", disable_auto_sync=False)</text>
<line x1="512" y1="324.0" x2="524" y2="324.0" stroke="#1d4ed8" stroke-width="1.6"/>
<path d="M519,320.0 L525,324.0 L519,328.0 Z" fill="#1d4ed8"/>
<rect x="526" y="306" width="560" height="36" rx="6" fill="white" stroke="#1d4ed8" stroke-width="1.3"/>
<text x="542" y="329.0" font-family="sans-serif" font-size="12.5" fill="#1e3a8a" >什么都不加（属性数回落到 2）</text>
<rect x="1102" y="306" width="96" height="36" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.3"/>
<text x="1150.0" y="329.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#15803d">✓ 有</text>
<rect x="40" y="348" width="470" height="36" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="1.3"/>
<text x="56" y="371.0" font-family="sans-serif" font-size="12.5" fill="#7c2d12">scope(core_mode="aicore")（不在白名单）</text>
<line x1="512" y1="366.0" x2="524" y2="366.0" stroke="#c2410c" stroke-width="1.6"/>
<path d="M519,362.0 L525,366.0 L519,370.0 Z" fill="#c2410c"/>
<rect x="526" y="348" width="560" height="36" rx="6" fill="white" stroke="#c2410c" stroke-width="1.3"/>
<text x="542" y="371.0" font-family="sans-serif" font-size="12.5" fill="#7c2d12" font-weight="bold" >⚠ 静默无 tcore_type，只剩 {noinline}</text>
<rect x="1102" y="348" width="96" height="36" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
<text x="1150.0" y="371.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#94a3b8">— 无</text>
<rect x="40" y="390" width="470" height="36" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="1.3"/>
<text x="56" y="413.0" font-family="sans-serif" font-size="12.5" fill="#7c2d12">scope(core_mode=mode_var)（变量，非常量）</text>
<line x1="512" y1="408.0" x2="524" y2="408.0" stroke="#c2410c" stroke-width="1.6"/>
<path d="M519,404.0 L525,408.0 L519,412.0 Z" fill="#c2410c"/>
<rect x="526" y="390" width="560" height="36" rx="6" fill="white" stroke="#c2410c" stroke-width="1.3"/>
<text x="542" y="413.0" font-family="sans-serif" font-size="12.5" fill="#7c2d12" font-weight="bold" >⚠ 被 _extract_scope_attributes 丢弃 ⇒ 无 tcore_type</text>
<rect x="1102" y="390" width="96" height="36" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
<text x="1150.0" y="413.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#94a3b8">— 无</text>
<rect x="40" y="432" width="470" height="36" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.3"/>
<text x="56" y="455.0" font-family="sans-serif" font-size="12.5" fill="#1e3a8a">scope(feature_a=True)</text>
<line x1="512" y1="450.0" x2="524" y2="450.0" stroke="#1d4ed8" stroke-width="1.6"/>
<path d="M519,446.0 L525,450.0 L519,454.0 Z" fill="#1d4ed8"/>
<rect x="526" y="432" width="560" height="36" rx="6" fill="white" stroke="#1d4ed8" stroke-width="1.3"/>
<text x="542" y="455.0" font-family="sans-serif" font-size="12.5" fill="#1e3a8a" >{noinline, feature_a = #bool&lt;true&gt;}（其余原样透传）</text>
<rect x="1102" y="432" width="96" height="36" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
<text x="1150.0" y="455.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#94a3b8">— 无</text>
<rect x="40" y="474" width="470" height="36" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="1.3"/>
<text x="56" y="497.0" font-family="sans-serif" font-size="12.5" fill="#7c2d12">scope(core_mode="cube", my_hint=3, my_tag="x", my_list=[7, 9])</text>
<line x1="512" y1="492.0" x2="524" y2="492.0" stroke="#c2410c" stroke-width="1.6"/>
<path d="M519,488.0 L525,492.0 L519,496.0 Z" fill="#c2410c"/>
<rect x="526" y="474" width="560" height="36" rx="6" fill="white" stroke="#c2410c" stroke-width="1.3"/>
<text x="542" y="497.0" font-family="sans-serif" font-size="12.5" fill="#7c2d12" font-weight="bold" >⚠ my_list 被丢弃（ast.List 不是 ast.Constant），其余三项照常落地</text>
<rect x="1102" y="474" width="96" height="36" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.3"/>
<text x="1150.0" y="497.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#15803d">✓ 有</text>
<text x="40" y="542" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">带 tcore_type 的用例：6 / 10 —— 上表十行即全部用例，右列「✓ 有」正好 6 行。</text>
<text x="40" y="562" font-family="sans-serif" font-size="11" fill="#c2410c">⚠ 标记的 4 行不报任何错误——core_mode 拼错、用位置参数、传变量或 list，都会让 tcore_type 悄悄消失。</text>
</svg>