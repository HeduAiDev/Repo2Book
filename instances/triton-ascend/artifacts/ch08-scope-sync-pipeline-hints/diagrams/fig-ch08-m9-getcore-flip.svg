<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 818 576">
<rect width="818" height="576" fill="white"/>
<text x="34" y="34" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e40af">GetCore：同一个 sender，set 落发方核、wait 落收方核</text>
<text x="34" y="56" font-family="sans-serif" font-size="11.5" fill="#64748b">third_party/ascend/ascend_ir.cc:L93-L113——纯函数，输入只有 (opName, sender)，两层二分支、无循环</text>
<rect x="224" y="106" width="252" height="36" rx="4" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="350.0" y="128.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="white" font-weight="bold">sender = "cube"</text>
<rect x="484" y="106" width="252" height="36" rx="4" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="610.0" y="128.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="white" font-weight="bold">sender = "vector"</text>
<text x="208" y="185.0" text-anchor="end" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#374151">sync_block_set</text>
<rect x="224" y="152" width="252" height="56" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="350.0" y="185.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1d4ed8" font-weight="bold">TCoreType::CUBE</text>
<rect x="484" y="152" width="252" height="56" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
<text x="610.0" y="185.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#6d28d9" font-weight="bold">TCoreType::VECTOR</text>
<text x="208" y="249.0" text-anchor="end" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#374151">sync_block_wait</text>
<rect x="224" y="216" width="252" height="56" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
<text x="350.0" y="249.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#6d28d9" font-weight="bold">TCoreType::VECTOR</text>
<rect x="484" y="216" width="252" height="56" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="610.0" y="249.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1d4ed8" font-weight="bold">TCoreType::CUBE</text>
<rect x="34" y="306" width="710" height="52" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
<text x="50" y="328" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#7c2d12">sender = "aicore"（非 cube/vector）→ std::runtime_error</text>
<text x="50" y="346" font-family="sans-serif" font-size="11" fill="#9a3412">C++ 侧再兜一次底：只支持 cube 或 vector 作为 sender（ascend_ir.cc:L103-L105）</text>
<rect x="34" y="384" width="710" height="66" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.3"/>
<text x="50" y="406" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155">对照：Python 层默认 pipe（不显式指定时）</text>
<text x="50" y="426" font-family="sans-serif" font-size="11.5" fill="#334155">cube 发 → PIPE_FIX / PIPE_MTE2</text>
<text x="50" y="442" font-family="sans-serif" font-size="11.5" fill="#334155">vector 发 → PIPE_MTE3 / PIPE_MTE2</text>
<text x="34" y="480" font-family="sans-serif" font-size="12" fill="#334155">翻转表只有 2×2=4 格，却支撑起整个核间同步的落核规则：set 落 sender 核、wait 落另一核，两者恒互补。</text>
</svg>