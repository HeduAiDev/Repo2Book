<text x="34" y="318" font-family="sans-serif" font-size="12" fill="#334155">收方 pipe 在两种缺省配对里恒为 PIPE_MTE2（core.py:L215-L220）——最容易踩的坑不是「另一边用缺省」，而是单边给等于把另一边留成 None。</text>
<text x="34" y="338" font-family="sans-serif" font-size="11" fill="#c2410c">这些 pipe 各自对应哪条硬件队列、为何收方总是 MTE2，源码未给出依据——不臆测，见 open_question。</text>
