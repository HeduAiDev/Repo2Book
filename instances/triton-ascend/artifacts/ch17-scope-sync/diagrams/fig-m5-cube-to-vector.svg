<text x="40" y="316" font-family="sans-serif" font-size="12.5" fill="#0f172a">同步管时序、搬运管位置+格式：set 在搬运源之后、wait 在搬运目的之前，fixpipe 负责把 nz 布局的 cube 结果 NZ2ND 落进 vector 能读的 UB。少了 fixpipe，vector 连地址空间都够不着。</text>
