<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 358">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker></defs>
<rect width="1240" height="358" fill="white"/>
<text x="40" y="40" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">add_auto_scheduling 的 pass 顺序(compiler.py:L123-127)</text>
<text x="40" y="64" font-family="sans-serif" font-size="12.5" fill="#64748b">先在扁平 IR 上同步,再切 scope——顺序颠倒会让「找跨核边」跨 region,复杂得多</text>
<rect x="40" y="110" width="340" height="92" rx="10" fill="#dbeafe" stroke="#1e3a5f" stroke-width="1.6"/>
<text x="210.0" y="140" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1e3a5f">add_dag_sync</text>
<text x="210.0" y="163" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">compiler.py:L123</text>
<text x="210.0" y="228" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#0f172a">扁平 IR 上插 set/wait + 搬运</text>
<line x1="380" y1="156.0" x2="444" y2="156.0" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="450" y="110" width="340" height="92" rx="10" fill="#dbeafe" stroke="#1e3a5f" stroke-width="1.6"/>
<text x="620.0" y="140" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1e3a5f">add_dag_scope</text>
<text x="620.0" y="163" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">compiler.py:L124</text>
<text x="620.0" y="228" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#0f172a">切成 AIC/AIV 两个 scope</text>
<line x1="790" y1="156.0" x2="854" y2="156.0" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="860" y="110" width="340" height="92" rx="10" fill="#dbeafe" stroke="#1e3a5f" stroke-width="1.6"/>
<text x="1030.0" y="140" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1e3a5f">add_dag_ssbuffer</text>
<text x="1030.0" y="163" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">compiler.py:L127</text>
<text x="1030.0" y="228" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#0f172a">收尾:静态共享缓冲分配</text>
<circle cx="60" cy="94" r="13" fill="#3b82f6"/>
<text x="60" y="99" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="white">1</text>
<circle cx="470" cy="94" r="13" fill="#3b82f6"/>
<text x="470" y="99" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="white">2</text>
<circle cx="880" cy="94" r="13" fill="#3b82f6"/>
<text x="880" y="99" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="white">3</text>
<text x="40" y="262" font-family="sans-serif" font-size="12.5" fill="#0f172a">先在线性数据流上找跨核边插 set/wait+搬运最直观；切 scope 会把 cube/vector 拆进两个 region，再找跨核边要跨 region——所以 DAGSync 必须先跑。</text>
<text x="40" y="286" font-family="sans-serif" font-size="12" fill="#64748b">本图仅标 3 个 pass 调用行(L123/L124/L127)；完整 if 判断块见正文 compiler.py:L122-L129。</text>
</svg>