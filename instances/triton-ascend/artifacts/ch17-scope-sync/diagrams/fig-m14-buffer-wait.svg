<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 782">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker></defs>
<rect width="1000" height="782" fill="white"/>
<text x="40" y="40" font-family="sans-serif" font-size="16.5" font-weight="bold" fill="#0f172a">processFixpipeOpsInAIC:aic/aiv 两 region 靠 static_flag_id 配对的 buffer 就绪握手</text>
<text x="40" y="64" font-family="sans-serif" font-size="11.5" fill="#64748b">每个 fixpipe 触发 3 个正程同步 op(1 set+2 wait) + 1 个回程 set,配对键=static_flag_id(DAGScope.cpp:L756-817,L885-939)</text>
<rect x="90.0" y="100" width="200" height="32" rx="6" fill="#dcfce7" stroke="#15803d"/>
<text x="190.0" y="122" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#15803d">aiv region</text>
<line x1="190.0" y1="136" x2="190.0" y2="622" stroke="#cbd5e1" stroke-dasharray="4,4"/>
<rect x="710.0" y="100" width="200" height="32" rx="6" fill="#dbeafe" stroke="#1e40af"/>
<text x="810.0" y="122" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#1e40af">aic region</text>
<line x1="810.0" y1="136" x2="810.0" y2="622" stroke="#cbd5e1" stroke-dasharray="4,4"/>
<rect x="40.0" y="150" width="300" height="52" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
<text x="190.0" y="171" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#15803d">① aiv 头:set(VECTOR)</text>
<text x="190.0" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#15803d">flag = newflag</text>
<rect x="660.0" y="280" width="300" height="52" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.6"/>
<text x="810.0" y="301" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#1e40af">② fixpipe 前:wait(CUBE)</text>
<text x="810.0" y="320" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e40af">flag = newflag</text>
<rect x="660.0" y="410" width="300" height="52" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.6"/>
<text x="810.0" y="431" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#1e40af">③ aic 尾 return 前:wait(CUBE)</text>
<text x="810.0" y="450" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e40af">flag = newflag(同①)</text>
<rect x="40.0" y="540" width="300" height="52" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.6" stroke-dasharray="3,3"/>
<text x="190.0" y="561" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#15803d">④ 回程:wait(flag2)后插 set(VECTOR)</text>
<text x="190.0" y="580" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#15803d">flag = newflag(供下一轮复用)</text>
<line x1="340.0" y1="176.0" x2="656.0" y2="306.0" stroke="#15803d" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#a)"/>
<line x1="340.0" y1="182.0" x2="656.0" y2="436.0" stroke="#15803d" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#a)"/>
<text x="500.0" y="231.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#15803d">同 flag 配对</text>
<circle cx="24.0" cy="176.0" r="13" fill="#3b82f6"/>
<text x="24.0" y="180.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="white">1</text>
<circle cx="644.0" cy="306.0" r="13" fill="#3b82f6"/>
<text x="644.0" y="310.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="white">2</text>
<circle cx="644.0" cy="436.0" r="13" fill="#3b82f6"/>
<text x="644.0" y="440.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="white">3</text>
<circle cx="24.0" cy="566.0" r="13" fill="#3b82f6"/>
<text x="24.0" y="570.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="white">4</text>
<text x="40.0" y="618" font-family="sans-serif" font-size="10.5" font-style="italic" fill="#64748b">(为下一次同 flag 的 wait 预先释放,本图不展示其配对对象)</text>
<text x="40" y="652" font-family="sans-serif" font-size="12.5" fill="#0f172a">两条泳道 = 两颗核的 region。箭头是同 flag 的 set→wait 配对：aiv 头 set 告诉 aic「buffer 腾好了」，</text>
<text x="40" y="674" font-family="sans-serif" font-size="12.5" fill="#0f172a">aic fixpipe 前 wait 等到才搬。每个 wait 都有源，才不会有人干等——这就是不死锁的保证。</text>
</svg>