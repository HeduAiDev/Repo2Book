<text x="40" y="320" font-family="sans-serif" font-size="12.5" fill="#0f172a">反方向比正方向多一层：cube 读数据要进 L1(CBUF) 且按 32B 对齐重排成 nz(见下图)，所以搬运链更长——to_memref 出 UB、copy 进 CBUF、convert_layout 只逻辑标 ND(物理仍是 nz，不拷贝不改字节)，全部搬完 set，cube 侧 wait 到才开算。</text>
