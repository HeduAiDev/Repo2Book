<text x="40" y="64" font-family="sans-serif" font-size="11.5" fill="#64748b">srcOp(vector) 后插 set(VECTOR,PIPE_MTE3/PIPE_MTE1) → to_memref(UB) → CBUF(L1) nz alloc → copy → convert_layout(标 ND，物理仍 nz) → dstOp(cube) 前插 wait(CUBE)</text>
<text x="40" y="82" font-family="sans-serif" font-size="11" fill="#64748b">(insertVectorToCubeDataMovement, DAGSync.cpp:L423-545,L681-683,L702-703)</text>
