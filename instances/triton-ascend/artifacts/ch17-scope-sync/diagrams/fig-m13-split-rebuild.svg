<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 740">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker></defs>
<rect width="890" height="740" fill="white"/>
<text x="40" y="40" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">SplitScope:一个骨架 → 两份按核裁剪的副本(clone+裁剪,非搬移)</text>
<text x="40" y="64" font-family="sans-serif" font-size="11.5" fill="#64748b">aiv 遍丢 CUBE_ONLY 迭代参数/结果、aic 遍丢 VECTOR_ONLY 的;原 op 逆序 erase,先删用后删定义(DAGScope.cpp:L650-670)</text>
<text x="210.0" y="136" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#475569">原 scf.for(切分前)</text>
<rect x="40" y="150" width="340" height="460" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
<text x="60" y="180" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">scf.for iter_args(</text>
<text x="60" y="206" font-family="sans-serif" font-size="12" fill="#15803d">  %acc: VECTOR 迭代参数</text>
<text x="60" y="230" font-family="sans-serif" font-size="12" fill="#1e40af">  %m: CUBE 迭代参数</text>
<text x="60" y="254" font-family="sans-serif" font-size="12.5" fill="#0f172a">)</text>
<rect x="56" y="272" width="308" height="36" rx="6" fill="#dbeafe" stroke="#1e40af"/>
<text x="210.0" y="295" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1e40af">%c = dot(...) (cube)</text>
<rect x="56" y="316" width="308" height="36" rx="6" fill="#dcfce7" stroke="#15803d"/>
<text x="210.0" y="339" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#15803d">%v = addf(%acc,...) (vector)</text>
<text x="210.0" y="376" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">yield %v, %c</text>
<text x="670.0" y="136" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#15803d">aiv 副本(丢 CUBE_ONLY)</text>
<rect x="490" y="150" width="360" height="210" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
<text x="510" y="178" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">scf.for iter_args(</text>
<text x="510" y="200" font-family="sans-serif" font-size="11.5" fill="#15803d">  %acc: VECTOR 迭代参数</text>
<text x="510" y="222" font-family="sans-serif" font-size="11.5" fill="#b91c1c" text-decoration="line-through">  %m: CUBE 迭代参数(裁掉)</text>
<text x="510" y="244" font-family="sans-serif" font-size="12" fill="#0f172a">)</text>
<rect x="506" y="262" width="328" height="34" rx="6" fill="white" stroke="#15803d"/>
<text x="670.0" y="284" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#15803d">%v = addf(%acc,...) (vector)</text>
<text x="670.0" y="322" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#0f172a">yield(裁去 %c 对应结果)</text>
<text x="670.0" y="386" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#1e40af">aic 副本(丢 VECTOR_ONLY)</text>
<rect x="490" y="400" width="360" height="210" rx="10" fill="#dbeafe" stroke="#1e40af" stroke-width="1.8"/>
<text x="510" y="428" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">scf.for iter_args(</text>
<text x="510" y="450" font-family="sans-serif" font-size="11.5" fill="#b91c1c" text-decoration="line-through">  %acc: VECTOR 迭代参数(裁掉)</text>
<text x="510" y="472" font-family="sans-serif" font-size="11.5" fill="#1e40af">  %m: CUBE 迭代参数</text>
<text x="510" y="494" font-family="sans-serif" font-size="12" fill="#0f172a">)</text>
<rect x="506" y="512" width="328" height="34" rx="6" fill="white" stroke="#1e40af"/>
<text x="670.0" y="534" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#1e40af">%c = dot(...) (cube)</text>
<text x="670.0" y="572" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#0f172a">yield %c</text>
<path d="M 380 340.0 L 435.0 340.0 L 435.0 255.0 L 486 255.0" fill="none" stroke="#15803d" stroke-width="2" marker-end="url(#a)"/>
<text x="435.0" y="289.5" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#15803d">aiv 遍</text>
<path d="M 380 420.0 L 435.0 420.0 L 435.0 505.0 L 486 505.0" fill="none" stroke="#1e40af" stroke-width="2" marker-end="url(#a)"/>
<text x="435.0" y="454.5" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e40af">aic 遍</text>
<circle cx="56" cy="134" r="12" fill="#3b82f6"/>
<text x="56" y="138" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="white">1</text>
<circle cx="506" cy="134" r="12" fill="#3b82f6"/>
<text x="506" y="138" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="white">2</text>
<circle cx="506" cy="384" r="12" fill="#3b82f6"/>
<text x="506" y="388" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="white">3</text>
<text x="40" y="656" font-family="sans-serif" font-size="12.5" fill="#0f172a">不是简单 move 而是 clone+裁剪：循环骨架在两个 scope 各留一份，各自只跑本核那半迭代。</text>
<text x="40" y="678" font-family="sans-serif" font-size="12.5" fill="#0f172a">裁掉不属本核的 arg/result 是关键——否则副本会引用另一颗核的值；原 op 之后逆序 erase(先删用、后删定义)。</text>
</svg>