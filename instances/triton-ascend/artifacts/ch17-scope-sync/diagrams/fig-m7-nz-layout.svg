<text x="40" y="628" font-family="sans-serif" font-size="12.5" fill="#0f172a">2D 逻辑矩阵 → cube 要的 4D 分形 nz：16 是 cube 分形块高、blk 是 32B 对齐后的最内维宽。这就是 VECTOR→CUBE 搬运里 copy 之前那步 reshape 的目标形状。</text>
