<text x="510.0" y="252" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">encapsulate</text>
<text x="510.0" y="264" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">WithScope</text>
<text x="770.0" y="116" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#475569">两个 scope.scope(切分后即刻状态)</text>
