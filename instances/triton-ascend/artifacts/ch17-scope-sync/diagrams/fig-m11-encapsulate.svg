<text x="40" y="490" font-family="sans-serif" font-size="12.5" fill="#0f172a">scope.scope 是中性容器，靠挂 #hivm.tcore_type&lt;CUBE|VECTOR&gt; 属性标记归哪颗物理核。</text>
<text x="40" y="512" font-family="sans-serif" font-size="12.5" fill="#0f172a">先全塞进 VECTOR、CUBE 留空，是为让下一步 SplitScope 用「复制+裁剪」而非「搬移」来填 CUBE。</text>
