<text x="576" y="370" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e40af">scope.scope [tcore_type=CUBE]</text>
<text x="770.0" y="412.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-style="italic" fill="#1e40af">(空,待 SplitScope 填入)</text>
<circle cx="56" cy="114" r="12" fill="#3b82f6"/>
