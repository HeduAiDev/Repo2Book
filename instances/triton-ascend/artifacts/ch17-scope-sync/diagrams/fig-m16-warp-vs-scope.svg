<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 550">
<rect width="1030" height="550" fill="white"/>
<text x="40" y="40" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">同一个「生产者/消费者分工 + 同步」思想,两种硬件两套物化</text>
<text x="40" y="64" font-family="sans-serif" font-size="12.5" fill="#64748b">昇腾:两颗物理核跨核 + block 级事件;Hopper:同一 SM 内 warp 分组 + 共享内存 mbarrier</text>
<text x="255.0" y="136" text-anchor="middle" font-family="sans-serif" font-size="14.5" font-weight="bold" fill="#1e40af">昇腾(本章,ch17)</text>
<rect x="40" y="150" width="430" height="300" rx="10" fill="#dbeafe" stroke="#1e40af" stroke-width="1.8"/>
<text x="60" y="176" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">分域:2 个物理核</text>
<text x="60" y="198" font-family="sans-serif" font-size="11.5" fill="#1e40af">CUBE scope.scope + VECTOR scope.scope</text>
<text x="60" y="228" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">同步原语</text>
<text x="60" y="250" font-family="sans-serif" font-size="11.5" fill="#1e40af">sync_block_set / sync_block_wait</text>
<text x="60" y="280" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">事件旗池</text>
<text x="60" y="302" font-family="sans-serif" font-size="11.5" fill="#1e40af">14 个 flag id(syncFlag%14 循环复用)</text>
<text x="60" y="332" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">数据搬运</text>
<text x="60" y="354" font-family="sans-serif" font-size="11.5" fill="#1e40af">显式跨地址空间(fixpipe/copy),因跨物理核、无共享内存</text>
<text x="775.0" y="136" text-anchor="middle" font-family="sans-serif" font-size="14.5" font-weight="bold" fill="#7c3aed">Hopper(基座对位)</text>
<rect x="560" y="150" width="430" height="300" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="8,5"/>
<rect x="859" y="134" width="131" height="26" rx="13" fill="#b45309"/>
<text x="924.5" y="152" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="white">对位 · 姊妹篇基座</text>
<text x="580" y="176" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">分域:同一 SM 内</text>
<text x="580" y="198" font-family="sans-serif" font-size="11.5" fill="#7c3aed">producer warp 组 + consumer warp 组</text>
<text x="580" y="228" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">同步原语</text>
<text x="580" y="250" font-family="sans-serif" font-size="11.5" fill="#7c3aed">共享内存 mbarrier</text>
<text x="580" y="280" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">事件资源</text>
<text x="580" y="302" font-family="sans-serif" font-size="11.5" fill="#7c3aed">barrier 对象(SM 内共享内存分配)</text>
<text x="580" y="332" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">数据搬运</text>
<text x="580" y="354" font-family="sans-serif" font-size="11.5" fill="#7c3aed">同一 SM 共享内存直接可见,无需跨地址空间搬运</text>
<text x="40" y="490" font-family="sans-serif" font-size="12.5" fill="#0f172a">同一个「生产者/消费者分工 + 同步」思想，两种硬件两套物化：昇腾是两颗异构物理核跨核 + block 级事件 +</text>
<text x="40" y="512" font-family="sans-serif" font-size="12.5" fill="#0f172a">显式跨地址空间数据搬运；跨物理核这一点决定了昇腾必须显式搬数据而非共享内存。</text>
</svg>