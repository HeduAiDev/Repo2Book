<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 480">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker></defs>
<rect width="980" height="480" fill="white"/>
<text x="30" y="34" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">collectAndLeaves：andi 掩码树递归拍平成叶子集合</text>
<text x="30" y="54" font-family="sans-serif" font-size="12" fill="#64748b">DiscreteMaskAccessConversionPass.cpp:L78-L102</text>
<text x="250" y="80" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e40af">输入：1 棵 andi 树（含 1 个 broadcast）</text>
<rect x="175.0" y="90.0" width="150" height="40" rx="7" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.5"/>
<text x="250" y="115" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">andi(_, c)</text>
<rect x="60.0" y="170.0" width="200" height="40" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="160" y="195" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#0f172a">broadcast(andi(a,b))</text>
<rect x="265.0" y="170.0" width="150" height="40" rx="7" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
<text x="340" y="195" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#0f172a">c</text>
<line x1="220" y1="130.0" x2="170" y2="176.0" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="280" y1="130.0" x2="330" y2="176.0" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="60.0" y="250.0" width="90" height="40" rx="7" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
<text x="105" y="275" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#0f172a">a</text>
<rect x="170.0" y="250.0" width="90" height="40" rx="7" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
<text x="215" y="275" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#0f172a">b</text>
<line x1="140" y1="210.0" x2="110" y2="256.0" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="180" y1="210.0" x2="210" y2="256.0" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<text x="160" y="232.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#b45309">andi(a,b)</text>
<line x1="510" y1="210.0" x2="630" y2="210.0" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<text x="480.0" y="196.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155">collectAndLeaves()</text>
<text x="480.0" y="230.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">broadcast(andi) 分配律下推</text>
<text x="480.0" y="246.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">→ 2 个 broadcast 因子各自递归</text>
<text x="740" y="80" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#15803d">输出：3 个叶子（一次后序遍历各 push 一次）</text>
<rect x="650.0" y="110.0" width="180" height="40" rx="7" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="740" y="135" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#0f172a">bc(a)</text>
<text x="860" y="135" font-family="sans-serif" font-size="12" fill="#166534">leaves[0]</text>
<rect x="650.0" y="200.0" width="180" height="40" rx="7" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="740" y="225" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#0f172a">bc(b)</text>
<text x="860" y="225" font-family="sans-serif" font-size="12" fill="#166534">leaves[1]</text>
<rect x="650.0" y="290.0" width="180" height="40" rx="7" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="740" y="315" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#0f172a">c</text>
<text x="860" y="315" font-family="sans-serif" font-size="12" fill="#166534">leaves[2]</text>
<rect x="30" y="410" width="920" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="46" y="432" font-family="sans-serif" font-size="12.5" fill="#334155">3 个 &amp; 因子拍平成 3 个叶子；藏在 broadcast 里的 &amp; 先按分配律下推，一个因子都不漏，</text>
<text x="46" y="450" font-family="sans-serif" font-size="12.5" fill="#334155">好让每个因子被单独判连续 / 离散。</text>
</svg>