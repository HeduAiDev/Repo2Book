<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker></defs>
<rect width="900" height="640" fill="white"/>
<text x="40" y="34" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">总闸：isDiscreteMask() 复用 MaskState::parse 判连续 vs 离散</text>
<text x="40" y="56" font-family="sans-serif" font-size="12" fill="#64748b">DiscreteMaskAccessConversionPass.cpp:L59-L72</text>
<rect x="300.0" y="92" width="300" height="46" rx="8" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
<text x="450.0" y="120.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0f172a">op 上是否已打 is_discrete_mask 标记？</text>
<rect x="660.0" y="92" width="200" height="46" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="760.0" y="111.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#475569">已标记 →</text>
<text x="760.0" y="128.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#475569">return failure()（防重入）</text>
<line x1="600.0" y1="115.0" x2="660.0" y2="115.0" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
<text x="608.0" y="109.0" font-family="sans-serif" font-size="11" fill="#64748b">是</text>
<line x1="450.0" y1="138" x2="450.0" y2="172" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
<text x="460.0" y="155.0" font-family="sans-serif" font-size="11" fill="#64748b">否</text>
<rect x="260.0" y="172" width="380" height="46" rx="8" fill="#dbeafe" stroke="#1e3a8a" stroke-width="2"/>
<text x="450.0" y="200.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e3a8a">MaskState::parse(mask)</text>
<line x1="450.0" y1="218" x2="220.0" y2="260" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
<text x="220.0" y="254" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">parse 成功（还原成矩形连续区间）</text>
<line x1="450.0" y1="218" x2="680.0" y2="260" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
<text x="680.0" y="254" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">parse 失败（非连续 / 含离散因子）</text>
<rect x="70" y="274" width="300" height="46" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="220.0" y="302.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#14532d">eraseInsertedOps 撤销副作用 op</text>
<line x1="220.0" y1="320" x2="220.0" y2="354" stroke="#15803d" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="70" y="354" width="300" height="46" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="220.0" y="382.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#14532d">return failure()</text>
<line x1="220.0" y1="400" x2="220.0" y2="434" stroke="#15803d" stroke-width="2" marker-end="url(#a)"/>
<rect x="60" y="434" width="320" height="60" rx="8" fill="#22c55e" stroke="#14532d" stroke-width="2"/>
<text x="220.0" y="462.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="white">放行</text>
<text x="220.0" y="480.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="white">走结构化 DMA 下降路径</text>
<rect x="530" y="274" width="300" height="46" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
<text x="680.0" y="302.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#7c2d12">return success()</text>
<line x1="680.0" y1="320" x2="680.0" y2="354" stroke="#c2410c" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="520" y="354" width="320" height="60" rx="8" fill="#f97316" stroke="#7c2d12" stroke-width="2"/>
<text x="680.0" y="382.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="white">本 pass 接管</text>
<text x="680.0" y="400.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="white">离散 load/store/atomic 改写</text>
<rect x="40" y="512" width="820" height="54" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="56" y="534" font-family="sans-serif" font-size="12" fill="#334155">示例：mask = (idx &lt; 200) ∨ (idx &gt; 400)——两段区间的「或」，画不成一个矩形连续区间</text>
<text x="56" y="554" font-family="sans-serif" font-size="12" fill="#334155">→ parse 失败 → 判离散，走右支</text>
</svg>