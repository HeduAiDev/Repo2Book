<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 662">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker><marker id="b" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#b45309"/></marker></defs>
<rect width="900" height="662" fill="white"/>
<text x="40" y="30" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e40af">网格拍平 + 载体构造 — worked example:3×2×1 网格,第 0 号物理块,size=5</text>
<rect x="40" y="70" width="460" height="60" rx="9" fill="#e2e8f0" stroke="#64748b" stroke-width="1.4"/>
<text x="270.0" y="94" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#0f172a">三维网格</text>
<text x="270.0" y="114" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#334155">numX=3, numY=2, numZ=1</text>
<line x1="270.0" y1="130" x2="270.0" y2="185" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
<text x="284.0" y="163.0" font-family="sans-serif" font-size="11.5" fill="#475569">拍平 (AutoBlockify.cpp:L204-205)</text>
<rect x="40" y="188" width="460" height="60" rx="9" fill="#e2e8f0" stroke="#64748b" stroke-width="1.4"/>
<text x="270.0" y="212" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#0f172a">拍平总块数 G</text>
<text x="270.0" y="232" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#334155">G = numX·numY·numZ = 6</text>
<line x1="270.0" y1="248" x2="270.0" y2="303" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
<text x="284.0" y="281.0" font-family="sans-serif" font-size="11.5" fill="#475569">定位物理块0 (L217-220)</text>
<rect x="40" y="306" width="460" height="60" rx="9" fill="#e2e8f0" stroke="#64748b" stroke-width="1.4"/>
<text x="270.0" y="330" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#0f172a">第0号物理块 → logicalBlockId</text>
<text x="270.0" y="350" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#334155">idX=idY=idZ=0 → logicalBlockId = 0</text>
<line x1="270.0" y1="366" x2="270.0" y2="421" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
<text x="284.0" y="399.0" font-family="sans-serif" font-size="11.5" fill="#475569">splat+range(0,size=5) (L222-231)</text>
<rect x="40" y="424" width="460" height="60" rx="9" fill="#e2e8f0" stroke="#64748b" stroke-width="1.4"/>
<text x="270.0" y="448" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#0f172a">连号折叠 blockifiedId</text>
<text x="270.0" y="468" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#334155">splat(0) + range(0,5) = [0,1,2,3,4]</text>
<line x1="270.0" y1="484" x2="270.0" y2="539" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
<text x="284.0" y="517.0" font-family="sans-serif" font-size="11.5" fill="#475569">打包 2 输入 cast (L245-249)</text>
<rect x="40" y="542" width="460" height="60" rx="9" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.2"/>
<text x="270.0" y="566" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#0f172a">双输入载体</text>
<text x="270.0" y="586" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#334155">UnrealizedConversionCastOp(blockifiedId, mask)</text>
<rect x="560" y="454.0" width="300" height="58" rx="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
<text x="710.0" y="476.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#92400e">mask (ori 合成)</text>
<text x="710.0" y="495.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#78350f">upper ORI lower = [T,T,T,T,T]  (L235-243;honesty: 恒全 True)</text>
<line x1="500" y1="454.0" x2="556" y2="483.0" stroke="#b45309" stroke-width="1.6" marker-end="url(#b)"/>
<text x="508" y="446.0" font-family="sans-serif" font-size="11" fill="#92400e">upper/lower 谓词均由 blockifiedId 求出</text>
<line x1="710.0" y1="512.0" x2="440" y2="538" stroke="#b45309" stroke-width="1.6" marker-end="url(#b)"/>
<text x="450.0" y="646" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">blockifiedId 与 mask 一起被双输入 cast 包成——类型不变、语义已批处理的载体,交给 PropagateUnrealizedCastDown 下推</text>
</svg>