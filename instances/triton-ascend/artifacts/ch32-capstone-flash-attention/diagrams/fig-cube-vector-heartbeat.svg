<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1660 470">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker><marker id="b" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#7c3aed"/></marker></defs>
<rect width="1660" height="470" fill="white"/>
<text x="40" y="36" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1e40af">内循环一次迭代 = Cube→Vector→Cube 三段心跳</text>
<text x="40" y="58" font-family="sans-serif" font-size="12" fill="#64748b">_attn_fwd_inner 每处理一个 K/V 块(BLOCK_N 列)走一遍;两次 tl.dot 落 Cube,softmax 全落 Vector</text>
<rect x="40" y="95.0" width="1580" height="110" fill="#eff6ff" opacity="0.6"/>
<text x="52" y="155" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1d4ed8">Cube 核（脉动阵列 · 矩阵乘）</text>
<rect x="40" y="245.0" width="1580" height="110" fill="#ecfdf5" opacity="0.6"/>
<text x="52" y="305" font-family="sans-serif" font-size="13" font-weight="bold" fill="#047857">Vector 核（逐元素 / 规约）</text>
<rect x="250" y="116.0" width="190" height="68" rx="8" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.8"/>
<text x="345.0" y="136.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="white">① QK^T</text>
<text x="345.0" y="154.0" text-anchor="middle" font-family="monospace" font-size="10.5" fill="white">tl.dot(q, trans_k)</text>
<rect x="323.0" y="164.0" width="44" height="16" rx="8" fill="white" opacity="0.95"/>
<text x="345.0" y="176.0" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#1d4ed8">L90</text>
<rect x="486" y="266.0" width="190" height="68" rx="8" fill="#10b981" stroke="#047857" stroke-width="1.8"/>
<text x="581.0" y="286.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="white">② 减 max 稳定化</text>
<text x="581.0" y="304.0" text-anchor="middle" font-family="monospace" font-size="10.5" fill="white">tl.max(qk,1); qk−m_ij</text>
<rect x="549.0" y="314.0" width="64" height="16" rx="8" fill="white" opacity="0.95"/>
<text x="581.0" y="326.0" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#047857">L95-100</text>
<rect x="722" y="266.0" width="190" height="68" rx="8" fill="#10b981" stroke="#047857" stroke-width="1.8"/>
<text x="817.0" y="286.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="white">③ softmax 权重</text>
<text x="817.0" y="304.0" text-anchor="middle" font-family="monospace" font-size="10.5" fill="white">p = tl.math.exp(qk)</text>
<rect x="795.0" y="314.0" width="44" height="16" rx="8" fill="white" opacity="0.95"/>
<text x="817.0" y="326.0" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#047857">L103</text>
<rect x="958" y="266.0" width="190" height="68" rx="8" fill="#10b981" stroke="#047857" stroke-width="1.8"/>
<text x="1053.0" y="286.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="white">④ 分母求和</text>
<text x="1053.0" y="304.0" text-anchor="middle" font-family="monospace" font-size="10.5" fill="white">l_ij = tl.sum(p,1)</text>
<rect x="1031.0" y="314.0" width="44" height="16" rx="8" fill="white" opacity="0.95"/>
<text x="1053.0" y="326.0" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#047857">L113</text>
<rect x="1194" y="266.0" width="190" height="68" rx="8" fill="#10b981" stroke="#047857" stroke-width="1.8"/>
<text x="1289.0" y="286.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="white">⑤ 重标定</text>
<text x="1289.0" y="304.0" text-anchor="middle" font-family="monospace" font-size="10.5" fill="white">alpha = tl.math.exp(m_i−m_ij)</text>
<rect x="1267.0" y="314.0" width="44" height="16" rx="8" fill="white" opacity="0.95"/>
<text x="1289.0" y="326.0" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#047857">L115</text>
<rect x="1430" y="116.0" width="190" height="68" rx="8" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.8"/>
<text x="1525.0" y="136.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="white">⑥ PV</text>
<text x="1525.0" y="154.0" text-anchor="middle" font-family="monospace" font-size="10.5" fill="white">tl.dot(p_cast, v[, acc])</text>
<rect x="1486.5" y="164.0" width="77" height="16" rx="8" fill="white" opacity="0.95"/>
<text x="1525.0" y="176.0" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#1d4ed8">L112,L120</text>
<path d="M440,150 L463.0,150 L463.0,300 L486,300" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="676" y1="300" x2="722" y2="300" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="912" y1="300" x2="958" y2="300" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="1148" y1="300" x2="1194" y2="300" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M1384,300 L1407.0,300 L1407.0,150 L1430,150" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M1525.0,184.0 L1525.0,410.0 L345.0,410.0 L345.0,184.0" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#b)"/>
<text x="935.0" y="430.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#7c3aed">for start_n in range(lo,hi,BLOCK_N) — 下一个 K/V 块,回到①</text>
<rect x="913.0" y="438.0" width="44" height="16" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/>
<text x="935.0" y="450.0" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#7c3aed">L84</text>
</svg>