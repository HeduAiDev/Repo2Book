<text x="526.0" y="682" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#78350f">options.blockDim = max(blockDim / 2, 1) —— cube : vector = 1 : 2（AutoScheduleBase.cpp:L1228）</text>
<text x="526.0" y="704" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#92400e">举例：blockDim 输入 40 → 减半后 20（本章 ShallowCV worked example 沿用）</text>
<text x="46" y="790" font-family="sans-serif" font-size="11" fill="#64748b">同一枚 FusionKind 印章、两处消费：OpFusion 写下它决定融合边界，AutoSchedule 读回它选调度器——无需二次推断融合意图。</text>
