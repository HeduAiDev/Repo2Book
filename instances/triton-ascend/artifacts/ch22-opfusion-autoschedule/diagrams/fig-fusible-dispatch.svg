<text x="46" y="542" font-family="sans-serif" font-size="11" fill="#64748b">ShallowCV 最宽松（cube 与全部 13 类 vector 互融）、MixCV 分两制（10×10 非 matmul 子块 + matmul 独立不对称规则）、SingleCube 恒不融合——同一套判据、不同 kind 判若两表。</text>
