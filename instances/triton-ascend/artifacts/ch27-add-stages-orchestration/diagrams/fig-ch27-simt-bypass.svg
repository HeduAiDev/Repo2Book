<text x="734" y="384" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#7f1d1d">npubin = ttir_to_npubin(...)</text>
<text x="734" y="403" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#7f1d1d">--enable-hivm-compile=false</text>
<text x="734" y="422" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#7f1d1d">--enable-triton-ir-compile</text>
