<text x="60" y="564" font-family="sans-serif" font-size="12" fill="#1e3a5f">force_simt_only 默认值为 False（compiler.py:L775）；旁路是装配层的减法——为真时 add_stages</text>
<text x="60" y="586" font-family="sans-serif" font-size="12" fill="#1e3a5f">只登记 ttir + npubin 并 return（L943-948），ttadapter 那 11 个 add_* 整段不存在，而非在 pass 链内部加 if。</text>
