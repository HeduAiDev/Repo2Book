<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 738">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker></defs>
<rect width="920" height="738" fill="white"/>
<text x="460.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">core / pipe / mode：三个 Python 枚举落成三条 hivm 属性</text>
<text x="460.0" y="52" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">注册期声明的语言层枚举，在 _make_attrs 里一一对应地翻成 IR 属性——这是硬件模型接缝的落点</text>
<text x="155.0" y="90" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#334155">注册期声明（Python 枚举）</text>
<text x="480.0" y="90" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#334155">_make_attrs 的 builder 调用</text>
<text x="785.0" y="90" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#334155">IR 属性名</text>
<rect x="40" y="108" width="230" height="74" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.8"/>
<text x="155.0" y="143.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">core = CORE.VECTOR</text>
<rect x="330" y="108" width="300" height="74" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
<text x="480.0" y="143.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">get_core_type_attr(op.core.value)</text>
<rect x="690" y="108" width="190" height="74" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
<text x="785.0" y="143.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">hivm.tcore_type</text>
<text x="54" y="126" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#0369a1">CORE</text>
<line x1="270" y1="145.0" x2="330" y2="145.0" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="630" y1="145.0" x2="690" y2="145.0" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="40" y="216" width="230" height="74" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.8"/>
<text x="155.0" y="251.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">pipe = PIPE.PIPE_V</text>
<rect x="330" y="216" width="300" height="74" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
<text x="480.0" y="251.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">get_pipe_attr(op.pipe.value)</text>
<rect x="690" y="216" width="190" height="74" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
<text x="785.0" y="251.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">hivm.pipe</text>
<text x="54" y="234" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#0369a1">PIPE</text>
<line x1="270" y1="253.0" x2="330" y2="253.0" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="630" y1="253.0" x2="690" y2="253.0" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="40" y="324" width="230" height="74" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.8"/>
<text x="155.0" y="359.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">mode = MODE.SIMT</text>
<rect x="330" y="324" width="300" height="74" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
<text x="480.0" y="359.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">get_vf_mode_attr(op.mode.value)</text>
<rect x="690" y="324" width="190" height="74" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
<text x="785.0" y="359.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">hivm.vf_mode</text>
<text x="54" y="342" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#0369a1">MODE</text>
<line x1="270" y1="361.0" x2="330" y2="361.0" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="630" y1="361.0" x2="690" y2="361.0" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<text x="40" y="434" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">三个枚举的全部成员（粗体=本例取值）</text>
<text x="40" y="454" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155">CORE（共 4 个）：</text>
<text x="190" y="454" font-family="sans-serif" font-size="11.5" fill="#475569">VECTOR（本例） / CUBE / CUBE_OR_VECTOR / CUBE_AND_VECTOR</text>
<text x="40" y="484" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155">PIPE（共 8 个）：</text>
<text x="190" y="484" font-family="sans-serif" font-size="11.5" fill="#475569">PIPE_S / PIPE_V（本例） / PIPE_M / PIPE_MTE1 / PIPE_MTE2 / PIPE_MTE3 / PIPE_ALL / PIPE_FIX</text>
<text x="40" y="514" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155">MODE（共 3 个）：</text>
<text x="190" y="514" font-family="sans-serif" font-size="11.5" fill="#475569">SIMD / SIMT（本例） / MIX</text>
<rect x="40" y="588" width="840" height="90" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6" stroke-dasharray="6,4"/>
<text x="56" y="612" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#334155">分支：非 __builtin_ 前缀时的额外属性</text>
<text x="56" y="634" font-family="sans-serif" font-size="11.5" fill="#475569">op.name 不以 __builtin_ 开头 → _make_attrs 额外强制 symbol + bitcode 两个属性；</text>
<text x="56" y="654" font-family="sans-serif" font-size="11.5" fill="#475569">必出现的 IR 属性数 = 3（tcore_type/pipe/vf_mode）+ 可选 extra_attr——本例（内建算子）共 4 条，没有 symbol/bitcode。</text>
<text x="40" y="718" font-family="sans-serif" font-size="11"  fill="#64748b">_index_select 类本身与 __builtin_ 前缀哑类兜底的默认取值恰好一致：都是 VECTOR / PIPE_V / SIMT。</text>
</svg>