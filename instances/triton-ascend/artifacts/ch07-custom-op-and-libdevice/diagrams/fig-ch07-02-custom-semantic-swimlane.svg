<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 680">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker><marker id="g" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#15803d"/></marker></defs>
<rect width="880" height="680" fill="white"/>
<text x="440.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">al.custom 一次调用的六步——跨三条泳道</text>
<text x="440.0" y="50" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">注册期声明的算子类，在调用期被翻成一条 IR</text>
<rect x="45" y="58" width="190" height="34" rx="6" fill="#e2e8f0" stroke="#64748b"/>
<text x="140" y="74" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">Python 侧</text>
<text x="140" y="89" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">(al.custom)</text>
<line x1="140" y1="94" x2="140" y2="640" stroke="#94a3b8" stroke-dasharray="4,4"/>
<rect x="345" y="58" width="190" height="34" rx="6" fill="#e2e8f0" stroke="#64748b"/>
<text x="440" y="74" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">注册表</text>
<text x="440" y="89" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">(_custom_op_registry)</text>
<line x1="440" y1="94" x2="440" y2="640" stroke="#94a3b8" stroke-dasharray="4,4"/>
<rect x="645" y="58" width="190" height="34" rx="6" fill="#e2e8f0" stroke="#64748b"/>
<text x="740" y="74" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">IR 侧</text>
<text x="740" y="89" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">(builder)</text>
<line x1="740" y1="94" x2="740" y2="640" stroke="#94a3b8" stroke-dasharray="4,4"/>
<circle cx="140" cy="187.0" r="5" fill="#0369a1"/>
<text x="156" y="187.0" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1e3a5f">① al.custom(name, src, index, ...) → custom(@core.builtin) → custom_semantic</text>
<line x1="140" y1="249.0" x2="440" y2="249.0" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<text x="290.0" y="235.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">② _get_op_class('__builtin_index_select')  查注册表</text>
<line x1="440" y1="311.0" x2="140" y2="311.0" stroke="#15803d" stroke-width="1.8" marker-end="url(#g)"/>
<text x="290.0" y="297.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#15803d">命中：返回真实注册类（非 __builtin_ 哑类兜底）</text>
<circle cx="140" cy="373.0" r="5" fill="#0369a1"/>
<text x="156" y="373.0" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1e3a5f">③ _init_op → __init__ 断言 + arg_type 定型（src_rank=2, idx_rank=1）</text>
<line x1="140" y1="445.0" x2="740" y2="445.0" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<text x="440.0" y="415.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">④ _to_operands/_args_to_operands → outputs=1，inputs=10</text>
<text x="440.0" y="431.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">_make_attrs/_make_arg_attrs → attrs=4，arg_attrs=9 槽</text>
<line x1="140" y1="517.0" x2="740" y2="517.0" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<text x="440.0" y="503.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">⑤ _builder.create_custom_op → emit 1 条 hivm.custom（ttadapter 阶段）</text>
<line x1="740" y1="579.0" x2="140" y2="579.0" stroke="#15803d" stroke-width="1.8" marker-end="url(#g)"/>
<text x="440.0" y="565.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#15803d">⑥ _to_result 按 out 类型把结果包回 tl.tensor（1 个）</text>
<text x="40" y="668" font-family="sans-serif" font-size="11.5" fill="#64748b">三条泳道走完：10 个输入操作数、1 个输出、4 条属性（另 9 个 arg_attrs 槽=signature 形参数）落成 1 条 hivm.custom。</text>
</svg>