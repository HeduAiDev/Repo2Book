<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 881 1100">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#b91c1c"/></marker><marker id="g" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#15803d"/></marker></defs>
<rect width="881" height="1100" fill="white"/>
<text x="440.5" y="30" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#0f172a">register_custom_op：八条断言的闸门</text>
<text x="440.5" y="52" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#64748b">过不了闸门，注册表一个字都不写——共 8 条断言（1+1+3+3），任一失败即 AssertionError</text>
<rect x="40" y="100" width="371" height="56" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
<text x="56" y="122" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#0f172a">入口</text>
<text x="56" y="142" font-family="sans-serif" font-size="11.5" fill="#334155">@register_custom_op 收到一个对象 op</text>
<rect x="40" y="202" width="371" height="56" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2.4"/>
<text x="56" y="224" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#0f172a">闸门① · 必须是类</text>
<text x="56" y="244" font-family="sans-serif" font-size="11.5" fill="#334155">assert inspect.isclass(op)</text>
<text x="397" y="248" text-anchor="end" font-family="sans-serif" font-size="11" font-weight="bold" fill="#b91c1c">1 条断言</text>
<rect x="40" y="304" width="371" height="56" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
<text x="56" y="326" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#0f172a">兜底 · 名字</text>
<text x="56" y="346" font-family="sans-serif" font-size="11.5" fill="#334155">未设 name → setattr(op, 'name', op.__name__)</text>
<rect x="40" y="406" width="371" height="56" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2.4"/>
<text x="56" y="428" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#0f172a">闸门② · 唯一性</text>
<text x="56" y="448" font-family="sans-serif" font-size="11.5" fill="#334155">assert op.name not in _custom_op_registry</text>
<text x="397" y="452" text-anchor="end" font-family="sans-serif" font-size="11" font-weight="bold" fill="#b91c1c">1 条断言</text>
<rect x="40" y="508" width="371" height="92" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2.4"/>
<text x="56" y="530" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#0f172a">闸门③~⑤ · 三个必填字段</text>
<text x="56" y="550" font-family="sans-serif" font-size="11.5" fill="#334155">assert hasattr(op, 'core')</text>
<text x="56" y="568" font-family="sans-serif" font-size="11.5" fill="#334155">assert hasattr(op, 'pipe')</text>
<text x="56" y="586" font-family="sans-serif" font-size="11.5" fill="#334155">assert hasattr(op, 'mode')</text>
<text x="397" y="590" text-anchor="end" font-family="sans-serif" font-size="11" font-weight="bold" fill="#b91c1c">3 条断言</text>
<rect x="40" y="646" width="371" height="92" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2.4"/>
<text x="56" y="668" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#0f172a">闸门⑥~⑧ · 三个类型检查</text>
<text x="56" y="688" font-family="sans-serif" font-size="11.5" fill="#334155">assert isinstance(op.core, CORE)</text>
<text x="56" y="706" font-family="sans-serif" font-size="11.5" fill="#334155">assert isinstance(op.pipe, PIPE)</text>
<text x="56" y="724" font-family="sans-serif" font-size="11.5" fill="#334155">assert isinstance(op.mode, MODE)</text>
<text x="397" y="728" text-anchor="end" font-family="sans-serif" font-size="11" font-weight="bold" fill="#b91c1c">3 条断言</text>
<rect x="40" y="784" width="371" height="70" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
<text x="56" y="806" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#0f172a">抄写签名</text>
<text x="56" y="826" font-family="sans-serif" font-size="11.5" fill="#334155">op.signature = inspect.signature(op)</text>
<text x="56" y="844" font-family="sans-serif" font-size="11.5" fill="#334155">例：_index_select → 抽到 9 个形参</text>
<rect x="40" y="900" width="371" height="70" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2.4"/>
<text x="56" y="922" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#0f172a">入表</text>
<text x="56" y="942" font-family="sans-serif" font-size="11.5" fill="#334155">_custom_op_registry[op.name] = op</text>
<text x="56" y="960" font-family="sans-serif" font-size="11.5" fill="#334155">本例 7 轮后条目数 = 3</text>
<line x1="225.5" y1="156" x2="225.5" y2="202" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="225.5" y1="258" x2="225.5" y2="304" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="225.5" y1="360" x2="225.5" y2="406" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="225.5" y1="462" x2="225.5" y2="508" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="225.5" y1="600" x2="225.5" y2="646" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="225.5" y1="738" x2="225.5" y2="784" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="225.5" y1="854" x2="225.5" y2="900" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="411" y1="230.0" x2="541" y2="230.0" stroke="#b91c1c" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#r)"/>
<line x1="411" y1="434.0" x2="541" y2="434.0" stroke="#b91c1c" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#r)"/>
<line x1="411" y1="554.0" x2="541" y2="554.0" stroke="#b91c1c" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#r)"/>
<line x1="411" y1="692.0" x2="541" y2="692.0" stroke="#b91c1c" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#r)"/>
<rect x="541" y="202" width="300" height="536" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.2"/>
<text x="691.0" y="442.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#7f1d1d">AssertionError</text>
<text x="691.0" y="468.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#991b1b">任一闸门失败 → 表长不变（3 → 3）</text>
<text x="691.0" y="492.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#991b1b">本例 7 轮中 4 轮被拒（轮 4~7）</text>
<text x="40" y="1074" font-family="sans-serif" font-size="11.5" fill="#64748b">third_party/ascend/language/cann/extension/custom_op.py:L324-345——8 条断言全过，才轮到最后一句写表；这是一道类装饰器，不是函数装饰器。</text>
</svg>