<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 866">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker></defs>
<rect width="1160" height="866" fill="white"/>
<text x="580.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">libdevice 不是一层薄壳，是四类形态的拼装</text>
<text x="580.0" y="52" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#64748b">37 个顶层函数按「一张菜单 14 / 两张菜单 2 / 一半菜单一半自己算 18 / 从不碰菜单 3」划开——互斥且穷尽</text>
<rect x="40" y="108" width="700" height="410" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="2" stroke-dasharray="7,5"/>
<text x="56" y="132" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#334155">libdevice.py — 1032 行 / 37 个顶层函数</text>
<rect x="56" y="144" width="668" height="78" rx="9" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="72" y="166" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">A · 一张菜单，直接点符号</text>
<text x="72" y="186" font-family="sans-serif" font-size="11" fill="#334155">代表 reciprocal（14 个函数只走这条）</text>
<text x="708" y="208" text-anchor="end" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1d4ed8">14</text>
<rect x="56" y="236" width="668" height="78" rx="9" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
<text x="72" y="258" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">B · 两张菜单，按开关/架构换一张符号表</text>
<text x="72" y="278" font-family="sans-serif" font-size="11" fill="#334155">代表 tanh、pow（两端都还是符号表，仅 2 个）</text>
<text x="708" y="300" text-anchor="end" font-family="sans-serif" font-size="20" font-weight="bold" fill="#6d28d9">2</text>
<rect x="56" y="328" width="668" height="78" rx="9" fill="#fef3c7" stroke="#b45309" stroke-width="3"/>
<text x="72" y="350" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">C · 一半菜单一半自己算——最常见</text>
<text x="72" y="370" font-family="sans-serif" font-size="11" fill="#334155">代表 acos（一端点符号、另一端改用纯 IR，18 个）</text>
<text x="72" y="396" font-family="sans-serif" font-size="11" font-weight="bold" fill="#b45309">最常见</text>
<text x="708" y="392" text-anchor="end" font-family="sans-serif" font-size="20" font-weight="bold" fill="#b45309">18</text>
<rect x="56" y="420" width="668" height="78" rx="9" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="72" y="442" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">D · 从不碰菜单，全程纯 IR</text>
<text x="72" y="462" font-family="sans-serif" font-size="11" fill="#334155">gamma / fast_dividef / fast_expf（3 个）</text>
<text x="708" y="484" text-anchor="end" font-family="sans-serif" font-size="20" font-weight="bold" fill="#15803d">3</text>
<rect x="790" y="108" width="330" height="410" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="2" stroke-dasharray="7,5"/>
<text x="806" y="132" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#334155">math_ops.py — 53 行</text>
<rect x="806" y="144" width="298" height="354" rx="9" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
<text x="822" y="170" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">路径③ · @jit 组合已有原语</text>
<text x="822" y="194" font-family="sans-serif" font-size="11.5" fill="#334155">代表 isfinited =</text>
<text x="822" y="212" font-family="sans-serif" font-size="11.5" fill="#334155">~isnan &amp; ~isinf</text>
<text x="1088" y="484" text-anchor="end" font-family="sans-serif" font-size="20" font-weight="bold" fill="#4338ca">3 个</text>
<line x1="390.0" y1="518" x2="390.0" y2="588" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="955.0" y1="518" x2="955.0" y2="588" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="40" y="588" width="1080" height="66" rx="10" fill="#e2e8f0" stroke="#475569" stroke-width="1.8"/>
<text x="580.0" y="615" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e293b">四类形态都汇进同一个 al.libdevice.* 命名空间</text>
<text x="580.0" y="635" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">cann/__init__.py 的 import 期覆盖挂载</text>
<rect x="40" y="700" width="1080" height="96" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="1.6"/>
<text x="56" y="724" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#713f12">__hmf_ 符号：66 处引用 / 60 个不同符号——昇腾自带的数学库菜单（A、B、C 都点这份菜单）</text>
<text x="56" y="746" font-family="sans-serif" font-size="11.5" fill="#854d0e">acos 实测（CPU 精简版）：纯 IR 逼近 vs math.acos 最大绝对误差（8 个采样点）= 1e-05；</text>
<text x="56" y="766" font-family="sans-serif" font-size="11.5" fill="#854d0e">走 extern 分支时执行的浮点算术条数 = 0（直接点 __hmf_acos_fp32，不算多项式）。</text>
<text x="56" y="786" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#713f12">14 + 2 + 18 + 3 = 37 = libdevice.py 顶层函数总数——分类互斥且穷尽。</text>
</svg>