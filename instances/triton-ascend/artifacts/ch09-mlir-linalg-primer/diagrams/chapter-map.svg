<text x="725.0" y="146.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">Canonicalization</text>
<text x="725.0" y="166.0" text-anchor="middle" font-family="sans-serif" font-size="9.8" fill="#64748b">.td 声明式定义,C++ 由生成器产出</text>
<text x="725.0" y="181.0" text-anchor="middle" font-family="sans-serif" font-size="9.8" fill="#64748b">trait/interface 让 pass 跨方言复用</text>
<rect x="736.8" y="114.0" width="123.2" height="20" rx="10.0" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
<text x="798.4" y="128.0" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#4338ca">.td + 可扩展 pass</text>
<rect x="120.0" y="254.0" width="210" height="76" rx="12" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<text x="225.0" y="276.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">structured code generation</text>
<text x="225.0" y="296.0" text-anchor="middle" font-family="sans-serif" font-size="9.8" fill="#64748b">把 tiling/fusion/向量化</text>
<text x="225.0" y="311.0" text-anchor="middle" font-family="sans-serif" font-size="9.8" fill="#64748b">搬到张量层,不等退化成循环</text>
<rect x="227.6" y="244.0" width="132.4" height="20" rx="10.0" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
<text x="293.8" y="258.0" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#4338ca">结构化 codegen 起因</text>
<rect x="370.0" y="254.0" width="210" height="76" rx="12" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<text x="475.0" y="276.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">linalg.conv_1d_nwc_wcf</text>
<text x="475.0" y="296.0" text-anchor="middle" font-family="sans-serif" font-size="9.8" fill="#64748b">配料单写在算子身上:</text>
<text x="475.0" y="311.0" text-anchor="middle" font-family="sans-serif" font-size="9.8" fill="#64748b">O[n,w,f]=I[n,w+kw,c]·K[kw,c,f]</text>
<rect x="534.5" y="244.0" width="75.0" height="20" rx="10.0" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
<text x="572.0" y="258.0" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#4338ca">索引表达式</text>
<rect x="620.0" y="254.0" width="210" height="76" rx="12" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<text x="725.0" y="276.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">iteration domain</text>
<text x="725.0" y="296.0" text-anchor="middle" font-family="sans-serif" font-size="9.8" fill="#64748b">边界从操作数形状反解</text>
<text x="725.0" y="311.0" text-anchor="middle" font-family="sans-serif" font-size="9.8" fill="#64748b">IR 里不写一个字的循环边界</text>
<rect x="784.5" y="244.0" width="75.0" height="20" rx="10.0" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
<text x="822.0" y="258.0" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#4338ca">隐式迭代域</text>
<rect x="870.0" y="254.0" width="210" height="76" rx="12" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<text x="975.0" y="276.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">tensor.extract_slice</text>
<text x="975.0" y="296.0" text-anchor="middle" font-family="sans-serif" font-size="9.8" fill="#64748b">像 = 索引函数(迭代域)</text>
<text x="975.0" y="311.0" text-anchor="middle" font-family="sans-serif" font-size="9.8" fill="#64748b">halo = 像宽 − tile 宽</text>
<rect x="1034.5" y="244.0" width="75.0" height="20" rx="10.0" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
<text x="1072.0" y="258.0" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#4338ca">求像即子集</text>
