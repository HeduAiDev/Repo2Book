<text x="225.0" y="406.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">linalg.generic</text>
<text x="225.0" y="426.0" text-anchor="middle" font-family="sans-serif" font-size="9.8" fill="#64748b">具名算子只是省略了算子体</text>
<text x="225.0" y="441.0" text-anchor="middle" font-family="sans-serif" font-size="9.8" fill="#64748b">语义同归 linalg.generic</text>
<rect x="239.7" y="374.0" width="120.3" height="20" rx="10.0" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
<text x="299.8" y="388.0" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#4338ca">named 与 generic</text>
<rect x="370.0" y="384.0" width="210" height="76" rx="12" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<text x="475.0" y="406.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">destination-passing style</text>
<text x="475.0" y="426.0" text-anchor="middle" font-family="sans-serif" font-size="9.8" fill="#64748b">outs 是 bufferization 的</text>
<text x="475.0" y="441.0" text-anchor="middle" font-family="sans-serif" font-size="9.8" fill="#64748b">一等操作数,张量仍不可变</text>
<rect x="503.1" y="374.0" width="106.9" height="20" rx="10.0" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
<text x="556.5" y="388.0" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#4338ca">outs 不是顺手传</text>
<rect x="620.0" y="384.0" width="210" height="76" rx="12" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<text x="725.0" y="406.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">vector.contract</text>
<text x="725.0" y="426.0" text-anchor="middle" font-family="sans-serif" font-size="9.8" fill="#64748b">tiling→padding→向量化→</text>
<text x="725.0" y="441.0" text-anchor="middle" font-family="sans-serif" font-size="9.8" fill="#64748b">bufferization→向量渐进下降</text>
<rect x="795.5" y="374.0" width="53.0" height="20" rx="10.0" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
<text x="822.0" y="388.0" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#4338ca">变换栈</text>
