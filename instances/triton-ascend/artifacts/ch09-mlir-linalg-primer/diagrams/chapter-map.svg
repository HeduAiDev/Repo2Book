<text x="475.0" y="146.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">affine.for</text>
<text x="475.0" y="166.0" text-anchor="middle" font-family="sans-serif" font-size="9.8" fill="#64748b">Op 挂 region、region 装 block</text>
<text x="475.0" y="181.0" text-anchor="middle" font-family="sans-serif" font-size="9.8" fill="#64748b">方言可任意层级共存</text>
<rect x="545.5" y="114.0" width="53.0" height="20" rx="10.0" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
