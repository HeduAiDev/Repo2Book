<text x="975.0" y="426.0" text-anchor="middle" font-family="sans-serif" font-size="9.8" fill="#64748b">Legality / Applicability /</text>
<text x="975.0" y="441.0" text-anchor="middle" font-family="sans-serif" font-size="9.8" fill="#64748b">Profitability 依附哪层抽象</text>
