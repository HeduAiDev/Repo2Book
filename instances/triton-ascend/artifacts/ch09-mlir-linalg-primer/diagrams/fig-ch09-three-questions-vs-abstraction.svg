<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker><marker id="ax" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#dc2626"/></marker><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e2e8f0"/><stop offset="100%" stop-color="#1d4ed8"/></linearGradient><linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#15803d"/><stop offset="100%" stop-color="#e2e8f0"/></linearGradient></defs>
<rect width="1500" height="900" fill="white"/>
<text x="44" y="44" font-family="sans-serif" font-size="18" font-weight="bold" fill="#0f172a">三问依附在哪一层抽象,是可以设计的</text>
<text x="44" y="68" font-family="sans-serif" font-size="12.5" fill="#475569">结构化算子层:合法性与可施加性由算子性质与结构直接导出(legal by design);越往标量+循环层走,越通用也越难分析</text>
<line x1="760" y1="110" x2="760" y2="560" stroke="#0f172a" stroke-width="2.4" marker-end="url(#a)"/>
<rect x="610" y="76" width="300" height="30" rx="6" fill="#1d4ed8"/>
<text x="760" y="97" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="white">结构化算子层</text>
<rect x="610" y="566" width="300" height="30" rx="6" fill="#334155"/>
<text x="760" y="587" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="white">标<tspan font-weight="normal">量</tspan> + 循环 + 指针层</text>
<rect x="1020" y="110" width="22" height="450" rx="6" fill="url(#g1)"/>
<text x="1031.0" y="82" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#1d4ed8">通用性</text>
<text x="1031.0" y="96" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#1d4ed8">/正规性</text>
<text x="1031.0" y="578" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#64748b">(向下增强)</text>
<rect x="1170" y="110" width="22" height="450" rx="6" fill="url(#g2)"/>
<text x="1181.0" y="82" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#15803d">分析/变换</text>
<text x="1181.0" y="96" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#15803d">可解性</text>
<text x="1181.0" y="578" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#64748b">(向下衰减)</text>
<rect x="44" y="140" width="330" height="110" rx="9" fill="#eef2ff" stroke="#6366f1" stroke-width="1.8"/>
<text x="60" y="168" font-family="sans-serif" font-size="14" font-weight="bold" fill="#3730a3">合法性</text>
<text x="60" y="190" font-family="sans-serif" font-size="11" fill="#4338ca">施加后是否改变可观察语义</text>
<path d="M 374 195.0 C 500 195.0, 500 125, 608 125" fill="none" stroke="#6366f1" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#a)" opacity="0.7"/>
<rect x="44" y="300" width="330" height="110" rx="9" fill="#eef2ff" stroke="#6366f1" stroke-width="1.8"/>
<text x="60" y="328" font-family="sans-serif" font-size="14" font-weight="bold" fill="#3730a3">可施加性</text>
<text x="60" y="350" font-family="sans-serif" font-size="11" fill="#4338ca">找位置多难/变换后 IR 多复杂/丢多少信息/</text>
<text x="60" y="370" font-family="sans-serif" font-size="11" fill="#4338ca">后续是否仍好变换</text>
<path d="M 374 355.0 C 500 355.0, 500 125, 608 125" fill="none" stroke="#6366f1" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#a)" opacity="0.7"/>
<rect x="44" y="460" width="330" height="110" rx="9" fill="#eef2ff" stroke="#6366f1" stroke-width="1.8"/>
<text x="60" y="488" font-family="sans-serif" font-size="14" font-weight="bold" fill="#3730a3">收益</text>
<text x="60" y="510" font-family="sans-serif" font-size="11" fill="#4338ca">按某度量是否有益,通常靠启发式或性能模型</text>
<path d="M 374 515.0 C 500 515.0, 500 125, 608 125" fill="none" stroke="#6366f1" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#a)" opacity="0.7"/>
<text x="44" y="126" font-family="sans-serif" font-size="11" font-weight="bold" fill="#4338ca">三问都指向同一层:结构化算子层</text>
<rect x="44" y="650" width="1412" height="170" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="62" y="676" font-family="sans-serif" font-size="13" font-weight="bold" fill="#991b1b">phase-ordering 反例(为何这三问不能只在下层判断)</text>
<rect x="84" y="710" width="240" height="60" rx="8" fill="#fff" stroke="#334155" stroke-width="1.4"/>
<text x="204.0" y="736" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#0f172a">两个算子融合</text>
<text x="204.0" y="754" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">(循环融合,提升时间局部性)</text>
<line x1="324" y1="740.0" x2="384" y2="740.0" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="384" y="710" width="240" height="60" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
<text x="504.0" y="736" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#14532d">时间局部性变好</text>
<text x="504.0" y="754" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#166534">(收益判断:看似有益)</text>
<line x1="624" y1="740.0" x2="684" y2="740.0" stroke="#dc2626" stroke-width="1.8" marker-end="url(#ax)"/>
<text x="654.0" y="702" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#dc2626">但……</text>
<rect x="684" y="710" width="240" height="60" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
<text x="804.0" y="732" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#991b1b">破坏后续识别</text>
<text x="804.0" y="750" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#991b1b">BLAS-2/BLAS-3 库实现</text>
<text x="804.0" y="766" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#991b1b">的能力</text>
<text x="62" y="800" font-family="sans-serif" font-size="10.5" fill="#7f1d1d">本章可执行佐证:tiling/padding/向量化/bufferization 四条变换与不变换的数值最大偏差均为 0(本章参考实现实测)</text>
<text x="44" y="886" font-family="sans-serif" font-size="10.5" fill="#64748b">依据:arXiv:2202.03293 §3.6、§3.6.1;拼写按论文两处原样(transformations-oriented / transformation-oriented),不代论文统一</text>
</svg>