<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 975.8 450.0">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#0f172a"/></marker><pattern id="halo" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#fed7aa"/><line x1="0" y1="0" x2="0" y2="7" stroke="#c2410c" stroke-width="2.4"/></pattern></defs>
<rect width="975.8" height="450.0" fill="white"/>
<text x="44" y="38" font-family="sans-serif" font-size="16.5" font-weight="bold" fill="#0f172a">求像即子集:把切过的迭代域代进索引表达式,就得到每个张<tspan font-weight="normal">量</tspan>要碰的那一片</text>
<text x="44" y="60" font-family="sans-serif" font-size="12" fill="#475569">tile 宽 8、核宽 3 时,输入 I 的像比 tile 宽出 2——这 2 列与下一块 tile 的像 [8,18) 重叠(halo)</text>
<text x="44" y="100" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#334155">迭代域(w 方向)</text>
<line x1="44" y1="130" x2="524" y2="130" stroke="#94a3b8" stroke-width="1.5"/>
<rect x="44" y="110" width="240" height="30" rx="4" fill="#3b82f6" stroke="#1e3a8a" stroke-width="1.5"/>
<text x="164.0" y="130" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="white">tile 0  [0,8)</text>
<rect x="284" y="110" width="240" height="30" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="404.0" y="130" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1e40af">tile 1  [8,16)</text>
<line x1="44" y1="130" x2="44" y2="136" stroke="#64748b" stroke-width="1.2"/>
<text x="44" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">0</text>
<line x1="284" y1="130" x2="284" y2="136" stroke="#64748b" stroke-width="1.2"/>
<text x="284" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">8</text>
<line x1="524" y1="130" x2="524" y2="136" stroke="#64748b" stroke-width="1.2"/>
<text x="524" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">16</text>
<rect x="44" y="180" width="540" height="46" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
<rect x="44" y="180" width="240" height="46" rx="4" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.8"/>
<text x="52" y="208.0" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">O   索引: n,w,f</text>
<text x="44" y="172" font-family="sans-serif" font-size="11.5" fill="#475569">O 的像 = tile 本身  [0,8)</text>
<line x1="58" y1="160" x2="58" y2="176" stroke="#0f172a" stroke-width="1.3" marker-end="url(#a)" opacity="0.5"/>
<rect x="44" y="260" width="540" height="46" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
<rect x="44" y="260" width="240" height="46" rx="4" fill="#fdba74" stroke="#c2410c" stroke-width="1.8"/>
<rect x="284" y="260" width="60" height="46" fill="url(#halo)" stroke="#c2410c" stroke-width="1.8"/>
<rect x="284" y="254" width="300" height="58" rx="4" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4,3"/>
<text x="590" y="287.0" font-family="sans-serif" font-size="10.5" fill="#64748b">← 相邻 tile 的像 [8,18)</text>
<text x="52" y="288.0" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">I   索引: n,w+kw,c</text>
<text x="44" y="252" font-family="sans-serif" font-size="11.5" fill="#475569">I 的像宽 10 = tile 宽 8 + (核宽 3 − 1)</text>
<line x1="24" y1="160" x2="24" y2="256" stroke="#0f172a" stroke-width="1.3" marker-end="url(#a)" opacity="0.5"/>
<rect x="614" y="183.0" width="190" height="40" rx="6" fill="#bbf7d0" stroke="#15803d" stroke-width="1.8"/>
<text x="709.0" y="201.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#14532d">K 的像 = 完整 K</text>
<text x="709.0" y="217.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#166534">索引: kw,c,f  —— 不随空间 tile 变</text>
<line x1="224" y1="110" x2="709.0" y2="183.0" stroke="#0f172a" stroke-width="1.1" marker-end="url(#a)" opacity="0.4" stroke-dasharray="3,3"/>
<rect x="44" y="334.0" width="887.8" height="74.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/>
<text x="56" y="358.0" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#9a3412">halo 这笔账</text>
<text x="56" y="375.0" font-family="sans-serif" font-size="11.5" fill="#7c2d12">tile 宽 8:I 侧多读 2 列 = 10 对 8,多读 25%</text>
<text x="56" y="391.0" font-family="sans-serif" font-size="11.5" fill="#7c2d12">tile 宽 4:多读比例升到 50%(6 对 4)——tile 越小,halo 占比越大</text>
<text x="44" y="434.0" font-family="sans-serif" font-size="11" fill="#64748b">核宽 kw=3;halo 多出 2 列;数据:本章参考实现实测(tile 宽 8 的论文形状用例)</text>
</svg>