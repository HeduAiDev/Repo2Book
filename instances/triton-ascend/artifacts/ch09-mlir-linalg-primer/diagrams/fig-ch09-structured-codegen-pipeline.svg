<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1418 786">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker><marker id="a2" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#b45309"/></marker><marker id="a3" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#7c3aed"/></marker></defs>
<rect width="1418" height="786" fill="white"/>
<text x="48" y="42" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">结构化 codegen:从张<tspan font-weight="normal">量</tspan>代数一路降到目标层,每一步都物化在 IR 里</text>
<text x="48" y="64" font-family="sans-serif" font-size="12" fill="#475569">重绘自 arXiv:2202.03293 Fig.1——tiled structured 这一层同时做融合与多级 tiling</text>
<rect x="178" y="116" width="760" height="74" rx="9" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
<text x="198" y="144" font-family="sans-serif" font-size="14.5" font-weight="bold" fill="#0f172a">Structured IR</text>
<text x="198" y="166" font-family="sans-serif" font-size="11.5" fill="#334155">稠密/稀疏张量代数算子,函数式程序(张量不可变,def-use SSA)</text>
<line x1="558.0" y1="190" x2="558.0" y2="216" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="178" y="220" width="760" height="74" rx="9" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="198" y="248" font-family="sans-serif" font-size="14.5" font-weight="bold" fill="#0f172a">Tiled structured</text>
<text x="198" y="270" font-family="sans-serif" font-size="11.5" fill="#334155">scf.for + extract_slice/insert_slice;循环体仍是同一算子的小号版本</text>
<text x="924" y="248" text-anchor="end" font-family="sans-serif" font-size="12" font-weight="bold" fill="#92400e">融合发生在这一层</text>
<path d="M 886 278 a 16 16 0 1 1 32 0" fill="none" stroke="#92400e" stroke-width="1.6" marker-end="url(#a2)"/>
<text x="902" y="308" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#92400e">可多级、渐进 tiling</text>
<line x1="558.0" y1="294" x2="558.0" y2="320" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="178" y="324" width="760" height="74" rx="9" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
<text x="198" y="352" font-family="sans-serif" font-size="14.5" font-weight="bold" fill="#0f172a">向<tspan font-weight="normal">量</tspan>抽象</text>
<text x="198" y="374" font-family="sans-serif" font-size="11.5" fill="#334155">每操作数一次 transfer_read,向量化计算,transfer_write 写回</text>
<line x1="558.0" y1="398" x2="558.0" y2="424" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="178" y="428" width="760" height="74" rx="9" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
<text x="198" y="456" font-family="sans-serif" font-size="14.5" font-weight="bold" fill="#0f172a">Buffer 层</text>
<text x="198" y="478" font-family="sans-serif" font-size="11.5" fill="#334155">bufferization:张量落地为 memref,尽量少分配少拷贝</text>
<line x1="558.0" y1="502" x2="558.0" y2="528" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="178" y="532" width="760" height="74" rx="9" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
<text x="198" y="560" font-family="sans-serif" font-size="14.5" font-weight="bold" fill="#0f172a">目标层</text>
<text x="198" y="582" font-family="sans-serif" font-size="11.5" fill="#334155">翻到 llvm 方言 / GPU kernel offload / 异步块+任务并行运行时</text>
<path d="M 164 153.0 C 88 153.0, 88 569.0, 164 569.0" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#a3)"/>
<text x="48" y="335.0" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#7c3aed">optionality:</text>
<text x="48" y="351.0" font-family="sans-serif" font-size="10" fill="#7c3aed">论文口径:对某些算子,</text>
<text x="48" y="367.0" font-family="sans-serif" font-size="10" fill="#7c3aed">跳过某些层级、甚至走</text>
<text x="48" y="383.0" font-family="sans-serif" font-size="10" fill="#7c3aed">完全不同的路都可行</text>
<line x1="558.0" y1="606" x2="558.0" y2="642" stroke="#334155" stroke-width="1.6"/>
<line x1="558.0" y1="642" x2="283.0" y2="666" stroke="#334155" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="178.0" y="666" width="210" height="46" rx="7" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
<text x="283.0" y="694" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#14532d">llvm 方言(CPU)</text>
<line x1="558.0" y1="642" x2="558.0" y2="666" stroke="#334155" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="453.0" y="666" width="210" height="46" rx="7" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
<text x="558.0" y="694" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#14532d">GPU kernel offload</text>
<line x1="558.0" y1="642" x2="833.0" y2="666" stroke="#334155" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="728.0" y="666" width="210" height="46" rx="7" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
<text x="833.0" y="694" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#14532d">异步块 + 任务并行运行时</text>
<text x="48" y="770" font-family="sans-serif" font-size="10.5" fill="#64748b">依据:arXiv:2202.03293 §2.1;tiling 粒度用途见论文原型例(按 cache 层级切矩阵乘)</text>
</svg>