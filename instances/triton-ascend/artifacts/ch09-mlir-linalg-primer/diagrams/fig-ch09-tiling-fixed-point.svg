<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 460">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker></defs>
<rect width="930" height="460" fill="white"/>
<text x="465.0" y="40" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">tiling 是不动点变换:切前切后,循环体里的算子没变</text>
<text x="205.0" y="86" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#334155">切之前</text>
<rect x="40" y="100" width="330" height="100" rx="8" fill="#3b82f6" stroke="#1e3a8a" stroke-width="2.2"/>
<text x="205.0" y="155.0" text-anchor="middle" font-family="sans-serif" font-size="14.5" font-weight="bold" fill="white">linalg.conv_1d_nwc_wcf</text>
<text x="205.0" y="62" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#475569">ins(I:1x8x2, K:3x2x3)  outs(O:1x6x3)</text>
<line x1="205.0" y1="200" x2="205.0" y2="234" stroke="#64748b" stroke-width="1.3" marker-end="url(#a)"/>
<text x="205.0" y="252" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">一次算完整块,只有 1 种局部输出类型:1x6x3</text>
<text x="675.0" y="86" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#334155">切之后(tile 宽 4)</text>
<rect x="460" y="96" width="430" height="108" rx="10" fill="#f8fafc" stroke="#0f172a" stroke-width="1.6" stroke-dasharray="6,4"/>
<text x="470" y="116" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#0f172a">scf.for w = 0 to 6 step 4</text>
<rect x="486" y="124" width="378" height="60" rx="8" fill="#3b82f6" stroke="#1e3a8a" stroke-width="2.2"/>
<text x="675.0" y="159.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="white">linalg.conv_1d_nwc_wcf</text>
<text x="675.0" y="70" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">extract_slice(I,K) 局部形状随迭代变  /  insert_slice(O)</text>
<line x1="675.0" y1="204" x2="675.0" y2="234" stroke="#64748b" stroke-width="1.3" marker-end="url(#a)"/>
<text x="675.0" y="252" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">2 次迭代,2 种局部输出类型:</text>
<text x="675.0" y="270" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#b45309">满块 1x4x3  与  边界块 1x2x3</text>
<text x="675.0" y="290" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">没有哪个静态类型对两次迭代都合法</text>
<line x1="380" y1="150.0" x2="450" y2="150.0" stroke="#b45309" stroke-width="2.6" marker-end="url(#a)"/>
<text x="415.0" y="138.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#b45309">tiling</text>
<rect x="40" y="362" width="850" height="36" rx="6" fill="#ecfdf5" stroke="#15803d" stroke-width="1.3"/>
<text x="465.0" y="386" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#14532d">迭代器类型两侧相同:parallel x 3 + reduction x 2;与不切时结果的最大偏差 = 0 —— 变的只是操作数形状,算子本身不变</text>
<text x="40" y="440" font-family="sans-serif" font-size="11" fill="#64748b">重绘自 arXiv:2202.03293 Fig.4:tiling 引入 scf.for 与 extract_slice/insert_slice,循环体里仍是同一个 linalg.conv_1d_nwc_wcf</text>
</svg>