<text x="190" y="452" font-family="sans-serif" font-size="11.5" fill="#334155">reduction 维(kw、c——多个迭代点堆进同一输出格)</text>
<text x="40" y="474" font-family="sans-serif" font-size="11.5" fill="#334155">深色粗体 = 纯恒等索引(可作边界来源);浅灰 = 复合索引(如 w+kw),给不出该维的边界</text>
<text x="40" y="500" font-family="sans-serif" font-size="11" fill="#64748b">n/f/c 各有 2 个一致来源,只有 w 依赖唯一来源 O.1——数据:本章参考实现实测</text>
