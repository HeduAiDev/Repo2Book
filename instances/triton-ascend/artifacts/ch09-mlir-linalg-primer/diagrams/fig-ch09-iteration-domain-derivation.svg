<text x="942" y="403.0" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">1 x 988 x 64 x 3 x 32 = 6 070 272</text>
<rect x="40" y="441" width="14" height="14" fill="#eff6ff" stroke="#cbd5e1"/>
<text x="60" y="452" font-family="sans-serif" font-size="11.5" fill="#334155">parallel 维</text>
