<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 980">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker><marker id="a2" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#7c3aed"/></marker></defs>
<rect width="1560" height="980" fill="white"/>
<text x="40" y="40" font-family="sans-serif" font-size="18" font-weight="bold" fill="#0f172a">MLIR 的 IR 是一次三层递归:Op 挂 region,region 装 block,block 里又是 Op</text>
<text x="40" y="64" font-family="sans-serif" font-size="12.5" fill="#475569">重绘自 arXiv:2002.11054 Fig.3——递归怎么闭合,类型系统怎么落地</text>
<rect x="40" y="100" width="1000" height="800" rx="14" fill="#f8fafc" stroke="#1d4ed8" stroke-width="2.4"/>
<rect x="58" y="84" width="150" height="32" rx="6" fill="#1d4ed8"/>
<text x="133" y="106" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="white">Op</text>
<text x="230" y="106" font-family="sans-serif" font-size="12" fill="#1e3a8a">例:affine.for  ——  指令 / 函数 / module 皆是 Op</text>
<rect x="64" y="134" width="952" height="60" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="80" y="158" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#1e3a8a">operand / result(SSA,均带类型)</text>
<text x="80" y="178" font-family="sans-serif" font-size="11" fill="#1e40af">%i = affine.for %arg = 0 to 8 { ... }  —— %arg 的类型来自其 def</text>
<rect x="64" y="208" width="952" height="90" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="80" y="230" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#78350f">attribute 字典(编译期静态信息,open key-value)</text>
<text x="80" y="254" font-family="monospace" font-size="11.5" fill="#78350f">{ lower_bound = ()-&gt;(0), step = 1:index, upper_bound = #map3 }</text>
<text x="80" y="276" font-family="sans-serif" font-size="11" fill="#92400e">仿射映射(#map3)是 attribute,不是特殊语法——这正是索引映射能被</text>
<text x="80" y="292" font-family="sans-serif" font-size="11" fill="#92400e">编译器直接读来推理的根本原因</text>
<rect x="64" y="316" width="952" height="470" rx="8" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5"/>
<text x="80" y="338" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#14532d">region(嵌套结构机制:region 装 block,block 装 Op)</text>
<rect x="54" y="340" width="972" height="446" rx="10" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7,5"/>
<text x="982" y="332" text-anchor="end" font-family="sans-serif" font-size="11" font-weight="bold" fill="#7c3aed">isolated-from-above —— 作用域屏障:可并行编译,代价是无全模块 use-def 链</text>
<rect x="84" y="366" width="446.0" height="190" rx="8" fill="white" stroke="#16a34a" stroke-width="1.6"/>
<text x="94" y="384" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#166534">block ^bb0</text>
<rect x="94" y="392" width="426.0" height="26" rx="5" fill="#dcfce7" stroke="#22c55e" stroke-width="1.2"/>
<text x="307.0" y="410" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#166534">block argument %arg(取代 φ 节点)</text>
<rect x="100" y="426" width="414.0" height="70" rx="7" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
<text x="307.0" y="454" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a">Op</text>
<text x="307.0" y="472" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#1e40af">(可再挂 region —— 递归)</text>
<rect x="94" y="522" width="426.0" height="24" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
<text x="307.0" y="539" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#991b1b">terminator: cf.cond_br</text>
<rect x="550.0" y="366" width="446.0" height="190" rx="8" fill="white" stroke="#16a34a" stroke-width="1.6"/>
<text x="560.0" y="384" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#166534">block ^bb1</text>
<rect x="560.0" y="392" width="426.0" height="26" rx="5" fill="#dcfce7" stroke="#22c55e" stroke-width="1.2"/>
<text x="773.0" y="410" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#166534">block argument(无)</text>
<rect x="560.0" y="522" width="426.0" height="24" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
<text x="773.0" y="539" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#991b1b">terminator: affine.yield</text>
<line x1="530.0" y1="461.0" x2="550.0" y2="461.0" stroke="#16a34a" stroke-width="1.8" marker-end="url(#a)"/>
<text x="540.0" y="453.0" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#166534">CFG 边</text>
<path d="M 100 461 C 34 461, 34 110, 58 110" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="2,3" marker-end="url(#a2)"/>
<rect x="64" y="800" width="952" height="40" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/>
<text x="80" y="825" font-family="sans-serif" font-size="12" fill="#334155">location —— 每个 Op 实例都带的源位置信息</text>
<text x="1080" y="106" font-family="sans-serif" font-size="14.5" font-weight="bold" fill="#0f172a">类型系统(下游满眼 tensor&lt;…&gt;/memref&lt;…&gt; 落于此)</text>
<rect x="1080" y="130" width="440" height="56" rx="7" fill="#eef2ff" stroke="#6366f1" stroke-width="1.4"/>
<text x="1092" y="163.0" font-family="sans-serif" font-size="12" fill="#3730a3">• 严格类型相等,不提供隐式转换规则</text>
<rect x="1080" y="198" width="440" height="56" rx="7" fill="#eef2ff" stroke="#6366f1" stroke-width="1.4"/>
<text x="1092" y="231.0" font-family="sans-serif" font-size="12" fill="#3730a3">• 只支持非依赖类型</text>
<rect x="1080" y="266" width="440" height="56" rx="7" fill="#eef2ff" stroke="#6366f1" stroke-width="1.4"/>
<text x="1092" y="299.0" font-family="sans-serif" font-size="12" fill="#3730a3">• 函数与 module 就是 builtin 方言里的 Op</text>
<text x="1080" y="354" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#334155">module / function 也只是 Op</text>
<rect x="1080" y="370" width="440" height="74" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="1.3"/>
<text x="1092" y="392" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">module</text>
<text x="1092" y="412" font-family="sans-serif" font-size="11" fill="#334155">= 1 个 region、1 个 block</text>
<text x="1092" y="430" font-family="sans-serif" font-size="11" fill="#334155">(不是与 Op 并列的新概念)</text>
<rect x="1080" y="458" width="440" height="74" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="1.3"/>
<text x="1092" y="480" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">function</text>
<text x="1092" y="500" font-family="sans-serif" font-size="11" fill="#334155">region 的入口 block 参数</text>
<text x="1092" y="518" font-family="sans-serif" font-size="11" fill="#334155">即函数参数</text>
<rect x="1080" y="542" width="440" height="70" rx="7" fill="#fdf4ff" stroke="#a21caf" stroke-width="1.3"/>
<text x="1092" y="562" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#701a75">dialect = 分组机制</text>
<text x="1092" y="582" font-family="sans-serif" font-size="10.5" fill="#701a75">不同方言的 Op 可在任意层级、任意时刻共存</text>
<text x="1092" y="600" font-family="sans-serif" font-size="10.5" fill="#701a75">——渐进式下降的物理基础</text>
<text x="40" y="966" font-family="sans-serif" font-size="10.5" fill="#64748b">依据:arXiv:2002.11054 §3;算子名仅示意上游 affine.for,非本仓自研方言</text>
</svg>