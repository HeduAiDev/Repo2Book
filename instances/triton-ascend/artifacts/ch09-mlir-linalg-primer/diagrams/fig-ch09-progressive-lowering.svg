<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 898 630">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker><linearGradient id="grad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1d4ed8"/><stop offset="72%" stop-color="#93c5fd"/><stop offset="100%" stop-color="#e2e8f0"/></linearGradient></defs>
<rect width="898" height="630" fill="white"/>
<text x="449.0" y="44" text-anchor="middle" font-family="sans-serif" font-size="16.5" font-weight="bold" fill="#0f172a">渐进式下降与维持高层语义是一对:层级可以写死,也可以由方言组合而成</text>
<text x="449.0" y="66" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#475569">Open64 与 Clang 的层级在设计时就固定(论文原话 in a rigid way);MLIR 让不同方言的算子在任意层级共存</text>
<text x="149.0" y="114" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Open64 WHIRL</text>
<rect x="44" y="130.0" width="210" height="52" rx="6" fill="#eff6ff" stroke="#1e3a8a" stroke-width="1.6" />
<text x="149.0" y="160.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">Very High WHIRL</text>
<line x1="149.0" y1="182.0" x2="149.0" y2="194.0" stroke="#64748b" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="44" y="196.0" width="210" height="52" rx="6" fill="#eff6ff" stroke="#1e3a8a" stroke-width="1.6" />
<text x="149.0" y="226.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">High WHIRL</text>
<line x1="149.0" y1="248.0" x2="149.0" y2="260.0" stroke="#64748b" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="44" y="262.0" width="210" height="52" rx="6" fill="#eff6ff" stroke="#1e3a8a" stroke-width="1.6" />
<text x="149.0" y="292.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">Mid WHIRL</text>
<line x1="149.0" y1="314.0" x2="149.0" y2="326.0" stroke="#64748b" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="44" y="328.0" width="210" height="52" rx="6" fill="#eff6ff" stroke="#1e3a8a" stroke-width="1.6" />
<text x="149.0" y="358.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">Low WHIRL</text>
<line x1="149.0" y1="380.0" x2="149.0" y2="392.0" stroke="#64748b" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="44" y="394.0" width="210" height="52" rx="6" fill="#eff6ff" stroke="#1e3a8a" stroke-width="1.6" />
<text x="149.0" y="424.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">Very Low WHIRL</text>
<text x="149.0" y="470" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">5 个层级(论文自述)</text>
<text x="419.0" y="114" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Clang</text>
<rect x="314" y="130.0" width="210" height="52" rx="6" fill="#eff6ff" stroke="#1e3a8a" stroke-width="1.6" />
<text x="419.0" y="160.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">AST</text>
<line x1="419.0" y1="182.0" x2="419.0" y2="194.0" stroke="#64748b" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="314" y="196.0" width="210" height="52" rx="6" fill="#eff6ff" stroke="#1e3a8a" stroke-width="1.6" />
<text x="419.0" y="226.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">LLVM IR</text>
<line x1="419.0" y1="248.0" x2="419.0" y2="260.0" stroke="#64748b" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="314" y="262.0" width="210" height="52" rx="6" fill="#eff6ff" stroke="#1e3a8a" stroke-width="1.6" />
<text x="419.0" y="292.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">SelectionDAG</text>
<line x1="419.0" y1="314.0" x2="419.0" y2="326.0" stroke="#64748b" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="314" y="328.0" width="210" height="52" rx="6" fill="#eff6ff" stroke="#1e3a8a" stroke-width="1.6" />
<text x="419.0" y="358.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">MachineInstr</text>
<line x1="419.0" y1="380.0" x2="419.0" y2="392.0" stroke="#64748b" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="314" y="394.0" width="210" height="52" rx="6" fill="#eff6ff" stroke="#1e3a8a" stroke-width="1.6" />
<text x="419.0" y="424.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">MCInst</text>
<text x="419.0" y="470" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">AST -&gt; LLVM IR -&gt; SelectionDAG</text>
<text x="419.0" y="485" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">-&gt; MachineInstr -&gt; MCInst(逐字列出,</text>
<text x="419.0" y="500" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">不给计数)</text>
<text x="689.0" y="114" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e293b">MLIR</text>
<rect x="584" y="163.0" width="210" height="52" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.6" stroke-dasharray="5,4"/>
<text x="689.0" y="185.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">高层方言</text>
<text x="689.0" y="201.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">(如 linalg)</text>
<line x1="689.0" y1="215.0" x2="689.0" y2="227.0" stroke="#64748b" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="584" y="229.0" width="210" height="52" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.6" stroke-dasharray="5,4"/>
<text x="689.0" y="251.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">混合下降中间态</text>
<text x="689.0" y="267.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">(多方言共存)</text>
<line x1="689.0" y1="281.0" x2="689.0" y2="293.0" stroke="#64748b" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="584" y="295.0" width="210" height="52" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.6" stroke-dasharray="5,4"/>
<text x="689.0" y="325.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">……</text>
<line x1="689.0" y1="347.0" x2="689.0" y2="359.0" stroke="#64748b" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="584" y="361.0" width="210" height="52" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.6" stroke-dasharray="5,4"/>
<text x="689.0" y="383.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">低层方言</text>
<text x="689.0" y="399.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">(如 llvm)</text>
<text x="689.0" y="470" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">层级由方言组合而成;不同方言算子可在任意层级共存</text>
<rect x="814" y="130" width="18" height="316" rx="6" fill="url(#grad)"/>
<text x="823" y="120" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">结构</text>
<text x="823" y="462" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">剩余</text>
<rect x="44" y="506" width="810" height="34" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
<text x="449.0" y="528" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#78350f">丢结构是有意识的,只发生在结构不再需要匹配底层执行模型的地方</text>
<rect x="44" y="552" width="810" height="34" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
<text x="449.0" y="574" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#3730a3">本书三段下降链 ttir -&gt; ttadapter -&gt; npubin,是这一原则的一次具体实例化</text>
<text x="44" y="618" font-family="sans-serif" font-size="10.5" fill="#64748b">依据:arXiv:2002.11054 §2</text>
</svg>