<text x="44" y="1222" font-family="sans-serif" font-size="11" fill="#64748b">缓存粘滞实测：先在 TRITON_BACKEND=mindspore 下调用一次并解析出 mindspore，再把环境变量改成 torch_npu 后重复调用同一进程——backend_policy 仍返回 mindspore，不因环境变量事后改变而重新解析。</text>
<text x="44" y="1244" font-family="sans-serif" font-size="11" fill="#64748b">对照：allocate_memory 同样两框架各一套 C++（mindspore 走 pyboost::MemBlock，torch_npu 走 at::empty(kPrivateUse1)）。</text>
