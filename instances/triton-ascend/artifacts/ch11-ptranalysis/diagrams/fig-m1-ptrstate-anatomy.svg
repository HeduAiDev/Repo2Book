<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1352 454">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker></defs>
<rect width="1352" height="454" fill="white"/>
<text x="40" y="40" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e40af">PtrState 结构解剖（PtrAnalysis.h:L41-L64 struct StateInfo）</text>
<text x="40" y="62" font-family="sans-serif" font-size="12" fill="#64748b">一份指针分析结果 = base 仓库 + 块内起点 + 逐维跳格规则；addState/mulState 就是合并两张这样的单子</text>
<rect x="40" y="108" width="300" height="96" rx="10" fill="#93c5fd" stroke="#1e3a5f" stroke-width="2"/>
<text x="190.0" y="134" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a">source</text>
<text x="190.0" y="156" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">base 指针</text>
<text x="190.0" y="182" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#78350f" font-weight="bold">%arg1（!tt.ptr&lt;i8&gt;）</text>
<rect x="364" y="108" width="300" height="96" rx="10" fill="#86efac" stroke="#1e3a5f" stroke-width="2"/>
<text x="514.0" y="134" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a">offset</text>
<text x="514.0" y="156" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">标量起点</text>
<text x="514.0" y="182" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#78350f" font-weight="bold">rem(%9, 1024)</text>
<rect x="688" y="108" width="300" height="96" rx="10" fill="#fcd34d" stroke="#1e3a5f" stroke-width="2"/>
<text x="838.0" y="134" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a">stateInfo[]</text>
<text x="838.0" y="156" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">逐维 (stride,shape,dimIndex)</text>
<text x="838.0" y="182" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#78350f" font-weight="bold">[(%arg4,64,d0),(1,256,d1)]</text>
<rect x="1012" y="108" width="300" height="96" rx="10" fill="#f9a8d4" stroke="#1e3a5f" stroke-width="2"/>
<text x="1162.0" y="134" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a">sizes</text>
<text x="1162.0" y="156" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">原始形状</text>
<text x="1162.0" y="182" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#78350f" font-weight="bold">[64, 256]</text>
<line x1="838.0" y1="204" x2="838.0" y2="252" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
<text x="838.0" y="270" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#92400e">stateInfo 元素三元组 = (stride, shape, dimIndex)</text>
<rect x="503.0" y="286" width="210" height="64" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
<text x="608.0" y="306" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#713f12">stride=%arg4</text>
<text x="608.0" y="328" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#78350f">地址每走一格跳多远</text>
<rect x="733.0" y="286" width="210" height="64" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
<text x="838.0" y="306" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#713f12">shape=64</text>
<text x="838.0" y="328" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#78350f">这一维有多少格</text>
<rect x="963.0" y="286" width="210" height="64" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
<text x="1068.0" y="306" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#713f12">dimIndex=d0</text>
<text x="1068.0" y="328" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#78350f">原张量第几维</text>
<rect x="40" y="396" width="1272" height="54" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="58" y="418" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#3730a3">示例终态：source=%arg1, offset=rem(%9,1024), stateInfo=[(%arg4,64,d0),(1,256,d1)], sizes=[64,256]</text>
<text x="58" y="438" font-family="sans-serif" font-size="10.5" fill="#4338ca">shouldLinearize：bool，默认 false（PtrAnalysis.h:L64）——需要线性化回退时才置 true</text>
</svg>