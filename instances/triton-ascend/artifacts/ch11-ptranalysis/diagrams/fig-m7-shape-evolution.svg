<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 496">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker><marker id="ad" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#94a3b8"/></marker></defs>
<rect width="1220" height="496" fill="white"/>
<text x="40" y="40" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e40af">make_range→expand_dims→broadcast 与 splat：三个纯形状算子不碰 offset/source</text>
<text x="40" y="62" font-family="sans-serif" font-size="11.5" fill="#64748b">expand_dims 插零 stride 维、broadcast 只加宽 size=1 维的 shape、splat 把标量（含 base 指针）沿各维铺成 stride=0</text>
<rect x="40.0" y="108" width="240" height="74" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
<text x="160.0" y="123" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">make_range</text>
<text x="160.0" y="137" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">%14=make_range(0,64)</text>
<text x="160.0" y="156.0" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#0f172a">[(1,64,d0)]</text>
<text x="160.0" y="168.5" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#0f172a">sizes=[64]</text>
<line x1="280.0" y1="145.0" x2="490.0" y2="145.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="490.0" y="108" width="240" height="74" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
<text x="610.0" y="123" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">expand_dims</text>
<text x="610.0" y="137" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">(axis=1) %19</text>
<text x="610.0" y="156.0" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#0f172a">[(1,64,d0),(0,1,d1)]</text>
<text x="610.0" y="168.5" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#0f172a">sizes=[64,1]</text>
<line x1="730.0" y1="145.0" x2="940.0" y2="145.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="940.0" y="108" width="240" height="74" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="1060.0" y="123" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#14532d">broadcast</text>
<text x="1060.0" y="137" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#14532d">%23</text>
<text x="1060.0" y="156.0" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#14532d">[(%arg4,64,d0),(0,256,d1)]</text>
<text x="1060.0" y="168.5" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#14532d">d1: shape 1→256</text>
<text x="835.0" y="135.0" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#b45309">中间经 mul %21（见 m5）</text>
<text x="835.0" y="163.0" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#b45309">d0 stride 由 1→%arg4，非本机制改动</text>
<rect x="265.0" y="312" width="240" height="74" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
<text x="385.0" y="327" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">splat(%arg1)</text>
<text x="385.0" y="341" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">（!tt.ptr 标量）</text>
<line x1="505.0" y1="349.0" x2="715.0" y2="349.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="715.0" y="312" width="240" height="74" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="835.0" y="334" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#14532d">%26</text>
<text x="835.0" y="360.0" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#14532d">[(0,64,d0),(0,256,d1)]</text>
<text x="835.0" y="372.5" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#14532d">source=%arg1</text>
<path d="M 1180.0 145.0 L 1090 145.0 L 1090 247.0" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,3"/>
<path d="M 955.0 349.0 L 1090 349.0 L 1090 247.0" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#ad)"/>
<rect x="1084" y="227.0" width="140" height="40" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4,3"/>
<text x="1154" y="243.0" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#475569">交给 addState</text>
<text x="1154" y="258.0" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#94a3b8">（见 m3/m4，无因果先后）</text>
<text x="40" y="466" font-family="sans-serif" font-size="11" fill="#64748b">expand_dims/broadcast 全程不碰 offset/source；splat 只把已有 source（来自更早的 initStateByPointer）原样铺进整块张量，三者都不产生新 source、不改已有 offset</text>
</svg>