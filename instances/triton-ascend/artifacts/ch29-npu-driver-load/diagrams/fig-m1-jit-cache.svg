<rect x="40" y="760" width="640" height="90" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
<text x="360" y="799" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0c4a6e">importlib 动态加载 .so → self.npu_utils_mod</text>
<text x="360" y="819" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">(driver.py:L69-L73)</text>
<line x1="360" y1="850" x2="360" y2="876" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="40" y="876" width="640" height="90" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
<text x="360" y="915" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#3730a3">对外暴露：load_binary / get_arch / get_aicore_num</text>
<text x="360" y="935" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">(driver.py:L77-L79, L90-L92, L94-L97)</text>
<rect x="40" y="996" width="640" height="70" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
<text x="56" y="1020" font-family="sans-serif" font-size="12.5" fill="#1e3a5f">同一 CANN/ABI 环境下第一次付编译代价、之后复用；源码一改 md5 变、</text>
<text x="56" y="1044" font-family="sans-serif" font-size="12.5" fill="#1e3a5f">key 变、自动重编——无需为每个环境预打包 .so。</text>
</svg>