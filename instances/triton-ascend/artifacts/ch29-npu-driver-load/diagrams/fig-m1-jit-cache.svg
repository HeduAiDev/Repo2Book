<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1106">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker></defs>
<rect width="720" height="1106" fill="white"/>
<text x="40" y="34" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1e40af">NPUUtils：首次实例化即时编译 npu_utils.so，md5 做缓存 key</text>
<text x="40" y="56" font-family="sans-serif" font-size="12" fill="#64748b">third_party/ascend/backend/driver.py —— 源不变复用旧 .so，改一行 C++ 即换 key 重编</text>
<rect x="40" y="96" width="640" height="112" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
<text x="360" y="135" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0c4a6e">NPUUtils() 首次调用 —— __new__</text>
<text x="360" y="155" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">hasattr(cls,'instance')？是→复用旧单例／否→新建实例</text>
<text x="360" y="175" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">(driver.py:L48-L51；单例 instance 数恒为 1)</text>
<line x1="360" y1="208" x2="360" y2="234" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="40" y="234" width="640" height="90" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
<text x="360" y="273" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0c4a6e">__init__：读 npu_utils.cpp 源文本 src</text>
<text x="360" y="293" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">(driver.py:L53-L56)</text>
<line x1="360" y1="324" x2="360" y2="350" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="40" y="350" width="640" height="112" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
<text x="360" y="389" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0c4a6e">key = md5(src).hexdigest() —— 32 位十六进制</text>
<text x="360" y="409" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">cache = get_cache_manager(key)；cache_path = cache.get_file("npu_utils.so")</text>
<text x="360" y="429" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">(driver.py:L57-L60)</text>
<line x1="360" y1="462" x2="360" y2="488" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="40" y="488" width="640" height="66" rx="14" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="360" y="526" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#78350f">cache_path is None？（缓存命中判定，driver.py:L61）</text>
<line x1="360" y1="554" x2="360" y2="572" stroke="#334155" stroke-width="2"/>
<line x1="195" y1="572" x2="525" y2="572" stroke="#334155" stroke-width="2"/>
<line x1="195" y1="572" x2="195" y2="610" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<line x1="525" y1="572" x2="525" y2="610" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<text x="195" y="564" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155">否（命中）</text>
<rect x="45" y="610" width="300" height="90" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="195" y="649" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#15803d">直接用 cache_path 里</text>
<text x="195" y="669" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">已编好的 .so</text>
<text x="525" y="564" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155">是（未命中）</text>
<rect x="375" y="610" width="300" height="90" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="525" y="649" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#b91c1c">_build_npu_ext 就地把 .cpp 编成 .so</text>
<text x="525" y="669" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">→ cache.put 落盘 (driver.py:L62-L68)</text>
<line x1="195" y1="700" x2="195" y2="734" stroke="#334155" stroke-width="2"/>
<line x1="525" y1="700" x2="525" y2="734" stroke="#334155" stroke-width="2"/>
<line x1="195" y1="734" x2="525" y2="734" stroke="#334155" stroke-width="2"/>
