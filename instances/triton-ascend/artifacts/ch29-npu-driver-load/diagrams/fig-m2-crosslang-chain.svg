<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 870">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker><marker id="b" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#0369a1"/></marker></defs>
<rect width="1420" height="870" fill="white"/>
<text x="40" y="34" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1e40af">跨语言接力：一个二进制 blob 从 triton 核心装到 CANN 运行时的四道栏</text>
<text x="40" y="56" font-family="sans-serif" font-size="12" fill="#64748b">compiler.py → driver.py → npu_utils.cpp → CANN rt* —— call 实线 / return 虚线</text>
<rect x="55" y="60" width="170" height="42" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
<text x="140" y="78" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">triton 核心</text>
<text x="140" y="95" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#0f172a">(compiler.py)</text>
<line x1="140" y1="104" x2="140" y2="782" stroke="#94a3b8" stroke-dasharray="4,4"/>
<rect x="435" y="60" width="170" height="42" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
<text x="520" y="78" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">Python 驱动层</text>
<text x="520" y="95" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#0f172a">(driver.py)</text>
<line x1="520" y1="104" x2="520" y2="782" stroke="#94a3b8" stroke-dasharray="4,4"/>
<rect x="815" y="60" width="170" height="42" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
<text x="900" y="78" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">C++ 扩展</text>
<text x="900" y="95" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#0f172a">(npu_utils.cpp)</text>
<line x1="900" y1="104" x2="900" y2="782" stroke="#94a3b8" stroke-dasharray="4,4"/>
<rect x="1195" y="60" width="170" height="42" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
<text x="1280" y="78" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">CANN 运行时</text>
<text x="1280" y="95" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#0f172a">(rt*)</text>
<line x1="1280" y1="104" x2="1280" y2="782" stroke="#94a3b8" stroke-dasharray="4,4"/>
<line x1="140" y1="162" x2="520" y2="162" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<text x="330" y="126" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#334155">load_binary(self.name,</text>
<text x="330" y="142" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#334155">self.kernel=blob, shared, device)</text>
<rect x="538" y="188" width="340" height="52" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
<text x="550" y="206" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#334155">name.rsplit("_", 1) → (fnname, mix_mode)</text>
<text x="550" y="222" font-family="sans-serif" font-size="10.5" fill="#334155">（从右切一刀，driver.py:L78）</text>
<line x1="520" y1="298" x2="900" y2="298" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<text x="710" y="262" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#334155">load_kernel_binary(fnname, kernel,</text>
<text x="710" y="278" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#334155">shared, device, mix_mode)</text>
<rect x="918" y="324" width="340" height="52" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
<text x="930" y="342" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#334155">PyArg_ParseTuple("ss#iis", ...) —— 6 个入参</text>
<text x="930" y="358" font-family="sans-serif" font-size="10.5" fill="#334155">解出 name/data/data_size/shared/device/kernel_mode（npu_utils.cpp:L92-L93）</text>
<line x1="900" y1="434" x2="1280" y2="434" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<text x="1090" y="398" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#334155">registerKernel(...)：rtSetDevice →</text>
<text x="1090" y="414" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#334155">rtDevBinaryRegister → rtFunctionRegister</text>
<line x1="1280" y1="504" x2="900" y2="504" stroke="#0369a1" stroke-width="1.8" stroke-dasharray="7,5" marker-end="url(#b)"/>
<text x="1090" y="468" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#0369a1">(devbinHandle,</text>
<text x="1090" y="484" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#0369a1">func_stub_handle)</text>
<line x1="900" y1="590" x2="520" y2="590" stroke="#0369a1" stroke-width="1.8" stroke-dasharray="7,5" marker-end="url(#b)"/>
<text x="710" y="538" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#0369a1">Py_BuildValue("(KKii)")</text>
<text x="710" y="554" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#0369a1">→ (module, function, 0, 0)</text>
<text x="710" y="570" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#0369a1">（npu_utils.cpp:L106）</text>
<line x1="520" y1="660" x2="140" y2="660" stroke="#0369a1" stroke-width="1.8" stroke-dasharray="7,5" marker-end="url(#b)"/>
<text x="330" y="624" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#0369a1">(module, function,</text>
<text x="330" y="640" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#0369a1">n_regs=0, n_spills=0)</text>
<rect x="158" y="686" width="340" height="52" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
<text x="170" y="704" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#334155">self.module, self.function,</text>
<text x="170" y="720" font-family="sans-serif" font-size="10.5" fill="#334155">self.n_regs, self.n_spills = 该四元组</text>
<rect x="40" y="782" width="1340" height="68" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
<text x="56" y="804" font-family="sans-serif" font-size="12" fill="#1e3a5f">跨语言边界数 = 4 层（核心 / Python / C++ / CANN）；rsplit 从右切一刀拆出 mix_mode；</text>
<text x="56" y="828" font-family="sans-serif" font-size="12" fill="#1e3a5f">PyArg 格式串 ss#iis 对应 6 个入参；C++ 回传固定 (KKii) 四元组，末两位 n_regs/n_spills 恒为 0（占位，NPU 无此概念）。</text>
</svg>