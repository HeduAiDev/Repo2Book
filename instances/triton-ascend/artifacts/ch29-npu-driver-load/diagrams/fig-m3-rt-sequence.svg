<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1070">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker><marker id="c" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#b91c1c"/></marker></defs>
<rect width="1040" height="1070" fill="white"/>
<text x="40" y="34" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1e40af">registerKernel：3 个 rt* 调用逐级注册，任一失败即早退双 nullptr</text>
<text x="40" y="56" font-family="sans-serif" font-size="12" fill="#64748b">third_party/ascend/backend/npu_utils.cpp:L40-L82 —— 设备→二进制→函数，逐级注册</text>
<rect x="40" y="100" width="560" height="128" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
<text x="320" y="139" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0c4a6e">填 rtDevBinary_t：data=blob, length=data_size</text>
<text x="320" y="159" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">magic = (kernel_mode=="aiv") ? RT_DEV_BINARY_MAGIC_ELF_AIVEC</text>
<text x="320" y="179" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">                              : RT_DEV_BINARY_MAGIC_ELF</text>
<text x="320" y="199" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">version = 0  (npu_utils.cpp:L36-L53)</text>
<line x1="320" y1="228" x2="320" y2="254" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="40" y="254" width="560" height="88" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
<text x="320" y="293" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0c4a6e">rtSetDevice(device)</text>
<text x="320" y="313" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">(npu_utils.cpp:L55)</text>
<rect x="660" y="254" width="340" height="80" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="830" y="278" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#991b1b">失败 → printf("rtSetDevice failed, 0x%x")</text>
<text x="830" y="298" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#991b1b">→ return {nullptr, nullptr}</text>
<text x="830" y="318" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#991b1b">(L57-L58)</text>
<line x1="600" y1="298" x2="646" y2="298" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="4,3"/>
<line x1="646" y1="298" x2="646" y2="254" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="4,3"/>
<line x1="646" y1="254" x2="660" y2="254" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#c)"/>
<line x1="320" y1="342" x2="320" y2="368" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="40" y="368" width="560" height="88" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
<text x="320" y="407" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0c4a6e">rtDevBinaryRegister(&amp;devbin, &amp;devbinHandle)</text>
<text x="320" y="427" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">拿 devbinHandle (npu_utils.cpp:L62)</text>
<rect x="660" y="368" width="340" height="80" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="830" y="392" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#991b1b">失败 → printf("rtDevBinaryRegister failed, 0x%x")</text>
<text x="830" y="412" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#991b1b">→ return {nullptr, nullptr}</text>
<text x="830" y="432" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#991b1b">(L64-L65)</text>
<line x1="600" y1="412" x2="646" y2="412" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="4,3"/>
<line x1="646" y1="412" x2="646" y2="368" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="4,3"/>
<line x1="646" y1="368" x2="660" y2="368" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#c)"/>
<line x1="320" y1="456" x2="320" y2="482" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="40" y="482" width="560" height="88" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
<text x="320" y="521" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0c4a6e">stubName = name + "_" + registered_names[name]；</text>
<text x="320" y="541" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">registered_names[name]++ (L68-L70)</text>
<line x1="320" y1="570" x2="320" y2="596" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="40" y="596" width="560" height="88" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
<text x="320" y="635" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0c4a6e">func_stubs.emplace(stubName, make_unique&lt;size_t&gt;(0))</text>
<text x="320" y="655" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">func_stub_handle = registered.first-&gt;second.get() (L71-L72)</text>
<line x1="320" y1="684" x2="320" y2="710" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="40" y="710" width="560" height="88" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
<text x="320" y="749" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0c4a6e">rtFunctionRegister(devbinHandle, func_stub_handle,</text>
<text x="320" y="769" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">stubName, name, funcMode=0) (npu_utils.cpp:L73-L74)</text>
<rect x="660" y="710" width="340" height="80" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="830" y="734" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#991b1b">失败 → printf("rtFunctionRegister failed, ...")</text>
<text x="830" y="754" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#991b1b">→ return {nullptr, nullptr}</text>
<text x="830" y="774" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#991b1b">(L76-L78)</text>
<line x1="600" y1="754" x2="646" y2="754" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="4,3"/>
<line x1="646" y1="754" x2="646" y2="710" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="4,3"/>
<line x1="646" y1="710" x2="660" y2="710" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#c)"/>
<line x1="320" y1="798" x2="320" y2="824" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="40" y="824" width="560" height="88" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="320" y="863" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#14532d">return (devbinHandle, func_stub_handle)</text>
<text x="320" y="883" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">—— 全过关才产出 2 个句柄 (npu_utils.cpp:L81)</text>
<rect x="40" y="942" width="960" height="88" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
<text x="56" y="964" font-family="sans-serif" font-size="12" fill="#1e3a5f">aiv/aic 是二分不是三分：kernel_mode=="aiv" 才走 AIVEC 魔数，其余(aic/mix)统一走</text>
<text x="56" y="986" font-family="sans-serif" font-size="12" fill="#1e3a5f">ELF 魔数——不是 aiv/aic 各自专属一个魔数的对称三分。3 次 rt* 调用步步把关，</text>
<text x="56" y="1008" font-family="sans-serif" font-size="12" fill="#1e3a5f">任一非 RT_ERROR_NONE 立即短路吐出双 nullptr，成功路径唯一产出 2 个稳定句柄。</text>
</svg>