<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 750">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker></defs>
<rect width="960" height="750" fill="white"/>
<text x="40" y="34" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1e40af">NPULauncher 生命周期：只编译一次，之后每次只转调</text>
<text x="40" y="56" font-family="sans-serif" font-size="12" fill="#64748b">driver.py —— 构造期生成+编译+缓存+dlopen（一次性）；此后每次 kernel 调用只转调（每次）</text>
<rect x="130" y="96" width="680" height="82" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
<text x="470" y="131" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#0c4a6e">① NPULauncher.__init__ —— 构造期入口</text>
<text x="470" y="151" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">driver.py:L105</text>
<line x1="470" y1="178" x2="470" y2="204" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="130" y="204" width="680" height="82" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
<text x="470" y="239" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#0c4a6e">② generate_npu_wrapper_src 现拼 wrapper 源码</text>
<text x="470" y="259" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">调用于 L115，定义于 L403</text>
<line x1="470" y1="286" x2="470" y2="312" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="130" y="312" width="680" height="82" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="470" y="347" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#78350f">③ make_npu_launcher_stub：以 sha256(wrapper_src) 为缓存键</text>
<text x="470" y="367" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">命中 → 直接用旧 .so；未命中 → 就地编译 (driver.py:L253)</text>
<line x1="470" y1="394" x2="470" y2="420" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="130" y="420" width="680" height="82" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
<text x="470" y="455" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#0c4a6e">④ importlib dlopen → self.launch = getattr(mod, "launch")</text>
<text x="470" y="475" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">driver.py:L124-126</text>
<line x1="470" y1="502" x2="470" y2="528" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="130" y="528" width="680" height="82" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
<text x="470" y="563" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#3730a3">⑤ 每次 kernel 调用：__call__ → self.launch(*args)</text>
<text x="470" y="583" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">driver.py:L128 / L139-140</text>
<path d="M 840.0 96 L 854.0 96 L 854.0 502 L 840.0 502" fill="none" stroke="#0369a1" stroke-width="2"/>
<text x="870.0" y="278" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0369a1">只</text>
<text x="870.0" y="291" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0369a1">发</text>
<text x="870.0" y="304" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0369a1">生</text>
<text x="870.0" y="317" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0369a1">一</text>
<text x="870.0" y="330" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0369a1">次</text>
<path d="M 840.0 528 L 854.0 528 L 854.0 610 L 840.0 610" fill="none" stroke="#6d28d9" stroke-width="2"/>
<text x="870.0" y="554" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#6d28d9">每</text>
<text x="870.0" y="568" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#6d28d9">次</text>
<text x="870.0" y="580" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#6d28d9">调</text>
<text x="870.0" y="594" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#6d28d9">用</text>
<rect x="40" y="640" width="880" height="70" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
<text x="56" y="664" font-family="sans-serif" font-size="12.5" fill="#1e3a5f">wrapper_src 完全由 (constants, signature, metadata) 三者确定，相同签名逐字节相同 → sha256 相同 →</text>
<text x="56" y="688" font-family="sans-serif" font-size="12.5" fill="#1e3a5f">复用同一个 .so，永不重复编译；不同签名的 kernel 各自只在第一次调用时付一次编译代价。</text>
</svg>