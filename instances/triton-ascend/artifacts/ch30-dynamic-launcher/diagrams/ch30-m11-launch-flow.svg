<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1352 736">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker><marker id="b" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#0369a1"/></marker></defs>
<rect width="1352" height="736" fill="white"/>
<text x="40" y="34" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1e40af">launch() C 入口：一次发射的定序流水</text>
<text x="40" y="56" font-family="sans-serif" font-size="12" fill="#64748b">driver.py —— PyArg_ParseTuple 解包 → enter hook → getPointer → _launch → exit hook → 返回</text>
<rect x="35" y="64" width="270" height="46" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
<text x="170" y="84" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#0f172a">Python 调用方</text>
<text x="170" y="102" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#0f172a">(NPULauncher.__call__)</text>
<line x1="170" y1="112" x2="170" y2="652" stroke="#94a3b8" stroke-dasharray="4,4"/>
<rect x="595" y="64" width="270" height="46" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
<text x="730" y="84" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#0f172a">launch() C 入口</text>
<text x="730" y="102" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#0f172a">(driver.py:L876-942)</text>
<line x1="730" y1="112" x2="730" y2="652" stroke="#94a3b8" stroke-dasharray="4,4"/>
<line x1="170" y1="174" x2="730" y2="174" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<text x="450" y="136" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155">self.launch(*args, **kwargs)</text>
<text x="450" y="152" text-anchor="middle" font-family="monospace" font-size="11" fill="#334155">driver.py:L140</text>
<rect x="752" y="200" width="560" height="54" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
<text x="764" y="220" font-family="monospace" font-size="11.5" font-weight="bold" fill="#334155">① PyArg_ParseTuple(args, format, &amp;gridX.., ...)</text>
<text x="764" y="236" font-family="sans-serif" font-size="10.5" fill="#334155">按 format 解出 grid/stream/function/metadata/hooks/kernel 实参（L886-895）</text>
<rect x="752" y="270" width="560" height="54" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
<text x="764" y="290" font-family="monospace" font-size="11.5" font-weight="bold" fill="#334155">② launch_enter_hook 执行</text>
<text x="764" y="306" font-family="sans-serif" font-size="10.5" fill="#334155">if (launch_enter_hook != Py_None) 调 PyObject_CallObject（L906-911）</text>
<rect x="752" y="340" width="560" height="54" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
<text x="764" y="360" font-family="monospace" font-size="11.5" font-weight="bold" fill="#334155">③ getPointer 把每个 tensor 实参解成设备指针</text>
<text x="764" y="376" font-family="sans-serif" font-size="10.5" fill="#334155">DevicePtrInfo ptr_info_i = getPointer(_arg_i, i)（L929）</text>
<rect x="752" y="410" width="560" height="54" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
<text x="764" y="430" font-family="monospace" font-size="11.5" font-weight="bold" fill="#334155">④ _launch(kernelName, function, stream, gridX.., ..., ptr_info...)</text>
<text x="764" y="446" font-family="sans-serif" font-size="10.5" fill="#334155">转调发射（driver.py:L930）</text>
<rect x="752" y="480" width="560" height="54" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
<text x="764" y="500" font-family="monospace" font-size="11.5" font-weight="bold" fill="#334155">launch_exit_hook 执行 + Py_RETURN_NONE</text>
<text x="764" y="516" font-family="sans-serif" font-size="10.5" fill="#334155">if (launch_exit_hook != Py_None) 调 PyObject_CallObject（L934-941）</text>
<line x1="730" y1="596" x2="170" y2="596" stroke="#0369a1" stroke-width="1.8" stroke-dasharray="7,5" marker-end="url(#b)"/>
<text x="450" y="558" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0369a1">⑤ 返回 profiler_registered</text>
<text x="450" y="574" text-anchor="middle" font-family="monospace" font-size="11" fill="#0369a1">driver.py:L139-142</text>
<rect x="40" y="648" width="1272" height="68" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
<text x="56" y="670" font-family="sans-serif" font-size="12" fill="#1e3a5f">五步在同一个 C 函数 launch() 内顺序执行，中途任一步失败（解包失败/hook 抛异常）即 return NULL，不会跑到 _launch；</text>
<text x="56" y="694" font-family="sans-serif" font-size="12" fill="#1e3a5f">getPointer 只对指针类实参调用（*fp32 等），i32 等标量实参由 PyArg_ParseTuple 直接收进 _arg_i,不经 getPointer。</text>
</svg>