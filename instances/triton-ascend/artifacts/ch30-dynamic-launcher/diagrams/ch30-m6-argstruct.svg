<text x="66" y="408" font-family="sans-serif" font-size="12" fill="#1e3a5f">arg0/arg1/arg2 对应 kernel 实参 x_ptr/y_ptr/out_ptr；arg3 对应 n_elements —— 均来自 signature.items() 顺序。</text>
<text x="66" y="432" font-family="sans-serif" font-size="12" fill="#1e3a5f">字段声明顺序与初始化列表顺序一致（同一循环生成，L818-823/L825-832）；constants 不入 struct；__attribute__((packed)) 无编译器补齐 —— 偏移即前缀宽度和，argsSize 随字段增减自动同步。</text>
