<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 552">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#b91c1c"/></marker></defs>
<rect width="890" height="552" fill="white"/>
<text x="40" y="34" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1e40af">workspace 每次按 grid 现分配，不跨调用复用</text>
<text x="40" y="56" font-family="sans-serif" font-size="12" fill="#64748b">driver.py:_launch —— totalWorkSpaceSize = workspace_size(256) × blockNum4Workspace(L771/774)</text>
<rect x="250" y="108" width="292" height="34" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="396.0" y="129.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="white" font-weight="bold">发射 A（首发）</text>
<rect x="550" y="108" width="292" height="34" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="696.0" y="129.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="white" font-weight="bold">发射 B（同 kernel 再发）</text>
<text x="234" y="177.0" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="bold" fill="#374151">grid(X,Y,Z)</text>
<rect x="250" y="152" width="292" height="42" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="396.0" y="177.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >(4, 1, 1)</text>
<rect x="550" y="152" width="292" height="42" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="696.0" y="177.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >(8, 1, 1)</text>
<text x="234" y="225.0" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="bold" fill="#374151">blockNum4Workspace</text>
<text x="234" y="241.0" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="bold" fill="#374151">= X·Y·Z</text>
<rect x="250" y="202" width="292" height="54" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="396.0" y="233.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >4</text>
<rect x="550" y="202" width="292" height="54" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="696.0" y="233.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >8</text>
<text x="234" y="325.0" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="bold" fill="#374151">totalWorkSpaceSize</text>
<text x="234" y="341.0" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="bold" fill="#374151">= 256 × 上一行</text>
<rect x="250" y="298" width="292" height="62" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="396.0" y="333.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#b91c1c" font-weight="bold" >256 × 4 = 1024 字节</text>
<rect x="550" y="298" width="292" height="62" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="696.0" y="333.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#b91c1c" font-weight="bold" >256 × 8 = 2048 字节</text>
<text x="234" y="401.0" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="bold" fill="#374151">是否复用上次分配</text>
<rect x="250" y="368" width="292" height="58" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="396.0" y="401.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >否（进 _launch 先置 NULL，L770）</text>
<rect x="550" y="368" width="292" height="58" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="696.0" y="401.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >否（按本次 grid 重算，L771/774）</text>
<line x1="40" y1="148" x2="842" y2="148" stroke="#e2e8f0" stroke-width="1"/>
<line x1="40" y1="198" x2="842" y2="198" stroke="#e2e8f0" stroke-width="1"/>
<line x1="40" y1="260" x2="842" y2="260" stroke="#e2e8f0" stroke-width="1"/>
<line x1="40" y1="364" x2="842" y2="364" stroke="#e2e8f0" stroke-width="1"/>
<line x1="40" y1="430" x2="842" y2="430" stroke="#e2e8f0" stroke-width="1"/>
<path d="M 396 278 Q 546 258 696 278" fill="none" stroke="#b91c1c" stroke-width="2" marker-end="url(#a)"/>
<rect x="524" y="246" width="44" height="20" rx="5" fill="white" stroke="#b91c1c" stroke-width="1.2"/>
<text x="546" y="260" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#b91c1c">×2</text>
<rect x="40" y="464" width="810" height="68" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
<text x="56" y="486" font-family="sans-serif" font-size="12" fill="#1e3a5f">workspace_size(单 block 字节)= 256 恒定；grid 从 (4,1,1) 变到 (8,1,1)，</text>
<text x="56" y="510" font-family="sans-serif" font-size="12" fill="#1e3a5f">totalWorkSpaceSize 随之从 1024 涨到 2048 字节，比值 2:1 = grid 之比——每次 _launch(driver.py:L770-774)现算现开、不预留。</text>
</svg>