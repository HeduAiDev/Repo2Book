<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1090 496">
<rect width="1090" height="496" fill="white"/>
<text x="40" y="34" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1e40af">enable_taskqueue 决定发射收尾：异步入队 vs 同步阻塞</text>
<text x="40" y="56" font-family="sans-serif" font-size="12" fill="#64748b">driver.py:L512-513 —— TRITON_ENABLE_TASKQUEUE 默认 'true'</text>
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker></defs>
<text x="270" y="78" text-anchor="middle" font-family="sans-serif" font-size="14.5" font-weight="bold" fill="#0f172a">enable_taskqueue = False（同步）</text>
<rect x="60" y="116" width="420" height="66" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
<text x="270" y="138" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">发射逻辑直接内联执行</text>
<text x="270" y="158" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#0f172a">（不包 lambda）</text>
<line x1="270" y1="182" x2="270" y2="200" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="60" y="204" width="420" height="66" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="270" y="226" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">rtStreamSynchronize(stream)</text>
<text x="270" y="246" text-anchor="middle" font-family="monospace" font-size="11" fill="#0f172a">driver.py:L839</text>
<line x1="270" y1="270" x2="270" y2="288" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="60" y="292" width="420" height="46" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
<text x="270" y="314" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">host 阻塞：等 kernel 跑完才返回</text>
<text x="820" y="78" text-anchor="middle" font-family="sans-serif" font-size="14.5" font-weight="bold" fill="#0f172a">enable_taskqueue = True（默认，异步）</text>
<rect x="610" y="116" width="420" height="86" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="820" y="138" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">整段发射逻辑包成 lambda：</text>
<text x="820" y="158" text-anchor="middle" font-family="monospace" font-size="11" fill="#0f172a">auto launch_call = [=]() -&gt; rtError_t</text>
<text x="820" y="178" text-anchor="middle" font-family="monospace" font-size="11" fill="#0f172a">driver.py:L777</text>
<line x1="820" y1="202" x2="820" y2="220" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="610" y="224" width="420" height="66" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="820" y="246" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">async_launch(launch_call) 入队</text>
<text x="820" y="266" text-anchor="middle" font-family="monospace" font-size="11" fill="#0f172a">driver.py:L841</text>
<line x1="820" y1="290" x2="820" y2="308" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="610" y="312" width="420" height="46" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
<text x="820" y="334" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">host 不阻塞：立即返回，不等 kernel</text>
<line x1="515" y1="237" x2="575" y2="237" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,4"/>
<text x="545" y="227" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">默认值切换</text>
<rect x="40" y="388" width="1010" height="68" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
<text x="56" y="410" font-family="sans-serif" font-size="12" fill="#1e3a5f">torch_npu 后端的 async_launch 实现为 OpCommand.SetCustomHandler(func).Run()（backend_register.py:L335-336）；</text>
<text x="56" y="434" font-family="sans-serif" font-size="12" fill="#1e3a5f">两种收尾方式共享同一段发射逻辑（rtKernelLaunch 等），仅是否包 lambda 异步入队不同——这是昇腾相对基座 CUDA launcher 多出的第二样。</text>
</svg>