<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 653.2">
<rect width="1000" height="653.2" fill="white"/>
<text x="500.0" y="34" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">同一份 16×8 数据,掉进兜底的代价:柱高 = 实际搬运次数(线性,1:16:128)</text>
<text x="500.0" y="56" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#475569">结构化 O(1) 元数据描述 → 标量化 O(∏unstructured 维 size)逐元素/逐行访存</text>
<line x1="50" y1="411.3" x2="950" y2="411.3" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
<text x="44" y="415.3" text-anchor="end" font-family="sans-serif" font-size="11" fill="#94a3b8">1</text>
<line x1="50" y1="382.8" x2="950" y2="382.8" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
<text x="44" y="386.8" text-anchor="end" font-family="sans-serif" font-size="11" fill="#94a3b8">16</text>
<line x1="50" y1="170.0" x2="950" y2="170.0" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
<text x="44" y="174.0" text-anchor="end" font-family="sans-serif" font-size="11" fill="#94a3b8">128</text>
<rect x="60" y="411.3" width="220" height="11.9" rx="6" fill="#16a34a"/>
<text x="170.0" y="397.3" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#166534">1 次搬运</text>
<text x="170.0" y="449.2" text-anchor="middle" font-family="sans-serif" font-size="13.5" fill="#0f172a">结构化基线</text>
<text x="170.0" y="471.2" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">整块 16×8 memref 一次连续搬运</text>
<rect x="390" y="382.8" width="220" height="40.4" rx="6" fill="#d97706"/>
<text x="500.0" y="368.8" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#92400e">16 次搬运</text>
<text x="500.0" y="449.2" text-anchor="middle" font-family="sans-serif" font-size="13.5" fill="#0f172a">部分标量化</text>
<text x="500.0" y="471.2" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">dim0 循环 16 次,每次 1×8 连续 f32</text>
<rect x="720" y="170.0" width="220" height="253.2" rx="6" fill="#dc2626"/>
<text x="830.0" y="156.0" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#7f1d1d">128 次搬运</text>
<text x="830.0" y="449.2" text-anchor="middle" font-family="sans-serif" font-size="13.5" fill="#0f172a">完全标量化</text>
<text x="830.0" y="471.2" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">单维(128)全离散,每次 1 个 i32 单元素</text>
<line x1="50" y1="423.2" x2="950" y2="423.2" stroke="#334155" stroke-width="1.5"/>
<rect x="60" y="513.2" width="880" height="70" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="500.0" y="539.2" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1e3a8a">对齐闸(UnstructureConversionPass.cpp:L334-342,常量 32 在 L341):尾部连续字节 % 32</text>
<text x="500.0" y="561.2" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#1e40af">8×f32=32 字节,32%32=0 → 保向量(16 次);1 个元素 4 字节,4%32≠0 → 强制标量化(128 次)</text>
<text x="500.0" y="617.2" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">离散维每多一个,代价单调乘增:一个 tl.load 当索引,就把 O(1) 变成两个数量级的 O(N)</text>
</svg>