<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 424">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker></defs>
<rect width="1190" height="424" fill="white"/>
<text x="595.0" y="38" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">四态全序链:unstructured ⊑ structured ⊑ scalarlike ⊑ scalar</text>
<text x="595.0" y="62" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#475569">每个张量每一维取其一;偏序值按 enum 声明序 0&lt;1&lt;2&lt;3,combineInfo 的 std::min 依赖此序</text>
<rect x="50" y="118" width="220" height="92" rx="12" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
<text x="160.0" y="148" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#0f172a">unstructured</text>
<text x="160.0" y="170" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">枚举值 = 0</text>
<text x="160.0" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">偏移不可仿射描述</text>
<rect x="340" y="118" width="220" height="92" rx="12" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
<text x="450.0" y="148" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#0f172a">structured</text>
<text x="450.0" y="170" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">枚举值 = 1</text>
<text x="450.0" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">(offset,size,stride) 网格</text>
<rect x="630" y="118" width="220" height="92" rx="12" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
<text x="740.0" y="148" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#0f172a">scalarlike</text>
<text x="740.0" y="170" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">枚举值 = 2</text>
<text x="740.0" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">全维同值(广播源)</text>
<rect x="920" y="118" width="220" height="92" rx="12" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
<text x="1030.0" y="148" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#0f172a">scalar</text>
<text x="1030.0" y="170" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">枚举值 = 3</text>
<text x="1030.0" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">size==1 的特例</text>
<line x1="270" y1="164.0" x2="340" y2="164.0" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<text x="305.0" y="154.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#334155">⊑</text>
<text x="305.0" y="186.0" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#94a3b8">更结构化</text>
<line x1="560" y1="164.0" x2="630" y2="164.0" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<text x="595.0" y="154.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#334155">⊑</text>
<text x="595.0" y="186.0" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#94a3b8">更结构化</text>
<line x1="850" y1="164.0" x2="920" y2="164.0" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<text x="885.0" y="154.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#334155">⊑</text>
<text x="885.0" y="186.0" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#94a3b8">更结构化</text>
<rect x="30" y="254" width="260" height="44" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6,3"/>
<text x="160.0" y="281" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#991b1b">false → 建 scf.for,逐元素循环该维</text>
<rect x="320" y="254" width="260" height="44" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6,3"/>
<text x="450.0" y="281" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#166534">isStructured(dim)=true → 不建循环</text>
<rect x="610" y="254" width="260" height="66" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5" stroke-dasharray="3,3"/>
<text x="740.0" y="276" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#854d0e">isStructured(dim) ≠ 本维 scalarlike</text>
<text x="740.0" y="296" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#854d0e">取决于整张量 scalarLike 标志,</text>
<text x="740.0" y="312" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#854d0e">与本维取值无关,见 §14.5</text>
<rect x="900" y="254" width="260" height="44" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6,3"/>
<text x="1030.0" y="281" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#166534">isStructured(dim)=true → 不建循环</text>
<line x1="160.0" y1="210" x2="160.0" y2="254" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="450.0" y1="210" x2="450.0" y2="254" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="740.0" y1="210" x2="740.0" y2="254" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="1030.0" y1="210" x2="1030.0" y2="254" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
<text x="595.0" y="360" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">概念范畴:ScalarLike ⊆ Structured;Unstructured = Structured 的补;scalar 是 size==1 的 scalarlike 特例</text>
<text x="595.0" y="384" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b45309">PtrOffsetInfo::isStructured(dim) = this-&gt;scalarLike || structured[dim]∈{structured,scalar}——见 §14.5/§14.8</text>
</svg>