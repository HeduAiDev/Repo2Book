<rect x="420" y="140" width="14" height="14" rx="3" fill="#3b82f6"/>
<text x="442" y="152" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">行掩码 A</text>
<text x="442" y="170" font-family="monospace" font-size="11" fill="#334155">offsets=[0,0] dims=[10,16]</text>
<rect x="420" y="186" width="14" height="14" rx="3" fill="#f97316"/>
<text x="442" y="198" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">列掩码 B</text>
<text x="442" y="216" font-family="monospace" font-size="11" fill="#334155">offsets=[0,0] dims=[16,12]</text>
<rect x="420" y="232" width="14" height="14" rx="3" fill="#16a34a"/>
<text x="442" y="244" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">交集 A∩B</text>
<text x="442" y="262" font-family="monospace" font-size="11" fill="#334155">offsets=[0,0] dims=[10,12]</text>
<text x="420" y="288" font-family="sans-serif" font-size="12" fill="#0f172a">有效元素 10×12=120 / 256</text>
<text x="350.0" y="570" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">AND = 矩形交,一个 extract_slice 装得下;OR 的并集是 L 形,parseOr 不存在。</text>
</svg>