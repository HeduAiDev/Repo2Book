<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 588">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker></defs>
<rect width="700" height="588" fill="white"/>
<text x="350.0" y="38" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#0f172a" font-weight="bold">parse 递归下降:cmpi 向两个操作数各要一份 MaskState</text>
<rect x="220.0" y="90" width="260" height="56" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="350.0" y="112" text-anchor="middle" font-family="monospace" font-size="12" fill="#1e1b4b">%m = cmpi slt %r, %c</text>
<text x="350.0" y="130" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4338ca">TypeSwitch → parseCmp (L113-L114)</text>
<rect x="60" y="256" width="260" height="56" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="190.0" y="276" text-anchor="middle" font-family="monospace" font-size="12" fill="#064e3b">%r = make_range(0,16)</text>
<text x="190.0" y="293" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#047857">parseMakeRange</text>
<text x="190.0" y="308" text-anchor="middle" font-family="monospace" font-size="11" fill="#065f46">start=0,end=16,dims=[16]</text>
<rect x="380" y="256" width="260" height="56" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="510.0" y="276" text-anchor="middle" font-family="monospace" font-size="12" fill="#78350f">%c = constant dense&lt;10&gt;</text>
<text x="510.0" y="293" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#b45309">parseConstant</text>
<text x="510.0" y="308" text-anchor="middle" font-family="monospace" font-size="11" fill="#92400e">scalar=10</text>
<rect x="220.0" y="422" width="260" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="350.0" y="444" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1e3a8a">parseCmp 熔合 slt, bound=10</text>
<text x="350.0" y="463" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#1e40af">offsets=[0],dims=[10]</text>
<path d="M285.0,146 C245.0,201.0 220.0,201.0 190.0,256" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
<text x="177.5" y="201.0" font-family="sans-serif" font-size="11" fill="#334155">parse(lhs)</text>
<path d="M415.0,146 C455.0,201.0 480.0,201.0 510.0,256" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
<text x="472.5" y="201.0" font-family="sans-serif" font-size="11" fill="#334155">parse(rhs)</text>
<path d="M190.0,312 C160.0,367.0 255.0,367.0 285.0,422" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M510.0,312 C540.0,367.0 445.0,367.0 415.0,422" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
<text x="350.0" y="371.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">两侧递归返回后回填(真实数据流,非独立汇聚)</text>
<text x="350.0" y="548" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">TypeSwitch 覆盖 11 个可解析 op(L106-L129):</text>
<text x="350.0" y="566" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">ConstantOp/AddIOp/AndIOp/CmpIOp/MakeRangeOp/BroadcastOp/SplatOp/ExpandDimsOp/ExtSIOp/DivSIOp/SelectOp</text>
</svg>