<text x="854" y="270.0" text-anchor="end" font-family="sans-serif" font-size="12" font-weight="bold" fill="#94a3b8">—</text>
<text x="755.0" y="302" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#16a34a">isMask() = true</text>
<text x="755.0" y="322" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">parseCmp 熔合后</text>
<text x="465.0" y="405" text-anchor="middle" font-family="monospace" font-size="12" fill="#0f172a">isMask() ⇔ !start &amp;&amp; !end &amp;&amp; !scalar &amp;&amp; dims!=0 &amp;&amp; offsets!=0</text>
<text x="465.0" y="429" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">只有矩形态满足 isMask()——它是唯一能发射切片的合法终态,标量与 range 都是解析中间态。</text>
