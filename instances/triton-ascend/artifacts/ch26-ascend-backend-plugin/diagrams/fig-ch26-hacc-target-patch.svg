<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1006">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker></defs>
<rect width="760" height="1006" fill="white"/>
<text x="40" y="34" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1e40af">hacc.target 注入：幂等 monkey-patch 包住 ASTSource.make_ir</text>
<text x="40" y="56" font-family="sans-serif" font-size="12" fill="#64748b">third_party/ascend/backend/__init__.py:L27-52 —— 不是 add_stages 里的一段 stage</text>
<text x="40" y="82" font-family="sans-serif" font-size="13" font-weight="bold" fill="#334155">① 每次 get_codegen_implementation() 都会走到的守卫</text>
<rect x="40" y="92" width="680" height="64" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="380" y="129" text-anchor="middle" font-family="monospace" font-size="12.5" font-weight="bold" fill="#1e3a5f">get_codegen_implementation() → _apply_ascend_patch()</text>
<line x1="380" y1="156" x2="380" y2="182" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="40" y="182" width="680" height="60" rx="14" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="380" y="217" text-anchor="middle" font-family="monospace" font-size="12.5" font-weight="bold" fill="#78350f">ASTSource._ascend_patch_applied ？</text>
<line x1="380" y1="242" x2="380" y2="264" stroke="#334155" stroke-width="2"/>
<line x1="200" y1="264" x2="560" y2="264" stroke="#334155" stroke-width="2"/>
<line x1="200" y1="264" x2="200" y2="290" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<line x1="560" y1="264" x2="560" y2="290" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<text x="200" y="256" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155">False(首次调用)</text>
<text x="560" y="256" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155">True(第 2+ 次调用)</text>
<rect x="40" y="290" width="320" height="104" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="200" y="327" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#14532d">替换 ASTSource.make_ir</text>
<text x="200" y="347" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#14532d">= _patched_make_ir</text>
<text x="200" y="367" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#14532d">置 _ascend_patch_applied = True</text>
<rect x="400" y="290" width="320" height="84" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="560" y="327" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">no-op —— 函数体整体跳过</text>
<text x="560" y="347" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">不再二次包裹</text>
<rect x="40" y="408" width="680" height="34" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
<text x="380" y="430" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#1e3a5f">N 次调用 ⇒ 恰 1 次实际 patch（幂等，绝不嵌套）</text>
<text x="40" y="488" font-family="sans-serif" font-size="13" font-weight="bold" fill="#334155">② 每次编译经过 _patched_make_ir 时的独立判定</text>
<rect x="40" y="498" width="680" height="64" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
<text x="380" y="535" text-anchor="middle" font-family="monospace" font-size="12.5" font-weight="bold" fill="#3730a3">module = 原 make_ir(...)  —— 先生成 Triton IR module</text>
<line x1="380" y1="562" x2="380" y2="588" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="40" y="588" width="680" height="56" rx="14" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="380" y="621" text-anchor="middle" font-family="monospace" font-size="12.5" font-weight="bold" fill="#78350f">hasattr(options, "arch") and options.arch ？</text>
<line x1="380" y1="644" x2="380" y2="666" stroke="#334155" stroke-width="2"/>
<line x1="200" y1="666" x2="560" y2="666" stroke="#334155" stroke-width="2"/>
<line x1="200" y1="666" x2="200" y2="692" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<line x1="560" y1="666" x2="560" y2="692" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<text x="200" y="658" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155">True(arch 非空，如 Ascend910B)</text>
<text x="560" y="658" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155">False(arch 为空)</text>
<rect x="40" y="692" width="320" height="104" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="200" y="729" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#14532d">builder = ascendnpu_ir_builder(...)</text>
<text x="200" y="749" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#14532d">module.set_attr("hacc.target",</text>
<text x="200" y="769" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#14532d">  builder.parse_attr('#hacc.target&lt;"arch"&gt;'))</text>
<rect x="400" y="692" width="320" height="84" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="560" y="729" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#7f1d1d">跳过注入</text>
<text x="560" y="749" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#7f1d1d">（module 上无 hacc.target 属性）</text>
<rect x="40" y="810" width="680" height="34" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1"/>
<text x="380" y="832" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#3730a3">注入的属性：#hacc.target&lt;"Ascend910B"&gt;  ｜  arch 空时注入次数 = 0</text>
<rect x="40" y="878" width="680" height="88" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
<text x="56" y="900" font-family="sans-serif" font-size="12" fill="#1e3a5f">两条判定相互独立：①决定 make_ir 是否被替换成 _patched_make_ir(跨调用只发生一次)；</text>
<text x="56" y="922" font-family="sans-serif" font-size="12" fill="#1e3a5f">②决定被替换后的 make_ir 每次执行时是否真的贴上 hacc.target(取决于当次 options.arch)。</text>
<text x="56" y="944" font-family="sans-serif" font-size="12" fill="#1e3a5f">注入失败仅降级为 logging.warning，不阻断编译(__init__.py:L46-47)。</text>
</svg>