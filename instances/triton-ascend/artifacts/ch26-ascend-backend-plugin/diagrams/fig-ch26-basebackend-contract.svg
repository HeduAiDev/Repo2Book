<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 520">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker></defs>
<rect width="850" height="520" fill="white"/>
<text x="40" y="40" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1e40af">BaseBackend 契约面：6 个抽象方法，AscendBackend 逐一落地</text>
<text x="40" y="62" font-family="sans-serif" font-size="12.5" fill="#64748b">python/triton/backends/compiler.py:L226-290 —— Triton 编译驱动只认这 6 个签名，不认识具体硬件</text>
<rect x="40" y="128" width="204" height="30" rx="4" fill="#334155" stroke="#1e293b" stroke-width="1"/>
<text x="142.0" y="148.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="white" font-weight="bold">@abstractmethod × 6</text>
<rect x="250" y="128" width="554" height="30" rx="4" fill="#1d4ed8" stroke="#1e3a8a" stroke-width="1"/>
<text x="527.0" y="148.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="white" font-weight="bold">AscendBackend 落地</text>
<rect x="40" y="164" width="770" height="40" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="54" y="188.0" font-family="monospace" font-size="12.5" font-weight="bold" fill="#0f172a">supports_target</text>
<text x="264" y="188.0" font-family="monospace" font-size="11.5" fill="#1e293b">target.backend == "npu"</text>
<rect x="40" y="204" width="770" height="40" fill="white" stroke="#e2e8f0" stroke-width="1"/>
<text x="54" y="228.0" font-family="monospace" font-size="12.5" font-weight="bold" fill="#0f172a">hash</text>
<text x="264" y="228.0" font-family="monospace" font-size="11.5" fill="#1e293b">str(self.target)  —— GPUTarget 的 repr</text>
<rect x="40" y="244" width="770" height="40" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="54" y="268.0" font-family="monospace" font-size="12.5" font-weight="bold" fill="#0f172a">parse_options</text>
<text x="264" y="268.0" font-family="monospace" font-size="11.5" fill="#1e293b">kwargs 过滤成 NPUOptions.__dataclass_fields__ → NPUOptions(**args)</text>
<rect x="40" y="284" width="770" height="40" fill="white" stroke="#e2e8f0" stroke-width="1"/>
<text x="54" y="308.0" font-family="monospace" font-size="12.5" font-weight="bold" fill="#0f172a">add_stages</text>
<text x="264" y="308.0" font-family="monospace" font-size="11.5" fill="#1e293b">注册 ttir → ttadapter(linalg) → npubin 下降管线</text>
<rect x="40" y="324" width="770" height="40" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="54" y="348.0" font-family="monospace" font-size="12.5" font-weight="bold" fill="#0f172a">load_dialects</text>
<text x="264" y="348.0" font-family="monospace" font-size="11.5" fill="#1e293b">ascend.load_dialects(ctx)</text>
<rect x="40" y="364" width="770" height="40" fill="white" stroke="#e2e8f0" stroke-width="1"/>
<text x="54" y="388.0" font-family="monospace" font-size="12.5" font-weight="bold" fill="#0f172a">get_module_map</text>
<text x="264" y="388.0" font-family="monospace" font-size="11.5" fill="#1e293b">return {}  —— 无接口→设备实现映射需要覆写</text>
<text x="40" y="430" font-family="sans-serif" font-size="11.5" fill="#64748b">同一份 6 方法契约，nvidia/amd 也各自实现一份——Triton 编译总控代码不因新增后端而改动。</text>
<text x="40" y="448" font-family="sans-serif" font-size="11.5" fill="#64748b">BaseBackend 另有 2 个可覆写钩子（get_attrs_descriptor / compute_spec_key），本图只列必填契约。</text>
</svg>