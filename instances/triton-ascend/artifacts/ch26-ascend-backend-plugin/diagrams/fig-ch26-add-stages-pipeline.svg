<text x="830" y="331" text-anchor="middle" font-family="monospace" font-size="12.5" fill="#14532d">stages["ttadapter"] = lambda src, metadata:</text>
<text x="830" y="351" text-anchor="middle" font-family="monospace" font-size="12.5" fill="#14532d">    ttir_to_linalg(src, metadata, options, named_ops=True)</text>
