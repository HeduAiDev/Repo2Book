<rect x="40" y="404" width="420" height="64" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="250" y="441" text-anchor="middle" font-family="monospace" font-size="12.5" font-weight="bold" fill="#7f1d1d">return  —— 跳过 ttadapter</text>
