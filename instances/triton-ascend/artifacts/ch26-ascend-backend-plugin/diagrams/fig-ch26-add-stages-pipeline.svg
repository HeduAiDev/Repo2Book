<text x="250" y="331" text-anchor="middle" font-family="monospace" font-size="12.5" fill="#7f1d1d">stages["npubin"] = lambda src, metadata:</text>
<text x="250" y="351" text-anchor="middle" font-family="monospace" font-size="12.5" fill="#7f1d1d">    ttir_to_npubin(src, metadata, options)</text>
