<text x="675" y="585" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#312e81">compile_910_95</text>
<rect x="840" y="508" width="290" height="104" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5"/>
<text x="985" y="545" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#312e81">stages["npubin"] =</text>
<text x="985" y="565" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#312e81">linalg_to_bin_enable_npu_</text>
<text x="985" y="585" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#312e81">compile_A2_A3</text>
<rect x="520" y="626" width="620" height="34" rx="8" fill="#bbf7d0" stroke="#15803d" stroke-width="1"/>
<text x="830" y="648" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#14532d">共 3 段 stage：ttir → ttadapter → npubin</text>
<rect x="40" y="694" width="1100" height="66" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
<text x="56" y="716" font-family="sans-serif" font-size="12" fill="#1e3a5f">昇腾没有 ttgir(TritonGPU IR) 这一段——常规路径把 Triton IR 经 triton_adapter 直接下降到 linalg(ttadapter)，</text>
<text x="56" y="738" font-family="sans-serif" font-size="12" fill="#1e3a5f">再交 bishengir 编译成 NPU 二进制；末段 npubin 返回 bytes，其余 stage 返回 str(IR 文本)。</text>
</svg>