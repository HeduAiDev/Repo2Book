<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 978">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker></defs>
<rect width="710" height="978" fill="white"/>
<text x="40" y="34" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1e40af">_discover_backends：跳过 nvidia/amd，其余目录各取唯一 concrete 子类</text>
<text x="40" y="56" font-family="sans-serif" font-size="12" fill="#64748b">python/triton/backends/__init__.py —— ascend 目录放对 compiler.py/driver.py 即被自动装配，无需注册表</text>
<rect x="45" y="96" width="620" height="74" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
<text x="355" y="138" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0c4a6e">os.listdir(triton/backends/)  —— 逐个子目录 name</text>
<line x1="355" y1="170" x2="355" y2="198" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="45" y="198" width="620" height="78" rx="14" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="355" y="230" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#78350f">name ∈ ignored_dirs = {"nvidia", "amd"}？</text>
<text x="355" y="252" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#78350f">（本包不发行其加载文件，__init__.py:L40-41）</text>
<line x1="355" y1="276" x2="355" y2="294" stroke="#334155" stroke-width="2"/>
<line x1="190" y1="294" x2="520" y2="294" stroke="#334155" stroke-width="2"/>
<line x1="190" y1="294" x2="190" y2="332" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<line x1="520" y1="294" x2="520" y2="332" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<text x="190" y="286" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155">是（2 个目录：nvidia、amd）</text>
<rect x="40" y="332" width="300" height="92" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="190" y="372" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b91c1c">continue —— 跳过</text>
<text x="190" y="390" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b91c1c">该目录不参与装配</text>
<text x="520" y="286" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155">否（如 ascend）</text>
<rect x="370" y="332" width="300" height="92" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="520" y="382" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#15803d">继续往下走装配流程</text>
<line x1="520" y1="424" x2="520" y2="458" stroke="#16a34a" stroke-width="2"/>
<line x1="520" y1="458" x2="355" y2="458" stroke="#16a34a" stroke-width="2"/>
<line x1="355" y1="458" x2="355" y2="486" stroke="#16a34a" stroke-width="2" marker-end="url(#a)"/>
<rect x="45" y="486" width="620" height="96" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="355" y="528" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1e3a5f">_load_module(name, backends/ascend/compiler.py)</text>
<text x="355" y="550" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1e3a5f">_load_module(name, backends/ascend/driver.py)</text>
<line x1="355" y1="582" x2="355" y2="610" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="45" y="610" width="620" height="118" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
<text x="355" y="652" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3730a3">_find_concrete_subclasses(compiler_mod, BaseBackend)</text>
<text x="355" y="674" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3730a3">_find_concrete_subclasses(driver_mod, DriverBase)</text>
<text x="355" y="696" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3730a3">—— 各自要求恰好 1 个非抽象子类（0 个或 &gt;1 个都 raise）</text>
<line x1="355" y1="728" x2="355" y2="756" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="45" y="756" width="620" height="74" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="355" y="798" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1e3a5f">backends["ascend"] = Backend(compiler=AscendBackend, driver=NPUDriver)</text>
<rect x="40" y="866" width="630" height="72" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
<text x="56" y="892" font-family="sans-serif" font-size="12.5" fill="#1e3a5f">「恰好 1 个非抽象子类」是硬契约（0 个/&gt;1 个都 raise）——新后端只需在 triton/backends/</text>
<text x="56" y="916" font-family="sans-serif" font-size="12.5" fill="#1e3a5f">下新增一个目录、照此结构放两份文件，主库代码零改动即被纳入 backends 表。</text>
</svg>