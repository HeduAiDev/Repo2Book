<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 564">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker></defs>
<rect width="690" height="564" fill="white"/>
<text x="40" y="26" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e40af">达芬奇一个核内:多条异步引擎各跑各的,硬件不检测跨引擎依赖</text>
<text x="40" y="48" font-family="sans-serif" font-size="11.5" fill="#64748b">3 条搬运引擎(MTE1/MTE2/MTE3)+ 4 条计算/定点引擎(M/V/FIX/S)——各自顺序执行、彼此乱序;红色=竞态</text>
