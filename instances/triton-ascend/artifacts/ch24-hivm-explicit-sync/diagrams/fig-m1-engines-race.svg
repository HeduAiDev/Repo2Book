<text x="330.0" y="174.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#0f172a">load 写 buffer X</text>
<rect x="40" y="204" width="120" height="40" rx="6" fill="#e0f2fe" stroke="#0369a1"/>
<text x="100.0" y="229.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0369a1">MTE3</text>
