<text x="210.0" y="444.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#0f172a">标量运算</text>
<rect x="358" y="188" width="44" height="126" fill="#fee2e2" fill-opacity="0.55" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3"/>
<line x1="380.0" y1="190" x2="380.0" y2="312" stroke="#dc2626" stroke-width="2" marker-end="url(#a)"/>
<text x="415.0" y="372" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#b91c1c">V 在 MTE2 写完前就开读——读到未写完的 X</text>
<rect x="40" y="492" width="16" height="16" fill="#dbeafe" stroke="#3b82f6"/>
<text x="62" y="505" font-family="sans-serif" font-size="11" fill="#334155">正常指令块(无同步下靠运气不撞车)</text>
<rect x="320" y="492" width="16" height="16" fill="#fecaca" stroke="#b91c1c"/>
<text x="342" y="505" font-family="sans-serif" font-size="11" fill="#334155">跨引擎读写同一 buffer,无同步则可能撞车</text>
<text x="40" y="534" font-family="sans-serif" font-size="11" fill="#0f172a">共 3 条搬运引擎(MTE1/MTE2/MTE3)+ 4 条计算/定点引擎(M/V/FIX/S);每对引擎间同步信号位上限 8 个(kTotalEventIdNum)</text>
