<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 590">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker></defs>
<rect width="1010" height="590" fill="white"/>
<text x="50" y="26" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e40af">跨引擎握手 set_flag/wait_flag vs 同引擎屏障 pipe_barrier</text>
<text x="50" y="48" font-family="sans-serif" font-size="11.5" fill="#64748b">取自 inject-sync.mlir @test_mem_injcet_sync_basic:两条泳道共享 EVENT_ID0 建立 write ≺ read</text>
<text x="50" y="144" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">① 异引擎:一对 set_flag / wait_flag(共享 EVENT_ID0)</text>
<rect x="50.0" y="156" width="190" height="26" rx="6" fill="#e2e8f0" stroke="#334155"/>
<text x="145" y="174" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">MTE2(生产者)</text>
<line x1="145" y1="184" x2="145" y2="414" stroke="#94a3b8" stroke-dasharray="4,4"/>
<rect x="310.0" y="156" width="190" height="26" rx="6" fill="#e2e8f0" stroke="#334155"/>
<text x="405" y="174" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">V(消费者)</text>
<line x1="405" y1="184" x2="405" y2="414" stroke="#94a3b8" stroke-dasharray="4,4"/>
<circle cx="145" cy="214" r="4" fill="#334155"/>
<text x="159" y="218" font-family="sans-serif" font-size="11.5" fill="#334155">load 写 %0</text>
<line x1="145" y1="268" x2="405" y2="268" stroke="#dc2626" stroke-width="2" marker-end="url(#a)"/>
<text x="275.0" y="260" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#dc2626">set_flag[&lt;PIPE_MTE2&gt;,&lt;PIPE_V&gt;,&lt;EVENT_ID0&gt;]</text>
<circle cx="405" cy="322" r="4" fill="#dc2626"/>
<text x="419" y="326" font-family="sans-serif" font-size="11.5" fill="#dc2626">wait_flag[&lt;PIPE_MTE2&gt;,&lt;PIPE_V&gt;,&lt;EVENT_ID0&gt;]</text>
<circle cx="405" cy="376" r="4" fill="#334155"/>
<text x="419" y="380" font-family="sans-serif" font-size="11.5" fill="#334155">vadd 读 %0</text>
<line x1="145" y1="436" x2="145" y2="454" stroke="#334155" stroke-width="1" stroke-dasharray="2,2"/>
<text x="275.0" y="452" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#0f172a" font-style="italic">写%0 ≺ 读%0(happens-before)</text>
<text x="610" y="144" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">② 同引擎:1 个 pipe_barrier</text>
<rect x="645.0" y="156" width="190" height="26" rx="6" fill="#e2e8f0" stroke="#334155"/>
<text x="740.0" y="174" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">MTE2(同一引擎)</text>
<line x1="740.0" y1="184" x2="740.0" y2="352" stroke="#94a3b8" stroke-dasharray="4,4"/>
<circle cx="740.0" cy="214" r="4" fill="#334155"/>
<text x="754.0" y="218" font-family="sans-serif" font-size="11.5" fill="#334155">load</text>
<circle cx="740.0" cy="268" r="4" fill="#d97706"/>
<text x="754.0" y="272" font-family="sans-serif" font-size="11.5" fill="#d97706">pipe_barrier[&lt;PIPE_MTE2&gt;]</text>
<circle cx="740.0" cy="322" r="4" fill="#334155"/>
<text x="754.0" y="326" font-family="sans-serif" font-size="11.5" fill="#334155">load(下一批)</text>
<text x="50" y="544" font-family="sans-serif" font-size="11" fill="#0f172a">set_flag/wait_flag 各 3 个参数(set_pipe, wait_pipe, event_id);pipe_barrier 只 1 个参数(pipe)</text>
<text x="50" y="564" font-family="sans-serif" font-size="11" fill="#0f172a">基本例握手用 EVENT_ID0(编号 0)——HIVMSynchronizationOps.td:L45-L48/L74</text>
