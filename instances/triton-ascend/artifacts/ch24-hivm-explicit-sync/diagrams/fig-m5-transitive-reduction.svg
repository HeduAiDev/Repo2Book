<text x="177.0" y="329.0" text-anchor="end" font-family="sans-serif" font-size="10.5" fill="#64748b">被传递覆盖,0 对直连 flag</text>
<line x1="820.0" y1="186" x2="820.0" y2="290" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
