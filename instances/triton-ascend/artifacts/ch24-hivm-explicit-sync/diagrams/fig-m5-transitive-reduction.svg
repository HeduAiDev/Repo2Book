<text x="350.0" y="159.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">load(MTE2)</text>
<text x="350.0" y="175.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">写 %0</text>
