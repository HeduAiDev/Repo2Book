<text x="350.0" y="309.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">vadd(V)</text>
<text x="350.0" y="325.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">读/写 %0</text>
<rect x="255.0" y="440" width="190" height="46" rx="8" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
<text x="350.0" y="459.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">store(MTE3)</text>
<text x="350.0" y="475.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">读 %0</text>
<text x="820.0" y="100" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">条件例:vadd 落入 scf.if</text>
<text x="820.0" y="120" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#b45309">分支不取时 vadd 可能不执行</text>
<rect x="725.0" y="140" width="190" height="46" rx="8" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
