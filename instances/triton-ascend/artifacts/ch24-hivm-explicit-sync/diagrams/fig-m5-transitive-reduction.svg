<rect width="1170" height="616" fill="white"/>
<text x="180" y="26" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e40af">已插同步集是依赖 DAG 的传递归约:可达即冗余,断路即补插</text>
<text x="180" y="48" font-family="sans-serif" font-size="11.5" fill="#64748b">对照 inject-sync.mlir @test_mem_injcet_sync_basic(无条件)vs @test_injcet_sync_if(vadd 落入 scf.if)</text>
<text x="350.0" y="100" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">无条件例:vadd 恒执行</text>
