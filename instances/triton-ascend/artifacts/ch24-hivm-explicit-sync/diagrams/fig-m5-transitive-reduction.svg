<text x="834.0" y="388.0" font-family="sans-serif" font-size="10.5" fill="#334155">set/wait[V,MTE3]</text>
<path d="M 725.0 163.0 C 655.0 163.0, 655.0 463.0, 725.0 463.0" fill="none" stroke="#b91c1c" stroke-width="2.2" marker-end="url(#r)"/>
<text x="647.0" y="313.0" text-anchor="end" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#b91c1c">set/wait[MTE2,MTE3]</text>
<text x="647.0" y="329.0" text-anchor="end" font-family="sans-serif" font-size="10.5" fill="#b91c1c">覆盖路径可能断,补 1 对直连</text>
<text x="180" y="576" font-family="sans-serif" font-size="11" fill="#0f172a">左:load→store 直连 flag 对数 = 0(inject-sync.mlir:L4-L29 无 MTE2→MTE3 项)</text>
<text x="180" y="594" font-family="sans-serif" font-size="11" fill="#0f172a">右:补插的 MTE2→MTE3 直连 flag 对数 = 1(inject-sync.mlir:L151 set_flag + L160 wait_flag);每对 flag 占 1 个 event id,故此处省下的 event id 消耗 = 1</text>
