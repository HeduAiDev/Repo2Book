<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 958.0 590">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker></defs>
<rect width="958.0" height="590" fill="white"/>
<text x="44" y="44" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1e40af">subprocess.run 是开源可读与闭源黑盒的诚实分界</text>
<rect x="24" y="84" width="300" height="32" rx="6" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
<text x="174" y="105" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#0f172a">开源侧 (compiler.py)</text>
<line x1="174" y1="116" x2="174" y2="544" stroke="#94a3b8" stroke-dasharray="4,4"/>
<rect x="584" y="84" width="300" height="32" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="734" y="105" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#0f172a">闭源二进制 (bishengir-compile)</text>
<line x1="734" y1="116" x2="734" y2="544" stroke="#94a3b8" stroke-dasharray="4,4"/>
<line x1="174" y1="230" x2="734" y2="230" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<text x="454.0" y="206" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#334155">subprocess.run(cmd_list, env,</text>
<text x="454.0" y="220" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#334155">stdout=PIPE, stderr=PIPE, check=True)</text>
<line x1="734" y1="360" x2="174" y2="360" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<text x="454.0" y="336" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#334155">退出码 + stdout/stderr</text>
<text x="454.0" y="350" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#334155">+ kernel.o / libkernel.so 落盘</text>
<rect x="554.0" y="254" width="360" height="74" rx="8" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
<text x="734" y="284" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#fbbf24">闭源内部（本书不猜、无源码可读）：</text>
<text x="734" y="306" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="normal" fill="#fbbf24">Linalg → HFusion → HIVM → NPU 二进制</text>
<rect x="44" y="480" width="870.0" height="66" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
<text x="60" y="506" font-family="monospace" font-size="11.5" fill="#1e3a8a">cmd_list = [编译器, ttadapter_path] + 选项 + ['-o', bin_file]（compiler.py:L448-L452）</text>
<text x="60" y="528" font-family="sans-serif" font-size="12" fill="#1e3a8a">subprocess.run 调用点（compiler.py:L465-L471）——本章读到这里为止</text>
