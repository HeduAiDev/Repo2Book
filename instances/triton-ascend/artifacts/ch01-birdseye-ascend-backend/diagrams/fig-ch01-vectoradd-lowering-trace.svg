<rect x="40" y="284" width="1360" height="86" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.3"/>
<text x="56" y="308" font-family="sans-serif" font-size="12" fill="#166534">add_kernel 核体逐字不变（tl.program_id/tl.arange/tl.load/tl.store 一个不少）；</text>
<text x="56" y="328" font-family="sans-serif" font-size="12" fill="#166534">host 侧唯一改动是张量 device='npu'，编译分叉发生在 supports_target 认领 npu 之后的 add_stages 内部。</text>
<text x="56" y="348" font-family="sans-serif" font-size="12" fill="#166534">对照基座：同一核在 GPU 路走 5 段落到 SIMT 线程；本例走 3 段落到达芬奇 VECTOR 核（非 CUBE，因是 elementwise）。</text>
<text x="40" y="396" font-family="sans-serif" font-size="11.5" fill="#64748b">host 无 NPU/CANN/bishengir-compile，各级 IR dump 标『需真机』，由 illustrator/tester 在真机或容器补抓。</text>
