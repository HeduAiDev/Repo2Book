<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 794 610">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker></defs>
<rect width="794" height="610" fill="white"/>
<text x="397.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">目标硬件：达芬奇 AI Core——双核异构 + 显式片上内存层级</text>
<text x="397.0" y="54" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#78716c">TCoreType 只编码 CUBE/VECTOR 两类核，另有 2 个组合值 CUBE_OR_VECTOR / CUBE_AND_VECTOR（ascend_ir.cc:L421-L422）</text>
<text x="397.0" y="76" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#3730a3">片上内存层级：AddressSpace 5 个枚举值（ascend_ir.cc:L413-L417）</text>
<rect x="107.0" y="130" width="260" height="90" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.2"/>
<text x="237.0" y="160" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#5b21b6">Cube 核（矩阵）</text>
<text x="237.0" y="182" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#5b21b6">TCoreType.CUBE</text>
<text x="237.0" y="202" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7c3aed">ascend_ir.cc:L421</text>
<rect x="427.0" y="130" width="260" height="90" rx="12" fill="#cffafe" stroke="#0891b2" stroke-width="2.2"/>
<text x="557.0" y="160" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#155e75">Vector 核（向量）</text>
<text x="557.0" y="182" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#155e75">TCoreType.VECTOR</text>
<text x="557.0" y="202" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#0891b2">ascend_ir.cc:L422</text>
<rect x="40.0" y="290" width="130" height="64" rx="8" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.6"/>
<text x="105.0" y="327.0" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#3730a3">L0A</text>
<rect x="186.0" y="290" width="130" height="64" rx="8" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.6"/>
<text x="251.0" y="327.0" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#3730a3">L0B</text>
<rect x="332.0" y="290" width="130" height="64" rx="8" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.6"/>
<text x="397.0" y="327.0" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#3730a3">L0C</text>
<rect x="478.0" y="290" width="130" height="64" rx="8" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.6"/>
<text x="543.0" y="327.0" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#3730a3">UB</text>
<rect x="624.0" y="290" width="130" height="64" rx="8" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.6"/>
<text x="689.0" y="327.0" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#3730a3">L1</text>
<line x1="237.0" y1="224" x2="105.0" y2="286" stroke="#7c3aed" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="237.0" y1="224" x2="251.0" y2="286" stroke="#7c3aed" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="237.0" y1="224" x2="397.0" y2="286" stroke="#7c3aed" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="557.0" y1="224" x2="543.0" y2="286" stroke="#0891b2" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="40.0" y="414" width="714" height="56" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
<text x="397.0" y="447.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#9a3412">GM（Global Memory，片外 DRAM）</text>
<line x1="383.0" y1="414" x2="383.0" y2="358" stroke="#c2410c" stroke-width="2" marker-end="url(#a)"/>
<line x1="411.0" y1="354" x2="411.0" y2="410" stroke="#c2410c" stroke-width="2" marker-end="url(#a)"/>
<line x1="529.0" y1="414" x2="529.0" y2="358" stroke="#c2410c" stroke-width="2" marker-end="url(#a)"/>
<line x1="557.0" y1="354" x2="557.0" y2="410" stroke="#c2410c" stroke-width="2" marker-end="url(#a)"/>
<text x="40" y="528" font-family="sans-serif" font-size="12" fill="#9a3412" font-weight="bold">红色箭头 = 显式搬运（tl.load/tl.store，编译器必须写）</text>
<text x="40" y="546" font-family="sans-serif" font-size="12" fill="#374151">L0A/L0B/L0C/UB/L1 五级与 GM 之间的搬运同样全部显式；图中以 L0C（cube 侧）与 UB（vector 侧，即正文例子）为代表各画一条。</text>
<text x="40" y="564" font-family="sans-serif" font-size="12" fill="#374151">cube : vector = 1 : 2 是达芬奇硬件事实，由 ch02《达芬奇硬件》原理篇量化建立——</text>
<text x="40" y="582" font-family="sans-serif" font-size="12" fill="#374151">不是从上方 TCoreType 枚举推出（枚举只编码类别，不编码数量）。</text>
</svg>