<text x="40" y="318" font-family="sans-serif" font-size="11.5" fill="#0f172a" font-weight="bold">三舱 pattern 合计 = 5（HFusion 3 + HIVM 1 + LLVM 1），相较主链大量结构化 pattern 是极小子集</text>
