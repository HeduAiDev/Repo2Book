<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160.2150000000001 606">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker></defs>
<rect width="1160.2150000000001" height="606" fill="white"/>
<text x="36" y="36" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e40af">TritonAscend 方言：11 个 op 的语义容器（TritonAscendOps.td）</text>
<text x="36" y="58" font-family="sans-serif" font-size="12" fill="#64748b">本章三条逃生舱只消费其中 2 个（ascend.mod → HFusion 舱；ascend.custom → HIVM 舱），其余 9 个在别处被消费</text>
<rect x="36" y="96" width="217.04" height="34" rx="4" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="144.51999999999998" y="117.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">IR 名（ascend.&lt;助记符&gt;）</text>
<rect x="257.03999999999996" y="96" width="234.375" height="34" rx="4" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="374.22749999999996" y="117.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">C++ 类（triton::ascend::）</text>
<rect x="495.41499999999996" y="96" width="364.2800000000002" height="34" rx="4" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="677.5550000000001" y="117.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">承载的 NPU 语义</text>
<rect x="863.6950000000002" y="96" width="256.52" height="34" rx="4" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="991.9550000000002" y="117.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">本章三舱是否消费 / 消费方</text>
<rect x="36" y="138" width="1084.2150000000001" height="30" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="50" y="157.0" font-family="sans-serif" font-size="12" fill="#334155" >ascend.annotation</text>
<text x="271.03999999999996" y="157.0" font-family="sans-serif" font-size="12" fill="#334155" >AnnotationOp</text>
<text x="509.41499999999996" y="157.0" font-family="sans-serif" font-size="12" fill="#334155" >给张量挂 key-value 编译期标注</text>
<text x="877.6950000000002" y="157.0" font-family="sans-serif" font-size="12" fill="#334155" >否（主链 annotation 相关 pass）</text>
<rect x="36" y="172" width="1084.2150000000001" height="30" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="50" y="191.0" font-family="sans-serif" font-size="12" fill="#14532d" font-weight="bold" >ascend.mod</text>
<text x="271.03999999999996" y="191.0" font-family="sans-serif" font-size="12" fill="#14532d" >ModOp</text>
<text x="509.41499999999996" y="191.0" font-family="sans-serif" font-size="12" fill="#14532d" >逐元素取余（%）硬件二元算子</text>
<text x="877.6950000000002" y="191.0" font-family="sans-serif" font-size="12" fill="#14532d" font-weight="bold" >是 → HFusion 舱</text>
<rect x="36" y="206" width="1084.2150000000001" height="30" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="50" y="225.0" font-family="sans-serif" font-size="12" fill="#334155" >ascend.index_put</text>
<text x="271.03999999999996" y="225.0" font-family="sans-serif" font-size="12" fill="#334155" >IndexPutOp</text>
<text x="509.41499999999996" y="225.0" font-family="sans-serif" font-size="12" fill="#334155" >embedding 语义的 scatter 写回 GM</text>
<text x="877.6950000000002" y="225.0" font-family="sans-serif" font-size="12" fill="#334155" >否</text>
<rect x="36" y="240" width="1084.2150000000001" height="30" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="50" y="259.0" font-family="sans-serif" font-size="12" fill="#334155" >ascend.gather_out_to_ub</text>
<text x="271.03999999999996" y="259.0" font-family="sans-serif" font-size="12" fill="#334155" >GatherOutToUbOp</text>
<text x="509.41499999999996" y="259.0" font-family="sans-serif" font-size="12" fill="#334155" >GM→UB 按维 gather（带越界处理）</text>
<text x="877.6950000000002" y="259.0" font-family="sans-serif" font-size="12" fill="#334155" >否</text>
<rect x="36" y="274" width="1084.2150000000001" height="30" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="50" y="293.0" font-family="sans-serif" font-size="12" fill="#334155" >ascend.scatter_ub_to_out</text>
<text x="271.03999999999996" y="293.0" font-family="sans-serif" font-size="12" fill="#334155" >ScatterUbToOutOp</text>
<text x="509.41499999999996" y="293.0" font-family="sans-serif" font-size="12" fill="#334155" >UB→GM 按维 scatter</text>
<text x="877.6950000000002" y="293.0" font-family="sans-serif" font-size="12" fill="#334155" >否</text>
<rect x="36" y="308" width="1084.2150000000001" height="30" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="50" y="327.0" font-family="sans-serif" font-size="12" fill="#334155" >ascend.index_select_simd</text>
<text x="271.03999999999996" y="327.0" font-family="sans-serif" font-size="12" fill="#334155" >IndexSelectSimdOp</text>
<text x="509.41499999999996" y="327.0" font-family="sans-serif" font-size="12" fill="#334155" >GM 按索引 SIMD 选取直落 UB</text>
<text x="877.6950000000002" y="327.0" font-family="sans-serif" font-size="12" fill="#334155" >否</text>
<rect x="36" y="342" width="1084.2150000000001" height="30" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="50" y="361.0" font-family="sans-serif" font-size="12" fill="#334155" >ascend.indirect_load</text>
<text x="271.03999999999996" y="361.0" font-family="sans-serif" font-size="12" fill="#334155" >IndirectLoadOp</text>
<text x="509.41499999999996" y="361.0" font-family="sans-serif" font-size="12" fill="#334155" >编译器内建：逐元素偏移的离散 load（ch19 发射）</text>
<text x="877.6950000000002" y="361.0" font-family="sans-serif" font-size="12" fill="#334155" >否（ch19 离散掩码）</text>
<rect x="36" y="376" width="1084.2150000000001" height="30" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="50" y="395.0" font-family="sans-serif" font-size="12" fill="#334155" >ascend.indirect_store</text>
<text x="271.03999999999996" y="395.0" font-family="sans-serif" font-size="12" fill="#334155" >IndirectStoreOp</text>
<text x="509.41499999999996" y="395.0" font-family="sans-serif" font-size="12" fill="#334155" >编译器内建：逐元素偏移的离散 store（ch19 发射）</text>
<text x="877.6950000000002" y="395.0" font-family="sans-serif" font-size="12" fill="#334155" >否（ch19 离散掩码）</text>
<rect x="36" y="410" width="1084.2150000000001" height="30" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="50" y="429.0" font-family="sans-serif" font-size="12" fill="#14532d" font-weight="bold" >ascend.custom</text>
<text x="271.03999999999996" y="429.0" font-family="sans-serif" font-size="12" fill="#14532d" >CustomOp</text>
<text x="509.41499999999996" y="429.0" font-family="sans-serif" font-size="12" fill="#14532d" >自定义 op 载体（本章承载 sync_block_* 双核同步）</text>
<text x="877.6950000000002" y="429.0" font-family="sans-serif" font-size="12" fill="#14532d" font-weight="bold" >是 → HIVM 舱</text>
<rect x="36" y="444" width="1084.2150000000001" height="30" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="50" y="463.0" font-family="sans-serif" font-size="12" fill="#334155" >ascend.flip</text>
<text x="271.03999999999996" y="463.0" font-family="sans-serif" font-size="12" fill="#334155" >FlipOp</text>
<text x="509.41499999999996" y="463.0" font-family="sans-serif" font-size="12" fill="#334155" >沿维反转张量</text>
<text x="877.6950000000002" y="463.0" font-family="sans-serif" font-size="12" fill="#334155" >否</text>
<rect x="36" y="478" width="1084.2150000000001" height="30" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="50" y="497.0" font-family="sans-serif" font-size="12" fill="#334155" >ascend.sort</text>
<text x="271.03999999999996" y="497.0" font-family="sans-serif" font-size="12" fill="#334155" >SortOp</text>
<text x="509.41499999999996" y="497.0" font-family="sans-serif" font-size="12" fill="#334155" >沿维排序张量</text>
<text x="877.6950000000002" y="497.0" font-family="sans-serif" font-size="12" fill="#334155" >否</text>
<rect x="36" y="523" width="16" height="16" rx="3" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="58" y="536" font-family="sans-serif" font-size="11.5" fill="#334155">绿色 = 本章三条逃生舱消费的 op（2/11）；其余灰白行在别处（主链其它 pass / ch18 / ch19）被消费</text>
<text x="36" y="562" font-family="sans-serif" font-size="11.5" fill="#0f172a" font-weight="bold">方言前缀 = “ascend”（TritonAscendDialect.td:L15 let name）；方言 op 总数 = 11；本章三舱消费的方言 op 数 = 2</text>
</svg>