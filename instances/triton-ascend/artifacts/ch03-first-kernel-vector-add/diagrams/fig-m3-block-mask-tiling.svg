<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 892 420">
<defs>
<marker id="arrow" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker>
<pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#e2e8f0"/><line x1="0" y1="0" x2="0" y2="8" stroke="#94a3b8" stroke-width="3"/></pattern>
</defs>
<rect width="892" height="420" fill="white"/>
<text x="446.0" y="36" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">grid=cdiv(98432, 1024)=97 个 program，只有最后一块被 mask 截断</text>
<text x="44" y="66" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#475569">① 逻辑 program（grid=97）</text>
<rect x="44" y="78" width="140" height="46" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/>
<text x="114.0" y="106.0" text-anchor="middle" font-family="monospace" font-size="13.5" fill="#075985">pid=0</text>
<rect x="210" y="78" width="140" height="46" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/>
<text x="280.0" y="106.0" text-anchor="middle" font-family="monospace" font-size="13.5" fill="#075985">pid=1</text>
<rect x="376" y="78" width="140" height="46" rx="6" fill="white" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5,4"/>
<text x="446.0" y="106.0" text-anchor="middle" font-family="monospace" font-size="13.5" fill="#64748b">⋯ pid=2..94 ⋯</text>
<rect x="542" y="78" width="140" height="46" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/>
<text x="612.0" y="106.0" text-anchor="middle" font-family="monospace" font-size="13.5" fill="#075985">pid=95</text>
<rect x="708" y="78" width="140" height="46" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
<text x="778.0" y="106.0" text-anchor="middle" font-family="monospace" font-size="13.5" fill="#9a3412">pid=96</text>
<text x="44" y="202" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#475569">② 对应内存分块（offsets）</text>
<rect x="44" y="214" width="638" height="56" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="363.0" y="240.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#166534">96 个满块（pid=0..95）</text>
<text x="363.0" y="258.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#166534">96×1024 = 98304 个元素，全部有效</text>
<rect x="708" y="214" width="34" height="56" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
<rect x="742" y="214" width="106" height="56" fill="url(#hatch)" stroke="#94a3b8" stroke-width="2"/>
<line x1="725.0" y1="214" x2="700" y2="200" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="3,3"/>
<text x="700" y="194" text-anchor="end" font-family="sans-serif" font-size="12" font-weight="bold" fill="#166534">128 有效</text>
<text x="778.0" y="290" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155">896 越界（mask 挡）</text>
<text x="778.0" y="308" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#64748b">block 96：offsets 98304..99327</text>
<line x1="363.0" y1="128" x2="363.0" y2="210" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="778.0" y1="128" x2="778.0" y2="210" stroke="#ea580c" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="446.0" y="374" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#475569">size=98432 特意取非 1024 整数倍——最后一个 program(pid=96) 的 offsets 里，</text>
<text x="446.0" y="392" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#475569">只有前 128 个 &lt;98432 有效，其余 896 个越界偏移被 mask=offsets&lt;n_elements 逐个挡掉。</text>
</svg>