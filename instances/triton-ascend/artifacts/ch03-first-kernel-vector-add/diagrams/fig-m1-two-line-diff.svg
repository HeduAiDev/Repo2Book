<text x="455.0" y="448" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#475569">add_kernel 内核体逐字节不变；GPU→NPU 只新增 1 行 import、改 2 处 device 字符串。</text>
<text x="455.0" y="465" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#475569">三级 tiling / 物理核绑定 / compile_hint 都是「跑通之后的优化」——vector-add 里根本没有。</text>
