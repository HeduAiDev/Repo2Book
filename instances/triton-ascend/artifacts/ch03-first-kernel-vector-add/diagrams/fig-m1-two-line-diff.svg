<text x="562" y="366.6" font-family="monospace" font-size="12.5" font-weight="normal" fill="#1e40af">def add_kernel(...):</text>
<text x="562" y="383.6" font-family="monospace" font-size="12.5" font-weight="normal" fill="#1e40af">    pid = tl.program_id(axis=0)</text>
