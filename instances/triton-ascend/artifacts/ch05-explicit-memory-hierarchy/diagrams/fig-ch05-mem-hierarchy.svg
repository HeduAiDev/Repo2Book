<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000">
<defs><marker id="gray" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#94a3b8"/></marker><marker id="blue" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#1d4ed8"/></marker><marker id="orange" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#c2410c"/></marker></defs>
<rect width="1500" height="1000" fill="white"/>
<text x="750.0" y="34" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#0f172a">从 .td 到 Python：一道 pybind 边界，把 7 级地址空间筛成 5 级</text>
<text x="750.0" y="60" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#64748b">.td 定义 7 级 → pybind 导出 5 级 → 搬运边真的比较的只有 2 级(UB / L1) → L0C 仅是 docstring 契约</text>
<text x="750.0" y="80" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#64748b">写不出 space=GM 的 buffer，正是 GM↔UB 搬运要走 ch02 另一套机制的原因</text>
<rect x="50" y="96" width="1400" height="96" rx="10" fill="#fbfbfc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="66" y="118" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#475569">① MLIR / HIVM 方言侧：HIVMAttrs.td:L188-194 定义 7 级</text>
<rect x="66" y="134" width="180" height="44" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.8" stroke-dasharray="6,4"/>
<text x="156.0" y="153" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#7f1d1d">Zero = 0</text>
<text x="156.0" y="169" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="bold" fill="#b91c1c">✗ 未导出</text>
<rect x="254" y="134" width="180" height="44" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.8" stroke-dasharray="6,4"/>
<text x="344.0" y="153" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#7f1d1d">GM = 1</text>
<text x="344.0" y="169" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="bold" fill="#b91c1c">✗ 未导出</text>
<rect x="442" y="134" width="180" height="44" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/>
<text x="532.0" y="153" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155">L1 = 2</text>
<text x="532.0" y="169" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="bold" fill="#15803d">✓ 已导出</text>
<line x1="532.0" y1="178" x2="532.0" y2="196" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#gray)"/>
<rect x="630" y="134" width="180" height="44" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/>
<text x="720.0" y="153" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155">L0A = 3</text>
<text x="720.0" y="169" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="bold" fill="#15803d">✓ 已导出</text>
<line x1="720.0" y1="178" x2="720.0" y2="196" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#gray)"/>
<rect x="818" y="134" width="180" height="44" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/>
<text x="908.0" y="153" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155">L0B = 4</text>
<text x="908.0" y="169" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="bold" fill="#15803d">✓ 已导出</text>
<line x1="908.0" y1="178" x2="908.0" y2="196" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#gray)"/>
<rect x="1006" y="134" width="180" height="44" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/>
<text x="1096.0" y="153" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155">L0C = 5</text>
<text x="1096.0" y="169" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="bold" fill="#15803d">✓ 已导出</text>
<line x1="1096.0" y1="178" x2="1096.0" y2="196" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#gray)"/>
<rect x="1194" y="134" width="180" height="44" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/>
<text x="1284.0" y="153" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155">UB = 6</text>
<text x="1284.0" y="169" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="bold" fill="#15803d">✓ 已导出</text>
<line x1="1284.0" y1="178" x2="1284.0" y2="196" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#gray)"/>
<text x="750.0" y="220" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">② pybind 边界：ascend_ir.cc:L412-418 的 py::enum_&lt;hivm::AddressSpace&gt; 只 .value() 了 5 个</text>
<line x1="50" y1="232" x2="1450" y2="232" stroke="#0f172a" stroke-width="2.6" stroke-dasharray="12,6"/>
<text x="750.0" y="250" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#475569">语言层能不能写出某一级，就取决于这几行 —— Zero 与 GM 根本不进 Python</text>
<text x="50" y="272" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#475569">③ Python 语言层：导出的 5 级</text>
<rect x="170" y="320" width="320" height="104" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.6"/>
<text x="330.0" y="344" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">UB</text>
<text x="330.0" y="363" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e40af">Unified Buffer(vector 侧)</text>
<text x="330.0" y="382" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#1e40af">copy 的 src 必须是它；fixpipe 的 dst 必须是它</text>
<rect x="283.6" y="395.5" width="92.8" height="21" rx="10.5" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="330.0" y="410.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#ffffff">导出 + 边校验</text>
<rect x="690" y="320" width="320" height="104" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.6"/>
<text x="850.0" y="344" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">L1</text>
<text x="850.0" y="363" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e40af">cube 输入缓冲</text>
<text x="850.0" y="382" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#1e40af">copy 的 dst 可以是它；copy_from_ub_to_l1 只认它</text>
<rect x="803.6" y="395.5" width="92.8" height="21" rx="10.5" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="850.0" y="410.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#ffffff">导出 + 边校验</text>
<rect x="555" y="490" width="180" height="78" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<text x="645.0" y="514" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#334155">L0A</text>
<text x="645.0" y="533" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">cube 输入(语言层无搬运 API)</text>
<rect x="602.5" y="539.5" width="85.0" height="21" rx="10.5" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="645.0" y="554.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#475569">导出，无校验</text>
<rect x="760" y="490" width="180" height="78" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<text x="850.0" y="514" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#334155">L0B</text>
<text x="850.0" y="533" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">cube 输入(语言层无搬运 API)</text>
<rect x="807.5" y="539.5" width="85.0" height="21" rx="10.5" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="850.0" y="554.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#475569">导出，无校验</text>
<rect x="610" y="614" width="400" height="104" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="2.4" stroke-dasharray="7,5"/>
<text x="810.0" y="638" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#7c2d12">L0C</text>
<text x="810.0" y="657" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#9a3412">cube 累加输出(Fractal NZ 布局)</text>
<text x="810.0" y="676" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#9a3412">fixpipe 的 src「应当」在这里 —— 但没有任何一行代码检查</text>
<rect x="742.6" y="689.5" width="134.8" height="21" rx="10.5" fill="#ffedd5" stroke="#c2410c" stroke-width="1.2" stroke-dasharray="4,3"/>
<text x="810.0" y="704.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#9a3412">导出 + 契约，但不校验</text>
<line x1="344.0" y1="178" x2="344.0" y2="320" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6,5" marker-end="url(#gray)" marker-start="url(#gray)"/>
<text x="360.0" y="272" font-family="sans-serif" font-size="10.5" fill="#64748b">显式搬运 GM↔UB：走 ch02 的另一套机制</text>
<text x="360.0" y="290" font-family="sans-serif" font-size="10.5" fill="#64748b">—— 因为 space=GM 的 buffer 根本写不出来</text>
<path d="M 850.0 424 L 645.0 490" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#gray)"/>
<path d="M 645.0 568 L 810.0 614" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#gray)"/>
<path d="M 850.0 424 L 850.0 490" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#gray)"/>
<path d="M 850.0 568 L 810.0 614" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#gray)"/>
<path d="M 164 336 C 118 336 118 408 164 408" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#blue)"/>
<text x="92" y="376.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#1d4ed8" transform="rotate(-90 92 376.0)">al.copy</text>
<line x1="490" y1="372.0" x2="690" y2="372.0" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#blue)"/>
<text x="590.0" y="360.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1d4ed8">al.copy: UB → {UB, L1}</text>
<text x="590.0" y="392.0" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1d4ed8">两端都被校验</text>
<path d="M 1010 666.0 C 1380 666.0 1380 464 400.4 424" fill="none" stroke="#c2410c" stroke-width="2.4" marker-end="url(#orange)"/>
<text x="1256" y="580" font-family="sans-serif" font-size="12" font-weight="bold" fill="#c2410c">al.fixpipe: L0C → UB</text>
<text x="1256" y="602" font-family="sans-serif" font-size="10.5" fill="#c2410c">只有到达端(UB)被校验</text>
<rect x="60" y="476" width="470" height="104" rx="9" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="76" y="501" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#1d4ed8">al.copy(src, dst)：两端都真的比较 .space</text>
<text x="76" y="524" font-family="sans-serif" font-size="10.5" fill="#334155">src.space != al.ascend_address_space.UB  → TypeError</text>
<text x="76" y="544" font-family="sans-serif" font-size="10.5" fill="#334155">dst.space not in (al.ascend_address_space.L1,</text>
<text x="94" y="564" font-family="sans-serif" font-size="10.5" fill="#334155">al.ascend_address_space.UB)  → TypeError</text>
<rect x="60" y="602" width="470" height="104" rx="9" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/>
<text x="76" y="627" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#c2410c">al.fixpipe(src, dst, …)：只校验到达端</text>
<text x="76" y="650" font-family="sans-serif" font-size="10.5" fill="#334155">dst.space != ascend_address_space.UB  → TypeError（到达端被拦）</text>
<text x="76" y="670" font-family="sans-serif" font-size="10.5" fill="#334155">src 侧只有 isinstance(src, tl.tensor)：tl.tensor 没有 .space 字段，</text>
<text x="76" y="690" font-family="sans-serif" font-size="10.5" fill="#334155">所以「src 必须在 L0C」拦不住 —— 靠人守约定，不靠语言层</text>
<rect x="50" y="769" width="26" height="17" rx="5" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.8" stroke-dasharray="6,4"/>
<text x="86" y="783" font-family="sans-serif" font-size="11.5" fill="#334155">① .td 有、pybind 未导出：Zero / GM —— Python 里根本写不出这一级</text>
<rect x="50" y="797" width="26" height="17" rx="5" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
<text x="86" y="811" font-family="sans-serif" font-size="11.5" fill="#334155">② 导出 + 边校验：真的比较 .space、能抛 TypeError —— 只有 UB 与 L1</text>
<rect x="50" y="825" width="26" height="17" rx="5" fill="#fff7ed" stroke="#c2410c" stroke-width="1.8" stroke-dasharray="7,5"/>
<text x="86" y="839" font-family="sans-serif" font-size="11.5" fill="#334155">③ 导出 + 契约但不校验：L0C 只写在 al.fixpipe 的 docstring 里</text>
<rect x="50" y="853" width="26" height="17" rx="5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.8"/>
<text x="86" y="867" font-family="sans-serif" font-size="11.5" fill="#334155">④ 导出，但无校验：L0A / L0B —— 可传给 bl.alloc，但没有任何一条边比较它</text>
<line x1="1050" y1="777" x2="1080" y2="777" stroke="#1d4ed8" stroke-width="3"/>
<text x="1090" y="783" font-family="sans-serif" font-size="11.5" fill="#334155">al.copy 覆盖边：UB → {UB, L1}</text>
<line x1="1050" y1="805" x2="1080" y2="805" stroke="#c2410c" stroke-width="3"/>
<text x="1090" y="811" font-family="sans-serif" font-size="11.5" fill="#334155">al.fixpipe 覆盖边：L0C(名义)→ UB</text>
<line x1="1050" y1="833" x2="1080" y2="833" stroke="#94a3b8" stroke-width="3" stroke-dasharray="5,4"/>
<text x="1090" y="839" font-family="sans-serif" font-size="11.5" fill="#334155">ch02 已建 / 硬件内部，本章不覆盖</text>
<text x="50" y="906" font-family="sans-serif" font-size="11" fill="#64748b">.td 定义 7 级（Zero=0 / GM=1 / L1=2 / L0A=3 / L0B=4 / L0C=5 / UB=6，HIVMAttrs.td:L188-194）→ pybind 导出 5 级（ascend_ir.cc:L412-418）→ 边校验 2 级（UB / L1）→ L0C 仅契约。</text>
<text x="50" y="928" font-family="sans-serif" font-size="11" fill="#64748b">全仓地址空间比较只有 5 处，全部只提 UB 与 L1：semantic.py:L104 / L106（copy_from_ub_to_l1）、semantic.py:L123 / L125（copy）、core.py:L300（fixpipe）。</text>
<text x="50" y="950" font-family="sans-serif" font-size="11" fill="#64748b">core.py:L152-163 的反射逐个包 ascend_ir.AddressSpace.__dict__，拿到的正是 pybind 导出的那 5 个；bl.alloc 原样透传 space，无白名单。</text>
<text x="50" y="972" font-family="sans-serif" font-size="11" fill="#64748b">基座 Triton 面对 GPU 时把这一层完全藏起来，由编译器代管共享内存。</text>
</svg>