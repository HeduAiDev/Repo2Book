<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 522">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker><marker id="g" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#15803d"/></marker></defs>
<rect width="1100" height="522" fill="white"/>
<text x="550.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="17.5" font-weight="bold" fill="#0f172a">al.fixpipe：L0C → UB 的专用搬运 + 布局转换通路</text>
<text x="550.0" y="52" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#64748b">校验通过后向下方落地一个六参 create_fixpipe op；前端固定 NO_QUANT/NO_RELU，用户无入口</text>
<rect x="40" y="106" width="260" height="108" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="2.2"/>
<text x="170.0" y="132" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#7c2d12">源：L0C 上的 tl.tensor</text>
<text x="170.0" y="154" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#9a3412">Fractal NZ 分形布局(cube 累加输出)</text>
<text x="170.0" y="176" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#c2410c">须为 tl.tensor，否则拒</text>
<text x="170.0" y="198" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#c2410c" font-weight="bold">core.py:L286-289,L296</text>
<rect x="400" y="106" width="300" height="108" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2" stroke-dasharray="7,5"/>
<text x="550.0" y="130" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">结构校验(顺序短路)</text>
<text x="418" y="150" font-family="sans-serif" font-size="11" fill="#334155">① is_910_95</text>
<text x="418" y="166" font-family="sans-serif" font-size="11" fill="#334155">② src 须 tl.tensor</text>
<text x="418" y="182" font-family="sans-serif" font-size="11" fill="#334155">③ dst 须 bl.buffer</text>
<text x="418" y="198" font-family="sans-serif" font-size="11" fill="#334155">④ dst.space 须 UB</text>
<rect x="800" y="106" width="260" height="108" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.2"/>
<text x="930.0" y="132" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#1e3a8a">目的：UB 上的 bl.buffer</text>
<text x="930.0" y="154" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1e40af">常规 ND 布局(dma_mode=NZ2ND 还原)</text>
<text x="930.0" y="176" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#1d4ed8">须位于 UB，否则拒</text>
<text x="930.0" y="198" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#1d4ed8" font-weight="bold">core.py:L299-300</text>
<line x1="300" y1="160.0" x2="400" y2="160.0" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<text x="350.0" y="150.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155">al.fixpipe</text>
<line x1="700" y1="160.0" x2="800" y2="160.0" stroke="#15803d" stroke-width="2.2" marker-end="url(#g)"/>
<text x="750.0" y="150.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#15803d">全通过</text>
<line x1="550.0" y1="214" x2="550.0" y2="306" stroke="#15803d" stroke-width="2.2" marker-end="url(#g)"/>
<text x="562.0" y="260.0" font-family="sans-serif" font-size="11" fill="#15803d">落地建 op</text>
<rect x="40" y="306" width="1020" height="96" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="2.2"/>
<text x="58" y="332" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#14532d">create_fixpipe(src, dst, dma_mode, dual_dst_mode, pre_quant, pre_relu)</text>
<text x="58.0" y="358" font-family="sans-serif" font-size="11" fill="#166534" font-weight="bold">src</text>
<text x="58.0" y="376" font-family="sans-serif" font-size="11" fill="#14532d">L0C tensor</text>
<text x="222.0" y="358" font-family="sans-serif" font-size="11" fill="#166534" font-weight="bold">dst</text>
<text x="222.0" y="376" font-family="sans-serif" font-size="11" fill="#14532d">UB buffer</text>
<text x="386.0" y="358" font-family="sans-serif" font-size="11" fill="#166534" font-weight="bold">dma_mode</text>
<text x="386.0" y="376" font-family="sans-serif" font-size="11" fill="#14532d">NZ2ND(默认)</text>
<text x="550.0" y="358" font-family="sans-serif" font-size="11" fill="#166534" font-weight="bold">dual_dst_mode</text>
<text x="550.0" y="376" font-family="sans-serif" font-size="11" fill="#14532d">NO_DUAL</text>
<text x="714.0" y="358" font-family="sans-serif" font-size="11" fill="#166534" font-weight="bold">pre_quant</text>
<text x="714.0" y="376" font-family="sans-serif" font-size="11" fill="#14532d">NO_QUANT(前端硬编码)</text>
<text x="878.0" y="358" font-family="sans-serif" font-size="11" fill="#166534" font-weight="bold">pre_relu</text>
<text x="878.0" y="376" font-family="sans-serif" font-size="11" fill="#14532d">NO_RELU(前端硬编码)</text>
<text x="58" y="392" font-family="sans-serif" font-size="10.5" fill="#15803d">6 参签名后两位(pre_quant/pre_relu)前端硬编码固定，量化/ReLU 融合语言层永不开启</text>
<text x="40" y="442" font-family="sans-serif" font-size="11" fill="#64748b">fixpipe 是 L0C → 其它内存层级的专用数据通路(本芯片系列仅支持 L0C→UB)；NZ→ND 分形下降细节归 P5(ch23 HIVM 方言)。</text>
<text x="40" y="462" font-family="sans-serif" font-size="11" fill="#64748b">数据来自 host 实测；固定参数见 third_party/ascend/language/cann/extension/core.py:L331。</text>
</svg>