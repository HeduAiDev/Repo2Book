<text x="444.0" y="182.0" text-anchor="middle" font-family="monospace" font-size="6.5" fill="#7c3aed">python/triton/extension/buffer/language/semantic.py</text>
<text x="444.0" y="197.0" text-anchor="middle" font-family="sans-serif" font-size="9.2" fill="#64748b">在指定楼层物化一块内存；address_space</text>
