<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1170 576">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker></defs>
<rect width="1170" height="576" fill="white"/>
<text x="30" y="30" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1e40af">命中 Tensor Core 的三把锁：形状 + 精度 + dtype</text>
<text x="30" y="50" font-family="sans-serif" font-size="12" fill="#64748b">任一锁未开：形状/dtype 锁 → 追踪期 AssertionError（不生成 IR）；精度锁选 i</text>
<text x="30" y="66" font-family="sans-serif" font-size="12" fill="#64748b">eee → 能编译但退化到非 TC 路径</text>
<text x="204" y="148.0" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="bold" fill="#374151">写法</text>
<rect x="220" y="118" width="222" height="46" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="331.0" y="137.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">形状锁</text>
<text x="331.0" y="153.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">(min_dot_size)</text>
<rect x="450" y="118" width="222" height="46" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="561.0" y="137.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">精度锁</text>
<text x="561.0" y="153.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">(input_precision)</text>
<rect x="680" y="118" width="222" height="46" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="791.0" y="137.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">dtype 锁</text>
<text x="791.0" y="153.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">(白名单/acc)</text>
<rect x="910" y="118" width="222" height="46" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="1021.0" y="145.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">结果</text>
<text x="204" y="199.0" text-anchor="end" font-family="monospace" font-size="11.5" font-weight="bold" fill="#374151">fp16 (128,128)@(128,128)</text>
<text x="204" y="215.0" text-anchor="end" font-family="monospace" font-size="11.5" font-weight="bold" fill="#374151">默认</text>
<rect x="220" y="174" width="222" height="58" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="331.0" y="207.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#15803d" font-weight="bold">M,N,K=128≥16</text>
<rect x="450" y="174" width="222" height="58" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="561.0" y="207.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#15803d" font-weight="bold">fp16 与精度无关</text>
<rect x="680" y="174" width="222" height="58" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="791.0" y="207.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#15803d" font-weight="bold">fp16 受支持</text>
<rect x="910" y="174" width="222" height="58" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="1021.0" y="207.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#15803d" font-weight="bold">命中 Tensor Core</text>
<text x="204" y="265.0" text-anchor="end" font-family="monospace" font-size="11.5" font-weight="bold" fill="#374151">f32 (128,128)@(128,128)</text>
<text x="204" y="281.0" text-anchor="end" font-family="monospace" font-size="11.5" font-weight="bold" fill="#374151">默认</text>
<rect x="220" y="240" width="222" height="58" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="331.0" y="273.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#15803d" font-weight="bold">128≥16</text>
<rect x="450" y="240" width="222" height="58" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="561.0" y="273.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#15803d" font-weight="bold">tf32(默认)</text>
<rect x="680" y="240" width="222" height="58" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="791.0" y="273.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#15803d" font-weight="bold">f32 受支持</text>
<rect x="910" y="240" width="222" height="58" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="1021.0" y="273.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#15803d" font-weight="bold">命中 Tensor Core(tf32)</text>
<text x="204" y="331.0" text-anchor="end" font-family="monospace" font-size="11.5" font-weight="bold" fill="#374151">f32 同上</text>
<text x="204" y="347.0" text-anchor="end" font-family="monospace" font-size="11.5" font-weight="bold" fill="#374151">allow_tf32=False</text>
<rect x="220" y="306" width="222" height="58" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="331.0" y="339.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#15803d" font-weight="bold">128≥16</text>
<rect x="450" y="306" width="222" height="58" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="561.0" y="339.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b91c1c" font-weight="bold">ieee</text>
<rect x="680" y="306" width="222" height="58" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="791.0" y="339.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#15803d" font-weight="bold">f32 受支持</text>
<rect x="910" y="306" width="222" height="58" rx="4" fill="#fef9c3" stroke="#a16207" stroke-width="2"/>
<text x="1021.0" y="339.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#a16207" font-weight="bold">退化：ieee 非 TC 路径</text>
<text x="204" y="405.0" text-anchor="end" font-family="monospace" font-size="11.5" font-weight="bold" fill="#374151">fp16 (8,128)@(128,128)</text>
<rect x="220" y="372" width="222" height="58" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="331.0" y="405.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b91c1c" font-weight="bold">M=8&lt;16</text>
<rect x="450" y="372" width="222" height="58" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="561.0" y="405.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b" font-weight="bold">—</text>
<rect x="680" y="372" width="222" height="58" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="791.0" y="405.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b" font-weight="bold">—</text>
<rect x="910" y="372" width="222" height="58" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="1021.0" y="405.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b91c1c" font-weight="bold">追踪期报错</text>
<text x="204" y="471.0" text-anchor="end" font-family="monospace" font-size="11.5" font-weight="bold" fill="#374151">int8 (128,128)@(128,16)</text>
<rect x="220" y="438" width="222" height="58" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="331.0" y="471.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b91c1c" font-weight="bold">N=16&lt;32(int8)</text>
<rect x="450" y="438" width="222" height="58" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="561.0" y="471.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b" font-weight="bold">—</text>
<rect x="680" y="438" width="222" height="58" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="791.0" y="471.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#15803d" font-weight="bold">int8 受支持</text>
<rect x="910" y="438" width="222" height="58" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="1021.0" y="471.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b91c1c" font-weight="bold">追踪期报错</text>
<text x="30" y="516" font-family="sans-serif" font-size="12" fill="#64748b">三锁自查：形状每维 ≥ min_dot_size(int8 的 N≥32)；f32 用默认或显式 tf32；操作数 dtype 属白名单且同型、acc 相容。</text>
<text x="30" y="534" font-family="sans-serif" font-size="12" fill="#64748b">绿=通过/命中，黄=能编译但退化到非 TC 路径，红=破锁(报错或退化)，灰=该锁在此行不适用(已在更早的锁被拦下)。</text>
</svg>