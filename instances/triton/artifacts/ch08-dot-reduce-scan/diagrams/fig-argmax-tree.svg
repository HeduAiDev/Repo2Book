<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 458">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker></defs>
<rect width="1110" height="458" fill="white"/>
<text x="30" y="30" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1e40af">argmax 树归约：(值,索引) 成对 combine</text>
<text x="30" y="50" font-family="sans-serif" font-size="12" fill="#64748b">输入 [3,1,4,1]，n=4，log2(4)=2 层归约；combine 用 where(v1&gt;v2</text>
<text x="30" y="66" font-family="sans-serif" font-size="12" fill="#64748b">) 让索引跟随值一起被选，平局取最左</text>
<rect x="30" y="108" width="82" height="36" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="71.0" y="130.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="white" font-weight="bold">轮次</text>
<rect x="120" y="108" width="312" height="36" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="276.0" y="130.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="white" font-weight="bold">combine 输入 (v1,i1) × (v2,i2)</text>
<rect x="440" y="108" width="292" height="36" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="586.0" y="130.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="white" font-weight="bold">gt 判定</text>
<rect x="740" y="108" width="332" height="36" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="906.0" y="130.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="white" font-weight="bold">where 选出 (value, index)</text>
<rect x="30" y="154" width="82" height="48" rx="4" fill="#f8fafc" stroke="#334155" stroke-width="1"/>
<text x="71.0" y="182.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#374151">1</text>
<rect x="120" y="154" width="312" height="48" rx="4" fill="#f8fafc" stroke="#334155" stroke-width="1"/>
<text x="276.0" y="182.0" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#374151">(3,0) × (1,1)</text>
<rect x="440" y="154" width="292" height="48" rx="4" fill="#f8fafc" stroke="#334155" stroke-width="1"/>
<text x="586.0" y="182.0" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#374151">3&gt;1 = True</text>
<rect x="740" y="154" width="332" height="48" rx="4" fill="#f8fafc" stroke="#334155" stroke-width="1"/>
<text x="906.0" y="182.0" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#374151">(3, 0)</text>
<rect x="30" y="210" width="82" height="48" rx="4" fill="#f8fafc" stroke="#334155" stroke-width="1"/>
<text x="71.0" y="238.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#374151">2</text>
<rect x="120" y="210" width="312" height="48" rx="4" fill="#f8fafc" stroke="#334155" stroke-width="1"/>
<text x="276.0" y="238.0" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#374151">(4,2) × (1,3)</text>
<rect x="440" y="210" width="292" height="48" rx="4" fill="#f8fafc" stroke="#334155" stroke-width="1"/>
<text x="586.0" y="238.0" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#374151">4&gt;1 = True</text>
<rect x="740" y="210" width="332" height="48" rx="4" fill="#f8fafc" stroke="#334155" stroke-width="1"/>
<text x="906.0" y="238.0" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#374151">(4, 2)</text>
<rect x="30" y="266" width="82" height="48" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="71.0" y="294.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#15803d">3</text>
<rect x="120" y="266" width="312" height="48" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="276.0" y="294.0" text-anchor="middle" font-family="monospace" font-size="11.5" font-weight="bold" fill="#15803d">(3,0) × (4,2)</text>
<rect x="440" y="266" width="292" height="48" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="586.0" y="294.0" text-anchor="middle" font-family="monospace" font-size="11.5" font-weight="bold" fill="#15803d">3&gt;4 = False</text>
<rect x="740" y="266" width="332" height="48" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="906.0" y="294.0" text-anchor="middle" font-family="monospace" font-size="11.5" font-weight="bold" fill="#15803d">(4, 2)  → 最终 value=4, index=2</text>
<rect x="30" y="322" width="82" height="48" rx="4" fill="#fef9c3" stroke="#a16207" stroke-width="2"/>
<text x="71.0" y="350.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#a16207">平局例</text>
<rect x="120" y="322" width="312" height="48" rx="4" fill="#fef9c3" stroke="#a16207" stroke-width="2"/>
<text x="276.0" y="350.0" text-anchor="middle" font-family="monospace" font-size="11.5" font-weight="bold" fill="#a16207">(4,0) × (4,1)  输入[4,4]</text>
<rect x="440" y="322" width="292" height="48" rx="4" fill="#fef9c3" stroke="#a16207" stroke-width="2"/>
<text x="586.0" y="350.0" text-anchor="middle" font-family="monospace" font-size="11.5" font-weight="bold" fill="#a16207">tie(4==4 and 0&lt;1)=True → gt=True</text>
<rect x="740" y="322" width="332" height="48" rx="4" fill="#fef9c3" stroke="#a16207" stroke-width="2"/>
<text x="906.0" y="350.0" text-anchor="middle" font-family="monospace" font-size="11.5" font-weight="bold" fill="#a16207">(4, 0)  → 左侧索引 0 胜</text>
<rect x="30" y="380" width="16" height="16" rx="3" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="52" y="392" font-family="sans-serif" font-size="12" fill="#374151">最终结果</text>
<rect x="150" y="380" width="16" height="16" rx="3" fill="#fef9c3" stroke="#a16207" stroke-width="2"/>
<text x="172" y="392" font-family="sans-serif" font-size="12" fill="#374151">平局样例(取最左索引)</text>
<text x="30" y="422" font-family="sans-serif" font-size="12" fill="#64748b">argmax = reduce 的免费高级用法：_reduce_with_indices 把 (值,索引) 成对喂给同一个 create_reduce，值那路做 max，索引那路跟随值被选。</text>
</svg>