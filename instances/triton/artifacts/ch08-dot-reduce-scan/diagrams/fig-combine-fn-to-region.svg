<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1452 346">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker></defs>
<rect width="1452" height="346" fill="white"/>
<text x="34" y="34" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1e40af">combine_fn 是被再编译进 IR region，不是被 Python 调用</text>
<text x="34" y="54" font-family="sans-serif" font-size="12" fill="#64748b">用户 combine_fn 经 make_combine_region → call_JitFunction → fn.</text>
<text x="34" y="70" font-family="sans-serif" font-size="12" fill="#64748b">parse()+CodeGenerator.visit 被编译成 reduce_op 的 region body</text>
<rect x="34" y="108" width="240" height="118" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
<text x="154.0" y="152.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#1e40af">①  core.reduce()</text>
<text x="154.0" y="172.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e40af">建 make_combine_region</text>
<text x="154.0" y="192.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e40af">闭包</text>
<text x="154.0" y="248" text-anchor="middle" font-family="monospace" font-size="11" fill="#475569">core.py:L2049</text>
<rect x="320" y="108" width="240" height="118" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
<text x="440.0" y="152.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#1e40af">②  prototype 双入协议</text>
<text x="440.0" y="172.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e40af">function_type(in, in×2)</text>
<text x="440.0" y="192.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e40af">(2 入 1 出)</text>
<text x="440.0" y="248" text-anchor="middle" font-family="monospace" font-size="11" fill="#475569">core.py:L2051</text>
<rect x="606" y="108" width="240" height="118" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
<text x="726.0" y="152.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#1e40af">③  call_JitFunction</text>
<text x="726.0" y="172.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e40af">(_sum_combine, [a,b])</text>
<text x="726.0" y="192.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e40af">a,b 是 tl.tensor</text>
<text x="726.0" y="248" text-anchor="middle" font-family="monospace" font-size="11" fill="#475569">core.py:L2058</text>
<rect x="892" y="108" width="240" height="118" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="3"/>
<text x="1012.0" y="152.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#c2410c">④  fn.parse() +</text>
<text x="1012.0" y="172.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#c2410c">CodeGenerator.visit</text>
<text x="1012.0" y="192.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#c2410c">= AST 再编译，非 Python 调用</text>
<text x="1012.0" y="248" text-anchor="middle" font-family="monospace" font-size="11" fill="#475569">code_generator.py:L1075</text>
<rect x="1178" y="108" width="240" height="118" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
<text x="1298.0" y="152.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#1e40af">⑤  create_reduce_ret</text>
<text x="1298.0" y="172.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e40af">写回 region body</text>
<text x="1298.0" y="192.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e40af">(结果句柄)</text>
<text x="1298.0" y="248" text-anchor="middle" font-family="monospace" font-size="11" fill="#475569">core.py:L2063</text>
<line x1="274" y1="167.0" x2="320" y2="167.0" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="560" y1="167.0" x2="606" y2="167.0" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="846" y1="167.0" x2="892" y2="167.0" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="1132" y1="167.0" x2="1178" y2="167.0" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="34" y="276" width="16" height="16" rx="3" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
<text x="56" y="288" font-family="sans-serif" font-size="12" fill="#374151">构造 / 写回步骤</text>
<rect x="214" y="276" width="16" height="16" rx="3" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
<text x="236" y="288" font-family="sans-serif" font-size="12" fill="#374151">关键步：combine_fn 体在此被编译成 IR，从未被 Python 调用求值</text>
<text x="34" y="322" font-family="sans-serif" font-size="12" fill="#64748b">这解释了下一条规则：combine_fn 里只能写 tl.* 可追踪操作，因为它走的是编译路径，不是 Python 求值路径。</text>
</svg>