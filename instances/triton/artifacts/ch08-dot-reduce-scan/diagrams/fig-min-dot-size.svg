<text x="30" y="50" font-family="sans-serif" font-size="12" fill="#64748b">NVIDIA 后端声明：非 int8 门槛 (M,N,K)=(16,16,16)；int8 门槛 (16,32,</text>
<text x="30" y="66" font-family="sans-serif" font-size="12" fill="#64748b">16) —— third_party/nvidia/backend/compiler.py:L18</text>
