<text x="998.5" y="121.0" text-anchor="middle" font-family="monospace" font-size="12" fill="white" font-weight="bold">int8 (16,32)@(32,32)</text>
<text x="164" y="173.0" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="bold" fill="#374151">min_dot_size 返回</text>
<text x="293.5" y="173.0" text-anchor="middle" font-family="monospace" font-size="11" fill="#374151" >(16,16,16)</text>
<text x="528.5" y="173.0" text-anchor="middle" font-family="monospace" font-size="11" fill="#374151" >(16,16,16)</text>
<text x="763.5" y="173.0" text-anchor="middle" font-family="monospace" font-size="11" fill="#374151" >(16,32,16)</text>
