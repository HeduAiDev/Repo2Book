<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 346">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker></defs>
<rect width="930" height="346" fill="white"/>
<text x="40" y="32" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e293b">同一个 tl.cdiv:追踪期建 IR,make_ttir 一跑就被内联折叠</text>
<text x="230.0" y="60" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">阶段一:追踪期(make_ir 输出)</text>
<rect x="80.0" y="84" width="300" height="30" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
<text x="230.0" y="103.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">tt.func private @cdiv__i32__1cconstexpr_1024_</text>
<line x1="230.0" y1="114" x2="230.0" y2="132" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="80.0" y="136" width="300" height="30" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
<text x="230.0" y="155.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">签名 (%arg0: i32) → i32,1024 不在签名里</text>
<line x1="230.0" y1="166" x2="230.0" y2="184" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="80.0" y="188" width="300" height="46" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
<text x="230.0" y="207.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">体内 25 个 arith op:addi2/subi2/divsi1/</text>
<text x="230.0" y="223.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">extsi4/cmpi4/andi2/constant10</text>
<line x1="230.0" y1="234" x2="230.0" y2="252" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="80.0" y="256" width="300" height="30" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="230.0" y="275.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">全模块 tt.call = 1,tt.func = 2</text>
<text x="700.0" y="60" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">阶段二:make_ttir 之后(add_inliner+canonicalizer)</text>
<rect x="550.0" y="84" width="300" height="30" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
<text x="700.0" y="103.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">tt.func 被内联抹平,无独立 @cdiv</text>
<line x1="700.0" y1="114" x2="700.0" y2="132" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="550.0" y="136" width="300" height="30" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
<text x="700.0" y="155.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">canonicalizer 折出常量 1024 与 1023</text>
<line x1="700.0" y1="166" x2="700.0" y2="184" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="550.0" y="188" width="300" height="46" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
<text x="700.0" y="207.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">全模块逐 op:constant2/addi1/divsi1/</text>
<text x="700.0" y="223.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">store1/return1/func1</text>
<line x1="700.0" y1="234" x2="700.0" y2="252" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="550.0" y="256" width="300" height="30" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="700.0" y="275.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">全模块 tt.call = 0</text>
<line x1="430" y1="204.0" x2="500" y2="204.0" stroke="#d97706" stroke-width="2.5" marker-end="url(#a)"/>
<text x="465" y="194.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a16207">add_inliner</text>
<text x="40" y="330" font-family="sans-serif" font-size="11" fill="#64748b">追踪期 mangled 名 cdiv__i32__1cconstexpr_1024_;TRITON_KERNEL_DUMP 的 .ttir 是阶段二产物,想看阶段一得自己调 make_ir</text>
