<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 622">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#475569"/></marker><marker id="g" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#047857"/></marker><marker id="r" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#b91c1c"/></marker><marker id="o" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#a16207"/></marker></defs>
<rect width="1160" height="622" fill="white"/>
<text x="30" y="28" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e293b">libtriton 的后端接缝:FOR_EACH_P 宏链手写上限 4 元(容量上限,非后端数)</text>
<rect x="310.0" y="60.0" width="540" height="58" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
<text x="580.0" y="85.0" text-anchor="middle" font-family="sans-serif" font-size="12.0" fill="#0f172a" font-weight="bold" >本 pin 树内后端 = 2 个:TRITON_BACKENDS_TUPLE (nvidia, amd)</text>
<text x="580.0" y="100.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#0f172a" >setup.py:L562 / CMakeLists:L245,L253(带括号)</text>
<line x1="580.0" y1="118.0" x2="580.0" y2="168.0" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="310.0" y="168.0" width="540" height="46" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="580.0" y="195.0" text-anchor="middle" font-family="sans-serif" font-size="12.0" fill="#0f172a" font-weight="bold" >REMOVE_PARENS 脱括号 → FOR_EACH_P(...)  [main.cc:L24-L44]</text>
<line x1="580.0" y1="214.0" x2="580.0" y2="254.0" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
<text x="580.0" y="272.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#0f172a" font-weight="bold">FOR_EACH_ARG_N 数参数个数 N,CONCATENATE(FOR_EACH_, N) 拼宏名</text>
<text x="580.0" y="290.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">容量上限:只手写 FOR_EACH_1..FOR_EACH_4(main.cc:L7-L10)——下面是一次 gcc -E 构造性实验,喂假想元组探这个上限</text>
<line x1="580.0" y1="318.0" x2="260" y2="341.0" stroke="#047857" stroke-width="1.5" marker-end="url(#g)"/>
<line x1="580.0" y1="318.0" x2="900" y2="332.0" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#r)"/>
<text x="420.0" y="321.5" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#047857" font-weight="bold">构造实验 · N=4</text>
<text x="740.0" y="317.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#b91c1c" font-weight="bold">同一实验 · N=5</text>
<rect x="40.0" y="341.0" width="440" height="74" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="260.0" y="374.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#0f172a" font-weight="bold" >N=4 → FOR_EACH_4 正常展开</text>
<text x="260.0" y="389.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#0f172a" >假想元组 (nvidia,amd,x,y),x/y 是占位名非树内后端</text>
<text x="260.0" y="431.0" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#94a3b8">gcc -E 宏展开实测(Triton v3.2.0)</text>
<rect x="680.0" y="332.0" width="440" height="92" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="900.0" y="366.0" text-anchor="middle" font-family="sans-serif" font-size="11.0" fill="#0f172a" font-weight="bold" >N=5:第 5 个名 fifth 被当成宏名</text>
<text x="900.0" y="381.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#0f172a" >CONCATENATE(FOR_EACH_, fifth)</text>
<text x="900.0" y="396.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#0f172a" >→ FOR_EACH_fifth 未定义宏 → 编译失败</text>
<text x="900.0" y="440.0" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#94a3b8">gcc -E 宏展开实测(Triton v3.2.0)</text>
<line x1="580.0" y1="504.0" x2="580.0" y2="432.0" stroke="#a16207" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#o)"/>
<text x="592.0" y="472.0" font-family="sans-serif" font-size="10" fill="#a16207">树外后端也追加进同一元组(如姊妹篇 Triton-Ascend)</text>
<rect x="250.0" y="504.0" width="660" height="78" rx="8" fill="#fef9c3" stroke="#a16207" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="580.0" y="539.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#0f172a" font-weight="bold" >树外后端侧门:TRITON_PLUGIN_DIRS(is_external)</text>
<text x="580.0" y="554.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a" >读 &lt;dir&gt;/backend/name.conf → 追加进同一个后端元组</text>
<text x="580.0" y="600.0" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#94a3b8">CMakeLists.txt:L161-L175, L248</text>
</svg>