<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 938 454">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker></defs>
<rect width="938" height="454" fill="white"/>
<text x="34" y="34" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e40af">tl 命名空间是两套实现混装</text>
<text x="34" y="56" font-family="sans-serif" font-size="12" fill="#64748b">core.py 的 @builtin 原语 vs standard.py 的 @jit 组合子——core.py / standard.py 计数(Triton v3.2.0)</text>
<rect x="224" y="108" width="332" height="34" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="390.0" y="129.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">core.py 的 @builtin 原语</text>
<rect x="564" y="108" width="332" height="34" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="730.0" y="129.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">standard.py 的 @jit 组合子</text>
<text x="208" y="172.0" text-anchor="end" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#374151">模块级计数</text>
<text x="208" y="188.0" text-anchor="end" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#374151">(grep -c '^@X')</text>
<text x="390.0" y="180.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#374151" >55</text>
<text x="730.0" y="180.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#374151" >30</text>
<text x="208" y="240.0" text-anchor="end" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#374151">含 tensor 类内方法</text>
<text x="390.0" y="232.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#374151" >96</text>
<text x="390.0" y="247.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#374151" >(多出 41 个算术/访存方法)</text>
<text x="730.0" y="240.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#374151" >(不适用)</text>
<line x1="34" y1="204" x2="904" y2="204" stroke="#e2e8f0" stroke-width="1"/>
<text x="208" y="300.0" text-anchor="end" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#374151">走哪一岔</text>
<rect x="224" y="272" width="332" height="48" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
<text x="390.0" y="300.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#047857" font-weight="bold" >② 直接建 IR op</text>
<rect x="564" y="272" width="332" height="48" rx="4" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
<text x="730.0" y="300.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#1d4ed8" font-weight="bold" >① 被内联进你的 kernel</text>
<line x1="34" y1="268" x2="904" y2="268" stroke="#e2e8f0" stroke-width="1"/>
<text x="208" y="356.0" text-anchor="end" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#374151">举例</text>
<text x="390.0" y="356.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#374151" >tl.program_id / tl.arange / tl.store</text>
<text x="730.0" y="356.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#374151" >tl.cdiv / tl.sort / tl.argmax / tl.cumsum</text>
<line x1="34" y1="324" x2="904" y2="324" stroke="#e2e8f0" stroke-width="1"/>
<text x="34" y="430" font-family="sans-serif" font-size="11" fill="#64748b">第②岔:第①岔 = 原语:组合子 = 55:30(模块级口径);含 tensor 类内方法则 @builtin 共 96</text>
</svg>