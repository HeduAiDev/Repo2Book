<text x="68" y="436" font-family="sans-serif" font-size="12" fill="#334155">触发面最广——19 项任一变，全部 kernel 磁盘缓存集体 miss</text>
<text x="40" y="468" font-family="sans-serif" font-size="12.5" fill="#1e293b" font-weight="bold">结论:5 段各管一个维度——triton_key 覆盖整个编译器(改一行源码→全部 kernel miss)，其余四段各自独立、互不覆盖。</text>
<text x="40" y="490" font-family="sans-serif" font-size="11" fill="#64748b">与按实参特化的内存 launch 缓存键(另一章)正交:那把键管同一 kernel 换实参，这把键管编译器/kernel/工具链/选项/环境本身变没变。</text>
