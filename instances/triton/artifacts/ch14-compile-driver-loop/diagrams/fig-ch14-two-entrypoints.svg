<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 542">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker></defs>
<rect width="900" height="542" fill="white"/>
<text x="40" y="36" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">两种入口共用同一条降级链，只差 ext/身份/make_ir 三点——决定了 first_stage 起步级</text>
<text x="220.0" y="88" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e40af">入口 A: ASTSource(@jit 源码)</text>
<rect x="60.0" y="118" width="320" height="52" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
<text x="220.0" y="149.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#0f172a">src.ext = "ttir"</text>
<line x1="220.0" y1="170" x2="220.0" y2="186" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="60.0" y="190" width="320" height="52" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
<text x="220.0" y="221.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#0f172a">身份=按调用特化(签名+constexpr+attrs)</text>
<line x1="220.0" y1="242" x2="220.0" y2="258" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="60.0" y="262" width="320" height="52" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
<text x="220.0" y="293.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#0f172a">make_ir 跑前端:ast_to_ttir</text>
<line x1="220.0" y1="314" x2="220.0" y2="330" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="60.0" y="334" width="320" height="52" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
<text x="220.0" y="365.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#0f172a">first_stage = 0(从 ttir 起步,全 5 级跑)</text>
<text x="680.0" y="88" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#b45309">入口 B: IRSource(一份 .ttgir 文件)</text>
<rect x="520.0" y="118" width="320" height="52" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
<text x="680.0" y="149.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#0f172a">src.ext = "ttgir"(取自文件后缀)</text>
<line x1="680.0" y1="170" x2="680.0" y2="186" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="520.0" y="190" width="320" height="52" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
<text x="680.0" y="221.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#0f172a">身份=文件内容 sha256(不依赖调用现场)</text>
<line x1="680.0" y1="242" x2="680.0" y2="258" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="520.0" y="262" width="320" height="52" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
<text x="680.0" y="293.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#0f172a">make_ir 直接 parse_mlir_module</text>
<line x1="680.0" y1="314" x2="680.0" y2="330" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="520.0" y="334" width="320" height="52" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="680.0" y="365.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#92400e">first_stage = 2(index(ttgir)+1,跳 2 级)</text>
<line x1="410" y1="360.0" x2="490" y2="360.0" stroke="#d97706" stroke-width="2.5" marker-end="url(#a)"/>
<text x="450" y="348.0" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#d97706">同一驱动循环</text>
<text x="40" y="430" font-family="sans-serif" font-size="12.5" fill="#1e293b" font-weight="bold">结论:first_stage = index(src.ext)+1(IR 入口)——恰好跳过把 IR 降成它自己这一级的 pass。</text>
<text x="40" y="452" font-family="sans-serif" font-size="11" fill="#64748b">IRSource 用文件内容 sha256 作身份,是它能拿一份 .ttgir 直接做 IR 级实验、绕过前端迭代的前提。</text>
</svg>