<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker><marker id="b" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#b45309"/></marker></defs>
<rect width="1180" height="560" fill="white"/>
<text x="50" y="38" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">backend.add_stages 把空 stages 字典按插入序填成 5 级有序字典——全书降级链的骨架</text>
<text x="50" y="62" font-family="sans-serif" font-size="12.5" fill="#64748b">compile() 只递一个空字典;不同后端的 add_stages 填不同内容(本图=CUDABackend)</text>
<rect x="50" y="190.0" width="220" height="110" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5,4"/>
<text x="160.0" y="224.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#475569">调用前</text>
<text x="160.0" y="252.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#334155">stages = {}</text>
<text x="160.0" y="276.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#94a3b8">compile() 造的空有序字典</text>
<line x1="278" y1="245.0" x2="562" y2="245.0" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<text x="420.0" y="231.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155">backend.add_stages(stages)</text>
<text x="420.0" y="267.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">按序 stages[ir_name]=pass_fn</text>
<text x="570" y="96" font-family="sans-serif" font-size="13" font-weight="bold" fill="#475569">调用后:stages(有序,共 5 项)</text>
<rect x="570" y="110" width="560" height="46" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.4"/>
<rect x="570" y="110" width="90" height="46" rx="8" fill="#1d4ed8"/>
<rect x="615.0" y="110" width="45.0" height="46" fill="#1d4ed8"/>
<text x="615.0" y="138.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="white">ttir</text>
<text x="678" y="138.0" font-family="sans-serif" font-size="12.5" fill="#0f172a">make_ttir(module, metadata)</text>
<text x="1114" y="138.0" text-anchor="end" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#1d4ed8">-&gt; str</text>
<rect x="570" y="166" width="560" height="46" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.4"/>
<rect x="570" y="166" width="90" height="46" rx="8" fill="#1d4ed8"/>
<rect x="615.0" y="166" width="45.0" height="46" fill="#1d4ed8"/>
<text x="615.0" y="194.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="white">ttgir</text>
<text x="678" y="194.0" font-family="sans-serif" font-size="12.5" fill="#0f172a">make_ttgir(module, metadata)</text>
<text x="1114" y="194.0" text-anchor="end" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#1d4ed8">-&gt; str</text>
<line x1="615.0" y1="156" x2="615.0" y2="164" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="570" y="222" width="560" height="46" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.4"/>
<rect x="570" y="222" width="90" height="46" rx="8" fill="#1d4ed8"/>
<rect x="615.0" y="222" width="45.0" height="46" fill="#1d4ed8"/>
<text x="615.0" y="250.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="white">llir</text>
<text x="678" y="250.0" font-family="sans-serif" font-size="12.5" fill="#0f172a">make_llir(module, metadata)</text>
<text x="1114" y="250.0" text-anchor="end" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#1d4ed8">-&gt; str</text>
<line x1="615.0" y1="212" x2="615.0" y2="220" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="570" y="278" width="560" height="46" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.4"/>
<rect x="570" y="278" width="90" height="46" rx="8" fill="#1d4ed8"/>
<rect x="615.0" y="278" width="45.0" height="46" fill="#1d4ed8"/>
<text x="615.0" y="306.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="white">ptx</text>
<text x="678" y="306.0" font-family="sans-serif" font-size="12.5" fill="#0f172a">make_ptx(module, metadata)</text>
<text x="1114" y="306.0" text-anchor="end" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#1d4ed8">-&gt; str</text>
<line x1="615.0" y1="268" x2="615.0" y2="276" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="570" y="334" width="560" height="46" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<rect x="570" y="334" width="90" height="46" rx="8" fill="#b45309"/>
<rect x="615.0" y="334" width="45.0" height="46" fill="#b45309"/>
<text x="615.0" y="362.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="white">cubin</text>
<text x="678" y="362.0" font-family="sans-serif" font-size="12.5" fill="#92400e">make_cubin(module, metadata)</text>
<text x="1114" y="362.0" text-anchor="end" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#b45309">-&gt; bytes</text>
<line x1="615.0" y1="324" x2="615.0" y2="332" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a)"/>
<text x="1130" y="400" text-anchor="end" font-family="sans-serif" font-size="11" font-weight="bold" fill="#b45309">末级(唯 1 项)返 bytes,其余 4 项返 str——串联契约</text>
<text x="50" y="446" font-family="sans-serif" font-size="12.5" fill="#1e293b" font-weight="bold">结论:add_stages 是 BaseBackend 的抽象钩子——本图只给 5 级骨架全貌,</text>
<text x="50" y="468" font-family="sans-serif" font-size="12.5" fill="#1e293b" font-weight="bold">每个 make_xxx 内部具体跑哪些 pass 是后续章节的内容,不同后端可填不同 stages。</text>
</svg>