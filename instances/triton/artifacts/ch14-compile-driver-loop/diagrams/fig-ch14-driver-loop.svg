<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1108.0 1032">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker><marker id="g" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#15803d"/></marker><marker id="o" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#b45309"/></marker></defs>
<rect width="1108.0" height="1032" fill="white"/>
<text x="70" y="38" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">compile() 驱动主循环：未命中沿 stages 逐级降级并落盘，命中直接跳过全部 pass</text>
<rect x="188.0" y="74" width="460" height="60" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/>
<circle cx="210.0" cy="94" r="15" fill="#1d4ed8"/>
<text x="210.0" y="99" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="white">①</text>
<text x="432.0" y="94" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">拼缓存键(5 段拼接)</text>
<text x="432.0" y="109" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">查磁盘缓存</text>
<text x="418.0" y="124" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">key=triton_key()-src.hash()-backend.hash()-options.hash()-env_vars</text>
<line x1="418.0" y1="194" x2="418.0" y2="168" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
<polygon points="418.0,168 466.0,216.0 418.0,264 370.0,216.0" fill="#e2e8f0" stroke="#475569" stroke-width="1.6"/>
<text x="418.0" y="220.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">磁盘命中?</text>
<line x1="466.0" y1="216.0" x2="748.0" y2="216.0" stroke="#15803d" stroke-width="2" marker-end="url(#g)"/>
<text x="607.0" y="206.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#15803d">命中</text>
<rect x="748.0" y="187.0" width="300" height="58" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
<text x="898.0" y="210.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#15803d">跳过全部 pass</text>
<text x="898.0" y="230.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#166534">直接从磁盘反序列化 CompiledKernel</text>
<line x1="418.0" y1="264" x2="418.0" y2="298" stroke="#b45309" stroke-width="2" marker-end="url(#o)"/>
<text x="430.0" y="283.0" font-family="sans-serif" font-size="12" font-weight="bold" fill="#b45309">未命中</text>
<rect x="188.0" y="298" width="460" height="60" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/>
<circle cx="210.0" cy="318" r="15" fill="#1d4ed8"/>
<text x="210.0" y="323" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="white">②</text>
<text x="432.0" y="314" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">make_backend(target)</text>
<text x="432.0" y="329" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">选唯一后端</text>
<text x="418.0" y="349" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">target=cuda -&gt; CUDABackend(唯一,恰好 1 个)</text>
<line x1="418.0" y1="358" x2="418.0" y2="388" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="188.0" y="392" width="460" height="60" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/>
<circle cx="210.0" cy="412" r="15" fill="#1d4ed8"/>
<text x="210.0" y="417" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="white">③</text>
<text x="432.0" y="408" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">backend.add_stages(stages={})</text>
<text x="432.0" y="423" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">填有序 stages 字典</text>
<text x="418.0" y="443" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">插入 5 级:ttir-&gt;ttgir-&gt;llir-&gt;ptx-&gt;cubin</text>
<line x1="418.0" y1="452" x2="418.0" y2="482" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="188.0" y="486" width="460" height="60" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/>
<circle cx="210.0" cy="506" r="15" fill="#1d4ed8"/>
<text x="210.0" y="511" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="white">④</text>
<text x="432.0" y="506" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">src.make_ir 造起点 module</text>
<text x="418.0" y="537" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">first_stage=0(ASTSource 从 ttir 起步)</text>
<line x1="418.0" y1="546" x2="418.0" y2="576" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="188.0" y="580" width="460" height="60" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.6"/>
<circle cx="210.0" cy="600" r="15" fill="#4338ca"/>
<text x="210.0" y="605" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="white">⑤</text>
<text x="432.0" y="596" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">逐级 compile_ir 降级 + 落盘</text>
<text x="432.0" y="611" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">(展开见下方 5 级小链)</text>
<text x="418.0" y="631" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">for ext, compile_ir in stages[first_stage:]</text>
<line x1="418.0" y1="640" x2="418.0" y2="742" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="70.0" y="654" width="128" height="58" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="1.6"/>
