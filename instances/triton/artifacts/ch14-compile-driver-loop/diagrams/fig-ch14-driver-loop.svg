<text x="134.0" y="689" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#334155">make_ttir</text>
<text x="134.0" y="703" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#64748b">-&gt; name.ttir</text>
<rect x="212.0" y="654" width="128" height="58" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="1.6"/>
<text x="276.0" y="674" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#4338ca">ttgir</text>
<text x="276.0" y="689" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#334155">make_ttgir</text>
<text x="276.0" y="703" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#64748b">-&gt; name.ttgir</text>
<line x1="198.0" y1="683.0" x2="212.0" y2="683.0" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="354.0" y="654" width="128" height="58" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="1.6"/>
<text x="418.0" y="674" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#4338ca">llir</text>
<text x="418.0" y="689" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#334155">make_llir</text>
<text x="418.0" y="703" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#64748b">-&gt; name.llir</text>
<line x1="340.0" y1="683.0" x2="354.0" y2="683.0" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="496.0" y="654" width="128" height="58" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="1.6"/>
<text x="560.0" y="674" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#4338ca">ptx</text>
<text x="560.0" y="689" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#334155">make_ptx</text>
<text x="560.0" y="703" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#64748b">-&gt; name.ptx</text>
<line x1="482.0" y1="683.0" x2="496.0" y2="683.0" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="638.0" y="654" width="128" height="58" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
<text x="702.0" y="674" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#b45309">cubin</text>
<text x="702.0" y="689" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#334155">make_cubin</text>
<text x="702.0" y="703" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#64748b">-&gt; name.cubin(bytes)</text>
<line x1="624.0" y1="683.0" x2="638.0" y2="683.0" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="188.0" y="746" width="460" height="60" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/>
<circle cx="210.0" cy="766" r="15" fill="#1d4ed8"/>
<text x="210.0" y="771" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="white">⑥</text>
<text x="432.0" y="766" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">metadata 写回 + put_group</text>
<text x="418.0" y="797" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">编译产物写入磁盘缓存目录</text>
<line x1="418.0" y1="806" x2="418.0" y2="856" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M 898.0,245.0 L 898.0,824 L 608.0,824 L 608.0,856" fill="none" stroke="#15803d" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#g)"/>
<rect x="188.0" y="860" width="460" height="52" rx="12" fill="#0f172a" stroke="#0f172a"/>
<text x="418.0" y="882" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="white">返回 CompiledKernel</text>
<text x="418.0" y="900" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#cbd5e1">两条路径唯一交汇点</text>
<text x="70" y="946" font-family="sans-serif" font-size="12" fill="#334155">5 级降级链固定(ttir/ttgir/llir/ptx/cubin)；first_stage=0(ASTSource 从 ttir 起步)，全 5 级皆跑</text>
<text x="70" y="966" font-family="sans-serif" font-size="11" fill="#64748b">蓝=主线固定工序；紫=展开态(逐级 compile_ir)；橙=末级 cubin(唯一返 bytes)；绿=命中捷径(跳过全部 pass)</text>
</svg>