<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 921.4999999999999 508">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker></defs>
<rect width="921.4999999999999" height="508" fill="white"/>
<text x="40" y="36" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">triton_key 内容寻址:改编译器源码任一行,指纹翻转,全部 kernel 磁盘缓存失效</text>
<text x="225.37499999999997" y="88" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e40af">基线:未改动</text>
<rect x="60.0" y="118" width="330.74999999999994" height="68" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
<text x="225.37499999999997" y="148.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#0f172a">枚举 19 项(frontend 1+compiler 5</text>
<text x="225.37499999999997" y="166.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#0f172a">+backends 3+language 9+so 1)</text>
<line x1="225.37499999999997" y1="186" x2="225.37499999999997" y2="202" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="60.0" y="206" width="330.74999999999994" height="50" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
<text x="225.37499999999997" y="236.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#0f172a">逐项 sha256,'-' 拼接</text>
<line x1="225.37499999999997" y1="256" x2="225.37499999999997" y2="272" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="60.0" y="276" width="330.74999999999994" height="50" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
<text x="225.37499999999997" y="306.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#0f172a">得基线指纹 fingerprint_before</text>
<text x="696.1249999999999" y="88" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#b45309">改动后:1 个文件改 1 行</text>
<rect x="530.7499999999999" y="118" width="330.74999999999994" height="50" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
<text x="696.1249999999999" y="148.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#0f172a">同样枚举 19 项</text>
<line x1="696.1249999999999" y1="168" x2="696.1249999999999" y2="184" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="530.7499999999999" y="188" width="330.74999999999994" height="50" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="696.1249999999999" y="218.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#92400e">其中 1 项(code_generator.py)hash 变</text>
<line x1="696.1249999999999" y1="238" x2="696.1249999999999" y2="254" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="530.7499999999999" y="258" width="330.74999999999994" height="50" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
<text x="696.1249999999999" y="288.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#0f172a">拼接串随之整串变</text>
<line x1="696.1249999999999" y1="308" x2="696.1249999999999" y2="324" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="530.7499999999999" y="328" width="330.74999999999994" height="50" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
<text x="696.1249999999999" y="358.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#0f172a">fingerprint_after != fingerprint_before</text>
<line x1="420.74999999999994" y1="213.0" x2="500.74999999999994" y2="213.0" stroke="#d97706" stroke-width="2.5" marker-end="url(#a)"/>
<text x="460.74999999999994" y="201.0" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#d97706">编译器源码变 1 行</text>
<text x="40" y="424" font-family="sans-serif" font-size="12.5" fill="#1e293b" font-weight="bold">结论:triton_key 按编译器身份内容寻址,不看版本号——改 1/19 项即触发全部 kernel 磁盘缓存集体 miss、必重编。</text>
<text x="40" y="446" font-family="sans-serif" font-size="11" fill="#64748b">与按实参特化的内存 launch 缓存键(另一章)正交——那把键管的是同一 kernel 不同实参,这把键管的是编译器本身变没变。</text>
</svg>