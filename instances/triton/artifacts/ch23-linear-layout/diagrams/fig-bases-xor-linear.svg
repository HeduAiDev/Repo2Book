<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker></defs>
<rect width="1000" height="680" fill="white"/>
<text x="36" y="36" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">bases + xor 线性律:布局-向量乘 = 选列异或;换一组 base = 换一种布局</text>
<text x="36" y="56" font-family="sans-serif" font-size="12" fill="#64748b">GF(2):加法=xor、乘法=按位 and  ——  include/triton/Tools/LinearLayout.h:218-259</text>
<text x="36" y="80" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e40af">① 输入 x=6=0b0110 只挑第 2、3 列(bit=1 的列)再异或</text>
<rect x="144.0" y="106" width="160" height="64" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="224.0" y="126" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">col1 (base=1)</text>
<text x="224.0" y="148" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#94a3b8">bit=0  (跳过)</text>
<rect x="328.0" y="106" width="160" height="64" rx="8" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
<text x="408.0" y="126" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">col2 (base=2)</text>
<text x="408.0" y="148" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1e3a8a">bit=1  ← 挑中</text>
<line x1="408.0" y1="170" x2="500.0" y2="240" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#a)" opacity="0.75"/>
<rect x="512.0" y="106" width="160" height="64" rx="8" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
<text x="592.0" y="126" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">col3 (base=14)</text>
<text x="592.0" y="148" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1e3a8a">bit=1  ← 挑中</text>
<line x1="592.0" y1="170" x2="500.0" y2="240" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#a)" opacity="0.75"/>
<rect x="696.0" y="106" width="160" height="64" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="776.0" y="126" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">col4 (base=12)</text>
<text x="776.0" y="148" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#94a3b8">bit=0  (跳过)</text>
<rect x="400.0" y="240" width="200" height="54" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="500.0" y="262" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#14532d">全部异或(xor)</text>
<text x="500.0" y="281" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#14532d">2 ⊕ 14 = 12</text>
<text x="36" y="316" font-family="sans-serif" font-size="12" fill="#334155">(1×0) ⊕ (2×1) ⊕ (14×1) ⊕ (12×0) = 2 ⊕ 14 = 12</text>
<text x="36" y="340" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e40af">② 换一组 base = 换一种布局(bases 即 L 在 2 幂次点的取值)</text>
<rect x="36" y="370" width="320" height="46" rx="6" fill="#3b82f6" opacity="0.12" stroke="#3b82f6" stroke-width="1.5"/>
<text x="48" y="397.0" font-family="sans-serif" font-size="12" font-weight="bold" fill="#3b82f6">1D 恒等(8 元素)</text>
<text x="376" y="397.0" font-family="sans-serif" font-size="12" fill="#0f172a">bases = [L(1), L(2), L(4)] = [1, 2, 4]</text>
<rect x="36" y="430" width="320" height="46" rx="6" fill="#94a3b8" opacity="0.12" stroke="#94a3b8" stroke-width="1.5"/>
<text x="48" y="457.0" font-family="sans-serif" font-size="12" font-weight="bold" fill="#94a3b8">1D 全零(整维压扁)</text>
<text x="376" y="457.0" font-family="sans-serif" font-size="12" fill="#0f172a">bases = [0, 0, 0]</text>
<rect x="36" y="490" width="320" height="46" rx="6" fill="#7c3aed" opacity="0.12" stroke="#7c3aed" stroke-width="1.5"/>
<text x="48" y="517.0" font-family="sans-serif" font-size="12" font-weight="bold" fill="#7c3aed">2D→2D 转置(对调每个 base 分量)</text>
<text x="376" y="517.0" font-family="sans-serif" font-size="12" fill="#0f172a">L(0,1)=(1,0)  L(0,2)=(2,0)  L(1,0)=(0,1)  L(2,0)=(0,2)</text>
<rect x="36" y="550" width="320" height="46" rx="6" fill="#059669" opacity="0.12" stroke="#059669" stroke-width="1.5"/>
<text x="48" y="577.0" font-family="sans-serif" font-size="12" font-weight="bold" fill="#059669">2D→1D broadcast(L(x,y)=x,y 维 base 置 0)</text>
<text x="376" y="577.0" font-family="sans-serif" font-size="12" fill="#0f172a">L(0,1)=0  L(0,2)=0  L(1,0)=1  L(2,0)=2</text>
<text x="36" y="650" font-family="sans-serif" font-size="12" fill="#334155">在 GF(2) 上(加=xor、乘=and),布局-向量乘 = 按输入 1-bit 挑 base 列再全部异或;</text>
<text x="36" y="668" font-family="sans-serif" font-size="12" fill="#334155">bases 就是 L 在 2 幂次点的取值——换一组 base 就换一种布局(恒等/转置/broadcast 只是不同 base)。</text>
</svg>