<text x="911.0" y="279.8" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">invertAndCompose</text>
<text x="911.0" y="297.0" text-anchor="middle" font-family="sans-serif" font-size="9.3" fill="#64748b">拼接 [outer|this] 做一次</text>
<text x="911.0" y="311.5" text-anchor="middle" font-family="sans-serif" font-size="9.3" fill="#64748b">f2reduce RREF:左半单位阵=求逆</text>
