<text x="239.0" y="445.0" text-anchor="middle" font-family="sans-serif" font-size="9.3" fill="#64748b">同一个 RREF 调用:数非零行=秩,判满射</text>
<text x="239.0" y="459.5" text-anchor="middle" font-family="sans-serif" font-size="9.3" fill="#64748b">/单射</text>
