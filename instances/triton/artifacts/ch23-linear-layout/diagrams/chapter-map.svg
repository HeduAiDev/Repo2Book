<text x="239.0" y="279.8" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">GF(2):加=xor 乘=and</text>
<text x="239.0" y="297.0" text-anchor="middle" font-family="sans-serif" font-size="9.3" fill="#64748b">L(a)=Ba,bases 就是矩阵 B 的列(定理</text>
<text x="239.0" y="311.5" text-anchor="middle" font-family="sans-serif" font-size="9.3" fill="#64748b">而非约定)</text>
<rect x="310.0" y="251.0" width="30" height="18" rx="9.0" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
<text x="325.0" y="263.8" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#4338ca">§5</text>
