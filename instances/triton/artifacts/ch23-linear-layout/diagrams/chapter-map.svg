<text x="239.0" y="131.8" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">转换代码 O(K²)</text>
<text x="239.0" y="149.0" text-anchor="middle" font-family="sans-serif" font-size="9.3" fill="#64748b">每对布局各写一套转换代码,种类一多按平</text>
<text x="239.0" y="163.5" text-anchor="middle" font-family="sans-serif" font-size="9.3" fill="#64748b">方增长</text>
<rect x="310.0" y="103.0" width="30" height="18" rx="9.0" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
<text x="325.0" y="115.8" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#4338ca">§1</text>
<rect x="368.0" y="112.0" width="190" height="66" rx="12" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<text x="463.0" y="131.8" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">L: 硬件位置→逻辑索引</text>
<text x="463.0" y="149.0" text-anchor="middle" font-family="sans-serif" font-size="9.3" fill="#64748b">换方向保函数性:一对多的一侧放进定义域</text>
<text x="463.0" y="163.5" text-anchor="middle" font-family="sans-serif" font-size="9.3" fill="#64748b">(broadcast)</text>
<rect x="534.0" y="103.0" width="30" height="18" rx="9.0" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
<text x="549.0" y="115.8" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#4338ca">§2</text>
<rect x="592.0" y="112.0" width="190" height="66" rx="12" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<text x="687.0" y="131.8" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">bases 基向量</text>
<text x="687.0" y="149.0" text-anchor="middle" font-family="sans-serif" font-size="9.3" fill="#64748b">只需给出 2 的幂次输入点上的取值,其余</text>
<text x="687.0" y="163.5" text-anchor="middle" font-family="sans-serif" font-size="9.3" fill="#64748b">全推出</text>
<rect x="758.0" y="103.0" width="30" height="18" rx="9.0" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
