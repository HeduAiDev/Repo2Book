<text x="687.0" y="279.8" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">compose</text>
<text x="687.0" y="297.0" text-anchor="middle" font-family="sans-serif" font-size="9.3" fill="#64748b">O∘L:把 this 的每个 base 喂给</text>
<text x="687.0" y="311.5" text-anchor="middle" font-family="sans-serif" font-size="9.3" fill="#64748b">outer 求值即得复合</text>
<rect x="758.0" y="251.0" width="30" height="18" rx="9.0" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
<text x="773.0" y="263.8" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#4338ca">§7</text>
