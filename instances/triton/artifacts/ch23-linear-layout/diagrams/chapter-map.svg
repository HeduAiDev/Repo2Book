<text x="911.0" y="131.8" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">4×4 swizzle 填表</text>
<text x="911.0" y="149.0" text-anchor="middle" font-family="sans-serif" font-size="9.3" fill="#64748b">xor 线性律 L(a⊕b)=L(a)⊕L(b),亲手</text>
<text x="911.0" y="163.5" text-anchor="middle" font-family="sans-serif" font-size="9.3" fill="#64748b">验算认出 (t,w⊕t)</text>
<rect x="982.0" y="103.0" width="30" height="18" rx="9.0" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
<text x="997.0" y="115.8" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#4338ca">§4</text>
