<text x="463.0" y="279.8" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">getMatrix</text>
<text x="463.0" y="297.0" text-anchor="middle" font-family="sans-serif" font-size="9.3" fill="#64748b">把布局压成比特矩阵,每列一个 base、每</text>
<text x="463.0" y="311.5" text-anchor="middle" font-family="sans-serif" font-size="9.3" fill="#64748b">行一 uint64_t</text>
<rect x="534.0" y="251.0" width="30" height="18" rx="9.0" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
<text x="549.0" y="263.8" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#4338ca">§6</text>
