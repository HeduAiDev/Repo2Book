<text x="352" y="388" font-family="sans-serif" font-size="11" font-weight="bold" fill="#334155">推导算式(GF(2) 异或 = xor):</text>
<text x="352" y="406" font-family="sans-serif" font-size="11" fill="#065f46">L(0,0)=L(1,0)⊕L(1,0)=(1,1)⊕(1,1)=(0,0)</text>
<text x="352" y="422" font-family="sans-serif" font-size="11" fill="#065f46">L(0,3)=L(0,2)⊕L(0,1)=(0,2)⊕(0,1)=(0,3)</text>
<text x="352" y="438" font-family="sans-serif" font-size="11" fill="#065f46">L(3,0)=L(2,0)⊕L(1,0)=(2,2)⊕(1,1)=(3,3)</text>
<text x="352" y="454" font-family="sans-serif" font-size="11" fill="#065f46">L(3,3)=L(3,0)⊕L(0,3)=(3,3)⊕(0,3)=(3,0)</text>
<text x="668" y="388" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155">认出的身份:</text>
<text x="668" y="414" font-family="sans-serif" font-size="15" font-weight="bold" fill="#a16207">(t, w) ↦ (t, w ⊕ t)</text>
<text x="668" y="434" font-family="sans-serif" font-size="11" fill="#64748b">16 格全部吻合此公式</text>
<rect x="36" y="462" width="14" height="14" rx="3" fill="#bfdbfe" stroke="#1d4ed8"/>
<text x="56" y="474" font-family="sans-serif" font-size="11" fill="#334155">已知 base(输入点)</text>
<rect x="178" y="462" width="14" height="14" rx="3" fill="#bbf7d0" stroke="#047857"/>
<text x="198" y="474" font-family="sans-serif" font-size="11" fill="#334155">手动异或推导(4 格示例)</text>
<rect x="328" y="462" width="14" height="14" rx="3" fill="#fef9c3" stroke="#a16207"/>
<text x="348" y="474" font-family="sans-serif" font-size="11" fill="#334155">由异或律推满(其余 8 格)</text>
<rect x="486" y="462" width="14" height="14" rx="3" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="506" y="474" font-family="sans-serif" font-size="11" fill="#334155">尚未推导</text>
<text x="36" y="496" font-family="sans-serif" font-size="12" fill="#0f172a">4 个 base + 一条异或律 L(a⊕b)=L(a)⊕L(b),把 4×4 表的 16 格全部填满,认出经典 swizzle (t,w)↦(t,w⊕t)——一个专门公式坍缩成 4 个基向量。</text>
</svg>