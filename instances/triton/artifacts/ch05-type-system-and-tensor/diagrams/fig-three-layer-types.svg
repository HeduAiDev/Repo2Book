<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 480">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker></defs>
<rect width="1150" height="480" fill="white"/>
<text x="40" y="32" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">三层类型体系：dtype 被 pointer_type / block_type 各包一层 element_ty</text>
<text x="40" y="56" font-family="sans-serif" font-size="13" fill="#64748b">三者都实现 to_ir()，逐层下降到 builder.get_*_ty —— 内层先降，外层再套壳</text>
<rect x="40" y="148" width="220" height="90" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="150.0" y="176" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">dtype</text>
<text x="150.0" y="198" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1e40af">标量类型，例：fp32</text>
<text x="150.0" y="218" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1e40af">primitive_bitwidth = 32</text>
<rect x="370" y="118" width="330" height="118" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="535.0" y="144" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#14532d">pointer_type（第二层）</text>
<text x="390" y="168" font-family="sans-serif" font-size="12" fill="#166534">element_ty = dtype（如 fp32）</text>
<text x="390" y="190" font-family="sans-serif" font-size="12" fill="#166534">address_space（默认）= 1</text>
<text x="390" y="212" font-family="sans-serif" font-size="12" fill="#166534">to_ir() → builder.get_ptr_ty(...)</text>
<rect x="370" y="292" width="330" height="118" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="535.0" y="318" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#78350f">block_type（第三层）</text>
<text x="390" y="342" font-family="sans-serif" font-size="12" fill="#92400e">element_ty = dtype（如 fp32）+ shape</text>
<text x="390" y="364" font-family="sans-serif" font-size="12" fill="#92400e">validate_block_shape：numel ≤ 1048576</text>
<text x="390" y="386" font-family="sans-serif" font-size="12" fill="#92400e">.scalar 属性 → element_ty</text>
<line x1="260" y1="193.0" x2="362" y2="177.0" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="260" y1="193.0" x2="362" y2="351.0" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="810" y="147.0" width="300" height="60" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
<text x="960.0" y="171.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">builder.get_ptr_ty(elem, addr_space)</text>
<text x="960.0" y="191.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">IR 指针类型（element_ty 先递归下降）</text>
<line x1="700" y1="177.0" x2="802" y2="177.0" stroke="#15803d" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="810" y="321.0" width="300" height="60" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
<text x="960.0" y="345.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">builder.get_block_ty(elem, shape)</text>
<text x="960.0" y="365.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">IR 块类型（shape 已通过 numel 校验）</text>
<line x1="700" y1="351.0" x2="802" y2="351.0" stroke="#b45309" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="40" y="446" width="16" height="16" rx="3" fill="#dbeafe" stroke="#1d4ed8"/>
<text x="62" y="459" font-family="sans-serif" font-size="12" fill="#334155">dtype 标量</text>
<rect x="186" y="446" width="16" height="16" rx="3" fill="#dcfce7" stroke="#15803d"/>
<text x="208" y="459" font-family="sans-serif" font-size="12" fill="#334155">pointer_type</text>
<rect x="380" y="446" width="16" height="16" rx="3" fill="#fef3c7" stroke="#b45309"/>
<text x="402" y="459" font-family="sans-serif" font-size="12" fill="#334155">block_type</text>
<rect x="550" y="446" width="16" height="16" rx="3" fill="#f1f5f9" stroke="#475569"/>
<text x="572" y="459" font-family="sans-serif" font-size="12" fill="#334155">to_ir() 下降结果</text>
</svg>