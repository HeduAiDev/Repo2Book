<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 466">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker></defs>
<rect width="1360" height="466" fill="white"/>
<text x="40" y="42" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">tensor 解剖：只有 2 个真字段，其余全是派生只读视图</text>
<text x="40" y="66" font-family="sans-serif" font-size="13" fill="#64748b">数值本身不在这张图里——它在 IR / 寄存器里；tensor 只是指向它的把手</text>
<rect x="100" y="140" width="340" height="190" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
<text x="270.0" y="170" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1e3a8a">tensor 对象（真字段 ×2）</text>
<rect x="120" y="190" width="300" height="56" rx="6" fill="white" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="140" y="214" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e3a8a">handle</text>
<text x="140" y="236" font-family="sans-serif" font-size="11.5" fill="#334155">IR 里某个 SSA 值 —— 真实数值所在</text>
<rect x="120" y="258" width="300" height="56" rx="6" fill="white" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="140" y="282" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e3a8a">type</text>
<text x="140" y="304" font-family="sans-serif" font-size="11.5" fill="#334155">这个 SSA 值的类型（可以是 block_type）</text>
<rect x="570" y="160" width="320" height="100" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.8"/>
<text x="730.0" y="188" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#0f172a">示例：block_type(fp16, [128, 64])</text>
<text x="730.0" y="212" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">element_ty = fp16，shape = [128, 64]</text>
<text x="730.0" y="236" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">3 个视图都从这个 type 现算，不额外存字段</text>
<line x1="440" y1="286" x2="562" y2="210.0" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="1020" y="90" width="300" height="78" rx="9" fill="#fdf4ff" stroke="#a21caf" stroke-width="1.6" stroke-dasharray="5,4"/>
<text x="1038" y="114" font-family="sans-serif" font-size="13" font-weight="bold" fill="#86198f">shape（派生）</text>
<text x="1038" y="136" font-family="sans-serif" font-size="12" fill="#0f172a">shape = [constexpr(128), constexpr(64)]</text>
<text x="1038" y="154" font-family="sans-serif" font-size="10.5" fill="#64748b">block_type.shape，逐元素裹 constexpr</text>
<line x1="890" y1="210.0" x2="1012" y2="129.0" stroke="#a21caf" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#a)"/>
<rect x="1020" y="194" width="300" height="78" rx="9" fill="#fdf4ff" stroke="#a21caf" stroke-width="1.6" stroke-dasharray="5,4"/>
<text x="1038" y="218" font-family="sans-serif" font-size="13" font-weight="bold" fill="#86198f">numel（派生）</text>
<text x="1038" y="240" font-family="sans-serif" font-size="12" fill="#0f172a">numel = 128 × 64 = 8192</text>
<text x="1038" y="258" font-family="sans-serif" font-size="10.5" fill="#64748b">shape 各维之积</text>
<line x1="890" y1="210.0" x2="1012" y2="233.0" stroke="#a21caf" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#a)"/>
<rect x="1020" y="298" width="300" height="78" rx="9" fill="#fdf4ff" stroke="#a21caf" stroke-width="1.6" stroke-dasharray="5,4"/>
<text x="1038" y="322" font-family="sans-serif" font-size="13" font-weight="bold" fill="#86198f">dtype（派生）</text>
<text x="1038" y="344" font-family="sans-serif" font-size="12" fill="#0f172a">dtype = type.scalar</text>
<text x="1038" y="362" font-family="sans-serif" font-size="10.5" fill="#64748b">block_type 剥到最里层的标量 dtype</text>
<line x1="890" y1="210.0" x2="1012" y2="337.0" stroke="#a21caf" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#a)"/>
<rect x="40" y="420" width="16" height="16" rx="3" fill="#dbeafe" stroke="#1d4ed8"/>
<text x="62" y="433" font-family="sans-serif" font-size="12" fill="#334155">真字段（handle / type）</text>
<rect x="312" y="420" width="16" height="16" rx="3" fill="#f1f5f9" stroke="#475569"/>
<text x="334" y="433" font-family="sans-serif" font-size="12" fill="#334155">type 具体取值示例</text>
<rect x="500" y="420" width="16" height="16" rx="3" fill="#fdf4ff" stroke="#a21caf" stroke-dasharray="5,4"/>
<text x="522" y="433" font-family="sans-serif" font-size="12" fill="#334155">派生只读视图（虚线=非独立存储）</text>
</svg>