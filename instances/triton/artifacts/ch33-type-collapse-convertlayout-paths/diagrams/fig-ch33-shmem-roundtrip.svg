<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 845 768">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker></defs>
<rect width="845" height="768" fill="white"/>
<text x="40" y="30" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">共享内存往返:store-&gt;barrier-&gt;load(最贵路径)</text>
<text x="40" y="50" font-family="sans-serif" font-size="12" fill="#64748b">构造示例:inVals=8,iterations=2,inVec=outVec=2(ConvertLayoutOpToLLVM.cpp:L606-L644)</text>
<rect x="55" y="60" width="190" height="28" rx="6" fill="#e2e8f0" stroke="#64748b"/>
<text x="150" y="79" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">各线程(寄存器)</text>
<line x1="150" y1="90" x2="150" y2="688" stroke="#94a3b8" stroke-dasharray="4,4"/>
<rect x="615" y="60" width="190" height="28" rx="6" fill="#e2e8f0" stroke="#64748b"/>
<text x="710" y="79" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">Shared Memory scratch</text>
<line x1="710" y1="90" x2="710" y2="688" stroke="#94a3b8" stroke-dasharray="4,4"/>
<text x="10" y="134" font-family="sans-serif" font-size="11" font-weight="bold" fill="#64748b">迭代 0</text>
<line x1="150" y1="130" x2="710" y2="130" stroke="#b45309" stroke-width="2" marker-end="url(#a)"/>
<text x="430.0" y="122" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b45309">store x2 op(4 元素,inVec=2)</text>
<line x1="110" y1="192" x2="750" y2="192" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6,4"/>
<text x="430.0" y="184" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#b91c1c">barrier(bar.sync) — 累计 1</text>
<line x1="710" y1="254" x2="150" y2="254" stroke="#0369a1" stroke-width="2" marker-end="url(#a)"/>
<text x="430.0" y="246" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0369a1">load x2 op(4 元素,outVec=2)</text>
<text x="10" y="320" font-family="sans-serif" font-size="11" font-weight="bold" fill="#64748b">迭代 1</text>
<line x1="110" y1="316" x2="750" y2="316" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6,4"/>
<text x="430.0" y="308" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#b91c1c">barrier(迭代 1 开头,i!=0) — 累计 2</text>
<line x1="150" y1="378" x2="710" y2="378" stroke="#b45309" stroke-width="2" marker-end="url(#a)"/>
<text x="430.0" y="370" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b45309">store x2 op(4 元素,inVec=2)</text>
<line x1="110" y1="440" x2="750" y2="440" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6,4"/>
<text x="430.0" y="432" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#b91c1c">barrier(bar.sync) — 累计 3</text>
<line x1="710" y1="502" x2="150" y2="502" stroke="#0369a1" stroke-width="2" marker-end="url(#a)"/>
<text x="430.0" y="494" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0369a1">load x2 op(4 元素,outVec=2)</text>
<rect x="585" y="574" width="250" height="64" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/>
<text x="710" y="593" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#5b21b6">padding=2(防 bank 冲突)</text>
<text x="710" y="610" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5b21b6">outOrd[0] 加 max(inVec,outVec)</text>
<text x="710" y="627" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#5b21b6">Shared Memory:32 个 bank,每 bank 4 字节</text>
<text x="40" y="668" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">合计:8 元素 store + 8 元素 load + 3 次 barrier (2xiterations-1)</text>
<text x="40" y="688" font-family="sans-serif" font-size="11" fill="#64748b">store 端地址=srcLayout.invertAndCompose(sharedLayout)(L514)</text>
<text x="40" y="706" font-family="sans-serif" font-size="11" fill="#64748b">load 端地址=dstLayout.invertAndCompose(sharedLayout)(L523)</text>
</svg>