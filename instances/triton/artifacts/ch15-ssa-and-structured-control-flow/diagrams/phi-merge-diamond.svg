<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 522">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker></defs>
<rect width="880" height="522" fill="white"/>
<text x="40" y="24" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a">x₃ = φ(x₁, x₂)：if/else 汇合处按前驱选值</text>
<text x="40" y="42" font-family="sans-serif" font-size="12" fill="#475569">前驱数 n=2 → φ 携 2 个实参；运行时走 1 条前驱 → 选出 1 个值</text>
<rect x="70.0" y="66" width="200" height="64" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="1.6"/>
<text x="170.0" y="94.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">entry: if cond</text>
<text x="170.0" y="112.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="normal" fill="#0f172a">(cond=True → then, False → else)</text>
<rect x="40" y="200" width="200" height="64" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
<text x="140.0" y="228.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">then 块 P1</text>
<text x="140.0" y="246.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="normal" fill="#0f172a">x₁ = a = 5</text>
<rect x="300" y="200" width="200" height="64" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
<text x="400.0" y="228.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">else 块 P2</text>
<text x="400.0" y="246.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="normal" fill="#0f172a">x₂ = b = 7</text>
<rect x="70.0" y="354" width="200" height="88" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
<text x="170.0" y="385.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">merge 块</text>
<text x="170.0" y="403.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="normal" fill="#0f172a">φ: x₃ = φ(x₁, x₂)</text>
<text x="170.0" y="421.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="normal" fill="#0f172a">（按走哪条前驱选值）</text>
<line x1="120.0" y1="130" x2="140.0" y2="200" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
<text x="116.0" y="165.0" text-anchor="end" font-family="sans-serif" font-size="11" fill="#334155">cond=True</text>
<line x1="220.0" y1="130" x2="400.0" y2="200" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
<text x="324.0" y="165.0" text-anchor="start" font-family="sans-serif" font-size="11" fill="#334155">cond=False</text>
<line x1="140.0" y1="264" x2="120.0" y2="354" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a)"/>
<text x="122.0" y="303.0" text-anchor="end" font-family="sans-serif" font-size="11" fill="#1d4ed8">从 P1 取 x₁（第1实参）</text>
<line x1="400.0" y1="264" x2="220.0" y2="354" stroke="#dc2626" stroke-width="1.8" marker-end="url(#a)"/>
<text x="318.0" y="303.0" text-anchor="start" font-family="sans-serif" font-size="11" fill="#b91c1c">从 P2 取 x₂（第2实参）</text>
<text x="170.0" y="464" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">走 then → x₃=5　　走 else → x₃=7</text>
<rect x="550" y="190" width="280" height="252" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5,3"/>
<text x="566" y="216" font-family="sans-serif" font-size="12" font-weight="bold" fill="#7f1d1d">红线：</text>
<text x="566" y="236" font-family="sans-serif" font-size="12" font-weight="normal" fill="#7f1d1d">φ 是理解汇合语义的记号，</text>
<text x="566" y="256" font-family="sans-serif" font-size="12" font-weight="normal" fill="#7f1d1d">帮你想清值从哪来——</text>
<text x="566" y="276" font-family="sans-serif" font-size="12" font-weight="normal" fill="#7f1d1d">不是 Triton 要跑的算法。</text>
<text x="566" y="296" font-family="sans-serif" font-size="12" font-weight="normal" fill="#7f1d1d">MLIR 用块参数实现它，</text>
<text x="566" y="316" font-family="sans-serif" font-size="12" font-weight="normal" fill="#7f1d1d">Triton 用 AST scope 差集</text>
<text x="566" y="336" font-family="sans-serif" font-size="12" font-weight="normal" fill="#7f1d1d">构造它，全程不算</text>
<text x="566" y="356" font-family="sans-serif" font-size="12" font-weight="normal" fill="#7f1d1d">支配边界 / 最小 φ 插入。</text>
</svg>