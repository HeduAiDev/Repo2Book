<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 978">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker></defs>
<rect width="1220" height="978" fill="white"/>
<text x="40" y="26" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a">loop-carried = local_defs ∩ liveins：dry-run + scope 差集，不是 Cytron φ 放置算法</text>
<text x="40" y="46" font-family="sans-serif" font-size="12" fill="#475569">|liveins|=5（acc,m,N,k,…）、|local_defs|=3（acc,m,tmp）、|交集|=2 → init_args 长度=2</text>
<text x="40" y="137.0" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">第一趟</text>
<rect x="130" y="100" width="210" height="64" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
<text x="235.0" y="127" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">dry-run 循环体</text>
<text x="235.0" y="146" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">跑一遍循环体</text>
<line x1="340" y1="132.0" x2="382" y2="132.0" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="386" y="100" width="210" height="64" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
<text x="491.0" y="127" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">填 local_defs</text>
<text x="491.0" y="146" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">set_value 填充</text>
<line x1="596" y1="132.0" x2="638" y2="132.0" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="642" y="100" width="210" height="64" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
<text x="747.0" y="127" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">block.erase 擦除</text>
<text x="747.0" y="146" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">L971：丢弃试跑结果</text>
<text x="868" y="137.0" font-family="sans-serif" font-size="11" fill="#64748b">唯一目的：探循环体定义了哪些名字</text>
<text x="40" y="301.0" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">第二趟</text>
<rect x="130" y="264" width="210" height="64" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
<text x="235.0" y="291" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">取交集</text>
<text x="235.0" y="310" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">local_defs ∩ liveins</text>
<line x1="340" y1="296.0" x2="382" y2="296.0" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="386" y="264" width="210" height="64" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
<text x="491.0" y="291" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">create_for_op</text>
<text x="491.0" y="310" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">init_args，L990</text>
<line x1="596" y1="296.0" x2="638" y2="296.0" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="642" y="264" width="210" height="64" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
<text x="747.0" y="291" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">绑块参数 arg(i+1)</text>
<text x="747.0" y="310" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">L1002</text>
<text x="868" y="301.0" font-family="sans-serif" font-size="11" fill="#64748b">认出 loop-carried</text>
<path d="M 747.0,164 C 747.0,204 235.0,224 235.0,264" fill="none" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#a)"/>
<text x="610.0" y="366" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">两张点名册对照：只出现在两册中的名字才 loop-carried</text>
<text x="400.0" y="402" text-anchor="start" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2563eb">liveins（循环前已在场）</text>
<text x="820.0" y="402" text-anchor="end" font-family="sans-serif" font-size="12" font-weight="bold" fill="#16a34a">local_defs（循环体内点过名）</text>
<circle cx="520.0" cy="548" r="130" fill="#dbeafe" fill-opacity="0.55" stroke="#2563eb" stroke-width="1.8"/>
<circle cx="700.0" cy="548" r="130" fill="#bbf7d0" fill-opacity="0.55" stroke="#16a34a" stroke-width="1.8"/>
<text x="448.5" y="538" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1d4ed8">N, k</text>
<text x="448.5" y="560" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#1e3a8a">只读/归纳</text>
<text x="448.5" y="574" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#1e3a8a">不 carry</text>
<text x="610.0" y="538" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#7c2d12">acc, m</text>
<text x="610.0" y="560" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#9a3412">loop-carried</text>
<text x="610.0" y="574" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#9a3412">→ iter_arg</text>
<text x="771.5" y="538" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#15803d">tmp</text>
<text x="771.5" y="560" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#14532d">纯临时</text>
<text x="771.5" y="574" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#14532d">不 carry</text>
<text x="383.5" y="619.5" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">…</text>
<text x="610.0" y="748" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#0f172a">|交集|=2 loop-carried（acc,m）→ create_for_op(init_args) 长度=2 → 块参数 arg(1),arg(2)</text>
<rect x="40" y="778" width="1140" height="160" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5,3"/>
<text x="58" y="804" font-family="sans-serif" font-size="12" font-weight="bold" fill="#7f1d1d">红线：</text>
<text x="58" y="824" font-family="sans-serif" font-size="12" font-weight="normal" fill="#7f1d1d">全过程 = 一次 dry-run（跑一遍循环体）</text>
<text x="58" y="844" font-family="sans-serif" font-size="12" font-weight="normal" fill="#7f1d1d">+ 一次集合交，零支配边界计算——</text>
<text x="58" y="864" font-family="sans-serif" font-size="12" font-weight="normal" fill="#7f1d1d">因为 Python for/if 边界天然已知，</text>
<text x="58" y="884" font-family="sans-serif" font-size="12" font-weight="normal" fill="#7f1d1d">Triton 不需要 Cytron 算法在一般 CFG 上</text>
<text x="58" y="904" font-family="sans-serif" font-size="12" font-weight="normal" fill="#7f1d1d">求最小 φ 插入点。</text>
</svg>