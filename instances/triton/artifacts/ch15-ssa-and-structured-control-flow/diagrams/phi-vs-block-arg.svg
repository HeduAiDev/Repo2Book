<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 898 442">
<defs><marker id="solid" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker><marker id="dash" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#7c3aed"/></marker></defs>
<rect width="898" height="442" fill="white"/>
<text x="40" y="26" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a">φ「拉」与块参数「推」：同一 SSA 汇合语义的两种等价写法</text>
<text x="40" y="46" font-family="sans-serif" font-size="12" fill="#475569">then 传入值=5，else 传入值=7；前驱数 n=2 → 2 个 φ 实参 ↔ 2 条 terminator 各推 1 个实参</text>
<text x="202.0" y="82" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#6d28d9">φ：拉（回头选值）</text>
<rect x="40" y="96" width="150" height="60" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
<text x="115.0" y="122.5" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">then 块 P1</text>
<text x="115.0" y="139.5" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="normal" fill="#0f172a">x₁ = 5</text>
<rect x="214" y="96" width="150" height="60" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
<text x="289.0" y="122.5" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">else 块 P2</text>
<text x="289.0" y="139.5" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="normal" fill="#0f172a">x₂ = 7</text>
<rect x="100.75" y="248" width="202.5" height="64" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
<text x="202.0" y="276.5" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">merge 块头部</text>
<text x="202.0" y="293.5" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="normal" fill="#0f172a">x₃ = φ(x₁, x₂)</text>
<line x1="157.45" y1="248" x2="115.0" y2="156" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#dash)"/>
<line x1="246.54999999999998" y1="248" x2="289.0" y2="156" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#dash)"/>
<text x="128.225" y="202.0" text-anchor="end" font-family="sans-serif" font-size="11" fill="#6d28d9">问 P1 要 x₁</text>
<text x="275.775" y="202.0" text-anchor="start" font-family="sans-serif" font-size="11" fill="#6d28d9">问 P2 要 x₂</text>
<text x="696.0" y="82" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#334155">块参数：推（前驱主动传入）</text>
<rect x="534" y="96" width="150" height="60" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
<text x="609.0" y="122.5" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">then 块 P1</text>
<text x="609.0" y="139.5" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="normal" fill="#0f172a">x₁ = 5</text>
<rect x="708" y="96" width="150" height="60" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
<text x="783.0" y="122.5" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">else 块 P2</text>
<text x="783.0" y="139.5" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="normal" fill="#0f172a">x₂ = 7</text>
<rect x="594.75" y="248" width="202.5" height="64" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
<text x="696.0" y="276.5" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">merge 块（块参数）</text>
<text x="696.0" y="293.5" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="normal" fill="#0f172a">^merge(%x3: T)</text>
<line x1="609.0" y1="156" x2="651.45" y2="248" stroke="#334155" stroke-width="1.8" marker-end="url(#solid)"/>
<line x1="783.0" y1="156" x2="740.55" y2="248" stroke="#334155" stroke-width="1.8" marker-end="url(#solid)"/>
<text x="622.225" y="202.0" text-anchor="end" font-family="sans-serif" font-size="11" fill="#334155">br ^merge(5)</text>
<text x="769.775" y="202.0" text-anchor="start" font-family="sans-serif" font-size="11" fill="#334155">br ^merge(7)</text>
<text x="449.0" y="210.0" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#0f172a">=</text>
<text x="449.0" y="236.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">同一语义</text>
<text x="449.0" y="252.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">方向相反</text>
<text x="449.0" y="268.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">都是 SSA</text>
<text x="449.0" y="342" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">走 then 前驱 → 两写法均得 5　　走 else 前驱 → 两写法均得 7</text>
<rect x="40" y="354" width="818" height="30" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
<text x="449.0" y="374" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">Appel 1998：基本块 = 函数，块参数 = 形参，φ 各路来源 = 各调用点实参，跳转 = 尾调用</text>
</svg>