<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 550">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#6366f1"/></marker></defs>
<rect width="1060" height="550" fill="white"/>
<text x="40" y="40" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e40af">convert_to_ttgpuir 派生的三种布局(_attn_fwd)</text>
<text x="40" y="64" font-family="sans-serif" font-size="11.5" fill="#64748b">模块属性:ttg.num-warps=4, threads-per-warp=32, num-ctas=1, target=cuda:120(_attn_fwd.ttgir:L46)</text>
<rect x="40" y="132" width="300" height="158" rx="10" fill="#93c5fd" fill-opacity="0.22" stroke="#1d4ed8" stroke-width="2"/>
<text x="190.0" y="162" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1d4ed8">#blocked</text>
<text x="190.0" y="182" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">访存布局 · L1</text>
<text x="190.0" y="206" text-anchor="middle" font-family="monospace" font-size="12" fill="#0f172a">sizePerThread=[8,1]</text>
<text x="190.0" y="226" text-anchor="middle" font-family="monospace" font-size="12" fill="#0f172a">threadsPerWarp=[8,4]</text>
<text x="190.0" y="246" text-anchor="middle" font-family="monospace" font-size="12" fill="#0f172a">warpsPerCTA=[1,4]</text>
<text x="190.0" y="266" text-anchor="middle" font-family="monospace" font-size="12" fill="#0f172a">order=[0,1]</text>
<rect x="380" y="132" width="300" height="158" rx="10" fill="#c4b5fd" fill-opacity="0.22" stroke="#6d28d9" stroke-width="2"/>
<text x="530.0" y="162" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#6d28d9">#mma</text>
<text x="530.0" y="182" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">Tensor Core 布局 · L11</text>
<text x="530.0" y="206" text-anchor="middle" font-family="monospace" font-size="12" fill="#0f172a">nvidia_mma versionMajor=2</text>
<text x="530.0" y="226" text-anchor="middle" font-family="monospace" font-size="12" fill="#0f172a">warpsPerCTA=[4,1]</text>
<text x="530.0" y="246" text-anchor="middle" font-family="monospace" font-size="12" fill="#0f172a">instrShape=[16,8]</text>
<rect x="720" y="132" width="300" height="158" rx="10" fill="#86efac" fill-opacity="0.22" stroke="#15803d" stroke-width="2"/>
<text x="870.0" y="162" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#15803d">#shared</text>
<text x="870.0" y="182" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">共享内存布局 · L12</text>
<text x="870.0" y="206" text-anchor="middle" font-family="monospace" font-size="12" fill="#0f172a">swizzled_shared vec=8</text>
<text x="870.0" y="226" text-anchor="middle" font-family="monospace" font-size="12" fill="#0f172a">perPhase=1, maxPhase=8</text>
<text x="40" y="346" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#0f172a">tt.dot 操作数戴上 dot_op&lt;parent=#mma&gt;</text>
<rect x="40" y="370" width="300" height="50" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
<text x="190.0" y="391" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#4c1d95">dot_op&lt;opIdx=0,parent=#mma,kWidth=2&gt;</text>
<text x="190.0" y="408" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#4c1d95">dot_op&lt;opIdx=1,parent=#mma,kWidth=2&gt;</text>
<text x="190.0" y="438" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">L172,L173,L174</text>
<rect x="560" y="370" width="300" height="50" rx="8" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
<text x="710.0" y="391" text-anchor="middle" font-family="monospace" font-size="11" fill="#831843">P:tensor&lt;128x64xf16,#mma&gt;</text>
<text x="710.0" y="408" text-anchor="middle" font-family="monospace" font-size="11" fill="#831843">→ dot_op&lt;opIdx=0,parent=#mma&gt;</text>
<text x="710.0" y="438" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">ttg.convert_layout · L202</text>
<line x1="348" y1="395.0" x2="552" y2="395.0" stroke="#6366f1" stroke-width="2.5" marker-end="url(#a)"/>
<text x="450.0" y="385.0" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#6366f1">P 喂第二个 dot 前</text>
<text x="40" y="494" font-family="sans-serif" font-size="11.5" fill="#334155">结论:TTGIR = TTIR + 布局注解。同一个 tt.dot,结果类型从裸 tensor 变成 tensor&lt;...xf32,#mma&gt;;</text>
<text x="40" y="512" font-family="sans-serif" font-size="11.5" fill="#334155">#blocked 管全局访存怎么分给 4 个 warp,#shared 管数据在 SRAM 怎么 swizzle 避 bank 冲突;</text>
<text x="40" y="530" font-family="sans-serif" font-size="11.5" fill="#334155">ttg.convert_layout 是布局之间的显式搬运(有真实开销)。</text>
</svg>