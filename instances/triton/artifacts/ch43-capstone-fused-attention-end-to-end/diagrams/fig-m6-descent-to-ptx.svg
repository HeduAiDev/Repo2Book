<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 586">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker></defs>
<rect width="860" height="586" fill="white"/>
<text x="40" y="40" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e40af">TTGIR 降两跳到硬件:make_llir → make_ptx</text>
<rect x="40" y="78" width="780" height="64" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
<text x="430.0" y="102" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#475569">TTGIR</text>
<text x="430.0" y="124" text-anchor="middle" font-family="monospace" font-size="11" fill="#0f172a">3 块 memdesc:K/V 双缓冲(×2) + Q 常驻</text>
<text x="430.0" y="162" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#334155">make_llir(allocate_shared_memory 给三块 memdesc 分配共享内存)</text>
<line x1="430.0" y1="170" x2="430.0" y2="196" stroke="#334155" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="40" y="200" width="780" height="104" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
<text x="430.0" y="224" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0369a1">LLVM IR</text>
<text x="430.0" y="246" text-anchor="middle" font-family="monospace" font-size="11" fill="#0f172a">define ptx_kernel void @_attn_fwd(...)  ·  L9</text>
<text x="430.0" y="266" text-anchor="middle" font-family="monospace" font-size="11" fill="#0f172a">llvm.nvvm.read.ptx.sreg.ctaid.x / tid.x  ·  L10,L31</text>
<text x="430.0" y="286" text-anchor="middle" font-family="monospace" font-size="11" fill="#0f172a">共享内存 = 49152 字节 = 2×(2×64×64×2B) + 128×64×2B</text>
<text x="430.0" y="324" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#334155">make_ptx</text>
<line x1="430.0" y1="332" x2="430.0" y2="358" stroke="#334155" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="40" y="362" width="780" height="124" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="430.0" y="386" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#b45309">PTX</text>
<text x="430.0" y="408" text-anchor="middle" font-family="monospace" font-size="11" fill="#0f172a">.target sm_120a, .reqntid 128(=4 warps×32)  ·  L6,L37</text>
<text x="430.0" y="428" text-anchor="middle" font-family="monospace" font-size="11" fill="#0f172a">mma.sync.aligned.m16n8k16...f32.f16.f16.f32  ·  L644 首条,全核 256 条</text>
<text x="430.0" y="448" text-anchor="middle" font-family="monospace" font-size="11" fill="#0f172a">ex2.approx.ftz.f32  ·  L1090 首条,全核 136 条</text>
<text x="430.0" y="468" text-anchor="middle" font-family="monospace" font-size="11" fill="#0f172a">cp.async.cg.shared.global + commit_group  ·  L251,L265,全核 48 条</text>
<text x="40" y="526" font-family="sans-serif" font-size="11.5" fill="#334155">结论:全链收口——一行 tl.dot 最终是 mma.sync.m16n8k16 的 Tensor Core 指令,一行 tl.math.exp2 是</text>
<text x="40" y="546" font-family="sans-serif" font-size="11.5" fill="#334155">ex2.approx 硬件指令,tl.load+软件流水是 cp.async 异步拷贝;#mma versionMajor=2 → m16n8k16 是</text>
<text x="40" y="566" font-family="sans-serif" font-size="11.5" fill="#334155">Ampere 系 MMA 形状,在 3.2.0↔3.6.0、Ampere/Hopper/Blackwell(fp16)上稳定。</text>
</svg>