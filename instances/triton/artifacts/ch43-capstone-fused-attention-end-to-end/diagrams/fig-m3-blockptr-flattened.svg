<text x="210.0" y="300" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">生命周期不变,只有 offset 会挪</text>
<text x="640.0" y="110" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#0f172a">TTIR(_attn_fwd.ttir)</text>
