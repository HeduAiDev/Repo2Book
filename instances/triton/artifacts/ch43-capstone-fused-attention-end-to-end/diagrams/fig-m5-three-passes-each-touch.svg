<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker></defs>
<rect width="1400" height="560" fill="white"/>
<text x="40" y="40" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e40af">三个 TTGIR 优化 pass 在 _attn_fwd 上各留一处痕迹</text>
<rect x="40" y="130" width="420" height="34" rx="17" fill="#0284c7"/>
<text x="250.0" y="152" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="white">Coalesce</text>
<text x="250.0" y="176" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#94a3b8">third_party/nvidia/backend/compiler.py:L220</text>
<rect x="50" y="196" width="400" height="56" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="250.0" y="218" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">接收(pass 前)</text>
<text x="250.0" y="238" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#334155">tt.load 访存模式(无合并提示)</text>
<text x="250.0" y="267" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0284c7">选出访存合并的 #blocked</text>
<line x1="250.0" y1="274" x2="250.0" y2="294" stroke="#0284c7" stroke-width="2" marker-end="url(#a)"/>
<rect x="50" y="298" width="400" height="92" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="250.0" y="318" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#0284c7">产出(pass 后)</text>
<text x="250.0" y="340" text-anchor="middle" font-family="monospace" font-size="11" fill="#0f172a">sizePerThread=[8,1]</text>
<text x="250.0" y="360" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#0f172a">每线程连续搬 8 元素 → 带宽</text>
<text x="250.0" y="378" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#64748b">_attn_fwd.ttgir:L1</text>
<rect x="490" y="130" width="420" height="34" rx="17" fill="#7c3aed"/>
<text x="700.0" y="152" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="white">AccelerateMatmul</text>
<text x="700.0" y="176" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#94a3b8">third_party/nvidia/backend/compiler.py:L227</text>
<rect x="500" y="196" width="400" height="56" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="700.0" y="218" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">接收(pass 前)</text>
<text x="700.0" y="238" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#334155">tt.dot(无布局)</text>
<text x="700.0" y="267" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#7c3aed">matmul → Tensor Core</text>
<line x1="700.0" y1="274" x2="700.0" y2="294" stroke="#7c3aed" stroke-width="2" marker-end="url(#a)"/>
<rect x="500" y="298" width="400" height="92" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="700.0" y="318" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#7c3aed">产出(pass 后)</text>
<text x="700.0" y="340" text-anchor="middle" font-family="monospace" font-size="11" fill="#0f172a">结果 tensor&lt;128x64xf32,#mma&gt;</text>
<text x="700.0" y="360" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#0f172a">versionMajor=2, instrShape=[16,8] → 算力</text>
<text x="700.0" y="378" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#64748b">_attn_fwd.ttgir:L174</text>
<rect x="940" y="130" width="420" height="34" rx="17" fill="#b45309"/>
<text x="1150.0" y="152" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="white">Pipeliner</text>
<text x="1150.0" y="176" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#94a3b8">third_party/nvidia/backend/compiler.py:L239</text>
<rect x="950" y="196" width="400" height="56" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="1150.0" y="218" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">接收(pass 前)</text>
<text x="1150.0" y="238" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#334155">K/V tt.load(逐块同步等待)</text>
<text x="1150.0" y="267" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#b45309">软件流水:双缓冲 + 异步预取</text>
<line x1="1150.0" y1="274" x2="1150.0" y2="294" stroke="#b45309" stroke-width="2" marker-end="url(#a)"/>
<rect x="950" y="298" width="400" height="92" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="1150.0" y="318" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#b45309">产出(pass 后)</text>
<text x="1150.0" y="340" text-anchor="middle" font-family="monospace" font-size="11" fill="#0f172a">memdesc&lt;2x64x64xf16&gt; · async_copy_global_to_local</text>
<text x="1150.0" y="360" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#0f172a">num_stages=3,首维=2 → 延迟隐藏</text>
<text x="1150.0" y="378" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#64748b">_attn_fwd.ttgir:L122,123,132,152</text>
<text x="40" y="504" font-family="sans-serif" font-size="11.5" fill="#334155">结论:同一段 TTGIR,三个 pass 各管一件事——Coalesce 让相邻线程读相邻地址(带宽),</text>
<text x="40" y="522" font-family="sans-serif" font-size="11.5" fill="#334155">AccelerateMatmul 把矩阵乘换成 Tensor Core 指令(算力),Pipeliner 用双缓冲+异步拷贝</text>
<text x="40" y="540" font-family="sans-serif" font-size="11.5" fill="#334155">把『搬下一块』和『算这一块』重叠(延迟隐藏)。这三处就是 part-6 三章在一个真核上的落点。</text>
</svg>