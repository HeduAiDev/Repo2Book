<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1192 508">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker></defs>
<rect width="1192" height="508" fill="white"/>
<text x="40" y="30" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">共享内存 buffer 的三类来源 → 统一 first-fit 定址</text>
<rect x="40" y="96" width="340" height="168" rx="10" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
<text x="58" y="124" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a">Explicit</text>
<text x="362" y="124" text-anchor="end" font-family="sans-serif" font-size="12" fill="#475569">local_alloc</text>
<text x="58" y="150" font-family="sans-serif" font-size="12.5" fill="#1e293b">字节数 = product(shapePerCTA) x bitWidth / 8</text>
<text x="58" y="172" font-family="sans-serif" font-size="12.5" fill="#1e293b">例:16x16 f16 = 256 x 16 / 8 = 512 字节</text>
<text x="58" y="194" font-family="sans-serif" font-size="12.5" fill="#1e293b">默认对齐:512B&gt;256 -&gt; 1024</text>
<text x="58" y="250" font-family="sans-serif" font-size="10.5" fill="#64748b">lib/Analysis/Allocation.cpp:L203-L205</text>
<line x1="210.0" y1="264" x2="596.0" y2="354" stroke="#334155" stroke-width="1.5" marker-end="url(#a)" opacity="0.75"/>
<rect x="426" y="96" width="340" height="168" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="444" y="124" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a">Scratch</text>
<text x="748" y="124" text-anchor="end" font-family="sans-serif" font-size="12" fill="#475569">convert_layout</text>
<text x="444" y="150" font-family="sans-serif" font-size="12.5" fill="#1e293b">字节数 = elems x max(8, bitWidth) / 8</text>
<text x="444" y="172" font-family="sans-serif" font-size="12.5" fill="#1e293b">对齐 scratchAlignment = 128 字节</text>
<text x="444" y="194" font-family="sans-serif" font-size="12.5" fill="#1e293b">指针型 scratch: kPtrBitWidth = 64</text>
<text x="444" y="250" font-family="sans-serif" font-size="10.5" fill="#64748b">lib/Analysis/Allocation.cpp:L276-L278, L239, L47</text>
<line x1="596.0" y1="264" x2="596.0" y2="354" stroke="#334155" stroke-width="1.5" marker-end="url(#a)" opacity="0.75"/>
<rect x="812" y="96" width="340" height="168" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="830" y="124" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a">Virtual</text>
<text x="1134" y="124" text-anchor="end" font-family="sans-serif" font-size="12" fill="#475569">函数调用</text>
<text x="830" y="150" font-family="sans-serif" font-size="12.5" fill="#1e293b">字节数 = 被调函数的 sharedMemorySize</text>
<text x="830" y="172" font-family="sans-serif" font-size="12.5" fill="#1e293b">调用者无需展开被调函数</text>
<text x="830" y="194" font-family="sans-serif" font-size="12.5" fill="#1e293b">即为其预留整块空间</text>
<text x="830" y="250" font-family="sans-serif" font-size="10.5" fill="#64748b">lib/Analysis/Allocation.cpp:L298-L302</text>
<line x1="982.0" y1="264" x2="596.0" y2="354" stroke="#334155" stroke-width="1.5" marker-end="url(#a)" opacity="0.75"/>
<rect x="40" y="354" width="1112" height="74" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="2.5"/>
<text x="596.0" y="384" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#4c1d95">first-fit 定址(冲突图 + 贪心染色)</text>
<text x="596.0" y="406" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5b21b6">三类字节数统一进同一张冲突图,算出整个 call graph 的 sharedMemorySize</text>
<text x="40" y="496" font-family="sans-serif" font-size="11.5" fill="#64748b">Explicit 按张量形状 x 位宽;Scratch 按每轮最大访问 x 位宽(128B 对齐避 bank conflict);Virtual 直接借用被调函数的整块需求。</text>
</svg>