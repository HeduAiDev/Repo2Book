<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 722 476">
<rect width="722" height="476" fill="white"/>
<text x="36" y="36" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e40af">四类读写依赖 — 真正会插 barrier 的只有 RAW 与 WAR</text>
<text x="36" y="56" font-family="sans-serif" font-size="11.5" fill="#64748b">isIntersected 定义于 Membar.h:L38-L45；WAW 因分配层地址不重叠而空转</text>
<rect x="36" y="96" width="84" height="36" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="78.0" y="118.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="white" font-weight="bold">依赖类型</text>
<rect x="126" y="96" width="254" height="36" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="253.0" y="118.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="white" font-weight="bold">查询条件(Membar.h)</text>
<rect x="386" y="96" width="294" height="36" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="533.0" y="118.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="white" font-weight="bold">是否插 barrier</text>
<rect x="36" y="136" width="84" height="54" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="78.0" y="168.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#3730a3">RAW</text>
<text x="136" y="159.0" font-family="sans-serif" font-size="12" fill="#1e293b">syncWrite x other.syncRead</text>
<text x="136" y="179.0" font-family="sans-serif" font-size="10.5" fill="#64748b">L39-L40</text>
<rect x="386" y="136" width="294" height="54" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="533.0" y="168.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#b91c1c">会插</text>
<rect x="36" y="198" width="84" height="54" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="78.0" y="230.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#3730a3">WAR</text>
<text x="136" y="221.0" font-family="sans-serif" font-size="12" fill="#1e293b">syncRead x other.syncWrite</text>
<text x="136" y="241.0" font-family="sans-serif" font-size="10.5" fill="#64748b">L41-L42</text>
<rect x="386" y="198" width="294" height="54" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="533.0" y="230.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#b91c1c">会插</text>
<rect x="36" y="260" width="84" height="54" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="78.0" y="292.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#3730a3">WAW</text>
<text x="136" y="283.0" font-family="sans-serif" font-size="12" fill="#1e293b">syncWrite x other.syncWrite</text>
<text x="136" y="303.0" font-family="sans-serif" font-size="10.5" fill="#64748b">L43-L44 + Allocation.cpp:L672-L675</text>
<rect x="386" y="260" width="294" height="54" rx="4" fill="#fef9c3" stroke="#a16207" stroke-width="2"/>
<text x="533.0" y="292.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#a16207">查询会,但分配保证不重叠 -&gt; 不可能命中</text>
<rect x="36" y="322" width="84" height="54" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="78.0" y="354.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#3730a3">RAR</text>
<text x="136" y="345.0" font-family="sans-serif" font-size="12" fill="#1e293b">(未定义 — isIntersected 只含三项)</text>
<text x="136" y="365.0" font-family="sans-serif" font-size="10.5" fill="#64748b">L38-L45</text>
<rect x="386" y="322" width="294" height="54" rx="4" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
<text x="533.0" y="354.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#475569">不查询(无写不需同步)</text>
<text x="36" y="410" font-family="sans-serif" font-size="12" fill="#334155">落到实处:barrier 只来自写后读(RAW)与读后写(WAR)——这解释了 多余同步 从哪来。</text>
</svg>