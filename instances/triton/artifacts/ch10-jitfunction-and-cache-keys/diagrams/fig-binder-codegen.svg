<text x="190.0" y="227.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#1e293b">y_ptr</text>
<rect x="60" y="250" width="260" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="190.0" y="275.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#1e293b">output_ptr</text>
