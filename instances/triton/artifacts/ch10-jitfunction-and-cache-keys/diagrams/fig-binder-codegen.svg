<text x="190.0" y="371.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#1e293b">BLOCK_SIZE  (tl.constexpr)</text>
<text x="60" y="412" font-family="sans-serif" font-size="11.5" fill="#475569">inspect.signature 解析出 5 个 KernelParam</text>
<text x="60" y="430" font-family="sans-serif" font-size="11.5" fill="#475569">(4 非 constexpr + 1 constexpr)</text>
<rect x="430" y="154" width="260" height="150" rx="8" fill="white" stroke="#d97706" stroke-width="1.5"/>
<text x="560.0" y="180" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#92400e">create_function_from_signature</text>
<text x="446" y="206" font-family="sans-serif" font-size="12" fill="#374151">exec 生成 dynamic_func(binder)：</text>
<text x="446" y="226" font-family="sans-serif" font-size="12" fill="#374151">把 mangle_type / compute_spec_key</text>
<text x="446" y="246" font-family="sans-serif" font-size="12" fill="#374151">逐参数字面内联成直线代码，</text>
<text x="446" y="266" font-family="sans-serif" font-size="12" fill="#374151">无循环、无查表。</text>
<rect x="430" y="320" width="260" height="34" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="560.0" y="342" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#b91c1c">仅首次发射触发（self.binder is None）</text>
<text x="430" y="380" font-family="sans-serif" font-size="11.5" fill="#475569">binder 存进 self.binder，N 次发射</text>
<text x="430" y="398" font-family="sans-serif" font-size="11.5" fill="#475569">摊销到 1 次 exec 生成。</text>
