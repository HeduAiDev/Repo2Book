<rect width="1120" height="664" fill="white"/>
<text x="40" y="34" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1e293b">create_function_from_signature —— 把签名一次性 exec 成专属 binder</text>
<text x="40" y="58" font-family="sans-serif" font-size="12.5" fill="#64748b">add_kernel(x_ptr, y_ptr, output_ptr, n_elements, BLOCK_SIZE: tl.constexpr)；此函数仅在首次发射（self.binder is None）触发一次</text>
<rect x="40" y="108" width="300" height="460" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="190.0" y="134" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#6366f1">① 装饰期已定：签名</text>
<rect x="410" y="108" width="300" height="460" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="560.0" y="134" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#d97706">② 首次发射：exec 生成</text>
<rect x="780" y="108" width="300" height="460" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="930.0" y="134" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#059669">③ 此后每次发射：五元组产出</text>
