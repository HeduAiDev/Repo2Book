<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1270 620">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker></defs>
<rect width="1270" height="620" fill="white"/>
<text x="40" y="34" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1e293b">同一份 add_kernel，4 次发射 → 3 个缓存键</text>
<text x="40" y="58" font-family="sans-serif" font-size="12.5" fill="#64748b">add_kernel(x_ptr, y_ptr, output_ptr, n_elements, BLOCK_SIZE: tl.constexpr)；x/y/output 皆 float32 张量、16 对齐(D)</text>
<rect x="230" y="108" width="240" height="40" rx="5" fill="#a16207" stroke="#a16207" stroke-width="1.5"/>
<text x="350.0" y="128" text-anchor="middle" font-family="sans-serif" font-size="14" fill="white" font-weight="bold">L1</text>
<text x="350.0" y="145" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="white">n=1024, BLOCK=1024</text>
<rect x="480" y="108" width="240" height="40" rx="5" fill="#b91c1c" stroke="#b91c1c" stroke-width="1.5"/>
<text x="600.0" y="128" text-anchor="middle" font-family="sans-serif" font-size="14" fill="white" font-weight="bold">L2</text>
<text x="600.0" y="145" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="white">n=1024, BLOCK=512</text>
<rect x="730" y="108" width="240" height="40" rx="5" fill="#b91c1c" stroke="#b91c1c" stroke-width="1.5"/>
<text x="850.0" y="128" text-anchor="middle" font-family="sans-serif" font-size="14" fill="white" font-weight="bold">L3</text>
<text x="850.0" y="145" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="white">n=1000, BLOCK=1024</text>
<rect x="980" y="108" width="240" height="40" rx="5" fill="#15803d" stroke="#15803d" stroke-width="1.5"/>
<text x="1100.0" y="128" text-anchor="middle" font-family="sans-serif" font-size="14" fill="white" font-weight="bold">L4</text>
<text x="1100.0" y="145" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="white">n=1024, BLOCK=1024（重复）</text>
<text x="214" y="192.0" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="bold" fill="#374151">n_elements</text>
<text x="350.0" y="191.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >1024</text>
<text x="600.0" y="191.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >1024</text>
<text x="850.0" y="191.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >1000</text>
<text x="1100.0" y="191.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >1024</text>
<text x="214" y="258.0" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="bold" fill="#374151">n 对齐位</text>
<text x="350.0" y="257.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >D (1024%16=0)</text>
<text x="600.0" y="257.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >D (1024%16=0)</text>
<rect x="730" y="225" width="240" height="56" rx="5" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="850.0" y="257.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b91c1c" font-weight="bold" >N (1000%16=8)</text>
<text x="1100.0" y="257.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >D (1024%16=0)</text>
<text x="214" y="324.0" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="bold" fill="#374151">BLOCK_SIZE (constexpr)</text>
<text x="350.0" y="323.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >1024</text>
<rect x="480" y="291" width="240" height="56" rx="5" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="600.0" y="323.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b91c1c" font-weight="bold" >512</text>
<text x="850.0" y="323.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >1024</text>
<text x="1100.0" y="323.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >1024</text>
<text x="214" y="390.0" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="bold" fill="#374151">缓存键</text>
<rect x="230" y="357" width="240" height="56" rx="5" fill="#fef9c3" stroke="#a16207" stroke-width="2"/>
<text x="350.0" y="381.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a16207" font-weight="bold" >*fp32*fp32*fp32i32DDDD</text>
<text x="350.0" y="396.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a16207" font-weight="bold" >((1024,), {})</text>
<rect x="480" y="357" width="240" height="56" rx="5" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="600.0" y="381.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#b91c1c" font-weight="bold" >*fp32*fp32*fp32i32DDDD</text>
<text x="600.0" y="396.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#b91c1c" font-weight="bold" >((512,), {})</text>
<rect x="730" y="357" width="240" height="56" rx="5" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="850.0" y="381.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#b91c1c" font-weight="bold" >*fp32*fp32*fp32i32DDDN</text>
<text x="850.0" y="396.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#b91c1c" font-weight="bold" >((1024,), {})</text>
<rect x="980" y="357" width="240" height="56" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="1100.0" y="381.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#15803d" font-weight="bold" >*fp32*fp32*fp32i32DDDD</text>
<text x="1100.0" y="396.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#15803d" font-weight="bold" >((1024,), {})</text>
<text x="214" y="456.0" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="bold" fill="#374151">缓存动作</text>
<rect x="230" y="423" width="240" height="56" rx="5" fill="#fef9c3" stroke="#a16207" stroke-width="2"/>
<text x="350.0" y="455.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#a16207" font-weight="bold" >未命中 → 编第 1 份</text>
<rect x="480" y="423" width="240" height="56" rx="5" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="600.0" y="455.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b91c1c" font-weight="bold" >constexpr 变 → 编第 2 份</text>
<rect x="730" y="423" width="240" height="56" rx="5" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="850.0" y="455.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b91c1c" font-weight="bold" >对齐位 D→N → 编第 3 份</text>
<rect x="980" y="423" width="240" height="56" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="1100.0" y="455.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#15803d" font-weight="bold" >同 L1 键 → 命中不编</text>
<line x1="40" y1="220" x2="1230" y2="220" stroke="#e5e7eb" stroke-width="1"/>
<line x1="40" y1="286" x2="1230" y2="286" stroke="#e5e7eb" stroke-width="1"/>
<line x1="40" y1="352" x2="1230" y2="352" stroke="#e5e7eb" stroke-width="1"/>
<line x1="40" y1="418" x2="1230" y2="418" stroke="#e5e7eb" stroke-width="1"/>
<rect x="40" y="504" width="20" height="16" rx="3" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
<text x="68" y="516" font-family="sans-serif" font-size="12" fill="#334155">首次未命中/编译</text>
<rect x="204" y="504" width="20" height="16" rx="3" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="232" y="516" font-family="sans-serif" font-size="12" fill="#334155">维度变化 → 重编</text>
<rect x="380" y="504" width="20" height="16" rx="3" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="408" y="516" font-family="sans-serif" font-size="12" fill="#334155">逐维全同 → 命中复用</text>
<text x="40" y="548" font-family="sans-serif" font-size="12.5" fill="#1e293b" font-weight="bold">结论：凡进缓存键的维度（dtype / 指针对齐 / constexpr 值）任一变化即触发重编译；constexpr 若喂连续变化的值，缓存条目无上界 → 首次迭代编译风暴。</text>
</svg>