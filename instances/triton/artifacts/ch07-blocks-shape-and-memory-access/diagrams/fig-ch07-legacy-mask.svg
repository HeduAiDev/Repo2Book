<text x="36" y="384" font-family="sans-serif" font-size="12" fill="#64748b">结论:legacy 指针本身是一个 block 形状的地址张量;mask = arith.cmpi slt 生成的越界判据。</text>
<text x="36" y="403" font-family="sans-serif" font-size="12" fill="#64748b">mask 为真的 6 个 lane 真取数,越界的 2 个 lane 填 other 且绝不碰内存——灵活但编译器只看到</text>
<text x="36" y="422" font-family="sans-serif" font-size="12" fill="#64748b">一堆独立地址、不知道边界在哪。</text>
