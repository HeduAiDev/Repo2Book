<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 848 455">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker></defs>
<rect width="848" height="455" fill="white"/>
<text x="44" y="18" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1e40af">load 的分派判据：指针类型的嵌套方向</text>
<rect x="314.0" y="40" width="220" height="64" rx="10" fill="#e2e8f0" stroke="#334155" stroke-width="1.6"/>
<text x="424.0" y="77.0" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#0f172a">tl.load(ptr,...)</text>
<text x="424.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#475569">判据：ptr.type.is_ptr() and ptr.type.element_ty.is_block()</text>
<path d="M 424.0 104 L 184.0 150" stroke="#334155" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<path d="M 424.0 104 L 664.0 150" stroke="#334155" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<text x="294.0" y="121.0" text-anchor="end" font-family="sans-serif" font-size="11.5" fill="#334155">否(block&lt;pointer&gt; 或标量)</text>
<text x="554.0" y="121.0" font-family="sans-serif" font-size="11.5" fill="#334155">是(pointer&lt;block&gt;)</text>
<rect x="74" y="150" width="220" height="64" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="184.0" y="176" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#7f1d1d">_load_legacy</text>
<text x="184.0" y="196" text-anchor="middle" font-family="monospace" font-size="11" fill="#991b1b">tensor&lt;8x!tt.ptr&lt;f32&gt;&gt;</text>
<rect x="554" y="150" width="220" height="64" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="664.0" y="176" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#14532d">_load_block_pointer</text>
<text x="664.0" y="196" text-anchor="middle" font-family="monospace" font-size="11" fill="#166534">!tt.ptr&lt;tensor&lt;16x16xf32&gt;&gt;</text>
<rect x="74" y="260" width="220" height="92" rx="8" fill="#fff1f2" stroke="#fca5a5" stroke-width="1.3"/>
<text x="86" y="280" font-family="sans-serif" font-size="11.5" fill="#7f1d1d">拒收:boundary_check / padding</text>
<text x="86" y="298" font-family="sans-serif" font-size="11.5" fill="#7f1d1d">mask/other 广播到 ptr 形状</text>
<text x="86" y="316" font-family="sans-serif" font-size="11.5" fill="#7f1d1d">有 mask→create_masked_load</text>
<text x="86" y="334" font-family="sans-serif" font-size="11.5" fill="#7f1d1d">无 mask→create_load</text>
<rect x="554" y="260" width="220" height="92" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.3"/>
<text x="566" y="280" font-family="sans-serif" font-size="11.5" fill="#14532d">拒收:mask / other</text>
<text x="566" y="298" font-family="sans-serif" font-size="11.5" fill="#14532d">boundary_check 归一化后传入</text>
<text x="566" y="316" font-family="sans-serif" font-size="11.5" fill="#14532d">create_tensor_pointer_load</text>
<text x="566" y="334" font-family="sans-serif" font-size="11.5" fill="#14532d">(带 boundary_check + padding)</text>
<text x="44" y="384" font-family="sans-serif" font-size="12" fill="#64748b">结论:load 靠指针类型的『里外方向』一分为二——『指针的块』(block&lt;pointer&gt;)灵活、</text>
<text x="44" y="403" font-family="sans-serif" font-size="12" fill="#64748b">走逐元素 mask 那条;『块的指针』(pointer&lt;block&gt;)信息足、走 make_block_ptr 那条。</text>
<text x="44" y="422" font-family="sans-serif" font-size="12" fill="#64748b">两条路各拒收对方的边界表达法,泾渭分明。</text>
</svg>