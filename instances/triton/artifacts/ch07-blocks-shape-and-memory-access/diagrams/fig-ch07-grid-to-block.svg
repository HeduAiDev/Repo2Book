<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1170 450">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#1e3a8a"/></marker><marker id="b" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#0369a1"/></marker></defs>
<rect width="1170" height="450" fill="white"/>
<text x="40" y="34" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1e40af">从 grid 坐标到 block <tspan font-weight="normal">张量</tspan></text>
<text x="40" y="58" font-family="sans-serif" font-size="13" fill="#475569">pid×BLOCK + arange:kernel 首行『我是谁、我算哪一块』(pid=1, BLOCK=8, num_programs=4)</text>
<rect x="40" y="108" width="220" height="92" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="150.0" y="134" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">tl.program_id(0)</text>
<text x="150.0" y="158" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#b45309">pid = 1</text>
<text x="150.0" y="180" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#64748b">tt.get_program_id x : i32</text>
<line x1="260" y1="154.0" x2="330" y2="154.0" stroke="#1e3a8a" stroke-width="2" marker-end="url(#a)"/>
<rect x="330" y="108" width="220" height="92" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="440.0" y="134" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">pid * BLOCK</text>
<text x="440.0" y="158" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#b45309">1 * 8 = 8</text>
<text x="440.0" y="180" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#64748b">arith.muli : i32 (标量)</text>
<line x1="550" y1="154.0" x2="620" y2="154.0" stroke="#1e3a8a" stroke-width="2" marker-end="url(#a)"/>
<rect x="620" y="108" width="220" height="92" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="730.0" y="134" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">tl.arange(0, 8)</text>
<text x="730.0" y="158" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#b45309">[0,1,...,7]</text>
<text x="730.0" y="180" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#64748b">tt.make_range{0,8}:tensor&lt;8xi32&gt;</text>
<line x1="840" y1="154.0" x2="910" y2="154.0" stroke="#1e3a8a" stroke-width="2" marker-end="url(#a)"/>
<rect x="910" y="108" width="220" height="92" rx="10" fill="#dbeafe" stroke="#1e40af" stroke-width="2.5"/>
<text x="1020.0" y="134" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">本块坐标</text>
<text x="1020.0" y="158" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#b45309">[8..15]</text>
<text x="1020.0" y="180" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#64748b">tt.splat + arith.addi</text>
<path d="M 440.0 108 Q 730.0 86 1020.0 108" fill="none" stroke="#0369a1" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#b)"/>
<text x="730.0" y="80" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0369a1">广播相加(逐元素 +)</text>
<text x="40" y="256" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">num_programs=4 个 program 无缝分掉 [0,32)——每程序覆盖 8 个坐标</text>
<rect x="40.0" y="270" width="272.5" height="40" fill="#fecaca" stroke="#94a3b8" stroke-width="1"/>
<text x="176.25" y="288" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#334155">program 0</text>
<text x="176.25" y="303" text-anchor="middle" font-family="monospace" font-size="10" fill="#334155">[0,8)</text>
<rect x="312.5" y="270" width="272.5" height="40" fill="#fde68a" stroke="#b45309" stroke-width="2.5"/>
<text x="448.75" y="288" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#334155">program 1(本例)</text>
<text x="448.75" y="303" text-anchor="middle" font-family="monospace" font-size="10" fill="#334155">[8,16)</text>
<rect x="585.0" y="270" width="272.5" height="40" fill="#bbf7d0" stroke="#94a3b8" stroke-width="1"/>
<text x="721.25" y="288" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#334155">program 2</text>
<text x="721.25" y="303" text-anchor="middle" font-family="monospace" font-size="10" fill="#334155">[16,24)</text>
<rect x="857.5" y="270" width="272.5" height="40" fill="#bfdbfe" stroke="#94a3b8" stroke-width="1"/>
<text x="993.75" y="288" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#334155">program 3</text>
<text x="993.75" y="303" text-anchor="middle" font-family="monospace" font-size="10" fill="#334155">[24,32)</text>
<line x1="40.0" y1="310" x2="40.0" y2="318" stroke="#64748b" stroke-width="1"/>
<text x="40.0" y="332" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#475569">0</text>
<line x1="312.5" y1="310" x2="312.5" y2="318" stroke="#64748b" stroke-width="1"/>
<text x="312.5" y="332" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#475569">8</text>
<line x1="585.0" y1="310" x2="585.0" y2="318" stroke="#64748b" stroke-width="1"/>
<text x="585.0" y="332" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#475569">16</text>
<line x1="857.5" y1="310" x2="857.5" y2="318" stroke="#64748b" stroke-width="1"/>
<text x="857.5" y="332" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#475569">24</text>
<line x1="1130.0" y1="310" x2="1130.0" y2="318" stroke="#64748b" stroke-width="1"/>
<text x="1130.0" y="332" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#475569">32</text>
<text x="40" y="424" font-family="sans-serif" font-size="12" fill="#64748b">结论:program_id 报编号、arange 发尺子,一乘一加锁定本 program 坐标区间[8,16);区间紧邻不交,并集恰为 [0,32)——合并访存的整齐前提。</text>
</svg>