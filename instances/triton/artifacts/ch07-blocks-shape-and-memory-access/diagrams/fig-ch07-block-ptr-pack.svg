<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 707">
<rect width="920" height="707" fill="white"/>
<defs><marker id="arrow" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="8" markerHeight="6" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#475569"/></marker><marker id="arrow-weak" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="8" markerHeight="6" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#94a3b8"/></marker></defs>
<text x="40" y="32" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1e40af">make_block_ptr 只打包 5 组元信息；边界留给随后的 tl.load</text>
<text x="40" y="54" font-family="sans-serif" font-size="12.5" fill="#475569">M=N=20, BLOCK=16×16, offsets=(16,16)（pid_m=pid_n=1）→ 尾块界内 4×4=16 / 共 256</text>
<text x="70" y="108" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">父张<tspan font-weight="normal">量</tspan> shape=(20,20)</text>
<rect x="70" y="118" width="180" height="180" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
<line x1="106" y1="118" x2="106" y2="298" stroke="#e2e8f0" stroke-width="1"/>
<line x1="70" y1="154" x2="250" y2="154" stroke="#e2e8f0" stroke-width="1"/>
<line x1="142" y1="118" x2="142" y2="298" stroke="#e2e8f0" stroke-width="1"/>
<line x1="70" y1="190" x2="250" y2="190" stroke="#e2e8f0" stroke-width="1"/>
<line x1="178" y1="118" x2="178" y2="298" stroke="#e2e8f0" stroke-width="1"/>
<line x1="70" y1="226" x2="250" y2="226" stroke="#e2e8f0" stroke-width="1"/>
<line x1="214" y1="118" x2="214" y2="298" stroke="#e2e8f0" stroke-width="1"/>
<line x1="70" y1="262" x2="250" y2="262" stroke="#e2e8f0" stroke-width="1"/>
<defs><pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="8" stroke="#fbbf24" stroke-width="4"/></pattern></defs>
<rect x="214" y="262" width="144" height="144" fill="url(#hatch)" fill-opacity="0.55" stroke="#b45309" stroke-width="2" stroke-dasharray="5,4"/>
<rect x="214" y="262" width="36" height="36" fill="#93c5fd" fill-opacity="0.85" stroke="#1d4ed8" stroke-width="2.5"/>
<text x="232.0" y="285.0" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e3a8a">4×4 界内</text>
<text x="354" y="254" text-anchor="end" font-family="sans-serif" font-size="11" font-weight="bold" fill="#92400e">越界区→②load 时 padding=0</text>
<line x1="70" y1="298" x2="70" y2="304" stroke="#64748b" stroke-width="1"/>
<text x="70" y="318" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#475569">0</text>
<line x1="214" y1="298" x2="214" y2="304" stroke="#64748b" stroke-width="1"/>
<text x="214" y="318" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#475569">16</text>
<line x1="250" y1="298" x2="250" y2="304" stroke="#64748b" stroke-width="1"/>
<text x="250" y="318" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#475569">20</text>
<text x="62" y="122" text-anchor="end" font-family="monospace" font-size="10.5" fill="#475569">0</text>
<text x="62" y="266" text-anchor="end" font-family="monospace" font-size="10.5" fill="#475569">16</text>
<text x="62" y="302" text-anchor="end" font-family="monospace" font-size="10.5" fill="#475569">20</text>
<rect x="70" y="452" width="14" height="14" rx="3" fill="#93c5fd" stroke="#1d4ed8"/>
<text x="90" y="463" font-family="sans-serif" font-size="11" fill="#334155">界内(真实读到的 16 个元素)</text>
<rect x="70" y="474" width="14" height="14" rx="3" fill="url(#hatch)" fill-opacity="0.7" stroke="#b45309"/>
<text x="90" y="485" font-family="sans-serif" font-size="11" fill="#334155">越界(240 个,②load 时按 padding 补 0)</text>
<rect x="400" y="108" width="480" height="258" rx="10" fill="#eef2ff" stroke="#3730a3" stroke-width="1.6"/>
<circle cx="416" cy="124" r="11" fill="#4338ca"/>
<text x="416" y="128" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="white">①</text>
<text x="434" y="128" font-family="monospace" font-size="13" font-weight="bold" fill="#3730a3">make_block_ptr(...)</text>
<text x="416" y="152" font-family="monospace" font-size="12.5" font-weight="bold" fill="#4338ca">shape</text>
<text x="416" y="168" font-family="sans-serif" font-size="11.5" fill="#312e81">(M, N) = (20, 20)</text>
<text x="416" y="186" font-family="monospace" font-size="12.5" font-weight="bold" fill="#4338ca">strides</text>
<text x="416" y="202" font-family="sans-serif" font-size="11.5" fill="#312e81">(N, 1) = (20, 1)</text>
<text x="416" y="220" font-family="monospace" font-size="12.5" font-weight="bold" fill="#4338ca">offsets</text>
<text x="416" y="236" font-family="sans-serif" font-size="11.5" fill="#312e81">(pid_m·BM, pid_n·BN) = (16, 16)</text>
<text x="416" y="254" font-family="monospace" font-size="12.5" font-weight="bold" fill="#4338ca">block_shape</text>
<text x="416" y="270" font-family="sans-serif" font-size="11.5" fill="#312e81">(BM, BN) = (16, 16)</text>
<text x="416" y="288" font-family="monospace" font-size="12.5" font-weight="bold" fill="#4338ca">order</text>
<text x="416" y="304" font-family="sans-serif" font-size="11.5" fill="#312e81">(1, 0)  行主序</text>
<text x="416" y="332" font-family="monospace" font-size="11" fill="#78350f">→ tt.make_tensor_ptr ...</text>
<text x="416" y="348" font-family="monospace" font-size="11" fill="#78350f">: &lt;tensor&lt;16x16xf32&gt;&gt;</text>
<line x1="640.0" y1="366" x2="640.0" y2="440" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arrow-weak)"/>
<text x="656.0" y="399.0" text-anchor="start" font-family="sans-serif" font-size="10.5" fill="#64748b">先造指针,</text>
<text x="656.0" y="414.0" text-anchor="start" font-family="sans-serif" font-size="10.5" fill="#64748b">随后 load 时才指定边界(另一次调用)</text>
<rect x="400" y="440" width="480" height="156" rx="10" fill="#eef2ff" stroke="#9a3412" stroke-width="1.6"/>
<circle cx="416" cy="456" r="11" fill="#c2410c"/>
<text x="416" y="460" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="white">②</text>
<text x="434" y="460" font-family="monospace" font-size="13" font-weight="bold" fill="#9a3412">tl.load(ptr, boundary_check=…, padding=…)</text>
<text x="416" y="484" font-family="monospace" font-size="12.5" font-weight="bold" fill="#4338ca">boundary_check</text>
<text x="416" y="500" font-family="sans-serif" font-size="11.5" fill="#312e81">(0, 1)  两维都检查</text>
<text x="416" y="518" font-family="monospace" font-size="12.5" font-weight="bold" fill="#4338ca">padding</text>
<text x="416" y="534" font-family="sans-serif" font-size="11.5" fill="#312e81">'zero' → IR padding=1</text>
<text x="416" y="562" font-family="monospace" font-size="11" fill="#78350f">→ tt.load { boundaryCheck = array&lt;i32: 0, 1&gt;,</text>
<text x="416" y="578" font-family="monospace" font-size="11" fill="#78350f">    padding = 1 }</text>
<text x="40" y="636" font-family="sans-serif" font-size="12" fill="#64748b">结论:①一个 tt.make_tensor_ptr 只携带 shape/strides/offsets/block_shape/order 五组元信息,</text>
<text x="40" y="655" font-family="sans-serif" font-size="12" fill="#64748b">advance 只挪 offsets、其余原样不变;②边界由随后的 tl.load(boundary_check, padding) 单独</text>
<text x="40" y="674" font-family="sans-serif" font-size="12" fill="#64748b">传入,落进另一个 tt.load 节点——两次调用、两个 IR 节点,不是一次打包。</text>
</svg>