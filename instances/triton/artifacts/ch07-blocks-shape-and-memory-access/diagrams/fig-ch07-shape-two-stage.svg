<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 526">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#0f172a"/></marker></defs>
<rect width="880" height="526" fill="white"/>
<text x="40" y="34" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1e40af">形状算子两段式：Python 算元数据 → create_* 才落 IR</text>
<text x="40" y="58" font-family="sans-serif" font-size="12.5" fill="#475569">reshape/expand_dims/permute/broadcast/join/split/cat 共用一套机理，追踪期不搬一个字节的数据</text>
<rect x="40" y="82" width="260" height="26" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.3"/>
<text x="170.0" y="100" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#3b82f6">Python 侧调用</text>
<rect x="340" y="82" width="240" height="26" rx="5" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.3"/>
<text x="460.0" y="100" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#ca8a04">元数据校验(纯计算)</text>
<rect x="620" y="82" width="240" height="26" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
<text x="740.0" y="100" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#16a34a">builder.create_*(落 IR)</text>
<rect x="40" y="116" width="260" height="84" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="170.0" y="163.0" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#1e3a8a">reshape(8,)→(2,4)</text>
<rect x="340" y="116" width="240" height="84" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
<text x="460.0" y="153.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#78350f">校验 numel 不变:</text>
<text x="460.0" y="171.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#78350f">8 = 2×4 ✓</text>
<rect x="620" y="116" width="240" height="84" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="740.0" y="152.0" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#14532d">create_reshape</text>
<text x="740.0" y="174.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#166534">shape=(2,4)</text>
<line x1="300" y1="158.0" x2="340" y2="158.0" stroke="#0f172a" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="580" y1="158.0" x2="620" y2="158.0" stroke="#0f172a" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="40" y="234" width="260" height="84" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="170.0" y="281.0" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#1e3a8a">expand_dims(8,)插入</text>
<rect x="340" y="234" width="240" height="84" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
<text x="460.0" y="271.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#78350f">dst_shape.insert(axis,1):</text>
<text x="460.0" y="289.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#78350f">(8,)→(1,8)</text>
<rect x="620" y="234" width="240" height="84" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="740.0" y="270.0" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#14532d">create_expand_dims</text>
<text x="740.0" y="292.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#166534">shape=(1,8)</text>
<line x1="300" y1="276.0" x2="340" y2="276.0" stroke="#0f172a" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="580" y1="276.0" x2="620" y2="276.0" stroke="#0f172a" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="40" y="352" width="260" height="84" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="170.0" y="399.0" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#1e3a8a">broadcast 尺寸对齐</text>
<rect x="340" y="352" width="240" height="84" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
<text x="460.0" y="389.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#78350f">尺寸1可扩、非1不等</text>
<text x="460.0" y="407.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#78350f">→ ValueError</text>
<rect x="620" y="352" width="240" height="84" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="740.0" y="388.0" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#14532d">create_broadcast</text>
<text x="740.0" y="410.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#166534">shape 按规则扩</text>
<line x1="300" y1="394.0" x2="340" y2="394.0" stroke="#0f172a" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="580" y1="394.0" x2="620" y2="394.0" stroke="#0f172a" stroke-width="1.6" marker-end="url(#a)"/>
<text x="40" y="480" font-family="sans-serif" font-size="12" fill="#64748b">结论:一族形状算子只在左、中两栏做纯 Python 计算,数据是否真物化留给后端;</text>
<text x="40" y="500" font-family="sans-serif" font-size="12" fill="#64748b">右栏 create_reshape/create_expand_dims/create_broadcast 才是真正落地的 IR 算子。</text>
</svg>