<text x="284.0" y="116" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1d4ed8">① pybind 进 libtriton.so · compiler.py:L273</text>
<text x="284.0" y="142" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">追踪（make_ir）与全部 pass 都在这跑</text>
