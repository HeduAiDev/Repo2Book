<text x="44" y="766" font-family="sans-serif" font-size="12" fill="#334155">① ② ③ ④ 按时间序：Python 只在两端露面，中段全在 C++/MLIR/LLVM/独立进程里跑</text>
<text x="44" y="788" font-family="sans-serif" font-size="11" fill="#64748b">① ④ 的内部机制 ch01 已讲透（三条双语接缝），不重讲；② ③ 是本图新增的两处</text>
