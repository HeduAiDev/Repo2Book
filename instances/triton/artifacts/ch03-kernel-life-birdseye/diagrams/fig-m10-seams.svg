<text x="564.0" y="246" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1d4ed8">② to_module 跨 MLIR → LLVM 世界 · compiler.py:L291</text>
<text x="564.0" y="272" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">llir 实测 150 行（跨 LLVM 后的证据）</text>
