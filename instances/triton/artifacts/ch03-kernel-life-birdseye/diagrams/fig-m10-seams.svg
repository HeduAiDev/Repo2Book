<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1408 806">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker></defs>
<rect width="1408" height="806" fill="white"/>
<text x="44" y="28" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">双语栈的四道接缝：一生时间轴上控制权去哪了</text>
<text x="44" y="50" font-family="sans-serif" font-size="12" fill="#64748b">Python 只是编排者；ch01 已讲透其中三道的内部机制，本图只按时间轴排成一列、标各归后续哪一章</text>
