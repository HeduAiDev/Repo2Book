<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1282 460">
<defs><marker id="g" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#16a34a"/></marker><marker id="r" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#b91c1c"/></marker></defs>
<rect width="1282" height="460" fill="white"/>
<text x="46" y="30" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">无 GPU 断裂线：能编译不等于能跑</text>
<text x="46" y="52" font-family="sans-serif" font-size="12" fill="#64748b">headless 可跑级数=6（make_ir + 五级 stages）· 断裂线唯一且位置固定</text>
<text x="326.0" y="94" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#166534">headless 可跑（无 GPU）</text>
<text x="956.0" y="94" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#991b1b">需要真 GPU（断裂线起）</text>
<rect x="46" y="118" width="560" height="74" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="62" y="140" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#14532d">make_ir → … → make_ptx</text>
<text x="62" y="158" font-family="sans-serif" font-size="11.5" fill="#334155">纯编译：Python 前端 + libtriton.so（C++/MLIR）</text>
<text x="62" y="176" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#16a34a">产出 56/38/39/150/377 行文本 · 未建 CUDA context</text>
<line x1="326.0" y1="192" x2="326.0" y2="210" stroke="#16a34a" stroke-width="1.5" marker-end="url(#g)"/>
<rect x="46" y="214" width="560" height="74" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="62" y="236" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#14532d">make_cubin</text>
<text x="62" y="254" font-family="sans-serif" font-size="11.5" fill="#334155">ptxas 子进程（CPU 程序，triton wheel 自带 · L341）</text>
<text x="62" y="272" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#16a34a">9488 字节 cubin · 编译目标 sm_90a ≠ 本机卡</text>
<rect x="676" y="118" width="560" height="74" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="692" y="140" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#7f1d1d">_init_handles → load_binary</text>
<text x="692" y="158" font-family="sans-serif" font-size="11.5" fill="#334155">CUDA driver 把 cubin 灌进显存（compiler.py:L390）</text>
<text x="692" y="176" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#b91c1c">不能（断裂线，本 run 刻意未跨越）</text>
<line x1="641.0" y1="88" x2="641.0" y2="298" stroke="#b91c1c" stroke-width="2.5" stroke-dasharray="10,6"/>
<text x="641.0" y="320" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#b91c1c" transform="rotate(0)">断裂线</text>
<line x1="606" y1="251.0" x2="676" y2="155.0" stroke="#b91c1c" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#r)"/>
<text x="46" y="350" font-family="sans-serif" font-size="12" fill="#334155">TRITON_KERNEL_DUMP=1（compiler.py:L237）即可在无卡机上复现左侧全部六级产物</text>
<text x="46" y="372" font-family="sans-serif" font-size="11" fill="#64748b">绿=headless 可跑 红=需真 GPU · 断裂线右侧才第一次触碰设备</text>
</svg>