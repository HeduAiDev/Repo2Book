<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1408 434">
<rect width="1408" height="434" fill="white"/>
<text x="44" y="30" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">kernel 慢时先看哪层：三类症状对应三个旋钮层</text>
<text x="44" y="52" font-family="sans-serif" font-size="12" fill="#64748b">把结构主线（一路降 PTX）翻译成读者收益——先分清是编译期特化、优化 pass、还是发射开销</text>
<rect x="44" y="96" width="66" height="34" fill="#3b82f6" stroke="#1e3a5f"/>
<text x="77.0" y="118.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="white"></text>
<rect x="114" y="96" width="296" height="34" fill="#3b82f6" stroke="#1e3a5f"/>
<text x="262.0" y="118.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="white">症状</text>
<rect x="414" y="96" width="206" height="34" fill="#3b82f6" stroke="#1e3a5f"/>
<text x="517.0" y="118.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="white">旋钮层</text>
<rect x="624" y="96" width="316" height="34" fill="#3b82f6" stroke="#1e3a5f"/>
<text x="782.0" y="118.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="white">源码锚点</text>
<rect x="944" y="96" width="416" height="34" fill="#3b82f6" stroke="#1e3a5f"/>
<text x="1152.0" y="118.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="white">证据 / 备注</text>
<rect x="44" y="130" width="66" height="72" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.3"/>
<rect x="114" y="130" width="296" height="72" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.3"/>
<rect x="414" y="130" width="206" height="72" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.3"/>
<rect x="624" y="130" width="316" height="72" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.3"/>
<rect x="944" y="130" width="416" height="72" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.3"/>
<text x="77.0" y="169.0" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#3b82f6">(a)</text>
<text x="262.0" y="161.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">换 shape / dtype </text>
<text x="262.0" y="177.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">就变慢</text>
<text x="517.0" y="169.0" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#3b82f6">编译期特化层</text>
<text x="782.0" y="161.0" text-anchor="middle" font-family="sans-serif" font-size="12"  fill="#0f172a">jit.py:L583（cache </text>
<text x="782.0" y="177.0" text-anchor="middle" font-family="sans-serif" font-size="12"  fill="#0f172a">key）</text>
<text x="1152.0" y="153.0" text-anchor="middle" font-family="sans-serif" font-size="11.5"  fill="#0f172a">self.cache 命中短路 · </text>
<text x="1152.0" y="169.0" text-anchor="middle" font-family="sans-serif" font-size="11.5"  fill="#0f172a">jit.py:L584（第一次慢，</text>
<text x="1152.0" y="185.0" text-anchor="middle" font-family="sans-serif" font-size="11.5"  fill="#0f172a">之后快）</text>
<rect x="44" y="208" width="66" height="72" fill="#fef3c7" stroke="#d97706" stroke-width="1.3"/>
<rect x="114" y="208" width="296" height="72" fill="#fef3c7" stroke="#d97706" stroke-width="1.3"/>
<rect x="414" y="208" width="206" height="72" fill="#fef3c7" stroke="#d97706" stroke-width="1.3"/>
<rect x="624" y="208" width="316" height="72" fill="#fef3c7" stroke="#d97706" stroke-width="1.3"/>
<rect x="944" y="208" width="416" height="72" fill="#fef3c7" stroke="#d97706" stroke-width="1.3"/>
<text x="77.0" y="247.0" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#d97706">(b)</text>
<text x="262.0" y="247.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">算得慢 / 带宽打不满</text>
<text x="517.0" y="247.0" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#d97706">优化 pass 层</text>
<text x="782.0" y="239.0" text-anchor="middle" font-family="sans-serif" font-size="12"  fill="#0f172a">compiler.py:L203（TTGIR </text>
<text x="782.0" y="255.0" text-anchor="middle" font-family="sans-serif" font-size="12"  fill="#0f172a">贴布局）</text>
<text x="1152.0" y="247.0" text-anchor="middle" font-family="sans-serif" font-size="11.5"  fill="#0f172a">布局旋钮实证：ttgir 里 num-warps=4</text>
<rect x="44" y="286" width="66" height="72" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
<rect x="114" y="286" width="296" height="72" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
<rect x="414" y="286" width="206" height="72" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
<rect x="624" y="286" width="316" height="72" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
<rect x="944" y="286" width="416" height="72" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
<text x="77.0" y="325.0" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#dc2626">(c)</text>
<text x="262.0" y="317.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">小 kernel 频繁调用，</text>
<text x="262.0" y="333.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">host 开销大</text>
<text x="517.0" y="325.0" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#dc2626">发射层</text>
<text x="782.0" y="317.0" text-anchor="middle" font-family="sans-serif" font-size="12"  fill="#0f172a">jit.py:L638（每次调用都走 </text>
<text x="782.0" y="333.0" text-anchor="middle" font-family="sans-serif" font-size="12"  fill="#0f172a">launcher）</text>
<text x="1152.0" y="325.0" text-anchor="middle" font-family="sans-serif" font-size="11.5"  fill="#0f172a">缓存只省编译，不省发射</text>
<text x="44" y="404" font-family="sans-serif" font-size="11" fill="#64748b">蓝=(a)编译期特化 黄=(b)优化 pass 红=(c)发射 · 每格标了源码锚点，供你按症状定位该拧哪一层的旋钮</text>
</svg>