<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1330 362">
<rect width="1330" height="362" fill="white"/>
<text x="30" y="34" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1e293b">tt 层类型系统 —— 四类类型都只带 shape+dtype，encoding 栏通常为空</text>
<text x="30" y="56" font-family="sans-serif" font-size="12.5" fill="#64748b">这正是 tt.* 硬件无关（任何后端都认）的类型层证据；encoding 栏要到 ttg 层才被填上（前瞻 ch21/ch24）</text>
<rect x="30" y="96" width="237" height="34" fill="#3b82f6"/>
<text x="42" y="118" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="white">类型</text>
<rect x="289" y="96" width="288" height="34" fill="#3b82f6"/>
<text x="301" y="118" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="white">dump 里长成</text>
<rect x="599" y="96" width="283" height="34" fill="#3b82f6"/>
<text x="611" y="118" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="white">带 encoding 吗</text>
<rect x="904" y="96" width="396" height="34" fill="#3b82f6"/>
<text x="916" y="118" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="white">从哪来 / 定义</text>
<line x1="30" y1="130" x2="1300" y2="130" stroke="#e2e8f0" stroke-width="1"/>
<text x="42" y="156" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#1e40af">标量指针 PointerType</text>
<text x="301" y="156" font-family="monospace" font-size="12" fill="#0f172a">!tt.ptr&lt;f32&gt;（addressSpace=1 时省略数字）</text>
<rect x="599" y="136" width="283" height="32" rx="5" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/>
<text x="611" y="156" font-family="sans-serif" font-size="12" font-weight="bold" fill="#64748b">不适用（标量）</text>
<text x="916" y="156" font-family="sans-serif" font-size="12" fill="#374151">TritonTypes.td:L53；print Types.cpp:L45-L51</text>
<rect x="30" y="174" width="1270" height="44" fill="#f8fafc"/>
<line x1="30" y1="174" x2="1300" y2="174" stroke="#e2e8f0" stroke-width="1"/>
<text x="42" y="200" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#1e40af">指针张量 tensor&lt;ptr&lt;&gt;&gt;</text>
<text x="301" y="200" font-family="monospace" font-size="12" fill="#0f172a">tensor&lt;4x!tt.ptr&lt;f32&gt;&gt;</text>
<rect x="599" y="180" width="283" height="32" rx="5" fill="#ecfdf5" stroke="#047857" stroke-width="1.3"/>
<text x="611" y="200" font-family="sans-serif" font-size="12" font-weight="bold" fill="#047857">否（getEncoding() 返回空）</text>
<text x="916" y="200" font-family="sans-serif" font-size="12" fill="#374151">addptr 逐元素算术；TritonTypes.td:L80</text>
<line x1="30" y1="218" x2="1300" y2="218" stroke="#e2e8f0" stroke-width="1"/>
<text x="42" y="244" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#1e40af">块指针 ptr&lt;tensor&lt;&gt;&gt;（TensorPtr）</text>
<text x="301" y="244" font-family="monospace" font-size="12" fill="#0f172a">!tt.ptr&lt;tensor&lt;8x8xf16&gt;&gt;</text>
<rect x="599" y="224" width="283" height="32" rx="5" fill="#ecfdf5" stroke="#047857" stroke-width="1.3"/>
<text x="611" y="244" font-family="sans-serif" font-size="12" font-weight="bold" fill="#047857">否</text>
<text x="916" y="244" font-family="sans-serif" font-size="12" fill="#374151">make_tensor_ptr；isTensorPointerType Types.cpp:L178</text>
<rect x="30" y="262" width="1270" height="44" fill="#f8fafc"/>
<line x1="30" y1="262" x2="1300" y2="262" stroke="#e2e8f0" stroke-width="1"/>
<text x="42" y="288" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#1e40af">内存描述符 MemDescType</text>
<text x="301" y="288" font-family="monospace" font-size="12" fill="#0f172a">memdesc&lt;128x64xf16, #enc, #smem&gt;</text>
<rect x="599" y="268" width="283" height="32" rx="5" fill="#fffbeb" stroke="#b45309" stroke-width="1.3"/>
<text x="611" y="288" font-family="sans-serif" font-size="12" font-weight="bold" fill="#b45309">有 encoding/memorySpace 栏（tt 层仍常空）</text>
<text x="916" y="288" font-family="sans-serif" font-size="12" fill="#374151">TritonTypes.td:L96；ttg 层填共享内存布局（前瞻 ch24）</text>
<line x1="30" y1="306" x2="1300" y2="306" stroke="#94a3b8" stroke-width="1.5"/>
<rect x="30" y="321" width="16" height="16" rx="3" fill="#ecfdf5" stroke="#047857" stroke-width="1.3"/>
<text x="52" y="333" font-family="sans-serif" font-size="11" fill="#475569">encoding 为空（getEncoding() 返回空，恒放行）</text>
<rect x="342" y="321" width="16" height="16" rx="3" fill="#fffbeb" stroke="#b45309" stroke-width="1.3"/>
<text x="364" y="333" font-family="sans-serif" font-size="11" fill="#475569">encoding 有栏但 tt 层仍常空（ttg 层才填）</text>
<rect x="622" y="321" width="16" height="16" rx="3" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/>
<text x="644" y="333" font-family="sans-serif" font-size="11" fill="#475569">不适用（标量，非张量）</text>
</svg>