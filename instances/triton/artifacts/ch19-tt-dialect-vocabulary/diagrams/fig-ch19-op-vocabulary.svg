<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1257 676">
<rect width="1257" height="676" fill="white"/>
<text x="30" y="34" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1e293b">tt.* 算子词汇表 —— 16 个常用算子在 dump 里的固定长相</text>
<text x="30" y="56" font-family="sans-serif" font-size="12.5" fill="#64748b">认脸不查义：语义回指 ch07（访存）/ ch08（dot-reduce-scan）/ ch04（tl 两层结构）</text>
<rect x="30" y="84" width="334" height="34" fill="#3b82f6"/>
<text x="42" y="106" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="white">算子（.td 定义行）</text>
<rect x="386" y="84" width="274" height="34" fill="#3b82f6"/>
<text x="398" y="106" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="white">结构要点（读脸的关键）</text>
<rect x="682" y="84" width="545" height="34" fill="#3b82f6"/>
<text x="694" y="106" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="white">dump 里长成（样例，BLOCK=4）</text>
<line x1="30" y1="118" x2="1227" y2="118" stroke="#e2e8f0" stroke-width="1"/>
<text x="42" y="138" font-family="monospace" font-size="12.5" font-weight="bold" fill="#1e40af">tt.make_range (L803)</text>
<text x="398" y="138" font-family="sans-serif" font-size="12" fill="#374151">无操作数，两个 I32Attr</text>
<text x="694" y="138" font-family="monospace" font-size="12" fill="#065f46">tt.make_range {start=0, end=4} : tensor&lt;4xi32&gt;</text>
<rect x="30" y="150" width="1197" height="32" fill="#f1f5f9"/>
<line x1="30" y1="150" x2="1227" y2="150" stroke="#e2e8f0" stroke-width="1"/>
<text x="42" y="170" font-family="monospace" font-size="12.5" font-weight="bold" fill="#1e40af">tt.splat (L422)</text>
<text x="398" y="170" font-family="sans-serif" font-size="12" fill="#374151">标量→张量广播，带 `-&gt;` 箭头</text>
<text x="694" y="170" font-family="monospace" font-size="12" fill="#065f46">tt.splat %p : !tt.ptr&lt;f32&gt; -&gt; tensor&lt;4x!tt.ptr&lt;f32&gt;&gt;</text>
<line x1="30" y1="182" x2="1227" y2="182" stroke="#e2e8f0" stroke-width="1"/>
<text x="42" y="202" font-family="monospace" font-size="12.5" font-weight="bold" fill="#1e40af">tt.addptr (L199)</text>
<text x="398" y="202" font-family="sans-serif" font-size="12" fill="#374151">指针+偏移，两操作数双类型</text>
<text x="694" y="202" font-family="monospace" font-size="12" fill="#065f46">tt.addptr %p, %o : tensor&lt;4x!tt.ptr&lt;f32&gt;&gt;, tensor&lt;4xi32&gt;</text>
<rect x="30" y="214" width="1197" height="32" fill="#f1f5f9"/>
<line x1="30" y1="214" x2="1227" y2="214" stroke="#e2e8f0" stroke-width="1"/>
<text x="42" y="234" font-family="monospace" font-size="12.5" font-weight="bold" fill="#1e40af">tt.load (L231)</text>
<text x="398" y="234" font-family="sans-serif" font-size="12" fill="#374151">可选 mask/other + 默认值属性</text>
<text x="694" y="234" font-family="monospace" font-size="12" fill="#065f46">tt.load %p, %m : tensor&lt;4x!tt.ptr&lt;f32&gt;&gt;</text>
<line x1="30" y1="246" x2="1227" y2="246" stroke="#e2e8f0" stroke-width="1"/>
<text x="42" y="266" font-family="monospace" font-size="12.5" font-weight="bold" fill="#1e40af">tt.store (L306)</text>
<text x="398" y="266" font-family="sans-serif" font-size="12" fill="#374151">有 MemWrite 副作用，无结果</text>
<text x="694" y="266" font-family="monospace" font-size="12" fill="#065f46">tt.store %p, %v, %m : tensor&lt;4x!tt.ptr&lt;f32&gt;&gt;</text>
<rect x="30" y="278" width="1197" height="32" fill="#f1f5f9"/>
<line x1="30" y1="278" x2="1227" y2="278" stroke="#e2e8f0" stroke-width="1"/>
<text x="42" y="298" font-family="monospace" font-size="12.5" font-weight="bold" fill="#1e40af">tt.dot (L635)</text>
<text x="398" y="298" font-family="sans-serif" font-size="12" fill="#374151">三输入 a,b,c，`*`/`-&gt;` 形状式</text>
<text x="694" y="298" font-family="monospace" font-size="12" fill="#065f46">tt.dot %a, %b, %c : tensor&lt;..&gt; * tensor&lt;..&gt; -&gt; tensor&lt;..&gt;</text>
<line x1="30" y1="310" x2="1227" y2="310" stroke="#e2e8f0" stroke-width="1"/>
<text x="42" y="330" font-family="monospace" font-size="12.5" font-weight="bold" fill="#1e40af">tt.reduce (L711)</text>
<text x="398" y="330" font-family="sans-serif" font-size="12" fill="#374151">带 region 的 combineOp 内联块</text>
<text x="694" y="330" font-family="monospace" font-size="12" fill="#065f46">tt.reduce (%x) ({ ^bb0(..): tt.reduce.return .. }) {axis=1}</text>
<rect x="30" y="342" width="1197" height="32" fill="#f1f5f9"/>
<line x1="30" y1="342" x2="1227" y2="342" stroke="#e2e8f0" stroke-width="1"/>
<text x="42" y="362" font-family="monospace" font-size="12.5" font-weight="bold" fill="#1e40af">tt.scan (L743)</text>
<text x="398" y="362" font-family="sans-serif" font-size="12" fill="#374151">同 reduce，多 reverse 属性，形状不缩</text>
<text x="694" y="362" font-family="monospace" font-size="12" fill="#065f46">tt.scan (%x) ({ .. }) {axis=1, reverse=false}</text>
<line x1="30" y1="374" x2="1227" y2="374" stroke="#e2e8f0" stroke-width="1"/>
<text x="42" y="394" font-family="monospace" font-size="12.5" font-weight="bold" fill="#1e40af">tt.expand_dims (L436)</text>
<text x="398" y="394" font-family="sans-serif" font-size="12" fill="#374151">插一维，带 axis 属性</text>
<text x="694" y="394" font-family="monospace" font-size="12" fill="#065f46">tt.expand_dims %x {axis=0} : tensor&lt;4xi32&gt; -&gt; tensor&lt;1x4xi32&gt;</text>
<rect x="30" y="406" width="1197" height="32" fill="#f1f5f9"/>
<line x1="30" y1="406" x2="1227" y2="406" stroke="#e2e8f0" stroke-width="1"/>
<text x="42" y="426" font-family="monospace" font-size="12.5" font-weight="bold" fill="#1e40af">tt.reshape (L451)</text>
<text x="398" y="426" font-family="sans-serif" font-size="12" fill="#374151">改形状，allow_reorder 属性</text>
<text x="694" y="426" font-family="monospace" font-size="12" fill="#065f46">tt.reshape %x : tensor&lt;4x4xf32&gt; -&gt; tensor&lt;16xf32&gt;</text>
<line x1="30" y1="438" x2="1227" y2="438" stroke="#e2e8f0" stroke-width="1"/>
<text x="42" y="458" font-family="monospace" font-size="12.5" font-weight="bold" fill="#1e40af">tt.broadcast (L471)</text>
<text x="398" y="458" font-family="sans-serif" font-size="12" fill="#374151">沿大小=1 维扩张</text>
<text x="694" y="458" font-family="monospace" font-size="12" fill="#065f46">tt.broadcast %x : tensor&lt;1x4xf32&gt; -&gt; tensor&lt;8x4xf32&gt;</text>
<rect x="30" y="470" width="1197" height="32" fill="#f1f5f9"/>
<line x1="30" y1="470" x2="1227" y2="470" stroke="#e2e8f0" stroke-width="1"/>
<text x="42" y="490" font-family="monospace" font-size="12.5" font-weight="bold" fill="#1e40af">tt.join + tt.split (L506/L524，2 算子合 1 行)</text>
<text x="398" y="490" font-family="sans-serif" font-size="12" fill="#374151">沿新末维拼/拆，2 的幂约束</text>
<text x="694" y="490" font-family="monospace" font-size="12" fill="#065f46">tt.join %a, %b : tensor&lt;4xf32&gt; -&gt; tensor&lt;4x2xf32&gt;</text>
<line x1="30" y1="502" x2="1227" y2="502" stroke="#e2e8f0" stroke-width="1"/>
<text x="42" y="522" font-family="monospace" font-size="12.5" font-weight="bold" fill="#1e40af">tt.trans (L544)</text>
<text x="398" y="522" font-family="sans-serif" font-size="12" fill="#374151">按 order 转置（tt 层=重命名）</text>
<text x="694" y="522" font-family="monospace" font-size="12" fill="#065f46">tt.trans %x {order=[1,0]} : tensor&lt;4x8xf32&gt; -&gt; tensor&lt;8x4xf32&gt;</text>
<rect x="30" y="534" width="1197" height="32" fill="#f1f5f9"/>
<line x1="30" y1="534" x2="1227" y2="534" stroke="#e2e8f0" stroke-width="1"/>
<text x="42" y="554" font-family="monospace" font-size="12.5" font-weight="bold" fill="#1e40af">tt.make_tensor_ptr (L908)</text>
<text x="398" y="554" font-family="sans-serif" font-size="12" fill="#374151">块指针构造，base+shape/strides/offsets</text>
<text x="694" y="554" font-family="monospace" font-size="12" fill="#065f46">tt.make_tensor_ptr %b, [%s..],[%t..],[%o..] : !tt.ptr&lt;tensor&lt;8x8xf16&gt;&gt;</text>
<line x1="30" y1="566" x2="1227" y2="566" stroke="#e2e8f0" stroke-width="1"/>
<text x="42" y="586" font-family="monospace" font-size="12.5" font-weight="bold" fill="#1e40af">tt.atomic_rmw (L357)</text>
<text x="398" y="586" font-family="sans-serif" font-size="12" fill="#374151">读-改-写，带 rmw_op/sem/scope 属性</text>
<text x="694" y="586" font-family="monospace" font-size="12" fill="#065f46">tt.atomic_rmw fadd, %p, %v, %m : tensor&lt;..&gt;</text>
<rect x="30" y="598" width="1197" height="32" fill="#f1f5f9"/>
<line x1="30" y1="598" x2="1227" y2="598" stroke="#e2e8f0" stroke-width="1"/>
<text x="42" y="618" font-family="monospace" font-size="12.5" font-weight="bold" fill="#1e40af">tt.atomic_cas (L390)</text>
<text x="398" y="618" font-family="sans-serif" font-size="12" fill="#374151">比较交换，MemRead+MemWrite</text>
<text x="694" y="618" font-family="monospace" font-size="12" fill="#065f46">tt.atomic_cas %p, %cmp, %val : tensor&lt;..&gt;</text>
<line x1="30" y1="630" x2="1227" y2="630" stroke="#94a3b8" stroke-width="1.5"/>
<text x="30" y="658" font-family="sans-serif" font-size="11.5" fill="#64748b">共 15 行 / 16 个算子（tt.join、tt.split 合并展示为一行）；掌握 make_range/splat/addptr 三张模板即可读懂 add_kernel 一段 TTIR 中约 69% 的 tt.* 行，再补 load/store 两张覆盖近全部（见正文量化）。</text>
</svg>