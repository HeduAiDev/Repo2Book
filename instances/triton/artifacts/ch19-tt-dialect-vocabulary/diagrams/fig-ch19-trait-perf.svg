<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1235 502">
<rect width="1235" height="502" fill="white"/>
<text x="30" y="34" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1e293b">关键 trait 的性能承诺 —— 认出标签就能预测优化器的动作</text>
<text x="30" y="56" font-family="sans-serif" font-size="12" fill="#64748b">前两条由算子按需声明；后两条由基类 TT_Op 用 !listconcat 自动挂给全体 tt 算子（TritonOps.td:L31-L34）</text>
<rect x="30" y="96" width="226" height="34" fill="#3b82f6"/>
<text x="42" y="118" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="white">trait</text>
<rect x="276" y="96" width="241" height="34" fill="#3b82f6"/>
<text x="288" y="118" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="white">承诺</text>
<rect x="537" y="96" width="363" height="34" fill="#3b82f6"/>
<text x="549" y="118" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="white">性能落点 / 读者据此预测</text>
<rect x="920" y="96" width="285" height="34" fill="#3b82f6"/>
<text x="932" y="118" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="white">怎么挂上的</text>
<line x1="30" y1="130" x2="1205" y2="130" stroke="#e2e8f0" stroke-width="1"/>
<rect x="30" y="130" width="4" height="86" fill="#0ea5e9"/>
<text x="42" y="178" font-family="monospace" font-size="12" font-weight="bold" fill="#1e40af">Pure</text>
<text x="288" y="178" font-family="sans-serif" font-size="12" fill="#374151">无副作用 + 结果只依赖操作数</text>
<text x="549" y="160" font-family="sans-serif" font-size="12" fill="#374151">可被 CSE 合并、DCE 删除；tt 里</text>
<text x="549" y="178" font-family="sans-serif" font-size="12" fill="#374151">addptr/splat/make_range/dot/reduce/scan/trans 多标</text>
<text x="549" y="196" font-family="sans-serif" font-size="12" fill="#374151">Pure，load/store/atomic_* 不标</text>
<text x="932" y="168" font-family="sans-serif" font-size="12" fill="#374151">各算子按需声明（如 make_range 的 [Pure]，</text>
<text x="932" y="186" font-family="sans-serif" font-size="12" fill="#374151">L803）</text>
<rect x="30" y="216" width="1175" height="68" fill="#f8fafc"/>
<line x1="30" y1="216" x2="1205" y2="216" stroke="#e2e8f0" stroke-width="1"/>
<rect x="30" y="216" width="4" height="68" fill="#0ea5e9"/>
<text x="42" y="254" font-family="monospace" font-size="12" font-weight="bold" fill="#1e40af">SameOperandsAndResultEncoding</text>
<text x="288" y="254" font-family="sans-serif" font-size="12" fill="#374151">操作数与结果 encoding 必须一致</text>
<text x="549" y="246" font-family="sans-serif" font-size="12" fill="#374151">布局沿数据流传播的通道；tt 层 encoding 空→恒放行，ttg 层</text>
<text x="549" y="264" font-family="sans-serif" font-size="12" fill="#374151">填 layout 后才真正约束</text>
<text x="932" y="246" font-family="sans-serif" font-size="12" fill="#374151">各算子声明（如 addptr，L199）；执法</text>
<text x="932" y="264" font-family="sans-serif" font-size="12" fill="#374151">verifySameEncoding，Traits.cpp:L30-L31</text>
<line x1="30" y1="284" x2="1205" y2="284" stroke="#e2e8f0" stroke-width="1"/>
<rect x="30" y="284" width="4" height="86" fill="#7c3aed"/>
<text x="42" y="332" font-family="monospace" font-size="12" font-weight="bold" fill="#1e40af">TensorSizeTrait</text>
<text x="288" y="322" font-family="sans-serif" font-size="12" fill="#374151">张量元素数 ≤ 2^20=1048576 且必须是 2</text>
<text x="288" y="340" font-family="sans-serif" font-size="12" fill="#374151">的幂</text>
<text x="549" y="322" font-family="sans-serif" font-size="12" fill="#374151">防灾难性寄存器压力把编译器挂死（H100 有 256KB 寄存器）；</text>
<text x="549" y="340" font-family="sans-serif" font-size="12" fill="#374151">也是 join/split『元素数总是 2 的幂』的执法处</text>
<text x="932" y="314" font-family="sans-serif" font-size="12" fill="#374151">TT_Op 基类 !listconcat 自动挂全体算子，L33</text>
<text x="932" y="332" font-family="sans-serif" font-size="12" fill="#374151">；执法 verifyTensorSize，</text>
<text x="932" y="350" font-family="sans-serif" font-size="12" fill="#374151">Traits.cpp:L67-L82</text>
<rect x="30" y="370" width="1175" height="86" fill="#f8fafc"/>
<line x1="30" y1="370" x2="1205" y2="370" stroke="#e2e8f0" stroke-width="1"/>
<rect x="30" y="370" width="4" height="86" fill="#7c3aed"/>
<text x="42" y="418" font-family="monospace" font-size="12" font-weight="bold" fill="#1e40af">VerifyTensorLayoutsTrait</text>
<text x="288" y="418" font-family="sans-serif" font-size="12" fill="#374151">统一的布局合法性闸门</text>
<text x="549" y="400" font-family="sans-serif" font-size="12" fill="#374151">对带 encoding 的张量校验 layout 的</text>
<text x="549" y="418" font-family="sans-serif" font-size="12" fill="#374151">rank/threads-per-warp/warps-per-CTA 与 module 一致；</text>
<text x="549" y="436" font-family="sans-serif" font-size="12" fill="#374151">tt 层 encoding 空则放行，主要在 ttg 层生效</text>
<text x="932" y="418" font-family="sans-serif" font-size="12" fill="#374151">TT_Op 基类 !listconcat 自动挂全体算子，L33</text>
<line x1="30" y1="456" x2="1205" y2="456" stroke="#94a3b8" stroke-width="1.5"/>
<rect x="30" y="471" width="16" height="10" fill="#0ea5e9"/>
<text x="52" y="483" font-family="sans-serif" font-size="11" fill="#475569">各算子按需声明</text>
<rect x="159" y="471" width="16" height="10" fill="#7c3aed"/>
<text x="181" y="483" font-family="sans-serif" font-size="11" fill="#475569">TT_Op 基类自动挂给全体算子</text>
</svg>