<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1066 352">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker><marker id="ar" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#b45309"/></marker><marker id="ty" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#1e40af"/></marker></defs>
<rect width="1066" height="352" fill="white"/>
<text x="40" y="34" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1e293b">一行 dump 的长相由 .td 三元组决定 —— 以 make_range 为最小样本</text>
<text x="40" y="56" font-family="monospace" font-size="12.5" fill="#64748b">include/triton/Dialect/Triton/IR/TritonOps.td:L803-L824</text>
<text x="40" y="98" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">.td 三元组</text>
<rect x="40" y="108" width="236" height="246" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3"/>
<text x="54" y="130" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#1e40af">arguments</text>
<text x="54" y="150" font-family="monospace" font-size="13" fill="#0f172a">I32Attr:$start, I32Attr:$end</text>
<text x="54" y="170" font-family="sans-serif" font-size="11.5" fill="#94a3b8">无操作数，两个属性</text>
<line x1="40" y1="190" x2="276" y2="190" stroke="#e2e8f0" stroke-width="1"/>
<text x="54" y="212" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#1e40af">results</text>
<text x="54" y="232" font-family="monospace" font-size="13" fill="#0f172a">TT_IntTensor:$result</text>
<text x="54" y="252" font-family="sans-serif" font-size="11.5" fill="#94a3b8">1D i32 张量</text>
<line x1="40" y1="272" x2="276" y2="272" stroke="#e2e8f0" stroke-width="1"/>
<text x="54" y="294" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#1e40af">assemblyFormat</text>
<text x="54" y="314" font-family="monospace" font-size="13" fill="#0f172a">attr-dict `:` type($result)</text>
<text x="54" y="334" font-family="sans-serif" font-size="11.5" fill="#94a3b8">先打印属性字典，再冒号+结果类型</text>
<text x="406" y="98" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">TTIR dump 里的一行</text>
<rect x="406" y="108" width="620" height="56" rx="8" fill="#0f172a"/>
<text x="421.8" y="141" font-family="monospace" font-size="13" fill="#e2e8f0" xml:space="preserve">%offs_0 = tt.make_range </text>
<text x="615.3" y="141" font-family="monospace" font-size="13" fill="#fbbf24" xml:space="preserve">{end = 4 : i32, start = 0 : i32}</text>
<text x="873.2" y="141" font-family="monospace" font-size="13" fill="#e2e8f0" xml:space="preserve"> : </text>
<text x="897.4" y="141" font-family="monospace" font-size="13" fill="#7dd3fc" xml:space="preserve">tensor&lt;4xi32&gt;</text>
<line x1="276" y1="136" x2="398" y2="136" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<text x="341" y="126" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">assemblyFormat</text>
<line x1="744.2" y1="164" x2="744.2" y2="194" stroke="#b45309" stroke-width="1.6" stroke-dasharray="3,3" marker-end="url(#ar)"/>
<rect x="406" y="198" width="620" height="30" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.3"/>
<text x="418" y="218" font-family="sans-serif" font-size="12" fill="#b45309">$start / $end 属性 → {start = 0, end = 4}</text>
<line x1="949.8" y1="164" x2="949.8" y2="240" stroke="#1e40af" stroke-width="1.6" stroke-dasharray="3,3" marker-end="url(#ty)"/>
<rect x="406" y="244" width="620" height="30" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.3"/>
<text x="418" y="264" font-family="sans-serif" font-size="12" fill="#1e40af">type($result) → tensor&lt;4xi32&gt;（4 来自 BLOCK=4）</text>
</svg>