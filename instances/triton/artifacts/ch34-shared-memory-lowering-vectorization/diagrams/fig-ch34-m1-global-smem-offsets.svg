<text x="364.0" y="411" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#3730a3">mod.triton_gpu.shared = 144 (总量属性)</text>
<text x="44" y="460" font-family="monospace" font-size="12" fill="#334155">会合点: gep(i8, AddressOf(@global_smem), offset) —— 任一 op 读自己的 offset 就地从大数组里取基址</text>
