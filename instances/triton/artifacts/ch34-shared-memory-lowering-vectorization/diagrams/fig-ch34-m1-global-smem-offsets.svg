<text x="397.59999999999997" y="332.0" text-anchor="middle" font-family="monospace" font-size="11" fill="#0f172a">[64,96)</text>
<rect x="464.8" y="300" width="201.60000000000002" height="56" fill="#fcd34d" stroke="#334155" stroke-width="1"/>
