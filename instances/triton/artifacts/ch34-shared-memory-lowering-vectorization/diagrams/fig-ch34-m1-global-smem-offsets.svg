<text x="364.00000000000006" y="170" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#0f172a">op %1 (local_alloc)</text>
<text x="364.00000000000006" y="190" text-anchor="middle" font-family="monospace" font-size="11" fill="#334155">allocation.offset = 64 (i32)</text>
<line x1="364.00000000000006" y1="204" x2="397.59999999999997" y2="300" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#a)"/>
<text x="370.00000000000006" y="252.0" font-family="sans-serif" font-size="10" fill="#475569">gep</text>
