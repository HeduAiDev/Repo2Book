<text x="577.3333333333334" y="170" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#0f172a">op %2 (convert_layout tmp)</text>
<text x="577.3333333333334" y="190" text-anchor="middle" font-family="monospace" font-size="11" fill="#334155">allocation.offset = 96 (i32)</text>
<line x1="577.3333333333334" y1="204" x2="565.6" y2="300" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#a)"/>
