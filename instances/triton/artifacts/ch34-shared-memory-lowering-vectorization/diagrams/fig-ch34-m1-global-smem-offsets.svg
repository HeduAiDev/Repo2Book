<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 728 506">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#475569"/></marker></defs>
<rect width="728" height="506" fill="white"/>
<text x="44" y="34" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">分配(钉 offset 属性)与物化(gep 进同一数组)解耦</text>
<text x="44" y="56" font-family="sans-serif" font-size="12" fill="#64748b">每个 op 的 allocation.offset 是钉在它自己身上的一个 i32 属性;降级期所有分配 gep 进唯一的 global_smem 大数组</text>
<text x="44" y="126" font-family="monospace" font-size="12" font-weight="bold" fill="#0f172a">@global_smem : i8[0] extern, linkage=External, align 16 字节</text>
<rect x="55.66666666666667" y="150" width="190" height="54" rx="8" fill="#93c5fd" stroke="#334155" stroke-width="1.5"/>
<text x="150.66666666666669" y="170" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#0f172a">op %0 (local_alloc)</text>
<text x="150.66666666666669" y="190" text-anchor="middle" font-family="monospace" font-size="11" fill="#334155">allocation.offset = 0 (i32)</text>
<line x1="150.66666666666669" y1="204" x2="195.99999999999997" y2="300" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#a)"/>
<text x="156.66666666666669" y="252.0" font-family="sans-serif" font-size="10" fill="#475569">gep</text>
