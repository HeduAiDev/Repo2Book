<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 636">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker><marker id="s" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#0369a1"/></marker></defs>
<rect width="820" height="636" fill="white"/>
<text x="410.0" y="34" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">cp.async 三件套：用 async.token 串成 SSA 依赖链</text>
<rect x="20" y="50" width="220" height="30" rx="6" fill="#e2e8f0" stroke="#64748b"/>
<text x="130" y="71" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">Warp 指令流</text>
<line x1="130" y1="81" x2="130" y2="546" stroke="#94a3b8" stroke-dasharray="4,4"/>
<rect x="580" y="50" width="220" height="30" rx="6" fill="#e2e8f0" stroke="#64748b"/>
<text x="690" y="71" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">cp.async 引擎（后台）</text>
<line x1="690" y1="81" x2="690" y2="546" stroke="#94a3b8" stroke-dasharray="4,4"/>
<line x1="130" y1="156" x2="690" y2="156" stroke="#0369a1" stroke-width="1.8" marker-end="url(#s)"/>
<text x="410.0" y="148" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0369a1">async_copy_global_to_local(dst, src) → %t0</text>
<text x="34" y="160" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">t1</text>
<line x1="130" y1="222" x2="690" y2="222" stroke="#0369a1" stroke-width="1.8" marker-end="url(#s)"/>
<text x="410.0" y="214" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0369a1">async_commit_group(%t0) → %t1（打成一组）</text>
<text x="34" y="226" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">t2</text>
<rect x="160" y="273.0" width="340" height="30" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="4,3"/>
<text x="330.0" y="292" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#15803d">（继续算上一轮，访存与计算重叠）</text>
<text x="34" y="292" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">t3</text>
<line x1="130" y1="354" x2="690" y2="354" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<text x="410.0" y="346" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">async_wait(%t1, num=0)</text>
<text x="34" y="358" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">t4</text>
<line x1="690" y1="420" x2="130" y2="420" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<text x="410.0" y="412" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">未完成组 ≤ num：数据就绪，放行</text>
<text x="34" y="424" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">t5</text>
<rect x="50" y="516" width="720" height="82" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
<text x="68" y="540" font-family="sans-serif" font-size="11.5" fill="#334155">cp.async 硬件门槛：computeCapability ≥ 80（Ampere/sm80 起）；合法单次异步拷贝字节宽：{4, 8, 16} bytes</text>
<text x="68" y="564" font-family="sans-serif" font-size="11.5" fill="#334155">async_wait 等待参数：num（未完成组数，I32Attr）；三件套均吞吐/产出 async.token——串依赖的粘合剂</text>
</svg>