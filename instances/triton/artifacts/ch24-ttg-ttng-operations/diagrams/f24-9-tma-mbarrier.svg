<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 712">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker><marker id="s" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#7c3aed"/></marker></defs>
<rect width="1180" height="712" fill="white"/>
<text x="590.0" y="34" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">TMA + mbarrier：整块搬运交专用引擎，报数式完成同步</text>
<rect x="25" y="50" width="230" height="30" rx="6" fill="#e2e8f0" stroke="#64748b"/>
<text x="140" y="71" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">Warp（发起线程）</text>
<line x1="140" y1="81" x2="140" y2="612" stroke="#94a3b8" stroke-dasharray="4,4"/>
<rect x="455" y="50" width="230" height="30" rx="6" fill="#e2e8f0" stroke="#64748b"/>
<text x="570" y="71" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">mbarrier（共享内存）</text>
<line x1="570" y1="81" x2="570" y2="612" stroke="#94a3b8" stroke-dasharray="4,4"/>
<rect x="885" y="50" width="230" height="30" rx="6" fill="#e2e8f0" stroke="#64748b"/>
<text x="1000" y="71" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">TMA 引擎</text>
<line x1="1000" y1="81" x2="1000" y2="612" stroke="#94a3b8" stroke-dasharray="4,4"/>
<line x1="140" y1="156" x2="570" y2="156" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<text x="355.0" y="148" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">init_barrier</text>
<text x="34" y="160" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">t1</text>
<line x1="140" y1="222" x2="570" y2="222" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<text x="355.0" y="214" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">barrier_expect(bytes=N)（声明期望字节）</text>
<text x="34" y="226" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">t2</text>
<line x1="140" y1="288" x2="1000" y2="288" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#s)"/>
<text x="570.0" y="280" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#7c3aed">async_tma_copy_global_to_local(desc_ptr, coord, barrier, result)</text>
<text x="34" y="292" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">t3</text>
<line x1="1000" y1="354" x2="570" y2="354" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#s)"/>
<text x="785.0" y="346" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#7c3aed">整块搬运完成 → arrive（通知）</text>
<text x="34" y="358" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">t4</text>
<line x1="140" y1="420" x2="570" y2="420" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<text x="355.0" y="412" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">wait_barrier（阻塞到相位翻转）</text>
<text x="34" y="424" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">t5</text>
<line x1="570" y1="486" x2="140" y2="486" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<text x="355.0" y="478" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">相位完成：数据齐，放行</text>
<text x="34" y="490" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">t6</text>
<rect x="50" y="582" width="1080" height="122" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
<text x="68" y="606" font-family="sans-serif" font-size="11.5" fill="#334155">TMA / mbarrier 硬件门槛：computeCapability ≥ 90（Hopper/sm90）</text>
<text x="68" y="628" font-family="sans-serif" font-size="11.5" fill="#334155">async_tma_copy 定位操作数：desc_ptr + coord（Variadic&lt;I32&gt;）+ barrier(memdesc) + result(memdesc) + pred</text>
<text x="68" y="650" font-family="sans-serif" font-size="11.5" fill="#334155">init_barrier 降级 PTX：mbarrier.init.shared::cta.b64；wait_barrier 降级 PTX：mbarrier.try_wait.parity.shared.b64</text>
<text x="68" y="672" font-family="sans-serif" font-size="11.5" fill="#334155">对照 cp.async 粒度：cp.async 线程级逐指针（sm80）vs TMA 张量块级整块（sm90）</text>
</svg>