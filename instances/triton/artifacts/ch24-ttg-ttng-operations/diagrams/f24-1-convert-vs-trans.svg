<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 518">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker><marker id="ah" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#d97706"/></marker></defs>
<rect width="880" height="518" fill="white"/>
<text x="440.0" y="34" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">改名 vs 搬运：谁在线程间真的移动了数据</text>
<text x="220.0" y="60" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a">tt.trans / tt.reshape：改名</text>
<rect x="70.0" y="100" width="300" height="46" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
<text x="220.0" y="128.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#0f172a">输入 tensor&lt;A, #enc&gt;</text>
<line x1="220.0" y1="146" x2="220.0" y2="172" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="70.0" y="176" width="300" height="46" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
<text x="220.0" y="204.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#0f172a">重排『每个线程持有元素』的下标</text>
<line x1="220.0" y1="222" x2="220.0" y2="248" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="70.0" y="252" width="300" height="46" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
<text x="220.0" y="280.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#0f172a">输出 tensor&lt;A', #enc&gt;（同一份数据）</text>
<text x="220.0" y="322" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#334155">纯元数据：零跨线程搬运</text>
<text x="660.0" y="60" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a">convert_layout：真搬运</text>
<rect x="510.0" y="100" width="300" height="46" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
<text x="660.0" y="128.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#0f172a">输入 tensor&lt;A, #enc1&gt;</text>
<line x1="660.0" y1="146" x2="660.0" y2="172" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="510.0" y="176" width="300" height="46" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="660.0" y="204.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#0f172a">跨线程重新分布（经共享内存中转）</text>
<line x1="660.0" y1="222" x2="660.0" y2="248" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="510.0" y="252" width="300" height="46" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
<text x="660.0" y="280.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#0f172a">输出 tensor&lt;A, #enc2&gt;</text>
<text x="660.0" y="322" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#b45309">唯一真花线程间通信成本的 op</text>
<rect x="50" y="348" width="780" height="106" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
<text x="68" y="374" font-family="sans-serif" font-size="12" fill="#334155">convert_layout 的 traits：SameOperandsAndResultShape +</text>
<text x="68" y="398" font-family="sans-serif" font-size="12" fill="#334155">SameOperandsAndResultElementType + Pure（只改 encoding，shape / elementType 均不变）</text>
<text x="68" y="422" font-family="sans-serif" font-size="12" fill="#334155">canonicalizer 折叠后 dump 残留 cvt 条数：1（#mma→#dot；循环外 mma→blocked1 回写另 1 条）</text>
</svg>