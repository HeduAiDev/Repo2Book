<text x="40" y="616" font-family="sans-serif" font-size="12.5" fill="#334155">mma.sync 是固定操作数形状的硬件指令:降级的活就是按索引对号入座喂寄存器;</text>
<text x="40" y="636" font-family="sans-serif" font-size="12.5" fill="#334155">kWidth=8 装不下就沿 K 方向 stride-4 拆 4 条,Tensor Core 复用率不降。</text>
