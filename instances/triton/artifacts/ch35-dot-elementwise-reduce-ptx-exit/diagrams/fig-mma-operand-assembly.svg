<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 662">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker></defs>
<rect width="1180" height="662" fill="white"/>
<text x="40" y="30" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">callMmaAmpere:从 ValueTableV2 按 (b,m,n,k) 凑寄存器,拼一条 mma.sync.m16n8k16</text>
<text x="40" y="52" font-family="sans-serif" font-size="12" fill="#64748b">寄存器如何铺满 fragment 见第 27 章;这里只看『一次 mma 调用要凑齐哪些寄存器』</text>
<text x="40" y="82" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e3a5f">① 寄存器装配</text>
<rect x="40" y="104" width="168" height="58" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="124.0" y="126" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e3a8a">A 片段 0</text>
<text x="124.0" y="146" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#1e40af">ha[{b,m,k}]</text>
<rect x="222" y="104" width="168" height="58" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="306.0" y="126" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e3a8a">A 片段 1</text>
<text x="306.0" y="146" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#1e40af">ha[{b,m+1,k}]</text>
<rect x="404" y="104" width="168" height="58" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="488.0" y="126" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e3a8a">A 片段 2</text>
<text x="488.0" y="146" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#1e40af">ha[{b,m,k+1}]</text>
<rect x="586" y="104" width="168" height="58" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="670.0" y="126" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e3a8a">A 片段 3</text>
<text x="670.0" y="146" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#1e40af">ha[{b,m+1,k+1}]</text>
<rect x="222.0" y="182" width="168" height="58" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="306.0" y="204" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#92400e">B 片段 0</text>
<text x="306.0" y="224" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#92400e">hb[{b,n,k}]</text>
<rect x="404.0" y="182" width="168" height="58" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="488.0" y="204" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#92400e">B 片段 1</text>
<text x="488.0" y="224" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#92400e">hb[{b,n,k+1}]</text>
<rect x="40" y="260" width="350" height="58" rx="8" fill="#dcfce7" stroke="#059669" stroke-width="1.5"/>
<text x="215.0" y="282" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#065f46">C 累加器:numMmaRets 个</text>
<text x="215.0" y="302" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#065f46">std::to_string(i) 输入约束 = 输出约束(原地复用)</text>
<rect x="798" y="104" width="260" height="214" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
<text x="928.0" y="203.0" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#5b21b6">mma.sync.m16n8k16</text>
<text x="928.0" y="225.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5b21b6">4A + 2B + numMmaRets(C) → 1 条</text>
<line x1="754" y1="133.0" x2="798" y2="211.0" stroke="#2563eb" stroke-width="1.4" marker-end="url(#a)" opacity="0.75"/>
