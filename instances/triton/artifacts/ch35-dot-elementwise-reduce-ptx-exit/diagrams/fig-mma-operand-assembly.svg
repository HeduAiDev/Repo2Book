<text x="40" y="364" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e3a5f">② kWidth=8 拆分:一次逻辑 mma → 4 个 stride-4 物理 mma</text>
<rect x="40" y="384" width="780" height="46" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/>
<rect x="40.0" y="384" width="195.0" height="46" fill="#bfdbfe" stroke="#64748b" stroke-width="1"/>
<text x="137.5" y="412.0" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#0f172a">mma #0 (K+0)</text>
<rect x="235.0" y="384" width="195.0" height="46" fill="#93c5fd" stroke="#64748b" stroke-width="1"/>
<text x="332.5" y="412.0" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#0f172a">mma #1 (K+4)</text>
