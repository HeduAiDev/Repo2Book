<text x="722.5" y="412.0" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#0f172a">mma #3 (K+12)</text>
<text x="40" y="448" font-family="sans-serif" font-size="11" fill="#334155">K 方向 stride 4 独立寻址,4 条物理 mma 覆盖 1 次逻辑 mma 的 K=8</text>
<rect x="850" y="384" width="290" height="64" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="862" y="404" font-family="sans-serif" font-size="11" fill="#7f1d1d">拆分动机:</text>
<text x="862" y="422" font-family="monospace" font-size="11" font-weight="bold" fill="#7f1d1d">kWidth·elemBitWidth</text>
<text x="862" y="440" font-family="monospace" font-size="11" font-weight="bold" fill="#7f1d1d">= 8·16 = 128bit &gt; 单 mma 操作数寄存器容量</text>
