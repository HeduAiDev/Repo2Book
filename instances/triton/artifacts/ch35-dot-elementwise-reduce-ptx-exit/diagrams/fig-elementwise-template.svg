<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1230 410">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker></defs>
<rect width="1230" height="410" fill="white"/>
<text x="40" y="34" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">所有逐元素 op 共用一条 CRTP 流水线,差别只在中间那一格</text>
<text x="40" y="58" font-family="sans-serif" font-size="12" fill="#64748b">基类只搭『拆-算-拼』脚手架;fp8 cvt 和普通 fma 走的是同一条链,只有算法钩子不同</text>
<rect x="40" y="150" width="250" height="110" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
<text x="165.0" y="174" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0369a1">拆包入口</text>
<text x="165.0" y="202.0" text-anchor="middle" font-family="monospace" font-size="12.5" fill="#0f172a">unpackLLElements</text>
<text x="165.0" y="220.0" text-anchor="middle" font-family="monospace" font-size="12.5" fill="#0f172a">unpackI32</text>
<rect x="340" y="150" width="250" height="110" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2.2"/>
<text x="465.0" y="174" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#d97706">算法钩子(子类填)</text>
<text x="465.0" y="202.0" text-anchor="middle" font-family="monospace" font-size="12.5" fill="#0f172a">createDestOps</text>
<text x="465.0" y="220.0" text-anchor="middle" font-family="monospace" font-size="12.5" fill="#0f172a">(如 FpToFpOpConversion)</text>
<rect x="640" y="150" width="250" height="110" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
<text x="765.0" y="174" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0369a1">重排+去重</text>
<text x="765.0" y="202.0" text-anchor="middle" font-family="monospace" font-size="12.5" fill="#0f172a">reorderValues</text>
<text x="765.0" y="220.0" text-anchor="middle" font-family="monospace" font-size="12.5" fill="#0f172a">maybeDeduplicate</text>
<rect x="940" y="150" width="250" height="110" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
<text x="1065.0" y="174" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0369a1">重打包出口</text>
<text x="1065.0" y="193.0" text-anchor="middle" font-family="monospace" font-size="12.5" fill="#0f172a">packI32</text>
<text x="1065.0" y="211.0" text-anchor="middle" font-family="monospace" font-size="12.5" fill="#0f172a">packLLElements</text>
<text x="1065.0" y="229.0" text-anchor="middle" font-family="monospace" font-size="12.5" fill="#0f172a">replaceOp</text>
<line x1="290" y1="205.0" x2="340" y2="205.0" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="590" y1="205.0" x2="640" y2="205.0" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="890" y1="205.0" x2="940" y2="205.0" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="340" y="84" width="250" height="46" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
<text x="465.0" y="103" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#92400e">同一条链的唯一差异点</text>
<text x="465.0" y="121" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#92400e">fp8 cvt / 普通 fma 都填这一格</text>
<line x1="465.0" y1="130" x2="465.0" y2="150" stroke="#d97706" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="40" y="306" width="1150" height="60" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="56" y="330" font-family="sans-serif" font-size="12" fill="#334155">四段各自的真实调用顺序(源码锚点):</text>
<text x="56" y="350" font-family="monospace" font-size="11.5" fill="#334155">unpackLLElements→unpackI32 | createDestOps | reorderValues→maybeDeduplicate | packI32→packLLElements→replaceOp</text>
</svg>