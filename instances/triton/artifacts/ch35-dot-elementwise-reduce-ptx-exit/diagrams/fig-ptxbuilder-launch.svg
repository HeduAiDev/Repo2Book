<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 454.0">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker></defs>
<rect width="1120" height="454.0" fill="white"/>
<text x="40" y="30" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">所有硬件指令共享一条出口脊柱:PTXBuilder 拼成一条 inline asm</text>
<text x="40" y="52" font-family="sans-serif" font-size="12" fill="#64748b">mma/cvt/shfl/wgmma 走的是同一条 newOperand → create → dump/getConstraints → launch</text>
<rect x="40" y="190" width="230" height="70" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
<text x="155.0" y="218" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#0c4a6e">newOperand(SSA 值, 约束)</text>
<text x="155.0" y="238" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#0369a1">约束如 =r/=f/=h/r/h</text>
<rect x="310" y="190" width="230" height="70" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
<text x="425.0" y="218" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#0c4a6e">create(ptxAsm)</text>
<text x="425.0" y="238" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#0369a1">登记指令模板</text>
<line x1="270" y1="225.0" x2="310" y2="225.0" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="580" y="142.0" width="230" height="70" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="695.0" y="170.0" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#92400e">dump()</text>
<text x="695.0" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#92400e">$0,$1… 占位拼成 asm_string</text>
<line x1="540" y1="225.0" x2="580" y2="177.0" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="580" y="238.0" width="230" height="70" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="695.0" y="266.0" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#92400e">getConstraints()</text>
<text x="695.0" y="286.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#92400e">拼成 constraints 参数</text>
<line x1="540" y1="225.0" x2="580" y2="273.0" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="850" y="190" width="230" height="70" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
<text x="965.0" y="218" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#5b21b6">launch()</text>
<text x="965.0" y="238" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#5b21b6">生成一条 LLVM::InlineAsmOp</text>
<line x1="810" y1="177.0" x2="850" y2="225.0" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="810" y1="273.0" x2="850" y2="225.0" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="830" y="120" width="270" height="46" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
<text x="965.0" y="139" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">同时传入的副作用位:</text>
<text x="965.0" y="157" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#334155">hasSideEffect / isAlignStack</text>
<line x1="965.0" y1="166" x2="965.0" y2="190" stroke="#64748b" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="40" y="348.0" width="1040" height="46" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="56" y="376.0" font-family="sans-serif" font-size="12.5" fill="#0f172a">出口 op: <tspan font-family="monospace" font-weight="bold">LLVM::InlineAsmOp</tspan> (AD_ATT dialect)</text>
<text x="40" y="424.0" font-family="sans-serif" font-size="12.5" fill="#334155">Triton 不发 LLVM intrinsic 而发 inline asm:PTX 表达力更全,约束串精确锁定寄存器分配。</text>
</svg>