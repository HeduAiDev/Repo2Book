<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 992 426">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker></defs>
<rect width="992" height="426" fill="white"/>
<text x="46" y="30" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">BreakPhiStruct:拆箱换优化——struct phi 对 LLVM 优化不友好</text>
<text x="46" y="52" font-family="sans-serif" font-size="12" fill="#64748b">示例:{i32,i32} struct phi(2 incoming = preheader、latch),make_llir 出口收尾一步</text>
<text x="236.0" y="96" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">处理前</text>
<text x="756.0" y="96" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">处理后</text>
<rect x="46" y="108" width="380" height="84" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.8"/>
<text x="236.0" y="134" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#7f1d1d">1 个 struct phi {i32,i32}</text>
<text x="236.0" y="156" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#7f1d1d">incoming: preheader, latch(2 条边)</text>
<text x="236.0" y="176" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#7f1d1d">下游用户直接消费这个 struct 值</text>
<text x="236.0" y="222" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#991b1b">LLVM 优化器不擅长拆箱看里面每件货</text>
<rect x="566" y="108" width="380" height="58" rx="8" fill="#dcfce7" stroke="#059669" stroke-width="1.6"/>
<text x="582" y="132" font-family="monospace" font-size="13" font-weight="bold" fill="#065f46">phi0 : i32</text>
<text x="582" y="152" font-family="sans-serif" font-size="11" fill="#065f46">incoming 数 = 2(preheader, latch)——与原 struct phi 一致</text>
<rect x="566" y="182" width="380" height="58" rx="8" fill="#dcfce7" stroke="#059669" stroke-width="1.6"/>
<text x="582" y="206" font-family="monospace" font-size="13" font-weight="bold" fill="#065f46">phi1 : i32</text>
<text x="582" y="226" font-family="sans-serif" font-size="11" fill="#065f46">incoming 数 = 2(preheader, latch)——与原 struct phi 一致</text>
<rect x="566" y="260" width="380" height="56" rx="8" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.4"/>
<text x="582" y="282" font-family="monospace" font-size="12.5" font-weight="bold" fill="#3730a3">extractvalue x 4 = numScalarEl(2) x numOperands(2)</text>
<text x="582" y="302" font-family="monospace" font-size="12.5" font-weight="bold" fill="#3730a3">insertvalue x 2 = numScalarEl(2)  →  重组回 struct</text>
<text x="756.0" y="346" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#065f46">replaceAllUsesWith 换成新 struct,SROA/寄存器分配能逐件优化</text>
<line x1="436" y1="150.0" x2="556" y2="150.0" stroke="#334155" stroke-width="2.4" marker-end="url(#a)"/>
<text x="496.0" y="138.0" text-anchor="middle" font-family="monospace" font-size="10.5" font-weight="bold" fill="#334155">processPhiStruct</text>
<text x="46" y="386" font-family="sans-serif" font-size="12.5" fill="#334155">语义等价:insertvalue 逐元素重组的新 struct 与原 struct phi 每个 element 相等;</text>
<text x="46" y="406" font-family="sans-serif" font-size="12.5" fill="#334155">这是 make_llir 出口收尾——此后 TTGIR → LLVM(→ PTX by ptxas)五级阶梯走完。</text>
</svg>