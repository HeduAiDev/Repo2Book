<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1108 528">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker></defs>
<rect width="1108" height="528" fill="white"/>
<text x="34" y="34" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1e40af">在线 softmax 递推:一遍扫过 [1, 3, 2, 5]</text>
<text x="34" y="56" font-family="sans-serif" font-size="12" fill="#64748b">初始 m_0=-inf, d_0=0;每格给出该轮的 4 个量——刷新最大值时旧账先降标度,再加新项</text>
<rect x="202" y="118" width="208" height="34" rx="4" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="306.0" y="140.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="white" font-weight="bold">j=1  x=1</text>
<rect x="420" y="118" width="208" height="34" rx="4" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="524.0" y="140.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="white" font-weight="bold">j=2  x=3</text>
<rect x="638" y="118" width="208" height="34" rx="4" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="742.0" y="140.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="white" font-weight="bold">j=3  x=2</text>
<rect x="856" y="118" width="208" height="34" rx="4" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="960.0" y="140.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="white" font-weight="bold">j=4  x=5</text>
<text x="186" y="192.0" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="bold" fill="#374151">running max m_j</text>
<rect x="202" y="162" width="208" height="52" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
<text x="306.0" y="183.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#047857" font-weight="bold" >m_1 = 1</text>
<text x="306.0" y="199.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#047857" font-weight="bold" >(首元素)</text>
<rect x="420" y="162" width="208" height="52" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="524.0" y="183.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b91c1c" font-weight="bold" >m_2 = 3</text>
<text x="524.0" y="199.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b91c1c" font-weight="bold" >(1 -&gt; 3 刷新)</text>
<rect x="638" y="162" width="208" height="52" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
<text x="742.0" y="183.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#047857" font-weight="bold" >m_3 = 3</text>
<text x="742.0" y="199.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#047857" font-weight="bold" >(不变)</text>
<rect x="856" y="162" width="208" height="52" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="960.0" y="183.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b91c1c" font-weight="bold" >m_4 = 5</text>
<text x="960.0" y="199.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b91c1c" font-weight="bold" >(3 -&gt; 5 刷新)</text>
<text x="186" y="252.0" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="bold" fill="#374151">旧账降标度</text>
<text x="306.0" y="243.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >d_0=0</text>
<text x="306.0" y="259.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >(无历史)</text>
<text x="524.0" y="243.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >d_1*e^{1-3}</text>
<text x="524.0" y="259.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >= 0.135335</text>
<text x="742.0" y="243.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >d_2*e^{3-3}</text>
<text x="742.0" y="259.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >= 1.135335</text>
<text x="960.0" y="243.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >d_3*e^{3-5}</text>
<text x="960.0" y="259.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >= 0.203438</text>
<text x="186" y="312.0" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="bold" fill="#374151">新增 e^{x_j-m_j}</text>
<text x="306.0" y="312.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >e^{1-1}=1.0</text>
<text x="524.0" y="312.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >e^{3-3}=1.0</text>
<text x="742.0" y="303.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >e^{2-3}</text>
<text x="742.0" y="319.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >=0.367879</text>
<text x="960.0" y="312.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >e^{5-5}=1.0</text>
<text x="186" y="372.0" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="bold" fill="#374151">running 分母 d_j</text>
<text x="306.0" y="372.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >d_1 = 1.0</text>
<text x="524.0" y="372.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >d_2 = 1.135335</text>
<text x="742.0" y="372.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >d_3 = 1.503215</text>
<text x="960.0" y="372.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >d_4 = 1.203438</text>
<path d="M 306.0 394 Q 415.0 328.0 524.0 222" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#a)"/>
<path d="M 524.0 394 Q 633.0 328.0 742.0 222" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#a)"/>
<path d="M 742.0 394 Q 851.0 328.0 960.0 222" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#a)"/>
<rect x="202" y="424" width="340" height="52" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="372.0" y="446" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1e40af" font-weight="bold">在线法一遍扫过:d_N = 1.203438</text>
<text x="372.0" y="464" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">只维护 2 个 running 标量(m, d),访存 1 遍</text>
<rect x="734" y="424" width="340" height="52" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="904.0" y="446" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155" font-weight="bold">三遍法一次性分母:1.203438(对照)</text>
<text x="904.0" y="464" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">先扫 max、再扫分母、再归一化——访存 3 遍</text>
<text x="638.0" y="454" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#047857">=</text>
<text x="34" y="498" font-family="sans-serif" font-size="11" fill="#64748b">红=本轮刷新 running max、旧账被降标度(changed);绿=running max 不变(stable)。虚线箭头=分母逐轮向后传递,全程一遍过。</text>
</svg>