<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1684 476">
<defs>
<marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker>
<marker id="r" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="8" markerHeight="6" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#d97706"/></marker>
</defs>
<rect width="1684" height="476" fill="white"/>
<text x="42" y="42" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1e40af">FlashAttention 分块遍历时序:2 块 K/V 增量更新一行 Q</text>
<text x="42" y="64" font-family="sans-serif" font-size="12" fill="#64748b">外层锁一块 Q 常驻 SRAM;内层每来一块 K/V 就地更新 m/l/acc 三件套,running max 抬高时旧账先乘 alpha 降标度</text>
<rect x="42" y="179.0" width="190" height="96" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2.5"/>
<text x="137.0" y="207.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e3a5f">Q 常驻 SRAM</text>
<text x="137.0" y="229.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">q=[1,0]  scale=1.0</text>
<text x="137.0" y="251.0" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1e40af">(整个内层循环反复读,只 load 一次)</text>
<line x1="232" y1="227.0" x2="382" y2="138" stroke="#1e40af" stroke-width="2" marker-end="url(#a)"/>
<rect x="382" y="108" width="330" height="238" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
<rect x="382" y="108" width="330" height="30" rx="8" fill="#475569"/>
<rect x="382" y="124" width="330" height="14" fill="#475569"/>
<text x="547.0" y="128" text-anchor="middle" font-family="sans-serif" font-size="13" fill="white" font-weight="bold">块 1  K0V0</text>
<text x="396" y="156" font-family="sans-serif" font-size="11" fill="#334155">K=[[1,0],[0,1]]  V=[[1,0],[0,1]]</text>
<text x="396" y="174" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e3a5f">S=[1, 0]</text>
<text x="396" y="200" font-family="sans-serif" font-size="11" fill="#334155">rowmax(S)=1</text>
<text x="396" y="221" font-family="sans-serif" font-size="11" fill="#334155">m^(1)=1  (首块,alpha=0 清零初值)</text>
<text x="396" y="242" font-family="sans-serif" font-size="11" fill="#334155">P̃=e^{S-m}=[1.0, 0.367879]</text>
<text x="396" y="263" font-family="sans-serif" font-size="11" fill="#334155">l^(1)=1.367879</text>
<text x="396" y="284" font-family="sans-serif" font-size="11" fill="#334155">acc^(1)=[1.0, 0.367879]  (未归一)</text>
<line x1="712" y1="227.0" x2="862" y2="227.0" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<text x="787.0" y="203.0" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#d97706">alpha=0.367879</text>
<text x="787.0" y="217.0" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#d97706">降标度</text>
<rect x="862" y="108" width="330" height="238" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
<rect x="862" y="108" width="330" height="30" rx="8" fill="#475569"/>
<rect x="862" y="124" width="330" height="14" fill="#475569"/>
<text x="1027.0" y="128" text-anchor="middle" font-family="sans-serif" font-size="13" fill="white" font-weight="bold">块 2  K1V1</text>
<text x="876" y="156" font-family="sans-serif" font-size="11" fill="#334155">K=[[1,1],[2,0]]  V=[[1,1],[2,2]]</text>
<text x="876" y="174" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e3a5f">S=[1, 2]</text>
<text x="876" y="200" font-family="sans-serif" font-size="11" fill="#334155">rowmax(S)=2</text>
<text x="876" y="221" font-family="sans-serif" font-size="11" fill="#334155">m^(2)=2  (1 -&gt; 2 抬高)</text>
<rect x="870" y="228" width="314" height="19" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="876" y="242" font-family="sans-serif" font-size="11" font-weight="bold" fill="#92400e">alpha=e^{1-2}=0.367879  旧 l/acc 先乘 alpha</text>
<text x="876" y="263" font-family="sans-serif" font-size="11" fill="#334155">P̃=e^{S-m}=[0.367879, 1.0]</text>
<text x="876" y="284" font-family="sans-serif" font-size="11" fill="#334155">l^(2)=alpha*l^(1)+rowsum(P̃)=1.871094</text>
<text x="876" y="305" font-family="sans-serif" font-size="11" fill="#334155">acc^(2)=alpha*acc^(1)+P̃V=[2.735759, 2.503215]</text>
<path d="M 232 265.0 Q 547.0 335.0 892 350" fill="none" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#a)"/>
<text x="507.0" y="353.0" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1e40af">同一个 q,反复读</text>
<rect x="1342" y="108" width="300" height="238" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
<rect x="1342" y="108" width="300" height="30" rx="8" fill="#047857"/>
<rect x="1342" y="124" width="300" height="14" fill="#047857"/>
<text x="1492.0" y="128" text-anchor="middle" font-family="sans-serif" font-size="13" fill="white" font-weight="bold">epilogue 归一化</text>
<text x="1358" y="221.0" font-family="sans-serif" font-size="11" fill="#334155">归一化(仅此一次): O = acc^(2) / l^(2)</text>
<text x="1358" y="242.0" font-family="sans-serif" font-size="11" fill="#334155">O = [1.462117, 1.337835]</text>
<text x="1358" y="263.0" font-family="sans-serif" font-size="11" fill="#334155">全矩阵一次性 softmax: O_full = [1.462117, 1.337835]</text>
<text x="1358" y="284.0" font-family="sans-serif" font-size="11" font-weight="bold" fill="#047857">逐位相等(exact) ✓</text>
<line x1="1192" y1="227.0" x2="1342" y2="227.0" stroke="#047857" stroke-width="2" marker-end="url(#a)"/>
<text x="42" y="406" font-family="sans-serif" font-size="12" fill="#64748b">黄底=alpha rescale 步骤(恒等性的全部);running 状态 m/l/acc 全程只有 O(块) 大小,从不物化 4 列(推广即 N 列)整行打分。</text>
<text x="42" y="428" font-family="sans-serif" font-size="11" fill="#64748b">锚点 python/tutorials/06-fused-attention.py:L46-74(内层)、L185-186(归一化)</text>
</svg>