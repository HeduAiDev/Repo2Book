<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 938 578">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker></defs>
<rect width="938" height="578" fill="white"/>
<text x="44" y="36" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1e40af">rescale 是恒等性的全部:带 alpha vs 漏 alpha</text>
<text x="44" y="58" font-family="sans-serif" font-size="12" fill="#64748b">同一 2 块输入(块 1 ℓ=1.367879, acc=[1.0,0.367879]);块 2 running max 从 1 抬到 2 时,ℓ/acc 是否乘 alpha=0.367879</text>
<rect x="44" y="122" width="380" height="34" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
<text x="234.0" y="144" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#047857">带 rescale(正确)</text>
<rect x="74.0" y="176" width="320" height="50" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
<text x="234.0" y="206.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">块2: alpha=e^{1-2}=0.367879</text>
<line x1="234.0" y1="226" x2="234.0" y2="246" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="74.0" y="250" width="320" height="50" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="234.0" y="280.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">旧 ℓ·alpha + rowsum(P̃) = 1.871094</text>
<line x1="234.0" y1="300" x2="234.0" y2="320" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="74.0" y="324" width="320" height="50" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="234.0" y="354.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">旧 acc·alpha + P̃V = [2.735759, 2.503215]</text>
<line x1="234.0" y1="374" x2="234.0" y2="394" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="74.0" y="398" width="320" height="50" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
<text x="234.0" y="428.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">O = acc/ℓ = [1.462117, 1.337835]</text>
<rect x="44" y="482" width="380" height="40" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
<text x="234.0" y="508" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#047857">✓ 与全矩阵 softmax 逐位相等</text>
<rect x="514" y="122" width="380" height="34" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
<text x="704.0" y="144" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#b91c1c">漏掉 rescale(错误)</text>
<rect x="544.0" y="176" width="320" height="50" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
<text x="704.0" y="206.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">块2: alpha 未施加</text>
<line x1="704.0" y1="226" x2="704.0" y2="246" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="544.0" y="250" width="320" height="50" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="704.0" y="280.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">旧 ℓ 直接 + rowsum(P̃) = 2.735759</text>
<line x1="704.0" y1="300" x2="704.0" y2="320" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="544.0" y="324" width="320" height="50" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="704.0" y="354.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">旧 acc 直接 + P̃V = [3.367879, 2.735759]</text>
<line x1="704.0" y1="374" x2="704.0" y2="394" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="544.0" y="398" width="320" height="50" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
<text x="704.0" y="428.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">O = acc/ℓ = [1.231059, 1.0]</text>
<rect x="514" y="482" width="380" height="40" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
<text x="704.0" y="508" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#b91c1c">✗ 偏离全矩阵 softmax(两分量偏 15.8%/25.3%)</text>
<line x1="434" y1="312.0" x2="504" y2="312.0" stroke="#d97706" stroke-width="2.5" marker-end="url(#a)"/>
<text x="469" y="300.0" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#d97706">唯一差异</text>
<text x="44" y="532" font-family="sans-serif" font-size="12" fill="#64748b">黄底=两路径唯一的分岔点(是否对旧 ℓ/acc 乘 alpha);其余步骤完全相同。</text>
<text x="44" y="554" font-family="sans-serif" font-size="11" fill="#64748b">锚点 python/tutorials/06-fused-attention.py:L62(alpha)、L63(ℓ 乘 alpha)、L65(acc 乘 alpha)</text>
</svg>