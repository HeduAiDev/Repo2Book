<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 502">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker></defs>
<rect width="1000" height="502" fill="white"/>
<text x="30" y="30" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e40af">occupancy = min(寄存器限, 线程限, 共享限)：n_regs 是占用率的直接杠杆</text>
<text x="30" y="50" font-family="sans-serif" font-size="11.5" fill="#64748b">SM 资源上限（真机实测）：寄存器 65536 / 最大线程 1536 / 共享内存 102400；三个真实 kernel 同 blockDim=128 对照</text>
<rect x="220" y="108" width="242" height="28" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="341.0" y="126.0" text-anchor="middle" font-family="monospace" font-size="12.5" fill="white" font-weight="bold">add_kernel</text>
<rect x="470" y="108" width="242" height="28" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="591.0" y="126.0" text-anchor="middle" font-family="monospace" font-size="12.5" fill="white" font-weight="bold">mm_kernel</text>
<rect x="720" y="108" width="242" height="28" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="841.0" y="126.0" text-anchor="middle" font-family="monospace" font-size="12.5" fill="white" font-weight="bold">heavy_kernel</text>
<text x="204" y="177.0" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="bold" fill="#374151">n_regs</text>
<text x="341.0" y="177.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#374151" >28</text>
<text x="591.0" y="177.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#374151" >212</text>
<text x="841.0" y="177.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#374151" >26</text>
<text x="204" y="239.0" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="bold" fill="#374151">寄存器限 (blocks/SM)</text>
<text x="341.0" y="231.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#374151" >floor(65536/(28×128))</text>
<text x="341.0" y="247.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#374151" >= 18</text>
<text x="591.0" y="231.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#374151" >floor(65536/(212×128))</text>
<text x="591.0" y="247.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#374151" >= 2</text>
<text x="841.0" y="239.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#374151" >（不受限）</text>
<text x="204" y="301.0" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="bold" fill="#374151">线程限 (blocks/SM)</text>
<text x="341.0" y="301.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#374151" >floor(1536/128) = 12</text>
<text x="591.0" y="301.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#374151" >floor(1536/128) = 12</text>
<text x="841.0" y="301.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#374151" >floor(1536/128) = 12</text>
<text x="204" y="363.0" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="bold" fill="#374151">共享限 (blocks/SM)</text>
<text x="341.0" y="363.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#374151" >∞（shared=0）</text>
<text x="591.0" y="355.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#374151" >floor(102400/65536)</text>
<text x="591.0" y="371.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#374151" >= 1</text>
<text x="841.0" y="355.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#374151" >n_spills=8</text>
<text x="841.0" y="371.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#374151" >→走 local memory</text>
<text x="204" y="425.0" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="bold" fill="#374151">min → occupancy</text>
<rect x="220" y="394" width="242" height="54" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
<text x="341.0" y="417.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#047857" font-weight="bold" >min=12 → 1536/1536</text>
<text x="341.0" y="433.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#047857" font-weight="bold" >= 100%</text>
<rect x="470" y="394" width="242" height="54" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="591.0" y="417.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#b91c1c" font-weight="bold" >min=1 → 128/1536</text>
<text x="591.0" y="433.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#b91c1c" font-weight="bold" >= 8.33%</text>
<rect x="720" y="394" width="242" height="54" rx="4" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
<text x="841.0" y="417.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#c2410c" font-weight="bold" >spill&gt;0：每次溢出</text>
<text x="841.0" y="433.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#c2410c" font-weight="bold" >访存一趟高延迟 global</text>
<text x="30" y="482" font-family="sans-serif" font-size="11" fill="#64748b">绿=占用率健康,红=占用率受限（共享内存/寄存器挤占）,橙=spill(每次溢出多一趟高延迟访存,慢信号)。</text>
</svg>