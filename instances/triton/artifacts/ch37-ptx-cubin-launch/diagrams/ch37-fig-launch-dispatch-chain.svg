<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 952">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker></defs>
<rect width="1000" height="952" fill="white"/>
<text x="40" y="34" font-family="sans-serif" font-size="16.5" font-weight="bold" fill="#1e40af">发射调用链：kernel[grid](*args) → _init_handles 懒装载 → cuLaunchKernel(Ex)</text>
<text x="40" y="56" font-family="sans-serif" font-size="12" fill="#64748b">third_party/nvidia/backend/driver.py:L117-L239 —— CudaLauncher.__call__</text>
<rect x="320" y="92" width="640" height="60" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
<text x="640" y="127" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0c4a6e">kernel[grid](*args) —— 用户调用</text>
<line x1="640" y1="152" x2="640" y2="182" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="320" y="182" width="640" height="82" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
<text x="640" y="217" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0c4a6e">首调触发 _init_handles()：load_binary 懒装载</text>
<text x="640" y="239" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0c4a6e">（module/function/n_regs/n_spills）、建 launcher</text>
<line x1="640" y1="264" x2="640" y2="294" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="320" y="294" width="640" height="60" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
<text x="640" y="329" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0c4a6e">runner：self.run(grid, stream, function, metadata, hooks, *args)</text>
<line x1="640" y1="354" x2="640" y2="384" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="320" y="384" width="640" height="82" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
<text x="640" y="419" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0c4a6e">生成的 launch(...)：PyArg_ParseTuple 解析实参、getPointer 取指针</text>
<text x="640" y="441" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0c4a6e">→ 调 _launch(...)</text>
<line x1="640" y1="466" x2="640" y2="496" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="320" y="496" width="640" height="50" rx="14" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="640" y="526" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#78350f">gridX × gridY × gridZ &gt; 0 ？（driver.py:L210）</text>
<line x1="320" y1="521" x2="150" y2="521" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,3"/>
<text x="150" y="513" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#64748b">否</text>
<line x1="150" y1="521" x2="150" y2="586" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#a)"/>
<rect x="40" y="586" width="220" height="50" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="150" y="616" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">空 grid，不发射</text>
<line x1="640" y1="546" x2="640" y2="576" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<text x="656" y="570" text-anchor="start" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#78350f">是</text>
<rect x="320" y="576" width="640" height="50" rx="14" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="640" y="606" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#78350f">num_ctas == 1 ？（driver.py:L211）</text>
<line x1="640" y1="626" x2="640" y2="646" stroke="#334155" stroke-width="2"/>
<line x1="470" y1="646" x2="810" y2="646" stroke="#334155" stroke-width="2"/>
<line x1="470" y1="646" x2="470" y2="674" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<line x1="810" y1="646" x2="810" y2="674" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<text x="470" y="638" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#15803d">是（经典 API）</text>
<text x="810" y="638" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#c2410c">否（Hopper cluster）</text>
<rect x="320" y="674" width="300" height="96" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
<text x="470" y="698" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#166534">cuLaunchKernel(function,</text>
<text x="470" y="718" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#166534">gridX, gridY, gridZ,</text>
<text x="470" y="738" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#166534">32 × num_warps, 1, 1, ...)</text>
<rect x="660" y="674" width="300" height="136" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="1.8"/>
<text x="810" y="698" text-anchor="middle" font-family="monospace" font-size="11" fill="#9a3412">组 CUlaunchConfig +</text>
<text x="810" y="718" text-anchor="middle" font-family="monospace" font-size="11" fill="#9a3412">2 个 launchAttr：</text>
<text x="810" y="738" text-anchor="middle" font-family="monospace" font-size="11" fill="#9a3412">CLUSTER_DIMENSION /</text>
<text x="810" y="758" text-anchor="middle" font-family="monospace" font-size="11" fill="#9a3412">CLUSTER_SCHEDULING_POLICY</text>
<text x="810" y="778" text-anchor="middle" font-family="monospace" font-size="11" fill="#9a3412">→ dlsym 出 cuLaunchKernelEx(...)</text>
<rect x="40" y="844" width="920" height="68" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
<text x="56" y="868" font-family="sans-serif" font-size="12.5" fill="#1e3a5f">cluster 场景才会走 cuLaunchKernelEx——普通核（num_ctas==1）恒走 cuLaunchKernel，</text>
<text x="56" y="892" font-family="sans-serif" font-size="12.5" fill="#1e3a5f">blockDim 恒为 32×num_warps（每 warp 32 线程）；空 grid（三维之积为 0）在判定 A 处提前拦下、不发射。</text>
</svg>