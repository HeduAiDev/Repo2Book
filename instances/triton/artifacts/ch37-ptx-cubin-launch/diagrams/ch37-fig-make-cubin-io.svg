<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 774">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker></defs>
<rect width="700" height="774" fill="white"/>
<text x="40" y="34" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1e40af">make_cubin：起 ptxas 子进程，把 PTX 文本汇编成 cubin 字节</text>
<text x="40" y="56" font-family="sans-serif" font-size="12" fill="#64748b">third_party/nvidia/backend/compiler.py:L340-L380 —— 编译链唯一起外部工具进程的一段</text>
<rect x="40" y="92" width="620" height="60" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
<text x="350" y="127" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0c4a6e">定位 ptxas —— _path_to_binary('ptxas')：TRITON_PTXAS_PATH env 或 backend bin/ptxas</text>
<line x1="350" y1="152" x2="350" y2="184" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="40" y="184" width="620" height="60" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
<text x="350" y="219" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0c4a6e">拼命令：ptxas -lineinfo -v --gpu-name=sm_120a add_kernel.ptx -o add_kernel.o</text>
<line x1="350" y1="244" x2="350" y2="276" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="40" y="276" width="620" height="60" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
<text x="350" y="311" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0c4a6e">subprocess.run(ptxas_cmd, check=True) —— 起子进程</text>
<line x1="350" y1="336" x2="350" y2="368" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="40" y="368" width="620" height="50" rx="14" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="350" y="398" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#78350f">返回码 == 0 ?</text>
<line x1="350" y1="418" x2="350" y2="438" stroke="#334155" stroke-width="2"/>
<line x1="180" y1="438" x2="520" y2="438" stroke="#334155" stroke-width="2"/>
<line x1="180" y1="438" x2="180" y2="468" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<line x1="520" y1="438" x2="520" y2="468" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<text x="180" y="430" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#15803d">是（成功）</text>
<text x="520" y="430" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#b91c1c">否（非零返回码）</text>
<rect x="30" y="468" width="300" height="60" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="180" y="492" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#166534">stderr: "Used 28 registers,</text>
<text x="180" y="510" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#166534">0 bytes spill"</text>
<line x1="180" y1="528" x2="180" y2="554" stroke="#15803d" stroke-width="2" marker-end="url(#a)"/>
<rect x="30" y="554" width="300" height="54" rx="10" fill="#ecfdf5" stroke="#22c55e" stroke-width="1.6"/>
<text x="180" y="576" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#166534">读回 cubin 字节：</text>
<text x="180" y="596" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#15803d">add_kernel.o = 10544 字节</text>
<rect x="370" y="468" width="300" height="84" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="520" y="490" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7f1d1d">255 → Internal Triton PTX codegen error</text>
<text x="520" y="508" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7f1d1d">128+SIGSEGV → ptxas raised SIGSEGV</text>
<text x="520" y="526" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7f1d1d">其它 → ptxas failed with error code N</text>
<line x1="520" y1="552" x2="520" y2="578" stroke="#b91c1c" stroke-width="2" marker-end="url(#a)"/>
<rect x="370" y="578" width="300" height="54" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="520" y="600" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#b91c1c">RuntimeError</text>
<text x="520" y="620" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7f1d1d">附 stderr + 可复现命令</text>
<rect x="40" y="666" width="620" height="68" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
<text x="56" y="690" font-family="sans-serif" font-size="12.5" fill="#1e3a5f">编译链共 5 段（ttir/ttgir/llir/ptx/cubin，add_stages 注册）——make_cubin 是</text>
<text x="56" y="714" font-family="sans-serif" font-size="12.5" fill="#1e3a5f">唯一起外部进程的一段（5/1）；-v 拿到的寄存器/spill 回执是判断 kernel 性能的第一手数据。</text>
</svg>