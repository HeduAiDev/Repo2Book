<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 804 796">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker></defs>
<rect width="804" height="796" fill="white"/>
<text x="40" y="34" font-family="sans-serif" font-size="16.5" font-weight="bold" fill="#1e40af">loadBinary：装载 cubin、读回 n_regs/n_spills，按 48KB 阈值 opt-in 动态共享内存</text>
<text x="40" y="56" font-family="sans-serif" font-size="12" fill="#64748b">third_party/nvidia/backend/driver.c:L93-L140</text>
<rect x="40" y="92" width="724" height="60" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
<text x="402" y="127" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0c4a6e">cuModuleLoadData(cubin) —— 把 cubin 字节装载进显存</text>
<line x1="402" y1="152" x2="402" y2="184" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="40" y="184" width="724" height="60" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
<text x="402" y="219" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0c4a6e">cuModuleGetFunction(name) —— 拿函数句柄</text>
<line x1="402" y1="244" x2="402" y2="276" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="40" y="276" width="724" height="54" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/>
<text x="402" y="298" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#5b21b6">cuFuncGetAttribute 读回两个 perf 命门数</text>
<text x="402" y="318" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#6d28d9">NUM_REGS → n_regs；LOCAL_SIZE_BYTES ÷ 4 → n_spills</text>
<line x1="215" y1="330" x2="215" y2="358" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#a)"/>
<rect x="40" y="358" width="350" height="54" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
<text x="215" y="380" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#2563eb">mm_kernel 读回</text>
<text x="215" y="400" text-anchor="middle" font-family="monospace" font-size="12.5" font-weight="bold" fill="#2563eb">n_regs = 212</text>
<line x1="589" y1="330" x2="589" y2="358" stroke="#c2410c" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#a)"/>
<rect x="414" y="358" width="350" height="54" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/>
<text x="589" y="380" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#c2410c">heavy_kernel 读回</text>
<text x="589" y="400" text-anchor="middle" font-family="monospace" font-size="12.5" font-weight="bold" fill="#c2410c">n_spills = 32 bytes ÷ 4 = 8</text>
<line x1="402" y1="412" x2="402" y2="472" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<text x="416" y="440" text-anchor="start" font-family="sans-serif" font-size="9.5" fill="#94a3b8">示例读数，与下方判定无因果</text>
<text x="416" y="454" text-anchor="start" font-family="sans-serif" font-size="9.5" fill="#94a3b8">——仅示意 cuFuncGetAttribute 两种读法</text>
<rect x="40" y="472" width="724" height="54" rx="14" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="402" y="494" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#78350f">shared &gt; 49152（48KB 静态共享内存硬上限）？</text>
<text x="402" y="514" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#92400e">driver.c:L132 —— shared &gt; 49152 且 shared_optin &gt; 49152</text>
<line x1="402" y1="526" x2="402" y2="546" stroke="#334155" stroke-width="2"/>
<line x1="232" y1="546" x2="572" y2="546" stroke="#334155" stroke-width="2"/>
<line x1="232" y1="546" x2="232" y2="576" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<line x1="572" y1="546" x2="572" y2="576" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<text x="232" y="538" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155">否（add_kernel 等）</text>
<text x="572" y="538" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#c2410c">是（mm_kernel：shared=65536）</text>
<rect x="82" y="576" width="300" height="60" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="232" y="602" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">不申请动态共享内存，</text>
<text x="232" y="622" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">句柄直接可用</text>
<rect x="422" y="576" width="300" height="78" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="1.8"/>
<text x="572" y="598" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#9a3412">cuFuncSetAttribute(</text>
<text x="572" y="616" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#9a3412">MAX_DYNAMIC_SHARED_SIZE_BYTES</text>
<text x="572" y="634" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7c2d12">= 设备 opt-in 上限 101376 − shared_static（未实测）)</text>
<rect x="40" y="688" width="724" height="68" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
<text x="56" y="712" font-family="sans-serif" font-size="12.5" fill="#1e3a5f">不 opt-in 就编不出大 block ——共享内存超 48KB 硬上限的 kernel（如本例 mm_kernel 的</text>
<text x="56" y="736" font-family="sans-serif" font-size="12.5" fill="#1e3a5f">64KB）必须在装载期显式申请动态额度，本例设备 opt-in 上限 101376 字节仍够用。</text>
</svg>