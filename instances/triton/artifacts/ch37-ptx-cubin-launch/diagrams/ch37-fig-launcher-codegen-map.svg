<rect x="30" y="404" width="1030" height="90" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
<text x="46" y="428" font-family="sans-serif" font-size="12" fill="#1e3a5f">固定前缀 'iiiKKOOOO'（9 字符：gridX/Y/Z + stream/function + metadata/launch_metadata/两 hook）</text>
<text x="46" y="450" font-family="sans-serif" font-size="12" fill="#1e3a5f">+ 本例 4 个签名实参的 args_format 'OOOi' → 完整 format = 'iiiKKOOOOOOOi'（9+4 = 13 字符）</text>
<text x="46" y="472" font-family="sans-serif" font-size="12" fill="#1e3a5f">3 个指针参走 getPointer 取 dev_ptr；生成 C 源 9027 字节 → 按 sha256 编成缓存 .so。</text>
