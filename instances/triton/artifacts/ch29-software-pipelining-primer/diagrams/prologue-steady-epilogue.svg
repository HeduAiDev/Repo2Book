<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1372 530">
<rect width="1372" height="530" fill="white"/>
<text x="36" y="36" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">PipelineExpander 把循环展开成三段(num_stages=3, maxStage=2)</text>
<text x="36" y="58" font-family="sans-serif" font-size="12" fill="#64748b">prologue 逐段发射 stages[op]≤i 的 op(PipelineExpander.cpp:287,305-307);num_stages-1=2 段填流水、2 段排空</text>
<rect x="246" y="88" width="428" height="20" rx="6" fill="#3b82f6" fill-opacity="0.18" stroke="#3b82f6" stroke-width="1.5"/>
<text x="460.0" y="102" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#3b82f6">prologue(填流水)</text>
<rect x="682" y="88" width="210" height="20" rx="6" fill="#22c55e" fill-opacity="0.18" stroke="#22c55e" stroke-width="1.5"/>
<text x="787.0" y="102" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#22c55e">稳态</text>
<rect x="900" y="88" width="428" height="20" rx="6" fill="#f59e0b" fill-opacity="0.18" stroke="#f59e0b" stroke-width="1.5"/>
<text x="1114.0" y="102" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f59e0b">epilogue(排空)</text>
<rect x="246" y="118" width="210" height="48" rx="4" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="351.0" y="146.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">prologue i=0</text>
<rect x="464" y="118" width="210" height="48" rx="4" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="569.0" y="146.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">prologue i=1</text>
<rect x="682" y="118" width="210" height="48" rx="4" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="787.0" y="138.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">稳态 kernel loop</text>
<text x="787.0" y="153.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">(每趟)</text>
<rect x="900" y="118" width="210" height="48" rx="4" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="1005.0" y="146.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">epilogue i=0</text>
<rect x="1118" y="118" width="210" height="48" rx="4" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="1223.0" y="146.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">epilogue i=1</text>
<text x="230" y="218.0" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="bold" fill="#374151">发射条件</text>
<text x="351.0" y="219.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >stages[op] ≤ 0</text>
<text x="569.0" y="219.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >stages[op] ≤ 1</text>
<text x="787.0" y="219.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >stage 0..2 全发</text>
<text x="1005.0" y="219.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >stages[op] ≥ 1(排空)</text>
<text x="1223.0" y="219.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >stages[op] ≥ 2</text>
<text x="230" y="302.0" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="bold" fill="#374151">本段新发射的 (迭代, stage)</text>
<text x="351.0" y="303.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >(迭代0, load)</text>
<text x="569.0" y="294.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >(迭代1, load)</text>
<text x="569.0" y="311.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >+(迭代0, wait)</text>
<text x="787.0" y="294.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >第k趟:(k+2,load)</text>
<text x="787.0" y="311.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >+(k+1,wait)+(k,dot)</text>
<text x="1005.0" y="294.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >(末, wait)</text>
<text x="1005.0" y="311.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >+(末-1, dot)</text>
<text x="1223.0" y="303.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >(末, dot)</text>
<line x1="44" y1="256" x2="1328" y2="256" stroke="#e2e8f0"/>
<text x="230" y="386.0" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="bold" fill="#374151">累计在飞迭代</text>
<rect x="246" y="344" width="210" height="76" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
<text x="351.0" y="387.0" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1d4ed8" font-weight="bold" >1</text>
<rect x="464" y="344" width="210" height="76" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
<text x="569.0" y="387.0" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1d4ed8" font-weight="bold" >2</text>
<rect x="682" y="344" width="210" height="76" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
<text x="787.0" y="387.0" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#047857" font-weight="bold" >3(满)</text>
<rect x="900" y="344" width="210" height="76" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
<text x="1005.0" y="387.0" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#c2410c" font-weight="bold" >2</text>
<rect x="1118" y="344" width="210" height="76" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
<text x="1223.0" y="387.0" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#c2410c" font-weight="bold" >1</text>
<line x1="44" y1="340" x2="1328" y2="340" stroke="#e2e8f0"/>
<text x="36" y="454" font-family="sans-serif" font-size="11" fill="#64748b">蓝=在飞迭代数递增(填流水线)、绿=满并发稳态、橙=在飞迭代数递减(排空)——prologue 与 epilogue 段数都恰是 num_stages-1=2</text>
<text x="36" y="474" font-family="sans-serif" font-size="11" fill="#64748b">num_stages=5 时 prologue/epilogue 各变为 4 段——深度越大,填/排的固定开销越大</text>
</svg>