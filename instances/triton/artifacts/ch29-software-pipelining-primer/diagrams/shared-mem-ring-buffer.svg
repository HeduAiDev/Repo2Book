<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 720">
<defs><marker id="arr" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#475569"/></marker><marker id="arrRing" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="8" markerHeight="6" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#94a3b8"/></marker></defs>
<rect width="1300" height="720" fill="white"/>
<text x="40" y="40" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">num_stages=4(非 MMAv3、直取 load):共享内存里 3 份 tile buffer 环形轮转</text>
<text x="40" y="62" font-family="sans-serif" font-size="12" fill="#64748b">第 i 次迭代的 load 写 insertIdx=i%3 格(为自己将来用);distToUse=3 拍后,同一迭代 i 自己的 dot 从 extractIdx=i%3 格读出——同一个格,写和读相隔 3 拍</text>
<text x="40" y="96" font-family="sans-serif" font-size="13" font-weight="bold" fill="#334155">迭代时间线——每格是同一个物理 buffer 格的写(insertIdx)与读(extractIdx)两次使用</text>
<rect x="50" y="110" width="150" height="82" rx="8" fill="#3b82f6" fill-opacity="0.18" stroke="#3b82f6" stroke-width="2"/>
<text x="125.0" y="130" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">迭代 0</text>
<text x="125.0" y="149" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1d4ed8">写 insertIdx=0</text>
<text x="125.0" y="166" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#b45309">读 extractIdx=0</text>
<text x="125.0" y="182" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#64748b">同一格,隔 3 拍两次用</text>
<rect x="216" y="110" width="150" height="82" rx="8" fill="#22c55e" fill-opacity="0.18" stroke="#22c55e" stroke-width="2"/>
<text x="291.0" y="130" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">迭代 1</text>
<text x="291.0" y="149" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1d4ed8">写 insertIdx=1</text>
<text x="291.0" y="166" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#b45309">读 extractIdx=1</text>
<text x="291.0" y="182" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#64748b">同一格,隔 3 拍两次用</text>
<rect x="382" y="110" width="150" height="82" rx="8" fill="#f59e0b" fill-opacity="0.18" stroke="#f59e0b" stroke-width="2"/>
<text x="457.0" y="130" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">迭代 2</text>
<text x="457.0" y="149" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1d4ed8">写 insertIdx=2</text>
<text x="457.0" y="166" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#b45309">读 extractIdx=2</text>
<text x="457.0" y="182" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#64748b">同一格,隔 3 拍两次用</text>
<rect x="548" y="110" width="150" height="82" rx="8" fill="#3b82f6" fill-opacity="0.18" stroke="#3b82f6" stroke-width="2"/>
<text x="623.0" y="130" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">迭代 3</text>
<text x="623.0" y="149" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1d4ed8">写 insertIdx=0</text>
<text x="623.0" y="166" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#b45309">读 extractIdx=0</text>
<text x="623.0" y="182" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#64748b">同一格,隔 3 拍两次用</text>
<rect x="714" y="110" width="150" height="82" rx="8" fill="#22c55e" fill-opacity="0.18" stroke="#22c55e" stroke-width="2"/>
<text x="789.0" y="130" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">迭代 4</text>
<text x="789.0" y="149" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1d4ed8">写 insertIdx=1</text>
<text x="789.0" y="166" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#b45309">读 extractIdx=1</text>
<text x="789.0" y="182" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#64748b">同一格,隔 3 拍两次用</text>
<rect x="880" y="110" width="150" height="82" rx="8" fill="#f59e0b" fill-opacity="0.18" stroke="#f59e0b" stroke-width="2"/>
<text x="955.0" y="130" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">迭代 5</text>
<text x="955.0" y="149" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1d4ed8">写 insertIdx=2</text>
<text x="955.0" y="166" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#b45309">读 extractIdx=2</text>
<text x="955.0" y="182" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#64748b">同一格,隔 3 拍两次用</text>
<text x="1044" y="155.0" font-family="sans-serif" font-size="14" fill="#94a3b8">…</text>
<path d="M 335.8,357.2 L 342.3,360.6 L 348.7,364.3 L 355.0,368.4 L 361.0,372.7 L 366.8,377.4 L 372.3,382.3 L 377.6,387.5 L 382.6,392.9 L 387.4,398.6 L 391.9,404.5 L 396.0,410.7 L 399.9,417.0 L 403.5,423.5 L 406.7,430.2 L 409.6,437.0 L 412.1,444.0 L 414.3,451.1 L 416.2,458.3 L 417.6,465.5 L 418.8,472.9 L 419.5,480.2 L 419.9,487.6 L 420.0,495.1 L 419.6,502.5" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrRing)"/>
<path d="M 353.9,616.4 L 347.6,620.3 L 341.2,624.0 L 334.6,627.4 L 327.8,630.4 L 320.9,633.1 L 313.9,635.4 L 306.7,637.4 L 299.5,639.1 L 292.2,640.4 L 284.8,641.3 L 277.4,641.8 L 270.0,642.0 L 262.6,641.8 L 255.2,641.3 L 247.8,640.4 L 240.5,639.1 L 233.3,637.4 L 226.1,635.4 L 219.1,633.1 L 212.2,630.4 L 205.4,627.4 L 198.8,624.0 L 192.4,620.3 L 186.1,616.4" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrRing)"/>
<path d="M 120.4,502.5 L 120.0,495.1 L 120.1,487.6 L 120.5,480.2 L 121.2,472.9 L 122.4,465.5 L 123.8,458.3 L 125.7,451.1 L 127.9,444.0 L 130.4,437.0 L 133.3,430.2 L 136.5,423.5 L 140.1,417.0 L 144.0,410.7 L 148.1,404.5 L 152.6,398.6 L 157.4,392.9 L 162.4,387.5 L 167.7,382.3 L 173.2,377.4 L 179.0,372.7 L 185.0,368.4 L 191.3,364.3 L 197.7,360.6 L 204.2,357.2" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrRing)"/>
<circle cx="270.0" cy="342.0" r="74" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-width="2.5"/>
<text x="270.0" y="310.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">buffer 0</text>
<text x="270.0" y="328.0" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#334155">A 8KB + B 8KB</text>
<text x="270.0" y="344.0" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#3b82f6">= 16KB</text>
<text x="270.0" y="363.0" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#1d4ed8">写 insertIdx:迭代 0,3 的 load</text>
<text x="270.0" y="379.0" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#b45309">读 extractIdx:同一迭代自己的 dot</text>
<text x="270.0" y="395.0" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#b45309">(distToUse=3 拍后读出)</text>
<circle cx="399.9" cy="567.0" r="74" fill="#22c55e" fill-opacity="0.16" stroke="#22c55e" stroke-width="2.5"/>
<text x="399.9" y="535.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">buffer 1</text>
<text x="399.9" y="553.0" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#334155">A 8KB + B 8KB</text>
<text x="399.9" y="569.0" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#22c55e">= 16KB</text>
<text x="399.9" y="588.0" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#1d4ed8">写 insertIdx:迭代 1,4 的 load</text>
<text x="399.9" y="604.0" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#b45309">读 extractIdx:同一迭代自己的 dot</text>
<text x="399.9" y="620.0" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#b45309">(distToUse=3 拍后读出)</text>
<circle cx="140.1" cy="567.0" r="74" fill="#f59e0b" fill-opacity="0.16" stroke="#f59e0b" stroke-width="2.5"/>
<text x="140.1" y="535.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">buffer 2</text>
<text x="140.1" y="553.0" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#334155">A 8KB + B 8KB</text>
<text x="140.1" y="569.0" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f59e0b">= 16KB</text>
<text x="140.1" y="588.0" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#1d4ed8">写 insertIdx:迭代 2,5 的 load</text>
<text x="140.1" y="604.0" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#b45309">读 extractIdx:同一迭代自己的 dot</text>
<text x="140.1" y="620.0" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#b45309">(distToUse=3 拍后读出)</text>
<text x="50" y="222" font-family="sans-serif" font-size="11" fill="#94a3b8">(同色 = 同一 buffer;迭代方块边框色对应下方环上同色节点)</text>
<rect x="670" y="209" width="14" height="14" rx="3" fill="#1d4ed8" fill-opacity="0.75"/>
<text x="690" y="222" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1d4ed8">写(insertIdx,load,现在)</text>
<rect x="890" y="209" width="14" height="14" rx="3" fill="#b45309" fill-opacity="0.75"/>
<text x="910" y="222" font-family="sans-serif" font-size="11" font-weight="bold" fill="#b45309">读(extractIdx,dot,distToUse=3 拍后)</text>
<rect x="624" y="342" width="330" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="642" y="370" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">共享内存占用(非 MMAv3)</text>
<text x="642" y="394" font-family="sans-serif" font-size="12" fill="#334155">numBuffers = 3 × 16KB</text>
<text x="642" y="414" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1d4ed8">= 48KB</text>
<line x1="642" y1="428" x2="936" y2="428" stroke="#e2e8f0"/>
<text x="642" y="448" font-family="sans-serif" font-size="12" fill="#334155">Hopper MMAv3:numBuffers 再 +1</text>
<text x="642" y="468" font-family="sans-serif" font-size="14" font-weight="bold" fill="#b45309">→ numBuffers=4</text>
<text x="40" y="696" font-family="sans-serif" font-size="11" fill="#64748b">每加深一个 stage(num_stages+1)恰好多一份 16KB 的 buffer 轮转格——这是 num_stages 调多爆共享内存的物理落点</text>
</svg>