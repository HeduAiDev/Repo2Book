<text x="40" y="32" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">合并访存 (coalescing)：同一个 warp 的 32 次访存，连续对齐 vs 跨步 gather</text>
<text x="40" y="56" font-family="sans-serif" font-size="12.5" fill="#475569">代码差别只是 offsets 连不连续——硬件按 128 字节对齐段归并事务，段数越多有效带宽越低</text>
<text x="280.0" y="104" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a">连续对齐 —— vector-add 的 offsets</text>
