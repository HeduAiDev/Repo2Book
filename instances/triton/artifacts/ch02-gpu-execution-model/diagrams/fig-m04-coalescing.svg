<text x="596" y="340" font-family="sans-serif" font-size="12" fill="#334155">warp 触及字节地址范围：0 .. 3968</text>
<text x="596" y="362" font-family="sans-serif" font-size="16" font-weight="bold" fill="#dc2626">有效带宽 = 1/32 带宽</text>
<text x="40" y="430" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">warp lane 数 = 32；同样 32 次访存，事务数差 32 倍，带宽落差 32 倍——机器成因只有一条：地址是否落在同一 128 字节对齐段。</text>
