<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 352">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker></defs>
<rect width="1080" height="352" fill="white"/>
<text x="40" y="32" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">SPMD tile 切分:向量长度 N=256、BLOCK_SIZE=64 → 4 个 program</text>
<text x="40" y="56" font-family="sans-serif" font-size="12.5" fill="#475569">一个 program 处理一个 tile，不是一个线程处理一个元素——四块首尾相接、互不重叠、恰好铺满</text>
<rect x="40.0" y="96" width="250.0" height="46" fill="#3b82f6" stroke="white" stroke-width="1.5" opacity="0.85"/>
<rect x="290.0" y="96" width="250.0" height="46" fill="#7c3aed" stroke="white" stroke-width="1.5" opacity="0.85"/>
<rect x="540.0" y="96" width="250.0" height="46" fill="#059669" stroke="white" stroke-width="1.5" opacity="0.85"/>
<rect x="790.0" y="96" width="250.0" height="46" fill="#d97706" stroke="white" stroke-width="1.5" opacity="0.85"/>
<rect x="40" y="96" width="1000" height="46" fill="none" stroke="#1e293b" stroke-width="2"/>
<line x1="40.0" y1="96" x2="40.0" y2="142" stroke="#1e293b" stroke-width="1.5"/>
<text x="40.0" y="160" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">0</text>
<line x1="290.0" y1="96" x2="290.0" y2="142" stroke="#1e293b" stroke-width="1.5"/>
<text x="290.0" y="160" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">64</text>
<line x1="540.0" y1="96" x2="540.0" y2="142" stroke="#1e293b" stroke-width="1.5"/>
<text x="540.0" y="160" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">128</text>
<line x1="790.0" y1="96" x2="790.0" y2="142" stroke="#1e293b" stroke-width="1.5"/>
<text x="790.0" y="160" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">192</text>
<line x1="1040.0" y1="96" x2="1040.0" y2="142" stroke="#1e293b" stroke-width="1.5"/>
<text x="1040.0" y="160" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">256</text>
<text x="40" y="88" font-family="sans-serif" font-size="11.5" fill="#64748b">完整向量 [0, 256)，元素下标沿横轴递增</text>
<line x1="165.0" y1="142" x2="165.0" y2="186" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="48.0" y="186" width="234.0" height="108" rx="8" fill="white" stroke="#3b82f6" stroke-width="2"/>
<rect x="48.0" y="186" width="234.0" height="28" rx="8" fill="#3b82f6"/>
<rect x="48.0" y="200" width="234.0" height="14" fill="#3b82f6"/>
<text x="165.0" y="205" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="white">program_id=0</text>
<text x="165.0" y="234" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">block_start = 0×64 = 0</text>
<text x="165.0" y="254" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">offsets = [0:64)</text>
<text x="165.0" y="278" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#475569">第 0 个 program 包下前 64 个元素</text>
<line x1="415.0" y1="142" x2="415.0" y2="186" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="298.0" y="186" width="234.0" height="108" rx="8" fill="white" stroke="#7c3aed" stroke-width="2"/>
<rect x="298.0" y="186" width="234.0" height="28" rx="8" fill="#7c3aed"/>
<rect x="298.0" y="200" width="234.0" height="14" fill="#7c3aed"/>
<text x="415.0" y="205" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="white">program_id=1</text>
<text x="415.0" y="234" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">block_start = 1×64 = 64</text>
<text x="415.0" y="254" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">offsets = [64:128)</text>
<text x="415.0" y="278" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#475569">工号一变，起点整体平移 BLOCK</text>
<line x1="665.0" y1="142" x2="665.0" y2="186" stroke="#059669" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="548.0" y="186" width="234.0" height="108" rx="8" fill="white" stroke="#059669" stroke-width="2"/>
<rect x="548.0" y="186" width="234.0" height="28" rx="8" fill="#059669"/>
<rect x="548.0" y="200" width="234.0" height="14" fill="#059669"/>
<text x="665.0" y="205" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="white">program_id=2</text>
<text x="665.0" y="234" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">block_start = 2×64 = 128</text>
<text x="665.0" y="254" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">offsets = [128:192)</text>
<text x="665.0" y="278" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#475569">四份 tile 首尾相接、互不重叠</text>
<line x1="915.0" y1="142" x2="915.0" y2="186" stroke="#d97706" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="798.0" y="186" width="234.0" height="108" rx="8" fill="white" stroke="#d97706" stroke-width="2"/>
<rect x="798.0" y="186" width="234.0" height="28" rx="8" fill="#d97706"/>
<rect x="798.0" y="200" width="234.0" height="14" fill="#d97706"/>
<text x="915.0" y="205" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="white">program_id=3</text>
<text x="915.0" y="234" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">block_start = 3×64 = 192</text>
<text x="915.0" y="254" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">offsets = [192:256)</text>
<text x="915.0" y="278" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#475569">并集恰好铺满 [0:256)</text>
<text x="40" y="328" font-family="sans-serif" font-size="12.5" fill="#334155">程序员写的是 tile 级代码(block_start=pid×BLOCK, offsets=block_start+arange(0,BLOCK));编译器负责把 tile 铺到 warp/lane。</text>
</svg>