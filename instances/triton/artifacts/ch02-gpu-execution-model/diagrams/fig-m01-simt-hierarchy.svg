<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 554">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker></defs>
<rect width="1180" height="554" fill="white"/>
<text x="40" y="32" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">SIMT 执行层次:grid → block(CTA) → warp(32 lane) → lane</text>
<text x="40" y="56" font-family="sans-serif" font-size="12.5" fill="#475569">Triton 显式写到 block/tile 这一层(tl.program_id);再往下由编译器与硬件替你划分</text>
<rect x="34" y="82" width="1112" height="176" rx="10" fill="#eff6ff" stroke="none"/>
<rect x="34" y="252" width="1112" height="162" rx="10" fill="#f1f5f9" stroke="none"/>
<text x="40" y="129.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">grid（发射）</text>
<text x="40" y="147.0" font-family="sans-serif" font-size="11" fill="#64748b">launch grid</text>
<rect x="230" y="104" width="76" height="58" rx="6" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/>
<text x="268.0" y="138.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1e3a5f">block 0</text>
