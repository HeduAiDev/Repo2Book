<text x="40" y="448" font-family="sans-serif" font-size="12.5" fill="#334155">一个 BLOCK_SIZE=1024 的 block 被硬件切成 32 个 warp,同 warp 内 32 个 lane 锁步执行同一条指令;</text>
<text x="40" y="468" font-family="sans-serif" font-size="12.5" fill="#334155">tl.program_id 只给到 block 层(降级为 PTX %ctaid),warp/lane 划分完全不由 kernel 代码指定。</text>
<text x="40" y="488" font-family="sans-serif" font-size="12.5" fill="#334155">warp 内 lane 范围: warp0 = 0..31, warp1 = 32..63 —— 硬件按 32 一组顺序切分,不跳号不重叠。</text>
</svg>