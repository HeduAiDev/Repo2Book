<text x="40" y="232.0" font-family="sans-serif" font-size="11" fill="#64748b">tl.program_id 停在这层</text>
<rect x="230" y="194" width="560" height="48" rx="6" fill="#3b82f6" stroke="#1e3a5f" stroke-width="2"/>
<text x="510.0" y="223.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="white">block 0 — BLOCK_SIZE=1024 个逻辑线程</text>
<line x1="34" y1="257.0" x2="1146" y2="257.0" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6,4"/>
<text x="1136" y="251.0" text-anchor="end" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#1d4ed8">↑ 程序员显式写到这里</text>
<text x="1136" y="273.0" text-anchor="end" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#64748b">↓ 编译器 + 硬件划分(不可见)</text>
<line x1="510.0" y1="242" x2="510.0" y2="274" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#a)"/>
