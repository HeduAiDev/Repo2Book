<text x="538.0" y="138.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1e3a5f">block 3</text>
<rect x="590" y="104" width="76" height="58" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="628.0" y="138.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1e3a5f">...</text>
<text x="684" y="138.0" font-family="sans-serif" font-size="12" fill="#475569">program_id 逐个区分身份</text>
<line x1="268.0" y1="162" x2="268.0" y2="196" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#a)"/>
