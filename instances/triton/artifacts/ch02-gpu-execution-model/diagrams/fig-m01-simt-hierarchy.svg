<text x="678.0" y="301.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#312e81">warp31</text>
<text x="732" y="301.0" font-family="sans-serif" font-size="12" fill="#475569">BLOCK_SIZE=1024 ÷ 32 = 32 个 warp</text>
<line x1="268.0" y1="318" x2="268.0" y2="352" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#a)"/>
