<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1136 460">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker></defs>
<rect width="1136" height="460" fill="white"/>
<text x="34" y="34" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">占用率 occupancy——每线程寄存器数翻倍，可驻留 warp 减半</text>
<text x="34" y="54" font-family="sans-serif" font-size="12.5" fill="#64748b">Ampere 级数量级：SM 寄存器堆 65536 个、最大 2048 线程 = 64 warp/SM</text>
<rect x="182" y="108" width="220" height="34" rx="4" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.4"/>
<text x="292.0" y="130.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="white" font-weight="bold">r=32 寄存器/线程</text>
<rect x="412" y="108" width="220" height="34" rx="4" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.4"/>
<text x="522.0" y="130.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="white" font-weight="bold">r=64 寄存器/线程</text>
<rect x="642" y="108" width="220" height="34" rx="4" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.4"/>
<text x="752.0" y="130.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="white" font-weight="bold">r=128 寄存器/线程</text>
<rect x="872" y="108" width="220" height="34" rx="4" fill="#7c3aed" stroke="#1e3a5f" stroke-width="1.4"/>
<text x="982.0" y="130.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="white" font-weight="bold">共享内存闸主导（例）</text>
<text x="166" y="179.0" text-anchor="end" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#374151">可驻留线程数</text>
<text x="292.0" y="179.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1f2937" >65536/32 = 2048</text>
<text x="522.0" y="179.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1f2937" >65536/64 = 1024</text>
<text x="752.0" y="179.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1f2937" >65536/128 = 512</text>
<text x="982.0" y="179.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1f2937" >3 block × 256 = 768</text>
<text x="166" y="231.0" text-anchor="end" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#374151">可驻留 warp 数</text>
<text x="292.0" y="231.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1f2937" >64</text>
<text x="522.0" y="231.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1f2937" >32</text>
<text x="752.0" y="231.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1f2937" >16</text>
<text x="982.0" y="231.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1f2937" >24</text>
<text x="166" y="283.0" text-anchor="end" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#374151">occupancy</text>
<rect x="182" y="256" width="220" height="44" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
<text x="292.0" y="283.0" text-anchor="middle" font-family="sans-serif" font-size="14.5" fill="#047857" font-weight="bold" >100%</text>
<rect x="412" y="256" width="220" height="44" rx="4" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
<text x="522.0" y="283.0" text-anchor="middle" font-family="sans-serif" font-size="14.5" fill="#b45309" font-weight="bold" >50%</text>
<rect x="642" y="256" width="220" height="44" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="752.0" y="283.0" text-anchor="middle" font-family="sans-serif" font-size="14.5" fill="#b91c1c" font-weight="bold" >25%</text>
<rect x="872" y="256" width="220" height="44" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="982.0" y="283.0" text-anchor="middle" font-family="sans-serif" font-size="14.5" fill="#b91c1c" font-weight="bold" >38%</text>
<text x="166" y="335.0" text-anchor="end" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#374151">限制闸</text>
<text x="292.0" y="335.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1f2937" >寄存器闸</text>
<text x="522.0" y="335.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1f2937" >寄存器闸</text>
<text x="752.0" y="335.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1f2937" >寄存器闸</text>
<text x="982.0" y="335.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1f2937" >共享内存闸（每 block 48KiB）</text>
<line x1="406" y1="242" x2="408" y2="242" stroke="#d97706" stroke-width="1.6" marker-end="url(#a)"/>
<text x="407.0" y="236" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#92400e">×2 寄存器</text>
<line x1="636" y1="242" x2="638" y2="242" stroke="#d97706" stroke-width="1.6" marker-end="url(#a)"/>
<text x="637.0" y="236" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#92400e">×2 寄存器</text>
<text x="34" y="390" font-family="sans-serif" font-size="12.5" fill="#334155">寄存器闸：occ = min(2048, 65536÷r) / 2048——r 每翻倍，occupancy 减半（32→64→128 对应 100%→50%→25%）。</text>
<text x="34" y="412" font-family="sans-serif" font-size="12.5" fill="#334155">occupancy 取寄存器闸与共享内存闸的下确界——右列 32 寄存器(寄存器闸100%)却被共享内存卡到 38%，与寄存器无关。这是全书第一把性能判据尺。</text>
</svg>