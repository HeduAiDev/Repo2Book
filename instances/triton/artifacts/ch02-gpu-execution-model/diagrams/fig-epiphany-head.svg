<text x="470" y="312" text-anchor="end" font-family="sans-serif" font-size="10.5" fill="#64748b">lane（32 个，同一 warp 内锁步执行同一条指令）</text>
<text x="255.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#92400e">这个 warp 的 32 个 lane —— 它们摸的地址连不连续，决定下面这次访问要几次事务</text>
<text x="700" y="82" font-family="sans-serif" font-size="14.5" font-weight="bold" fill="#1e40af">② 内存延迟金字塔（Ampere 级数量级，架构相关）</text>
<rect x="839.2" y="96" width="201.6" height="62" rx="6" fill="#93c5fd" stroke="#1e3a5f" stroke-width="1.3"/>
<text x="940.0" y="123.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e3a5f">寄存器 register</text>
<text x="940.0" y="143.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1e3a5f">~1 cycle</text>
<rect x="796.0" y="166" width="288.0" height="62" rx="6" fill="#60a5fa" stroke="#1e3a5f" stroke-width="1.3"/>
<text x="940.0" y="193.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e3a5f">共享内存 shared</text>
<text x="940.0" y="213.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1e3a5f">~20-30 cycle</text>
<rect x="748.0" y="236" width="384.0" height="62" rx="6" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.3"/>
<text x="940.0" y="263.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="white">L2 缓存</text>
<text x="940.0" y="283.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="white">~200 cycle</text>
<rect x="700.0" y="306" width="480.0" height="62" rx="6" fill="#1d4ed8" stroke="#1e3a5f" stroke-width="1.3"/>
<text x="940.0" y="333.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="white">全局显存 global (HBM)</text>
<text x="940.0" y="353.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="white">~400-800 cycle</text>
<text x="700" y="394" font-family="sans-serif" font-size="12" fill="#334155">寄存器 ↔ 全局显存量级差 ≥ 100×——每往下一层，大致慢一个数量级</text>
<path d="M 480 333 C 585.0 333, 585.0 337.0, 690 337.0" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#ah)"/>
<text x="585.0" y="321.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#92400e">tl.load / tl.store</text>
<text x="585.0" y="339.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#92400e">摸的正是最慢这层</text>
<text x="40" y="426" font-family="sans-serif" font-size="14.5" font-weight="bold" fill="#1e40af">③ 落地差别:32 个地址连续 vs 分散——事务数差 32 倍</text>
<rect x="40.0" y="440" width="550.0" height="118" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
<text x="58.0" y="466" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">连续对齐（vector-add 的 offsets）</text>
<text x="58.0" y="488" font-family="sans-serif" font-size="12" fill="#334155">32 lane × 4B = 128B，同落 1 个对齐段</text>
<text x="58.0" y="522" font-family="sans-serif" font-size="20" font-weight="bold" fill="#16a34a">1 次事务</text>
<text x="572.0" y="522" text-anchor="end" font-family="sans-serif" font-size="14" font-weight="bold" fill="#16a34a">满带宽</text>
<rect x="630.0" y="440" width="550.0" height="118" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
<text x="648.0" y="466" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">跨步 gather（stride=32）</text>
<text x="648.0" y="488" font-family="sans-serif" font-size="12" fill="#334155">32 个地址散落 32 个不同对齐段</text>
<text x="648.0" y="522" font-family="sans-serif" font-size="20" font-weight="bold" fill="#dc2626">32 次事务</text>
<text x="1162.0" y="522" text-anchor="end" font-family="sans-serif" font-size="14" font-weight="bold" fill="#dc2626">带宽 1/32</text>
