<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 528">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker></defs>
<rect width="860" height="528" fill="white"/>
<text x="40" y="32" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">内存延迟金字塔——越靠上越快越小，越往下越慢越大</text>
<text x="40" y="56" font-family="sans-serif" font-size="12.5" fill="#475569">Ampere 级数量级，绝对 cycle 数随架构变化；写快 kernel = 数据尽量留在上层、下层访问尽量少且合并</text>
<rect x="352.0" y="108" width="156.0" height="76" rx="7" fill="#93c5fd" stroke="#1e3a5f" stroke-width="1.4"/>
<text x="430.0" y="140.0" text-anchor="middle" font-family="sans-serif" font-size="14.5" font-weight="bold" fill="#1e3a5f">寄存器 register</text>
<text x="430.0" y="164.0" text-anchor="middle" font-family="sans-serif" font-size="13.5" fill="#1e3a5f">~1 cycle</text>
<line x1="554.0" y1="180" x2="554.0" y2="198" stroke="#d97706" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="294.79999999999995" y="194" width="270.40000000000003" height="76" rx="7" fill="#60a5fa" stroke="#1e3a5f" stroke-width="1.4"/>
<text x="430.0" y="226.0" text-anchor="middle" font-family="sans-serif" font-size="14.5" font-weight="bold" fill="#1e3a5f">共享内存 shared memory (SMEM)</text>
<text x="430.0" y="250.0" text-anchor="middle" font-family="sans-serif" font-size="13.5" fill="#1e3a5f">~20-30 cycle</text>
<line x1="611.2" y1="266" x2="611.2" y2="284" stroke="#d97706" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="232.4" y="280" width="395.2" height="76" rx="7" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.4"/>
<text x="430.0" y="312.0" text-anchor="middle" font-family="sans-serif" font-size="14.5" font-weight="bold" fill="white">L2 缓存</text>
<text x="430.0" y="336.0" text-anchor="middle" font-family="sans-serif" font-size="13.5" fill="white">~200 cycle</text>
<line x1="673.6" y1="352" x2="673.6" y2="370" stroke="#d97706" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="170.0" y="366" width="520.0" height="76" rx="7" fill="#1d4ed8" stroke="#1e3a5f" stroke-width="1.4"/>
<text x="430.0" y="398.0" text-anchor="middle" font-family="sans-serif" font-size="14.5" font-weight="bold" fill="white">全局显存 global (HBM/DRAM)</text>
<text x="430.0" y="422.0" text-anchor="middle" font-family="sans-serif" font-size="13.5" fill="white">~400-800 cycle</text>
<text x="760.0" y="193.0" font-family="sans-serif" font-size="11" fill="#92400e">~20-30× 慢</text>
<text x="760.0" y="279.0" font-family="sans-serif" font-size="11" fill="#92400e">~7-10× 慢</text>
<text x="760.0" y="365.0" font-family="sans-serif" font-size="11" fill="#92400e">~2-4× 慢</text>
<text x="40" y="482" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">寄存器 ↔ 全局显存量级差 ≥ 100×</text>
<text x="40" y="504" font-family="sans-serif" font-size="12.5" fill="#334155">vector-add 的 tl.load / tl.store 摸的正是最底那层——既要合并成尽量少事务，又要靠 occupancy 藏住这几百 cycle 的延迟。</text>
</svg>