<text x="239.0" y="131.6" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">add_kernel</text>
<text x="239.0" y="144.8" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#64748b">SPMD 入口：一个 program 处理一个 </text>
<text x="239.0" y="159.2" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#64748b">tile（pid→offsets→mask）</text>
<rect x="300.0" y="100.0" width="40" height="20" rx="10.0" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
<text x="320.0" y="114.0" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#4338ca">§1</text>
<rect x="374.0" y="110.0" width="190" height="60" rx="12" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<text x="469.0" y="131.6" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">cdiv</text>
<text x="469.0" y="144.8" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#64748b">主机侧 add()：grid=cdiv(N,BLOCK)</text>
<text x="469.0" y="159.2" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#64748b"> 向上取整，定 program 数</text>
<rect x="530.0" y="100.0" width="40" height="20" rx="10.0" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
<text x="550.0" y="114.0" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#4338ca">§1</text>
<rect x="604.0" y="110.0" width="190" height="60" rx="12" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<text x="699.0" y="131.6" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">tl.load</text>
<text x="699.0" y="144.8" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#64748b">mask 守界后取数；tl.store 同样守界</text>
<text x="699.0" y="159.2" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#64748b">写回全局显存</text>
<rect x="760.0" y="100.0" width="40" height="20" rx="10.0" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
<text x="780.0" y="114.0" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#4338ca">§1</text>
<rect x="144.0" y="248.0" width="190" height="60" rx="12" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<text x="239.0" y="269.6" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">program_id</text>
<text x="239.0" y="282.8" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#64748b">→PTX %ctaid，坐实 </text>
<text x="239.0" y="297.2" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#64748b">program=block(CTA)；往下切 warp/lane</text>
<rect x="300.0" y="238.0" width="40" height="20" rx="10.0" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
<text x="320.0" y="252.0" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#4338ca">§2</text>
<rect x="374.0" y="248.0" width="190" height="60" rx="12" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<text x="469.0" y="269.6" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">内存延迟金字塔</text>
<text x="469.0" y="282.8" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#64748b">寄存器~1 cycle → 全局显存~400-800</text>
<text x="469.0" y="297.2" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#64748b"> cycle</text>
<rect x="530.0" y="238.0" width="40" height="20" rx="10.0" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
<text x="550.0" y="252.0" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#4338ca">§3</text>
<rect x="604.0" y="248.0" width="190" height="60" rx="12" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<text x="699.0" y="269.6" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">合并访存</text>
<text x="699.0" y="282.8" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#64748b">连续对齐地址 1 次事务；跨步 gather</text>
<text x="699.0" y="297.2" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#64748b"> 32 次事务</text>
<rect x="760.0" y="238.0" width="40" height="20" rx="10.0" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
<text x="780.0" y="252.0" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#4338ca">§4</text>
<rect x="144.0" y="386.0" width="190" height="60" rx="12" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<text x="239.0" y="407.6" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">occupancy</text>
<text x="239.0" y="420.8" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#64748b">活跃 warp / 上限；受寄存器与共享内</text>
<text x="239.0" y="435.2" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#64748b">存双闸压制</text>
<rect x="300.0" y="376.0" width="40" height="20" rx="10.0" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
<text x="320.0" y="390.0" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#4338ca">§5</text>
<rect x="374.0" y="386.0" width="190" height="60" rx="12" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<text x="469.0" y="407.6" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">register spill</text>
<text x="469.0" y="420.8" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#64748b">超预算变量塌回 DRAM，单次访问变慢约</text>
<text x="469.0" y="435.2" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#64748b"> 600×</text>
<rect x="530.0" y="376.0" width="40" height="20" rx="10.0" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
<text x="550.0" y="390.0" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#4338ca">§6</text>
<rect x="604.0" y="386.0" width="190" height="60" rx="12" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<text x="699.0" y="407.6" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">三把尺收束</text>
<text x="699.0" y="420.8" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#64748b">coalescing + occupancy + spill </text>
<text x="699.0" y="435.2" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#64748b">一起量，决定 kernel 快慢</text>
