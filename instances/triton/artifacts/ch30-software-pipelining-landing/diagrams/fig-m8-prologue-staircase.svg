<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 858 622">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker></defs>
<rect width="858" height="622" fill="white"/>
<text x="44" y="34" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">Prologue 两级台阶:把环形缓冲预填到 2 槽</text>
<text x="44" y="56" font-family="sans-serif" font-size="12.5" fill="#64748b">maxStage=2 => prologue 段数=2;num_stages=3,sm90(matmul_sm90_ns3.ttgir.mlir)</text>
<rect x="44" y="108" width="560" height="110" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="62" y="134" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">段 0 — 守卫 trip &gt; 0</text>
<text x="62" y="158" font-family="sans-serif" font-size="12" fill="#1e293b">守卫谓词: trip &gt; 0 (%44 = cmpi sgt %39, 0)</text>
<text x="62" y="178" font-family="sans-serif" font-size="12" fill="#1e293b">写入槽: 槽 0 (subview %42[0])</text>
<text x="62" y="198" font-family="sans-serif" font-size="12" fill="#1e293b">发射: async_copy A、B -&gt; 槽0 + commit</text>
<line x1="324.0" y1="218" x2="324.0" y2="256" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="44" y="262" width="560" height="110" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="62" y="288" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">段 1 — 守卫 trip &gt; 1</text>
<text x="62" y="312" font-family="sans-serif" font-size="12" fill="#1e293b">守卫谓词: trip &gt; 1 (%53 = cmpi sgt %39, 1)</text>
<text x="62" y="332" font-family="sans-serif" font-size="12" fill="#1e293b">写入槽: 槽 1 (subview %42[1])</text>
<text x="62" y="352" font-family="sans-serif" font-size="12" fill="#1e293b">发射: 先 addptr 推进指针,再 async_copy A、B -&gt; 槽1 + commit</text>
<line x1="324.0" y1="372" x2="324.0" y2="410" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="44" y="416" width="560" height="110" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="62" y="442" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">稳态入口 iter_args 初值</text>
<text x="62" y="466" font-family="sans-serif" font-size="12" fill="#1e293b">insertIdx = 1(写游标从槽1起)</text>
<text x="62" y="486" font-family="sans-serif" font-size="12" fill="#1e293b">extractIdx = -1(读游标预留2拍)</text>
<text x="62" y="506" font-family="sans-serif" font-size="12" fill="#1e293b">prologue 已填槽 0、1,槽 2 留给稳态首拍写</text>
<text x="739.0" y="68" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">Prologue 结束后</text>
<rect x="664" y="108" width="150" height="70" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="739.0" y="136" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">槽 0</text>
<text x="739.0" y="158" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#15803d">iter0</text>
<line x1="604" y1="163.0" x2="664" y2="143.0" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3"/>
<rect x="664" y="192" width="150" height="70" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="739.0" y="220" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">槽 1</text>
<text x="739.0" y="242" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#15803d">iter1</text>
<line x1="604" y1="317.0" x2="664" y2="227.0" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3"/>
<rect x="664" y="276" width="150" height="70" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="739.0" y="304" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">槽 2</text>
<text x="739.0" y="326" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">空(留给稳态)</text>
<line x1="44" y1="548" x2="814" y2="548" stroke="#e2e8f0"/>
<text x="44" y="570" font-family="sans-serif" font-size="12.5" fill="#374151">async_copy 总数 6 = prologue 2 段 x 2 个 load + 稳态 1 拍 x 2 个 load(pipeline_dump_summary.json)。</text>
</svg>