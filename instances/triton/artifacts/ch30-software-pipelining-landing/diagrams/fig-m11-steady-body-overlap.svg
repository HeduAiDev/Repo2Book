<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 758 570">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker><marker id="ah" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#7c3aed"/></marker></defs>
<rect width="758" height="570" fill="white"/>
<text x="379.0" y="32" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">稳态循环一拍,同体并行两个逻辑迭代</text>
<text x="379.0" y="54" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#64748b">重叠深度 = maxStage = 2;numBuffers = 3(matmul_sm90_ns3.ttgir.mlir)</text>
<rect x="26" y="104" width="706" height="286" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="379.0" y="126" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#475569">同一拍(本次迭代)</text>
<text x="194.0" y="146" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">S2:计算第 I 拍(读旧数据)</text>
<rect x="44" y="168" width="300" height="62" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="194.0" y="195.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">extractIdx 推进</text>
<text x="194.0" y="213.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">= (旧+1) % 3</text>
<line x1="194.0" y1="230" x2="194.0" y2="247" stroke="#64748b" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="44" y="250" width="300" height="62" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="194.0" y="277.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">memdesc_subview 读槽</text>
<text x="194.0" y="295.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">(2拍前写入的槽)</text>
<line x1="194.0" y1="312" x2="194.0" y2="329" stroke="#64748b" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="44" y="332" width="300" height="62" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="194.0" y="368.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">warp_group_dot(%86)</text>
<text x="564.0" y="146" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">S0:预取第 I+2 拍(写新指针)</text>
<rect x="414" y="168" width="300" height="62" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="564.0" y="195.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">insertIdx 推进</text>
<text x="564.0" y="213.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">= (旧+1) % 3</text>
<line x1="564.0" y1="230" x2="564.0" y2="247" stroke="#64748b" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="414" y="250" width="300" height="62" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="564.0" y="277.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">memdesc_subview 写槽</text>
<text x="564.0" y="295.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">(本拍推进后指针%88/%89)</text>
<line x1="564.0" y1="312" x2="564.0" y2="329" stroke="#64748b" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="414" y="332" width="300" height="62" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="564.0" y="359.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">async_copy(mask)+commit</text>
<text x="564.0" y="377.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">(%92,%93,%95,%96)</text>
<rect x="44" y="420" width="670" height="84" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="379.0" y="446" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#5b21b6">scf.yield 回灌(iter_args = 7)</text>
<text x="379.0" y="468" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#5b21b6">acc、a_ptrs/b_ptrs、insertIdx/extractIdx、2 个 async.token 版本各前移一格</text>
<text x="379.0" y="486" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7c3aed">-&gt; 交给下一拍,循环重复直至谓词关闭(见 prologue/epilogue 图)</text>
<line x1="194.0" y1="394" x2="194.0" y2="420" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#a)"/>
<line x1="564.0" y1="394" x2="564.0" y2="420" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#a)"/>
<text x="44" y="538" font-family="sans-serif" font-size="12" fill="#374151">同一段代码里,S0 用本拍刚推进的新指针写入、S2 用 2 拍前存下的旧槽读出——取数延迟被藏进 2 拍计算之后。</text>
