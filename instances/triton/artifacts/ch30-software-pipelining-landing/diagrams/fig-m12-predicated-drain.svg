<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1208 594">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker></defs>
<rect width="1208" height="594" fill="white"/>
<text x="40" y="40" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e40af">谓词化收尾:不 peel,靠临尾谓词逐 stage 熄灭</text>
<text x="40" y="62" font-family="sans-serif" font-size="12" fill="#64748b">peelEpilogue=false,supportDynamicLoops=true(matmul_sm90_ns3.ttgir.mlir)</text>
<rect x="40.0" y="108" width="265.5" height="62" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
<text x="172.75" y="134" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#b91c1c">ub − 2</text>
<text x="172.75" y="154" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#7f1d1d">maxStage=2 =&gt; stage0 边界</text>
<rect x="327.5" y="108" width="265.5" height="62" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
<text x="460.25" y="134" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#b91c1c">scf_if = 0</text>
<text x="460.25" y="154" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#7f1d1d">无独立 epilogue 分支</text>
<rect x="615.0" y="108" width="265.5" height="62" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
<text x="747.75" y="134" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#b91c1c">async_wait = 0</text>
<text x="747.75" y="154" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#7f1d1d">循环后一次性排空</text>
<rect x="902.5" y="108" width="265.5" height="62" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
<text x="1035.25" y="134" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#b91c1c">trip=6 =&gt; iter≥4 关闭</text>
<text x="1035.25" y="154" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#7f1d1d">谓词临尾提前 2 拍生效</text>
<rect x="148" y="230" width="332" height="30" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="314.0" y="249.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="white" font-weight="bold">稳态体开头</text>
<rect x="488" y="230" width="332" height="30" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="654.0" y="249.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="white" font-weight="bold">async_copy 处</text>
<rect x="828" y="230" width="332" height="30" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="994.0" y="249.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="white" font-weight="bold">循环之后(无独立 epilogue)</text>
<text x="132" y="312.0" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="bold" fill="#374151">构造</text>
<text x="314.0" y="303.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">%78 = ub − 2</text>
<text x="314.0" y="320.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">%79 = cmpi slt, iv, %78</text>
<text x="654.0" y="303.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">splat %79 作 mask</text>
<text x="654.0" y="320.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">喂 async_copy_global_to_local</text>
<text x="994.0" y="294.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">warp_group_dot_wait pendings=0</text>
<text x="994.0" y="311.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">async_wait num=0</text>
<text x="994.0" y="328.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">local_dealloc</text>
<text x="132" y="396.0" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="bold" fill="#374151">作用</text>
<text x="314.0" y="387.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">stage 0 的谓词:</text>
<text x="314.0" y="404.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">临尾前 2 拍起不再发取数</text>
<text x="654.0" y="387.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">谓词假 =&gt; 该拍 cp.async</text>
<text x="654.0" y="404.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">被 mask 关闭(不越界取数)</text>
<text x="994.0" y="387.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">排空最后在飞的 dot 与 copy、</text>
<text x="994.0" y="404.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">释放缓冲(收尾靠这几条,非 emitEpilogue)</text>
<text x="132" y="480.0" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="bold" fill="#374151">IR 证据</text>
<text x="314.0" y="480.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">%78, %79</text>
<text x="654.0" y="480.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">%94, %95, %98, %99</text>
<text x="994.0" y="480.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">%65, %66</text>
<line x1="148" y1="266" x2="1168" y2="266" stroke="#e2e8f0" stroke-width="1"/>
<line x1="148" y1="350" x2="1168" y2="350" stroke="#e2e8f0" stroke-width="1"/>
<line x1="148" y1="434" x2="1168" y2="434" stroke="#e2e8f0" stroke-width="1"/>
<line x1="148" y1="518" x2="1168" y2="518" stroke="#e2e8f0" stroke-width="1"/>
<text x="40" y="552" font-family="sans-serif" font-size="12" fill="#374151">本例 trip=6:谓词在 iter&gt;=4(=trip−2)起把 stage0 的取数关闭;stage1、stage2 无需谓词(最后 stage 本就每拍执行)。</text>
</svg>