<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#6366f1"/></marker></defs>
<rect width="980" height="640" fill="white"/>
<text x="50" y="44" font-family="sans-serif" font-size="18.5" font-weight="bold" fill="#0f172a">DotOperandEncodingAttr:A/B 共享 parent,靠 opIdx 分左右</text>
<text x="50" y="68" font-family="sans-serif" font-size="12.5" fill="#475569">kWidth 不取 A/B 自身位宽,取回溯 shape-preserving 一元链后的最低位宽(computeOrigBitWidth,AccelerateMatmul.cpp:L173-L212)</text>
<rect x="50" y="150" width="300" height="190" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="200.0" y="180" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#312e81">A 操作数编码</text>
<text x="68" y="206" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#3730a3">opIdx</text>
<text x="332" y="206" text-anchor="end" font-family="sans-serif" font-size="12.5" fill="#1e1b4b">0</text>
<text x="68" y="222" font-family="sans-serif" font-size="10" fill="#818cf8">AccelerateMatmul.cpp:L326-L328</text>
<text x="68" y="246" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#3730a3">parent</text>
<text x="332" y="246" text-anchor="end" font-family="sans-serif" font-size="12.5" fill="#1e1b4b">mma 编码(newRetType)</text>
<text x="68" y="270" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#3730a3">kWidth</text>
<text x="332" y="270" text-anchor="end" font-family="sans-serif" font-size="12.5" fill="#1e1b4b">16</text>
<text x="68" y="286" font-family="sans-serif" font-size="10" fill="#818cf8">L193-L212 computeOrigBitWidth</text>
<rect x="610" y="150" width="300" height="190" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="760.0" y="180" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#312e81">B 操作数编码</text>
<text x="628" y="206" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#3730a3">opIdx</text>
<text x="892" y="206" text-anchor="end" font-family="sans-serif" font-size="12.5" fill="#1e1b4b">1</text>
<text x="628" y="222" font-family="sans-serif" font-size="10" fill="#818cf8">AccelerateMatmul.cpp:L335-L337</text>
<text x="628" y="246" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#3730a3">parent</text>
<text x="892" y="246" text-anchor="end" font-family="sans-serif" font-size="12.5" fill="#1e1b4b">mma 编码(newRetType)</text>
<text x="628" y="270" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#3730a3">kWidth</text>
<text x="892" y="270" text-anchor="end" font-family="sans-serif" font-size="12.5" fill="#1e1b4b">16</text>
<text x="628" y="286" font-family="sans-serif" font-size="10" fill="#818cf8">L193-L212 computeOrigBitWidth</text>
<rect x="270.0" y="410" width="420" height="70" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="480.0" y="438" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#78350f">NvidiaMmaEncodingAttr</text>
<text x="480.0" y="460" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#92400e">newRetType 的 mma 编码(本章第①张图的重写结果)</text>
<line x1="200.0" y1="340" x2="480.0" y2="410" stroke="#6366f1" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="760.0" y1="340" x2="480.0" y2="410" stroke="#6366f1" stroke-width="1.8" marker-end="url(#a)"/>
<text x="310.0" y="375.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f46e5">parent</text>
<text x="650.0" y="375.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f46e5">parent</text>
<rect x="50" y="526" width="880" height="90" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="70" y="550" font-family="sans-serif" font-size="12.5" fill="#0f172a">kWidth 语义:回溯 A/B 的 shape-preserving 一元链(如 cast),取链上最低位宽——</text>
<text x="70" y="570" font-family="sans-serif" font-size="12.5" fill="#0f172a">本例 f16 上溯仍是 f16,kWidth=16;upcast 场景(load f16 算 f32)按更低精度粒度分发才对齐 MMA 每线程装载。</text>
<text x="70" y="594" font-family="sans-serif" font-size="12" fill="#64748b">opIdx=0/1 只区分左右操作数,不影响 parent/kWidth 的取值方式——两者共享同一套推导逻辑。</text>
</svg>