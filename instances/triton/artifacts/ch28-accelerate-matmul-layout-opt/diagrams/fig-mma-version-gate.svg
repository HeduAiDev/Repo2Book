<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1422 498">
<defs><marker id="g" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#16a34a"/></marker><marker id="r" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#dc2626"/></marker><marker id="n" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker></defs>
<rect width="1422" height="498" fill="white"/>
<text x="50" y="46" font-family="sans-serif" font-size="19" font-weight="bold" fill="#0f172a">getMMAVersionSafe:按站台等级给候选表,逐档验票,验不过就退档</text>
<text x="50" y="70" font-family="sans-serif" font-size="12.5" fill="#475569">cap 分档阈值 75 / 90 / 100(AccelerateMatmul.cpp:L30-L38);sm90 的 {3,2} 候选需逐个过 K/shape/warps/dtype 门</text>
<rect x="50" y="128" width="270" height="54" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
<text x="185.0" y="151.2" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#312e81">sm70,cap&lt;75</text>
<text x="185.0" y="167.45" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#312e81">候选 = {1}</text>
<rect x="354" y="128" width="270" height="54" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
<text x="489.0" y="151.2" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#312e81">sm8x,75&lt;=cap&lt;90</text>
<text x="489.0" y="167.45" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#312e81">候选 = {2}</text>
