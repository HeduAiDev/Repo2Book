<text x="489.0" y="249.125" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#14532d">f16 恒支持,无附加门</text>
<line x1="489.0" y1="182" x2="489.0" y2="210" stroke="#16a34a" stroke-width="1.8" marker-end="url(#g)"/>
<rect x="1162" y="128" width="210" height="54" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6"/>
<text x="1267.0" y="151.8" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#475569">cap&gt;=100(未来架构)</text>
<text x="1267.0" y="166.8" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#475569">本 pass 未覆盖</text>
<rect x="1162" y="210" width="210" height="54" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6"/>
<text x="1267.0" y="234.1" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#475569">assert(false)</text>
<text x="1267.0" y="248.475" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#475569">编译期断言失败,非退档</text>
<line x1="1267.0" y1="182" x2="1267.0" y2="210" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#n)"/>
<rect x="658" y="210" width="270" height="78" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/>
<text x="793.0" y="233.44" text-anchor="middle" font-family="sans-serif" font-size="11.3" fill="#7c2d12">先试 v3 —— K&gt;=256/位宽(f16 即 16)</text>
<text x="793.0" y="247.565" text-anchor="middle" font-family="sans-serif" font-size="11.3" fill="#7c2d12">且 M%64=0, N%8=0, numWarps%4=0</text>
<text x="793.0" y="261.69" text-anchor="middle" font-family="sans-serif" font-size="11.3" fill="#7c2d12">(f32/f32 还需 inputPrecision==TF32)</text>
