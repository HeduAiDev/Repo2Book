<text x="1043" y="241.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#14532d">全过 -&gt; MMAv3</text>
<path d="M 928 243.0 L 958 237.0" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#g)"/>
<text x="943.0" y="204" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#16a34a">四门全过</text>
<rect x="658" y="316" width="270" height="54" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/>
<text x="793.0" y="340.1" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#7c2d12">退到 v2 —— f32/f32 需 TF32 且 version&gt;=2</text>
