<rect x="958" y="316" width="170" height="54" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
<text x="1043" y="347.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#14532d">过 -&gt; MMAv2</text>
<path d="M 928 343.0 L 958 343.0" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#g)"/>
<rect x="658" y="398" width="270" height="54" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
<text x="793.0" y="421.8" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#7f1d1d">chosen = 0 -&gt; 退回 blocked/FMA</text>
<text x="793.0" y="436.8" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#7f1d1d">(不进 Tensor Core)</text>
<line x1="793.0" y1="370" x2="793.0" y2="398" stroke="#dc2626" stroke-width="1.8" marker-end="url(#r)"/>
<text x="50" y="482" font-family="sans-serif" font-size="12.5" fill="#64748b">这条判定链是『matmul 没提速』的第一诊断点:K 太小、shape/warps 不整除、f32 没开 TF32,都会在这里悄悄退档。</text>
