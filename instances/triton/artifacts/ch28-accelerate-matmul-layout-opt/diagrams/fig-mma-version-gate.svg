<text x="793.0" y="151.2" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#312e81">sm90,90&lt;=cap&lt;100</text>
<text x="793.0" y="167.45" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#312e81">候选 = {3,2}</text>
<rect x="50" y="210" width="270" height="54" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
<text x="185.0" y="233.5" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#14532d">选中版本 = v1</text>
<text x="185.0" y="249.125" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#14532d">f16 恒支持,无附加门</text>
