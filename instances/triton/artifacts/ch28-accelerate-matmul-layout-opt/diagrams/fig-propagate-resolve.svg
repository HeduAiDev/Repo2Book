<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 460">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#6366f1"/></marker></defs>
<rect width="1160" height="460" fill="white"/>
<text x="50" y="44" font-family="sans-serif" font-size="18.5" font-weight="bold" fill="#0f172a">传播(setEncoding) -&gt; 消冲突(resolveConflicts):两步定出唯一编码</text>
<text x="50" y="68" font-family="sans-serif" font-size="12.5" fill="#475569">前向定点迭代给每个值攒编码集合,冲突时按值的用途(访存/计算)坍缩到单编码,重写才无歧义</text>
<text x="300.0" y="124" text-anchor="middle" font-family="sans-serif" font-size="14.5" font-weight="bold" fill="#1e3a5f">① 传播(setEncoding)</text>
<rect x="50" y="160" width="500" height="74" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="70" y="186" font-family="sans-serif" font-size="13" font-weight="bold" fill="#312e81">遇 ConvertLayoutOp</text>
<text x="70" y="208" font-family="sans-serif" font-size="12.5" fill="#312e81">dstEncoding := 源编码(意图消掉它)</text>
<text x="70" y="226" font-family="sans-serif" font-size="10.5" fill="#818cf8">RemoveLayoutConversions.cpp:L217-L220</text>
<rect x="50" y="254" width="500" height="74" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="70" y="280" font-family="sans-serif" font-size="13" font-weight="bold" fill="#312e81">遇其余 op(如 addf)</text>
<text x="70" y="302" font-family="sans-serif" font-size="12.5" fill="#312e81">dstEncoding := inferDstEncoding(op, encoding)</text>
<text x="70" y="320" font-family="sans-serif" font-size="10.5" fill="#818cf8">RemoveLayoutConversions.cpp:L221-L222</text>
<text x="50" y="354" font-family="sans-serif" font-size="11.5" fill="#64748b">一个值可能被多条路径攒出多个编码 -&gt; 需要下一步坍缩</text>
<text x="900.0" y="124" text-anchor="middle" font-family="sans-serif" font-size="14.5" font-weight="bold" fill="#1e3a5f">② 消冲突(resolveConflicts)</text>
<rect x="650" y="160" width="500" height="74" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="670" y="186" font-family="sans-serif" font-size="13" font-weight="bold" fill="#065f46">值被 load/store(访存)消费</text>
<text x="670" y="208" font-family="sans-serif" font-size="12.5" fill="#065f46">冲突时坍缩偏好 -&gt; Blocked</text>
<text x="670" y="226" font-family="sans-serif" font-size="10.5" fill="#34d399">RemoveLayoutConversions.cpp:L322-L325</text>
<rect x="650" y="254" width="500" height="74" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="670" y="280" font-family="sans-serif" font-size="13" font-weight="bold" fill="#065f46">值被计算 op(如 dot)消费</text>
<text x="670" y="302" font-family="sans-serif" font-size="12.5" fill="#065f46">冲突时坍缩偏好 -&gt; Mma</text>
<text x="670" y="320" font-family="sans-serif" font-size="10.5" fill="#34d399">RemoveLayoutConversions.cpp:L322-L325</text>
<line x1="564" y1="244.0" x2="636" y2="244.0" stroke="#6366f1" stroke-width="2.4" marker-end="url(#a)"/>
<text x="600.0" y="232.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f46e5">多编码值</text>
<rect x="50" y="394" width="1060" height="70" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="70" y="420" font-family="sans-serif" font-size="12.5" fill="#0f172a">两阶段合力:convert 被两端染同色(等着被删),多编码值坍缩到唯一编码——这是四阶段消 convert 中</text>
<text x="70" y="442" font-family="sans-serif" font-size="12.5" fill="#0f172a">真正只做分析、不改 IR 的两步(第 ④ 步 rewrite 才真正删除,见本章另一张四阶段图)。</text>
</svg>