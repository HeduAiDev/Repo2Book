<rect x="200" y="251" width="232" height="68" fill="white" stroke="#e2e8f0" stroke-width="1"/>
<text x="316.0" y="282.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">锚点 = load %0-&gt;#blocked、</text>
<text x="316.0" y="296.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">函数参数、store 期望#blocked</text>
<rect x="440" y="251" width="232" height="68" fill="white" stroke="#e2e8f0" stroke-width="1"/>
<text x="556.0" y="275.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">遇 convert 令 dst:=src</text>
<text x="556.0" y="289.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">-&gt;%1:=#blocked,%2:=#blocked;</text>
<text x="556.0" y="303.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">addf inferDst-&gt;%3:=#blocked</text>
<rect x="680" y="251" width="232" height="68" fill="white" stroke="#e2e8f0" stroke-width="1"/>
<text x="796.0" y="275.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">每个值只剩单编码</text>
<text x="796.0" y="289.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">(全 #blocked)-&gt;无冲突,</text>
<text x="796.0" y="303.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">不插新 convert</text>
<rect x="920" y="251" width="232" height="68" fill="white" stroke="#e2e8f0" stroke-width="1"/>
<text x="1036.0" y="275.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">两个 convert 都成</text>
<text x="1036.0" y="289.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">#blocked-&gt;#blocked no-op</text>
<text x="1036.0" y="303.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">-&gt; canonicalize 折掉死 convert</text>
