<text x="50" y="406" font-family="sans-serif" font-size="12.5" fill="#64748b">红=数值未变(convert 仍在,只是被『染色』待删);绿=真正被删除。convert 令 dst=src 发生在 L208-L230。</text>
<text x="50" y="428" font-family="sans-serif" font-size="12.5" fill="#64748b">本例是纯往返(blocked-&gt;mma-&gt;blocked),消除率 100%;matmul 场景通常残留 4 个必要 convert(见正文)。</text>
