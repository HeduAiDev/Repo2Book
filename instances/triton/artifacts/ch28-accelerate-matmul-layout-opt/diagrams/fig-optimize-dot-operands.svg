<text x="80" y="632" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">OptimizeDotOperands 的四个 pattern(OptimizeDotOperands.cpp:L323-L328)</text>
<text x="80" y="656" font-family="sans-serif" font-size="12" fill="#334155">- SwizzleShmemConvert —— 把 tt.trans 融进 swizzled 共享编码(回指 swizzle/tt.trans)</text>
<text x="80" y="678" font-family="sans-serif" font-size="12" fill="#334155">- HoistLayoutConversion —— 本图讲的提速主力,convert 上移贴近 load(cap&gt;=80)</text>
<text x="80" y="700" font-family="sans-serif" font-size="12" fill="#334155">- FuseTransHopper —— Hopper 专属的 trans 融合变体</text>
<text x="80" y="722" font-family="sans-serif" font-size="12" fill="#334155">- MMAV3UseRegOperand —— MMAv3 场景下让操作数走寄存器而非共享内存的特判</text>
