<text x="788.0" y="280" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">init_triton_passes(</text>
<text x="788.0" y="296" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">m.def_submodule("passes"))</text>
<text x="788.0" y="312" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">下辖 6 子分组 add_*</text>
