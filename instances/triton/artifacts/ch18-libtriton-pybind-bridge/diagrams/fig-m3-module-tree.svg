<text x="1092.0" y="280" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">init_triton_interpreter(</text>
<text x="1092.0" y="296" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">m.def_submodule("interpreter"))</text>
<text x="1092.0" y="312" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">load / store / atomic_*</text>
<rect x="1256.0" y="238" width="280" height="122" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.4"/>
<text x="1396.0" y="260" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">→ .llvm</text>
<text x="1396.0" y="280" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">init_triton_llvm(</text>
<text x="1396.0" y="296" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">m.def_submodule("llvm"))</text>
<rect x="1560.0" y="238" width="280" height="122" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/>
<text x="1700.0" y="260" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">→ .&lt;backend&gt;</text>
<text x="1700.0" y="280" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">FOR_EACH_P(INIT_BACKEND,</text>
<text x="1700.0" y="296" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">TRITON_BACKENDS_TUPLE)</text>
<text x="1700.0" y="312" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">CMake 注入，main.cc:L44,L54</text>
<text x="1700.0" y="328" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">例:nvidia → init_triton_nvidia(...)</text>
<rect x="1662.0" y="364" width="76" height="22" rx="11" fill="#fde68a" stroke="#d97706" stroke-width="1"/>
<text x="1700.0" y="380" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#78350f">×N (N≤4)</text>
<text x="940.0" y="456" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#475569">1 个入口宏 → 4 个核心子模块(ir/passes/interpreter/llvm) + 至多 4 个后端子模块 —— 一次 import 装配完成</text>
