<text x="180.0" y="280" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">init_triton_stacktrace_hook(m)</text>
<text x="180.0" y="296" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">init_triton_env_vars(m)</text>
<text x="180.0" y="312" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">main.cc:L48-L49</text>
<rect x="344.0" y="238" width="280" height="122" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.4"/>
