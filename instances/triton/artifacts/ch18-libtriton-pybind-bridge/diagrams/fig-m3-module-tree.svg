<text x="484.0" y="280" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">init_triton_ir(</text>
<text x="484.0" y="296" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">m.def_submodule("ir"))</text>
<text x="484.0" y="312" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">承载 builder + 129 个 create_*</text>
<rect x="648.0" y="238" width="280" height="122" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/>
