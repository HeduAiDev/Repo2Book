<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 760">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker></defs>
<rect width="820" height="760" fill="white"/>
<text x="410.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="16.5" font-weight="bold" fill="#0f172a">Hopper Warp Specialization —— async task id 落到 producer/consumer 两条泳道(选读)</text>
<rect x="50" y="42" width="720" height="60" rx="8" fill="#fef3c7" stroke="#d97706"/>
<text x="410.0" y="64" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#78350f">默认 num_consumer_groups = 0:WSTaskPartition 等五个 WS pass 入口即早退,IR 不变。</text>
<text x="410.0" y="86" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#78350f">以下为 num_consumer_groups &gt; 0 时的落地形态：</text>
<rect x="60" y="158" width="260" height="40" rx="8" fill="#e2e8f0" stroke="#3b82f6" stroke-width="2"/>
<text x="190" y="177" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">Producer warpgroup</text>
<text x="190" y="193" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">(asyncTaskId=0)</text>
<line x1="190" y1="200" x2="190" y2="600" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.5"/>
<rect x="520" y="158" width="260" height="40" rx="8" fill="#e2e8f0" stroke="#f59e0b" stroke-width="2"/>
<text x="650" y="177" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">Consumer warpgroup</text>
<text x="650" y="193" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">(asyncTaskId=1)</text>
<line x1="650" y1="200" x2="650" y2="600" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.5"/>
<circle cx="190" cy="284" r="5" fill="#3b82f6"/>
<text x="206" y="288" font-family="sans-serif" font-size="12.5" fill="#334155">load(global→shared)  异步搬数据</text>
<text x="80" y="288" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">t1</text>
<line x1="190" y1="358" x2="650" y2="358" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
<text x="420.0" y="350" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">ProducerCommit(token)  『料好了』</text>
<text x="80" y="362" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">t2</text>
<circle cx="650" cy="432" r="5" fill="#f59e0b"/>
<text x="634" y="436" text-anchor="end" font-family="sans-serif" font-size="12.5" fill="#334155">ConsumerWait(token) → wgmma 算 dot</text>
<text x="80" y="436" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">t3</text>
<line x1="650" y1="506" x2="190" y2="506" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
<text x="420.0" y="498" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">ConsumerRelease(token)  『可以搬下一批』</text>
<text x="80" y="510" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">t4</text>
<text x="410.0" y="602" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#64748b">图为简化的三步握手(Commit/Wait/Release)；ProducerAcquire「申请空位」发生在 load 之前，词汇见第 24 章。</text>
<rect x="50" y="650" width="720" height="56" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
<text x="140.0" y="672" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e40af">4</text>
<text x="140.0" y="690" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">WARPS_PER_TASK</text>
<text x="320.0" y="672" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e40af">128</text>
<text x="320.0" y="690" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">THREADS_PER_TASK</text>
<text x="500.0" y="672" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e40af">4</text>
<text x="500.0" y="690" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">task id = warpId / 4</text>
<text x="680.0" y="672" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e40af">0</text>
<text x="680.0" y="690" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">默认 num_consumer_groups</text>
<text x="410.0" y="736" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#475569">producer 泳道搬 load、consumer 泳道算 dot,token 握手保序——这正是第 24 章 create_token/</text>
<text x="410.0" y="753" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#475569">ProducerCommit/ConsumerWait/ConsumerRelease 词汇被 pass 落地的样子,别夸大它在默认路径的作用。</text>
</svg>