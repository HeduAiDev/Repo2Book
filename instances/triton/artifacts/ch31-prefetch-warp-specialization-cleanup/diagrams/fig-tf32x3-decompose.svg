<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1182 542">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker><marker id="ag" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#16a34a"/></marker></defs>
<rect width="1182" height="542" fill="white"/>
<text x="591.0" y="34" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#0f172a">F32DotTC 的 TF32x3 —— 为什么恰好三次</text>
<text x="591.0" y="58" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#475569">ab = (aBig+aSmall)(bBig+bSmall) 精确展开四项，dot(a,b,inputPrecision=tf32x3) 只留三项</text>
<rect x="331.0" y="76" width="520" height="34" rx="8" fill="#eef2ff" stroke="#6366f1"/>
<text x="591.0" y="98" text-anchor="middle" font-family="sans-serif" font-size="13.5" fill="#3730a3">ab = aSmall·bBig + aBig·bSmall + aBig·bBig + aSmall·bSmall</text>
<line x1="396.0" y1="110" x2="171.0" y2="146" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="46" y="150" width="250" height="92" rx="9" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" />
<text x="171.0" y="178" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a">aSmall·bBig</text>
<text x="171.0" y="202" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#0f172a">0.002575</text>
<text x="171.0" y="225" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">补正项 · 累加链首</text>
<line x1="526.0" y1="110" x2="451.0" y2="146" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="326" y="150" width="250" height="92" rx="9" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" />
<text x="451.0" y="178" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a">aBig·bSmall</text>
<text x="451.0" y="202" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#0f172a">0.001967</text>
<text x="451.0" y="225" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">补正项 · 累加链中</text>
<line x1="656.0" y1="110" x2="731.0" y2="146" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="606" y="150" width="250" height="92" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="2" />
<text x="731.0" y="178" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a">aBig·bBig</text>
<text x="731.0" y="202" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#0f172a">10.298326</text>
<text x="731.0" y="225" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">主项 · 累加链末(=单次 tf32 结果)</text>
<line x1="786.0" y1="110" x2="1011.0" y2="146" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="886" y="150" width="250" height="92" rx="9" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,4"/>
<text x="1011.0" y="178" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a">aSmall·bSmall</text>
<text x="1011.0" y="202" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#94a3b8">0.00000049</text>
<text x="1011.0" y="225" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">占结果 0.000000047 · 快尺读不出</text>
<text x="1011.0" y="262" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#dc2626">✕ 丢弃(第 4 次不做)</text>
<rect x="491.0" y="302" width="200" height="50" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="591.0" y="324" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#14532d">Σ 三项 = tf32x3 结果</text>
<text x="591.0" y="342" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#166534">10.302867</text>
<line x1="171.0" y1="274" x2="551.0" y2="300" stroke="#16a34a" stroke-width="1.6" marker-end="url(#ag)"/>
<line x1="451.0" y1="274" x2="591.0" y2="300" stroke="#16a34a" stroke-width="1.6" marker-end="url(#ag)"/>
<line x1="731.0" y1="274" x2="631.0" y2="300" stroke="#16a34a" stroke-width="1.6" marker-end="url(#ag)"/>
<text x="591.0" y="378" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">相对误差(相对 fp32 参考值 10.302868)</text>
<rect x="191.0" y="392" width="340" height="60" rx="9" fill="#fca5a5" stroke="#b91c1c" stroke-width="2"/>
<text x="361.0" y="416" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#b91c1c">单次 tf32</text>
<text x="361.0" y="438" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#b91c1c">0.00044</text>
<rect x="651.0" y="392" width="340" height="60" rx="9" fill="#86efac" stroke="#166534" stroke-width="2"/>
<text x="821.0" y="416" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#166534">tf32x3(三次累加)</text>
<text x="821.0" y="438" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#166534">0.00000011</text>
<line x1="541.0" y1="422.0" x2="641.0" y2="422.0" stroke="#166534" stroke-width="2.5" marker-end="url(#ag)"/>
<text x="591.0" y="412.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#166534">改善 3901 倍*</text>
<text x="591.0" y="474" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">* 3901 倍基于未舍入的完整精度计算，非图中两个约数直接相除(约 4000 倍)。</text>
<text x="591.0" y="512" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#475569">四项交叉积里,零头×零头(aSmall·bSmall)小到 fp32 都读不出(占结果 0.000000047),丢它无损;</text>
<text x="591.0" y="529" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#475569">剩下三项每项至少一边是高精度,三次 tf32 dot 就把误差从单次的 0.00044 逼到 0.00000011,约 3901 倍改善。</text>
</svg>