<text x="38" y="124" font-family="sans-serif" font-size="11" fill="#64748b">scf.for</text>
<rect x="64.0" y="138" width="300" height="42" rx="7" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
<text x="214.0" y="164.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#0f172a">local_load 整片 K=64</text>
<line x1="214.0" y1="180" x2="214.0" y2="196" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="64.0" y="200" width="300" height="42" rx="7" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
<text x="214.0" y="226.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#0f172a">dot(a, b, c)  — 累加一次</text>
<line x1="214.0" y1="242" x2="214.0" y2="258" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="64.0" y="262" width="300" height="42" rx="7" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
<text x="214.0" y="288.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#0f172a">scf.yield a_buf, b_buf</text>
<text x="644.0" y="90" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e40af">改写后:逐片搬运与算重叠(+2 个 iter_arg)</text>
<rect x="460" y="106" width="368" height="320" rx="10" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>
<text x="468" y="124" font-family="sans-serif" font-size="11" fill="#64748b">scf.for</text>
<rect x="494.0" y="138" width="300" height="42" rx="7" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
<text x="644.0" y="164.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#0f172a">prologue: 预取片0 [0,16)</text>
<line x1="644.0" y1="180" x2="644.0" y2="196" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="494.0" y="200" width="300" height="42" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="644.0" y="226.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#0f172a">dot(片0, C_in)  ← 用 iter_arg 里已备好的片0</text>
<line x1="644.0" y1="242" x2="644.0" y2="258" stroke="#d97706" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="494.0" y="262" width="300" height="42" rx="7" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
<text x="644.0" y="288.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#0f172a">本轮内 local_load 片1/2/3</text>
<line x1="644.0" y1="304" x2="644.0" y2="320" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="494.0" y="324" width="300" height="42" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="644.0" y="350.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#0f172a">dot(片1..3, 累加)  ← 与下一片搬运错峰重叠</text>
<line x1="644.0" y1="366" x2="644.0" y2="382" stroke="#d97706" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="494.0" y="386" width="300" height="42" rx="7" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
<text x="644.0" y="412.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#0f172a">尾部预取下轮片0 → yield</text>
<line x1="394" y1="283.0" x2="464" y2="283.0" stroke="#d97706" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="429.0" y="271.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#d97706">Prefetch pass</text>
<rect x="44" y="484" width="770" height="56" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
<text x="140.25" y="506" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#1e40af">16</text>
<text x="140.25" y="524" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">prefetchWidth</text>
<text x="332.75" y="506" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#1e40af">64</text>
<text x="332.75" y="524" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">BLOCK_K</text>
<text x="525.25" y="506" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#1e40af">4</text>
<text x="525.25" y="524" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">K 片数</text>
<text x="717.75" y="506" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#1e40af">+2</text>
<text x="717.75" y="524" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">iter_args 增量</text>
<text x="429.0" y="546" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#475569">单-dot 循环经 Prefetch 后:local_load 被切成 4 片、错开一拍藏进相邻片的 dot 计算里——</text>
<text x="429.0" y="563" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#475569">这是软件流水线(见第 29/30 章,重叠 global→shared)之外、专门重叠 shared→register 的第二层旋钮,两级重叠正交叠加。</text>
</svg>