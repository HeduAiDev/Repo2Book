<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 858 576">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker><marker id="ah" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#d97706"/></marker></defs>
<rect width="858" height="576" fill="white"/>
<text x="429.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">Prefetch 改写单-dot 循环 —— shared→register 搬运与计算重叠</text>
<text x="214.0" y="90" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e40af">改写前:整片搬运再算(1 个 iter_arg)</text>
