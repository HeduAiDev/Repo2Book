<rect x="40" y="306" width="1080" height="110" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="58" y="330" font-family="sans-serif" font-size="13" font-weight="bold" fill="#5b21b6">broadcast(行方向):T 高 2 &lt; L 高 4 &#8594; 每格是 2 个线程 {a, a+8}(如 (0,0)={0,8})</text>
<text x="58" y="354" font-family="sans-serif" font-size="13" font-weight="bold" fill="#5b21b6">wrap-around(列方向):T 宽 8 &gt; L 宽 4 &#8594; col 4-7 循环复用 col 0-3 的线程号(如 (0,4)=(0,0)={0,8})</text>
<text x="58" y="382" font-family="sans-serif" font-size="12" fill="#64748b">红框样点:(0,0)={0,8} (0,3)={3,11} (0,4)={0,8} (1,0)={4,12} (1,7)={7,15} &#8212; broadcast 因子=2(=4/2),wrap 因子=2(=8/4)</text>
<text x="58" y="406" font-family="sans-serif" font-size="12" fill="#64748b">正解释「正式定义」一节顿悟例中 L(0,0)={0,4} 为何是集合而非单点。</text>
