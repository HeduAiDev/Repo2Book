<text x="495.0" y="40" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1e40af">distributed vs shared —— 两大类布局的分野</text>
<text x="495.0" y="64" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">Triton 目前实现两大类布局(TritonGPUAttrDefs.td:L52)&#8212;同一个函数 L,两种极端形态</text>
<text x="250.0" y="94" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a">distributed</text>
<text x="250.0" y="114" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#475569">元素分散进各线程寄存器,L(i) 只圈出少数几个持有者</text>
