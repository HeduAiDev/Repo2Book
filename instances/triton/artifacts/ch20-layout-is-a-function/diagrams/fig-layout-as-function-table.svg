<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 546 570">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker></defs>
<rect width="546" height="570" fill="white"/>
<text x="46" y="46" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1e40af">布局即函数:L(i) = 线程集合</text>
<text x="46" y="70" font-family="sans-serif" font-size="12" fill="#64748b">2x2 张量,每个索引 i 映到一个线程集合(TritonGPUAttrDefs.td:L41-L44 逐字示例)</text>
<text x="46" y="118" font-family="sans-serif" font-size="12" fill="#475569">行 = 第一维索引 i&#8320;(&#8595;方向),列 = 第二维索引 i&#8321;(&#8594;方向)</text>
<rect x="46" y="140" width="220" height="120" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="156.0" y="170" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1e3a5f">i = (0, 0)</text>
<text x="156.0" y="204" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1d4ed8">L(i) = {0, 4}</text>
<text x="156.0" y="232" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">TritonGPUAttrDefs.td:L41</text>
<rect x="280" y="140" width="220" height="120" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="390.0" y="170" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1e3a5f">i = (0, 1)</text>
<text x="390.0" y="204" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1d4ed8">L(i) = {1, 5}</text>
<text x="390.0" y="232" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">TritonGPUAttrDefs.td:L42</text>
<rect x="46" y="274" width="220" height="120" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="156.0" y="304" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1e3a5f">i = (1, 0)</text>
<text x="156.0" y="338" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1d4ed8">L(i) = {2, 6}</text>
<text x="156.0" y="366" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">TritonGPUAttrDefs.td:L43</text>
<rect x="280" y="274" width="220" height="120" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="390.0" y="304" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1e3a5f">i = (1, 1)</text>
<text x="390.0" y="338" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1d4ed8">L(i) = {3, 7}</text>
<text x="390.0" y="366" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">TritonGPUAttrDefs.td:L44</text>
<rect x="46" y="410" width="454" height="94" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
<text x="64" y="436" font-family="sans-serif" font-size="13" font-weight="bold" fill="#854d0e">值域并集 = {0,1,2,3,4,5,6,7} 共 8 个线程 &#8212; 每格集合大小 = 2</text>
<text x="64" y="460" font-family="sans-serif" font-size="12" fill="#854d0e">普通张量每格 1 个持有者;这里每格是集合(&#124;L(i)&#124;=2)</text>
<text x="64" y="482" font-family="sans-serif" font-size="12" fill="#854d0e">&#8212;这正是 GPU 张量与普通张量的分界。</text>
</svg>