<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 494">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="8" markerHeight="6" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker></defs>
<rect width="980" height="494" fill="white"/>
<text x="40" y="34" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1e40af">static_range vs range：追踪期就分道扬镳</text>
<text x="40" y="58" font-family="sans-serif" font-size="12.5" fill="#64748b">同样循环 4 轮（make_ir 追踪期，任何 pass 之前，pin triton==3.2.0 实测，traces/ranges_ir.txt）</text>
<rect x="40" y="118" width="420" height="34" rx="6" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="250.0" y="140" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e293b">tl.static_range(4)</text>
<text x="250.0" y="172" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#475569">visit_For：真 Python range 跑 4 轮，</text>
<text x="250.0" y="188" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#475569">constexpr(i) 塞进 lscope，逐轮复制循环体</text>
<rect x="40" y="218" width="420" height="56" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="62" y="251.0" font-family="sans-serif" font-size="13.5" fill="#1e293b">scf.for</text>
<text x="438" y="253.0" text-anchor="end" font-family="sans-serif" font-size="24" font-weight="bold" fill="#1d4ed8">0</text>
<rect x="40" y="290" width="420" height="56" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="62" y="323.0" font-family="sans-serif" font-size="13.5" fill="#1e293b">arith.addi</text>
<text x="438" y="325.0" text-anchor="end" font-family="sans-serif" font-size="24" font-weight="bold" fill="#1d4ed8">8</text>
<text x="250.0" y="376" text-anchor="middle" font-family="sans-serif" font-size="12" font-style="italic" fill="#334155">IR 里根本没有循环——编译期全展开</text>
<rect x="520" y="118" width="420" height="34" rx="6" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
<text x="730.0" y="140" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e293b">tl.range(0, 4, num_stages=3, loop_unroll_factor=2)</text>
<text x="730.0" y="172" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#475569">visit_For：发 scf.for，</text>
<text x="730.0" y="188" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#475569">取出提示 set_attr 挂到循环体上</text>
<rect x="520" y="218" width="420" height="56" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="542" y="251.0" font-family="sans-serif" font-size="13.5" fill="#1e293b">scf.for</text>
<text x="918" y="253.0" text-anchor="end" font-family="sans-serif" font-size="24" font-weight="bold" fill="#b45309">1</text>
<rect x="520" y="290" width="420" height="56" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="542" y="323.0" font-family="sans-serif" font-size="13.5" fill="#1e293b">arith.addi</text>
<text x="918" y="325.0" text-anchor="end" font-family="sans-serif" font-size="24" font-weight="bold" fill="#b45309">2</text>
<rect x="520" y="372" width="420" height="40" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="730.0" y="390" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#9a3412">贴给后端 pass 的性能提示</text>
<text x="730.0" y="407" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#c2410c">tt.num_stages=3  ·  tt.loop_unroll_factor=2</text>
<text x="730.0" y="438" text-anchor="middle" font-family="sans-serif" font-size="12" font-style="italic" fill="#334155">1 个 scf.for 保留循环，循环体只有一份</text>
<line x1="468" y1="208" x2="512" y2="208" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<text x="490.0" y="198" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">对照</text>
<text x="40" y="474" font-family="sans-serif" font-size="11.5" fill="#64748b">code_generator.py visit_For 三分：边界是否 constexpr 决定能否在追踪期跑 Python for——num_stages/loop_unroll_factor 只在 range 分支才有意义。</text>
</svg>