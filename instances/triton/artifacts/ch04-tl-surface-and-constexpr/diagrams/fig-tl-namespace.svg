<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1090 596">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="8" markerHeight="6" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker></defs>
<rect width="1090" height="596" fill="white"/>
<text x="40" y="34" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1e40af">tl.* 这张表面怎么铺出来</text>
<text x="40" y="58" font-family="sans-serif" font-size="12.5" fill="#64748b">python/triton/language/__init__.py 依序 re-export 四个子模块符号（Triton v3.2.0，AST 统计）</text>
<rect x="40" y="96" width="230" height="78" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="56" y="122" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#1e3a5f">standard.py</text>
<text x="56" y="142" font-family="sans-serif" font-size="12" fill="#374151">组合函数（被追踪，@jit）</text>
<text x="254" y="160" text-anchor="end" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1d4ed8">18</text>
<text x="56" y="160" font-family="sans-serif" font-size="11" fill="#64748b">from .standard 提到顶层</text>
<rect x="40" y="200" width="230" height="78" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="56" y="226" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#1e3a5f">core.py</text>
<text x="56" y="246" font-family="sans-serif" font-size="12" fill="#374151">原语（多为 @builtin）</text>
<text x="254" y="264" text-anchor="end" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1d4ed8">81</text>
<text x="56" y="264" font-family="sans-serif" font-size="11" fill="#64748b">from .core 提到顶层</text>
<rect x="40" y="304" width="230" height="78" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="56" y="330" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#1e3a5f">math.py</text>
<text x="56" y="350" font-family="sans-serif" font-size="12" fill="#374151">外部数学函数</text>
<text x="254" y="368" text-anchor="end" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1d4ed8">17</text>
<text x="56" y="368" font-family="sans-serif" font-size="11" fill="#64748b">from .math 提到顶层</text>
<rect x="40" y="408" width="230" height="78" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="56" y="434" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#1e3a5f">random.py</text>
<text x="56" y="454" font-family="sans-serif" font-size="12" fill="#374151">philox 随机数</text>
<text x="254" y="472" text-anchor="end" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1d4ed8">10</text>
<text x="56" y="472" font-family="sans-serif" font-size="11" fill="#64748b">from .random 提到顶层</text>
<path d="M 270 135.0 C 325 135.0, 325 291.0, 380 291.0" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M 270 239.0 C 325 239.0, 325 291.0, 380 291.0" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M 270 343.0 C 325 343.0, 325 291.0, 380 291.0" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M 270 447.0 C 325 447.0, 325 291.0, 380 291.0" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="380" y="96" width="260" height="390" rx="10" fill="#1e40af" stroke="#1e3a5f" stroke-width="2"/>
<text x="510.0" y="283.0" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="white">tl.*</text>
<text x="510.0" y="307.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#dbeafe">18+81+17+10 = 126 个符号</text>
<text x="510.0" y="325.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#bfdbfe">汇聚到顶层命名空间</text>
<line x1="640" y1="291.0" x2="744" y2="291.0" stroke="#64748b" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="750" y="225.0" width="300" height="132" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="900.0" y="251.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#92400e">__all__ = 131 项</text>
<text x="900.0" y="273.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#78350f">字母序公开门面清单</text>
<text x="900.0" y="297.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#b91c1c" font-weight="bold">含 3 项在册未导入</text>
<text x="900.0" y="317.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7c2d12">(builtin/ir/triton：访问即</text>
<text x="900.0" y="333.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7c2d12">AttributeError)</text>
<text x="40" y="570" font-family="sans-serif" font-size="11.5" fill="#64748b">__init__.py:L6-L111 依序 re-export 四模块（standard 18 / core 81 / math 17 / random 10）→ L124-L256 声明 __all__=131 项；声明不是保证，__all__ 是门面清单，不代表名字真的可导入。</text>
</svg>