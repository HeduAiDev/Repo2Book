<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1018 450">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker></defs>
<rect width="1018" height="450" fill="white"/>
<text x="34" y="34" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e40af">constexpr：转发 dunder，追踪期常数性质闭合传播</text>
<text x="34" y="56" font-family="sans-serif" font-size="12" fill="#64748b">c = constexpr(256)，L = [10, 11, 12, 13]（pin triton==3.2.0 实测）</text>
<rect x="34" y="66" width="150" height="34" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="109" y="88" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e3a5f">constexpr(256)</text>
<rect x="144" y="118" width="202" height="34" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="245.0" y="139.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="white" font-weight="bold">c + 8</text>
<line x1="109" y1="100" x2="245.0" y2="116" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="354" y="118" width="202" height="34" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="455.0" y="139.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="white" font-weight="bold">c * 4</text>
<line x1="109" y1="100" x2="455.0" y2="116" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="564" y="118" width="202" height="34" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="665.0" y="139.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="white" font-weight="bold">c // 64</text>
<line x1="109" y1="100" x2="665.0" y2="116" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="774" y="118" width="202" height="34" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="875.0" y="139.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="white" font-weight="bold">L[c2]  (c2=constexpr(2))</text>
<line x1="109" y1="100" x2="875.0" y2="116" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#a)"/>
<text x="128" y="187.0" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="bold" fill="#374151">触发 dunder</text>
<text x="245.0" y="188.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#374151" >__add__</text>
<text x="455.0" y="188.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#374151" >__mul__</text>
<text x="665.0" y="188.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#374151" >__floordiv__</text>
<text x="875.0" y="188.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#374151" >__index__</text>
<text x="128" y="240.0" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="bold" fill="#374151">内层求值</text>
<text x="245.0" y="241.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#374151" >256 + 8</text>
<text x="455.0" y="241.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#374151" >256 * 4</text>
<text x="665.0" y="241.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#374151" >256 // 64</text>
<text x="875.0" y="241.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#374151" >当下标 2 用</text>
<line x1="34" y1="208" x2="984" y2="208" stroke="#e2e8f0" stroke-width="1"/>
<text x="128" y="296.0" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="bold" fill="#374151">结果</text>
<rect x="144" y="268" width="202" height="48" rx="4" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
<text x="245.0" y="297.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1d4ed8" font-weight="bold" >constexpr[264]</text>
<rect x="354" y="268" width="202" height="48" rx="4" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
<text x="455.0" y="297.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1d4ed8" font-weight="bold" >constexpr[1024]</text>
<rect x="564" y="268" width="202" height="48" rx="4" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
<text x="665.0" y="297.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1d4ed8" font-weight="bold" >constexpr[4]</text>
<rect x="774" y="268" width="202" height="48" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="875.0" y="297.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#b45309" font-weight="bold" >12</text>
<line x1="34" y1="264" x2="984" y2="264" stroke="#e2e8f0" stroke-width="1"/>
<rect x="34" y="340" width="18" height="18" rx="3" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
<text x="60" y="354" font-family="sans-serif" font-size="12" fill="#374151">仍裹在 constexpr 里（常量性未丢失）</text>
<rect x="364" y="340" width="18" height="18" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="390" y="354" font-family="sans-serif" font-size="12" fill="#374151">__index__/__bool__ 出壳为宿主真值</text>
<text x="34" y="422" font-family="sans-serif" font-size="11" fill="#64748b">core.py:L151-L154 每个算术 dunder 形如 constexpr(self.value ⊕ _constexpr_to_value(other))——内层用真值算，结果重新裹壳。</text>
</svg>