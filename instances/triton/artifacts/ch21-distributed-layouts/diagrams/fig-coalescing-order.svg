<text x="46" y="614" font-family="sans-serif" font-size="12" fill="#64748b">同一 warp、同一份数据,只换 order:左(order=[1,0],编译器实发)32 lane 贴着一行的连续列,64 字节合并成 1 笔;</text>
<text x="46" y="632" font-family="sans-serif" font-size="12" fill="#64748b">右(order=[0,1],反例)32 lane 竖着落在 32 行、彼此相隔 128 字节,退化成 32 笔。order[0] 必须指向 stride=1 维——</text>
<text x="46" y="650" font-family="sans-serif" font-size="12" fill="#64748b">这是访存合并现场(见第 7 章)在布局层的固化。</text>
