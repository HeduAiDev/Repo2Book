<text x="46" y="370" font-family="sans-serif" font-size="12" fill="#64748b">一个整数字段 versionMajor 分派整代 Tensor Core:谓词 isVolta/isAmpere/isHopper 据它选布局分支;</text>
<text x="46" y="388" font-family="sans-serif" font-size="12" fill="#64748b">instrShape 携带 MMA 指令的 M x N。为什么布局长这样=硬件 MMA 输出寄存器排布反推,深化留后续章节。</text>
