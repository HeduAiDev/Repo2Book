<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 952 516">
<defs><marker id="fwd" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#1d4ed8"/></marker><marker id="rev" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#b45309"/></marker></defs>
<rect width="952" height="516" fill="white"/>
<text x="46" y="30" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">SliceEncoding 是 expand_dims 的逆:挤掉一维 &lt;-&gt; 顶回 size-1</text>
<text x="46" y="52" font-family="sans-serif" font-size="12" fill="#64748b">matmul 里 tt.make_range -&gt; tt.expand_dims 的真实 IR(Triton v3.2.0 实测)</text>
<text x="46" y="98" font-family="sans-serif" font-size="13" font-weight="bold" fill="#334155">挤 M 方向(dim=1)</text>
<rect x="46" y="110" width="300" height="74" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="196.0" y="138" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1e3a5f">tensor&lt;64x1xi32, #blocked&gt;</text>
<text x="196.0" y="160" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1d4ed8">parent (#blocked), rank=2</text>
<rect x="566" y="110" width="340" height="74" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="736.0" y="132" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#7c4a03">tensor&lt;64xi32,</text>
<text x="736.0" y="148" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#7c4a03">slice&lt;dim=1,parent=#blocked&gt;&gt;</text>
<text x="736.0" y="168" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#b45309">slice, rank=1</text>
<line x1="352" y1="133.68" x2="560" y2="133.68" stroke="#1d4ed8" stroke-width="2" marker-end="url(#fwd)"/>
<text x="456.0" y="125.68" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#1d4ed8">squeeze(dim=1)  沿 dim1 挤掉一维</text>
<line x1="560" y1="165.5" x2="352" y2="165.5" stroke="#b45309" stroke-width="2" marker-end="url(#rev)"/>
<text x="456.0" y="183.5" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#b45309">expand_dims(axis=1)  顶回 size-1</text>
<text x="46" y="258" font-family="sans-serif" font-size="13" font-weight="bold" fill="#334155">挤 N 方向(dim=0)</text>
<rect x="46" y="270" width="300" height="74" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="196.0" y="298" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1e3a5f">tensor&lt;1x64xi32, #blocked&gt;</text>
<text x="196.0" y="320" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1d4ed8">parent (#blocked), rank=2</text>
<rect x="566" y="270" width="340" height="74" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="736.0" y="292" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#7c4a03">tensor&lt;64xi32,</text>
<text x="736.0" y="308" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#7c4a03">slice&lt;dim=0,parent=#blocked&gt;&gt;</text>
<text x="736.0" y="328" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#b45309">slice, rank=1</text>
<line x1="352" y1="293.68" x2="560" y2="293.68" stroke="#1d4ed8" stroke-width="2" marker-end="url(#fwd)"/>
<text x="456.0" y="285.68" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#1d4ed8">squeeze(dim=0)  沿 dim0 挤掉一维</text>
<line x1="560" y1="325.5" x2="352" y2="325.5" stroke="#b45309" stroke-width="2" marker-end="url(#rev)"/>
<text x="456.0" y="343.5" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#b45309">expand_dims(axis=0)  顶回 size-1</text>
<text x="46" y="436" font-family="sans-serif" font-size="12" fill="#64748b">上:parent 2D #blocked 沿 dim=1 squeeze -&gt; 1D slice&lt;dim=1,parent=#blocked&gt;;expand_dims(axis=1) 逐位还原 parent。</text>
<text x="46" y="454" font-family="sans-serif" font-size="12" fill="#64748b">下:换挤 dim=0,同样互逆。matmul 里 arange -&gt; expand_dims 这一对就是 slice 作 expand_dims 逆的真实现场。</text>
</svg>