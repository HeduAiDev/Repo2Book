<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 753 518">
<rect width="753" height="518" fill="white"/>
<text x="46" y="30" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">DotOperandEncoding:kWidth 由 dtype 定死,不容自选</text>
<text x="46" y="52" font-family="sans-serif" font-size="12" fill="#64748b">Ampere fp16 matmul 操作数,每线程沿收缩维 K 恰好攥住一次 mma.16816 搬运量(traces/matmul.json)</text>
<rect x="46" y="72" width="342.40000000000003" height="40" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="217.20000000000002" y="97" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#4338ca">kWidth = 32 / bitwidth = 32 / 16 = 2</text>
<text x="46" y="136" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1d4ed8">a  opIdx=0  (M, K)</text>
<rect x="46" y="150" width="39" height="39" rx="3" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.3"/>
<rect x="88" y="150" width="39" height="39" rx="3" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.3"/>
<rect x="130" y="150" width="39" height="39" rx="3" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.3"/>
<rect x="172" y="150" width="39" height="39" rx="3" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.3"/>
<rect x="46" y="192" width="39" height="39" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.3"/>
<rect x="88" y="192" width="39" height="39" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.3"/>
<rect x="130" y="192" width="39" height="39" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.3"/>
<rect x="172" y="192" width="39" height="39" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.3"/>
<text x="38" y="250" font-family="sans-serif" font-size="11" fill="#1d4ed8">M=2 (行)</text>
<text x="46" y="268" font-family="sans-serif" font-size="11" fill="#1d4ed8">K=4 (列,沿收缩维连续)</text>
<line x1="46" y1="148" x2="211" y2="148" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="354" y="136" font-family="sans-serif" font-size="13" font-weight="bold" fill="#15803d">b  opIdx=1  (K, N)</text>
<rect x="354" y="150" width="39" height="39" rx="3" fill="#bbf7d0" stroke="#15803d" stroke-width="1.3"/>
<rect x="354" y="192" width="39" height="39" rx="3" fill="#bbf7d0" stroke="#15803d" stroke-width="1.3"/>
<rect x="354" y="234" width="39" height="39" rx="3" fill="#bbf7d0" stroke="#15803d" stroke-width="1.3"/>
<rect x="354" y="276" width="39" height="39" rx="3" fill="#bbf7d0" stroke="#15803d" stroke-width="1.3"/>
<text x="354" y="334" font-family="sans-serif" font-size="11" fill="#15803d">K=4 (行,沿收缩维连续)</text>
<text x="354" y="352" font-family="sans-serif" font-size="11" fill="#15803d">N=1 (列)</text>
<rect x="50.0" y="388" width="124.19999999999999" height="50" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
<text x="112.1" y="407" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">kWidth (fp16)</text>
<text x="112.1" y="426" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">2</text>
<rect x="182.2" y="388" width="124.19999999999999" height="50" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
<text x="244.29999999999998" y="407" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">bitwidth</text>
<text x="244.29999999999998" y="426" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">16</text>
<rect x="314.4" y="388" width="124.19999999999999" height="50" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
<text x="376.5" y="407" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">a 每线程 (M,K)</text>
<text x="376.5" y="426" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">[2, 4]</text>
<rect x="446.59999999999997" y="388" width="124.19999999999999" height="50" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
<text x="508.69999999999993" y="407" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">b 每线程 (K,N)</text>
<text x="508.69999999999993" y="426" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">[4, 1]</text>
<rect x="578.8" y="388" width="124.19999999999999" height="50" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
<text x="640.9" y="407" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">a 沿 K 连续元素</text>
<text x="640.9" y="426" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">4</text>
<text x="46" y="458" font-family="sans-serif" font-size="12" fill="#64748b">a(opIdx=0,M x K)每线程 [M=2,K=4]:沿收缩维 K 的 4 个 fp16 连续排布,恰好凑满一次 ldmatrix/mma.16816 搬运;</text>
<text x="46" y="476" font-family="sans-serif" font-size="12" fill="#64748b">b(opIdx=1,K x N)每线程 [K=4,N=1],同样沿 K 连续 4 个。kWidth 由 dtype 位宽定死,mma 布局深化留后续章节。</text>
</svg>