<text x="400.0" y="354.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">.current_device</text>
<line x1="510" y1="346.0" x2="536" y2="346.0" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#a)"/>
<line x1="400.0" y1="188" x2="400.0" y2="300" stroke="#b91c1c" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#a)"/>
<rect x="540" y="300" width="220" height="92" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-dasharray="3,3"/>
<text x="650.0" y="338.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">raw CUDA</text>
<text x="650.0" y="354.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">stream</text>
<line x1="760" y1="346.0" x2="786" y2="346.0" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#a)"/>
<line x1="650.0" y1="188" x2="650.0" y2="300" stroke="#b91c1c" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#a)"/>
<rect x="790" y="300" width="220" height="92" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-dasharray="3,3"/>
<text x="900.0" y="346.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">GPUTarget</text>
<text x="40" y="460" font-family="sans-serif" font-size="12" fill="#334155">make_backend(target) 只按 target 选后端，headless 可跑；三次 get_current_* 桥到 torch.cuda，需真设备。</text>
<text x="40" y="480" font-family="sans-serif" font-size="11" fill="#64748b">本书用 stub（FakeDriver）顶替这道门，才让后面真编译在 host 上跑起来。</text>
