<text x="150.0" y="346.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">GPUDriver.active</text>
<line x1="260" y1="346.0" x2="286" y2="346.0" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#a)"/>
