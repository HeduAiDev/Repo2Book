<text x="650.0" y="120" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">get_current_target</text>
<text x="650.0" y="142" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">target=cuda sm=80</text>
<text x="650.0" y="158" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">warp=32</text>
<text x="750" y="112" text-anchor="end" font-family="sans-serif" font-size="13" fill="#b91c1c">⚡</text>
<line x1="760" y1="142.0" x2="786" y2="142.0" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="790" y="96" width="220" height="92" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="900.0" y="120" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">make_backend(target)</text>
<text x="900.0" y="142" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">-&gt; CUDABackend</text>
<text x="900.0" y="158" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">(headless 可跑)</text>
