<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 500">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker></defs>
<rect width="1050" height="500" fill="white"/>
<text x="40" y="38" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">driver 边界一跳：run() 开场四问，只有一道门后是真 GPU</text>
