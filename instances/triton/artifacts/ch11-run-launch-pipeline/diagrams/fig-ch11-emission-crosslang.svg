<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1358 430">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="8" markerHeight="6" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#b91c1c"/></marker></defs>
<rect width="1358" height="430" fill="white"/>
<text x="44" y="36" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">跨语言发射一跳：kernel.run(...) 把接力棒交给 C++ launcher</text>
<rect x="54.0" y="64" width="540" height="30" rx="6" fill="#e2e8f0" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="324.0" y="85" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1d4ed8">Python（jit.py run 收尾）</text>
<line x1="324.0" y1="100" x2="324.0" y2="360" stroke="#94a3b8" stroke-dasharray="4,4"/>
<rect x="764.0" y="64" width="540" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.4"/>
<text x="1034.0" y="85" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#64748b">后端 C++ launcher（driver 子系统，见第十二章）</text>
<line x1="1034.0" y1="100" x2="1034.0" y2="360" stroke="#94a3b8" stroke-dasharray="4,4"/>
<rect x="74.0" y="110" width="500" height="86" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="324.0" y="130" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a">launch_metadata = kernel.launch_metadata(</text>
<text x="324.0" y="148" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">grid, stream, *non_constexpr_vals)</text>
<text x="324.0" y="166" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">常态无 hook -&gt; None</text>
<rect x="74.0" y="222" width="500" height="86" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="324.0" y="242" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a">kernel.run(grid_0,grid_1,grid_2, stream,</text>
<text x="324.0" y="260" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">function, packed_metadata, launch_metadata,</text>
<text x="324.0" y="278" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">launch_enter/exit_hook, *non_constexpr_vals)</text>
<line x1="574.0" y1="278" x2="784.0" y2="278" stroke="#b91c1c" stroke-width="3" marker-end="url(#r)"/>
<text x="679.0" y="264" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#b91c1c">⚡ 双语断点</text>
<text x="679.0" y="300" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#b91c1c">（需真设备）</text>
<rect x="784.0" y="254" width="500" height="72" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="1034.0" y="276" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#7f1d1d">接收上述参数 -&gt; cuLaunchKernel</text>
<text x="1034.0" y="298" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">GPU 上出现一个 kernel 实例</text>
<text x="1034.0" y="318" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#b91c1c">本书 headless 未执行此跳（无 GPU）</text>
<text x="44" y="386" font-family="sans-serif" font-size="12" fill="#334155">数字核对：grid 三维 (4, 1, 1)；运行期实参 non_constexpr 4 个（3 指针 + 1 i32）；</text>
<text x="44" y="406" font-family="sans-serif" font-size="12" fill="#334155">launch_enter_hook / launch_exit_hook 常态 None，launch_metadata 直接 None，路径零额外开销。</text>
</svg>