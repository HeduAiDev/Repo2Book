<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1252 558">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker></defs>
<rect width="1252" height="558" fill="white"/>
<text x="44" y="36" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">launch 三档开销：冷编 / 热编 / 稳态命中跨约 6 个数量级</text>
<text x="44" y="58" font-family="sans-serif" font-size="12" fill="#64748b">同一 add_kernel（N=1024, BLOCK_SIZE=256）；对数横轴，条长按 log10(耗时/微秒) 计</text>
<text x="44" y="110" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">首次冷编（含 ptxas/LLVM 预热，一次性）</text>
<rect x="44" y="118" width="575.1114747255194" height="46" rx="6" fill="#b91c1c" opacity="0.88"/>
<text x="629.1114747255194" y="137.0" font-family="sans-serif" font-size="13" font-weight="bold" fill="#b91c1c">1951.11 ms</text>
<text x="629.1114747255194" y="155.0" font-family="sans-serif" font-size="11" fill="#334155">≈443591.2× 于稳态</text>
<text x="44" y="190" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">热进程真编（慢路径 compile）</text>
<rect x="44" y="198" width="456.49393405639506" height="46" rx="6" fill="#d97706" opacity="0.88"/>
<text x="510.49393405639506" y="217.0" font-family="sans-serif" font-size="13" font-weight="bold" fill="#d97706">98.379 ms</text>
<text x="510.49393405639506" y="235.0" font-family="sans-serif" font-size="11" fill="#334155">≈22366.8× 于稳态</text>
<text x="44" y="270" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">稳态命中（快路径，run 侧 Python 记账）</text>
<rect x="44" y="278" width="58.811906287979106" height="46" rx="6" fill="#15803d" opacity="0.88"/>
<text x="112.8119062879791" y="297.0" font-family="sans-serif" font-size="13" font-weight="bold" fill="#15803d">4.398 μs</text>
<text x="112.8119062879791" y="315.0" font-family="sans-serif" font-size="11" fill="#334155">1×（基准） 于稳态</text>
<line x1="44" y1="364" x2="684" y2="364" stroke="#94a3b8" stroke-width="1.2"/>
<line x1="44.0" y1="364" x2="44.0" y2="369" stroke="#94a3b8"/>
<text x="44.0" y="384" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">1 μs</text>
<line x1="226.85714285714283" y1="364" x2="226.85714285714283" y2="369" stroke="#94a3b8"/>
<text x="226.85714285714283" y="384" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">100 μs</text>
<line x1="409.71428571428567" y1="364" x2="409.71428571428567" y2="369" stroke="#94a3b8"/>
<text x="409.71428571428567" y="384" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">10 ms</text>
<line x1="592.5714285714286" y1="364" x2="592.5714285714286" y2="369" stroke="#94a3b8"/>
<text x="592.5714285714286" y="384" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">1 s</text>
<text x="364.0" y="404" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">耗时（对数刻度）</text>
<text x="774" y="104" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">规模 vs 耗时：两条曲线的交点</text>
<rect x="774" y="128" width="172.20000000000005" height="300" fill="#dcfce7" opacity="0.45"/>
<rect x="946.2" y="128" width="237.79999999999995" height="300" fill="#dbeafe" opacity="0.45"/>
<line x1="774" y1="428" x2="1184" y2="428" stroke="#334155" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="774" y1="428" x2="774" y2="128" stroke="#334155" stroke-width="1.4" marker-end="url(#a)"/>
<text x="979.0" y="454" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">kernel 计算规模（元素数）</text>
<text x="760" y="122" text-anchor="end" font-family="sans-serif" font-size="11" fill="#64748b">耗时</text>
<line x1="774" y1="382" x2="1184" y2="382" stroke="#15803d" stroke-width="2.2"/>
<text x="782" y="374" font-family="sans-serif" font-size="11" font-weight="bold" fill="#15803d">发射固定开销 ≈4.398 μs（常数，与规模无关）</text>
<line x1="774" y1="424" x2="1184" y2="136" stroke="#1d4ed8" stroke-width="2.2"/>
<text x="1178" y="150" text-anchor="end" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1d4ed8">GPU 计算时间</text>
<text x="1178" y="166" text-anchor="end" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1d4ed8">（随规模线性增）</text>
<circle cx="946.2" cy="382" r="5" fill="#7c2d12"/>
<line x1="946.2" y1="128" x2="946.2" y2="428" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
<text x="946.2" y="474" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#7c2d12">交点</text>
<text x="860.1" y="396" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#15803d">发射受限区</text>
<text x="860.1" y="410" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#166534">（小 kernel）</text>
<text x="1065.1" y="396" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1d4ed8">算力受限区</text>
<text x="44" y="498" font-family="sans-serif" font-size="12" fill="#334155">冷编/命中 ≈443591.2×；热编/命中 ≈22366.8×——性能测量必须先预热才反映稳态成本。</text>
<text x="44" y="520" font-family="sans-serif" font-size="11" fill="#64748b">4.398 μs 为 headless warmup 路径 run 侧记账（未含真 C++ 发射），是真实固定开销的下界；</text>
<text x="44" y="540" font-family="sans-serif" font-size="11" fill="#64748b">小 kernel 落在发射受限区时，优化应靠融合 kernel / 增大 grid / CUDA graph，而非堆算力。</text>
</svg>