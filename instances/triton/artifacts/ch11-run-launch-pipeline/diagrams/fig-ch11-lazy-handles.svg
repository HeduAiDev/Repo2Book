<text x="744.0" y="132.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">driver.active.launcher_cls</text>
<text x="744.0" y="149.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">造 C++ launcher 挂到 self.run</text>
<line x1="744.0" y1="160" x2="744.0" y2="176" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
