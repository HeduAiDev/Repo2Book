<line x1="412" y1="240.0" x2="556" y2="240.0" stroke="#7c3aed" stroke-width="2.4" marker-end="url(#a)"/>
<rect x="414.0" y="194.0" width="140" height="34" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
<text x="484.0" y="216.0" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#5b21b6">读 kernel.run</text>
<text x="484.0" y="262.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#5b21b6">__getattribute__</text>
<text x="484.0" y="276.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#5b21b6">拦截 -&gt; _init_handles()</text>
<text x="44" y="454" font-family="sans-serif" font-size="12" fill="#334155">数字核对：module_after_compile=None，function_after_compile=None（本书 headless 实测）；</text>
<text x="44" y="474" font-family="sans-serif" font-size="12" fill="#334155">metadata.shared=0 字节——编译期即定，与是否装载设备无关。</text>
<text x="44" y="496" font-family="sans-serif" font-size="11" fill="#64748b">本书在 host 上只能停在左态；右态需真 GPU，如实标注未执行。</text>
