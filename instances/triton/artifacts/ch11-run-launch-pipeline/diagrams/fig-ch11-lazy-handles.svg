<text x="224.0" y="279.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#7f1d1d">function = None</text>
<line x1="224.0" y1="300" x2="224.0" y2="316" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="74.0" y="320" width="300" height="50" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.4"/>
<text x="224.0" y="342.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">run 未初始化</text>
<text x="224.0" y="359.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">无需 GPU 也能走到这里</text>
