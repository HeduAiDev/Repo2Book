<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 872">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker><marker id="b" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#b45309"/></marker><marker id="g" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#15803d"/></marker></defs>
<rect width="1180" height="872" fill="white"/>
<text x="70" y="40" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">JITFunction.run 一次 launch 的脊柱：6 段固定工序，只有 ④ 在未命中时展开</text>
<rect x="40" y="66" width="18" height="82" rx="4" fill="#fee2e2" stroke="#b91c1c"/>
<text x="49" y="111.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#b91c1c" transform="rotate(-90 49 111.0)">需真设备</text>
<rect x="70.0" y="74" width="460" height="66" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/>
<circle cx="92.0" cy="94" r="15" fill="#1d4ed8"/>
<text x="92.0" y="99" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="white">①</text>
<text x="314" y="94" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">driver.active 取 device/stream/target</text>
<text x="314" y="109" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">+ make_backend(target)</text>
<text x="300" y="130" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">device=0, target=cuda sm=80 warp=32</text>
<line x1="300" y1="140" x2="300" y2="176" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="70.0" y="180" width="460" height="66" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/>
<circle cx="92.0" cy="200" r="15" fill="#1d4ed8"/>
<text x="92.0" y="205" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="white">②</text>
<text x="314" y="200" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">惰性 binder 得 5 元组</text>
<text x="314" y="215" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">(create_binder / 直接调用)</text>
<text x="300" y="236" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">sig_and_spec=[*fp32,*fp32,*fp32,i32,D,D,D,D]; constexpr_vals=(256,)</text>
<line x1="300" y1="246" x2="300" y2="282" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="70.0" y="286" width="460" height="66" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/>
<circle cx="92.0" cy="306" r="15" fill="#1d4ed8"/>
<text x="92.0" y="311" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="white">③</text>
<text x="314" y="306" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">拼 key 查 cache[device]</text>
<text x="300" y="342" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">key=…((256,), {'debug': False})</text>
<line x1="300" y1="418" x2="300" y2="392" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
<polygon points="300,392 354.0,446.0 300,500 246.0,446.0" fill="#e2e8f0" stroke="#475569" stroke-width="1.6"/>
<text x="300" y="450.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">命中?</text>
<line x1="300" y1="500" x2="300" y2="540" stroke="#15803d" stroke-width="2" marker-end="url(#g)"/>
<text x="312" y="522.0" font-family="sans-serif" font-size="12" font-weight="bold" fill="#15803d">命中 (dict.get 直达)</text>
<rect x="70.0" y="540" width="460" height="66" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/>
<circle cx="92.0" cy="560" r="15" fill="#1d4ed8"/>
<text x="92.0" y="565" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="white">⑤</text>
<text x="314" y="566" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">规范化 grid</text>
<text x="300" y="596" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">(4,) -&gt; (4, 1, 1)</text>
<line x1="300" y1="606" x2="300" y2="642" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="70.0" y="646" width="460" height="66" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/>
<circle cx="92.0" cy="666" r="15" fill="#b91c1c"/>
<text x="92.0" y="671" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="white">⑥</text>
<text x="314" y="672" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">kernel.run 跨语言发射</text>
<text x="300" y="702" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">需真设备(⚡)</text>
<rect x="40" y="638" width="18" height="82" rx="4" fill="#fee2e2" stroke="#b91c1c"/>
<text x="49" y="683.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#b91c1c" transform="rotate(-90 49 683.0)">需真设备</text>
<line x1="354.0" y1="446.0" x2="520.0" y2="446.0" stroke="#b45309" stroke-width="2" marker-end="url(#b)"/>
<text x="437.0" y="434.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#b45309">未命中</text>
<rect x="520.0" y="413.0" width="460" height="66" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
<circle cx="542.0" cy="433.0" r="15" fill="#b45309"/>
<text x="542.0" y="438.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="white">④</text>
<text x="764.0" y="433.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">未命中 -&gt; compile 支路</text>
<text x="764.0" y="448.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">parse_options -&gt; ASTSource -&gt; compile</text>
<text x="750.0" y="469.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">回填后此键永久命中</text>
<path d="M 980.0,446.0 L 1020.0,446.0 L 1020.0,319.0 L 530.0,319.0" fill="none" stroke="#b45309" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#b)"/>
<text x="1028.0" y="382.5" font-family="sans-serif" font-size="11" fill="#b45309">回填 cache[key]</text>
<text x="70" y="826" font-family="sans-serif" font-size="12" fill="#334155">cache 条目 miss 后 = 1；第二次同参 launch：k2 is k1 = True（同一 CompiledKernel，无编译）</text>
<text x="70" y="846" font-family="sans-serif" font-size="11" fill="#64748b">红边框 = 需真设备（host 无 GPU 在此断裂）；橙色支路 = 内存 cache 未命中触发的一次性慢路径</text>
</svg>