<text x="40" y="390" font-family="sans-serif" font-size="12" fill="#64748b">红=MISS(新建键并搜索)，绿=HIT(命中既有键直接复用)；指针地址等不入键，故同(尺寸,dtype)重复调用必稳定 HIT。</text>
