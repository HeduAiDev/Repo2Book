<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 894">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker></defs>
<rect width="980" height="894" fill="white"/>
<text x="40" y="34" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1e40af">_discover_backends：扫目录、各取唯一 concrete 子类</text>
<text x="40" y="56" font-family="sans-serif" font-size="12" fill="#64748b">python/triton/backends/__init__.py —— 新后端只需照此结构放两份文件即入表</text>
<rect x="210" y="96" width="560" height="74" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
<text x="490" y="138" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0c4a6e">os.listdir(backends/)  —— 逐个非 __ 开头的子目录 &lt;name&gt;</text>
<line x1="490" y1="140" x2="490" y2="170" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="210" y="170" width="560" height="96" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
<text x="490" y="212" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0c4a6e">_load_module(&lt;name&gt;, backends/&lt;name&gt;/compiler.py)</text>
<text x="490" y="234" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0c4a6e">_load_module(&lt;name&gt;, backends/&lt;name&gt;/driver.py)</text>
<line x1="490" y1="266" x2="490" y2="296" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="210" y="296" width="560" height="78" rx="14" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="490" y="328" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#78350f">_find_concrete_subclasses(module, BaseBackend / DriverBase)</text>
<text x="490" y="350" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#78350f">（各自筛出 concrete 子类）</text>
<line x1="490" y1="374" x2="490" y2="394" stroke="#334155" stroke-width="2"/>
<line x1="180" y1="394" x2="800" y2="394" stroke="#334155" stroke-width="2"/>
<line x1="180" y1="394" x2="180" y2="434" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<line x1="490" y1="394" x2="490" y2="434" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<line x1="800" y1="394" x2="800" y2="434" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<text x="180" y="386" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155">len(ret) = 0</text>
<rect x="40" y="434" width="280" height="70" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="180" y="463" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b91c1c">RuntimeError</text>
<text x="180" y="481" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b91c1c">（一个后端都没实现）</text>
<text x="490" y="386" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155">len(ret) = 1</text>
<rect x="350" y="434" width="280" height="70" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="490" y="463" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#15803d">唯一 —— ret[0]</text>
<text x="490" y="481" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#15803d">继续组装</text>
<text x="800" y="386" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155">len(ret) = &gt;1</text>
<rect x="660" y="434" width="280" height="70" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="800" y="463" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b91c1c">RuntimeError</text>
<text x="800" y="481" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b91c1c">（目录里混了多个 concrete 类）</text>
<line x1="490" y1="504" x2="490" y2="538" stroke="#16a34a" stroke-width="2"/>
<line x1="490" y1="538" x2="490" y2="538" stroke="#16a34a" stroke-width="2"/>
<line x1="490" y1="538" x2="490" y2="568" stroke="#16a34a" stroke-width="2" marker-end="url(#a)"/>
<rect x="210" y="568" width="560" height="74" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="490" y="610" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1e3a5f">Backend(compiler=..., driver=...)  —— 组装</text>
<line x1="490" y1="642" x2="490" y2="672" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="210" y="672" width="560" height="74" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="490" y="714" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1e3a5f">backends[&lt;name&gt;] = Backend(...)  —— 存入表</text>
<rect x="40" y="782" width="900" height="72" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
<text x="56" y="808" font-family="sans-serif" font-size="12.5" fill="#1e3a5f">compiler.py / driver.py 各恰好 1 个 concrete 子类是硬契约——姊妹篇只需在 backends/ 下</text>
<text x="56" y="832" font-family="sans-serif" font-size="12.5" fill="#1e3a5f">新增一个 ascend/ 目录、照此结构放两份文件，主库代码零改动即被纳入 {name: Backend} 表。</text>
</svg>