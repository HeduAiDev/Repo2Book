<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 426">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker></defs>
<rect width="1120" height="426" fill="white"/>
<text x="40" y="34" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1e40af">LazyProxy：首次属性访问才构造 driver</text>
<text x="40" y="56" font-family="sans-serif" font-size="12" fill="#64748b">python/triton/runtime/driver.py —— import triton 时只登记 init_fn，不碰 CUDA</text>
<rect x="40" y="110" width="339" height="116" rx="14" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
<text x="210" y="142" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#854d0e">未初始化</text>
<text x="210" y="170" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#854d0e">self._obj = None</text>
<text x="210" y="200" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a16207">driver.py:L14-L16（LazyProxy.__init__）</text>
<rect x="741" y="110" width="339" height="116" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="910" y="142" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#14532d">已初始化</text>
<text x="910" y="170" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#14532d">self._obj = 真 driver 实例</text>
<text x="910" y="200" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#15803d">driver.py:L18-L24（_initialize_obj → __getattr__）</text>
<line x1="379" y1="168" x2="741" y2="168" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<text x="560" y="134" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155">首次访问触发</text>
<text x="560" y="154" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">__getattr__ / __setattr__ / __delattr__ / __str__</text>
<text x="560" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">若 self._obj is None: self._obj = self._init_fn()</text>
<rect x="40" y="272" width="1040" height="102" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
<text x="56" y="298" font-family="sans-serif" font-size="12.5" fill="#1e3a5f">import triton 时只把 default = LazyProxy(_create_driver) 登记好（driver.py:L50）——</text>
<text x="56" y="322" font-family="sans-serif" font-size="12.5" fill="#1e3a5f">停在左态，headless，不触碰 torch.cuda；真正需要设备时才向右跳一次转移，</text>
<text x="56" y="346" font-family="sans-serif" font-size="12.5" fill="#1e3a5f">这正是上一章标出的『真设备断裂点』被推迟发生的位置。</text>
</svg>