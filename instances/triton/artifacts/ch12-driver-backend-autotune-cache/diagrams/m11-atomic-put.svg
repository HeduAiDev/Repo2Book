<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 380">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker></defs>
<rect width="1303" height="380" fill="white"/>
<text x="40" y="34" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1e40af">FileCacheManager.put：原子落盘，读者永远看不到半截文件</text>
<text x="40" y="56" font-family="sans-serif" font-size="12" fill="#64748b">python/triton/runtime/cache.py:L112-L136 —— 磁盘缓存与内存 launch 缓存正交（回指上一章）</text>
<rect x="40" y="100" width="353" height="84" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
<text x="217" y="132" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e3a5f">写临时目录</text>
<text x="217" y="158" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1e3a5f">cache_dir/tmp.pid_&lt;pid&gt;_&lt;uuid&gt;/&lt;filename&gt;</text>
<rect x="453" y="100" width="278" height="84" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.8"/>
<text x="592" y="132" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#854d0e">原子改名</text>
<text x="592" y="158" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#854d0e">os.replace(temp_path, filepath)</text>
<line x1="393" y1="142" x2="453" y2="142" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="791" y="100" width="195" height="84" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
<text x="888" y="132" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#14532d">正本落地</text>
<text x="888" y="158" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#14532d">cache_dir/&lt;filename&gt;</text>
<line x1="731" y1="142" x2="791" y2="142" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="1046" y="100" width="217" height="84" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.8"/>
<text x="1154" y="132" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#334155">清理临时目录</text>
<text x="1154" y="158" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">os.removedirs(temp_dir)</text>
<line x1="986" y1="142" x2="1046" y2="142" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="40" y="224" width="1223" height="96" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
<text x="56" y="250" font-family="sans-serif" font-size="12.5" fill="#1e3a5f">cache_dir = &lt;TRITON_CACHE_DIR 或 ~/.triton/cache&gt;/&lt;key&gt;；os.replace 是 POSIX 原子 rename——</text>
<text x="56" y="274" font-family="sans-serif" font-size="12.5" fill="#1e3a5f">并发读者要么看到旧正本、要么看到完整新正本，绝不会读到写了一半的残缺文件。</text>
<text x="56" y="298" font-family="sans-serif" font-size="12.5" fill="#1e3a5f">这层跨进程免重编的磁盘缓存，与上一章内存 launch 缓存的 cache[device][key] 三桶正交，互不替代。</text>
</svg>