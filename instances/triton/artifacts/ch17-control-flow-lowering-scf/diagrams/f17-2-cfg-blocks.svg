<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460.0 534">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker></defs>
<rect width="1460.0" height="534" fill="white"/>
<text x="40" y="30" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">带 return 的 if 下降成非结构化 CFG(实按 K3_if_return_cfg 真实基本块)</text>
<text x="40" y="50" font-family="sans-serif" font-size="12" fill="#475569">cf.cond_br 分岔 -&gt; then 直接离场 / else+死块汇入 endif;没有单一出口</text>
<rect x="235.0" y="38.0" width="260" height="76" rx="9" fill="#e2e8f0" stroke="#475569" stroke-width="1.6"/>
<text x="365.0" y="60.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#0f172a" font-weight="bold" >^bb0 (entry)</text>
<text x="365.0" y="76.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#0f172a" >%0 = arith.cmpi sgt</text>
<text x="365.0" y="92.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#0f172a" >cf.cond_br %0, ^bb1, ^bb2</text>
<rect x="40.0" y="176.0" width="260" height="76" rx="9" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="170.0" y="198.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#0f172a" font-weight="bold" >^bb1  // pred: ^bb0</text>
<text x="170.0" y="214.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#0f172a" >store 1; tt.return</text>
<text x="170.0" y="230.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#0f172a" >(直接离场,无后继)</text>
<rect x="430.0" y="176.0" width="260" height="76" rx="9" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="560.0" y="206.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#0f172a" font-weight="bold" >^bb2  // pred: ^bb0</text>
<text x="560.0" y="222.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#0f172a" >cf.br ^bb4</text>
<rect x="820.0" y="176.0" width="260" height="76" rx="9" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6,4"/>
<text x="950.0" y="198.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#0f172a" font-weight="bold" >^bb3:  // no predecessors</text>
<text x="950.0" y="214.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#0f172a" >cf.br ^bb4</text>
<text x="950.0" y="230.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#0f172a" >(死块,不可达)</text>
<rect x="235.0" y="334.0" width="260" height="76" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
<text x="365.0" y="356.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#0f172a" font-weight="bold" >^bb4:  // 2 preds: ^bb2, ^bb3</text>
<text x="365.0" y="372.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#0f172a" >store 2; tt.return</text>
<text x="365.0" y="388.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#0f172a" >(endif 汇合块)</text>
<line x1="307.8" y1="152.0" x2="170.0" y2="176.0" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#a)"/>
<text x="238.9" y="158.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1d4ed8">cond=真</text>
<line x1="422.2" y1="152.0" x2="560.0" y2="176.0" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
<text x="491.1" y="158.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">cond=假</text>
<line x1="560.0" y1="252.0" x2="313.0" y2="334.0" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
<text x="436.5" y="287.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">cf.br</text>
<line x1="950.0" y1="252.0" x2="417.0" y2="334.0" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)" stroke-dasharray="6,4"/>
<text x="683.5" y="287.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#94a3b8">cf.br</text>
<text x="170.0" y="274.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#b91c1c">无边到 ^bb4(then 已 return 离场)</text>
<rect x="1130.0" y="204" width="280" height="244" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5,3"/>
<text x="1146.0" y="228" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#7f1d1d">红线:</text>
<text x="1146.0" y="248" font-family="sans-serif" font-size="11.5" font-weight="normal" fill="#7f1d1d">endif_block 通常还会</text>
<text x="1146.0" y="268" font-family="sans-serif" font-size="11.5" font-weight="normal" fill="#7f1d1d">add_argument()——分支各自</text>
<text x="1146.0" y="288" font-family="sans-serif" font-size="11.5" font-weight="normal" fill="#7f1d1d">写了同名变量时,汇合块用</text>
<text x="1146.0" y="308" font-family="sans-serif" font-size="11.5" font-weight="normal" fill="#7f1d1d">块参数接住(手写 φ,</text>
<text x="1146.0" y="328" font-family="sans-serif" font-size="11.5" font-weight="normal" fill="#7f1d1d">L634, L646-L653)。</text>
<text x="1146.0" y="348" font-family="sans-serif" font-size="11.5" font-weight="normal" fill="#7f1d1d">本例分支只写内存、没有</text>
<text x="1146.0" y="368" font-family="sans-serif" font-size="11.5" font-weight="normal" fill="#7f1d1d">变量要合并,故 ^bb4 本身</text>
<text x="1146.0" y="388" font-family="sans-serif" font-size="11.5" font-weight="normal" fill="#7f1d1d">没有块参数,不影响 CFG。</text>
<text x="40" y="512" font-family="sans-serif" font-size="11" fill="#64748b">Triton v3.2.0 headless 实测:ir.K3_if_return_cfg;op_counts.K3_if_return_cfg.cf.br=2</text>
</svg>