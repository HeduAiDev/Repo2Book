<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 858 536">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker></defs>
<rect width="858" height="536" fill="white"/>
<text x="44" y="30" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">while 下降成 scf.while 双区域:上房间判条件,下房间跑体</text>
<text x="44" y="50" font-family="sans-serif" font-size="12" fill="#475569">%1:2 = scf.while (%arg2=%0, %arg3=%c0_i32):(tensor&lt;4xi32&gt;, i32) -&gt; (...)  —— 2 个 loop-carried:acc, i</text>
<rect x="44" y="96" width="560" height="100" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
<text x="324.0" y="120" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1d4ed8">before 区(条件区)—— 块参数 %arg2, %arg3</text>
<text x="324.0" y="144" text-anchor="middle" font-family="monospace" font-size="12" fill="#0f172a">%5 = arith.cmpi slt, %arg3, %arg1</text>
<text x="324.0" y="166" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#1e3a8a">scf.condition(%5) %arg2, %arg3</text>
<text x="324.0" y="186" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">为真则把 loop-carried 带过门,进 after 区;为假则跳出整个 while</text>
<line x1="324.0" y1="196" x2="324.0" y2="250" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<text x="338.0" y="226.0" font-family="sans-serif" font-size="11" fill="#334155">scf.condition 为真,带 loop-carried 过门</text>
<rect x="44" y="256" width="560" height="130" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
<text x="324.0" y="280" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#15803d">after 区(循环体区)—— 块参数 %arg2, %arg3(同名,独立一份)</text>
<text x="324.0" y="304" text-anchor="middle" font-family="monospace" font-size="12" fill="#0f172a">%12 = arith.addi %arg2, ...   (acc 累加)</text>
<text x="324.0" y="324" text-anchor="middle" font-family="monospace" font-size="12" fill="#0f172a">%19 = arith.addi %arg3, %c1_i32   (i 自增)</text>
<text x="324.0" y="346" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#15803d">scf.yield %12, %19</text>
<text x="324.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">跑完体,把新值 yield 回 before 区,再判一次条件</text>
<path d="M 604,321.0 L 644,321.0 L 644,146.0 L 604,146.0" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#a)"/>
<text x="652" y="225.5" font-family="sans-serif" font-size="11" fill="#64748b">每轮回</text>
<text x="652" y="243.5" font-family="sans-serif" font-size="11" fill="#64748b">before 区重判</text>
<text x="44" y="432" font-family="sans-serif" font-size="11.5" fill="#334155">before/after 各自 create_block_with_parent 绑块参数;对照 for:</text>
<text x="44" y="452" font-family="sans-serif" font-size="11.5" fill="#334155">while 的诱导逻辑全在 before 区用户条件里,无 poison/负步长那套</text>
<text x="44" y="476" font-family="sans-serif" font-size="10.5" fill="#64748b">Triton v3.2.0 headless 实测:ir.K5_while(scf.while=1, scf.condition=1, scf.yield=1)</text>
<text x="44" y="494" font-family="sans-serif" font-size="10.5" fill="#94a3b8">code_generator.py:L847-L875</text>
</svg>