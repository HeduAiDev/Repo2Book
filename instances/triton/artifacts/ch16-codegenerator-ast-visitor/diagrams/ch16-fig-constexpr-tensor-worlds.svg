<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1035 728">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker></defs>
<rect width="1035" height="728" fill="white"/>
<text x="30" y="30" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e40af">CodeGenerator 的两个世界:constexpr(编译期) &lt;-&gt; tensor(运行期)</text>
<text x="30" y="50" font-family="sans-serif" font-size="12" fill="#64748b">本章主线心智模型;此二分在本章现身 4 处(visit_Assign/visit_FunctionDef/call_JitFunction/visit_BinOp)</text>
<rect x="205" y="100" width="390" height="34" rx="3" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="400.0" y="121.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="white" font-weight="bold">constexpr 世界(编译期)</text>
<rect x="605" y="100" width="390" height="34" rx="3" fill="#a21caf" stroke="#a21caf" stroke-width="1.5"/>
<text x="800.0" y="121.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="white" font-weight="bold">tensor 世界(运行期)</text>
<text x="189" y="182.0" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="bold" fill="#374151">是什么</text>
<rect x="205" y="145" width="390" height="66" rx="4" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1"/>
<text x="400.0" y="173.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1d4ed8">Python 值</text>
<text x="400.0" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1d4ed8">(int/str/dtype/tl.constexpr 包装)</text>
<rect x="605" y="145" width="390" height="66" rx="4" fill="#fdf4ff" stroke="#a21caf" stroke-width="1"/>
<text x="800.0" y="173.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#a21caf">language.tensor</text>
<text x="800.0" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#a21caf">(handle=MLIR Value + type)</text>
<line x1="30" y1="216" x2="995" y2="216" stroke="#e2e8f0" stroke-width="1"/>
<text x="189" y="258.0" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="bold" fill="#374151">何时已知</text>
<rect x="205" y="221" width="390" height="66" rx="4" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1"/>
<text x="400.0" y="249.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1d4ed8">编译时已知,可折叠</text>
<text x="400.0" y="266.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1d4ed8">(BLOCK=1024 -&gt; arith.constant)</text>
<rect x="605" y="221" width="390" height="66" rx="4" fill="#fdf4ff" stroke="#a21caf" stroke-width="1"/>
<text x="800.0" y="249.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#a21caf">运行期才有值</text>
<text x="800.0" y="266.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#a21caf">IR 里只是一个 SSA 名</text>
<line x1="30" y1="292" x2="995" y2="292" stroke="#e2e8f0" stroke-width="1"/>
<text x="189" y="334.0" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="bold" fill="#374151">判据函数</text>
<rect x="205" y="297" width="390" height="66" rx="4" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1"/>
<text x="400.0" y="334.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1d4ed8">_is_constexpr</text>
<rect x="605" y="297" width="390" height="66" rx="4" fill="#fdf4ff" stroke="#a21caf" stroke-width="1"/>
<text x="800.0" y="325.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#a21caf">_is_triton_tensor</text>
<text x="800.0" y="342.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#a21caf">_is_triton_value</text>
<line x1="30" y1="368" x2="995" y2="368" stroke="#e2e8f0" stroke-width="1"/>
<text x="189" y="410.0" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="bold" fill="#374151">在 visit_Assign</text>
<rect x="205" y="373" width="390" height="66" rx="4" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1"/>
<text x="400.0" y="401.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1d4ed8">_unwrap 成裸值赋进 Python 变量</text>
<text x="400.0" y="418.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1d4ed8">不建 op</text>
<rect x="605" y="373" width="390" height="66" rx="4" fill="#fdf4ff" stroke="#a21caf" stroke-width="1"/>
<text x="800.0" y="410.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#a21caf">to_tensor 物化成 SSA 句柄</text>
<line x1="30" y1="444" x2="995" y2="444" stroke="#e2e8f0" stroke-width="1"/>
<text x="189" y="486.0" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="bold" fill="#374151">在 visit_FunctionDef</text>
<rect x="205" y="449" width="390" height="66" rx="4" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1"/>
<text x="400.0" y="477.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1d4ed8">取 Python 值,idx 不加</text>
<text x="400.0" y="494.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1d4ed8">(不占 IR 位)</text>
<rect x="605" y="449" width="390" height="66" rx="4" fill="#fdf4ff" stroke="#a21caf" stroke-width="1"/>
<text x="800.0" y="477.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#a21caf">fn.args(idx) 取句柄</text>
<text x="800.0" y="494.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#a21caf">idx++</text>
<line x1="30" y1="520" x2="995" y2="520" stroke="#e2e8f0" stroke-width="1"/>
<text x="189" y="562.0" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="bold" fill="#374151">在 call_JitFunction</text>
<rect x="205" y="525" width="390" height="66" rx="4" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1"/>
<text x="400.0" y="553.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1d4ed8">抽进 constants,进 mangle 名</text>
<text x="400.0" y="570.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1d4ed8">(不进 IR 参数)</text>
<rect x="605" y="525" width="390" height="66" rx="4" fill="#fdf4ff" stroke="#a21caf" stroke-width="1"/>
<text x="800.0" y="553.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#a21caf">arg.handle 成为 tt.call</text>
<text x="800.0" y="570.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#a21caf">的 SSA 操作数</text>
<line x1="30" y1="596" x2="995" y2="596" stroke="#e2e8f0" stroke-width="1"/>
<text x="189" y="638.0" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="bold" fill="#374151">在 visit_BinOp</text>
<rect x="205" y="601" width="390" height="66" rx="4" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1"/>
<text x="400.0" y="629.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1d4ed8">两边都 constexpr</text>
<text x="400.0" y="646.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1d4ed8">-&gt; 纯 Python 运算</text>
<rect x="605" y="601" width="390" height="66" rx="4" fill="#fdf4ff" stroke="#a21caf" stroke-width="1"/>
<text x="800.0" y="629.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#a21caf">有 tensor -&gt; __add__(_builder=)</text>
<text x="800.0" y="646.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#a21caf">建 op</text>
<text x="30" y="704" font-family="sans-serif" font-size="11" fill="#64748b">每遇一个节点先问:这是哪个世界的东西——左列折叠进代码不建 op,右列建真 SSA op</text>
</svg>