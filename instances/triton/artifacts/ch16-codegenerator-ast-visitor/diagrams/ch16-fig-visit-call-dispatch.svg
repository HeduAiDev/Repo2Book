<text x="780.0" y="309.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">call_JitFunction 内联,建 tt.call</text>
<text x="780.0" y="324.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">如 _helper(x, BLOCK)</text>
<text x="302.0" y="355.0" text-anchor="end" font-family="sans-serif" font-size="11" fill="#334155">否 ↓</text>
