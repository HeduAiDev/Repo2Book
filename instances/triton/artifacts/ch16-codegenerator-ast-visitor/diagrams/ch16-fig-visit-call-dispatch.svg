<text x="780.0" y="418.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">如 tl.load / x.to(tl.float32)</text>
<text x="302.0" y="449.0" text-anchor="end" font-family="sans-serif" font-size="11" fill="#334155">否 ↓</text>
