<text x="122.0" y="502.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="white">④</text>
<text x="324.0" y="484" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#475569">兜底:纯 Python callable</text>
<text x="324.0" y="504" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">unwrap constexpr 后宿主直调</text>
<text x="324.0" y="519" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">不建 op,如 range(0, N)</text>
<text x="60" y="572" font-family="sans-serif" font-size="12" fill="#334155">分派出口数=4(code_generator.py:L1099-L1126);static 表项数=4(int/len/static_assert/static_print,L1252-L1257);本例 6 个调用点中建 IR op 数=3</text>
<text x="60" y="592" font-family="sans-serif" font-size="11" fill="#64748b">蓝=建 IR op(JITFunction 内联 / builtin);灰=不建 op(编译期折叠 / 兜底纯 Python);黄=决策问句</text>
