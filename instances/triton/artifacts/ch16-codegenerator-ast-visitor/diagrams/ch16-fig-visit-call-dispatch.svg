<text x="780.0" y="195.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#475569">static:编译期求值</text>
<text x="780.0" y="215.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">返回 constexpr,不建 op</text>
