<text x="340.0" y="747.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">前瞻第 25 章:向量化访存的源头</text>
<text x="60" y="806" font-family="sans-serif" font-size="12" fill="#334155">divisibility 值=16(backends/compiler.py:L77)</text>
