<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 920">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker></defs>
<rect width="680" height="920" fill="white"/>
<text x="60" y="34" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">divisibility 提示的端到端证据链:链上任一环断,后端就分析不出对齐</text>
<text x="60" y="56" font-family="sans-serif" font-size="12" fill="#64748b">性能落点收尾:launch 期算出的对齐信息,必须钉成 tt.func 参数属性,后端才读得到</text>
