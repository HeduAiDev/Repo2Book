<text x="340.0" y="128.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#475569">launch 期:multiple_of 打标记 + 特化</text>
<text x="340.0" y="147.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">回指第 9/12 章:算出哪些指针 16 对齐</text>
<line x1="340.0" y1="166" x2="340.0" y2="196" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="60.0" y="200" width="560" height="66" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
<text x="340.0" y="221.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1d4ed8">AttrsDescriptor._add_common_properties</text>
<text x="340.0" y="240.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">property_values['tt.divisibility']=16</text>
<text x="340.0" y="255.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">arg_properties 收 16 对齐参数序号</text>
<line x1="340.0" y1="266" x2="340.0" y2="296" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="60.0" y="300" width="560" height="66" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
<text x="340.0" y="328.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1d4ed8">get_fn_attrs()</text>
<text x="340.0" y="347.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">打包成 {argIdx: [('tt.divisibility', 16)]}</text>
<line x1="340.0" y1="366" x2="340.0" y2="396" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="60.0" y="400" width="560" height="66" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
<text x="340.0" y="438.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1d4ed8">ast_to_ttir 的 fn_attrs -&gt; CodeGenerator.attributes</text>
<line x1="340.0" y1="466" x2="340.0" y2="496" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="60.0" y="500" width="560" height="66" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
<text x="340.0" y="528.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#b45309">visit_FunctionDef:set_arg_attr(idx, 'tt.divisibility', 16)</text>
<text x="340.0" y="547.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">本章讲的那一步——提示真正落进 IR</text>
<line x1="340.0" y1="566" x2="340.0" y2="596" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="60.0" y="600" width="560" height="66" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
<text x="340.0" y="628.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1d4ed8">追踪期 tt.func:%argN {tt.divisibility = 16}</text>
<text x="340.0" y="647.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">本例落属性的参数数 = 3</text>
<line x1="340.0" y1="666" x2="340.0" y2="696" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
