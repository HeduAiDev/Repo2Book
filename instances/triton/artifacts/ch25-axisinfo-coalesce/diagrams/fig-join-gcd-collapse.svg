<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 418">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker></defs>
<rect width="850" height="418" fill="white"/>
<text x="40" y="34" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e40af">join = 逐轴 gcd：一支对齐退化就把合并向量宽拖到 1</text>
<text x="210.0" y="98" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">分支 A 单独：divisibility=16</text>
<rect x="60.0" y="128" width="300" height="46" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
<text x="210.0" y="156.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0f172a">branch A: div=16 字节</text>
<line x1="210.0" y1="174" x2="210.0" y2="194" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="60.0" y="198" width="300" height="46" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
<text x="210.0" y="226.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0f172a">perThread = min(16/4,1024,4)</text>
<line x1="210.0" y1="244" x2="210.0" y2="264" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="60.0" y="268" width="300" height="46" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
<text x="210.0" y="296.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0f172a">= 4 （128-bit 向量）</text>
<text x="640.0" y="98" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">A、B 在汇合点 join 后</text>
<rect x="490.0" y="128" width="300" height="46" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
<text x="640.0" y="156.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0f172a">branch B: div=4 字节</text>
<line x1="640.0" y1="174" x2="640.0" y2="194" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="490.0" y="198" width="300" height="46" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
<text x="640.0" y="226.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0f172a">join(A,B) = gcd(16,4) = 4</text>
<line x1="640.0" y1="244" x2="640.0" y2="264" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="490.0" y="268" width="300" height="46" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2.5"/>
<text x="640.0" y="296.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0f172a">perThread = min(4/4,1024,4) = 1（标量）</text>
<line x1="390" y1="221.0" x2="460" y2="221.0" stroke="#d97706" stroke-width="2.5" marker-end="url(#a)"/>
<text x="425" y="209.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#d97706" font-weight="bold">在此汇合</text>
<text x="40" y="394" font-family="sans-serif" font-size="11" fill="#64748b">A 单独能 4 元素/线程(128-bit)；一旦与 4 字节对齐的 B 汇合，divisibility=gcd(16,4)=4，向量宽塌回 1——提示被路径 join 掉了。</text>
</svg>