<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 354">
<rect width="950" height="354" fill="white"/>
<text x="30" y="30" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e40af">AxisInfo 三元组 — 一根轴的三张访存体检报告</text>
<text x="30" y="50" font-family="sans-serif" font-size="12" fill="#64748b">header 例：[10,11,12,13,18,19,20,21]（AxisInfo.h 头注图例）；主线：x_ptr + tl.arange(0,1024), i32</text>
<rect x="30" y="108" width="182" height="40" rx="3" fill="#475569"/>
<text x="121.0" y="132.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">Value</text>
<rect x="220" y="108" width="142" height="40" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="291.0" y="125.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">contiguity</text>
<text x="291.0" y="139.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">(顺读多长)</text>
<rect x="370" y="108" width="142" height="40" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="441.0" y="125.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">divisibility</text>
<text x="441.0" y="139.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">(字节对齐)</text>
<rect x="520" y="108" width="142" height="40" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="591.0" y="125.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">constancy</text>
<text x="591.0" y="139.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">(重复多长)</text>
<rect x="670" y="108" width="242" height="40" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="791.0" y="132.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">读法</text>
<rect x="30" y="158" width="182" height="60" rx="4" fill="white" stroke="#cbd5e1" stroke-width="1"/>
<text x="44" y="184.0" text-anchor="start" font-family="sans-serif" font-size="12" font-weight="bold" fill="#374151">header 例</text>
<text x="44" y="200.0" text-anchor="start" font-family="sans-serif" font-size="12" font-weight="bold" fill="#374151">[10..13,18..21]</text>
<rect x="220" y="158" width="142" height="60" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="291.0" y="193.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#374151" font-weight="bold">4</text>
<rect x="370" y="158" width="142" height="60" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="441.0" y="193.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#374151" font-weight="bold">—</text>
<rect x="520" y="158" width="142" height="60" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="591.0" y="193.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#374151" font-weight="bold">—</text>
<rect x="670" y="158" width="242" height="60" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="791.0" y="184.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151">前 4 个连号(10-13)</text>
<text x="791.0" y="200.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151">断在 18，顺读最长 4</text>
<rect x="30" y="226" width="182" height="60" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
<text x="44" y="252.0" text-anchor="start" font-family="sans-serif" font-size="12" font-weight="bold" fill="#047857">%p（主线 addptr</text>
<text x="44" y="268.0" text-anchor="start" font-family="sans-serif" font-size="12" font-weight="bold" fill="#047857">结果指针张量）</text>
<rect x="220" y="226" width="142" height="60" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
<text x="291.0" y="261.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#047857" font-weight="bold">1024</text>
<rect x="370" y="226" width="142" height="60" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
<text x="441.0" y="261.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#047857" font-weight="bold">16</text>
<rect x="520" y="226" width="142" height="60" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
<text x="591.0" y="261.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#047857" font-weight="bold">1</text>
<rect x="670" y="226" width="242" height="60" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
<text x="791.0" y="252.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#047857">整段连续 1024；起点 16</text>
<text x="791.0" y="268.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#047857">字节对齐；无重复</text>
<text x="30" y="332" font-family="sans-serif" font-size="11" fill="#64748b">绿高亮 = 主线例最终值(1024, 16 字节, 1)：既长又对齐，是 Coalesce 敢向量化的静态凭据。三分量恒为 2 的幂。</text>
</svg>