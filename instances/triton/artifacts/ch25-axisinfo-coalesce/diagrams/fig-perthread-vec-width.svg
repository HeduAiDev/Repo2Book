<text x="30" y="30" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e40af">perThread = min(对齐, 连续, 128/bits) —— 三道闸门定每线程向量宽</text>
<text x="30" y="50" font-family="sans-serif" font-size="12" fill="#64748b">i32(elemBits=32)：128-bit cap = 4 个元素；主线 divisibility=16 字节 → perThread=4（绿色行）</text>
