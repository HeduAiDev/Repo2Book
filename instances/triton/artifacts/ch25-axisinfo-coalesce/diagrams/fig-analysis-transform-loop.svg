<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 368">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#1e3a5f"/></marker></defs>
<rect width="1280" height="368" fill="white"/>
<text x="40" y="30" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e40af">runOnOperation：全书第一个完整 analysis→transform 闭环</text>
<text x="40" y="50" font-family="sans-serif" font-size="12" fill="#64748b">Coalesce::runOnOperation —— 后续 ch26-35 每个优化 pass 都是这个范式的变体</text>
<rect x="40" y="108" width="340" height="130" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="210.0" y="132" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">阶段1：分析（只读）</text>
<rect x="56" y="142" width="308" height="42" rx="4" fill="white" stroke="#3b82f6" stroke-width="1"/>
<text x="210.0" y="155" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#3b82f6">ModuleAxisInfoAnalysis</text>
<text x="210.0" y="171" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#3b82f6">(moduleOp)</text>
<text x="210.0" y="198" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">读 contiguity/divisibility</text>
<text x="210.0" y="214" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">三元组，不改 IR</text>
<line x1="380" y1="173.0" x2="464" y2="173.0" stroke="#1e3a5f" stroke-width="2" marker-end="url(#a)"/>
<rect x="470" y="108" width="340" height="130" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
<text x="640.0" y="132" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">阶段2：walk 收集布局</text>
<rect x="486" y="142" width="308" height="42" rx="4" fill="white" stroke="#ca8a04" stroke-width="1"/>
<text x="640.0" y="155" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ca8a04">setCoalescedEncoding</text>
<text x="640.0" y="171" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ca8a04">→ layoutMap</text>
<text x="640.0" y="198" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">据分析结果决定</text>
<text x="640.0" y="214" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">每个 load/store 的目标布局</text>
<line x1="810" y1="173.0" x2="894" y2="173.0" stroke="#1e3a5f" stroke-width="2" marker-end="url(#a)"/>
<rect x="900" y="108" width="340" height="130" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
<text x="1070.0" y="132" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">阶段3：改写</text>
<rect x="916" y="142" width="308" height="42" rx="4" fill="white" stroke="#047857" stroke-width="1"/>
<text x="1070.0" y="163" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#047857">coalesceOp(kv)</text>
<text x="1070.0" y="198" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">convert_layout 夹层</text>
<text x="1070.0" y="214" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">落地新布局</text>
<text x="40" y="284" font-family="sans-serif" font-size="12" fill="#374151">分析读的量：contiguity / divisibility（AxisInfo 三元组，AxisInfo.h:L23-L108）</text>
<text x="40" y="310" font-family="sans-serif" font-size="11" fill="#64748b">AxisInfo 只读推断出每根轴的静态真相 → Coalesce 据 contiguity 定 order、据 divisibility/contiguity 定向量宽 → coalesceOp 落地改写。</text>
<text x="40" y="330" font-family="sans-serif" font-size="11" fill="#64748b">ch26-35 的每个优化 pass 都是这个范式的变体。</text>
</svg>