<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 296">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#1e3a5f"/></marker></defs>
<rect width="1160" height="296" fill="white"/>
<text x="40" y="30" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e40af">稀疏前向数据流：每个 op 一张 visitor 配方卡</text>
<text x="40" y="50" font-family="sans-serif" font-size="12" fill="#64748b">make_range(0,1024) → splat(x_ptr) → addptr —— 三元组 (contiguity, divisibility字节, constancy) 逐 op 更新</text>
<rect x="40" y="96" width="300" height="110" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="190.0" y="120" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">make_range 0..1024</text>
<text x="190.0" y="140" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b" font-style="italic">MakeRangeOpAxisInfoVisitor</text>
<rect x="56" y="150" width="268" height="26" rx="4" fill="white" stroke="#3b82f6" stroke-width="1"/>
<text x="190.0" y="167" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#3b82f6">(1024, 1073741824, 1)</text>
<text x="190.0" y="194" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">造源头：contiguity=end-start</text>
<line x1="340" y1="151.0" x2="424" y2="151.0" stroke="#1e3a5f" stroke-width="2" marker-end="url(#a)"/>
<rect x="430" y="96" width="300" height="110" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="580.0" y="120" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">splat x_ptr</text>
<text x="580.0" y="140" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b" font-style="italic">SplatOpAxisInfoVisitor</text>
<rect x="446" y="150" width="268" height="26" rx="4" fill="white" stroke="#3b82f6" stroke-width="1"/>
<text x="580.0" y="167" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#3b82f6">(1, 16, 1024)</text>
<text x="580.0" y="194" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">标量吹成张量：contiguity→1，constancy→1024</text>
<line x1="730" y1="151.0" x2="814" y2="151.0" stroke="#1e3a5f" stroke-width="2" marker-end="url(#a)"/>
<rect x="820" y="96" width="300" height="110" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
<text x="970.0" y="120" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">addptr %b, %r</text>
<text x="970.0" y="140" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b" font-style="italic">AddSubOpAxisInfoVisitor&lt;AddPtrOp&gt;</text>
<rect x="836" y="150" width="268" height="26" rx="4" fill="white" stroke="#047857" stroke-width="1"/>
<text x="970.0" y="167" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#047857">(1024, 16, 1)</text>
<text x="970.0" y="194" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">叠偏移：静态真相汇成于此</text>
<text x="40" y="256" font-family="sans-serif" font-size="11" fill="#64748b">(contiguity, divisibility字节, constancy)——三元组沿箭头前向传播；source→splat→addptr 一趟直链即到不动点，无需回环。</text>
<text x="40" y="274" font-family="sans-serif" font-size="11" fill="#64748b">绿框 = 最终汇成的静态真相 (1024, 16 字节, 1)，交给 Coalesce 消费。</text>
</svg>