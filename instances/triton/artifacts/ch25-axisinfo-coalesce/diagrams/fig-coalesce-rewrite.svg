<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 492">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker></defs>
<rect width="890" height="492" fill="white"/>
<text x="40" y="34" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e40af">coalesceOp：用 convert_layout 夹层做保语义改写</text>
<text x="220.0" y="94" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">改写前：1 个 op</text>
<rect x="60.0" y="152.0" width="320" height="46" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
<text x="220.0" y="180.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">%p : L_old</text>
<line x1="220.0" y1="198.0" x2="220.0" y2="216.0" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="60.0" y="220.0" width="320" height="46" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
<text x="220.0" y="248.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">%v = tt.load %p : L_old</text>
<text x="670.0" y="94" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">改写后：1 load + 2 convert_layout</text>
<rect x="510.0" y="118.0" width="320" height="46" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2.5"/>
<text x="670.0" y="146.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">%p2 = convert_layout %p</text>
<line x1="670.0" y1="164.0" x2="670.0" y2="182.0" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="510.0" y="186.0" width="320" height="46" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
<text x="670.0" y="214.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">%v2 = tt.load %p2 : L_new(perThread=4)</text>
<line x1="670.0" y1="232.0" x2="670.0" y2="250.0" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="510.0" y="254.0" width="320" height="46" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2.5"/>
<text x="670.0" y="282.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">%v3 = convert_layout %v2 : L_new→L_old</text>
<line x1="410" y1="209.0" x2="480" y2="209.0" stroke="#d97706" stroke-width="2.5" marker-end="url(#a)"/>
<text x="445" y="195.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#d97706" font-weight="bold">Coalesce 改写</text>
<text x="220.0" y="330" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1e40af">1</text>
<text x="220.0" y="348" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">改写前 op 数</text>
<text x="550.0" y="330" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1e40af">3</text>
<text x="550.0" y="348" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">改写后 op 数</text>
<text x="670.0" y="330" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1e40af">2</text>
<text x="670.0" y="348" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">新增 convert_layout</text>
<text x="790.0" y="330" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1e40af">4</text>
<text x="790.0" y="348" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">load 向量宽提升到</text>
<text x="40" y="452" font-family="sans-serif" font-size="11" fill="#64748b">SSA 下不能原地改类型：操作数 convert 到新布局→造新 load→结果 convert 回原布局→replaceAllUsesWith。</text>
<text x="40" y="468" font-family="sans-serif" font-size="11" fill="#64748b">多出的 2 个 convert 由后续化简吸收，换来 load 从 1 升到 perThread=4 的 128-bit 向量访存。</text>
</svg>