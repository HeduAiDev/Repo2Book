<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 620">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker></defs>
<rect width="940" height="620" fill="white"/>
<text x="470.0" y="28" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a">grid=(2,) 补齐 (2,1,1)：GPU 并行铺开 vs GridExecutor 串行喂入</text>
<text x="40" y="76" font-family="sans-serif" font-size="13" font-weight="bold" fill="#64748b">GPU（本应，对照）</text>
<line x1="190" y1="86" x2="880" y2="86" stroke="#cbd5e1" stroke-width="1"/>
<rect x="230" y="100" width="220" height="62" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3"/>
<text x="340.0" y="122" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#475569">program_id=0</text>
<text x="340.0" y="140" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">与另一 program 同时跑</text>
<rect x="620" y="100" width="220" height="62" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3"/>
<text x="730.0" y="122" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#475569">program_id=1</text>
<text x="730.0" y="140" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">与另一 program 同时跑</text>
<text x="535.0" y="184" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#94a3b8">同一时刻，不同 SM/warp——两个框在时间轴上并排</text>
<text x="40" y="306" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e40af">CPU 替身（实测，GridExecutor 三重 for）</text>
<line x1="190" y1="316" x2="880" y2="316" stroke="#3b82f6" stroke-width="1.5"/>
<rect x="230" y="360" width="220" height="62" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="340.0" y="380" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a">program_id=0</text>
<text x="340.0" y="397" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#1e40af">offs=[0,1,2,3]</text>
<text x="340.0" y="413" text-anchor="middle" font-family="monospace" font-size="10.5" font-weight="bold" fill="#1d4ed8">y=[0,2,4,6]</text>
<circle cx="340.0" cy="340" r="13" fill="#2563eb" stroke="white" stroke-width="2"/>
<text x="340.0" y="345" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="white">1</text>
<rect x="620" y="360" width="220" height="62" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="730.0" y="380" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a">program_id=1</text>
<text x="730.0" y="397" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#1e40af">offs=[4,5,6,7]</text>
<text x="730.0" y="413" text-anchor="middle" font-family="monospace" font-size="10.5" font-weight="bold" fill="#1d4ed8">y=[8,10,12,14]</text>
<circle cx="730.0" cy="340" r="13" fill="#2563eb" stroke="white" stroke-width="2"/>
<text x="730.0" y="345" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="white">2</text>
<line x1="450" y1="391.0" x2="620" y2="391.0" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#a)"/>
<text x="535.0" y="377.0" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1d4ed8">整段跑完才轮到下一个</text>
<text x="535.0" y="444" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e40af">同一时间轴上，两个框首尾相接——单线程 numpy，无并发</text>
<rect x="40" y="477" width="860" height="58" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="56" y="499" font-family="sans-serif" font-size="11.5" fill="#334155">grid (2,)→补齐(2,1,1)；串行调用点：for x/y/z: set_grid_idx; self.fn(**args)（interpreter.py:L1093-1102）</text>
<text x="56" y="519" font-family="sans-serif" font-size="11.5" fill="#334155">program_id 不是硬件算出来的，是 GridExecutor 一个个塞进来的——这就是『串行 ≠ 并行』的画面</text>
</svg>