<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 496">
<defs><marker id="ck" viewBox="0 0 20 20" refX="10" refY="10" markerWidth="16" markerHeight="16"></marker></defs>
<rect width="1100" height="496" fill="white"/>
<text x="550.0" y="34" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">替身执行器：能查『对错』，量不出『快慢』</text>
<text x="550.0" y="56" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">一次只有一个 program、并行旋钮被直接丢弃——用它查逻辑，不用它查性能</text>
<rect x="40" y="120" width="480" height="44" rx="8" fill="#22c55e"/>
<text x="64" y="149.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="white">✓</text>
<text x="86" y="148.0" font-family="sans-serif" font-size="15" font-weight="bold" fill="white">能</text>
<rect x="580" y="120" width="480" height="44" rx="8" fill="#ef4444"/>
<text x="604" y="149.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="white">✗</text>
<text x="626" y="148.0" font-family="sans-serif" font-size="15" font-weight="bold" fill="white">不能</text>
<rect x="40" y="178" width="480" height="70" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
<text x="58" y="200" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">数值正确性</text>
<text x="58" y="220" font-family="sans-serif" font-size="11" fill="#334155">[0..7]*2 实测正确（correct = Tr</text>
<text x="58" y="236" font-family="sans-serif" font-size="11" fill="#334155">ue）</text>
<rect x="40" y="262" width="480" height="70" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
<text x="58" y="284" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">单步 / print</text>
<text x="58" y="306" font-family="sans-serif" font-size="11" fill="#334155">核内 print 直接在 CPU 生效</text>
<rect x="580" y="178" width="480" height="70" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
<text x="598" y="200" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">并行旋钮</text>
<text x="598" y="220" font-family="sans-serif" font-size="11" fill="#334155">RESERVED_KWS 剔除：num_warps/</text>
<text x="598" y="236" font-family="sans-serif" font-size="11" fill="#334155">num_stages/num_ctas/...</text>
<rect x="580" y="262" width="480" height="70" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
<text x="598" y="284" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">访存策略</text>
<text x="598" y="304" font-family="sans-serif" font-size="11" fill="#334155">cache_modifier/eviction_po</text>
<text x="598" y="320" font-family="sans-serif" font-size="11" fill="#334155">licy/is_volatile 被忽略（下划线占位）</text>
<rect x="580" y="346" width="480" height="70" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
<text x="598" y="368" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">并行性能量</text>
<text x="598" y="388" font-family="sans-serif" font-size="11" fill="#334155">合并访存/occupancy/bank 冲突——无并</text>
<text x="598" y="404" font-family="sans-serif" font-size="11" fill="#334155">发访存，量不出来</text>
<text x="40" y="472" font-family="sans-serif" font-size="12" font-weight="bold" fill="#475569">一句话：用它查对错（逻辑/边界/数值），不用它查快慢（并行性能量在单线程替身上不存在）</text>
</svg>