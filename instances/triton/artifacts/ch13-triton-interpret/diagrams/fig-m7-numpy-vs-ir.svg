<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 502">
<rect width="990" height="502" fill="white"/>
<text x="30" y="30" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e40af">InterpreterBuilder：同名同签名的 create_*，换掉了内核</text>
<text x="30" y="52" font-family="sans-serif" font-size="12" fill="#64748b">左：真 Builder——建 IR 节点交后端编译。右：InterpreterBuilder——numpy 当场算出数值，不建 IR</text>
<rect x="30" y="118" width="166" height="34" fill="#64748b" stroke="#1e3a5f" stroke-width="1"/>
<text x="113.0" y="139.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="white">接口</text>
<rect x="200" y="118" width="376" height="34" fill="#94a3b8" stroke="#1e3a5f" stroke-width="1"/>
<text x="388.0" y="139.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="white">真 Builder（建 IR）</text>
<rect x="580" y="118" width="376" height="34" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1"/>
<text x="768.0" y="139.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="white">InterpreterBuilder（numpy 直算）</text>
<rect x="30" y="152" width="926" height="54" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="38" y="182.0" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155">program_id 实现</text>
<text x="208" y="172" font-family="monospace" font-size="10.5" fill="#475569">return builder.create_get_program_id(axis)  </text>
<text x="208" y="188" font-family="monospace" font-size="10.5" fill="#475569"># 建 IR 节点</text>
<text x="588" y="172" font-family="monospace" font-size="10.5" font-weight="bold" fill="#0f766e">return grid_idx[axis]  # 直接取值，不建 IR</text>
<text x="588" y="200" font-family="sans-serif" font-size="9.5" fill="#94a3b8">interpreter.py:L358-361</text>
<rect x="30" y="210" width="926" height="54" fill="white" stroke="#e2e8f0" stroke-width="1"/>
<text x="38" y="240.0" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155">二元算子公共实现</text>
<text x="208" y="230" font-family="monospace" font-size="10.5" fill="#475569">builder.create_add/create_mul(...)  # 建 tt.*</text>
<text x="208" y="246" font-family="monospace" font-size="10.5" fill="#475569"> IR 节点</text>
<text x="588" y="230" font-family="monospace" font-size="10.5" font-weight="bold" fill="#0f766e">binary_op: TensorHandle(op(lhs.data, rhs.dat</text>
<text x="588" y="246" font-family="monospace" font-size="10.5" font-weight="bold" fill="#0f766e">a), ...)</text>
<text x="588" y="258" font-family="sans-serif" font-size="9.5" fill="#94a3b8">interpreter.py:L416-417</text>
<rect x="30" y="268" width="926" height="54" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="38" y="298.0" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155">create_add</text>
<text x="208" y="288" font-family="monospace" font-size="10.5" fill="#475569">IR 节点 tt.add，交后端编译成 GPU 指令</text>
<text x="588" y="288" font-family="monospace" font-size="10.5" font-weight="bold" fill="#0f766e">binary_op(..., np.add)</text>
<text x="588" y="316" font-family="sans-serif" font-size="9.5" fill="#94a3b8">interpreter.py:L431</text>
<rect x="30" y="326" width="926" height="54" fill="white" stroke="#e2e8f0" stroke-width="1"/>
<text x="38" y="356.0" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155">create_mul</text>
<text x="208" y="346" font-family="monospace" font-size="10.5" fill="#475569">IR 节点 tt.mul，交后端编译成 GPU 指令</text>
<text x="588" y="346" font-family="monospace" font-size="10.5" font-weight="bold" fill="#0f766e">binary_op(..., np.multiply)</text>
<text x="588" y="374" font-family="sans-serif" font-size="9.5" fill="#94a3b8">interpreter.py:L424</text>
<rect x="30" y="384" width="926" height="54" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="38" y="414.0" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155">访存实现</text>
<text x="208" y="404" font-family="monospace" font-size="10.5" fill="#475569">IR 节点 tt.load/tt.store，交后端编译</text>
<text x="588" y="404" font-family="monospace" font-size="10.5" font-weight="bold" fill="#0f766e">create_masked_load/store -&gt; 按地址读写 host 内存</text>
<text x="588" y="432" font-family="sans-serif" font-size="9.5" fill="#94a3b8">interpreter.py:L376-385</text>
<text x="30" y="480" font-family="sans-serif" font-size="11.5" fill="#64748b">同名接口 create_add/create_mul/create_get_program_id/create_masked_load 全套复用，芯子从『建 IR』换成『直接算数值』</text>
</svg>