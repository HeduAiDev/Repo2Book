<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1096 420">
<rect width="1096" height="420" fill="white"/>
<text x="30" y="30" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e40af">ASTTransformer.visit_Assign：核体每条赋值都被套上 to_tensor 张量外套</text>
<text x="30" y="52" font-family="sans-serif" font-size="12" fill="#64748b">visit_Assign@interpreter.py:L1111  →  to_tensor@semantic.py:L111-126</text>
<rect x="30" y="96" width="52" height="34" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1"/>
<text x="56.0" y="117.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="white">#</text>
<rect x="86" y="96" width="296" height="34" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1"/>
<text x="234.0" y="117.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="white">改写前 (BEFORE)</text>
<rect x="386" y="96" width="376" height="34" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1"/>
<text x="574.0" y="117.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="white">改写后 (AFTER)</text>
<rect x="766" y="96" width="296" height="34" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1"/>
<text x="914.0" y="117.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="white">右值发生了什么</text>
<rect x="30" y="130" width="1032" height="42" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="56.0" y="154.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#475569">[0]</text>
<text x="94" y="154.0" font-family="monospace" font-size="11" fill="#334155">pid = tl.program_id(0)</text>
<text x="394" y="154.0" font-family="monospace" font-size="10.5" fill="#0f766e">pid = to_tensor(tl.program_id(0), ib, False)</text>
<text x="774" y="154.0" font-family="sans-serif" font-size="10.5" fill="#334155">program_id 返回值被包一层</text>
<rect x="30" y="176" width="1032" height="42" fill="white" stroke="#e2e8f0" stroke-width="1"/>
<text x="56.0" y="200.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#475569">[1]</text>
<text x="94" y="200.0" font-family="monospace" font-size="11" fill="#334155">offs = pid*BLOCK + tl.arange(0,BLOCK)</text>
<text x="394" y="200.0" font-family="monospace" font-size="10.5" fill="#0f766e">offs = to_tensor(pid*BLOCK+tl.arange(0,BLOCK), ib, False)</text>
<text x="774" y="200.0" font-family="sans-serif" font-size="10.5" fill="#334155">整个偏移表达式被包一层</text>
<rect x="30" y="222" width="1032" height="42" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="56.0" y="246.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#b45309">[2]</text>
<text x="94" y="246.0" font-family="monospace" font-size="11" fill="#334155">c = 2</text>
<text x="394" y="246.0" font-family="monospace" font-size="10.5" fill="#92400e">c = to_tensor(2, ib, False)</text>
<text x="774" y="238.0" font-family="sans-serif" font-size="10.5" fill="#334155">裸标量提升为 int32 张量——最能说明『</text>
<text x="774" y="254.0" font-family="sans-serif" font-size="10.5" fill="#334155">为何不能原样跑 Python』</text>
<rect x="30" y="268" width="1032" height="42" fill="white" stroke="#e2e8f0" stroke-width="1"/>
<text x="56.0" y="292.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#475569">[3]</text>
<text x="94" y="292.0" font-family="monospace" font-size="11" fill="#334155">y = tl.load(x_ptr+offs) * c</text>
<text x="394" y="292.0" font-family="monospace" font-size="10.5" fill="#0f766e">y = to_tensor(tl.load(x_ptr+offs)*c, ib, False)</text>
<text x="774" y="292.0" font-family="sans-serif" font-size="10.5" fill="#334155">读入并乘常量后的结果同样被包一层</text>
<rect x="30" y="314" width="1032" height="42" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="56.0" y="338.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#475569">store</text>
<text x="94" y="338.0" font-family="monospace" font-size="11" fill="#334155">tl.store(y_ptr+offs, y)</text>
<text x="394" y="338.0" font-family="monospace" font-size="10.5" fill="#0f766e">tl.store(y_ptr+offs, y)</text>
<text x="774" y="330.0" font-family="sans-serif" font-size="10.5" fill="#334155">未触碰：ASTTransformer 只改写</text>
<text x="774" y="346.0" font-family="sans-serif" font-size="10.5" fill="#334155"> Assign</text>
<text x="30" y="398" font-family="sans-serif" font-size="11.5" fill="#64748b">4 条赋值 → 恰 4 次 to_tensor 包裹；1 条 store 语句 0 改写（语句总数不变，只做减法不做加法）</text>
</svg>