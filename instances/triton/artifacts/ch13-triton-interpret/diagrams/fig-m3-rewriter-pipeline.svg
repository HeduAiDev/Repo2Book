<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker><marker id="b" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#7c3aed"/></marker></defs>
<rect width="860" height="500" fill="white"/>
<text x="280.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a">FunctionRewriter：从『你的源码文本』到『改写后可调用函数』</text>
<rect x="160.0" y="56" width="240" height="30" rx="15" fill="#22c55e" stroke="#15803d" stroke-width="1.5"/>
<text x="280.0" y="76" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="white">用户 @triton.jit 核源码</text>
<line x1="280.0" y1="86" x2="280.0" y2="90" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="50" y="90" width="460" height="66" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="68" y="114" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e40af">1. 取源码</text>
<text x="68" y="134" font-family="monospace" font-size="11" fill="#334155">inspect.getsourcelines(self.fn)</text>
<text x="68" y="150" font-family="sans-serif" font-size="10" fill="#64748b">interpreter.py:L1143</text>
<line x1="280.0" y1="156" x2="280.0" y2="196" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="50" y="200" width="460" height="66" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="68" y="224" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e40af">2. 定位 def / dedent / 变换</text>
<text x="68" y="244" font-family="monospace" font-size="11" fill="#334155">_find_def -&gt; _prepare_source -&gt; _transform_ast</text>
<text x="68" y="260" font-family="sans-serif" font-size="10" fill="#64748b">interpreter.py:L1154-L1156</text>
<line x1="280.0" y1="266" x2="280.0" y2="306" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="50" y="310" width="460" height="66" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="68" y="334" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e40af">3. compile+exec 落点</text>
<text x="68" y="354" font-family="monospace" font-size="11" fill="#334155">_compile_and_exec 进 fn.__globals__</text>
<text x="68" y="370" font-family="sans-serif" font-size="10" fill="#64748b">interpreter.py:L1187-1195</text>
<line x1="280.0" y1="376" x2="280.0" y2="416" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="140.0" y="416" width="280" height="30" rx="15" fill="#f97316" stroke="#c2410c" stroke-width="1.5"/>
<text x="280.0" y="436" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="white">改写后可调用函数（进 InterpretedFunction）</text>
<line x1="510" y1="233.0" x2="560" y2="233.0" stroke="#7c3aed" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#b)"/>
<rect x="560" y="209.0" width="220" height="48" rx="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.3"/>
<text x="570" y="227.0" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#5b21b6">行号对齐目的</text>
<text x="570" y="243.0" font-family="sans-serif" font-size="10" fill="#4c1d95">报错/断点指回用户源码真实行号</text>
<line x1="510" y1="343.0" x2="560" y2="343.0" stroke="#7c3aed" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#b)"/>
<rect x="560" y="319.0" width="220" height="48" rx="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.3"/>
<text x="570" y="337.0" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#5b21b6">缓存</text>
<text x="570" y="353.0" font-family="sans-serif" font-size="10" fill="#4c1d95">rewritten_fn 类级去重（同函数只改写</text>
<text x="570" y="365.0" font-family="sans-serif" font-size="10" fill="#4c1d95">一次）</text>
</svg>