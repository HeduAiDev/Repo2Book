<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#d97706"/></marker></defs>
<rect width="1000" height="560" fill="white"/>
<text x="40" y="30" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">同一份映射, 两种转置读法(-use-hw-view 切换)</text>
<text x="40" y="58" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e3a8a">tensor 视角:元素 (4,0) 在谁手里?</text>
<rect x="40" y="70" width="430" height="26" rx="6" fill="#eef2ff" stroke="#6366f1"/>
<text x="50" y="88" font-family="sans-serif" font-size="12" fill="#1e3a8a">按 tensor 下标行主序遍历 64 格,印 elementMapping[i]</text>
<rect x="40" y="112" width="430" height="26" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="50" y="128.0" font-family="sans-serif" font-size="12" fill="#334155">行0: </text>
<text x="98" y="128.0" font-family="sans-serif" font-size="12" font-weight="normal" fill="#334155">T0:0 … T7:0</text>
<rect x="40" y="142" width="430" height="26" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="50" y="158.0" font-family="sans-serif" font-size="12" fill="#334155">行1: </text>
<text x="98" y="158.0" font-family="sans-serif" font-size="12" font-weight="normal" fill="#334155">T8:0 … T15:0</text>
<rect x="40" y="172" width="430" height="26" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="50" y="188.0" font-family="sans-serif" font-size="12" fill="#334155">行2: </text>
<text x="98" y="188.0" font-family="sans-serif" font-size="12" font-weight="normal" fill="#334155">T16:0 … T23:0</text>
<rect x="40" y="202" width="430" height="26" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="50" y="218.0" font-family="sans-serif" font-size="12" fill="#334155">行3: </text>
<text x="98" y="218.0" font-family="sans-serif" font-size="12" font-weight="normal" fill="#334155">T24:0 … T31:0</text>
<rect x="40" y="232" width="430" height="26" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="50" y="248.0" font-family="sans-serif" font-size="12" fill="#334155">行4: </text>
<text x="98" y="248.0" font-family="sans-serif" font-size="12" font-weight="bold" fill="#78350f">T32:0 … T39:0</text>
<rect x="40" y="262" width="430" height="26" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="50" y="278.0" font-family="sans-serif" font-size="12" fill="#334155">行5: </text>
<text x="98" y="278.0" font-family="sans-serif" font-size="12" font-weight="normal" fill="#334155">T40:0 … T47:0</text>
<rect x="40" y="292" width="430" height="26" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="50" y="308.0" font-family="sans-serif" font-size="12" fill="#334155">行6: </text>
<text x="98" y="308.0" font-family="sans-serif" font-size="12" font-weight="normal" fill="#334155">T48:0 … T55:0</text>
<rect x="40" y="322" width="430" height="26" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="50" y="338.0" font-family="sans-serif" font-size="12" fill="#334155">行7: </text>
<text x="98" y="338.0" font-family="sans-serif" font-size="12" font-weight="normal" fill="#334155">T56:0 … T63:0</text>
<text x="462" y="248.0" text-anchor="end" font-family="sans-serif" font-size="12" font-weight="bold" fill="#78350f">← 元素(4,0)首格 = T32:0</text>
<text x="530" y="58" font-family="sans-serif" font-size="13" font-weight="bold" fill="#92400e">warp 视角:Warp1 的 32 条 lane 各拿哪个?</text>
<rect x="530" y="70" width="430" height="26" rx="6" fill="#fff7ed" stroke="#ea580c"/>
<text x="540" y="88" font-family="sans-serif" font-size="12" fill="#7c2d12">外层按 Block/Warp 分节,内层印 threadMapping[...]</text>
<rect x="530" y="112" width="430" height="26" rx="5" fill="#dbeafe" stroke="#3b82f6"/>
<text x="540" y="128.0" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a">Warp0: (0,0),(0,1),…,(3,7)  — 32 个坐标, 覆盖 tensor 上半 rows0-3</text>
<rect x="530" y="142" width="430" height="26" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="540" y="158.0" font-family="sans-serif" font-size="12" font-weight="bold" fill="#78350f">Warp1: (4,0),(4,1),…,(7,7)  — 32 个坐标, 覆盖 tensor 下半 rows4-7</text>
<text x="530" y="206" font-family="sans-serif" font-size="12" fill="#7c2d12">Warp1 首坐标 (4,0) — 与左图元素(4,0)→T32 互为逆映射</text>
<line x1="476" y1="237.0" x2="524" y2="237.0" stroke="#d97706" stroke-width="2.2" marker-end="url(#a)"/>
<line x1="524" y1="257.0" x2="476" y2="257.0" stroke="#d97706" stroke-width="2.2" marker-end="url(#a)"/>
<text x="500.0" y="231.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#92400e">互逆</text>
<text x="40" y="398" font-family="sans-serif" font-size="13" fill="#0f172a">同一次四重循环一次性建好 elementMapping 与 threadMapping,两视角只换遍历方向, 不重算 LinearLayout::apply。</text>
</svg>