<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1230 580">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker></defs>
<rect width="1230" height="580" fill="white"/>
<text x="40" y="34" font-family="sans-serif" font-size="16.5" font-weight="bold" fill="#1e40af">整除性分派链:link.py 按 num_specs 降序生成 C 的 if 链(ch14 compute_spec_key 的 C 化身)</text>
<text x="40" y="56" font-family="sans-serif" font-size="12" fill="#64748b">python/triton/tools/link.py —— 2 份特化归入一组 add_1024_warps4xstages3</text>
<rect x="80" y="108" width="640" height="60" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
<text x="400" y="143" text-anchor="middle" font-family="monospace" font-size="12.5" fill="#0f172a">运行期调用:add(stream, X, Y, N)</text>
<line x1="400" y1="168" x2="400" y2="198" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="80" y="198" width="640" height="60" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="400" y="233" text-anchor="middle" font-family="monospace" font-size="12.5" fill="#78350f">if ((N % 16 == 0))  —  特化 012d, num_specs=1(约束最强,最先测)</text>
<line x1="720" y1="228" x2="890" y2="228" stroke="#15803d" stroke-width="2" marker-end="url(#a)"/>
<text x="805" y="218" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#15803d">是 → 命中</text>
<rect x="890" y="201" width="300" height="76" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
<text x="1040" y="223" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#166534">return add_deadbeef_012d(</text>
<text x="1040" y="243" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#166534">  stream, X, Y, N);</text>
<line x1="400" y1="258" x2="400" y2="288" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<text x="416" y="280" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#64748b">否(fallthrough)</text>
<rect x="80" y="288" width="640" height="60" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="400" y="323" text-anchor="middle" font-family="monospace" font-size="12.5" fill="#78350f">if (1)  —  恒真兜底 · 特化 012, num_specs=0</text>
<line x1="720" y1="318" x2="890" y2="318" stroke="#15803d" stroke-width="2" marker-end="url(#a)"/>
<text x="805" y="308" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#15803d">是(恒真)→ 命中</text>
<rect x="890" y="291" width="300" height="76" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
<text x="1040" y="313" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#166534">return add_cafef00d_012(</text>
<text x="1040" y="333" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#166534">  stream, X, Y, N);</text>
<line x1="400" y1="348" x2="400" y2="378" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#a)"/>
<text x="416" y="370" font-family="sans-serif" font-size="11" fill="#94a3b8">否(仅无兜底组时可达)</text>
<rect x="80" y="378" width="640" height="60" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="400" y="413" text-anchor="middle" font-family="monospace" font-size="12.5" fill="#7f1d1d">return CUDA_ERROR_INVALID_VALUE;</text>
<rect x="40" y="472" width="1150" height="68" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
<text x="56" y="496" font-family="sans-serif" font-size="12.5" fill="#1e3a5f">2 份特化(012d / 012)归入同一组 add_1024_warps4xstages3;metas 按 -num_specs 降序排列,</text>
<text x="56" y="520" font-family="sans-serif" font-size="12.5" fill="#1e3a5f">保证约束最强(通常最快)的先测;每条路径必 return,链尾兜底耗尽才报 CUDA_ERROR_INVALID_VALUE。</text>
</svg>