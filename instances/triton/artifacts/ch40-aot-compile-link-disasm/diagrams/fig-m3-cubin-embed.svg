<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 306">
<rect width="1160" height="306" fill="white"/>
<text x="40" y="34" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1e40af">cubin 内嵌:binascii.hexlify 把 GPU 机器码逐字节抄进 C 数组</text>
<text x="40" y="56" font-family="sans-serif" font-size="12" fill="#64748b">python/triton/tools/compile.py:L116-L155 —— 一个 .c 编进 .so 后不再需要 Python 或旁挂 .cubin</text>
<text x="275" y="82" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Python 手里的 cubin(GPU 机器码)</text>
<rect x="40" y="96" width="470" height="150" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="64" y="126" font-family="monospace" font-size="13" font-weight="bold" fill="#0f172a">cubin bytes: 5648 字节</text>
<text x="64" y="154" font-family="sans-serif" font-size="11.5" fill="#475569">数组头 6 字节(ELF 魔数,cubin 本质是 ELF):</text>
<text x="64" y="178" font-family="monospace" font-size="13" fill="#334155">0x7f 0x45 0x4c 0x46 0x02 0x01</text>
<text x="64" y="194" font-family="sans-serif" font-size="10.5" fill="#94a3b8">(0x7f'E''L''F' + 类别 + 端序)</text>
<text x="64" y="224" font-family="sans-serif" font-size="11.5" fill="#475569">triton.compile(...).kernel —— 编译产出的原始字节串</text>
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#d97706"/></marker></defs>
<line x1="510" y1="171" x2="650" y2="171" stroke="#d97706" stroke-width="2.5" marker-end="url(#a)"/>
<text x="580" y="157" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#b45309">binascii.hexlify</text>
<text x="580" y="193" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#78350f">1 字节 → 2 hex 字符</text>
<text x="580" y="211" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#b45309">5648 → 11296</text>
<text x="885" y="82" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">填好的 compile.c(自包含 C 源)</text>
<rect x="650" y="96" width="470" height="150" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="670" y="122" font-family="monospace" font-size="12" font-weight="bold" fill="#78350f">unsigned char CUBIN_NAME[11296] = {</text>
<text x="670" y="146" font-family="monospace" font-size="12" fill="#92400e">  0x7f, 0x45, 0x4c, 0x46, 0x02, 0x01, ...</text>
<text x="670" y="170" font-family="monospace" font-size="12" font-weight="bold" fill="#78350f">};</text>
<text x="670" y="194" font-family="monospace" font-size="12" fill="#166534">cuModuleLoadData(&amp;mod, CUBIN_NAME);  // 内存直读,无需 .cubin 文件</text>
<text x="670" y="218" font-family="monospace" font-size="12" fill="#1d4ed8">cuLaunchKernel(func, 1,1,1, 4*32,1,1, 0, stream, args, NULL);</text>
</svg>