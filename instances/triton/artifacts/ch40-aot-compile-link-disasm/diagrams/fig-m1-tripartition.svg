<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 510">
<rect width="950" height="510" fill="white"/>
<text x="40" y="34" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1e40af">签名三分:一行命令行签名字符串切成 hints / constants / signature 三桶</text>
<text x="40" y="56" font-family="sans-serif" font-size="12" fill="#64748b">python/triton/tools/compile.py:L81-L102 —— AOT 把 JIT 特化钉到命令行的入口</text>
<text x="40" y="86" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#334155">输入(4 段):*fp32:16, i32:16, 1024, i32</text>
<rect x="100" y="120" width="168" height="56" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="184" y="144" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#0f172a">*fp32:16</text>
<text x="184" y="162" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">pos0 · X</text>
<rect x="294" y="120" width="168" height="56" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="378" y="144" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#0f172a">i32:16</text>
<text x="378" y="162" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">pos1 · N</text>
<rect x="488" y="120" width="168" height="56" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="572" y="144" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#0f172a">1024</text>
<text x="572" y="162" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">pos2 · BLOCK</text>
<rect x="682" y="120" width="168" height="56" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="766" y="144" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#0f172a">i32</text>
<text x="766" y="162" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">pos3 · stride</text>
<defs><marker id="a-h" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#b45309"/></marker><marker id="a-c" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#15803d"/></marker><marker id="a-s" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#0369a1"/></marker></defs>
<line x1="184" y1="176" x2="145" y2="272" stroke="#b45309" stroke-width="1.8" stroke-opacity="0.75" marker-end="url(#a-h)"/>
<line x1="184" y1="176" x2="730" y2="272" stroke="#0369a1" stroke-width="1.8" stroke-opacity="0.75" marker-end="url(#a-s)"/>
<line x1="378" y1="176" x2="145" y2="272" stroke="#b45309" stroke-width="1.8" stroke-opacity="0.75" marker-end="url(#a-h)"/>
<line x1="378" y1="176" x2="730" y2="272" stroke="#0369a1" stroke-width="1.8" stroke-opacity="0.75" marker-end="url(#a-s)"/>
<line x1="572" y1="176" x2="400" y2="272" stroke="#15803d" stroke-width="1.8" stroke-opacity="0.75" marker-end="url(#a-c)"/>
<line x1="766" y1="176" x2="730" y2="272" stroke="#0369a1" stroke-width="1.8" stroke-opacity="0.75" marker-end="url(#a-s)"/>
<rect x="40" y="272" width="210" height="74" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="145" y="298" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#78350f">hints(整除性提示)</text>
<text x="145" y="322" text-anchor="middle" font-family="monospace" font-size="12.5" fill="#78350f">{0:16, 1:16}</text>
<rect x="290" y="272" width="220" height="74" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="400" y="298" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#166534">constants(编译期常量)</text>
<text x="400" y="322" text-anchor="middle" font-family="monospace" font-size="12.5" fill="#166534">{BLOCK:1024}</text>
<rect x="550" y="272" width="360" height="74" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
<text x="730" y="298" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0c4a6e">signature(运行期参数)</text>
<text x="730" y="322" text-anchor="middle" font-family="monospace" font-size="12.5" fill="#0c4a6e">{X:*fp32, N:i32, stride:i32}</text>
<text x="40" y="380" font-family="sans-serif" font-size="11.5" fill="#64748b">箭头颜色 = 去向桶(琥珀→hints / 绿→constants / 蓝→signature);同一段可同时有两条箭头(如 pos0 既进 hints 又留在 signature)</text>
<rect x="40" y="402" width="870" height="68" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
<text x="56" y="426" font-family="sans-serif" font-size="12.5" fill="#1e3a5f">constants 与 signature 互斥且共同覆盖被 arg_names 认领的段;hints 是正交的位置索引集,可与 signature 重叠。</text>
<text x="56" y="450" font-family="sans-serif" font-size="12.5" fill="#1e3a5f">本例 4 段 → hints 2 项 + constants 1 项(BLOCK) + signature 3 项(X, N, stride)——BLOCK 从运行期参数中除名。</text>
</svg>