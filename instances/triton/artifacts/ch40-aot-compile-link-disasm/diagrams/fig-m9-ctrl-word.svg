<text x="56" y="466" font-family="sans-serif" font-size="12.5" fill="#1e3a5f">起始位 41/45/46/49/52 加各自宽度恰好首尾相接不交叠,一次 (enc&gt;&gt;shift)&amp;mask 解码互不干扰。</text>
<text x="56" y="490" font-family="sans-serif" font-size="12.5" fill="#1e3a5f">实例 0x002fda000780c0ff → 等待 2 号位屏障、让位(Y)、发射后停 13(0xd)拍——SASS 左列 02:-:-:Y:d 的来历。</text>
