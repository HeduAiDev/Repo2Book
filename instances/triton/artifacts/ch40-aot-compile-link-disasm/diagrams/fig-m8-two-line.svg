<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 370">
<rect width="1280" height="370" fill="white"/>
<text x="40" y="34" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1e40af">SASS 两行格式:cuobjdump 每条指令拆两行,disasm 每次 +2 折叠成一条</text>
<text x="40" y="56" font-family="sans-serif" font-size="12" fill="#64748b">python/triton/tools/disasm.py:L108-L127 —— target=sm_90 实跑取证</text>
<text x="350" y="86" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">cuobjdump -sass 原始输出(两行 = 一条指令)</text>
<rect x="40" y="100" width="620" height="210" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="62" y="130" font-family="monospace" font-size="12.5" font-weight="bold" fill="#0f172a">/*0000*/ LDC R1, c[0x0][0x28] ;  /* 0x00000a00ff017b82 */</text>
<text x="62" y="150" font-family="sans-serif" font-size="10.5" fill="#94a3b8">↑ FLINE:offset + 汇编体 + 首半 64 位编码</text>
<text x="62" y="178" font-family="monospace" font-size="12.5" font-weight="bold" fill="#334155">                              /* 0x000e240000000800 */</text>
<text x="62" y="198" font-family="sans-serif" font-size="10.5" fill="#94a3b8">↑ SLINE:次半 64 位编码(parseCtrl 的输入)</text>
<text x="62" y="230" font-family="monospace" font-size="12.5" fill="#334155">/*0010*/ LDC R4, c[0x0][0x218] ;  /* 0x00008600ff047b82 */</text>
<text x="62" y="252" font-family="monospace" font-size="12.5" fill="#334155">                              /* 0x000e620000000800 */</text>
<text x="62" y="285" font-family="sans-serif" font-size="11.5" fill="#475569">offset 步长 0x10(16 字节)——相邻指令固定间距</text>
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#0369a1"/></marker></defs>
<line x1="660" y1="205" x2="770" y2="205" stroke="#0369a1" stroke-width="2.5" marker-end="url(#a)"/>
<text x="715" y="187" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0369a1">line_idx += 2</text>
<text x="715" y="213" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">每指令读 2 行</text>
<text x="715" y="233" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">共 72 条指令</text>
<text x="1005" y="86" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">折叠成一条 (ctrl, asm)</text>
<rect x="770" y="100" width="470" height="210" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
<text x="1005" y="140" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#0c4a6e">ctrl = --:-:0:-:2</text>
<text x="1005" y="164" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#0369a1">(wait:rd:wr:yield:stall,见 m9 parseCtrl)</text>
<line x1="790" y1="182" x2="1220" y2="182" stroke="#93c5fd" stroke-width="1"/>
<text x="1005" y="212" text-anchor="middle" font-family="monospace" font-size="12.5" fill="#0c4a6e">LDC R1, c[0x0][0x28] ;</text>
<text x="1005" y="250" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#1e3a5f">左列 ctrl 来自 SLINE,右侧 asm 来自 FLINE</text>
<text x="1005" y="280" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#1e3a5f">SASS 左列打印格式的来历</text>
</svg>