<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 932">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker><marker id="ar" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#dc2626"/></marker><marker id="ag" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#15803d"/></marker></defs>
<rect width="720" height="932" fill="white"/>
<text x="360.0" y="40" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1e40af">工具链末端：共用汇编入口，AMD/NVIDIA 分叉两条链</text>
<text x="360.0" y="62" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#64748b">LLVM-IR → translate_to_asm（两后端共用）→ 之后各走各的汇编器/链接器</text>
<rect x="230.0" y="100" width="260" height="56" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="360.0" y="124" text-anchor="middle" font-family="monospace" font-size="13.5" font-weight="bold" fill="#0f172a">LLVM-IR</text>
<text x="360.0" y="142" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">make_llir 产出（第 36/37 章骨架）</text>
<rect x="230.0" y="206" width="260" height="56" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="360.0" y="230" text-anchor="middle" font-family="monospace" font-size="13.5" font-weight="bold" fill="#0f172a">translate_to_asm</text>
<text x="360.0" y="248" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">共用汇编入口（AMD/NVIDIA 各传各的 target triple/arch）</text>
<line x1="360.0" y1="156" x2="360.0" y2="202" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="360.0" y1="262" x2="170.0" y2="348" stroke="#dc2626" stroke-width="1.8" marker-end="url(#ar)"/>
<line x1="360.0" y1="262" x2="550.0" y2="348" stroke="#15803d" stroke-width="1.8" marker-end="url(#ag)"/>
<rect x="206.0" y="276.0" width="78" height="19" rx="4" fill="white" opacity="0.9"/>
<text x="245.0" y="291.0" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#dc2626">AMD 分支</text>
<rect x="419.5" y="276.0" width="111" height="19" rx="4" fill="white" opacity="0.9"/>
<text x="475.0" y="291.0" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#15803d">NVIDIA 分支</text>
<rect x="40.0" y="352" width="260" height="56" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="170.0" y="376" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#0f172a">amdgcn 汇编文本</text>
<rect x="40.0" y="442" width="260" height="56" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="170.0" y="466" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#0f172a">assemble_amdgcn</text>
<text x="170.0" y="484" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#0f172a">AMD 汇编器</text>
<line x1="170.0" y1="408" x2="170.0" y2="438" stroke="#dc2626" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="40.0" y="532" width="260" height="56" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="170.0" y="556" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#0f172a">目标文件字节</text>
<text x="170.0" y="574" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#0f172a">assemble_amdgcn 返回值</text>
<line x1="170.0" y1="498" x2="170.0" y2="528" stroke="#dc2626" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="40.0" y="622" width="260" height="56" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="170.0" y="646" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#0f172a">ld.lld -shared</text>
<text x="170.0" y="664" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#0f172a">AMD 链接器</text>
<line x1="170.0" y1="588" x2="170.0" y2="618" stroke="#dc2626" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="40.0" y="712" width="260" height="56" rx="8" fill="#dc2626" stroke="#dc2626" stroke-width="2.5"/>
<text x="170.0" y="736" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="white">hsaco</text>
<text x="170.0" y="754" text-anchor="middle" font-family="sans-serif" font-size="10" fill="white">最终产物（ELF 共享对象）</text>
<line x1="170.0" y1="678" x2="170.0" y2="708" stroke="#dc2626" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="420.0" y="352" width="260" height="56" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="550.0" y="376" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#0f172a">PTX 文本</text>
<rect x="420.0" y="442" width="260" height="56" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="550.0" y="466" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#0f172a">ptxas</text>
<text x="550.0" y="484" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#0f172a">NVIDIA 汇编器（出 cubin）</text>
<line x1="550.0" y1="408" x2="550.0" y2="438" stroke="#15803d" stroke-width="1.5" marker-end="url(#ag)"/>
<rect x="420.0" y="532" width="260" height="56" rx="8" fill="#15803d" stroke="#15803d" stroke-width="2.5"/>
<text x="550.0" y="556" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="white">cubin</text>
<text x="550.0" y="574" text-anchor="middle" font-family="sans-serif" font-size="10" fill="white">最终产物</text>
<line x1="550.0" y1="498" x2="550.0" y2="528" stroke="#15803d" stroke-width="1.5" marker-end="url(#ag)"/>
<text x="40" y="858" font-family="sans-serif" font-size="10.8" fill="#64748b">translate_to_asm 是两后端共用的汇编入口：third_party/amd/backend/compiler.py:L338，</text>
<text x="40" y="874" font-family="sans-serif" font-size="10.8" fill="#64748b">third_party/nvidia/backend/compiler.py:L324。</text>
<text x="40" y="890" font-family="sans-serif" font-size="10.8" fill="#64748b">AMD：assemble_amdgcn（L346）→ ld.lld -flavor gnu -shared（L353）出 hsaco；</text>
<text x="40" y="906" font-family="sans-serif" font-size="10.8" fill="#64748b">NVIDIA：ptxas（L341-353）直接出 cubin。</text>
</svg>