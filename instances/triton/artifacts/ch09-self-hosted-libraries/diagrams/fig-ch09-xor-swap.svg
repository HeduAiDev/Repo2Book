<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 482">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker></defs>
<rect width="800" height="482" fill="white"/>
<text x="40" y="40" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e40af">无分支异或交换:一条 select 取代 if</text>
<text x="40" y="60" font-family="sans-serif" font-size="12" fill="#64748b">standard.py:L334-L339;delta 恒 = left^right,cond 只决定异或 delta 还是异或 0</text>
<text x="200.0" y="110" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">cond=真 (left=3 &gt; right=1)</text>
<rect x="70.0" y="140" width="260" height="44" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
<text x="200.0" y="167.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0f172a">left=3, right=1</text>
<line x1="200.0" y1="184" x2="200.0" y2="202" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="70.0" y="206" width="260" height="44" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
<text x="200.0" y="233.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0f172a">delta = left^right = 2</text>
<line x1="200.0" y1="250" x2="200.0" y2="268" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="70.0" y="272" width="260" height="44" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
<text x="200.0" y="299.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0f172a">out = left^(cond?delta:0)</text>
<line x1="200.0" y1="316" x2="200.0" y2="334" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="70.0" y="338" width="260" height="44" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="200.0" y="365.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0f172a">out_left=1, out_right=3</text>
<text x="600.0" y="110" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">cond=假 (left=1 &lt; right=3)</text>
<rect x="470.0" y="140" width="260" height="44" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
<text x="600.0" y="167.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0f172a">left=1, right=3</text>
<line x1="600.0" y1="184" x2="600.0" y2="202" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="470.0" y="206" width="260" height="44" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
<text x="600.0" y="233.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0f172a">delta = left^right = 2</text>
<line x1="600.0" y1="250" x2="600.0" y2="268" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="470.0" y="272" width="260" height="44" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
<text x="600.0" y="299.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0f172a">out = left^(cond?delta:0)</text>
<line x1="600.0" y1="316" x2="600.0" y2="334" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="470.0" y="338" width="260" height="44" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="600.0" y="365.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0f172a">out_left=1, out_right=3</text>
<line x1="368" y1="261.0" x2="428" y2="261.0" stroke="#d97706" stroke-width="2.5" marker-end="url(#a)"/>
<text x="400" y="251.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#d97706">同一条公式</text>
<text x="40" y="452" font-family="sans-serif" font-size="11" fill="#64748b">两侧 delta 都 = 3^1 = 2;真则异或 delta 完成互换,假则异或 0 原样保持——全程无 if</text>
<text x="40" y="470" font-family="sans-serif" font-size="11" fill="#64748b">IR 里一次 CAS = select:cmpf:xori = 1:1:2(实测 n=16 时 10:10:20)——1 个 select 顶 1 个 if</text>
</svg>