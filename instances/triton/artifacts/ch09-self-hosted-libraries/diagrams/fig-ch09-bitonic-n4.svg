<text x="40" y="226" font-family="sans-serif" font-size="11" fill="#64748b">红=本次 CAS 改变的位置;每次调用只由块长(编译期常量)决定谁跟谁比,与数值无关</text>
<text x="40" y="244" font-family="sans-serif" font-size="11" fill="#64748b">3 次调用后 [3,1,2,0] -&gt; [0,1,2,3];调用数 = n_dims(n_dims+1)/2 = 2x3/2 = 3</text>
