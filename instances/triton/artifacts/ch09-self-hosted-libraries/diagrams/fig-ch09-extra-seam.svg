<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker></defs>
<rect width="1100" height="560" fill="white"/>
<text x="40" y="40" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e40af">extra/ 是后端插座:pkgutil 动态发现子包,零硬编码</text>
<text x="40" y="60" font-family="sans-serif" font-size="12" fill="#64748b">python/triton/language/extra/__init__.py:L11,L15</text>
<rect x="340.0" y="110" width="420" height="54" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
<text x="550.0" y="142.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0f172a">import triton.language.extra</text>
<line x1="550.0" y1="164" x2="550.0" y2="200" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="340.0" y="204" width="420" height="54" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
<text x="550.0" y="236.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0f172a">pkgutil.iter_modules(__path__) 逐个子模块</text>
<line x1="550.0" y1="258" x2="550.0" y2="294" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<polygon points="550.0,298 650.0,333.0 550.0,368 450.0,333.0" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="550.0" y="329.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">is_pkg?</text>
<text x="550.0" y="347.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">(子包 vs .py 文件)</text>
<rect x="130.0" y="408" width="320" height="70" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="290.0" y="438" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#047857">是(如 cuda/hip)</text>
<text x="290.0" y="458" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">import 并塞进 sys.modules</text>
<rect x="650.0" y="408" width="320" height="70" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="810.0" y="438" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#b91c1c">否(如 libdevice.py)</text>
<text x="810.0" y="458" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">跳过,不收进模块表</text>
<path d="M450.0,333.0 L290.0,404" stroke="#047857" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<path d="M650.0,333.0 L810.0,404" stroke="#b91c1c" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="40" y="508" font-family="sans-serif" font-size="11" fill="#64748b">上游零硬编码后端列表——姊妹篇 triton-ascend 就在这个 extra/ 接缝挂自己的 libdevice 入口</text>
</svg>