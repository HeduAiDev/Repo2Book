<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 436">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker></defs>
<rect width="1400" height="436" fill="white"/>
<text x="40" y="26" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a">swizzle 参数由目标 mma 指令反推,不是自由填的</text>
<rect x="420.0" y="46" width="560" height="60" rx="10" fill="#0f172a" stroke="#334155"/>
<text x="700.0" y="72" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="white">SharedEncodingAttr::get(dotOpEnc, shape, order, ...)</text>
<text x="700.0" y="92" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#94a3b8">按 dotOpEnc.getParent() 类型分派(TritonGPUAttrDefs.td:L274-L409)</text>
<path d="M 700.0 106 L 700.0 122 L 190.0 180 L 190.0 196" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="95.0" y="140.0" width="190" height="20" rx="4" fill="white" stroke="#cbd5e1"/>
<text x="190.0" y="155.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">parent = AMD MFMA</text>
<rect x="40.0" y="196" width="300" height="130" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
<text x="190.0" y="220" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e3a5f">AMD MFMA 分支</text>
<text x="190.0" y="240" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#1e3a5f">numBanks=32 / bankBitWidth=32 / SIMDWidth=16</text>
<text x="190.0" y="255" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#1e3a5f">输入:fp16, K=32, kWidth=4</text>
<rect x="50.0" y="280" width="280" height="36" rx="6" fill="#3b82f6"/>
<text x="190.0" y="295" text-anchor="middle" font-family="monospace" font-size="10.5" font-weight="bold" fill="white">(vec, perPhase, maxPhase)</text>
<text x="190.0" y="311" text-anchor="middle" font-family="monospace" font-size="10.5" font-weight="bold" fill="white">= (4, 2, 8)</text>
<text x="190.0" y="342" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#94a3b8">TritonGPUAttrDefs.td:L288-L299</text>
<path d="M 700.0 106 L 700.0 122 L 530.0 180 L 530.0 196" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="435.0" y="140.0" width="190" height="20" rx="4" fill="white" stroke="#cbd5e1"/>
<text x="530.0" y="155.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">parent = NVIDIA Ampere</text>
<rect x="380.0" y="196" width="300" height="130" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
<text x="530.0" y="220" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e3a5f">NVIDIA Ampere 分支</text>
<text x="530.0" y="240" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#1e3a5f">matShape = {8, 8, 4·kWidth}(mma.sync 一条指令的 M,N,K)</text>
<text x="530.0" y="255" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#1e3a5f">输入:fp16, inner=32, kWidth=2, opA</text>
<rect x="390.0" y="280" width="280" height="36" rx="6" fill="#3b82f6"/>
<text x="530.0" y="295" text-anchor="middle" font-family="monospace" font-size="10.5" font-weight="bold" fill="white">(vec, perPhase, maxPhase)</text>
<text x="530.0" y="311" text-anchor="middle" font-family="monospace" font-size="10.5" font-weight="bold" fill="white">= (8, 2, 4)</text>
<text x="530.0" y="342" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#94a3b8">TritonGPUAttrDefs.td:L366-L380</text>
<path d="M 700.0 106 L 700.0 122 L 870.0 180 L 870.0 196" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="775.0" y="140.0" width="190" height="20" rx="4" fill="white" stroke="#cbd5e1"/>
<text x="870.0" y="155.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">order[0] != kDim</text>
<rect x="720.0" y="196" width="300" height="130" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2" stroke-dasharray="6,4"/>
<text x="870.0" y="220" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#334155">K 维不在最内圈(任意 parent)</text>
<text x="870.0" y="240" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">天然不同 bank,无需摊开</text>
<text x="870.0" y="255" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">'accesses go in different banks even without swizzling'</text>
<rect x="730.0" y="280" width="280" height="36" rx="6" fill="#e2e8f0"/>
<text x="870.0" y="295" text-anchor="middle" font-family="monospace" font-size="10.5" font-weight="bold" fill="#334155">(vec, perPhase, maxPhase)</text>
<text x="870.0" y="311" text-anchor="middle" font-family="monospace" font-size="10.5" font-weight="bold" fill="#334155">= (1, 1, 1) 不 swizzle</text>
<text x="870.0" y="342" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#94a3b8">TritonGPUAttrDefs.td:L306-L310</text>
<path d="M 700.0 106 L 700.0 122 L 1210.0 180 L 1210.0 196" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="1115.0" y="140.0" width="190" height="20" rx="4" fill="white" stroke="#cbd5e1"/>
<text x="1210.0" y="155.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">parent = NVIDIA Hopper</text>
<rect x="1060.0" y="196" width="300" height="130" rx="10" fill="#ffedd5" stroke="#f97316" stroke-width="2" stroke-dasharray="6,4"/>
<text x="1210.0" y="220" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#7c2d12">NVIDIA Hopper(MMAv3)分支</text>
<text x="1210.0" y="240" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#7c2d12">此 builder 内 llvm_unreachable</text>
<text x="1210.0" y="255" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#7c2d12">改走 by-eltTy builder(另一套三档 + hasLeadingOffset)</text>
<rect x="1070.0" y="280" width="280" height="36" rx="6" fill="#f97316"/>
<text x="1210.0" y="295" text-anchor="middle" font-family="monospace" font-size="10.5" font-weight="bold" fill="white">→ by-eltTy builder</text>
<text x="1210.0" y="311" text-anchor="middle" font-family="monospace" font-size="10.5" font-weight="bold" fill="white">(非本分支产出)</text>
<text x="1210.0" y="342" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#94a3b8">TritonGPUAttrDefs.td:L401-L405</text>
<rect x="40" y="402" width="14" height="14" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
<text x="60" y="414" font-family="sans-serif" font-size="11" fill="#334155">反推公式(读 mma tile / 硬件常量算参数)</text>
<rect x="269.6" y="402" width="14" height="14" rx="3" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="289.6" y="414" font-family="sans-serif" font-size="11" fill="#334155">守卫分支(K 不在最内圈→不 swizzle)</text>
<rect x="479.4" y="402" width="14" height="14" rx="3" fill="#ffedd5" stroke="#f97316" stroke-width="2"/>
<text x="499.4" y="414" font-family="sans-serif" font-size="11" fill="#334155">逃逸分支(转到另一 builder)</text>
</svg>