<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1072 436">
<rect width="1072" height="436" fill="white"/>
<text x="36" y="30" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a">TritonGPUAttrDefs.td 五个 swizzle 手算例子——逐格 bit-exact 复现</text>
<text x="36" y="50" font-family="monospace" font-size="11" fill="#64748b">phase(r) = floor(r / perPhase) mod maxPhase ; out[r][c] = in[r][(floor(c/vec) xor phase(r))*vec + c%vec]</text>
<rect x="166" y="90" width="184" height="40" rx="4" fill="#3b82f6" stroke="#1e3a5f"/>
<text x="258.0" y="114.0" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="white">(vec, perPhase, maxPhase)</text>
<rect x="356" y="90" width="184" height="40" rx="4" fill="#3b82f6" stroke="#1e3a5f"/>
<text x="448.0" y="114.0" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="white">phase(r) 序列</text>
<rect x="546" y="90" width="164" height="40" rx="4" fill="#3b82f6" stroke="#1e3a5f"/>
<text x="628.0" y="114.0" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="white">row 0(逻辑值)</text>
<rect x="716" y="90" width="224" height="40" rx="4" fill="#3b82f6" stroke="#1e3a5f"/>
<text x="828.0" y="114.0" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="white">row 1(逻辑值,swizzle 后)</text>
<rect x="946" y="90" width="84" height="40" rx="4" fill="#3b82f6" stroke="#1e3a5f"/>
<text x="988.0" y="114.0" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="white">bit-exact?</text>
<rect x="36" y="130" width="1000" height="42" rx="4" fill="#f8fafc"/>
<text x="48" y="155.0" font-family="sans-serif" font-size="13" font-weight="bold" fill="#334155">例 1 基础</text>
<text x="258.0" y="155.0" text-anchor="middle" font-family="monospace" font-size="11" fill="#334155">(1, 1, 4)</text>
<text x="448.0" y="155.0" text-anchor="middle" font-family="monospace" font-size="11" fill="#334155">[0,1,2,3]</text>
<text x="628.0" y="155.0" text-anchor="middle" font-family="monospace" font-size="11" fill="#334155">[0,1,2,3]</text>
<text x="828.0" y="155.0" text-anchor="middle" font-family="monospace" font-size="11" fill="#334155">[5,4,7,6]</text>
<text x="988.0" y="157.0" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#16a34a">是</text>
<rect x="36" y="176" width="1000" height="42" rx="4" fill="#dbeafe"/>
<text x="48" y="201.0" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1d4ed8">例 2 perPhase=2</text>
<text x="258.0" y="201.0" text-anchor="middle" font-family="monospace" font-size="11" fill="#1d4ed8">(1, 2, 4)</text>
<text x="448.0" y="201.0" text-anchor="middle" font-family="monospace" font-size="11" fill="#1d4ed8">[0,0,1,1]</text>
<text x="628.0" y="201.0" text-anchor="middle" font-family="monospace" font-size="11" fill="#1d4ed8">[0,1,2,3]</text>
<text x="828.0" y="201.0" text-anchor="middle" font-family="monospace" font-size="11" fill="#1d4ed8">[4,5,6,7]</text>
<text x="988.0" y="203.0" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#16a34a">是</text>
<rect x="36" y="222" width="1000" height="42" rx="4" fill="#dcfce7"/>
<text x="48" y="247.0" font-family="sans-serif" font-size="13" font-weight="bold" fill="#166534">例 3 maxPhase=2</text>
<text x="258.0" y="247.0" text-anchor="middle" font-family="monospace" font-size="11" fill="#166534">(1, 1, 2)</text>
<text x="448.0" y="247.0" text-anchor="middle" font-family="monospace" font-size="11" fill="#166534">[0,1,0,1,0,1,0,1]</text>
<text x="628.0" y="247.0" text-anchor="middle" font-family="monospace" font-size="11" fill="#166534">[0,1,2,3]</text>
<text x="828.0" y="247.0" text-anchor="middle" font-family="monospace" font-size="11" fill="#166534">[5,4,7,6]</text>
<text x="988.0" y="249.0" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#16a34a">是</text>
<rect x="36" y="268" width="1000" height="42" rx="4" fill="#fef3c7"/>
<text x="48" y="293.0" font-family="sans-serif" font-size="13" font-weight="bold" fill="#92400e">例 4 per+max</text>
<text x="258.0" y="293.0" text-anchor="middle" font-family="monospace" font-size="11" fill="#92400e">(1, 2, 2)</text>
<text x="448.0" y="293.0" text-anchor="middle" font-family="monospace" font-size="11" fill="#92400e">[0,0,1,1,0,0,1,1]</text>
<text x="628.0" y="293.0" text-anchor="middle" font-family="monospace" font-size="11" fill="#92400e">[0,1,2,3]</text>
<text x="828.0" y="293.0" text-anchor="middle" font-family="monospace" font-size="11" fill="#92400e">[4,5,6,7]</text>
<text x="988.0" y="295.0" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#16a34a">是</text>
<rect x="36" y="314" width="1000" height="42" rx="4" fill="#ede9fe"/>
<text x="48" y="339.0" font-family="sans-serif" font-size="13" font-weight="bold" fill="#5b21b6">例 5 vec=2</text>
<text x="258.0" y="339.0" text-anchor="middle" font-family="monospace" font-size="11" fill="#5b21b6">(2, 1, 4)</text>
<text x="448.0" y="339.0" text-anchor="middle" font-family="monospace" font-size="11" fill="#5b21b6">[0,1,2,3]</text>
<text x="628.0" y="339.0" text-anchor="middle" font-family="monospace" font-size="11" fill="#5b21b6">[0,1,2,3,4,5,6,7]</text>
<text x="828.0" y="339.0" text-anchor="middle" font-family="monospace" font-size="11" fill="#5b21b6">[10,11,8,9,14,15,12,13]</text>
<text x="988.0" y="341.0" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#16a34a">是</text>
<text x="36" y="374" font-family="sans-serif" font-size="11" fill="#64748b">行色 = 相对例 1 新拧了哪个旋钮:</text>
<rect x="226" y="364" width="14" height="14" rx="3" fill="#f8fafc" stroke="#334155"/>
<text x="246" y="376" font-family="sans-serif" font-size="11" fill="#334155">例 1:基线</text>
<rect x="340" y="364" width="14" height="14" rx="3" fill="#dbeafe" stroke="#1d4ed8"/>
<text x="360" y="376" font-family="sans-serif" font-size="11" fill="#334155">拧 perPhase</text>
<rect x="498" y="364" width="14" height="14" rx="3" fill="#dcfce7" stroke="#166534"/>
<text x="518" y="376" font-family="sans-serif" font-size="11" fill="#334155">拧 maxPhase</text>
<rect x="656" y="364" width="14" height="14" rx="3" fill="#fef3c7" stroke="#92400e"/>
<text x="676" y="376" font-family="sans-serif" font-size="11" fill="#334155">两者都拧</text>
<rect x="748" y="364" width="14" height="14" rx="3" fill="#ede9fe" stroke="#5b21b6"/>
<text x="768" y="376" font-family="sans-serif" font-size="11" fill="#334155">拧 vec</text>
</svg>