<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 492">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker></defs>
<rect width="970" height="492" fill="white"/>
<rect x="40" y="14" width="890" height="44" rx="8" fill="#fef9c3" stroke="#ca8a04"/>
<text x="485.0" y="32" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#854d0e">register_triton_hook() 一次性动作:类级属性赋值,对全体已编译 kernel 立即生效</text>
<text x="485.0" y="49" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a16207">钩子槽位默认值 = None(python/triton/compiler/compiler.py:L343-L348) —— 未注册时零调用</text>
<rect x="20" y="104" width="180" height="40" rx="6" fill="#e2e8f0" stroke="#64748b"/>
<text x="110" y="120" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">调用方</text>
<text x="110" y="136" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">kernel.run()</text>
<line x1="110" y1="144" x2="110" y2="432" stroke="#94a3b8" stroke-dasharray="4,4"/>
<rect x="270" y="104" width="180" height="40" rx="6" fill="#e2e8f0" stroke="#64748b"/>
<text x="360" y="120" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">launch_enter_hook</text>
<text x="360" y="136" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">(类级钩子槽位)</text>
<line x1="360" y1="144" x2="360" y2="432" stroke="#94a3b8" stroke-dasharray="4,4"/>
<rect x="520" y="104" width="180" height="40" rx="6" fill="#e2e8f0" stroke="#64748b"/>
<text x="610" y="120" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">cuLaunchKernel</text>
<text x="610" y="136" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">(发射,见第37章)</text>
<line x1="610" y1="144" x2="610" y2="432" stroke="#94a3b8" stroke-dasharray="4,4"/>
<rect x="770" y="104" width="180" height="40" rx="6" fill="#e2e8f0" stroke="#64748b"/>
<text x="860" y="120" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">launch_exit_hook</text>
<text x="860" y="136" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">(类级钩子槽位)</text>
<line x1="860" y1="144" x2="860" y2="432" stroke="#94a3b8" stroke-dasharray="4,4"/>
<line x1="110" y1="198" x2="360" y2="198" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="120.0" y="174" width="230" height="20" rx="4" fill="white"/>
<text x="235.0" y="189" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1d4ed8">① enter_hook(metadata)</text>
<line x1="360" y1="266" x2="610" y2="266" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="370.0" y="242" width="230" height="20" rx="4" fill="white"/>
<text x="485.0" y="257" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1d4ed8">放行:发射真正开始</text>
<line x1="610" y1="334" x2="860" y2="334" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="620.0" y="310" width="230" height="20" rx="4" fill="white"/>
<text x="735.0" y="325" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1d4ed8">② exit_hook(metadata)</text>
<text x="40" y="458" font-family="sans-serif" font-size="11.5" fill="#64748b">每次发射恰好 2 次钩子回调(enter + exit)——发射器把 enter_hook/exit_hook 透传给 self.run(python/triton/compiler/compiler.py:L421-L423)。</text>
</svg>