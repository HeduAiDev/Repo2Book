<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 534">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker></defs>
<rect width="1450" height="534" fill="white"/>
<text x="40" y="34" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e40af">do_bench 五段计时协议</text>
<text x="40" y="54" font-family="sans-serif" font-size="12" fill="#64748b">python/triton/testing.py —— 默认 warmup=25ms / rep=100ms(L95)</text>
<rect x="40" y="72" width="1370" height="66" rx="8" fill="#fef9c3" stroke="#ca8a04"/>
<text x="56" y="96" font-family="sans-serif" font-size="12" font-weight="bold" fill="#854d0e">默认 warmup/rep 预算 = 25ms / 100ms;估时循环 = 5 次;L2 冲刷缓冲 = 256MB int 数组(device=cuda)</text>
<text x="56" y="118" font-family="sans-serif" font-size="11" fill="#a16207">estimate=0.2ms 时:n_warmup=125,n_repeat=500(python/triton/testing.py:L134-L135)——快 kernel 自动多测摊平抖动。</text>
<rect x="40" y="190" width="250" height="84" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
<text x="165.0" y="212" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#0c4a6e">① 触发编译</text>
<text x="165.0" y="232" text-anchor="middle" font-family="sans-serif" font-size="10.8" fill="#0c4a6e">fn() + di.synchronize()</text>
<text x="165.0" y="250" text-anchor="middle" font-family="sans-serif" font-size="10.8" fill="#0c4a6e">JIT 编译 + 懒初始化(不计时)</text>
<rect x="320" y="190" width="250" height="84" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
<text x="445.0" y="212" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#0c4a6e">② 估时</text>
<text x="445.0" y="232" text-anchor="middle" font-family="sans-serif" font-size="10.8" fill="#0c4a6e">跑 5 次(elapsed/5)</text>
<text x="445.0" y="250" text-anchor="middle" font-family="sans-serif" font-size="10.8" fill="#0c4a6e">得 estimate_ms(testing.py:L131)</text>
<rect x="600" y="190" width="250" height="84" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
<text x="725.0" y="212" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#0c4a6e">③ 定次数</text>
<text x="725.0" y="232" text-anchor="middle" font-family="sans-serif" font-size="10.8" fill="#0c4a6e">n_warmup=max(1,⌊25/est⌋)</text>
<text x="725.0" y="250" text-anchor="middle" font-family="sans-serif" font-size="10.8" fill="#0c4a6e">n_repeat=max(1,⌊100/est⌋)</text>
<rect x="880" y="190" width="250" height="84" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
<text x="1005.0" y="212" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#0c4a6e">④ 预热</text>
<text x="1005.0" y="232" text-anchor="middle" font-family="sans-serif" font-size="10.8" fill="#0c4a6e">跑 n_warmup 次</text>
<text x="1005.0" y="250" text-anchor="middle" font-family="sans-serif" font-size="10.8" fill="#0c4a6e">进稳态,不计时</text>
<rect x="1160" y="190" width="250" height="84" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
<text x="1285.0" y="212" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#14532d">⑤ 正式计时</text>
<text x="1285.0" y="232" text-anchor="middle" font-family="sans-serif" font-size="10.8" fill="#14532d">每轮 cache.zero_() 冲 L2</text>
<text x="1285.0" y="250" text-anchor="middle" font-family="sans-serif" font-size="10.8" fill="#14532d">→ 该轮专属 CUDA event 打点</text>
<line x1="290" y1="232.0" x2="320" y2="232.0" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<line x1="570" y1="232.0" x2="600" y2="232.0" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<line x1="850" y1="232.0" x2="880" y2="232.0" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<line x1="1130" y1="232.0" x2="1160" y2="232.0" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<path d="M 1240.0,274 C 1230.0,329 1340.0,329 1330.0,274" fill="none" stroke="#15803d" stroke-width="1.8" marker-end="url(#a)"/>
<text x="1285.0" y="349" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#15803d">循环 n_repeat 次</text>
<text x="40" y="474" font-family="sans-serif" font-size="11.5" fill="#64748b">循环结束后一次 synchronize 批量读回各段耗时;CUDA event 是 GPU 端时间戳,避开 host-device 同步误差(driver.py:L480-L481 给出 L2 冲刷缓冲大小)。</text>
<text x="40" y="496" font-family="sans-serif" font-size="11.5" fill="#64748b">第一段(触发编译)与第二段(估时)不进最终统计;真正的计时只发生在第五段。</text>
</svg>