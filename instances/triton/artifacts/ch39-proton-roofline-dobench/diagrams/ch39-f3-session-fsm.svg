<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 502">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker></defs>
<rect width="1150" height="502" fill="white"/>
<text x="50" y="34" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e40af">proton 会话生命线</text>
<text x="50" y="54" font-family="sans-serif" font-size="12" fill="#64748b">状态迁移: start → activate/deactivate → finalize (third_party/proton/proton/profile.py:L33-L140)</text>
<rect x="50" y="130" width="250" height="66" rx="22" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
<text x="175.0" y="159.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0c4a6e">未启动</text>
<text x="175.0" y="177.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0c4a6e">(profiling_on=False)</text>
<rect x="450" y="130" width="250" height="66" rx="22" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
<text x="575.0" y="159.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0c4a6e">已启动</text>
<text x="575.0" y="177.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0c4a6e">(profiling_on=True)</text>
<rect x="850" y="130" width="250" height="66" rx="22" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
<text x="975.0" y="159.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0c4a6e">已终结</text>
<text x="975.0" y="177.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0c4a6e">(FINALIZED)</text>
<rect x="450" y="346" width="250" height="66" rx="22" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="575.0" y="375.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#78350f">activate/deactivate</text>
<text x="575.0" y="393.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#78350f">中间态</text>
<line x1="300" y1="163.0" x2="450" y2="163.0" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<text x="375.0" y="123.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1d4ed8">start(hook='triton')</text>
<text x="375.0" y="136.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">set_profiling_on → register_triton_hook</text>
<text x="375.0" y="149.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">→ libproton.start</text>
<line x1="700" y1="163.0" x2="850" y2="163.0" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<text x="775.0" y="123.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1d4ed8">finalize(None)</text>
<text x="775.0" y="136.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">finalize_all('hatchet') 写盘</text>
<text x="775.0" y="149.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">→ unregister_triton_hook</text>
<line x1="520.0" y1="196" x2="520.0" y2="346" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="630.0" y1="346" x2="630.0" y2="196" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<text x="510.0" y="267.0" text-anchor="end" font-family="sans-serif" font-size="11" fill="#334155">activate()/deactivate()
切换本 session 记录开关</text>
<text x="640.0" y="267.0" font-family="sans-serif" font-size="11" fill="#334155">返回已启动状态</text>
<text x="975.0" y="224" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#64748b">finalize 默认输出格式 = hatchet</text>
<text x="975.0" y="241" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#94a3b8">(third_party/proton/proton/profile.py:L120)</text>
<text x="50" y="488" font-family="sans-serif" font-size="11.5" fill="#64748b">落盘的 hatchet json 正是 roofline viewer 的输入。</text>
</svg>