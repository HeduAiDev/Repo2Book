<text x="30" y="608" font-family="sans-serif" font-size="11.5" fill="#64748b">add() 只把 (metadata_fn, args) 压进 extras 列表(python/triton/compiler/compiler.py:L326-L328)——只登记不执行,真正调用推迟到钩子 enter。</text>
