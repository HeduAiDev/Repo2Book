<text x="60" y="474" font-family="sans-serif" font-size="12" font-weight="bold" fill="#92400e">⚠ 以上数字均为论文/厂商自报,未独立复现:</text>
<text x="60" y="496" font-family="sans-serif" font-size="11.5" fill="#92400e">Input->KV 注入把 tau 从 3.5 抬到 4.2、eta 从 2.9x 抬到 3.3x(Table 9 消融,两变量各自有效可叠加);</text>
<text x="60" y="516" font-family="sans-serif" font-size="11.5" fill="#92400e">裸块扩散无 target 条件卡在约 3x 天花板(论文用词 approximately 3x,约数,未精确复现)。</text>
