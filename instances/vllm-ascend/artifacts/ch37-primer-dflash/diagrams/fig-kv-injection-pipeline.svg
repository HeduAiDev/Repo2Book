<text x="342.0" y="173.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">+ RMSNorm</text>
<text x="342.0" y="222" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">共享投影矩阵</text>
<text x="342.0" y="237" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">W_c: D x 5D</text>
<line x1="426" y1="167.0" x2="472" y2="167.0" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="472" y="130" width="168" height="74" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
<text x="556.0" y="165.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">H_t</text>
<text x="556.0" y="222" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">融合后的</text>
<text x="556.0" y="237" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">target 条件向量</text>
<line x1="640" y1="167.0" x2="686" y2="167.0" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="686" y="130" width="168" height="74" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
<text x="770.0" y="157.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">一次融合 GEMM</text>
<text x="770.0" y="173.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">出全层 K/V</text>
<text x="770.0" y="222" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">权重形状 [32, 8]</text>
<text x="770.0" y="237" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">数值差 0.0(与逐层等价)</text>
<line x1="854" y1="167.0" x2="900" y2="167.0" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="900" y="130" width="168" height="74" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
<text x="984.0" y="157.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">layer-major</text>
<text x="984.0" y="173.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">[2,L,ctx,nkv,hd]</text>
<text x="984.0" y="222" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">逐层切片</text>
<text x="984.0" y="237" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">天然 contiguous</text>
<line x1="1068" y1="167.0" x2="1114" y2="167.0" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="1114" y="130" width="168" height="74" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
<text x="1198.0" y="157.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">逐层写入</text>
<text x="1198.0" y="173.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">draft KV cache</text>
<text x="1198.0" y="222" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">每层 attention</text>
<text x="1198.0" y="237" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">直接复用,不重算</text>
<text x="128.0" y="116" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#94a3b8">1</text>
<text x="342.0" y="116" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#94a3b8">2</text>
<text x="556.0" y="116" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#94a3b8">3</text>
<text x="770.0" y="116" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#94a3b8">4</text>
<text x="984.0" y="116" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#94a3b8">5</text>
<text x="1198.0" y="116" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#94a3b8">6</text>
<text x="44" y="282" font-family="sans-serif" font-size="11.5" fill="#334155">融合与逐层数值差 0.0(max|K_融合 - K_逐层|)——融合 GEMM 只省 kernel 启动,不改数值。</text>
<text x="44" y="302" font-family="sans-serif" font-size="11.5" fill="#334155">换掉 target 特征后 draft 层输出变化 0.2289——证明这份注入的条件确实在起作用,不是摆设。</text>
</svg>