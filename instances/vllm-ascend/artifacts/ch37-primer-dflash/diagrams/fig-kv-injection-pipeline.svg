<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1326 354">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker></defs>
<rect width="1326" height="354" fill="white"/>
<text x="663.0" y="34" text-anchor="middle" font-family="sans-serif" font-size="15.5" font-weight="bold" fill="#0f172a">target 隐藏态一次融合投影出全层 K/V,逐层写进 draft 每层的 KV cache</text>
<text x="663.0" y="58" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">选定 target 层数 L=5(浅到深均匀采样)——不是只喂输入层,而是喂进 draft 每一层的注意力</text>
<rect x="44" y="130" width="168" height="74" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
<text x="128.0" y="165.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">H^(l1)..H^(l5)</text>
<text x="128.0" y="222" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">target 5 个选定层</text>
<text x="128.0" y="237" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">的隐藏态</text>
<line x1="212" y1="167.0" x2="258" y2="167.0" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
