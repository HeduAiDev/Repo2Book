<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 520">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker></defs>
<rect width="1180" height="520" fill="white"/>
<text x="590.0" y="34" text-anchor="middle" font-family="sans-serif" font-size="15.5" font-weight="bold" fill="#0f172a">L 层 K/V 权重堆成一个大矩阵,一次 GEMM 出全层 K/V,permute 成 layer-major</text>
<text x="590.0" y="58" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">本例 L=2、num_ctx=3、kv_size=8——融合与逐层数值差 0.0,纯省 kernel 启动、不改语义</text>
<text x="146.0" y="116" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">1. 堆叠融合权重</text>
<rect x="46" y="130" width="200" height="220" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
<text x="146.0" y="161.5" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e3a8a">layer0 W^K</text>
<line x1="46" y1="185.0" x2="246" y2="185.0" stroke="#2563eb" stroke-width="1" stroke-dasharray="4,3"/>
<text x="146.0" y="216.5" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e3a8a">layer0 W^V</text>
<line x1="46" y1="240.0" x2="246" y2="240.0" stroke="#2563eb" stroke-width="1" stroke-dasharray="4,3"/>
<text x="146.0" y="271.5" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e3a8a">layer1 W^K</text>
<line x1="46" y1="295.0" x2="246" y2="295.0" stroke="#2563eb" stroke-width="1" stroke-dasharray="4,3"/>
<text x="146.0" y="326.5" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e3a8a">layer1 W^V</text>
<text x="146.0" y="372" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e40af">形状 [32, 8]</text>
<text x="146.0" y="390" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">= L*2*kv_size(2*2*8) x hidden</text>
<line x1="246" y1="240.0" x2="306" y2="240.0" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<text x="276.0" y="230.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">F.linear</text>
<text x="436.0" y="116" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">2. 一次 GEMM 输出</text>
<rect x="306" y="130" width="260" height="220" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
<text x="436.0" y="170.66666666666666" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#92400e">ctx 位 0</text>
<line x1="306" y1="203.33333333333331" x2="566" y2="203.33333333333331" stroke="#d97706" stroke-width="1" stroke-dasharray="4,3"/>
<text x="436.0" y="243.99999999999997" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#92400e">ctx 位 1</text>
<line x1="306" y1="276.66666666666663" x2="566" y2="276.66666666666663" stroke="#d97706" stroke-width="1" stroke-dasharray="4,3"/>
<text x="436.0" y="317.3333333333333" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#92400e">ctx 位 2</text>
<text x="436.0" y="372" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#92400e">[ctx=3, L=2, 2, nkv=2, hd=4]</text>
<text x="436.0" y="390" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">未按层聚合,切片非 contiguous</text>
<line x1="566" y1="240.0" x2="666" y2="240.0" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<text x="616.0" y="226.0" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#334155">permute</text>
<text x="616.0" y="238.0" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#334155">(2,1,0,3,4)</text>
<text x="796.0" y="116" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">3. layer-major 布局</text>
<rect x="666" y="130" width="260" height="220" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
<text x="796.0" y="189.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#166534">all_k[0] / all_v[0]（layer 0，contiguous）</text>
<line x1="666" y1="240.0" x2="926" y2="240.0" stroke="#16a34a" stroke-width="1" stroke-dasharray="4,3"/>
<text x="796.0" y="299.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#166534">all_k[1] / all_v[1]（layer 1，contiguous）</text>
<text x="796.0" y="372" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#166534">[2, L=2, ctx=3, nkv=2, hd=4]</text>
<text x="796.0" y="390" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">逐层切片天然 contiguous,直接喂 do_kv_cache_update</text>
<text x="46" y="440" font-family="sans-serif" font-size="11.5" fill="#334155">融合 vs 逐层数值差 max|K_融合 - K_逐层| = 0.0——线性投影对行分块可分配,只省 kernel 启动次数,数值不变。</text>
<text x="46" y="462" font-family="sans-serif" font-size="11.5" fill="#334155">真实模型 L≈5、context 覆盖整段 prompt——一次融合 GEMM 省下的是约 5 倍 kernel 启动开销。</text>
</svg>