<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 382">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker></defs>
<rect width="1000" height="382" fill="white"/>
<text x="30" y="30" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e40af">训练协同适配:indexer 越对齐真注意力(KL 越低),top-k 召回越高</text>
<text x="30" y="50" font-family="sans-serif" font-size="12" fill="#64748b">对齐旋钮 α(0=完全对齐真分布,1=完全随机),400 次试验平均;完美对齐时 KL(p‖p)=0</text>
<rect x="220" y="108" width="142" height="40" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="291.0" y="124.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="white" font-weight="bold">α=0.0</text>
<text x="291.0" y="139.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="white" font-weight="bold">(对齐)</text>
<rect x="370" y="108" width="142" height="40" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="441.0" y="132.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="white" font-weight="bold">α=0.25</text>
<rect x="520" y="108" width="142" height="40" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="591.0" y="132.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="white" font-weight="bold">α=0.5</text>
<rect x="670" y="108" width="142" height="40" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="741.0" y="132.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="white" font-weight="bold">α=0.75</text>
<rect x="820" y="108" width="142" height="40" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="891.0" y="124.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="white" font-weight="bold">α=1.0</text>
<text x="891.0" y="139.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="white" font-weight="bold">(随机)</text>
<text x="204" y="185.0" text-anchor="end" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#374151">平均 dense-warmup KL</text>
<rect x="220" y="158" width="142" height="46" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
<text x="291.0" y="186.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#047857" font-weight="bold" >0.002</text>
<text x="441.0" y="186.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#374151" >0.044</text>
<text x="591.0" y="186.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#374151" >0.198</text>
<text x="741.0" y="186.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#374151" >0.478</text>
<rect x="820" y="158" width="142" height="46" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="891.0" y="186.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#b91c1c" font-weight="bold" >0.864</text>
<text x="204" y="239.0" text-anchor="end" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#374151">平均 top-k 质量召回</text>
<rect x="220" y="212" width="142" height="46" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
<text x="291.0" y="240.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#047857" font-weight="bold" >0.386</text>
<text x="441.0" y="240.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#374151" >0.368</text>
<text x="591.0" y="240.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#374151" >0.284</text>
<text x="741.0" y="240.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#374151" >0.181</text>
<rect x="820" y="212" width="142" height="46" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="891.0" y="240.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#b91c1c" font-weight="bold" >0.126</text>
<rect x="30" y="288" width="940" height="52" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="46" y="310" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#92400e">α: 0→1,KL 单调升 0.002→0.864;召回同步单调降 0.386→0.126(约 3x 差距)</text>
<text x="46" y="328" font-family="sans-serif" font-size="11.5" fill="#92400e">低 KL ⟺ 高召回——top-k 不掉点是训练压 KL 换来的,不是打分器天生准</text>
<text x="30" y="368" font-family="sans-serif" font-size="11" fill="#64748b">绿=对齐端(低 KL/高召回),红=随机端(高 KL/低召回)——两行反向单调是同一枚硬币的两面</text>
</svg>