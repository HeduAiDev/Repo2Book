<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 778 468">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker></defs>
<rect width="778" height="468" fill="white"/>
<text x="34" y="34" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1e40af">贪心复制冗余专家：两轮状态追踪</text>
<text x="34" y="56" font-family="sans-serif" font-size="12" fill="#64748b">num_redundant=2 个冗余名额，每轮把名额发给『当前单副本平均热度最高』的专家</text>
<rect x="224" y="108" width="252" height="34" rx="4" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="350.0" y="130.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">轮次 1 — 选中 expert 3</text>
<rect x="484" y="108" width="252" height="34" rx="4" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="610.0" y="130.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">轮次 2 — 选中 expert 4</text>
<text x="208" y="180.0" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="bold" fill="#374151">加副本前平均热度</text>
<text x="350.0" y="180.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#374151" >60.0</text>
<text x="610.0" y="180.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#374151" >55.0</text>
<text x="208" y="234.0" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="bold" fill="#374151">副本数 k→k+1</text>
<text x="350.0" y="234.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#374151" >0 → 1</text>
<text x="610.0" y="234.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#374151" >0 → 1</text>
<text x="208" y="288.0" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="bold" fill="#374151">摊薄后平均热度</text>
<rect x="224" y="260" width="252" height="46" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="350.0" y="288.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#b91c1c" font-weight="bold" >60.0 / 2 = 30.0</text>
<rect x="484" y="260" width="252" height="46" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="610.0" y="288.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#b91c1c" font-weight="bold" >55.0 / 2 = 27.5</text>
<text x="208" y="342.0" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="bold" fill="#374151">剩余冗余名额</text>
<text x="350.0" y="342.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#374151" >2 → 1</text>
<text x="610.0" y="342.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#374151" >1 → 0</text>
<rect x="34" y="388" width="710" height="46" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
<text x="50" y="416" font-family="sans-serif" font-size="13" font-weight="bold" fill="#92400e">结果：replicas_of={3:[8], 4:[9]} — 2 个冗余名额全部给了最热的专家 3、4，各减半</text>
</svg>