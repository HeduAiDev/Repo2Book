<text x="40.0" y="84.0" text-anchor="start" font-family="sans-serif" font-size="15" fill="#64748b">同一个 token、同一层:MHA 囤一整摞 per-head K + V,MLA 只囤一根压缩 latent —— 两条同起点并排,宽度差就是压缩比。</text>
