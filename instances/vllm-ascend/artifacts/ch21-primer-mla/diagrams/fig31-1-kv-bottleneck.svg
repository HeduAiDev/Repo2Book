<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 532">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker><marker id="ared" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#b91c1c"/></marker></defs>
<rect width="940" height="532" fill="white"/>
<text x="40" y="34" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">标准 MHA:每个 token 都要为每个头各留一份完整 K、V</text>
<text x="40" y="54" font-family="sans-serif" font-size="12" fill="#64748b">像给每位到场嘉宾发一张完整名片并全程留底——嘉宾越多,抽屉越满</text>
<rect x="40" y="84" width="150" height="60" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
<text x="115.0" y="108.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">token 隐状态</text>
<text x="115.0" y="128.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#334155">h_t</text>
<rect x="260" y="84" width="230" height="60" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
<text x="375.0" y="108.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">n_h=128 个头,每头 d_h=128</text>
<text x="375.0" y="128.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">各头独立投影出 k_i, v_i</text>
<rect x="560" y="84" width="300" height="60" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="710.0" y="108.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#991b1b">全部 k_i, v_i 都要写入缓存</text>
<text x="710.0" y="128.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#991b1b">2·n_h·d_h = 2·128·128 = 32768</text>
<line x1="190" y1="114.0" x2="256" y2="114.0" stroke="#64748b" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="490" y1="114.0" x2="556" y2="114.0" stroke="#64748b" stroke-width="1.8" marker-end="url(#a)"/>
<text x="40" y="196" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">上下文每增长 1 个 token,缓存就再摞上一层 32768 个元素——线性累积,无上限</text>
<rect x="40" y="320" width="60" height="22" rx="4" fill="#fca5a5" stroke="#991b1b" stroke-width="1"/>
<text x="70.0" y="360" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">t0</text>
<rect x="114" y="298" width="60" height="44" rx="4" fill="#fca5a5" stroke="#991b1b" stroke-width="1"/>
<text x="144.0" y="360" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">t1</text>
<rect x="188" y="276" width="60" height="66" rx="4" fill="#fca5a5" stroke="#991b1b" stroke-width="1"/>
<text x="218.0" y="360" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">t2</text>
<rect x="262" y="254" width="60" height="88" rx="4" fill="#fca5a5" stroke="#991b1b" stroke-width="1"/>
<text x="292.0" y="360" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">t3</text>
<rect x="336" y="232" width="60" height="110" rx="4" fill="#fca5a5" stroke="#991b1b" stroke-width="1"/>
<text x="366.0" y="360" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">t4</text>
<rect x="410" y="210" width="60" height="132" rx="4" fill="#b91c1c" stroke="#991b1b" stroke-width="1"/>
<text x="440.0" y="360" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">t5</text>
<text x="494" y="276.0" font-family="sans-serif" font-size="12" fill="#64748b">上下文长度 →</text>
<rect x="40" y="402" width="860" height="90" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="470.0" y="434" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#92400e">全模型(60 层)每 token 累计缓存元素</text>
<text x="470.0" y="462" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#92400e">32768 × 60 层 = 1,966,080 个元素/token</text>
</svg>