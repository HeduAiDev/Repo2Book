<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 558">
<rect width="1050" height="558" fill="white"/>
<text x="40" y="34" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">KV Cache 账单:四种注意力机制每 token 每层缓存多少元素(DeepSeek-V2 n_h=128, d_h=128)</text>
<text x="40" y="56" font-family="sans-serif" font-size="12" fill="#64748b">MLA 一栏与 MQA 同量级,却因潜向量携带全部头信息而保住 MHA 级能力</text>
<text x="136" y="131.0" text-anchor="end" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a">MHA</text>
<rect x="150" y="115.0" width="640.0" height="34" rx="6" fill="#94a3b8" stroke="#334155" stroke-width="1"/>
<text x="802.0" y="140.0" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a">32768</text>
<text x="150" y="169.0" font-family="sans-serif" font-size="11.5" fill="#64748b">每头各存一份完整 K/V(2·n_h·d_h)</text>
<text x="136" y="209.0" text-anchor="end" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a">GQA-8</text>
<rect x="150" y="193.0" width="469.3620045079562" height="34" rx="6" fill="#fbbf24" stroke="#334155" stroke-width="1"/>
<text x="631.3620045079563" y="218.0" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a">2048</text>
<text x="150" y="247.0" font-family="sans-serif" font-size="11.5" fill="#64748b">8 组共享(2·(n_h/8)·d_h)</text>
<text x="136" y="287.0" text-anchor="end" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a">MQA</text>
<rect x="150" y="271.0" width="341.57231154123855" height="34" rx="6" fill="#fca5a5" stroke="#334155" stroke-width="1"/>
<text x="503.57231154123855" y="296.0" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a">256</text>
<text x="150" y="325.0" font-family="sans-serif" font-size="11.5" fill="#64748b">全部头共享一份(2·d_h)</text>
<text x="136" y="365.0" text-anchor="end" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a">MLA</text>
<rect x="150" y="349.0" width="391.35575835716173" height="34" rx="6" fill="#1d4ed8" stroke="#334155" stroke-width="1"/>
<text x="553.3557583571617" y="374.0" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a">576</text>
<text x="150" y="403.0" font-family="sans-serif" font-size="11.5" fill="#64748b">潜向量 d_c=512 + 解耦位置 d_h_r=64</text>
<rect x="40" y="428" width="970" height="96" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="525.0" y="458" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#92400e">MLA/MHA 压缩比 = 32768 ÷ 576 = 56.89×,等效 2.25 组 GQA</text>
<text x="525.0" y="490" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#92400e">全模型(60 层)每 token 缓存:MHA 1,966,080 个元素 → MLA 34,560 个元素</text>
</svg>