<text x="124.0" y="313.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#b91c1c">每个历史 token 都要重放大出 full key</text>
<rect x="718.0" y="70.0" width="574.0" height="30.0" rx="8" fill="#15803d" stroke="#15803d" stroke-width="0"/>
<text x="1005.0" y="90.0" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="white">吸收后:W^UK 折进 query</text>
<rect x="718.0" y="114.0" width="574.0" height="230.0" rx="12" fill="#fbfcfe" stroke="#e2e8f0" stroke-width="1.2"/>
<rect x="740.0" y="136.0" width="124.0" height="50.0" rx="9" fill="#f1f5f9" stroke="#475569" stroke-width="1.8"/>
<text x="802.0" y="157.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">c^Q</text>
<text x="802.0" y="174.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">query 潜向量</text>
<rect x="740.0" y="246.0" width="124.0" height="50.0" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
<text x="802.0" y="267.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1d4ed8">c^KV</text>
<text x="802.0" y="284.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">缓存·唯一落盘</text>
<rect x="934.0" y="136.0" width="128.0" height="50.0" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
<text x="998.0" y="157.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#b45309">q̃</text>
<text x="998.0" y="174.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">落在潜空间</text>
<line x1="864.0" y1="161.0" x2="934.0" y2="161.0" stroke="#d97706" stroke-width="2.0" marker-end="url(#a)"/>
<text x="899.0" y="152.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#b45309">W̃</text>
<rect x="1132.0" y="191.0" width="138.0" height="50.0" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/>
<text x="1201.0" y="212.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#6d28d9">潜空间打分</text>
<text x="1201.0" y="229.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">⟨q̃, c^KV⟩</text>
<line x1="1062.0" y1="161.0" x2="1132.0" y2="202.0" stroke="#d97706" stroke-width="2.0" marker-end="url(#a)"/>
<line x1="864.0" y1="271.0" x2="1132.0" y2="230.0" stroke="#2563eb" stroke-width="2.0" marker-end="url(#a)"/>
<text x="998.0" y="262.0" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1d4ed8">直接内积</text>
<text x="832.0" y="313.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#15803d">key 永不物化,省掉逐 token 重放大</text>
<line x1="614.0" y1="229.0" x2="718.0" y2="229.0" stroke="#ea580c" stroke-width="2.6" marker-end="url(#t)"/>
<text x="666.0" y="217.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#ea580c">把 W^UK 折进 query</text>
<rect x="40.0" y="374.0" width="1252.0" height="86.0" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
<text x="56.0" y="398.0" text-anchor="start" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#78350f">吸收前 → 吸收后:把静态的上投影 W^UK 从 key 路径折进 query 侧,合成 W̃ = (W^UK)^⊤ W^UQ——它是常量,这是可折的全部前提</text>
<text x="56.0" y="420.0" text-anchor="start" font-family="sans-serif" font-size="12.5" fill="#78350f">工程上不物化 W̃,让向量顺次穿过 W^UQ、(W^UK)^⊤ 两个瘦因子(见正文严谨框)</text>
<text x="56.0" y="442.0" text-anchor="start" font-family="sans-serif" font-size="12.5" fill="#78350f">于是缓存里只留潜向量 c^KV、历史 key 永不物化;输出侧对称——∑ w_j v_j = W^UV(∑ w_j c_j),W^UV 折进输出投影 W^O</text>
</svg>