<text x="124.0" y="267.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1d4ed8">c^KV</text>
<text x="124.0" y="284.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">缓存·唯一落盘</text>
