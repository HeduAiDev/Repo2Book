<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 486">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker></defs>
<rect width="890" height="486" fill="white"/>
<text x="40" y="30" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">为何需要解耦 RoPE:中间块变成 M(δ)——常量性被破坏,吸收失效</text>
<rect x="40" y="50" width="360" height="30" rx="6" fill="#b91c1c"/>
<text x="220.0" y="71" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="white">直接对 k^C 加 RoPE(破坏吸收)</text>
<rect x="60.0" y="96" width="320" height="50" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
<text x="220.0" y="125.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#0f172a">q_t^T k_j^rope = c_t^Q^T (W^UQ)^T R_(j-t) W_UK c_j</text>
<line x1="220.0" y1="146" x2="220.0" y2="168" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="60.0" y="172" width="320" height="50" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
<text x="220.0" y="201.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#0f172a">旋转矩阵 R_(j-t) 夹在 (W^UQ)^T 与 W_UK 之间</text>
<line x1="220.0" y1="222" x2="220.0" y2="244" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="60.0" y="248" width="320" height="50" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2.2"/>
<text x="220.0" y="269.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#991b1b">M(δ)随δ变:M(0)[0,0]=-0.5378</text>
<text x="220.0" y="285.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#991b1b">M(3)[0,0]=0.6912</text>
<rect x="490" y="50" width="360" height="30" rx="6" fill="#15803d"/>
<text x="670.0" y="71" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="white">解耦 RoPE(保住吸收)</text>
<rect x="510.0" y="96" width="320" height="50" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
<text x="670.0" y="125.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#0f172a">位置只走独立 q_pe/k_pe(d_h_r=2 维)</text>
<line x1="670.0" y1="146" x2="670.0" y2="168" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="510.0" y="172" width="320" height="50" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
<text x="670.0" y="201.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#0f172a">c_kv 主体不加 RoPE,保持位置无关</text>
<line x1="670.0" y1="222" x2="670.0" y2="244" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="510.0" y="248" width="320" height="50" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2.2"/>
<text x="670.0" y="277.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#15803d">W̃=(W_UK)^T W_UQ 静态:W̃[0,0]=-0.5378 恒定</text>
<text x="445.0" y="183.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a" font-weight="bold">对比</text>
<line x1="408" y1="197.0" x2="482" y2="197.0" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#a)"/>
<text x="40" y="354" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">中间矩阵 M(δ)[0,0] 随相对位置 δ 的变化(左路线,若真的这样做)</text>
<rect x="40" y="434.0" width="150" height="10.0" rx="4" fill="#15803d" fill-opacity="0.75" stroke="#15803d" stroke-width="1.5"/>
<text x="115.0" y="426.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#15803d">-0.5378</text>
<text x="115.0" y="464" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">δ=0</text>
<rect x="220" y="429.9048006509357" width="150" height="14.095199349064277" rx="4" fill="#b91c1c" fill-opacity="0.75" stroke="#b91c1c" stroke-width="1.5"/>
<text x="295.0" y="421.9048006509357" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#b91c1c">-0.4659</text>
<text x="295.0" y="464" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">δ=1</text>
<rect x="400" y="396.2489829129373" width="150" height="47.75101708706265" rx="4" fill="#b91c1c" fill-opacity="0.75" stroke="#b91c1c" stroke-width="1.5"/>
<text x="475.0" y="388.2489829129373" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#b91c1c">0.125</text>
<text x="475.0" y="464" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">δ=2</text>
<rect x="580" y="364.0" width="150" height="80.0" rx="4" fill="#b91c1c" fill-opacity="0.75" stroke="#b91c1c" stroke-width="1.5"/>
<text x="655.0" y="356.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#b91c1c">0.6912</text>
<text x="655.0" y="464" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">δ=3</text>
</svg>