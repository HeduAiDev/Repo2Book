<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 430">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker></defs>
<rect width="850" height="430" fill="white"/>
<text x="40" y="30" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">权重吸收恒等式:两条路径打分在浮点精度内一致</text>
<text x="210.0" y="48" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">物化路径(每步都要放大出 full key)</text>
<rect x="80.0" y="78" width="260" height="46" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
<text x="210.0" y="106.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0f172a">c_kv (缓存,d_c=4)</text>
<line x1="210.0" y1="124" x2="210.0" y2="148" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="80.0" y="152" width="260" height="46" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
<text x="210.0" y="180.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0f172a">×W_UK → k^C (物化)</text>
<line x1="210.0" y1="198" x2="210.0" y2="222" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="80.0" y="226" width="260" height="46" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<text x="210.0" y="254.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#15803d">q^C · k^C → 打分 -0.0973</text>
<text x="640.0" y="48" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">吸收路径(query 先落潜空间)</text>
<rect x="510.0" y="78" width="260" height="46" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
<text x="640.0" y="106.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0f172a">q ×W_UK(一次,静态吸收)</text>
<line x1="640.0" y1="124" x2="640.0" y2="148" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="510.0" y="152" width="260" height="46" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
<text x="640.0" y="180.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0f172a">q̃ (潜空间 query)</text>
<line x1="640.0" y1="198" x2="640.0" y2="222" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="510.0" y="226" width="260" height="46" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<text x="640.0" y="254.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#15803d">q̃ · c_kv → 打分 -0.0973</text>
<text x="425" y="161.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#15803d" font-weight="bold">数值恒等</text>
<line x1="388" y1="175.0" x2="462" y2="175.0" stroke="#15803d" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="40" y="320" width="770" height="86" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="425.0" y="350" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#92400e">4 对 (查询 t, 键 j) 两路打分一致,绝对差舍入到 4 位后为 0.0(float64 实测 ~1e-16)</text>
<text x="425.0" y="378" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#92400e">如 (t=1, j=0):物化 -0.0973 == 吸收 -0.0973 —— 精确恒等,不是近似</text>
</svg>