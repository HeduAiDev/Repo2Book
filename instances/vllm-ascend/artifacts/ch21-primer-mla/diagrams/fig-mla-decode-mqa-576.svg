<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1008.0 594.0">
<defs><marker id="fan" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6.5" markerHeight="4.5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#94a3b8"/></marker></defs>
<rect width="1008.0" height="594.0" fill="white"/>
<text x="40.0" y="34.0" text-anchor="start" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">吸收后的 decode 打分:128 个头共享同一根 576 维 key —— 就是 head_dim 576 的 MQA</text>
<text x="40.0" y="58.0" text-anchor="start" font-family="sans-serif" font-size="12.5" fill="#64748b">每头把拼接 query [ q̃_i(512) ; q^R_i(64) ] 打向唯一一根共享 [ c^KV ; k^R ],缓存里没有头下标</text>
<rect x="40.0" y="77.0" width="14.0" height="14.0" rx="3" fill="#d97706" stroke="#d97706" stroke-width="0"/>
<text x="60.0" y="88.0" text-anchor="start" font-family="sans-serif" font-size="11.5" fill="#0f172a">查询内容部 q̃_i(512)</text>
<rect x="205.3" y="77.0" width="14.0" height="14.0" rx="3" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="0"/>
<text x="225.3" y="88.0" text-anchor="start" font-family="sans-serif" font-size="11.5" fill="#0f172a">键内容部 c^KV(512,唯一缓存)</text>
<rect x="411.8" y="77.0" width="14.0" height="14.0" rx="3" fill="#7c3aed" stroke="#7c3aed" stroke-width="0"/>
<text x="431.8" y="88.0" text-anchor="start" font-family="sans-serif" font-size="11.5" fill="#0f172a">位置旋转部(64,解耦 RoPE:q^R / k^R 共享)</text>
<text x="262.0" y="128.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">每头一份拼接 query = [ q̃_i (512) ; q^R_i (64) ]  →  576 维</text>
<text x="82.0" y="176.0" text-anchor="end" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">头 1</text>
<rect x="92.0" y="150.0" width="302.2" height="42.0" rx="6" fill="#fde68a" stroke="#d97706" stroke-width="1.6"/>
<rect x="394.2" y="150.0" width="37.8" height="42.0" rx="6" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1.6"/>
<text x="243.1" y="176.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#92400e">q̃_i</text>
<text x="413.1" y="175.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#5b21b6">q^R</text>
<line x1="432.0" y1="171.0" x2="625.0" y2="295.0" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#fan)"/>
<text x="82.0" y="238.0" text-anchor="end" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">头 2</text>
<rect x="92.0" y="212.0" width="302.2" height="42.0" rx="6" fill="#fde68a" stroke="#d97706" stroke-width="1.6"/>
<rect x="394.2" y="212.0" width="37.8" height="42.0" rx="6" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1.6"/>
<text x="243.1" y="238.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#92400e">q̃_i</text>
<text x="413.1" y="237.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#5b21b6">q^R</text>
<line x1="432.0" y1="233.0" x2="625.0" y2="295.0" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#fan)"/>
<text x="82.0" y="300.0" text-anchor="end" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">头 3</text>
<rect x="92.0" y="274.0" width="302.2" height="42.0" rx="6" fill="#fde68a" stroke="#d97706" stroke-width="1.6"/>
<rect x="394.2" y="274.0" width="37.8" height="42.0" rx="6" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1.6"/>
<text x="243.1" y="300.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#92400e">q̃_i</text>
<text x="413.1" y="299.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#5b21b6">q^R</text>
<line x1="432.0" y1="295.0" x2="625.0" y2="295.0" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#fan)"/>
<text x="262.0" y="362.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#64748b">⋯   共 128 个头   ⋯</text>
<text x="82.0" y="424.0" text-anchor="end" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">头 128</text>
<rect x="92.0" y="398.0" width="302.2" height="42.0" rx="6" fill="#fde68a" stroke="#d97706" stroke-width="1.6"/>
<rect x="394.2" y="398.0" width="37.8" height="42.0" rx="6" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1.6"/>
<text x="243.1" y="424.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#92400e">q̃_i</text>
<text x="413.1" y="423.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#5b21b6">q^R</text>
<line x1="432.0" y1="419.0" x2="625.0" y2="295.0" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#fan)"/>
<text x="530.0" y="199.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#64748b">128 根 query</text>
<text x="530.0" y="215.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#64748b">都打向 ↓</text>
<text x="798.0" y="246.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e3a8a">全部 128 头共享同一份(无头下标 i)</text>
<rect x="628.0" y="260.0" width="302.2" height="70.0" rx="6" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2.4"/>
<rect x="930.2" y="260.0" width="37.8" height="70.0" rx="6" fill="#ddd6fe" stroke="#7c3aed" stroke-width="2.4"/>
<text x="779.1" y="300.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">c^KV</text>
<text x="949.1" y="299.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#5b21b6">k^R</text>
<text x="798.0" y="354.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">[ c^KV ; k^R ] ∈ R^576 = 512 + 64</text>
<text x="798.0" y="372.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#64748b">这一根就是缓存里唯一落盘的东西</text>
<rect x="40.0" y="480.0" width="928.0" height="74.0" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
<text x="58.0" y="508.0" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="bold" fill="#78350f">decode 形态 = head_dim 576 的 MQA:128 个头的 query 全部打向同一根共享 key</text>
<text x="58.0" y="532.0" text-anchor="start" font-family="sans-serif" font-size="12.5" fill="#78350f">对照  MQA:全头共享 1 份,head_dim 128,每 token 缓存 256 = 2·d_h    |    MLA-decode:全头共享 1 份,head_dim 576,每 token 缓存 576</text>
</svg>