<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 490">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#1d4ed8"/></marker><marker id="ag" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker></defs>
<rect width="940" height="490" fill="white"/>
<text x="40" y="34" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">联合压缩:K、V 共享同一段潜向量 c_kv,只有它写入缓存</text>
<text x="40" y="54" font-family="sans-serif" font-size="12" fill="#64748b">推理期只缓存 c_kv;key/value 用时现场上投影,从不落盘</text>
<rect x="40" y="96" width="150" height="64" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
<text x="115.0" y="122.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">token h</text>
<text x="115.0" y="142.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">(隐状态)</text>
<rect x="280" y="96" width="230" height="64" rx="10" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2.5"/>
<text x="395.0" y="120.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">c_kv (潜向量)</text>
<text x="395.0" y="140.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a">d_c=4,唯一写入缓存</text>
<line x1="190" y1="128.0" x2="276" y2="128.0" stroke="#1d4ed8" stroke-width="2" marker-end="url(#a)"/>
<text x="235.0" y="118.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1d4ed8">W_DKV</text>
<rect x="620" y="36" width="220" height="64" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="628" y="62.0" font-family="sans-serif" font-size="13" font-weight="bold" fill="#475569">k_c (物化 key)</text>
<text x="628" y="82.0" font-family="sans-serif" font-size="12" fill="#64748b">物化维度 n_h·d_h = 8(从不落盘)</text>
<line x1="520" y1="128.0" x2="616" y2="68.0" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#ag)"/>
<text x="570.0" y="90.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#475569">W_UK</text>
<rect x="620" y="156" width="220" height="64" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="628" y="182.0" font-family="sans-serif" font-size="13" font-weight="bold" fill="#475569">v_c (物化 value)</text>
<text x="628" y="202.0" font-family="sans-serif" font-size="12" fill="#64748b">物化维度 n_h·d_h = 8(从不落盘)</text>
<line x1="520" y1="128.0" x2="616" y2="188.0" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#ag)"/>
<text x="570.0" y="150.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#475569">W_UV</text>
<line x1="40" y1="260" x2="80" y2="260" stroke="#1d4ed8" stroke-width="2.5"/>
<text x="90" y="264" font-family="sans-serif" font-size="12" fill="#334155">实线 = 真实写入 KV cache</text>
<line x1="320" y1="260" x2="360" y2="260" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,4"/>
<text x="370" y="264" font-family="sans-serif" font-size="12" fill="#334155">虚线 = 按需现场上投影,从不落盘</text>
<text x="40" y="300" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">每 token 每层缓存元素数对比</text>
<rect x="40" y="376.25" width="140" height="33.75" rx="4" fill="#1d4ed8" stroke="#334155" stroke-width="1"/>
<text x="110" y="366.25" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">6</text>
<text x="110" y="430" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">MLA (c_kv=4 + 解耦 k_pe=2)</text>
<rect x="260" y="320.0" width="140" height="90.0" rx="4" fill="#94a3b8" stroke="#334155" stroke-width="1"/>
<text x="330" y="310.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">16</text>
<text x="330" y="430" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">MHA 基线</text>
</svg>