<rect x="40.0" y="781.0" width="1078.0" height="60.0" rx="10" fill="#fffbeb" stroke="#ea580c" stroke-width="1.3"/>
<text x="56.0" y="805.0" text-anchor="start" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#78350f">三路下投影从 h_t 各自压缩;推理期只把 c^KV 与 k^R 写进 KV 缓存(共 512+64=576),其余 K / V 现算。</text>
<text x="56.0" y="826.0" text-anchor="start" font-family="sans-serif" font-size="12.5" fill="#78350f">上投影逐头还原 q^C / k^C / v;位置项 q^R、k^R 单独走 RoPE,拼接成每头 192 维的 Q、K 与 128 维 V,注意力后经 W^O 投回 d=5120。</text>
