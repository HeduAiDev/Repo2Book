<rect x="612.0" y="487.0" width="176.0" height="50.0" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
<text x="700.0" y="508.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1d4ed8">K = k^C ⊕ k^R</text>
<text x="700.0" y="525.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">每头 128 + 64 = 192</text>
<rect x="986.0" y="487.0" width="132.0" height="50.0" rx="9" fill="#fecaca" stroke="#dc2626" stroke-width="1.8"/>
<text x="1052.0" y="508.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#991b1b">V = v</text>
<text x="1052.0" y="525.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">每头 128</text>
<rect x="516.0" y="595.0" width="340.0" height="58.0" rx="9" fill="#e2e8f0" stroke="#475569" stroke-width="1.8"/>
