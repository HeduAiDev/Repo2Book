<text x="686.0" y="637.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">Softmax(q·kᵀ / √192) · v</text>
<rect x="526.0" y="701.0" width="320.0" height="50.0" rx="9" fill="#e2e8f0" stroke="#475569" stroke-width="1.8"/>
<text x="686.0" y="722.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">u_t （本层输出）</text>
<text x="686.0" y="739.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">拼接 128 头 16384 → W^O → d = 5120</text>
<text x="410.0" y="184.0" text-anchor="end" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#16a34a">W^DQ</text>
<text x="410.0" y="198.0" text-anchor="end" font-family="sans-serif" font-size="10" fill="#64748b">d'_c=1536</text>
<text x="525.0" y="184.0" text-anchor="end" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#7c3aed">W^KR·RoPE</text>
<text x="525.0" y="198.0" text-anchor="end" font-family="sans-serif" font-size="10" fill="#64748b">d_h^R=64</text>
<text x="782.0" y="184.0" text-anchor="start" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#16a34a">W^DKV</text>
<text x="782.0" y="198.0" text-anchor="start" font-family="sans-serif" font-size="10" fill="#64748b">d_c=512</text>
<text x="214.0" y="337.0" text-anchor="end" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#ca8a04">W^UQ</text>
<text x="214.0" y="351.0" text-anchor="end" font-family="sans-serif" font-size="10" fill="#64748b">逐头 128</text>
<text x="372.0" y="337.0" text-anchor="start" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#7c3aed">W^QR·RoPE</text>
<text x="372.0" y="351.0" text-anchor="start" font-family="sans-serif" font-size="10" fill="#64748b">逐头 64</text>
<text x="700.0" y="333.0" text-anchor="end" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#2563eb">W^UK</text>
<text x="700.0" y="347.0" text-anchor="end" font-family="sans-serif" font-size="10" fill="#64748b">逐头 128</text>
<text x="1005.0" y="333.0" text-anchor="start" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#dc2626">W^UV</text>
<text x="1005.0" y="347.0" text-anchor="start" font-family="sans-serif" font-size="10" fill="#64748b">逐头 128</text>
<text x="706.0" y="674.0" text-anchor="start" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#64748b">W^O</text>
<text x="706.0" y="688.0" text-anchor="start" font-family="sans-serif" font-size="10" fill="#64748b">16384 → 5120</text>
<text x="306.0" y="481.0" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a">⊕</text>
<text x="700.0" y="481.0" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a">⊕</text>
<text x="612.0" y="470.0" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#6d28d9">k^R 全头共享</text>
