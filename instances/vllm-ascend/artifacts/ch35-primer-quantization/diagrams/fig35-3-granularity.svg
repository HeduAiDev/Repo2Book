<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 852 495">
<rect width="852" height="495" fill="white"/>
<text x="36" y="36" font-family="sans-serif" font-size="16" fill="#1e40af"><tspan font-weight="bold">为兼容 INT8 GEMM，缩放只能沿外维——per-channel(输入通道) 数学最优却做不到</tspan></text>
<text x="36" y="58" font-family="sans-serif" font-size="12" fill="#64748b">X 是 2 token × 3 通道，通道 2 是 outlier（与正文示例数据一致）</text>
<text x="136.0" y="98" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">per-tensor</text>
<text x="136.0" y="115" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">（硬件可行）</text>
<circle cx="136.0" cy="150" r="15" fill="white" stroke="#047857" stroke-width="2.5"/>
