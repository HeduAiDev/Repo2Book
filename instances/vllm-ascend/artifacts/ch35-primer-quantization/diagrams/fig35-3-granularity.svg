<rect x="56.0" y="245" width="50" height="50" rx="5" fill="#93c5fd" stroke="#64748b" stroke-width="1.3"/>
<text x="81.0" y="274.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">0.15</text>
<rect x="111.0" y="245" width="50" height="50" rx="5" fill="#93c5fd" stroke="#64748b" stroke-width="1.3"/>
<text x="136.0" y="274.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">0.1</text>
<rect x="166.0" y="245" width="50" height="50" rx="5" fill="#93c5fd" stroke="#64748b" stroke-width="1.3"/>
<text x="191.0" y="274.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">8</text>
<text x="136.0" y="321" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e3a5f">scale = 0.0787</text>
<text x="136.0" y="338" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">一个标量覆盖整矩阵</text>
<text x="426.0" y="98" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">per-token（按行）</text>
<text x="426.0" y="115" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">（硬件可行）</text>
<circle cx="426.0" cy="150" r="15" fill="white" stroke="#047857" stroke-width="2.5"/>
<text x="426.0" y="156" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#047857">✓</text>
<rect x="296.0" y="190" width="50" height="50" rx="5" fill="#93c5fd" stroke="#64748b" stroke-width="1.3"/>
<text x="321.0" y="219.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">0.1</text>
<rect x="351.0" y="190" width="50" height="50" rx="5" fill="#93c5fd" stroke="#64748b" stroke-width="1.3"/>
<text x="376.0" y="219.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">0.2</text>
<rect x="406.0" y="190" width="50" height="50" rx="5" fill="#93c5fd" stroke="#64748b" stroke-width="1.3"/>
<text x="431.0" y="219.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">10</text>
<rect x="296.0" y="245" width="50" height="50" rx="5" fill="#86efac" stroke="#64748b" stroke-width="1.3"/>
<text x="321.0" y="274.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">0.15</text>
<rect x="351.0" y="245" width="50" height="50" rx="5" fill="#86efac" stroke="#64748b" stroke-width="1.3"/>
<text x="376.0" y="274.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">0.1</text>
<rect x="406.0" y="245" width="50" height="50" rx="5" fill="#86efac" stroke="#64748b" stroke-width="1.3"/>
<text x="431.0" y="274.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">8</text>
<text x="468.0" y="219.0" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e3a5f">scale=0.0787</text>
<text x="468.0" y="274.0" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e3a5f">scale=0.063</text>
<text x="426.0" y="321" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e3a5f">每 token(行) 一个 scale</text>
<text x="716.0" y="98" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">per-channel（输入通道）</text>
<text x="716.0" y="115" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">（数学最优，硬件不可行）</text>
<circle cx="716.0" cy="150" r="15" fill="white" stroke="#b91c1c" stroke-width="2.5"/>
<text x="716.0" y="156" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#b91c1c">✗</text>
<rect x="636.0" y="190" width="50" height="50" rx="5" fill="#93c5fd" stroke="#64748b" stroke-width="1.3"/>
<text x="661.0" y="219.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">0.1</text>
<rect x="691.0" y="190" width="50" height="50" rx="5" fill="#86efac" stroke="#64748b" stroke-width="1.3"/>
<text x="716.0" y="219.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">0.2</text>
<rect x="746.0" y="190" width="50" height="50" rx="5" fill="#fcd34d" stroke="#64748b" stroke-width="1.3"/>
<text x="771.0" y="219.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">10</text>
<rect x="636.0" y="245" width="50" height="50" rx="5" fill="#93c5fd" stroke="#64748b" stroke-width="1.3"/>
<text x="661.0" y="274.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">0.15</text>
<rect x="691.0" y="245" width="50" height="50" rx="5" fill="#86efac" stroke="#64748b" stroke-width="1.3"/>
<text x="716.0" y="274.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">0.1</text>
<rect x="746.0" y="245" width="50" height="50" rx="5" fill="#fcd34d" stroke="#64748b" stroke-width="1.3"/>
<text x="771.0" y="274.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">8</text>
<text x="661.0" y="317" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#b91c1c">0.0012</text>
<text x="716.0" y="317" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#b91c1c">0.0016</text>
<text x="771.0" y="317" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#b91c1c">0.0787</text>
<text x="716.0" y="341" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">每输入通道(列) 一个 scale</text>
<text x="716.0" y="358" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">——收缩维，GEMM 无法拆</text>
<text x="36" y="459" font-family="sans-serif" font-size="11" fill="#64748b">per-channel(输入通道) 虽能把 outlier 通道(0.0787)与非 outlier(0.0012/0.0016)分开，但该维是 INT8</text>
<text x="36" y="475" font-family="sans-serif" font-size="11" fill="#64748b">GEMM 的收缩(累加)维，无法在矩阵乘中还原——落地代码只提供 per-tensor/per-channel(输出维) 两种参数形状。</text>
</svg>