<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 564">
<rect width="820" height="564" fill="white"/>
<text x="30" y="30" font-family="sans-serif" font-size="16" fill="#1e40af"><tspan font-weight="bold">AWQ 缩放显著权重：误差比贴着 1/s 走，但 s 过大会撑大 Δ′ 反噬非显著通道</tspan></text>
<text x="30" y="50" font-family="sans-serif" font-size="12" fill="#64748b">4-bit；n_trials=20000（多次随机显著权重取误差均值）</text>
<text x="30" y="88" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">① 放大显著权重：实测误差比贴着 1/s 下降（absmax 未位移）</text>
<rect x="220" y="100" width="182" height="32" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="311.0" y="120.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">s=1.0</text>
<rect x="410" y="100" width="182" height="32" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="501.0" y="120.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">s=2.0</text>
<rect x="600" y="100" width="182" height="32" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="691.0" y="120.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">s=4.0</text>
<text x="204" y="166.0" text-anchor="end" font-family="sans-serif" font-size="12" font-weight="bold" fill="#374151">朴素预测 1/s</text>
<text x="311.0" y="167.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#374151" >1.0</text>
<text x="501.0" y="167.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#374151" >0.5</text>
<text x="691.0" y="167.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#374151" >0.25</text>
<text x="204" y="214.0" text-anchor="end" font-family="sans-serif" font-size="12" font-weight="bold" fill="#374151">实测平均误差比</text>
<rect x="220" y="190" width="182" height="40" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
<text x="311.0" y="215.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#047857" font-weight="bold" >1.0</text>
<rect x="410" y="190" width="182" height="40" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
<text x="501.0" y="215.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#047857" font-weight="bold" >0.5694</text>
<rect x="600" y="190" width="182" height="40" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
<text x="691.0" y="215.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#047857" font-weight="bold" >0.2658</text>
<text x="204" y="262.0" text-anchor="end" font-family="sans-serif" font-size="12" font-weight="bold" fill="#374151">absmax 被位移比例</text>
<text x="311.0" y="263.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#374151" >0.0</text>
<text x="501.0" y="263.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#374151" >0.0</text>
<text x="691.0" y="263.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#374151" >0.0</text>
<text x="30" y="326" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">② s 过大时反噬：显著权重变成组 max，Δ′ 被撑大</text>
<rect x="220" y="338" width="182" height="32" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="311.0" y="358.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">s=2.0</text>
<rect x="410" y="338" width="182" height="32" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="501.0" y="358.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">s=4.0</text>
<rect x="600" y="338" width="182" height="32" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="691.0" y="358.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">s=8.0</text>
<text x="204" y="404.0" text-anchor="end" font-family="sans-serif" font-size="12" font-weight="bold" fill="#374151">Δ′/Δ 比值(delta_ratio)</text>
<rect x="220" y="380" width="182" height="40" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="311.0" y="405.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#b91c1c" font-weight="bold" >2.0</text>
<rect x="410" y="380" width="182" height="40" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="501.0" y="405.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#b91c1c" font-weight="bold" >4.0</text>
<rect x="600" y="380" width="182" height="40" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="691.0" y="405.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#b91c1c" font-weight="bold" >8.0</text>
<rect x="30" y="448" width="760" height="26" rx="5" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.3"/>
<text x="42" y="466" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e3a5f">③ α 网格搜：best α=0.25，重构损失 0.7094 → 0.2484（2.86×）</text>
<text x="30" y="504" font-family="sans-serif" font-size="11" fill="#64748b">① s=2/4 实测比 0.5694/0.2658 贴近朴素 1/s=0.5/0.25，因组 absmax 未变(Δ′=Δ)。</text>
<text x="30" y="522" font-family="sans-serif" font-size="11" fill="#64748b">② s=8 时显著权重反成组内最大值，Δ′ 涨到 8 倍——整组刻度变粗，伤及非显著通道；故存在最优 s(见③)。</text>
</svg>