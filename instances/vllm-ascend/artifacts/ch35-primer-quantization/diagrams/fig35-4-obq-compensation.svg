<rect width="788" height="394" fill="white"/>
<text x="44" y="36" font-family="sans-serif" font-size="16" fill="#1e40af"><tspan font-weight="bold">二阶补偿不是取整微调：w2 被翻转，层输出误差降到不足 RTN 的三分之一</tspan></text>
