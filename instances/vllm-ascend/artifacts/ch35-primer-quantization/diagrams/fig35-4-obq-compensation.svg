<text x="394.0" y="188.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#d97706">2.9534×</text>
<text x="394.0" y="224.0" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">仅 w2 不同</text>
<text x="44" y="370" font-family="sans-serif" font-size="11" fill="#64748b">黄框=补偿后发生翻转的权重(w2: 0.3347 → 0.0)；两条码 w0/w1 完全一致——差异只来自 Hessian 相关性驱动的误差再分配。</text>
