<text x="58" y="460" font-size="14" font-weight="bold" fill="#166534">收益门槛：peak_after &lt; 0.95×peak_before ?</text>
<text x="58" y="486" font-size="13.5" fill="#166534">60 &lt; 0.95×100 = 95 → 成立，峰值降 40%（&gt;5% 门槛）</text>
