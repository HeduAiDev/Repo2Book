<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 586">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="8" markerHeight="6" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#b91c1c"/></marker></defs>
<rect width="980" height="586" fill="white"/>
<text x="40" y="30" text-anchor="start" font-family="sans-serif" font-size="16.5" font-weight="bold" fill="#b91c1c">以为 top-k 把注意力砍 256×、端到端就该 256×——</text>
<text x="40" y="52" text-anchor="start" font-family="sans-serif" font-size="16.5" font-weight="bold" fill="#b45309">其实 O(L²) 没死,只换了个便宜约 9 倍的付账人,端到端只有 8.69×</text>
<rect x="40" y="67" width="15" height="13" rx="2" fill="#94a3b8"/>
<text x="60" y="78" text-anchor="start" font-family="sans-serif" font-size="11.5" font-weight="normal" fill="#64748b">稠密基线</text>
<rect x="114.8" y="67" width="15" height="13" rx="2" fill="#3b82f6"/>
<text x="134.8" y="78" text-anchor="start" font-family="sans-serif" font-size="11.5" font-weight="normal" fill="#64748b">主注意力(top-k 砍到的)</text>
<rect x="268.8" y="67" width="15" height="13" rx="2" fill="#d97706"/>
<text x="288.8" y="78" text-anchor="start" font-family="sans-serif" font-size="11.5" font-weight="normal" fill="#64748b">indexer(不砍·固定地板)</text>
<text x="40" y="104" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">以为(朴素心智模型)</text>
<text x="556" y="104" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">其实(真实成本账)</text>
<rect x="40" y="148" width="384" height="120" rx="4" fill="#94a3b8" stroke="#1e293b" stroke-width="1"/>
<text x="40" y="140" text-anchor="start" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#0f172a">稠密主注意力 · 每步 L 对</text>
<text x="232.0" y="213.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="white">L 对 × 73728 = 9.66×10⁹ MAC</text>
<line x1="232.0" y1="274" x2="232.0" y2="324" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<text x="246.0" y="294.0" text-anchor="start" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#334155">top-k：131072→512 对</text>
<text x="246.0" y="310.0" text-anchor="start" font-family="sans-serif" font-size="11.5" font-weight="normal" fill="#334155">宽度砍 256×</text>
<rect x="40" y="332" width="26" height="120" rx="4" fill="#3b82f6" stroke="#1e293b" stroke-width="1"/>
<text x="40" y="324" text-anchor="start" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#0f172a">主注意力</text>
<text x="74" y="447" text-anchor="start" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">3.77×10⁷ MAC · 只 512 对</text>
<rect x="40" y="476" width="384" height="42" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="232.0" y="503" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#b91c1c">以为 端到端 = 256×</text>
<rect x="556" y="148" width="26" height="120" rx="4" fill="#3b82f6" stroke="#1e293b" stroke-width="1"/>
<text x="556" y="140" text-anchor="start" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#0f172a">主注意力(同一条)</text>
<text x="590" y="263" text-anchor="start" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">3.77×10⁷ MAC</text>
<text x="748.0" y="359.5" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#64748b">＋</text>
<rect x="556" y="439" width="384" height="13" rx="3" fill="#d97706" stroke="#1e293b" stroke-width="1"/>
<text x="556" y="413" text-anchor="start" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#0f172a">lightning indexer · 仍每步 L 对 × 8192(约 1/9 单价)</text>
<text x="556" y="429" text-anchor="start" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#b45309">= 1.07×10⁹ MAC 固定地板(与 k 无关)</text>
<rect x="556" y="476" width="384" height="42" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="748.0" y="503" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#b45309">其实 端到端 = 8.69×</text>
<text x="490.0" y="152" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="normal" fill="#64748b">以为</text>
<text x="490.0" y="182" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#b91c1c">256×</text>
<line x1="490.0" y1="198" x2="490.0" y2="240" stroke="#b91c1c" stroke-width="3" marker-end="url(#ar)"/>
<text x="490.0" y="264" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="normal" fill="#64748b">其实</text>
<text x="490.0" y="294" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#b45309">8.69×</text>
<text x="490.0" y="418" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">O(L²) 没被消灭</text>
<text x="490.0" y="436" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="normal" fill="#0f172a">只换了便宜</text>
<text x="490.0" y="454" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">约 9 倍的付账人</text>
<text x="490.0" y="552" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="normal" fill="#64748b">高度=每对单价(到尺度:8192 是 73728 的约 1/9);宽度=当前 decode 步参与打分的对数——灰/琥珀同为每步全 L 对(体量没缩),蓝条 512 对真实约 1/256 宽、已放大以可见。</text>
<text x="490.0" y="570" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="normal" fill="#64748b">每步对 L 个候选打分 = O(L),L 步生成累积才成 O(L²)——图中乘法用的是当前步真实的 L 对(L×73728、L×8192),非 L²。精确 log 柱状见 §六 cost-model。</text>
</svg>