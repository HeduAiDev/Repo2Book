<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 406">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker></defs>
<rect width="810" height="406" fill="white"/>
<text x="30" y="30" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e40af">O(L^2) 注意力税:点积总数随序列长二次增长</text>
<text x="30" y="50" font-family="sans-serif" font-size="12" fill="#64748b">标准因果注意力 T(L) = L(L+1)/2 次 q·k 点积;每次 L 翻倍,代价约变 4 倍(非线性 2 倍)</text>
<rect x="180" y="100" width="142" height="30" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="251.0" y="119.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="white" font-weight="bold">L=4</text>
<rect x="330" y="100" width="142" height="30" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="401.0" y="119.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="white" font-weight="bold">L=8</text>
<rect x="480" y="100" width="142" height="30" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="551.0" y="119.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="white" font-weight="bold">L=16</text>
<rect x="630" y="100" width="142" height="30" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="701.0" y="119.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="white" font-weight="bold">L=32</text>
<text x="164" y="165.0" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="bold" fill="#374151">点积总数 T(L)</text>
<text x="251.0" y="166.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#374151" >10</text>
<text x="401.0" y="166.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#374151" >36</text>
<text x="551.0" y="166.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#374151" >136</text>
<text x="701.0" y="166.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#374151" >528</text>
<text x="164" y="215.0" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="bold" fill="#374151">相对 L=4 倍数</text>
<text x="251.0" y="216.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#374151" >1.0x</text>
<text x="401.0" y="216.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#374151" >3.6x</text>
<text x="551.0" y="216.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#374151" >13.6x</text>
<text x="701.0" y="216.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#374151" >52.8x</text>
<text x="164" y="265.0" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="bold" fill="#374151">翻倍增长比</text>
<text x="251.0" y="266.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#374151" >—</text>
<rect x="330" y="240" width="142" height="42" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="401.0" y="266.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#b91c1c" font-weight="bold" >3.6x</text>
<rect x="480" y="240" width="142" height="42" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="551.0" y="266.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#b91c1c" font-weight="bold" >3.78x</text>
<rect x="630" y="240" width="142" height="42" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="701.0" y="266.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#b91c1c" font-weight="bold" >3.88x</text>
<rect x="30" y="312" width="750" height="46" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="46" y="332" font-family="sans-serif" font-size="13" font-weight="bold" fill="#92400e">落地 L=131072(128K 上下文):T(L) = 8.59×10⁹ 次 q·k 点积/层</text>
<text x="46" y="350" font-family="sans-serif" font-size="11.5" fill="#92400e">论文估 64K 解码时注意力已占端到端 70–80% 延迟 —— 必须稀疏化的定量动机</text>
<text x="30" y="392" font-family="sans-serif" font-size="11" fill="#64748b">每翻一倍 L,点积数趋于变 4 倍(3.6→3.78→3.88x)——Θ(L²) 的指纹,不可能靠常数因子降成线性</text>
</svg>