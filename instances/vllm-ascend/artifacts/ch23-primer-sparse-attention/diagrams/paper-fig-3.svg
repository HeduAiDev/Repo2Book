<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 690">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker><marker id="ag" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#16a34a"/></marker></defs>
<rect width="1150" height="690" fill="white"/>
<text x="40" y="34" font-family="sans-serif" font-size="18" font-weight="bold" fill="#0f172a">DSA 在 MLA 之下如何运作:indexer 打分 → Top-k 选出跨头一致的 latent KV → 核心注意力</text>
<text x="40" y="56" font-family="sans-serif" font-size="12.5" fill="#64748b">自底向上:Input Hidden 并行喂入主分支(MLA 投影)与 indexer 分支(绿);两分支汇入 Top-k Selector(绿=被选中);最终喂入 Multi-Query 核心注意力</text>
<rect x="150.0" y="620.0" width="900" height="56" rx="7" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.6"/>
<text x="600.0" y="653.0" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#0f172a">Input Hidden h_t</text>
<line x1="380.0" y1="620.0" x2="380.0" y2="578.0" stroke="#1e3a8a" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="820.0" y1="620.0" x2="820.0" y2="578.0" stroke="#16a34a" stroke-width="1.6" marker-end="url(#ag)"/>
<rect x="230.0" y="522.0" width="300" height="56" rx="7" fill="#3b82f6" stroke="#1e3a8a" stroke-width="1.6"/>
<text x="380.0" y="547.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="white">MLA 下投影</text>
<text x="380.0" y="563.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="normal" fill="white">c_t^Q, c_t^KV, k_t^R(部分 apply RoPE)</text>
<rect x="670.0" y="522.0" width="300" height="56" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
<text x="820.0" y="547.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#166534">indexer 投影</text>
<text x="820.0" y="563.0" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="normal" fill="#166534">q_{t,j}^I, k_t^I, w_{t,j}^I(部分 RoPE)</text>
<line x1="380.0" y1="522.0" x2="380.0" y2="480.0" stroke="#1e3a8a" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="820.0" y1="522.0" x2="820.0" y2="480.0" stroke="#16a34a" stroke-width="1.6" marker-end="url(#ag)"/>
<rect x="227.0" y="424.0" width="145" height="56" rx="7" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.6"/>
<text x="299.5" y="449.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#1e3a8a">concat</text>
<text x="299.5" y="465.0" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="normal" fill="#1e3a8a">[q_{t,i}^A; q_{t,i}^R]</text>
<rect x="388.0" y="424.0" width="145" height="56" rx="7" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.6"/>
<text x="460.5" y="449.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#1e3a8a">concat</text>
<text x="460.5" y="465.0" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="normal" fill="#1e3a8a">[c_t^KV; k_t^R]</text>
<rect x="670.0" y="424.0" width="300" height="56" rx="7" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.6"/>
<text x="820.0" y="449.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#166534">Lightning Indexer</text>
<text x="820.0" y="465.0" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="normal" fill="#166534">I_{t,s} = Σ_j w^I·ReLU(q^I·k^I)</text>
<line x1="299.5" y1="424.0" x2="299.5" y2="382.0" stroke="#1e3a8a" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="460.5" y1="424.0" x2="460.5" y2="382.0" stroke="#1e3a8a" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="820.0" y1="424.0" x2="820.0" y2="382.0" stroke="#16a34a" stroke-width="1.6" marker-end="url(#ag)"/>
<polygon points="170.0,382.0 1030.0,382.0 910.0,326.0 290.0,326.0" fill="#86efac" stroke="#16a34a" stroke-width="1.8"/>
<text x="600.0" y="348.0" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#14532d">Top-k Selector</text>
<text x="600.0" y="366.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#14532d">只留 I_{t,s} ∈ Top-k(I_{t,:}) 的 latent KV 条目 c_s(绿=被选中)</text>
<line x1="600.0" y1="326.0" x2="600.0" y2="284.0" stroke="#16a34a" stroke-width="1.6" marker-end="url(#ag)"/>
<rect x="275.0" y="228.0" width="650" height="56" rx="7" fill="#94a3b8" stroke="#334155" stroke-width="1.6"/>
<text x="600.0" y="253.0" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="white">Multi-Query Attention (Core Attention)</text>
<text x="600.0" y="269.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="normal" fill="white">u_t = Attn(h_t, {c_s | 被选中})</text>
<line x1="600.0" y1="228.0" x2="600.0" y2="186.0" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="450.0" y="130.0" width="300" height="56" rx="7" fill="#0f172a" stroke="#0f172a" stroke-width="1.6"/>
<text x="600.0" y="163.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="white">Output Hidden u_t</text>
<text x="40" y="318.0" font-family="sans-serif" font-size="11" fill="#64748b">← 主分支携带的是 latent KV [c_t^KV;k_t^R](MQA 下全部 query 头共享)</text>
</svg>