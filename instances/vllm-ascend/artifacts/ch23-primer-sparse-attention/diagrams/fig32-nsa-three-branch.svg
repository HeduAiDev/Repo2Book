<text x="365.0" y="350" text-anchor="middle" font-family="sans-serif" font-size="13" fill="white" font-weight="bold">o_t* = Σ_c g_t^c · Attn(q_t, K̃^c, Ṽ^c)</text>
<text x="365.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#93c5fd">门控和 = 1.0 (0.2+0.5+0.3)</text>
<rect x="40" y="392" width="650" height="52" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="56" y="414" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#047857">t=64 → N_t=16(4+8+4), 稀疏比 0.25 ｜ t=1024 → N_t=32(8+16+8), 稀疏比 0.0312</text>
<text x="56" y="432" font-family="sans-serif" font-size="11.5" fill="#047857">t 涨 16 倍,N_t 只涨 2 倍——支路预算不随 t 线性扩张,稀疏比随 t 增大单调趋 0</text>
