<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 400">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker></defs>
<rect width="970" height="400" fill="white"/>
<text x="40" y="26" font-family="sans-serif" font-size="15.5" font-weight="bold" fill="#1e40af">DSA 加速账两笔:主注意力 256x 是真的,但 indexer 固定开销把端到端拉到 8.69x</text>
<text x="40" y="48" font-family="sans-serif" font-size="12" fill="#64748b">k=512, L=131072;条形长度 = log10(MAC),数字为真实 MAC 计数</text>
<text x="210.0" y="114" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#0f172a">只看主注意力</text>
<text x="40" y="124" font-family="sans-serif" font-size="11.5" fill="#374151">稠密主注意力</text>
<rect x="40" y="130" width="304.76190476190476" height="40" rx="5" fill="#94a3b8" stroke="#1e293b" stroke-width="1"/>
<text x="352.76190476190476" y="155.0" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">9,663,676,416</text>
<text x="40" y="194" font-family="sans-serif" font-size="11.5" fill="#374151">稀疏主注意力 (k=512)</text>
<rect x="40" y="200" width="231.25871661815034" height="40" rx="5" fill="#3b82f6" stroke="#1e293b" stroke-width="1"/>
<text x="279.25871661815034" y="225.0" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">37,748,736</text>
<rect x="40" y="274" width="320" height="44" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="200.0" y="301" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1d4ed8">主注意力加速 = 256x</text>
<text x="630.0" y="114" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#0f172a">算上 indexer 固定开销</text>
<text x="460" y="124" font-family="sans-serif" font-size="11.5" fill="#374151">稀疏主注意力</text>
<rect x="460" y="130" width="231.25871661815034" height="40" rx="5" fill="#3b82f6" stroke="#1e293b" stroke-width="1"/>
<text x="699.2587166181504" y="155.0" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">37,748,736</text>
<text x="460" y="194" font-family="sans-serif" font-size="11.5" fill="#374151">+ indexer(固定)</text>
<rect x="460" y="200" width="275.6369555390791" height="40" rx="5" fill="#d97706" stroke="#1e293b" stroke-width="1"/>
<text x="743.636955539079" y="225.0" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">1,073,741,824</text>
<rect x="460" y="274" width="320" height="44" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="620.0" y="301" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#b45309">端到端加速 = 8.69x</text>
<line x1="390" y1="296" x2="430" y2="296" stroke="#d97706" stroke-width="2.5" marker-end="url(#a)"/>
<text x="485.0" y="384" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#64748b">indexer 花 1.07×10⁹ MAC 且仍 O(L²)——k=2048 时端到端为 7.89x;主注意力加速 ≠ 总加速</text>
</svg>