<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 430">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker></defs>
<rect width="840" height="430" fill="white"/>
<text x="40" y="34" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e40af">CSA 块窗口重叠 vs HCA 块源区间不相交</text>
<text x="40" y="54" font-family="sans-serif" font-size="12" fill="#64748b">n=8 个 token;CSA 相邻块借用边界 token,HCA(压缩率 128 远大于 CSA 的 4)源区间完全不重叠</text>
<text x="210.0" y="88" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">左:CSA —— 块1 窗口借用块0 的 token</text>
<rect x="46.0" y="130" width="34" height="34" rx="5" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="63.0" y="152.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">0</text>
<rect x="88.0" y="130" width="34" height="34" rx="5" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="105.0" y="152.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">1</text>
<rect x="130.0" y="130" width="34" height="34" rx="5" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="147.0" y="152.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">2</text>
<rect x="172.0" y="130" width="34" height="34" rx="5" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="189.0" y="152.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">3</text>
<rect x="214.0" y="130" width="34" height="34" rx="5" fill="#059669" stroke="#065f46" stroke-width="1.5"/>
<text x="231.0" y="152.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">4</text>
<rect x="256.0" y="130" width="34" height="34" rx="5" fill="#059669" stroke="#065f46" stroke-width="1.5"/>
<text x="273.0" y="152.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">5</text>
<rect x="298.0" y="130" width="34" height="34" rx="5" fill="#059669" stroke="#065f46" stroke-width="1.5"/>
<text x="315.0" y="152.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">6</text>
<rect x="340.0" y="130" width="34" height="34" rx="5" fill="#059669" stroke="#065f46" stroke-width="1.5"/>
<text x="357.0" y="152.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">7</text>
<path d="M 46.0 178 L 46.0 186 L 206.0 186 L 206.0 178" fill="none" stroke="#1e3a5f" stroke-width="2"/>
<text x="126.0" y="202" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e3a5f">块0 窗口:token 0-3</text>
<path d="M 46.0 220 L 46.0 228 L 374.0 228 L 374.0 220" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="5,3"/>
<text x="210.0" y="244" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#d97706">块1 窗口:借 token 0-3 + 本块 token 4-7(8 个位置,重叠)</text>
<rect x="40" y="260" width="340" height="46" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="210.0" y="280" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#1e40af">相邻块索引交叠</text>
<text x="210.0" y="298" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">但净压缩率仍 1/m(=1/4),而非 1/(2m)</text>
<text x="630.0" y="88" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">右:HCA —— 块间源区间互不相交</text>
<rect x="466.0" y="130" width="34" height="34" rx="5" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="483.0" y="152.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">0</text>
<rect x="508.0" y="130" width="34" height="34" rx="5" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="525.0" y="152.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">1</text>
<rect x="550.0" y="130" width="34" height="34" rx="5" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="567.0" y="152.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">2</text>
<rect x="592.0" y="130" width="34" height="34" rx="5" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="609.0" y="152.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">3</text>
<rect x="634.0" y="130" width="34" height="34" rx="5" fill="#7c3aed" stroke="#4c1d95" stroke-width="1.5"/>
<text x="651.0" y="152.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">4</text>
<rect x="676.0" y="130" width="34" height="34" rx="5" fill="#7c3aed" stroke="#4c1d95" stroke-width="1.5"/>
<text x="693.0" y="152.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">5</text>
<rect x="718.0" y="130" width="34" height="34" rx="5" fill="#7c3aed" stroke="#4c1d95" stroke-width="1.5"/>
<text x="735.0" y="152.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">6</text>
<rect x="760.0" y="130" width="34" height="34" rx="5" fill="#7c3aed" stroke="#4c1d95" stroke-width="1.5"/>
<text x="777.0" y="152.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">7</text>
<path d="M 466.0 178 L 466.0 186 L 626.0 186 L 626.0 178" fill="none" stroke="#1e3a5f" stroke-width="2"/>
<text x="546.0" y="202" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e3a5f">块0 源区间:token 0-3</text>
<path d="M 634.0 178 L 634.0 186 L 794.0 186 L 794.0 178" fill="none" stroke="#4c1d95" stroke-width="2"/>
<text x="714.0" y="202" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#4c1d95">块1 源区间:token 4-7</text>
<rect x="460" y="260" width="340" height="46" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="630.0" y="280" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#7c3aed">区间完全不相交(overlap=false)</text>
<text x="630.0" y="298" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">真实 m'=128(此例缩为 4);块少故省略重叠收益</text>
<line x1="388" y1="147.0" x2="448" y2="147.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
<text x="418" y="137.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#94a3b8">对比</text>
<rect x="40" y="320" width="760" height="66" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="56" y="342" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#92400e">HCA 之后不做 top-k:稠密 MQA attend 全部 2 个压缩块(num_kv_entries_attended=2)</text>
<text x="56" y="362" font-family="sans-serif" font-size="11.5" fill="#92400e">压缩率 128 大到块数极少时,选择的收益(省 top-k)小于代价(可能漏选),故 HCA 索性全 attend</text>
<text x="56" y="380" font-family="sans-serif" font-size="11.5" fill="#92400e">CSA(压缩率 4)块数仍多,重叠窗口 + top-k 两件事都做;HCA(压缩率 128)块数已少,两件事都省</text>
</svg>