<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1058 394">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker></defs>
<rect width="1058" height="394" fill="white"/>
<text x="40" y="24" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e40af">MLA -&gt; DSA -&gt; CSA/HCA:三代压缩沿正交轴推进,V4 把前两条线叠加</text>
<text x="40" y="44" font-family="sans-serif" font-size="12" fill="#64748b">每一代压缩的是不同的一维;轴彼此正交,故可以逐代叠加而不冲突</text>
<circle cx="145.0" cy="104" r="13" fill="#2563eb"/>
<text x="145.0" y="109" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="white">1</text>
<rect x="40" y="130" width="210" height="74" rx="8" fill="#2563eb" stroke="#1e293b" stroke-width="1.5"/>
<text x="145.0" y="154" text-anchor="middle" font-family="sans-serif" font-size="16" fill="white" font-weight="bold">MLA</text>
<text x="145.0" y="174" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#e2e8f0">压 KV 维度到低秩 latent</text>
<rect x="40" y="230" width="210" height="34" rx="5" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/>
<text x="145.0" y="252" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#2563eb" font-weight="bold">轴:每 token 的 KV 维度</text>
<text x="145.0" y="282" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#94a3b8">第31章</text>
<line x1="250" y1="167.0" x2="296" y2="167.0" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<circle cx="401.0" cy="104" r="13" fill="#7c3aed"/>
<text x="401.0" y="109" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="white">2</text>
<rect x="296" y="130" width="210" height="74" rx="8" fill="#7c3aed" stroke="#1e293b" stroke-width="1.5"/>
<text x="401.0" y="154" text-anchor="middle" font-family="sans-serif" font-size="16" fill="white" font-weight="bold">DSA</text>
<text x="401.0" y="174" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#e2e8f0">lightning indexer +</text>
<text x="401.0" y="190" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#e2e8f0">top-k 稀疏选块</text>
<rect x="296" y="230" width="210" height="34" rx="5" fill="#f8fafc" stroke="#7c3aed" stroke-width="1.5"/>
<text x="401.0" y="252" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#7c3aed" font-weight="bold">轴:看哪些 token</text>
<text x="401.0" y="282" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#94a3b8">第32章</text>
<line x1="506" y1="167.0" x2="552" y2="167.0" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<circle cx="657.0" cy="104" r="13" fill="#059669"/>
<text x="657.0" y="109" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="white">3</text>
<rect x="552" y="130" width="210" height="74" rx="8" fill="#059669" stroke="#1e293b" stroke-width="1.5"/>
<text x="657.0" y="154" text-anchor="middle" font-family="sans-serif" font-size="16" fill="white" font-weight="bold">CSA</text>
<text x="657.0" y="174" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#e2e8f0">每 m=4 token 压 1 条</text>
<text x="657.0" y="190" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#e2e8f0">+ DSA top-k 稀疏</text>
<rect x="552" y="230" width="210" height="34" rx="5" fill="#f8fafc" stroke="#059669" stroke-width="1.5"/>
<text x="657.0" y="252" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#059669" font-weight="bold">轴:序列长度 + 复用选块</text>
<text x="657.0" y="282" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#94a3b8">本章</text>
<line x1="762" y1="167.0" x2="808" y2="167.0" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<circle cx="913.0" cy="104" r="13" fill="#d97706"/>
<text x="913.0" y="109" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="white">4</text>
<rect x="808" y="130" width="210" height="74" rx="8" fill="#d97706" stroke="#1e293b" stroke-width="1.5"/>
<text x="913.0" y="154" text-anchor="middle" font-family="sans-serif" font-size="16" fill="white" font-weight="bold">HCA</text>
<text x="913.0" y="174" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#e2e8f0">每 m'=128 token 压 1 条</text>
<text x="913.0" y="190" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#e2e8f0">+ 稠密 MQA</text>
<rect x="808" y="230" width="210" height="34" rx="5" fill="#f8fafc" stroke="#d97706" stroke-width="1.5"/>
<text x="913.0" y="252" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#d97706" font-weight="bold">轴:序列长度(更狠)</text>
<text x="913.0" y="282" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#94a3b8">本章</text>
<path d="M 552 282 L 552 292 L 1018 292 L 1018 282" fill="none" stroke="#b91c1c" stroke-width="2"/>
<rect x="595.0" y="300" width="380" height="52" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="785.0" y="320" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#b91c1c">V4 合流:CSA = 压序列长 + DSA 稀疏选块</text>
<text x="785.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#b91c1c">HCA = 更狠压序列长 + 稠密 —— 两条老线叠加,不是推倒重来</text>
<text x="40" y="380" font-family="sans-serif" font-size="11" fill="#64748b">三代各压不同一维(KV维/选哪些/序列长),彼此正交故可叠加;CSA、HCA 都建在 MLA 的低秩 latent 与 DSA 的稀疏机制之上</text>
</svg>