<text x="841.0" y="164.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#374151" >4.0</text>
<text x="244" y="209.0" text-anchor="end" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#374151">head1·key</text>
<text x="321.0" y="210.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#374151" >0.0</text>
<text x="451.0" y="210.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#374151" >3.0</text>
<text x="581.0" y="210.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#374151" >-1.0</text>
<text x="711.0" y="210.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#374151" >1.0</text>
<text x="841.0" y="210.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#374151" >1.0</text>
<text x="244" y="255.0" text-anchor="end" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#374151">ReLU 后加权分 I(t,s)</text>
<rect x="260" y="232" width="122" height="38" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="321.0" y="256.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#64748b" font-weight="bold" >2.0</text>
<rect x="390" y="232" width="122" height="38" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
<text x="451.0" y="256.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#047857" font-weight="bold" >3.0</text>
<rect x="520" y="232" width="122" height="38" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="581.0" y="256.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#b91c1c" font-weight="bold" >0.0</text>
<rect x="650" y="232" width="122" height="38" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="711.0" y="256.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#64748b" font-weight="bold" >2.0</text>
<rect x="780" y="232" width="122" height="38" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
<text x="841.0" y="256.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#047857" font-weight="bold" >5.0</text>
<text x="244" y="301.0" text-anchor="end" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#374151">入选 top-2?</text>
<rect x="260" y="278" width="122" height="38" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="321.0" y="302.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#94a3b8" font-weight="bold" >否</text>
<rect x="390" y="278" width="122" height="38" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
<text x="451.0" y="302.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#047857" font-weight="bold" >是</text>
<rect x="520" y="278" width="122" height="38" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="581.0" y="302.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#94a3b8" font-weight="bold" >否</text>
<rect x="650" y="278" width="122" height="38" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="711.0" y="302.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#94a3b8" font-weight="bold" >否</text>
<rect x="780" y="278" width="122" height="38" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
<text x="841.0" y="302.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#047857" font-weight="bold" >是</text>
<rect x="30" y="346" width="880" height="66" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="46" y="368" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#92400e">块4(分 5.0)与块1(分 3.0)胜出;块2 两头点积皆为 -1.0,ReLU 清零后得分 0.0 被淘汰</text>
<text x="46" y="388" font-family="sans-serif" font-size="11.5" fill="#92400e">top-k=2 让每个 query 实际参与核注意力的块数固定为 min(k, 候选数),不随上下文长度增长</text>
<text x="46" y="406" font-family="sans-serif" font-size="11.5" fill="#92400e">选中率 2/5 —— 核注意力代价从 O(L/m) 个候选降到固定 O(k),与序列长完全解耦</text>
</svg>