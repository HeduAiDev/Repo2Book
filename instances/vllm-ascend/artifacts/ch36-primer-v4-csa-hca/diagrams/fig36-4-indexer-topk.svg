<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 450">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker></defs>
<rect width="940" height="450" fill="white"/>
<text x="30" y="30" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e40af">Lightning Indexer:ReLU 加权内积打分,top-k 只留最高的 k 个块</text>
<text x="30" y="50" font-family="sans-serif" font-size="12" fill="#64748b">n_heads_idx=2, k=2, num_candidates=5;score = Σ_head ReLU(head_dot) (等权求和示例)</text>
<rect x="260" y="100" width="122" height="30" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="321.0" y="119.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="white" font-weight="bold">块0</text>
<rect x="390" y="100" width="122" height="30" rx="3" fill="#059669" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="451.0" y="119.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="white" font-weight="bold">块1</text>
<rect x="520" y="100" width="122" height="30" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="581.0" y="119.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="white" font-weight="bold">块2</text>
<rect x="650" y="100" width="122" height="30" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="711.0" y="119.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="white" font-weight="bold">块3</text>
<rect x="780" y="100" width="122" height="30" rx="3" fill="#059669" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="841.0" y="119.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="white" font-weight="bold">块4</text>
<text x="244" y="163.0" text-anchor="end" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#374151">head0·key</text>
<text x="321.0" y="164.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#374151" >2.0</text>
<text x="451.0" y="164.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#374151" >0.0</text>
