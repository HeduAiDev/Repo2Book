<text x="46" y="364" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#92400e">再叠混合精度存储:每条目 192.0 字节(RoPE维BF16+其余FP8) vs 纯 BF16 256.0 字节 = 0.75</text>
<text x="46" y="382" font-family="sans-serif" font-size="11.5" fill="#92400e">压序列长(0.1895) x 低精度(0.75) —— 两笔账相乘,KV 又近乎减半</text>
<rect x="30" y="406" width="850" height="66" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="46" y="428" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#b91c1c">论文口径:27% FLOPs / 10% KV(§1);与本例 0.3795 / 0.1895 方向一致但不是同一数字</text>
<text x="46" y="448" font-family="sans-serif" font-size="11.5" fill="#b91c1c">本例用示意 compress_ratios 与训练态 k/n_win 验证账本模型自洽、hybrid 确实双优于两条基线</text>
<text x="46" y="466" font-family="sans-serif" font-size="11.5" fill="#b91c1c">论文的具体百分比需 DeepSeek 未公开的完整逐层配置 + 低精度细节才能精确复现</text>
