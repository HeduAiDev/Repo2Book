<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 490">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#b91c1c"/></marker><marker id="ao" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#d97706"/></marker></defs>
<rect width="980" height="490" fill="white"/>
<text x="40" y="32" font-family="sans-serif" font-size="18" font-weight="bold" fill="#0f172a">重活 N 次 → 1 次：块内依赖不必重跑整座骨干</text>
<text x="40" y="54" font-family="sans-serif" font-size="12.5" fill="#475569">纯序列起草每个 token 都要一次完整 Transformer 前向；DSpark 一次并行前向出整块，块内依赖只补 N 片 O(Vr) 低秩偏置</text>
<text x="220.0" y="100" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#b91c1c">朴素：纯序列起草（EAGLE / MTP）</text>
<rect x="100.0" y="128" width="240" height="64" rx="7" fill="#fecaca" stroke="#b91c1c" stroke-width="2.4"/>
<line x1="100.0" y1="149.33333333333334" x2="340.0" y2="149.33333333333334" stroke="#fca5a5" stroke-width="1"/>
<line x1="100.0" y1="170.66666666666666" x2="340.0" y2="170.66666666666666" stroke="#fca5a5" stroke-width="1"/>
<text x="220.0" y="157.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#b91c1c">完整 Transformer 前向 #0</text>
<text x="220.0" y="175.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#b91c1c">一整层解码器栈</text>
<line x1="220.0" y1="192" x2="220.0" y2="218" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#a)"/>
<text x="228.0" y="209.0" font-family="sans-serif" font-size="10.5" fill="#b91c1c">等上一个草稿 token</text>
<rect x="100.0" y="222" width="240" height="64" rx="7" fill="#fecaca" stroke="#b91c1c" stroke-width="2.4"/>
<line x1="100.0" y1="243.33333333333334" x2="340.0" y2="243.33333333333334" stroke="#fca5a5" stroke-width="1"/>
<line x1="100.0" y1="264.6666666666667" x2="340.0" y2="264.6666666666667" stroke="#fca5a5" stroke-width="1"/>
<text x="220.0" y="251.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#b91c1c">完整 Transformer 前向 #1</text>
<text x="220.0" y="269.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#b91c1c">一整层解码器栈</text>
<line x1="220.0" y1="286" x2="220.0" y2="312" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#a)"/>
<text x="228.0" y="303.0" font-family="sans-serif" font-size="10.5" fill="#b91c1c">等上一个草稿 token</text>
<rect x="100.0" y="316" width="240" height="64" rx="7" fill="#fecaca" stroke="#b91c1c" stroke-width="2.4"/>
<line x1="100.0" y1="337.3333333333333" x2="340.0" y2="337.3333333333333" stroke="#fca5a5" stroke-width="1"/>
<line x1="100.0" y1="358.6666666666667" x2="340.0" y2="358.6666666666667" stroke="#fca5a5" stroke-width="1"/>
<text x="220.0" y="345.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#b91c1c">完整 Transformer 前向 #2</text>
<text x="220.0" y="363.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#b91c1c">一整层解码器栈</text>
<text x="220.0" y="402" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#b91c1c">N 次串行完整骨干前向</text>
<text x="700.0" y="100" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#15803d">DSpark：1 次并行前向 + N 片低秩偏置</text>
<rect x="580.0" y="128" width="240" height="64" rx="7" fill="#bbf7d0" stroke="#15803d" stroke-width="2.4"/>
<line x1="580.0" y1="149.33333333333334" x2="820.0" y2="149.33333333333334" stroke="#86efac" stroke-width="1"/>
<line x1="580.0" y1="170.66666666666666" x2="820.0" y2="170.66666666666666" stroke="#86efac" stroke-width="1"/>
<text x="700.0" y="157.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#15803d">1 次非因果并行前向</text>
<text x="700.0" y="175.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#15803d">一次出 U_0,U_1,U_2（块内互见）</text>
<rect x="580.0" y="218" width="240" height="16" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="588.0" y="230.0" font-family="sans-serif" font-size="10" fill="#1d4ed8">第 0 位：O(Vr) 低秩偏置修正</text>
<rect x="580.0" y="242" width="240" height="16" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="588.0" y="254.0" font-family="sans-serif" font-size="10" fill="#1d4ed8">第 1 位：O(Vr) 低秩偏置修正</text>
<rect x="580.0" y="266" width="240" height="16" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="588.0" y="278.0" font-family="sans-serif" font-size="10" fill="#1d4ed8">第 2 位：O(Vr) 低秩偏置修正</text>
<line x1="700.0" y1="192" x2="700.0" y2="215" stroke="#15803d" stroke-width="1.6" marker-end="url(#a)"/>
<text x="700.0" y="304" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#1d4ed8">块内依赖 = N 片 softmax 前的低秩偏置（markov_embed O(r) + markov_bias O(Vr)，r=256）</text>
<line x1="408" y1="160.0" x2="512" y2="160.0" stroke="#d97706" stroke-width="3.5" marker-end="url(#ao)"/>
<text x="460.0" y="146.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#d97706">重活 N 次</text>
<text x="460.0" y="184.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#d97706">→ 1 次</text>
<rect x="40" y="416" width="900" height="52" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
<text x="490.0" y="438" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#92400e">玩具尺度 V=4 · N=3 · r=2：右侧三步偏置修正共 24 次乘加，抵掉左侧 3 次完整层栈前向</text>
<text x="490.0" y="458" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#b45309">偏置片薄 vs 骨干块厚 ≈ O(Vr) vs 完整前向——省下的正是那 N-1 次重活</text>
</svg>