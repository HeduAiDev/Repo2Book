<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 518">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker><marker id="ao" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#d97706"/></marker></defs>
<rect width="980" height="518" fill="white"/>
<text x="40" y="34" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">转移偏置的低秩分解：省参数，不是近似 softmax</text>
<text x="40" y="56" font-family="sans-serif" font-size="12.5" fill="#475569">B(v,x&#8242;) 只是加到 softmax 之前的一个分数——分解方式不改变输出仍是合法分布这件事</text>
<text x="240.0" y="104" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#334155">朴素实现</text>
<rect x="140.0" y="118" width="200" height="200" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<line x1="173.33333333333334" y1="118" x2="173.33333333333334" y2="318" stroke="#fca5a5" stroke-width="0.8"/>
<line x1="140.0" y1="151.33333333333334" x2="340.0" y2="151.33333333333334" stroke="#fca5a5" stroke-width="0.8"/>
<line x1="206.66666666666669" y1="118" x2="206.66666666666669" y2="318" stroke="#fca5a5" stroke-width="0.8"/>
<line x1="140.0" y1="184.66666666666669" x2="340.0" y2="184.66666666666669" stroke="#fca5a5" stroke-width="0.8"/>
<line x1="240.0" y1="118" x2="240.0" y2="318" stroke="#fca5a5" stroke-width="0.8"/>
<line x1="140.0" y1="218.0" x2="340.0" y2="218.0" stroke="#fca5a5" stroke-width="0.8"/>
<line x1="273.33333333333337" y1="118" x2="273.33333333333337" y2="318" stroke="#fca5a5" stroke-width="0.8"/>
<line x1="140.0" y1="251.33333333333334" x2="340.0" y2="251.33333333333334" stroke="#fca5a5" stroke-width="0.8"/>
<line x1="306.66666666666663" y1="118" x2="306.66666666666663" y2="318" stroke="#fca5a5" stroke-width="0.8"/>
<line x1="140.0" y1="284.66666666666663" x2="340.0" y2="284.66666666666663" stroke="#fca5a5" stroke-width="0.8"/>
<text x="240.0" y="223.0" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#b91c1c">B(v, x&#8242;)</text>
<text x="240.0" y="344" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#b91c1c">V × V 转移矩阵</text>
<text x="240.0" y="364" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b91c1c">存算 O(V²)</text>
<text x="780.0" y="104" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#15803d">DSpark 低秩分解</text>
<rect x="610" y="118" width="46" height="200" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<rect x="904" y="118" width="46" height="200" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="633.0" y="336" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#15803d">W1</text>
<text x="633.0" y="352" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#15803d">markov_w1</text>
<text x="633.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#15803d">V × r</text>
<text x="927.0" y="336" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1d4ed8">W2</text>
<text x="927.0" y="352" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#1d4ed8">markov_w2</text>
<text x="927.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#1d4ed8">V × r</text>
<line x1="660" y1="218.0" x2="900" y2="218.0" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ao)"/>
<text x="780.0" y="202.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#d97706">瓶颈 r = 256</text>
<text x="780.0" y="236.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#d97706">e = W1[x&#8242;]（取行，r 维）</text>
<text x="780.0" y="388" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">embed(x&#8242;) 取 W1 一行 → bias(e) 与 W2 相乘投回词表</text>
<text x="780.0" y="408" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#15803d">B(v,x&#8242;) = (W2 · W1[x&#8242;]^T)_v ，存算 O(Vr)</text>
<line x1="350.0" y1="218.0" x2="602" y2="218.0" stroke="#d97706" stroke-width="2.5" marker-end="url(#ao)"/>
<text x="476.0" y="206.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#d97706">秩 ≤ r 分解</text>
<rect x="40" y="418" width="900" height="80" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="490.0" y="440" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1d4ed8">p_k = softmax(U_k + B_k) 仍是合法分布</text>
<text x="490.0" y="462" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#1d4ed8">→ 验证器以 min(1, q_k/p_k) 保留草稿：目标 q_k 在分子、草稿 p_k 在分母，零改动</text>
<text x="490.0" y="484" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#1d4ed8">低秩只是省了存 B 的方式，不是对 softmax 本身做近似</text>
</svg>