<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 448">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker><marker id="ag" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#15803d"/></marker></defs>
<rect width="980" height="448" fill="white"/>
<text x="36" y="34" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">半自回归：一次并行骨干前向 + N 步序列 Markov 修正</text>
<text x="36" y="54" font-family="sans-serif" font-size="12.5" fill="#475569">重活干一次（骨干），轻活干 N 次（Markov 头）——省下的正是 N 次完整前向 → 1 次</text>
<rect x="36" y="92" width="176" height="64" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="46" y="114" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1d4ed8">并行骨干</text>
<text x="46" y="132" font-family="sans-serif" font-size="11" fill="#1d4ed8">已落地</text>
<rect x="36" y="196" width="176" height="58" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/>
<text x="46" y="218" font-family="sans-serif" font-size="13" font-weight="bold" fill="#15803d">序列 Markov 头</text>
<text x="46" y="236" font-family="sans-serif" font-size="11" fill="#15803d">已落地</text>
<rect x="36" y="294" width="176" height="58" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
<text x="46" y="316" font-family="sans-serif" font-size="13" font-weight="bold" fill="#94a3b8">置信度头+调度器</text>
<text x="46" y="334" font-family="sans-serif" font-size="11" fill="#94a3b8">仅论文侧</text>
<text x="345.6666666666667" y="82" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#64748b">k=0（锚点）</text>
<text x="585.0" y="82" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#64748b">k=1</text>
<text x="824.3333333333334" y="82" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#64748b">k=2</text>
<rect x="232.0" y="92" width="706.0000000000001" height="64" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
<text x="585.0" y="118" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#1d4ed8">_run_model：1 次非因果前向（N 个 query 位置互相可见）</text>
<text x="585.0" y="138" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#1d4ed8">→ 一次性出 U_0, U_1, U_2（块内每个位置的基础 logits）</text>
<line x1="345.6666666666667" y1="156" x2="345.6666666666667" y2="188" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#a)"/>
<text x="351.6666666666667" y="172" font-family="sans-serif" font-size="10.5" fill="#1d4ed8">U_0</text>
<line x1="585.0" y1="156" x2="585.0" y2="188" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#a)"/>
<text x="591.0" y="172" font-family="sans-serif" font-size="10.5" fill="#1d4ed8">U_1</text>
<line x1="824.3333333333334" y1="156" x2="824.3333333333334" y2="188" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#a)"/>
<text x="830.3333333333334" y="172" font-family="sans-serif" font-size="10.5" fill="#1d4ed8">U_2</text>
<rect x="248.0" y="196" width="195.33333333333334" height="58" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
<text x="345.6666666666667" y="216" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#15803d">i=0: logits=U_0+B_0(prev)</text>
<text x="345.6666666666667" y="234" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#15803d">→ sample draft_0（O(Vr) 偏置 + O(r) 嵌入）</text>
<line x1="443.33333333333337" y1="225.0" x2="487.33333333333337" y2="225.0" stroke="#15803d" stroke-width="1.5" marker-end="url(#ag)"/>
<text x="465.33333333333337" y="219.0" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#15803d">prev</text>
<rect x="487.33333333333337" y="196" width="195.33333333333334" height="58" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
<text x="585.0" y="216" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#15803d">i=1: logits=U_1+B_1(prev)</text>
<text x="585.0" y="234" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#15803d">→ sample draft_1（O(Vr) 偏置 + O(r) 嵌入）</text>
<line x1="682.6666666666667" y1="225.0" x2="726.6666666666667" y2="225.0" stroke="#15803d" stroke-width="1.5" marker-end="url(#ag)"/>
<text x="704.6666666666667" y="219.0" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#15803d">prev</text>
<rect x="726.6666666666667" y="196" width="195.33333333333334" height="58" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
<text x="824.3333333333334" y="216" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#15803d">i=2: logits=U_2+B_2(prev)</text>
<text x="824.3333333333334" y="234" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#15803d">→ sample draft_2（O(Vr) 偏置 + O(r) 嵌入）</text>
<rect x="232.0" y="294" width="706.0000000000001" height="58" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,4"/>
<text x="585.0" y="318" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#64748b">c_k=sigmoid(...)（置信度）→ Algorithm 1 贪心早停调度</text>
<text x="585.0" y="338" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#94a3b8">confidence_head 权重被 load_weights 显式跳过；调度器无对应实现代码</text>
<line x1="585.0" y1="254" x2="585.0" y2="288" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="2,3"/>
<text x="593.0" y="274.0" font-family="sans-serif" font-size="10" fill="#94a3b8">（无实际连线）</text>
<text x="36" y="418" font-family="sans-serif" font-size="11.5" fill="#334155">本 PR #46995 @f5a8d73 已落地：骨干 + Markov 头（实线泳道）。置信度头与硬件感知调度器仅存在于论文侧（虚线泳道，前瞻，尚未合入本书 pin 的 v0.21.0）。</text>
</svg>