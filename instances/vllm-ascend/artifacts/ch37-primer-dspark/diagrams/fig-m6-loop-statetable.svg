<text x="593.0" y="405.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >B</text>
<text x="843.0" y="405.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >A</text>
<text x="206" y="451.0" text-anchor="end" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#374151">draft_i=argmax(logits_i)</text>
