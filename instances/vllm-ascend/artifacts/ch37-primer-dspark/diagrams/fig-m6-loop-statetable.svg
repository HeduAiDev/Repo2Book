<text x="32" y="494" font-family="sans-serif" font-size="12" fill="#374151">draft 序列 = B, C, D（锚点 A 出发）——三步 base argmax 本是 A/B/A，Markov 偏置逐位翻转成 B/C/D。</text>
<text x="32" y="514" font-family="sans-serif" font-size="11" fill="#64748b">红=本步 argmax 相对 base_logits 发生翻转（changed）；玩具值 V=4/N=3/r=2 便于心算，真实 r=256（file 摘要）</text>
