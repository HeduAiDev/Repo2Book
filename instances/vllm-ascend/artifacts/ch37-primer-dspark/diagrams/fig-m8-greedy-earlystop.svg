<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1174 642">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker></defs>
<rect width="1174" height="642" fill="white"/>
<text x="32" y="32" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e40af">硬件感知动态调度 Algorithm 1：贪心录取，吞吐首次下降即早停（论文机制）</text>
<text x="32" y="54" font-family="sans-serif" font-size="11.5" fill="#64748b">玩具 c=[.9,.8,.5,.4]（已用 host 纯 Python 复现）——本 PR #46995 快照无此调度器代码</text>
<rect x="262" y="108" width="212" height="34" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="368.0" y="129.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="white" font-weight="bold">k=1</text>
<rect x="482" y="108" width="212" height="34" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="588.0" y="129.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="white" font-weight="bold">k=2</text>
<rect x="702" y="108" width="212" height="34" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="808.0" y="129.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="white" font-weight="bold">k=3</text>
<rect x="922" y="108" width="212" height="34" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="1028.0" y="129.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="white" font-weight="bold">k=4</text>
<text x="246" y="175.0" text-anchor="end" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#374151">c_k（置信度）</text>
<text x="368.0" y="175.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#374151" >0.9</text>
<text x="588.0" y="175.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#374151" >0.8</text>
<text x="808.0" y="175.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#374151" >0.5</text>
<text x="1028.0" y="175.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#374151" >0.4</text>
<text x="246" y="221.0" text-anchor="end" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#374151">P_k=∏c_i（累计存活）</text>
<text x="368.0" y="221.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#374151" >0.9</text>
<text x="588.0" y="221.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#374151" >0.72</text>
<text x="808.0" y="221.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#374151" >0.36</text>
<text x="1028.0" y="221.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#374151" >0.144</text>
<text x="246" y="267.0" text-anchor="end" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#374151">τ(k)=ΣP_i（期望接受数）</text>
<text x="368.0" y="267.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#374151" >0.9</text>
<text x="588.0" y="267.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#374151" >1.62</text>
<text x="808.0" y="267.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#374151" >1.98</text>
<text x="1028.0" y="267.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#374151" >2.124</text>
<text x="246" y="313.0" text-anchor="end" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#374151">SPS(k)（每秒步数）</text>
<text x="368.0" y="313.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#374151" >100.0</text>
<text x="588.0" y="313.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#374151" >90.0</text>
<text x="808.0" y="313.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#374151" >75.0</text>
<text x="1028.0" y="313.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#374151" >55.0</text>
<text x="246" y="359.0" text-anchor="end" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#374151">Θ=τ·SPS</text>
<text x="368.0" y="359.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#374151" >90</text>
<text x="588.0" y="359.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#374151" >145.8</text>
<text x="808.0" y="359.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#374151" >148.5</text>
<text x="1028.0" y="359.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#374151" >116.8</text>
<text x="246" y="405.0" text-anchor="end" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#374151">决策</text>
<rect x="262" y="382" width="212" height="38" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="368.0" y="405.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#15803d" font-weight="bold" >录取（Θ↑）</text>
<rect x="482" y="382" width="212" height="38" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="588.0" y="405.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#15803d" font-weight="bold" >录取（Θ↑）</text>
<rect x="702" y="382" width="212" height="38" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="808.0" y="405.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#b45309" font-weight="bold" >录取（Θ↑，达峰）</text>
<rect x="922" y="382" width="212" height="38" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="1028.0" y="405.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#b91c1c" font-weight="bold" >早停（Θ↓）→ 录取 3</text>
<text x="32" y="450" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#374151">吞吐 Θ 趋势（k=3 达峰，k=4 跌落触发早停）</text>
<polyline points="368.0,491.6 588.0,465.3 808.0,464.0 1028.0,478.9" fill="none" stroke="#1d4ed8" stroke-width="2"/>
<circle cx="368.0" cy="491.6" r="5" fill="#15803d"/>
<text x="368.0" y="481.6" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#15803d">90</text>
<circle cx="588.0" cy="465.3" r="5" fill="#15803d"/>
<text x="588.0" y="455.3" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#15803d">145.8</text>
<circle cx="808.0" cy="464.0" r="5" fill="#b45309"/>
<text x="808.0" y="454.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#b45309">148.5</text>
<circle cx="1028.0" cy="478.9" r="5" fill="#b91c1c"/>
<text x="1028.0" y="468.9" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#b91c1c">116.8</text>
<text x="32" y="564" font-family="sans-serif" font-size="12" fill="#374151">动态早停 148.5 / 盲取满 N=4 的 116.8 ≈ 1.271×；/ 保守只取 1 的 90 ≈ 1.65×。</text>
<text x="32" y="584" font-family="sans-serif" font-size="11" fill="#64748b">此为论文 Algorithm 1 机制；本 PR #46995 快照未实现调度器，DSparkSpeculator 每步固定生产 N 个草稿 token，无早停分支。</text>
<rect x="32" y="598" width="1110" height="40" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5,3"/>
<text x="44" y="620" font-family="sans-serif" font-size="11" fill="#475569">因果闸门（论文 Appendix A 反例，未独立复现）：若调度允许回看目标模型验证结果，会把目标分布 (0.7, 0.3) 系统性偏成 (0.85, 0.15)——故早停只能用已产生的单调信息。</text>
</svg>