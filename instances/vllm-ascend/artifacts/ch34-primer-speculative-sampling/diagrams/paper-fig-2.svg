<text x="34" y="34" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1e40af">arXiv:2211.17192 Fig.2 重绘：期望接受 token 数 E[#tokens] 随 α 变化，按 γ 分族</text>
<text x="34" y="55" font-family="sans-serif" font-size="12.5" fill="#64748b">E[#tokens] = (1 - α^(γ+1)) / (1 - α)；γ→∞ 时收敛到上界 1/(1-α)（α=0.9 处恰为 10）</text>
