<text x="34" y="34" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e40af">墙钟加速比 = (1 - alpha^(gamma+1)) / ((1-alpha)(gamma*c+1))</text>
<text x="34" y="54" font-family="sans-serif" font-size="12" fill="#64748b">c = 每个草稿 token 相对目标步的相对开销;前两行复现论文 Table 1(c=0),第三行加入现实开销 c=0.05</text>
