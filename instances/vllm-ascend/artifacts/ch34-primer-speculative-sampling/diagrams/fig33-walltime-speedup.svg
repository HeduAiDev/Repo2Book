<text x="661.0" y="280.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" >最优 gamma;下界 1.714X</text>
<text x="34" y="328" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">草稿开销可忽略时(c=0):alpha=0.8,gamma=5 -&gt; 3.689X;alpha=0.9,gamma=10 -&gt; 6.862X</text>
<text x="34" y="348" font-family="sans-serif" font-size="11" fill="#64748b">加入现实开销 c=0.05 后最优点移到 gamma=8,得 3.092X,仍远高于 Corollary 3.9 下界 (1+alpha)/(1+c)=1.714X</text>
</svg>