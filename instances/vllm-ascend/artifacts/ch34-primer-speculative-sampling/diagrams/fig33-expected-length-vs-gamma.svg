<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 828 442">
<rect width="828" height="442" fill="white"/>
<text x="34" y="34" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e40af">期望接受 token 数随 gamma 饱和(alpha=0.8)</text>
<text x="34" y="54" font-family="sans-serif" font-size="12" fill="#64748b">E[#tokens] = (1 - alpha^(gamma+1)) / (1 - alpha)  ——  上界 = 1/(1-alpha) = 5.0</text>
<rect x="134" y="100" width="212" height="34" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="240.0" y="121.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="white" font-weight="bold">E[#tokens]</text>
<rect x="354" y="100" width="212" height="34" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="460.0" y="121.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="white" font-weight="bold">几何和 Sum_k=0^g a^k(校验)</text>
<rect x="574" y="100" width="212" height="34" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="680.0" y="121.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="white" font-weight="bold">上界 1/(1-a)</text>
<rect x="34" y="144" width="90" height="44" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="79.0" y="171.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#64748b">gamma=1</text>
<rect x="134" y="144" width="212" height="44" fill="none" stroke="#e2e8f0"/>
<text x="240.0" y="171.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#374151" >1.8</text>
<rect x="354" y="144" width="212" height="44" fill="none" stroke="#e2e8f0"/>
<text x="460.0" y="171.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#374151" >1.8</text>
<rect x="574" y="144" width="212" height="44" fill="none" stroke="#e2e8f0"/>
<text x="680.0" y="171.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#374151" >5.0</text>
<rect x="34" y="196" width="90" height="44" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="79.0" y="223.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#64748b">gamma=3</text>
<rect x="134" y="196" width="212" height="44" fill="none" stroke="#e2e8f0"/>
<text x="240.0" y="223.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#374151" >2.952</text>
<rect x="354" y="196" width="212" height="44" fill="none" stroke="#e2e8f0"/>
<text x="460.0" y="223.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#374151" >2.952</text>
<rect x="574" y="196" width="212" height="44" fill="none" stroke="#e2e8f0"/>
<text x="680.0" y="223.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#374151" >5.0</text>
<rect x="34" y="248" width="90" height="44" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="79.0" y="275.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#b45309">gamma=5</text>
<rect x="134" y="248" width="212" height="44" fill="#fffbeb" stroke="#e2e8f0"/>
<text x="240.0" y="275.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#b45309" font-weight="bold" >3.689</text>
<rect x="354" y="248" width="212" height="44" fill="#fffbeb" stroke="#e2e8f0"/>
<text x="460.0" y="275.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#374151" >3.689</text>
<rect x="574" y="248" width="212" height="44" fill="#fffbeb" stroke="#e2e8f0"/>
<text x="680.0" y="275.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#374151" >5.0</text>
<rect x="34" y="300" width="90" height="44" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="79.0" y="327.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#b45309">gamma=10</text>
<rect x="134" y="300" width="212" height="44" fill="#fffbeb" stroke="#e2e8f0"/>
<text x="240.0" y="327.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#b45309" font-weight="bold" >4.571</text>
<rect x="354" y="300" width="212" height="44" fill="#fffbeb" stroke="#e2e8f0"/>
<text x="460.0" y="327.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#374151" >4.571</text>
<rect x="574" y="300" width="212" height="44" fill="#fffbeb" stroke="#e2e8f0"/>
<text x="680.0" y="327.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#374151" >5.0</text>
<text x="34" y="378" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">gamma=5 -&gt; 3.689 个 token;gamma=10 -&gt; 4.571 —— 但上界恒为 5.0,永远无法达到</text>
<text x="34" y="400" font-family="sans-serif" font-size="11" fill="#64748b">gamma 从 5 加到 10(翻倍),收益仅从 3.689 涨到 4.571 —— 几何级数饱和,越往后猜得越不划算</text>
</svg>