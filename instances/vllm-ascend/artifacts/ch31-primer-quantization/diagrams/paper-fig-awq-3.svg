<text x="227.7" y="195.6" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">context 200 token</text>
<text x="240.0" y="460" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">对端上交互式生成：单步生成比处理提示词慢得多</text>
<text x="696.0" y="126" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">(b) 生成阶段被访存卡死，算术强度极低</text>
