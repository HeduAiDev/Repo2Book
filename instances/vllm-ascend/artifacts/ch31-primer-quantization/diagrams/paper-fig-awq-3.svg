<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1392 590">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker></defs>
<rect width="1392" height="590" fill="white"/>
<text x="40" y="34" font-family="sans-serif" font-size="15.5" fill="#1e40af"><tspan font-weight="bold">为什么 AWQ/GPTQ 都选权重-only(W4A16)：生成阶段是访存瓶颈，权重访存</tspan><tspan font-weight="normal">量</tspan><tspan font-weight="bold">又远大于激活</tspan></text>
<text x="40" y="56" font-family="sans-serif" font-size="12" fill="#64748b">重绘自 arXiv:2306.00978 Fig.3（Llama-2-7B / RTX 4090）</text>
<text x="240.0" y="126" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">(a) 生成阶段远慢于 context 阶段</text>
<path d="M240.0,310 L240.00,230.00 A80,80 0 1 1 224.39,231.54 Z" fill="#ef4444" stroke="white" stroke-width="2"/>
<path d="M240.0,310 L224.39,231.54 A80,80 0 0 1 240.00,230.00 Z" fill="#64748b" stroke="white" stroke-width="2"/>
