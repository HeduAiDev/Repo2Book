<line x1="562.0" y1="369.3" x2="642" y2="214" stroke="#047857" stroke-width="1" stroke-dasharray="2,2"/>
<text x="648" y="198" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#0f172a">生成阶段（访存瓶颈）</text>
<text x="648" y="216" font-family="sans-serif" font-size="10" fill="#047857">W4A16：算术强度 4 → 4 TFLOPS</text>
<text x="648" y="234" font-family="sans-serif" font-size="10" fill="#b91c1c">W16A16：算术强度 1 → 1 TFLOPS</text>
<text x="648" y="256" font-family="sans-serif" font-size="10" fill="#64748b">同一条访存斜率线上，权重变 4 bit 直接把峰值抬高 4×</text>
<text x="696.0" y="460" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">context 阶段算术强度 ≥165，已在算力打满的平台段</text>
<text x="1152.0" y="126" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">(c) 权重访存量远大于激活</text>
