<text x="40" y="546" font-family="sans-serif" font-size="11" fill="#64748b">(a)(b) 说明在端上交互式生成里，逐 token 生成远慢于处理提示词、且被访存带宽卡死——W4A16 把峰值算力从 1 抬到 4 TFLOPS；</text>
<text x="40" y="564" font-family="sans-serif" font-size="11" fill="#64748b">(c) 进一步给出硬件账本：权重访存量比激活大 79～1700 倍，只压缩权重(权重-only)已经能吃掉绝大部分访存开销。</text>
