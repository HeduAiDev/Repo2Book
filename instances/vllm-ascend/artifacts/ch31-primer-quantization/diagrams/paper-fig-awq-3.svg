<text x="250.78188543625166" y="431.47031993394165" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">生成 20 token</text>
<line x1="232.2" y1="230.4" x2="227.7" y2="185.6" stroke="#334155" stroke-width="1.2"/>
