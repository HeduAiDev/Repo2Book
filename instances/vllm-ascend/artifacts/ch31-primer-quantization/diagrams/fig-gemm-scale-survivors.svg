<text x="50" y="588" font-family="sans-serif" font-size="12.5" fill="#475569">绿 = scale 存活的外维（T 行 / C_o 列，可在 GEMM 外还原）；红 = 收缩维 C_i，求和后通道身份消失，per-channel scale 拆不回来。</text>
