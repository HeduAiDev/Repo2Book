<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 372">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker></defs>
<rect width="850" height="372" fill="white"/>
<text x="30" y="30" font-family="sans-serif" font-size="16" fill="#1e40af"><tspan font-weight="bold">per-tensor </tspan><tspan font-weight="normal">量</tspan><tspan font-weight="bold">化：outlier 撑大 absmax，非 outlier 通道有效级数塌缩</tspan></text>
<text x="30" y="50" font-family="sans-serif" font-size="12" fill="#64748b">有效级数 = 2^8 · m_i / m（matrix absmax m=10.0，INT8 满量程 = 256 级）</text>
<rect x="160" y="100" width="212" height="38" rx="3" fill="#64748b" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="266.0" y="123.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">通道 absmax m_i</text>
<rect x="380" y="100" width="212" height="38" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="486.0" y="117.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">有效级数</text>
<text x="486.0" y="133.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">（基准场景）</text>
<rect x="600" y="100" width="212" height="38" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="706.0" y="117.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">有效级数</text>
<text x="706.0" y="133.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">（125× 极端 outlier）</text>
