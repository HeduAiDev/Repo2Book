<text x="30" y="330" font-family="sans-serif" font-size="11" fill="#64748b">红=有效级数被压到远低于 256（非 outlier 通道）；绿=outlier 通道独占满量程 256 级。</text>
<text x="30" y="346" font-family="sans-serif" font-size="11" fill="#64748b">极端场景(125× outlier)下最差非 outlier 通道有效级数仅 1.536——不足 2 档，8-bit 名存实亡。</text>
