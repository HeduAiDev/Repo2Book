<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 660">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#b91c1c"/></marker><marker id="al" viewBox="0 0 10 6" refX="1" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M10,0 L0,3 L10,6 Z" fill="#b91c1c"/></marker></defs>
<rect width="1080" height="660" fill="white"/>
<text x="60" y="46" font-family="sans-serif" font-size="25" fill="#1e40af"><tspan font-weight="bold">险的不是位宽，是刻度被偷</tspan></text>
<text x="60" y="76" font-family="sans-serif" font-size="14.5" fill="#475569">per-tensor 量化：一个 outlier 把 absmax 撑到头，邻居通道的可用刻度被挤成一条缝</text>
<rect x="60" y="100" width="960" height="40" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
<text x="78" y="125" font-family="sans-serif" font-size="13.5" fill="#334155">三通道 absmax  m_i = [0.15, 0.2, 10.0]：一个 outlier(10.0，极端 25.0) 钉死共用刻度 m　→　有效级数  ℓ_i = 2^8 · m_i / m</text>
<text x="282" y="215.0" text-anchor="end" font-family="sans-serif" font-size="14" fill="#374151"><tspan font-weight="bold">以为：每通道独立</tspan><tspan font-weight="normal">量</tspan><tspan font-weight="bold">化</tspan></text>
<rect x="300" y="185" width="660" height="50" rx="6" fill="#10b981" stroke="#047857" stroke-width="1.5"/>
<text x="944" y="216.0" text-anchor="end" font-family="sans-serif" font-size="17" fill="white" font-weight="bold">256 级</text>
<text x="282" y="315.0" text-anchor="end" font-family="sans-serif" font-size="14" fill="#374151"><tspan font-weight="bold">其实 · per-tensor 基准 m=10</tspan></text>
<rect x="300" y="285" width="660" height="50" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 4"/>
<rect x="300" y="285" width="9.90" height="50" rx="2" fill="#f59e0b"/>
<text x="325.9" y="315.0" font-family="sans-serif" font-size="15" fill="#f59e0b" font-weight="bold">3.84 级</text>
<text x="325.9" y="332.0" font-family="sans-serif" font-size="11.5" fill="#94a3b8">可用刻度（其余被偷）</text>
<text x="282" y="415.0" text-anchor="end" font-family="sans-serif" font-size="14" fill="#374151"><tspan font-weight="bold">其实 · per-tensor 极端 m=25</tspan></text>
<rect x="300" y="385" width="660" height="50" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 4"/>
<rect x="300" y="385" width="3.96" height="50" rx="2" fill="#ef4444"/>
<text x="320.0" y="415.0" font-family="sans-serif" font-size="15" fill="#ef4444" font-weight="bold">1.536 级</text>
<text x="320.0" y="432.0" font-family="sans-serif" font-size="11.5" fill="#94a3b8">可用刻度（其余被偷）</text>
<line x1="300" y1="175" x2="300" y2="445" stroke="#94a3b8" stroke-width="1.2"/>
<text x="296" y="168" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">0</text>
<line x1="960" y1="175" x2="960" y2="445" stroke="#0f172a" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="960" y="168" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">满刻度 256</text>
<line x1="304.0" y1="480" x2="960" y2="480" stroke="#b91c1c" stroke-width="2" marker-start="url(#al)" marker-end="url(#ar)"/>
<text x="632.0" y="468" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#b91c1c"><tspan font-weight="bold">×167 落差：256 → 1.536 级，可用刻度被 outlier 偷走 167 倍</tspan></text>
<text x="60" y="560" font-family="sans-serif" font-size="13" fill="#475569">绿 = 以为每通道独享的满刻度 256 级；橙/红 = per-tensor 下邻居通道实得的可用刻度。</text>
<text x="60" y="584" font-family="sans-serif" font-size="13" fill="#475569">极端 outlier(25×) 下通道 0 只剩 1.536 级——不足 2 档，8-bit 名存实亡。险的不是位宽，是 per-tensor 把刻度让给了 outlier。</text>
<text x="60" y="612" font-family="sans-serif" font-size="11.5" fill="#94a3b8">公式：SmoothQuant §3（arXiv:2211.10438）有效量化级数 ℓ_i = 2^N·m_i/m；256×0.15/10.0=3.84，256×0.15/25.0=1.536。</text>
</svg>