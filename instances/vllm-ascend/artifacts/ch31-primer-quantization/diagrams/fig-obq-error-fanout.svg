<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560">
<defs><marker id="o" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="8" markerHeight="6" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#ea580c"/></marker></defs>
<rect width="1000" height="560" fill="white"/>
<text x="50" y="44" font-family="sans-serif" font-size="22" fill="#1e40af"><tspan font-weight="bold">二阶补偿的方向 = H⁻¹ 第 q 列：锁定权重的取整误差按这一列扇给邻居</tspan></text>
<text x="50" y="72" font-family="sans-serif" font-size="14" fill="#475569">不是逐个取整，而是让整层输出尽量不变——先量化权重的误差有方向地摊派出去</text>
<text x="500" y="140" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#ea580c" font-weight="bold">扇出比例来自 H_F⁻¹ 第 1 列（q=1）</text>
<rect x="402.0" y="200" width="196" height="100" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
<text x="500" y="226.0" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#334155"><tspan font-weight="bold">w_1 = -0.812</tspan></text>
<text x="500" y="250.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#dc2626">量化 → -0.6693</text>
<text x="500" y="274.0" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#dc2626"><tspan font-weight="bold">取整误差 e_q = -0.1427</tspan></text>
<rect x="107.0" y="200" width="196" height="100" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
<text x="205" y="238.0" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#334155"><tspan font-weight="bold">w_0 = -0.6</tspan></text>
<text x="205" y="262.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#64748b">（尚未量化）</text>
<rect x="697.0" y="200" width="196" height="100" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
<text x="795" y="238.0" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#334155"><tspan font-weight="bold">w_2 = 0.192</tspan></text>
<text x="795" y="262.0" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#64748b">（尚未量化）</text>
<line x1="398.0" y1="250.0" x2="309.0" y2="250.0" stroke="#ea580c" stroke-width="2.6" marker-end="url(#o)"/>
<text x="352.5" y="238.0" text-anchor="middle" font-family="sans-serif" font-size="14.5" fill="#ea580c" font-weight="bold">δ = -0.0297</text>
<line x1="602.0" y1="250.0" x2="691.0" y2="250.0" stroke="#ea580c" stroke-width="2.6" marker-end="url(#o)"/>
<text x="647.5" y="238.0" text-anchor="middle" font-family="sans-serif" font-size="14.5" fill="#ea580c" font-weight="bold">δ = -0.0955</text>
<text x="205" y="330" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#16a34a" font-weight="bold">补偿后 → -0.6297</text>
<text x="500" y="330" text-anchor="middle" font-family="sans-serif" font-size="13.5" fill="#64748b">自身 δ = 0（已锁定）</text>
<text x="795" y="330" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#16a34a" font-weight="bold">补偿后 → 0.0965</text>
<text x="500" y="400" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#ea580c" font-weight="bold">δ_F = [-0.0297, 0.0, -0.0955]   （→ w0 / 自身 / w2）</text>
<text x="500" y="438" text-anchor="middle" font-family="sans-serif" font-size="14.5" fill="#334155">δ_F = -( (w_q - quant(w_q)) / [H_F⁻¹]_qq ) · (H_F⁻¹)_{:,q}</text>
<text x="500" y="460" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#94a3b8">OBQ §3 Eq.2，arXiv:2210.17323</text>
<text x="50" y="508" font-family="sans-serif" font-size="13" fill="#475569">w1 锁定到量化网格（-0.6693，取整误差 -0.1427）后，误差不是丢掉，而是按 H_F⁻¹ 第 1 列的比例扇给两个尚未量化的邻居：</text>
<text x="50" y="530" font-family="sans-serif" font-size="13" fill="#475569">w0 被推到 -0.6297、w2 被推到 0.0965，让整层输出尽量不变——方向由 Hessian 决定，不是逐权重就近取整。</text>
</svg>