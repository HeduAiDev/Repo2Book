<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 670" font-family="sans-serif">
<defs><marker id="ar" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#64748b"/></marker></defs>
<rect width="1280" height="670" fill="white"/>
<text x="640.0" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#1e293b">npu_kv_rmsnorm_rope_cache：一个算子融合 RMSNorm + RoPE + 写分页 cache</text>
<text x="640.0" y="64" text-anchor="middle" font-size="14" fill="#64748b">decode 与 prefill 调同一个算子，只靠返回值的位置（前两个 / 后两个）区分用途</text>
<rect x="39.0" y="100" width="226" height="56" rx="9" fill="#f1f5f9" stroke="#334155" stroke-width="1.6"/>
<text x="152.0" y="114.76" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">kv_no_split</text>
<text x="152.0" y="132.08" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">[B,N,S=1,Lkv+R=576]</text>
<text x="152.0" y="146.74" text-anchor="middle" font-size="11" font-weight="normal" fill="#1e293b">(512+64)</text>
<rect x="283.0" y="100" width="226" height="56" rx="9" fill="#f1f5f9" stroke="#334155" stroke-width="1.6"/>
<text x="396.0" y="123.84" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#334155">kv_a_layernorm.weight</text>
<text x="396.0" y="140.08" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">RMSNorm 权重</text>
<rect x="527.0" y="100" width="226" height="56" rx="9" fill="#f1f5f9" stroke="#334155" stroke-width="1.6"/>
<text x="640.0" y="123.76" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">cos, sin</text>
<text x="640.0" y="140.08" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">RoPE 旋转角</text>
<rect x="771.0" y="100" width="226" height="56" rx="9" fill="#f1f5f9" stroke="#334155" stroke-width="1.6"/>
<text x="884.0" y="123.76" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">slots</text>
<text x="884.0" y="140.08" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">写 cache 的槽位</text>
<rect x="1015.0" y="100" width="226" height="56" rx="9" fill="#f1f5f9" stroke="#334155" stroke-width="1.6"/>
<text x="1128.0" y="123.76" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">kv_cache[0]/[1]</text>
<text x="1128.0" y="140.08" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">分页 KV 物理块</text>
<line x1="152.0" y1="156" x2="152.0" y2="196" stroke="#94a3b8" stroke-width="1.6"/>
<line x1="396.0" y1="156" x2="396.0" y2="196" stroke="#94a3b8" stroke-width="1.6"/>
<line x1="640.0" y1="156" x2="640.0" y2="196" stroke="#94a3b8" stroke-width="1.6"/>
<line x1="884.0" y1="156" x2="884.0" y2="196" stroke="#94a3b8" stroke-width="1.6"/>
<line x1="1128.0" y1="156" x2="1128.0" y2="196" stroke="#94a3b8" stroke-width="1.6"/>
<line x1="152.0" y1="196" x2="1128.0" y2="196" stroke="#94a3b8" stroke-width="1.6"/>
<line x1="640.0" y1="196" x2="640.0" y2="220" stroke="#7c3aed" stroke-width="2" marker-end="url(#ar)"/>
<rect x="150.0" y="220" width="980" height="150" rx="9" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
<text x="640.0" y="250" text-anchor="middle" font-size="17" font-weight="bold" fill="#7c3aed">npu_kv_rmsnorm_rope_cache</text>
<rect x="168.0" y="276" width="300" height="68" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/>
<text x="318.0" y="305.68" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#7c3aed">① RMSNorm</text>
<text x="318.0" y="321.66" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#1e293b">对 kv_c 做归一化（kv_a_layernorm）</text>
<rect x="490.0" y="276" width="300" height="68" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/>
<text x="640.0" y="305.68" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#7c3aed">② RoPE</text>
<text x="640.0" y="321.66" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#1e293b">对 k_pe 施加旋转位置编码（cos/sin）</text>
<rect x="812.0" y="276" width="300" height="68" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/>
<text x="962.0" y="305.68" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#7c3aed">③ 写分页 cache</text>
<text x="962.0" y="321.66" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#1e293b">按 slots 写入 kv_cache（cache_mode='PA'/'PA_NZ'）</text>
<line x1="468.0" y1="310" x2="490.0" y2="310" stroke="#7c3aed" stroke-width="2" marker-end="url(#ar)"/>
<line x1="790.0" y1="310" x2="812.0" y2="310" stroke="#7c3aed" stroke-width="2" marker-end="url(#ar)"/>
<text x="640.0" y="356" text-anchor="middle" font-size="12.5" fill="#7c3aed">算子共返回 4 个值：decode 只取前两个，prefill 传 is_output_kv=True 后取后两个</text>
<line x1="640.0" y1="370" x2="640.0" y2="416" stroke="#7c3aed" stroke-width="2" marker-end="url(#ar)"/>
<rect x="236.0" y="416" width="190" height="44" rx="9" fill="#f0fdf4" stroke="#15803d" stroke-width="1.6"/>
<text x="331.0" y="443.1" text-anchor="middle" font-size="15" font-weight="bold" fill="#15803d">① k_pe</text>
<rect x="442.0" y="416" width="190" height="44" rx="9" fill="#f0fdf4" stroke="#15803d" stroke-width="1.6"/>
<text x="537.0" y="443.1" text-anchor="middle" font-size="15" font-weight="bold" fill="#15803d">② k_nope</text>
<rect x="648.0" y="416" width="190" height="44" rx="9" fill="#fff7ed" stroke="#b45309" stroke-width="1.6"/>
<text x="743.0" y="443.1" text-anchor="middle" font-size="15" font-weight="bold" fill="#b45309">③ k_pe</text>
<rect x="854.0" y="416" width="190" height="44" rx="9" fill="#fff7ed" stroke="#b45309" stroke-width="1.6"/>
<text x="949.0" y="443.1" text-anchor="middle" font-size="15" font-weight="bold" fill="#b45309">④ k_nope</text>
<line x1="331.0" y1="460" x2="434.0" y2="490" stroke="#15803d" stroke-width="1.6"/>
<line x1="537.0" y1="460" x2="434.0" y2="490" stroke="#15803d" stroke-width="1.6"/>
<line x1="743.0" y1="460" x2="846.0" y2="490" stroke="#b45309" stroke-width="1.6"/>
<line x1="949.0" y1="460" x2="846.0" y2="490" stroke="#b45309" stroke-width="1.6"/>
<line x1="434.0" y1="490" x2="434.0" y2="510" stroke="#15803d" stroke-width="2" marker-end="url(#ar)"/>
<line x1="846.0" y1="490" x2="846.0" y2="510" stroke="#b45309" stroke-width="2" marker-end="url(#ar)"/>
<rect x="224.0" y="514" width="420" height="78" rx="9" fill="#f0fdf4" stroke="#15803d" stroke-width="1.6"/>
<text x="434.0" y="539.1" text-anchor="middle" font-size="15" font-weight="bold" fill="#15803d">decode：取第 1/2 个返回值</text>
<text x="434.0" y="557.08" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">cache_mode='PA'，无 is_output_kv 标志</text>
<text x="434.0" y="573.75" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#1e293b">k_nope=写进 cache 的隐向量，直接当 K=V 做 MQA</text>
<rect x="636.0" y="514" width="420" height="78" rx="9" fill="#fff7ed" stroke="#b45309" stroke-width="1.6"/>
<text x="846.0" y="539.43" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#b45309">prefill：is_output_kv=True，取第 3/4 个返回值</text>
<text x="846.0" y="557.08" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">同一算子、多传一个标志</text>
<text x="846.0" y="573.75" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#1e293b">k_nope=未量化输出 KV，交给 kv_b_proj 显式解压</text>
<text x="640.0" y="626" text-anchor="middle" font-size="12.5" fill="#64748b">同一个 npu_kv_rmsnorm_rope_cache：exec_kv_decode 不传 is_output_kv（默认取前两个返回值），exec_kv_prefill 传 is_output_kv=True（取后两个）</text>
</svg>