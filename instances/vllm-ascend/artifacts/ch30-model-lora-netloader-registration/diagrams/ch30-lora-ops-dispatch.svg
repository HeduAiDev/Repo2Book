<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 900">
<defs><marker id="ap" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#7c3aed"/></marker><marker id="ag" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#94a3b8"/></marker><marker id="ah" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#16a34a"/></marker></defs>
<rect width="1120" height="900" fill="white"/>
<text x="560.0" y="42" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#1e293b">PunicaWrapperNPU：构造期二选一绑算子，运行期 shrink→expand 落地</text>
<text x="560.0" y="70" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#64748b">绑定一次、处处复用——add_lora_linear 的调用点不含任何 device / rank 判断</text>
<rect x="100.0" y="84" width="400" height="52" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
<text x="300.0" y="115.5" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold" fill="#5b21b6">PunicaWrapperNPU.__init__(vllm_config)</text>
<polygon points="300,146 495,224 300,302 105,224" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="300" y="219.0" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#92400e">device == 310P(310)</text>
<text x="300" y="239.0" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#92400e">或 max_lora_rank &gt;= 128 ?</text>
<rect x="100.0" y="344" width="400" height="86" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
<text x="300.0" y="372.5" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#5b21b6">绑 vllm_ascend.lora.lora_ops</text>
<text x="300.0" y="392.5" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#5b21b6">→ torch.ops._C_ascend.*（NPU kernel）</text>
<text x="300.0" y="412.5" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#5b21b6">假：服务小 rank（如 r=16）时省 128×</text>
<rect x="700" y="310" width="380" height="70" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="890.0" y="340.5" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#475569">绑 vllm.lora.ops.torch_ops（PyTorch 通用）</text>
<text x="890.0" y="359.5" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#475569">310P / rank≥128 保底，r=128 时仅省 16×</text>
<rect x="100.0" y="452" width="400" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="300.0" y="477.5" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#166534">6 个算子绑成实例属性：</text>
<text x="300.0" y="497.5" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#166534">self.bgmv_* / self.sgmv_*</text>
<rect x="100.0" y="552" width="400" height="48" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
<text x="300.0" y="581.0" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#5b21b6">add_lora_linear(y, x, lora_a_stacked, ...)</text>
<rect x="100.0" y="624" width="400" height="44" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="300.0" y="651.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#475569">开一个 r 维 buffer</text>
<rect x="80.0" y="692" width="440" height="74" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
<text x="300.0" y="724.5" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#5b21b6">add_shrink：is_prefill? sgmv_shrink : bgmv_shrink</text>
<text x="300.0" y="742.5" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#5b21b6">x · A  →  降到 r 维，写入 buffer</text>
<rect x="80.0" y="800" width="440" height="74" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
<text x="300.0" y="832.5" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#5b21b6">add_expand：is_prefill? sgmv_expand : bgmv_expand</text>
<text x="300.0" y="850.5" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#5b21b6">buffer · B · s  →  升回 o 维，累加进 y</text>
<rect x="700" y="692" width="380" height="74" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="890.0" y="724.5" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#075985">r = 16：两步 262144 FLOPs</text>
<text x="890.0" y="743.5" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#075985">满秩直算 33554432 FLOPs  →  省 128×</text>
<rect x="700" y="800" width="380" height="74" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="890.0" y="832.5" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#075985">r = 128：两步 2097152 FLOPs</text>
<text x="890.0" y="851.5" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#075985">满秩直算 33554432 FLOPs  →  省 16×</text>
<line x1="300" y1="136" x2="300" y2="146" stroke="#7c3aed" stroke-width="2" marker-end="url(#ap)"/>
<line x1="300" y1="302" x2="300" y2="344" stroke="#7c3aed" stroke-width="2" marker-end="url(#ap)"/>
<text x="334" y="326.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#5b21b6">假</text>
<line x1="495" y1="224" x2="694" y2="224" stroke="#94a3b8" stroke-width="2" marker-end="url(#ag)"/>
<line x1="694" y1="224" x2="694" y2="310" stroke="#94a3b8" stroke-width="2" marker-end="url(#ag)"/>
<text x="597.5" y="214.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#475569">真（任一成立）</text>
<line x1="300" y1="430" x2="300" y2="452" stroke="#7c3aed" stroke-width="2" marker-end="url(#ap)"/>
<line x1="890.0" y1="380" x2="890.0" y2="482" stroke="#94a3b8" stroke-width="2"/>
<line x1="890.0" y1="482" x2="506.0" y2="482" stroke="#94a3b8" stroke-width="2" marker-end="url(#ag)"/>
<line x1="300" y1="512" x2="300" y2="552" stroke="#16a34a" stroke-width="2" marker-end="url(#ah)"/>
<line x1="300" y1="600" x2="300" y2="624" stroke="#7c3aed" stroke-width="2" marker-end="url(#ap)"/>
<line x1="300" y1="668" x2="300" y2="692" stroke="#7c3aed" stroke-width="2" marker-end="url(#ap)"/>
<line x1="300" y1="766" x2="300" y2="800" stroke="#7c3aed" stroke-width="2" marker-end="url(#ap)"/>
</svg>