<text x="515.0" y="280.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#1d4ed8">Emb(t_i+2)</text>
<line x1="515.0" y1="254" x2="515.0" y2="212" stroke="#2563eb" stroke-width="1.5" marker-end="url(#b)"/>
<line x1="590" y1="181.0" x2="664" y2="181.0" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
<text x="627.0" y="173.0" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#334155">h^2</text>
<rect x="664" y="150" width="150" height="62" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
