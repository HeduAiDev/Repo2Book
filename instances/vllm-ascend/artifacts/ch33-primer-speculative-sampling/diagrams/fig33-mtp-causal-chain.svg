<text x="739.0" y="197.0" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6d28d9">valid_len=3</text>
<rect x="675.0" y="254" width="128" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="739.0" y="280.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#1d4ed8">Emb(t_i+3)</text>
<line x1="739.0" y1="254" x2="739.0" y2="212" stroke="#2563eb" stroke-width="1.5" marker-end="url(#b)"/>
<line x1="814" y1="181.0" x2="854" y2="181.0" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
<text x="834.0" y="173.0" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#334155">h^3</text>
<text x="46" y="330" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">有效预测窗口每深一层收缩一个位置(T-k)</text>
<rect x="46" y="344" width="120" height="40" rx="6" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
<text x="106.0" y="361" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155">T=6</text>
<text x="106.0" y="376" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#334155">输入序列</text>
<line x1="170" y1="364" x2="192" y2="364" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="196" y="344" width="120" height="40" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="256.0" y="361" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#b45309">T-1=5</text>
<text x="256.0" y="376" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#b45309">深度1有效窗口</text>
<line x1="320" y1="364" x2="342" y2="364" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="346" y="344" width="120" height="40" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="406.0" y="361" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#b45309">T-2=4</text>
<text x="406.0" y="376" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#b45309">深度2有效窗口</text>
<line x1="470" y1="364" x2="492" y2="364" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="496" y="344" width="120" height="40" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="556.0" y="361" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#b45309">T-3=3</text>
<text x="556.0" y="376" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#b45309">深度3有效窗口</text>
<text x="46" y="416" font-family="sans-serif" font-size="11" fill="#64748b">紫=深度 Transformer block(串行因果链,h^k 只能等 h^k-1 算完才能算);蓝=每深度独有的 token embedding 输入;embedding 层与输出头跨深度共享</text>
</svg>