<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 436">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker><marker id="b" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#2563eb"/></marker></defs>
<rect width="860" height="436" fill="white"/>
<text x="46" y="34" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e40af">MTP 模块因果链:深度间隐状态串行传递,有效窗口逐层收缩</text>
<text x="46" y="54" font-family="sans-serif" font-size="12" fill="#64748b">深度 k:TRM_k(RMSNorm(h^{k-1}), RMSNorm(Emb(t_{i+k}))) -&gt; h^k —— T=6(输入序列长度)</text>
<rect x="46" y="150" width="96" height="62" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
<text x="94.0" y="179.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">h^0</text>
<text x="94.0" y="195.0" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#64748b">(主模型输出)</text>
<line x1="142" y1="181.0" x2="216" y2="181.0" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
<text x="179.0" y="173.0" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#334155">h^0</text>
<rect x="216" y="150" width="150" height="62" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="291.0" y="179.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#5b21b6">深度 1: TRM_1</text>
<text x="291.0" y="197.0" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6d28d9">valid_len=5</text>
