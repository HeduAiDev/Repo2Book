<text x="291.0" y="280.0" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#1d4ed8">Emb(t_i+1)</text>
<line x1="291.0" y1="254" x2="291.0" y2="212" stroke="#2563eb" stroke-width="1.5" marker-end="url(#b)"/>
<line x1="366" y1="181.0" x2="440" y2="181.0" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
<text x="403.0" y="173.0" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#334155">h^1</text>
<rect x="440" y="150" width="150" height="62" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="515.0" y="179.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#5b21b6">深度 2: TRM_2</text>
