<text x="46" y="368" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#92400e">块3 汉明距 0(与 query 指纹几乎重合)自然入 top-2;块0 距 5、块5 距 4 本会被淘汰</text>
<text x="46" y="388" font-family="sans-serif" font-size="11.5" fill="#92400e">但 must_select=[0,-1] 把 sink 首块与 recent 末块强制拉回 —— 最终入选 = 汉明 top-2 ∪ 强制块</text>
<text x="46" y="406" font-family="sans-serif" font-size="11.5" fill="#92400e">选块只需 XOR + popcount 位运算(每块指纹 1 字节)替代逐维浮点内积,近似检索的粗糙不会漏掉关键块</text>
