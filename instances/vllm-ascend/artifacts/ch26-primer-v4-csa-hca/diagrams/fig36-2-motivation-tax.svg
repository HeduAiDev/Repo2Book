<text x="306.0" y="164.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#374151" >16.0</text>
<text x="446.0" y="164.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#374151" >64.0</text>
<text x="586.0" y="164.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#374151" >256.0</text>
