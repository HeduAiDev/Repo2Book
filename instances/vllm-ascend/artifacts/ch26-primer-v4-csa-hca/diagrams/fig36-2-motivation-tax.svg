<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 506">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker></defs>
<rect width="830" height="506" fill="white"/>
<text x="30" y="30" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e40af">1M 上下文的账本:dense 随 L 线性膨胀,CSA 核注意力被 top-k 钉成常数</text>
<text x="30" y="50" font-family="sans-serif" font-size="12" fill="#64748b">head_dim=1, m=4, k=2, n_win=1(缩小参数便于心算,真实量级见数值推演节);dense 单 token FLOPs 代理 = L</text>
<rect x="240" y="100" width="132" height="30" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="306.0" y="119.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="white" font-weight="bold">L=16</text>
<rect x="380" y="100" width="132" height="30" rx="3" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="446.0" y="119.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="white" font-weight="bold">L=64</text>
