<text x="446.0" y="302.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#047857" font-weight="bold" >3</text>
<rect x="520" y="278" width="132" height="38" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
<text x="586.0" y="302.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#047857" font-weight="bold" >3</text>
<rect x="660" y="278" width="132" height="38" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
<text x="726.0" y="302.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#047857" font-weight="bold" >3</text>
<text x="224" y="347.0" text-anchor="end" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#374151">CSA 总 FLOPs</text>
<text x="306.0" y="348.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#374151" >7.0</text>
<text x="446.0" y="348.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#374151" >19.0</text>
<text x="586.0" y="348.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#374151" >67.0</text>
<text x="726.0" y="348.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#374151" >259.0</text>
<rect x="30" y="392" width="770" height="66" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="46" y="414" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#92400e">L=1024 时:dense 单 token 需 1024 次点积代理、存 1024 条 KV;CSA 核注意力仍只 3 次(k=2+n_win=1)、KV 降到 256=L/4</text>
<text x="46" y="434" font-family="sans-serif" font-size="11.5" fill="#92400e">CSA 总 FLOPs(259.0)仍含一项 L/4 的 indexer 打分开销 —— 核注意力那本账被钉死,但候选打分仍要扫 L/m 条</text>
<text x="46" y="452" font-family="sans-serif" font-size="11.5" fill="#92400e">绿框(核注意力 FLOPs)横向恒为 3,红框(dense FLOPs)与 L 同步翻倍 —— 这是必须在『存多少 KV』与『算多少内积』两处同时下手的动机</text>
</svg>