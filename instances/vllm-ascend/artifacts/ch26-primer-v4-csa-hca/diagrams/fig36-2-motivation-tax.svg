<rect x="380" y="186" width="132" height="38" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="446.0" y="210.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#b91c1c" font-weight="bold" >64.0</text>
<rect x="520" y="186" width="132" height="38" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="586.0" y="210.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#b91c1c" font-weight="bold" >256.0</text>
<rect x="660" y="186" width="132" height="38" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="726.0" y="210.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#b91c1c" font-weight="bold" >1024.0</text>
<text x="224" y="255.0" text-anchor="end" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#374151">CSA KV 存量 (L/4)</text>
<text x="306.0" y="256.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#374151" >4.0</text>
<text x="446.0" y="256.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#374151" >16.0</text>
<text x="586.0" y="256.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#374151" >64.0</text>
<text x="726.0" y="256.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#374151" >256.0</text>
<text x="224" y="301.0" text-anchor="end" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#374151">CSA 核注意力 FLOPs</text>
