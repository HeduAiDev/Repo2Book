<text x="40" y="510" font-family="sans-serif" font-size="11.5" fill="#334155">(a) 树深度不一:budget 向高概率分支倾斜(上支展到深度 3,下支只展到深度 2)——对应本章「best-first 堆」构树过程。</text>
<text x="40" y="530" font-family="sans-serif" font-size="11.5" fill="#334155">(b) 验证沿树走两步(绿色路径,2 个投机节点匹配),第三步目标模型选中的 token 不在树的子节点中——产生 next bonus,树验证仍只需 target 一次前向。</text>
