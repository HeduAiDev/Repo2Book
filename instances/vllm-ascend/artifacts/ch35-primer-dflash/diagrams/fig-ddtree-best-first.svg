<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 408">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker></defs>
<rect width="1020" height="408" fill="white"/>
<text x="510.0" y="34" text-anchor="middle" font-family="sans-serif" font-size="15.5" font-weight="bold" fill="#0f172a">best-first 堆按前缀概率非增序弹出,预算 B=4 内构出可证明最优的草稿树</text>
<text x="510.0" y="58" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">弹出序:[1] -&gt; [1,1] -&gt; [2] -&gt; [1,1,1]——树 surrogate 累计 1.756,高于单轨迹链 1.356(约 30%)</text>
<rect x="46" y="130" width="190" height="88" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
<text x="141.0" y="156" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">pop 1</text>
<text x="141.0" y="180" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">[1]</text>
<text x="141.0" y="202" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">该前缀概率 0.6</text>
<text x="141.0" y="244" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2563eb">累计 surrogate = 0.6</text>
<line x1="236" y1="174.0" x2="292" y2="174.0" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="292" y="130" width="190" height="88" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
<text x="387.0" y="156" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">pop 2</text>
<text x="387.0" y="180" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">[1, 1]</text>
<text x="387.0" y="202" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">该前缀概率 0.42</text>
<text x="387.0" y="244" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2563eb">累计 surrogate = 1.02</text>
<line x1="482" y1="174.0" x2="538" y2="174.0" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="538" y="130" width="190" height="88" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
<text x="633.0" y="156" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">pop 3</text>
<text x="633.0" y="180" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">[2]</text>
<text x="633.0" y="202" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">该前缀概率 0.4</text>
<text x="633.0" y="244" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2563eb">累计 surrogate = 1.42</text>
<line x1="728" y1="174.0" x2="784" y2="174.0" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="784" y="130" width="190" height="88" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
<text x="879.0" y="156" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">pop 4</text>
<text x="879.0" y="180" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">[1, 1, 1]</text>
<text x="879.0" y="202" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">该前缀概率 0.336</text>
<text x="879.0" y="244" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#16a34a">累计 surrogate = 1.756</text>
<text x="46" y="288" font-family="sans-serif" font-size="11.5" fill="#334155">堆每次弹最高分前缀,推入同层下一 rank 的兄弟与下探一层 rank1 的孩子,二者得分都 &lt;= 已弹出前缀——弹出序即全局非增序。</text>
<text x="46" y="310" font-family="sans-serif" font-size="11.5" fill="#334155">与暴力枚举 top-4 前缀集合完全一致(best_first_matches_bruteforce=true)——验证仍是 target 一次前向(祖先-only 掩码)。</text>
<text x="46" y="332" font-family="sans-serif" font-size="11.5" fill="#334155">对比:vanilla 单轨迹只走 [1],[1,1],[1,1,1] 三步,累计 surrogate 仅 1.356——树验证多花的只是把预算铺成 4 个节点。</text>
</svg>