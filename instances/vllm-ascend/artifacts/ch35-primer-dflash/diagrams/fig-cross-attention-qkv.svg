<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620">
<defs><marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker><marker id="b" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#7c3aed"/></marker></defs>
<rect width="980" height="620" fill="white"/>
<text x="490.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="15.5" font-weight="bold" fill="#0f172a">Q 只出自 draft token,K/V 由 [target 上下文; draft token] 拼接——非因果打分</text>
<text x="490.0" y="52" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">num_ctx=3(target 上下文)、block_size=4(bonus+3 mask)——K/V 拼接后序列长 = 3+4 = 7</text>
<rect x="46" y="110" width="200" height="56" rx="8" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.6"/>
<text x="146.0" y="132" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e3a8a">H_t(target 上下文)</text>
<text x="146.0" y="150" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#1e40af">num_ctx = 3</text>
<rect x="306" y="110" width="200" height="56" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/>
<text x="406.0" y="132" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#4c1d95">H_d(draft token)</text>
<text x="406.0" y="150" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#5b21b6">block_size = 4(bonus+3 mask)</text>
<rect x="86" y="242" width="360" height="60" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
<text x="266.0" y="266" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#92400e">K/V = concat([H_t; H_d])</text>
<text x="266.0" y="286" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#92400e">序列长 = 3 + 4 = 7</text>
<line x1="146.0" y1="166" x2="186.8" y2="242" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="406.0" y1="166" x2="345.2" y2="242" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#b)"/>
<rect x="596" y="242" width="200" height="60" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/>
<text x="696" y="266" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#4c1d95">Q(仅 H_d 投影)</text>
<text x="696" y="286" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5b21b6">query 位数 = 4</text>
<line x1="476.0" y1="166" x2="636" y2="242" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#b)" stroke-dasharray="5,3"/>
<rect x="66" y="378" width="380" height="66" rx="8" fill="#e2e8f0" stroke="#334155" stroke-width="1.8"/>
<text x="256.0" y="404" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">非因果 softmax(Q x K^T)</text>
<text x="256.0" y="424" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">打分矩阵 4 x 7(query 4 行 x K/V 7 列)</text>
<line x1="266.0" y1="302" x2="180.0" y2="378" stroke="#d97706" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="696" y1="302" x2="351.0" y2="378" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#b)"/>
<text x="46" y="484" font-family="sans-serif" font-size="11.5" fill="#334155">扰动最后一个 mask 位(idx 3),bonus 位(idx 0)输出变化 ‖Δ‖=0.2788——非因果:后位能影响前位。</text>
<text x="46" y="504" font-family="sans-serif" font-size="11.5" fill="#334155">移除注入的 context K/V(3 列),输出变化 ‖Δ‖=1.0215——注入的 K/V 确实参与了注意力打分。</text>
</svg>