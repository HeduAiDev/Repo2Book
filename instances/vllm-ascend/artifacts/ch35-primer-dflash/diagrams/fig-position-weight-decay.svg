<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 752 620">
<rect width="752" height="620" fill="white"/>
<text x="376.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="15.5" font-weight="bold" fill="#0f172a">块内位置权重按 exp(-(k-1)/gamma) 指数衰减——早位置犯错的加权损失明显更高</text>
<text x="376.0" y="52" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">gamma=4:w_1=1.0(基准)到 w_4=0.4724(末位仅约首位 47%)</text>
<line x1="46" y1="348" x2="706" y2="348" stroke="#94a3b8" stroke-width="1.5"/>
<rect x="110.0" y="128.0" width="100" height="220.0" rx="6" fill="rgb(220,250,255)" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="160.0" y="118.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">1.0</text>
<text x="160.0" y="370" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#334155">k=1</text>
<rect x="254.0" y="176.664" width="100" height="171.336" rx="6" fill="rgb(186,216,255)" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="304.0" y="166.664" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">0.7788</text>
<text x="304.0" y="370" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#334155">k=2</text>
<rect x="398.0" y="214.57" width="100" height="133.43" rx="6" fill="rgb(152,182,255)" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="448.0" y="204.57" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">0.6065</text>
<text x="448.0" y="370" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#334155">k=3</text>
<rect x="542.0" y="244.072" width="100" height="103.928" rx="6" fill="rgb(118,148,255)" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="592.0" y="234.072" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">0.4724</text>
<text x="592.0" y="370" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#334155">k=4</text>
<text x="46" y="400" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">同幅误差:错在早位置 vs 错在晚位置的加权损失</text>
<rect x="46" y="414" width="300" height="84" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
<text x="196.0" y="444" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#991b1b">位置 1 犯错的加权损失</text>
<text x="196.0" y="472" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#b91c1c">3.4995</text>
<rect x="406" y="414" width="300" height="84" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
<text x="556.0" y="444" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#166534">位置 4 犯错的加权损失</text>
<text x="556.0" y="472" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#15803d">1.6531</text>
<text x="46" y="538" font-family="sans-serif" font-size="11.5" fill="#334155">早位置犯错代价约是晚位置的 2.1169 倍(3.4995 / 1.6531)——训练目标本身就编码「早位置更值钱」。</text>
<text x="46" y="558" font-family="sans-serif" font-size="11.5" fill="#334155">块扩散不是多轮迭代去噪,而是单次前向内的掩码填空 + 位置加权——与「并行=每位置同等重要」的直觉恰好相反。</text>
</svg>